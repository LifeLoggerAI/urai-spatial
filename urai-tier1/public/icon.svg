<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">URAI Spatial icon</title>
  <desc id="desc">A luminous cyan orb and orbit representing the URAI Spatial product.</desc>
  <defs>
    <radialGradient id="orb" cx="38%" cy="30%" r="72%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.16" stop-color="#c9ffff"/>
      <stop offset="0.46" stop-color="#67e8f9"/>
      <stop offset="0.76" stop-color="#2687c9"/>
      <stop offset="1" stop-color="#06111f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#020713"/>
  <ellipse cx="256" cy="274" rx="174" ry="92" fill="none" stroke="url(#ring)" stroke-width="18" transform="rotate(-18 256 274)" opacity="0.9"/>
  <circle cx="256" cy="248" r="112" fill="url(#orb)"/>
  <circle cx="219" cy="207" r="18" fill="#ffffff" opacity="0.88"/>
</svg>
