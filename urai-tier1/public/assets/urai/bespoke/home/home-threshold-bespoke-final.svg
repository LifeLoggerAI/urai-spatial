      <stop offset="0.5" stop-color="#F8DFA5" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#0B1022"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
