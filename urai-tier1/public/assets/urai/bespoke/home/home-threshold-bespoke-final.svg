<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">URAI Home bespoke final threshold</title>
  <desc id="desc">A cinematic URAI Home threshold with real sky, grounded floor, living orb, avatar presence, sky ascent and ground descent portals.</desc>
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="28%" r="58%">
      <stop offset="0" stop-color="#B8F7FF" stop-opacity="0.95"/>
      <stop offset="0.28" stop-color="#6EE7FF" stop-opacity="0.44"/>
      <stop offset="0.62" stop-color="#25356D" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#050711"/>
