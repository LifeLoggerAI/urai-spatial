    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2D3B42"/><stop offset="1" stop-color="#020304"/></linearGradient>
    <radialGradient id="orb" cx="36%" cy="24%" r="64%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.34" stop-color="#8CF7FF"/><stop offset="1" stop-color="#14346F" stop-opacity="0.52"/></radialGradient>
