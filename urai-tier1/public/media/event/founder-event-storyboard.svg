<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">URAI founder event screenshot fallback storyboard</title>
<desc id="desc">Eight sample-safe panels covering Event, Home, Life Map, Focus, Replay, Mirror, Passport, and Status.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020713"/><stop offset=".55" stop-color="#052033"/><stop offset="1" stop-color="#140b28"/></linearGradient><radialGradient id="orb"><stop stop-color="#e8ffff"/><stop offset=".18" stop-color="#9af8ff"/><stop offset=".58" stop-color="#45bfff"/><stop offset="1" stop-color="#020c18"/></radialGradient><style>.panel{fill:#071321;stroke:#9af8ff;stroke-opacity:.22;stroke-width:2}.n{font:800 18px system-ui;letter-spacing:4px;fill:#9af8ff}.h{font:900 44px system-ui;fill:#fff}.p{font:600 21px system-ui;fill:#cdddea}.r{font:700 16px ui-monospace,monospace;fill:#c084fc}.foot{font:800 17px system-ui;fill:#fff0bd}.line{stroke:#9af8ff;stroke-opacity:.3;stroke-width:2}</style></defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="60" y="62" class="n">URAI · FOUNDER EVENT OFFLINE STORYBOARD</text><text x="60" y="112" class="h">Your life should not look like a dashboard.</text>
<g transform="translate(60 150)">
<g><rect class="panel" width="350" height="340" rx="28"/><circle cx="278" cy="78" r="48" fill="url(#orb)"/><text x="28" y="46" class="n">01 · EVENT</text><text x="28" y="120" class="h">Founder</text><text x="28" y="166" class="h">destination</text><text x="28" y="220" class="p">Sample disclosure, QR gate,</text><text x="28" y="250" class="p">one clear next action.</text><text x="28" y="302" class="r">/event</text></g>
<g transform="translate(390)"><rect class="panel" width="350" height="340" rx="28"/><circle cx="278" cy="78" r="48" fill="url(#orb)"/><text x="28" y="46" class="n">02 · HOME</text><text x="28" y="120" class="h">Enter the</text><text x="28" y="166" class="h">threshold</text><text x="28" y="220" class="p">A spatial orientation,</text><text x="28" y="250" class="p">not a feed or score.</text><text x="28" y="302" class="r">/home</text></g>
<g transform="translate(780)"><rect class="panel" width="350" height="340" rx="28"/><circle cx="278" cy="78" r="48" fill="url(#orb)"/><text x="28" y="46" class="n">03 · LIFE MAP</text><text x="28" y="120" class="h">Memory as</text><text x="28" y="166" class="h">constellation</text><text x="28" y="220" class="p">Synthetic memories and</text><text x="28" y="250" class="p">chapters connect spatially.</text><text x="28" y="302" class="r">/life-map</text></g>
<g transform="translate(1170)"><rect class="panel" width="350" height="340" rx="28"/><circle cx="278" cy="78" r="48" fill="url(#orb)"/><text x="28" y="46" class="n">04 · FOCUS</text><text x="28" y="120" class="h">One moment</text><text x="28" y="166" class="h">forward</text><text x="28" y="220" class="p">The Quiet Reset is the</text><text x="28" y="250" class="p">deterministic sample.</text><text x="28" y="302" class="r">/focus?memoryId=quiet-reset</text></g>
<g transform="translate(0 380)"><rect class="panel" width="350" height="340" rx="28"/><circle cx="278" cy="78" r="48" fill="url(#orb)"/><text x="28" y="46" class="n">05 · REPLAY</text><text x="28" y="120" class="h">Story from</text><text x="28" y="166" class="h">a thread</text><text x="28" y="220" class="p">Narrative direction without</text><text x="28" y="250" class="p">private persistence claims.</text><text x="28" y="302" class="r">/replay</text></g>
<g transform="translate(390 380)"><rect class="panel" width="350" height="340" rx="28"/><circle cx="278" cy="78" r="48" fill="url(#orb)"/><text x="28" y="46" class="n">06 · MIRROR</text><text x="28" y="120" class="h">Reflect, not</text><text x="28" y="166" class="h">diagnose</text><text x="28" y="220" class="p">Symbolic reflection with</text><text x="28" y="250" class="p">explicit safety boundaries.</text><text x="28" y="302" class="r">/mirror</text></g>
<g transform="translate(780 380)"><rect class="panel" width="350" height="340" rx="28"/><circle cx="278" cy="78" r="48" fill="url(#orb)"/><text x="28" y="46" class="n">07 · PASSPORT</text><text x="28" y="120" class="h">Permission</text><text x="28" y="166" class="h">is visible</text><text x="28" y="220" class="p">Provenance, export, deletion,</text><text x="28" y="250" class="p">and closed layers.</text><text x="28" y="302" class="r">/passport</text></g>
<g transform="translate(1170 380)"><rect class="panel" width="350" height="340" rx="28"/><circle cx="278" cy="78" r="48" fill="url(#orb)"/><text x="28" y="46" class="n">08 · STATUS</text><text x="28" y="120" class="h">Proof before</text><text x="28" y="166" class="h">expansion</text><text x="28" y="220" class="p">Implementation is not</text><text x="28" y="250" class="p">production certification.</text><text x="28" y="302" class="r">/status</text></g>
</g>
<line x1="60" y1="910" x2="1540" y2="910" class="line"/><text x="60" y="952" class="foot">SYNTHETIC SAMPLE CONTENT ONLY · NO CUSTOMER, ACCOUNT, CREDENTIAL, ADMIN, CONSOLE, ENVIRONMENT, OR PRODUCTION DATA</text>
</svg>
