name: Governed Asset Promotion

on:
  pull_request:
    paths:
      - 'operations/assets/launch-critical-assets.json'
      - 'operations/assets/promotion-decisions/**'
      - 'operations/assets/promotion-rehearsal/**'
      - 'operations/assets/authority-supersessions/**'
      - 'operations/assets/generated-receipts/**'
      - 'operations/assets/production-receipts/**'
      - 'urai-tier1/public/assets/urai/generated/**'
      - 'scripts/verify-governed-asset-promotion.mjs'
      - 'scripts/verify-asset-authority-consistency.mjs'
      - '.github/workflows/governed-asset-promotion.yml'
  workflow_dispatch:
    inputs:
      decision_path:
        description: Promotion decision JSON path
        required: false
        default: operations/assets/promotion-rehearsal/spatial-particle-atlas-v1.json

permissions:
  contents: read

env:
  URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every changed promotion decision
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          rehearsal='operations/assets/promotion-rehearsal/spatial-particle-atlas-v1.json'
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA")
          mapfile -t deleted_decisions < <(git diff --name-only --diff-filter=D "$BASE_SHA" "$HEAD_SHA" | grep -E '^operations/assets/(promotion-decisions|promotion-rehearsal)/.*\.json$' || true)
          mapfile -t decisions < <(printf '%s\n' "${changed[@]}" | grep -E '^operations/assets/(promotion-decisions|promotion-rehearsal)/.*\.json$' || true)
          mapfile -t supersessions < <(printf '%s\n' "${changed[@]}" | grep -E '^operations/assets/authority-supersessions/.*\.json$' || true)
          mapfile -t assets < <(printf '%s\n' "${changed[@]}" | grep -E '^urai-tier1/public/assets/urai/generated/' | grep -Ev '^urai-tier1/public/assets/urai/generated/audio/' || true)
          mapfile -t governed_evidence < <(printf '%s\n' "${changed[@]}" | grep -E '^operations/assets/(launch-critical-assets\.json|generated-receipts/|production-receipts/)' | grep -Ev '^operations/assets/production-receipts/(spatial-audio-production-v1|sensory-layer-v1)\.json$' || true)

          if ((${#deleted_decisions[@]} > 0)); then
            printf 'Deleted promotion decisions require an explicit superseding decision:\n%s\n' "${deleted_decisions[*]}" >&2
            exit 1
          fi

          if ((${#decisions[@]} == 0)); then
            if ((${#assets[@]} > 0)); then
              echo 'Changed generated assets require a matching changed promotion decision; authority supersession cannot promote binary bytes.' >&2
              exit 1
            fi
            if ((${#governed_evidence[@]} > 0)); then
              if ((${#supersessions[@]} == 0)); then
                echo 'Changed governed evidence requires either a changed promotion decision or a changed authority-supersession record.' >&2
                exit 1
              fi
              # Evidence-only demotion/supersession is allowed only when the repository's
              # fail-closed current-authority validator proves that no historical receipt,
              # decision, or runtime registry can authorize current candidate bytes.
              node scripts/verify-asset-authority-consistency.mjs
            fi
            decisions=("$rehearsal")
          fi

          for decision in "${decisions[@]}"; do
            URAI_ASSET_PROMOTION_DECISION="$decision" node scripts/verify-governed-asset-promotion.mjs
          done

          for asset in "${assets[@]}"; do
            matched=0
            for decision in "${decisions[@]}"; do
              canonical="$(node -e "const fs=require('node:fs');const value=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.stdout.write(String(value.canonicalPath||''))" "$decision")"
              if [[ "$canonical" == "$asset" ]]; then
                matched=1
                break
              fi
            done
            if ((matched == 0)); then
              echo "Changed generated asset lacks a matching changed promotion decision: $asset" >&2
              exit 1
            fi
          done
      - name: Validate dispatched promotion decision
        if: github.event_name == 'workflow_dispatch'
        env:
          URAI_ASSET_PROMOTION_DECISION: ${{ inputs.decision_path }}
        run: node scripts/verify-governed-asset-promotion.mjs
