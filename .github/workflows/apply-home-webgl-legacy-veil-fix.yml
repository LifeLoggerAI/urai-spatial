name: Apply Home WebGL Legacy Veil Repair

on:
  pull_request:
    branches:
      - release/continuous-spatial-world-clean-20260715
    paths:
      - .github/workflows/apply-home-webgl-legacy-veil-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact child branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/home-webgl-legacy-veil-20260715
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Prove exact starting authority
        shell: bash
        run: |
          set -euo pipefail
          base=96b9534f4f36f3545f151d5f1135c543afd7c202
          test "$(git branch --show-current)" = "fix/home-webgl-legacy-veil-20260715"
          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git diff --name-only "$base" HEAD)" = ".github/workflows/apply-home-webgl-legacy-veil-fix.yml"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply focused permanent repair
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('urai-tier1/src/app/continuous-spatial-proof-defects.css')
          css = css_path.read_text()
          css_marker = 'SPATIAL-HOME-LEGACY-OWNER-VEIL-REMOVAL'
          if css_marker in css:
              raise SystemExit('Home legacy owner repair already present')
          css += '''

          /* SPATIAL-HOME-LEGACY-OWNER-VEIL-REMOVAL
             The WebGL runtime owns its own semantic navigation and orb guidance. The
             former Home owner must be absent from paint so its inherited rounded,
             transformed glass container cannot blur or occlude the live 3D world. */
          body:has(.urai-home-spatial-runtime-layer) .urai-home-spatial-world-final {
            display: none !important;
          }
          '''
          css_path.write_text(css)

          proof_path = Path('scripts/capture-continuous-spatial-proof.mjs')
          proof = proof_path.read_text()
          owner_anchor = """      const oldWorldHidden = (await oldWorld.count()) === 0 || await oldWorld.evaluate((node) => getComputedStyle(node).display === 'none')
"""
          if owner_anchor not in proof:
              raise SystemExit('capture oldWorldHidden anchor missing')
          owner_insert = owner_anchor + """      const legacyOwner = page.locator('.urai-home-spatial-world-final')
      const legacyOwnerHidden = (await legacyOwner.count()) === 0 || await legacyOwner.evaluate((node) => getComputedStyle(node).display === 'none')
"""
          proof = proof.replace(owner_anchor, owner_insert, 1)
          return_anchor = """        oldWorldHidden,
        legacyControlsSuppressed: legacyControlsVisible === 0,
"""
          if return_anchor not in proof:
              raise SystemExit('capture return anchor missing')
          proof = proof.replace(return_anchor, """        oldWorldHidden,
        legacyOwnerHidden,
        legacyControlsSuppressed: legacyControlsVisible === 0,
""", 1)
          proof_path.write_text(proof)

          test_path = Path('urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs')
          contract = test_path.read_text()
          css_anchor = """  assert.match(structuralCss, /display: none !important/)
"""
          if css_anchor not in contract:
              raise SystemExit('contract CSS anchor missing')
          contract = contract.replace(css_anchor, css_anchor + """  assert.match(structuralCss, /SPATIAL-HOME-LEGACY-OWNER-VEIL-REMOVAL/)
  assert.match(structuralCss, /body:has\(\.urai-home-spatial-runtime-layer\) \.urai-home-spatial-world-final\s*\{\s*display: none !important;/s)
""", 1)
          proof_anchor = """  assert.match(proof, /legacyControlsSuppressed/)
"""
          if proof_anchor not in contract:
              raise SystemExit('contract proof anchor missing')
          contract = contract.replace(proof_anchor, """  assert.match(proof, /legacyOwnerHidden/)
""" + proof_anchor, 1)
          test_path.write_text(contract)

          Path('.github/workflows/apply-home-webgl-legacy-veil-fix.yml').unlink()

      - name: Verify focused contract and exact final scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'SPATIAL-HOME-LEGACY-OWNER-VEIL-REMOVAL' urai-tier1/src/app/continuous-spatial-proof-defects.css
          grep -Fq 'legacyOwnerHidden' scripts/capture-continuous-spatial-proof.mjs
          node urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
          git diff --check
          test ! -e .github/workflows/apply-home-webgl-legacy-veil-fix.yml
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/apply-home-webgl-legacy-veil-fix.yml \
            scripts/capture-continuous-spatial-proof.mjs \
            urai-tier1/src/app/continuous-spatial-proof-defects.css \
            urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs | sort)"
          test "$changed" = "$expected"

      - name: Commit exact permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LifeLoggerAI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): remove legacy veil above WebGL world"
          git push origin HEAD:fix/home-webgl-legacy-veil-20260715
