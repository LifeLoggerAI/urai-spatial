name: Home Portal Proof Strictness Repair

on:
  push:
    branches:
      - feat/home-final-personalized-sanctuary-20260723
    paths:
      - .github/workflows/home-portal-proof-strictness-repair.yml

permissions:
  contents: write

concurrency:
  group: home-portal-proof-strictness-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'LifeLoggerAI/urai-spatial'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HOME_BRANCH: feat/home-final-personalized-sanctuary-20260723
      EXPECTED_PARENT: b9d45ae868d195a9bc57c9225ffe97a79800b275
    steps:
      - name: Check out exact one-shot repair commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Refuse stale or unexpected authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/home-portal-proof-strictness-repair.yml"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Restore strict traversal and bounded navigation-abort evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const proofPath = 'scripts/run-continuous-spatial-proof-v18-portal-stable.mjs'
          let proof = fs.readFileSync(proofPath, 'utf8')

          const looseWait = `        // On a saturated software-rendered host, traversal and closing timers can
          // commit in one React batch. Exact opening + closing + route identity still
          // proves the full bounded lifecycle without accepting a URL-only success.
          return routeSettled && openingObserved && closingObserved`
          const strictWait = `        return routeSettled && openingObserved && traversalObserved && closingObserved`
          if (!proof.includes(looseWait)) throw new Error('Expected loose portal wait contract was not found')
          proof = proof.replace(looseWait, strictWait)

          const looseLifecycle = 'lifecycleObserved: openingObserved && closingObserved'
          const strictLifecycle = 'lifecycleObserved: openingObserved && traversalObserved && closingObserved'
          if ((proof.match(new RegExp(looseLifecycle.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length !== 2) {
            throw new Error('Expected two loose lifecycle contracts were not found')
          }
          proof = proof.replaceAll(looseLifecycle, strictLifecycle)

          const looseDiagnostics = `    const rawDiagnostics = diagnostics()
          const ignoredAbortedRequests = rawDiagnostics.failedRequests.filter((request) => String(request.failure || '').includes('ERR_ABORTED'))
          const diagnosticResult = {
            ...rawDiagnostics,
            failedRequests: rawDiagnostics.failedRequests.filter((request) => !String(request.failure || '').includes('ERR_ABORTED')),
            ignoredAbortedRequests,
          }`
          const strictDiagnostics = `    const rawDiagnostics = diagnostics()
          const destinationOrigin = (() => {
            try { return new URL(routeEvidence?.href || page.url()).origin } catch { return null }
          })()
          const isExpectedNavigationAbort = (request) => {
            if (!routeEvidence?.routeSettled || !destinationOrigin || String(request.failure || '') !== 'net::ERR_ABORTED') return false
            try {
              const url = new URL(String(request.url || ''))
              return url.origin === destinationOrigin && [
                '/assets/urai/final/manifests/v2-asset-factory-spatial-handoff.json',
                '/assets/urai/final/manifests/v3-asset-factory-spatial-handoff.json',
              ].includes(url.pathname)
            } catch {
              return false
            }
          }
          const ignoredAbortedRequests = rawDiagnostics.failedRequests.filter(isExpectedNavigationAbort)
          const diagnosticResult = {
            ...rawDiagnostics,
            failedRequests: rawDiagnostics.failedRequests.filter((request) => !isExpectedNavigationAbort(request)),
            ignoredAbortedRequests,
          }`
          if (!proof.includes(looseDiagnostics)) throw new Error('Expected broad ERR_ABORTED classifier was not found')
          proof = proof.replace(looseDiagnostics, strictDiagnostics)
          fs.writeFileSync(proofPath, proof)

          const testPath = 'urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs'
          let testSource = fs.readFileSync(testPath, 'utf8')
          const proofRead = "const portalProof = read('../scripts/run-continuous-spatial-proof-v18-portal-stable.mjs')"
          if (!testSource.includes(proofRead)) {
            const anchor = "const proof = read('../scripts/capture-continuous-spatial-proof-v18.mjs')"
            if (!testSource.includes(anchor)) throw new Error('Portal proof test insertion anchor was not found')
            testSource = testSource.replace(anchor, `${anchor}\n${proofRead}`)
          }
          const testName = "test('Home portal proof requires a separately observed traversal and bounds only exact navigation aborts'"
          if (!testSource.includes(testName)) {
            testSource += `\n\ntest('Home portal proof requires a separately observed traversal and bounds only exact navigation aborts', () => {
              assert.match(portalProof, /return routeSettled && openingObserved && traversalObserved && closingObserved/)
              assert.match(portalProof, /lifecycleObserved: openingObserved && traversalObserved && closingObserved/)
              assert.match(portalProof, /routeEvidence\?\.routeSettled/)
              assert.match(portalProof, /String\(request\.failure \|\| ''\) !== 'net::ERR_ABORTED'/)
              assert.match(portalProof, /v2-asset-factory-spatial-handoff\.json/)
              assert.match(portalProof, /v3-asset-factory-spatial-handoff\.json/)
              assert.doesNotMatch(portalProof, /return routeSettled && openingObserved && closingObserved/)
              assert.doesNotMatch(portalProof, /failedRequests: rawDiagnostics\.failedRequests\.filter\(\(request\) => !String\(request\.failure/)
            })\n`
          }
          fs.writeFileSync(testPath, testSource)
          NODE

      - name: Prove the bounded repair
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = $'scripts/run-continuous-spatial-proof-v18-portal-stable.mjs\nurai-tier1/tests/continuous-spatial-restoration-contract.test.mjs'

      - name: Commit the repair and remove the one-shot executor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/home-portal-proof-strictness-repair.yml
          git config user.name 'LifeLoggerAI'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/run-continuous-spatial-proof-v18-portal-stable.mjs urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs .github/workflows/home-portal-proof-strictness-repair.yml
          git commit -m 'test(home): restore strict portal traversal evidence'
          git push origin "HEAD:refs/heads/$HOME_BRANCH"
