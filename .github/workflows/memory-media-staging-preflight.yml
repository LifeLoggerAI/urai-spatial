name: Memory Media Staging Acceptance Preflight (No Cloud Writes)

on:
  pull_request:
    paths:
      - 'apps/functions/scripts/memory-media-staging-positive-proof.cjs'
      - 'apps/functions/scripts/memory-media-staging-source-check.cjs'
      - 'apps/functions/scripts/memory-media-staging-source-check.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-admission.cjs'
      - 'apps/functions/scripts/memory-media-staging-admission.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-deployed-source.cjs'
      - 'apps/functions/scripts/memory-media-staging-deployed-source.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-cloud-collector.cjs'
      - 'apps/functions/scripts/memory-media-staging-cloud-collector.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-provenance.cjs'
      - 'apps/functions/scripts/memory-media-staging-provenance.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-runtime-attestation.cjs'
      - 'apps/functions/scripts/memory-media-staging-runtime-attestation.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-origin-binding.cjs'
      - 'apps/functions/scripts/memory-media-staging-origin-binding.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-request-log-proof.cjs'
      - 'apps/functions/scripts/memory-media-staging-request-log-proof.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-upload-origin.cjs'
      - 'apps/functions/scripts/memory-media-staging-upload-origin.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-provider-body.cjs'
      - 'apps/functions/scripts/memory-media-staging-provider-body.test.cjs'
      - 'apps/functions/scripts/memory-media-staging-uploader-audit.cjs'
      - 'apps/functions/scripts/memory-media-staging-uploader-audit.test.cjs'
      - 'scripts/verify_functions_source_archive.py'
      - 'scripts/test_verify_functions_source_archive.py'
      - '.github/workflows/memory-media-staging-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Syntax and offline, non-spending preflight
        run: |
          set -euo pipefail
          node --check apps/functions/scripts/memory-media-staging-positive-proof.cjs
          node --check apps/functions/scripts/memory-media-staging-provenance.cjs
          node --check apps/functions/scripts/memory-media-staging-runtime-attestation.cjs
          node --check apps/functions/scripts/memory-media-staging-origin-binding.cjs
          node --check apps/functions/scripts/memory-media-staging-request-log-proof.cjs
          node --check apps/functions/scripts/memory-media-staging-upload-origin.cjs
          node --check apps/functions/scripts/memory-media-staging-provider-body.cjs
          node --check apps/functions/scripts/memory-media-staging-uploader-audit.cjs
          node --check apps/functions/scripts/memory-media-staging-source-check.cjs
          node --test apps/functions/scripts/memory-media-staging-source-check.test.cjs apps/functions/scripts/memory-media-staging-admission.test.cjs apps/functions/scripts/memory-media-staging-deployed-source.test.cjs apps/functions/scripts/memory-media-staging-cloud-collector.test.cjs apps/functions/scripts/memory-media-staging-provenance.test.cjs apps/functions/scripts/memory-media-staging-runtime-attestation.test.cjs apps/functions/scripts/memory-media-staging-origin-binding.test.cjs apps/functions/scripts/memory-media-staging-request-log-proof.test.cjs apps/functions/scripts/memory-media-staging-upload-origin.test.cjs apps/functions/scripts/memory-media-staging-provider-body.test.cjs apps/functions/scripts/memory-media-staging-uploader-audit.test.cjs
          node apps/functions/scripts/memory-media-staging-positive-proof.cjs --preflight
          test -z "${URAI_MEDIA_STAGING_WRITE_APPROVAL:-}"
      - name: Verify fictional Firebase archive content boundaries without cloud access
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_verify_functions_source_archive.py' -v
          python3 -m py_compile scripts/verify_functions_source_archive.py scripts/test_verify_functions_source_archive.py
      - name: Prove unapproved source registry blocks cloud startup
        env:
          URAI_MEDIA_STAGING_PROJECT: urai-media-staging
          URAI_MEDIA_STAGING_BUCKET: urai-media-staging.firebasestorage.app
          URAI_MEDIA_STAGING_ENABLE: EXPLICIT_NONPRODUCTION_ONLY
          URAI_MEDIA_STAGING_WRITE_APPROVAL: EXPLICIT_DISPOSABLE_STAGING_RUN
          URAI_EXACT_HEAD: ${{ github.sha }}
          URAI_MEDIA_STAGING_WEB_API_KEY: fictional-no-network
          GCLOUD_PROJECT: urai-media-staging
          GCP_PROJECT: urai-media-staging
          GOOGLE_CLOUD_PROJECT: urai-media-staging
          FIREBASE_STORAGE_BUCKET: urai-media-staging.firebasestorage.app
          FIREBASE_CONFIG: '{"projectId":"urai-media-staging","storageBucket":"urai-media-staging.firebasestorage.app"}'
        run: |
          set -euo pipefail
          if node apps/functions/scripts/memory-media-staging-positive-proof.cjs --execute > preflight.out 2>&1; then
            echo "FAIL: unapproved staging reached execution"; exit 1
          fi
          grep -q 'MEMORY_MEDIA_PROJECT_UNBOUND' preflight.out
          ! grep -q 'STAGING_MEDIA_EVIDENCE_BLOCKED' preflight.out
          rm preflight.out
