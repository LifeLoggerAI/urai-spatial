name: Ground Gold Master Proof

on:
  pull_request:
    branches: [main, home-final-v24-certify-20260826]
    paths:
      - 'scripts/capture-ground-goldmaster-proof.mjs'
      - 'urai-tier1/src/app/GroundSpatialWorldClean.tsx'
      - 'urai-tier1/public/assets/urai/generated/models/ground-natural-canopy-v3.glb'
      - 'urai-tier1/public/assets/urai/generated/models/ground-natural-canopy-v3.receipt.json'
      - 'urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs'
      - '.github/workflows/ground-gold-master-proof.yml'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ground-gold-master-${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'

jobs:
  exact-head-ground-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate Ground contracts and build
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/capture-ground-goldmaster-proof.mjs
          (cd urai-tier1 && node tests/home-ground-lifemap-art-bible-contract.test.mjs)
          pnpm --dir urai-tier1 typecheck
          pnpm build:static
      - name: Install Chromium
        run: pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Capture exact-head Ground proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ground-goldmaster-proof
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > artifacts/ground-goldmaster-proof/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/ground/ >/dev/null && break; sleep 1; done
          URAI_PROOF_BASE=http://127.0.0.1:4173 URAI_PROOF_DIR=artifacts/ground-goldmaster-proof URAI_EXACT_HEAD="$URAI_EXACT_HEAD" node scripts/capture-ground-goldmaster-proof.mjs 2>&1 | tee artifacts/ground-goldmaster-proof/capture.log
      - name: Prove complete Ground receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - artifacts/ground-goldmaster-proof/receipt.json "$URAI_EXACT_HEAD" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const [path, head] = process.argv.slice(2)
          const receipt = JSON.parse(await readFile(path, 'utf8'))
          if (receipt.schema !== 'urai-ground-goldmaster-proof-2') throw new Error('Ground proof schema mismatch')
          if (receipt.exactHead !== head) throw new Error('Ground exact-head mismatch')
          if (receipt.errors.length) throw new Error(`Ground receipt has ${receipt.errors.length} errors`)
          if (receipt.scenarios.length !== 5) throw new Error('Ground scenario matrix incomplete')
          if (receipt.captures.length !== 19) throw new Error(`Ground capture matrix incomplete: ${receipt.captures.length}`)
          NODE
      - name: Upload exact-head Ground Gold Master candidate proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ground-gold-master-proof-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/ground-goldmaster-proof
          if-no-files-found: error
          retention-days: 90
