name: World001 V3 Nonproduction Browser Proof
on:
  pull_request:
    branches: [repair/release-closure-integration-20261007]
    paths:
      - '.github/workflows/world001-v3-dev-home-proof.yml'
      - 'scripts/capture-world001-v3-dev-browser.mjs'
      - 'scripts/world001-v3-preview-asset.mjs'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx'
      - 'urai-tier1/next.config.*'
      - 'package.json'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact head SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  development-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha }}
      URAI_V3_DEV_BROWSER_PROOF: 'true'
      URAI_V3_PROOF_DIR: artifacts/world001-v3-dev-browser
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source SHA
        run: test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Source identity and excluded default
        run: |
          node --check scripts/capture-world001-v3-dev-browser.mjs
          node scripts/world001-v3-preview-asset.mjs verify-source
          node scripts/world001-v3-preview-asset.mjs assert-excluded
      - name: Build real production static consumer
        run: |
          pnpm build:static
          node scripts/world001-v3-preview-asset.mjs assert-build-excluded
          test -f urai-tier1/out/home/index.html
      - name: Negative test for accidental research asset publication
        shell: bash
        run: |
          set -euo pipefail
          trap 'node scripts/world001-v3-preview-asset.mjs clean' EXIT
          NODE_ENV=development node scripts/world001-v3-preview-asset.mjs stage
          if node scripts/world001-v3-preview-asset.mjs assert-excluded; then exit 1; fi
          if NODE_ENV=production node --input-type=module -e "import('./urai-tier1/next.config.mjs')"; then exit 1; fi
      - name: Install Chromium
        run: pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Capture real canonical Home in browser
        env:
          NODE_ENV: development
        run: node scripts/capture-world001-v3-dev-browser.mjs
      - name: Verify bound browser proof
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('artifacts/world001-v3-dev-browser/receipt.json')); if(!r.executed || r.failures.length || r.head!==process.env.URAI_EXACT_HEAD || r.scenarios.length!==3) process.exit(1)"
          node scripts/world001-v3-preview-asset.mjs assert-build-excluded
      - name: Preserve browser receipt and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: world001-v3-dev-browser-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/world001-v3-dev-browser
          if-no-files-found: warn
          retention-days: 30
