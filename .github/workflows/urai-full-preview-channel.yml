name: URAI Full Public Preview Channel

on:
  pull_request:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/urai-full-preview-channel.yml'
  push:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/urai-full-preview-channel.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to verify; defaults to the triggering SHA
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: urai-full-preview-verification-${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  local-preview-verification:
    name: Verify full preview locally without provider credentials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Preflight
        run: pnpm preflight
      - name: Build exact static candidate with acceptance fixtures
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.URAI_EXACT_HEAD }}
          URAI_LOCATION_MAP_ACCEPTANCE_FIXTURES: '1'
          URAI_FIREBASE_STATIC_EXPORT: 'true'
        run: pnpm build:static
      - name: Prove exact source remained clean
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Serve exact static candidate locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory urai-tier1/out > local-preview-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ > local-index.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/location-map/ > local-location-map.html
          grep -q "$URAI_EXACT_HEAD" local-location-map.html
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run exact-head Location Map smoke locally
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          URAI_EXACT_HEAD: ${{ env.URAI_EXACT_HEAD }}
        run: pnpm exec playwright test tests/location-map-trusted-preview-smoke.spec.ts --config=playwright.config.ts
      - name: Write checks-only NO-GO receipt
        if: always()
        shell: bash
        run: |
          mkdir -p preview-evidence
          cp -f local-preview-server.log local-index.html local-location-map.html preview-evidence/ 2>/dev/null || true
          printf 'exact_sha=%s\nrun_id=%s\nworkflow=%s\nmode=local-no-provider-credentials\nclassification=NO-GO\nproduction_targeted=false\ndeployment_attempted=false\ncaptured_at=%s\n' \
            "$URAI_EXACT_HEAD" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > preview-evidence/manifest.txt
          echo 'Classification: NO-GO'
      - name: Retain local preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-full-local-preview-${{ env.URAI_EXACT_HEAD }}
          path: |
            preview-evidence
            test-results
            playwright-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
