name: Forge real spatial models v1

on:
  push:
    branches:
      - feat/real-spatial-models-v1-20260710
    paths:
      - scripts/generate-real-spatial-models-v1.py
      - .github/workflows/forge-real-spatial-models-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-real-spatial-models-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic model dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 trimesh==4.11.1

      - name: Generate real spatial models
        run: python scripts/generate-real-spatial-models-v1.py

      - name: Verify receipt and non-empty geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('docs/generated/spatial-models-v1-receipt.json').read_text())
          assert receipt['modelCount'] == 14, receipt
          assert receipt['totalVertices'] >= 20000, receipt
          assert receipt['totalFaces'] >= 40000, receipt
          for model in receipt['models']:
              path = Path('urai-tier1/public') / model['file'].lstrip('/')
              assert path.exists(), path
              assert model['vertices'] > 0 and model['faces'] > 0, model
              assert path.stat().st_size == model['bytes'], model
          print(json.dumps({
              'ok': True,
              'modelCount': receipt['modelCount'],
              'totalVertices': receipt['totalVertices'],
              'totalFaces': receipt['totalFaces'],
          }, indent=2))
          PY

      - name: Commit generated models and receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/public/assets/urai/spatial docs/generated/spatial-models-v1-receipt.json
          if git diff --cached --quiet; then
            echo 'Generated assets already match the deterministic forge.'
            exit 0
          fi
          git commit -m 'Generate real spatial model pack v1 [skip ci]'
          git push origin HEAD:${{ github.ref_name }}

