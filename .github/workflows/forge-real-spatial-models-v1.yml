name: Forge real spatial models v1

on:
  push:
    branches:
      - feat/real-spatial-models-v1-20260710
    paths:
      - scripts/generate-real-spatial-models-v1.py
      - operations/assets/spatial-proof-fallbacks-v1.json
      - docs/REAL_SPATIAL_MODELS_V1.md
      - .github/workflows/forge-real-spatial-models-v1.yml
  pull_request:
    paths:
      - scripts/generate-real-spatial-models-v1.py
      - operations/assets/spatial-proof-fallbacks-v1.json
      - docs/REAL_SPATIAL_MODELS_V1.md
      - urai-tier1/public/assets/urai/spatial/**
      - docs/generated/spatial-models-v1-receipt.json
      - .github/workflows/forge-real-spatial-models-v1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-real-spatial-models-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic model dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 scipy==1.15.3 trimesh==4.11.1

      - name: Generate real spatial fallback models
        run: python scripts/generate-real-spatial-models-v1.py

      - name: Verify receipt, non-empty geometry and authority boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          receipt_path = Path('docs/generated/spatial-models-v1-receipt.json')
          inventory_path = Path('operations/assets/spatial-proof-fallbacks-v1.json')
          receipt = json.loads(receipt_path.read_text())
          inventory = json.loads(inventory_path.read_text())

          assert receipt['modelCount'] == 11, receipt
          assert receipt['totalVertices'] >= 15000, receipt
          assert receipt['totalFaces'] >= 30000, receipt
          assert inventory['authority']['selectedProductionRoot'] == 'urai-tier1/public/assets/urai/generated', inventory
          assert inventory['authority']['fallbackRoot'] == 'urai-tier1/public/assets/urai/spatial', inventory
          assert inventory['authority']['selectedProduction'] is False, inventory
          assert inventory['policy']['mayBeDescribedAsFinalArt'] is False, inventory
          assert inventory['policy']['maySilentlyOverrideSelectedAsset'] is False, inventory
          assert inventory['policy']['failClosedWhenCanonicalFallbackUnavailable'] is True, inventory
          assert set(inventory['policy']['rejectedVisualFallbacks']) == {'portal-ring', 'focus-tunnel', 'replay-film-portal'}, inventory

          receipt_files = {model['file'] for model in receipt['models']}
          inventory_files = {model['file'] for model in inventory['models']}
          assert receipt_files == inventory_files, {'receipt': sorted(receipt_files), 'inventory': sorted(inventory_files)}

          for model in receipt['models']:
              path = Path('urai-tier1/public') / model['file'].lstrip('/')
              assert path.exists(), path
              assert model['vertices'] > 0 and model['faces'] > 0, model
              assert path.stat().st_size == model['bytes'], model

          print(json.dumps({
              'ok': True,
              'runtimeRole': inventory['policy']['runtimeRole'],
              'modelCount': receipt['modelCount'],
              'totalVertices': receipt['totalVertices'],
              'totalFaces': receipt['totalFaces'],
          }, indent=2))
          PY

      - name: Verify generated geometry matches committed semantic authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          generated = json.loads(Path('docs/generated/spatial-models-v1-receipt.json').read_text())
          committed = json.loads(subprocess.check_output(
              ['git', 'show', 'HEAD:docs/generated/spatial-models-v1-receipt.json'],
              text=True,
          ))

          def semantic(receipt):
              return {
                  item['id']: {
                      'file': item['file'],
                      'geometryCount': item['geometryCount'],
                      'vertices': item['vertices'],
                      'faces': item['faces'],
                  }
                  for item in receipt['models']
              }

          assert generated['schemaVersion'] == committed['schemaVersion'], (generated, committed)
          assert generated['modelCount'] == committed['modelCount'], (generated, committed)
          assert generated['totalVertices'] == committed['totalVertices'], (generated, committed)
          assert generated['totalFaces'] == committed['totalFaces'], (generated, committed)
          assert semantic(generated) == semantic(committed), {
              'generated': semantic(generated),
              'committed': semantic(committed),
          }
          print(json.dumps({
              'ok': True,
              'semanticGeometryStable': True,
              'modelCount': generated['modelCount'],
              'totalVertices': generated['totalVertices'],
              'totalFaces': generated['totalFaces'],
          }, indent=2))
          PY
