name: URAI Maps Cloud Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/urai-maps-cloud-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: urai-exact-key-containment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: LifeLoggerAI/urai-spatial
  TARGET_PROJECT: urai-4dc1d
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  exact-legacy-key-containment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: Exact legacy Firebase key containment
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Enforce isolated containment boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_HEAD_REF" = 'ops/exact-legacy-key-revoke-20260811'
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate legacy credential metadata privately
        id: legacy
        shell: bash
        env:
          LEGACY_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$LEGACY_JSON"
          d="$RUNNER_TEMP/urai-exact-key-containment"
          mkdir -p "$d"
          printf '%s' "$LEGACY_JSON" > "$d/legacy.json"
          chmod 600 "$d/legacy.json"
          jq -e --arg p "$TARGET_PROJECT" '.project_id == $p and (.client_email|type=="string" and length>0) and (.private_key_id|type=="string" and length>0)' "$d/legacy.json" >/dev/null
          jq -r '.client_email' "$d/legacy.json" > "$d/legacy-email.txt"
          jq -r '.private_key_id' "$d/legacy.json" > "$d/legacy-key-id.txt"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Select only an already-configured cloud-admin path
        id: authmode
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_MAPS_ADMIN_SERVICE_ACCOUNT }}
          ADMIN_JSON: ${{ secrets.GCP_MAPS_ADMIN_CREDENTIALS_JSON }}
        run: |
          set -euo pipefail
          if [[ -n "$WIF_PROVIDER" && -n "$WIF_SERVICE_ACCOUNT" ]]; then
            echo 'mode=wif' >> "$GITHUB_OUTPUT"
          elif [[ -n "$ADMIN_JSON" ]]; then
            printf '%s' "$ADMIN_JSON" | jq -e --arg p "$TARGET_PROJECT" '.project_id == $p and (.client_email|type=="string" and length>0)' >/dev/null
            echo 'mode=json' >> "$GITHUB_OUTPUT"
          else
            echo '::error::No already-configured Maps cloud-admin WIF or JSON credential exists.'
            exit 65
          fi

      - name: Authenticate existing WIF cloud-admin identity
        if: steps.authmode.outputs.mode == 'wif'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.TARGET_PROJECT }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MAPS_ADMIN_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Authenticate existing JSON cloud-admin identity
        if: steps.authmode.outputs.mode == 'json'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.TARGET_PROJECT }}
          credentials_json: ${{ secrets.GCP_MAPS_ADMIN_CREDENTIALS_JSON }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.TARGET_PROJECT }}
          version: '>= 500.0.0'

      - name: Prove active existing identity has key-delete authority
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          d='${{ steps.legacy.outputs.dir }}'
          active="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
          test -n "$active"
          gcloud projects get-iam-policy "$TARGET_PROJECT" --format=json > "$d/project-iam.json"
          jq -r --arg sa "serviceAccount:$active" --arg user "user:$active" '.bindings[]? | select(((.members // []) | index($sa)) != null or ((.members // []) | index($user)) != null) | .role' "$d/project-iam.json" | sort -u > "$d/admin-roles.txt"
          : > "$d/delete-roles.txt"
          idx=0
          while IFS= read -r role; do
            [ -n "$role" ] || continue
            idx=$((idx + 1))
            out="$d/role-$idx.json"
            if [[ "$role" == roles/* ]]; then
              gcloud iam roles describe "$role" --format=json > "$out"
            elif [[ "$role" == projects/*/roles/* ]]; then
              rid="${role##*/}"; project="$(printf '%s' "$role" | cut -d/ -f2)"
              gcloud iam roles describe "$rid" --project "$project" --format=json > "$out"
            elif [[ "$role" == organizations/*/roles/* ]]; then
              rid="${role##*/}"; org="$(printf '%s' "$role" | cut -d/ -f2)"
              gcloud iam roles describe "$rid" --organization "$org" --format=json > "$out"
            else
              continue
            fi
            if jq -e '.includedPermissions // [] | index("iam.serviceAccountKeys.delete") != null' "$out" >/dev/null; then
              printf '%s\n' "$role" >> "$d/delete-roles.txt"
            fi
          done < "$d/admin-roles.txt"
          test -s "$d/delete-roles.txt" || { echo '::error::Existing admin identity lacks proven direct key-delete authority.'; exit 66; }
          echo 'proven=true' >> "$GITHUB_OUTPUT"

      - name: Delete only the exact embedded legacy key
        id: delete
        if: steps.authority.outputs.proven == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d='${{ steps.legacy.outputs.dir }}'
          email="$(cat "$d/legacy-email.txt")"
          key_id="$(cat "$d/legacy-key-id.txt")"
          test -n "$email" && test -n "$key_id"
          gcloud iam service-accounts keys delete "$key_id" --iam-account "$email" --project "$TARGET_PROJECT" --quiet
          echo 'revoked=true' >> "$GITHUB_OUTPUT"

      - name: Require a fresh token mint with the old key to fail
        id: rejection
        if: steps.delete.outputs.revoked == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d='${{ steps.legacy.outputs.dir }}'
          cfg="$d/fresh-gcloud"
          mkdir -p "$cfg"
          CLOUDSDK_CONFIG="$cfg" gcloud auth activate-service-account --key-file="$d/legacy.json" --project="$TARGET_PROJECT" --quiet >/dev/null 2>"$d/activate.err" || true
          set +e
          CLOUDSDK_CONFIG="$cfg" gcloud auth print-access-token >"$d/token.out" 2>"$d/token.err"
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then
            echo '::error::Fresh token mint unexpectedly succeeded with the revoked legacy key.'
            rm -f "$d/token.out"
            exit 67
          fi
          rm -f "$d/token.out"
          echo 'rejected=true' >> "$GITHUB_OUTPUT"

      - name: Publish sanitized containment receipt
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          AUTH_MODE: ${{ steps.authmode.outputs.mode }}
          AUTH_PROVEN: ${{ steps.authority.outputs.proven }}
          REVOKED: ${{ steps.delete.outputs.revoked }}
          REJECTED: ${{ steps.rejection.outputs.rejected }}
        with:
          script: |
            const passed = process.env.AUTH_PROVEN === 'true' && process.env.REVOKED === 'true' && process.env.REJECTED === 'true'
            const body = [
              '## URAI exact legacy Firebase key containment receipt',
              '',
              `- Existing admin auth path selected: **${process.env.AUTH_MODE || 'none'}**`,
              `- Existing admin identity proved iam.serviceAccountKeys.delete: **${process.env.AUTH_PROVEN === 'true'}**`,
              `- Exact embedded legacy key deleted: **${process.env.REVOKED === 'true'}**`,
              `- Fresh access-token mint using the old key rejected: **${process.env.REJECTED === 'true'}**`,
              `- Overall containment: **${passed ? 'PASS' : 'NOT VERIFIED'}**`,
              '',
              '- IAM policy changed: **false**',
              '- Replacement key created: **false**',
              '- Deployment/DNS/billing mutation: **false**',
              '- No private key, credential JSON, access token, exact key ID, or service-account email is recorded.',
              `- Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n')
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: `URAI exact legacy Firebase key containment — ${passed ? 'PASS' : 'NOT VERIFIED'}`, body })

      - name: Remove temporary material
        if: always()
        shell: bash
        run: rm -rf '${{ steps.legacy.outputs.dir }}'
