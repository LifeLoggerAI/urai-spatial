name: Home State Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/capture-home-state-proof.mjs'
      - 'scripts/run-home-state-proof-bounded.mjs'
      - 'urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs'
      - '.github/workflows/home-state-proof.yml'
      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx'
      - 'urai-tier1/src/app/home/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-state-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: '0'
      NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/home-state-proof
          pnpm install --frozen-lockfile 2>&1 | tee artifacts/home-state-proof/install.log
      - name: Verify state-proof contract and build
        run: |
          (cd urai-tier1 && node tests/continuous-spatial-restoration-contract.test.mjs)
          node --check scripts/run-home-state-proof-bounded.mjs
          pnpm build:static
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Capture exact Home state proof
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > /tmp/urai-home-state-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/home/ >/dev/null && break; sleep 1; done
          URAI_PROOF_BASE=http://127.0.0.1:4173 URAI_PROOF_DIR=artifacts/home-state-proof node scripts/run-home-state-proof-bounded.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-state-proof-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/home-state-proof
          if-no-files-found: error
          retention-days: 365
