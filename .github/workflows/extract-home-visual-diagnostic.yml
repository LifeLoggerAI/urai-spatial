name: Extract Home Visual Diagnostic

on:
  push:
    branches:
      - diagnostics/extract-home-visual-receipt-20260729
    paths-ignore:
      - diagnostics/extracted/**

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diagnostics/extract-home-visual-receipt-20260729
          fetch-depth: 1

      - name: Download and extract exact retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8717996891'
          EXPECTED_HEAD: '51db7b3ba77a657659da34ca5e146e049dd03d31'
        run: |
          set -euo pipefail
          rm -rf diagnostic/raw diagnostic/out diagnostics/extracted
          mkdir -p diagnostic/raw diagnostic/out diagnostics/extracted/screenshots
          curl --fail-with-body --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output diagnostic/raw/artifact.zip
          unzip -l diagnostic/raw/artifact.zip > diagnostic/out/archive-list.txt
          python - <<'PY'
          import json
          import os
          import shutil
          import zipfile
          from pathlib import Path

          archive = Path('diagnostic/raw/artifact.zip')
          expected_head = os.environ['EXPECTED_HEAD']
          output = Path('diagnostics/extracted')
          screenshot_output = output / 'screenshots'

          with zipfile.ZipFile(archive) as bundle:
              names = bundle.namelist()
              receipt_names = [name for name in names if name == 'receipt.json' or name.endswith('/receipt.json')]
              if len(receipt_names) != 1:
                  raise SystemExit(f'expected one receipt.json, found {receipt_names}')
              receipt = json.loads(bundle.read(receipt_names[0]))
              if receipt.get('exactHead') != expected_head:
                  raise SystemExit(f"receipt exactHead {receipt.get('exactHead')} != {expected_head}")

              captures = receipt.get('captures', [])
              interactions = receipt.get('interactions', [])
              errors = receipt.get('errors', [])

              def compact(item):
                  return {
                      key: item.get(key)
                      for key in (
                          'id', 'label', 'method', 'destination', 'screenshot', 'video',
                          'viewport', 'url', 'route', 'state', 'diagnostics', 'result',
                          'fallbackVisible', 'semanticButtons'
                      )
                      if key in item
                  }

              summary = {
                  'artifactId': int(os.environ['ARTIFACT_ID']),
                  'schemaVersion': receipt.get('schemaVersion'),
                  'exactHead': receipt.get('exactHead'),
                  'capturedAt': receipt.get('capturedAt'),
                  'captureCount': len(captures),
                  'interactionCount': len(interactions),
                  'errorCount': len(errors),
                  'errors': errors,
                  'captures': [compact(item) for item in captures],
                  'interactions': [compact(item) for item in interactions],
                  'topLevelDiagnostics': receipt.get('diagnostics'),
                  'sensory': receipt.get('sensory'),
              }
              (output / 'receipt-summary.json').write_text(json.dumps(summary, indent=2) + '\n')

              requested = []
              for collection in (captures, interactions, errors):
                  for item in collection:
                      screenshot = item.get('screenshot') if isinstance(item, dict) else None
                      if isinstance(screenshot, str) and screenshot and screenshot not in requested:
                          requested.append(screenshot)

              extracted = []
              missing = []
              for screenshot in requested:
                  matches = [name for name in names if name == screenshot or name.endswith('/' + screenshot)]
                  if len(matches) != 1:
                      missing.append({'screenshot': screenshot, 'matches': matches})
                      continue
                  target = screenshot_output / Path(screenshot).name
                  with bundle.open(matches[0]) as source, target.open('wb') as destination:
                      shutil.copyfileobj(source, destination)
                  extracted.append({'receiptPath': screenshot, 'archivePath': matches[0], 'output': str(target)})

              manifest = {
                  'expectedHead': expected_head,
                  'requestedScreenshotCount': len(requested),
                  'extractedScreenshotCount': len(extracted),
                  'missing': missing,
                  'files': extracted,
              }
              (output / 'screenshot-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
              if missing:
                  raise SystemExit(f'missing or ambiguous retained screenshots: {missing}')
          PY
          cp diagnostic/out/archive-list.txt diagnostics/extracted/archive-list.txt
          rm -rf diagnostic

      - name: Commit bounded diagnostic result
        run: |
          set -euo pipefail
          git config user.name 'urai-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/extracted
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to commit.'
            exit 0
          fi
          git commit -m 'chore(diagnostics): retain final Home visual acceptance packet'
          git push origin HEAD:diagnostics/extract-home-visual-receipt-20260729
