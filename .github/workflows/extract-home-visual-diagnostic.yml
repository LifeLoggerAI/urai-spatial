name: Extract Home Visual Diagnostic

on:
  push:
    branches:
      - diagnostics/extract-home-visual-receipt-20260729
    paths-ignore:
      - diagnostics/extracted/**

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: diagnostics/extract-home-visual-receipt-20260729
          fetch-depth: 1

      - name: Download and extract exact retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '8715720001'
        run: |
          set -euo pipefail
          rm -rf diagnostic/raw diagnostic/out diagnostics/extracted
          mkdir -p diagnostic/raw diagnostic/out diagnostics/extracted
          curl --fail-with-body --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output diagnostic/raw/artifact.zip
          unzip -l diagnostic/raw/artifact.zip > diagnostic/out/archive-list.txt
          unzip -j diagnostic/raw/artifact.zip '*/receipt.json' -d diagnostic/out || unzip -j diagnostic/raw/artifact.zip 'receipt.json' -d diagnostic/out
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('diagnostic/out/receipt.json').read_text())
          summary = {
              'schemaVersion': data.get('schemaVersion'),
              'exactHead': data.get('exactHead'),
              'capturedAt': data.get('capturedAt'),
              'captureCount': len(data.get('captures', [])),
              'interactionCount': len(data.get('interactions', [])),
              'errors': data.get('errors', []),
              'interactions': data.get('interactions', []),
          }
          Path('diagnostics/extracted/failure-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          failed = [e.get('screenshot') for e in data.get('errors', []) if isinstance(e, dict) and e.get('screenshot')]
          Path('diagnostics/extracted/failed-screenshots.txt').write_text('\n'.join(failed) + ('\n' if failed else ''))
          PY
          cp diagnostic/out/archive-list.txt diagnostics/extracted/archive-list.txt
          while IFS= read -r screenshot; do
            [ -n "$screenshot" ] || continue
            unzip -j diagnostic/raw/artifact.zip "*/${screenshot}" -d diagnostics/extracted || true
          done < diagnostics/extracted/failed-screenshots.txt
          rm -rf diagnostic

      - name: Commit bounded diagnostic result
        run: |
          set -euo pipefail
          git config user.name 'urai-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add diagnostics/extracted
          if git diff --cached --quiet; then
            echo 'No diagnostic changes to commit.'
            exit 0
          fi
          git commit -m 'chore(diagnostics): retain Home visual failure summary'
          git push origin HEAD:diagnostics/extract-home-visual-receipt-20260729
