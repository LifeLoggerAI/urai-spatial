name: Ground mobile containment repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/ground-mobile-containment-repair.yml
      - scripts/one-shot-ground-mobile-containment.mjs

permissions:
  contents: write

concurrency:
  group: ground-mobile-containment-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  SOURCE_BRANCH: product/canonical-seven-fix-clean-r3-20260718
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'

jobs:
  repair-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'product/canonical-seven-fix-clean-r3-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply bounded Ground repair
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/one-shot-ground-mobile-containment.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            urai-tier1/src/app/GroundSpatialWorldClean.tsx \
            urai-tier1/tests/accessibility-performance-source-contract.test.mjs | sort)"

      - name: Install exact dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Run full source contracts
        run: corepack pnpm --dir urai-tier1 test

      - name: Typecheck exact repair
        run: corepack pnpm --dir urai-tier1 typecheck

      - name: Build exact static candidate
        run: |
          set -euo pipefail
          corepack pnpm build:static
          test -f urai-tier1/out/ground/index.html

      - name: Install Chromium
        run: corepack pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Prove mobile safe-area containment
        run: |
          set -euo pipefail
          corepack pnpm exec playwright test \
            --config=playwright.accessibility.config.ts \
            accessibility-performance-evidence.spec.ts \
            --project=chromium \
            --grep "mobile visible controls stay inside the visual viewport and safe area"

      - name: Publish clean Ground product commit
        run: |
          set -euo pipefail
          git rm .github/workflows/ground-mobile-containment-repair.yml scripts/one-shot-ground-mobile-containment.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ground): contain mobile direct-travel controls"
          git push origin HEAD:refs/heads/$SOURCE_BRANCH
