name: One-shot Home visual proof repair

on:
  pull_request:
    branches:
      - feat/home-ground-lifemap-art-bible-convergence-20260718
    paths:
      - .github/workflows/one-shot-home-visual-proof-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/home-visual-proof-811dd5d8-20260718
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded Home proof repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1))

          proof = Path('scripts/capture-continuous-spatial-proof.mjs')
          replace_once(proof,
              'ready: \'[data-home-spatial-renderer="webgl"][data-webgl-ready="true"] canvas\'',
              'ready: \'.urai-home-spatial-runtime-layer[data-webgl-ready="true"] [data-home-spatial-renderer="webgl"] canvas\'')
          replace_once(proof,
              "const runtime = await page.locator('[data-urai-home-runtime=\"one-continuous-webgl-world\"]').count()",
              "const runtime = await page.locator('[data-urai-home-runtime=\"embodied-continuous-webgl-world\"]').count()")
          replace_once(proof,
              "const sceneLabels = page.locator('.urai-home-spatial-threshold')\n      const sceneLabelCount = await sceneLabels.count()\n      const visibleSceneLabelCount = await visibleElementCount(sceneLabels)\n      const thresholdLabelsVisible = sceneLabelCount === 1 && visibleSceneLabelCount === 1",
              "const directDestinations = page.getByRole('navigation', { name: 'Direct Home destinations' }).getByRole('button')\n      const sceneLabelCount = await directDestinations.count()\n      const visibleSceneLabelCount = await visibleElementCount(directDestinations)\n      const thresholdLabelsVisible = sceneLabelCount === 3 && visibleSceneLabelCount === 3")
          replace_once(proof,
              "const authoredSceneMounted = await page.locator('[data-home-spatial-geometry=\"authored-sanctuary-avatar-orb-sky-ground\"]').count() === 1",
              "const authoredSceneMounted = await page.locator('.urai-home-embodied-art').count() === 1")
          replace_once(proof,
              "const gateway = page.getByRole('button', { name: 'Open the ground and descend into Hidden Infrastructure' })",
              "const gateway = page.getByRole('button', { name: 'Open Ground directly' })")
          replace_once(proof,
              "const skyGateway = page.getByRole('button', { name: 'Open the Life Map and ascend into Memory Sky' })",
              "const skyGateway = page.getByRole('button', { name: 'Open Life Map directly' })")

          home = Path('urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx')
          replace_once(home,
              "  const reducedMotion = useMediaPreference('(prefers-reduced-motion: reduce)')\n  const shellRef",
              "  const reducedMotion = useMediaPreference('(prefers-reduced-motion: reduce)')\n  useEffect(() => {\n    if (!performance.getEntriesByName('urai:first-home-spatial-frame').length) {\n      requestAnimationFrame(() => performance.mark('urai:first-home-spatial-frame'))\n    }\n  }, [])\n  const shellRef")
          PY

      - name: Prove focused source contract
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const proof = fs.readFileSync('scripts/capture-continuous-spatial-proof.mjs', 'utf8')
          const home = fs.readFileSync('urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx', 'utf8')
          const required = [
            '.urai-home-spatial-runtime-layer[data-webgl-ready="true"] [data-home-spatial-renderer="webgl"] canvas',
            'embodied-continuous-webgl-world',
            "name: 'Direct Home destinations'",
            "name: 'Open Ground directly'",
            "name: 'Open Life Map directly'",
            '.urai-home-embodied-art',
          ]
          for (const marker of required) {
            if (!proof.includes(marker)) throw new Error(`missing proof marker: ${marker}`)
          }
          if (!home.includes("performance.mark('urai:first-home-spatial-frame')")) throw new Error('missing Home first-frame marker')
          NODE
          git diff --check
          rm .github/workflows/one-shot-home-visual-proof-repair.yml
          test ! -e .github/workflows/one-shot-home-visual-proof-repair.yml

      - name: Commit clean repaired product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spatial): align Home visual proof with embodied runtime'
          git push origin HEAD:fix/home-visual-proof-811dd5d8-20260718
