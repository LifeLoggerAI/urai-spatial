name: One-time clean static memory route helpers

on:
  push:
    branches:
      - release/fix-static-memory-route-hydration-20260715
    paths:
      - '.github/workflows/one-time-clean-static-memory-route-helpers.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact cleanup candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Prove isolated branch and remove all helpers
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/fix-static-memory-route-hydration-20260715'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor 7812741e41b73df973d4796ca0930c86ca42e7ef "$GITHUB_SHA"
          mapfile -t helpers < <(find .github/workflows -maxdepth 1 -type f \( -name 'one-time-fix-static-memory-route-hydration*.yml' -o -name 'one-time-clean-static-memory-route-helpers.yml' \) -print | sort)
          test "${#helpers[@]}" = '7'
          printf 'Removing helper: %s\n' "${helpers[@]}"
          git rm -- "${helpers[@]}"
          expected="$(printf '%s\n' \
            .github/workflows/one-time-clean-static-memory-route-helpers.yml \
            .github/workflows/one-time-fix-static-memory-route-hydration-v2.yml \
            .github/workflows/one-time-fix-static-memory-route-hydration-v3.yml \
            .github/workflows/one-time-fix-static-memory-route-hydration-v4.yml \
            .github/workflows/one-time-fix-static-memory-route-hydration-v5.yml \
            .github/workflows/one-time-fix-static-memory-route-hydration-v6.yml \
            .github/workflows/one-time-fix-static-memory-route-hydration.yml | sort)"
          observed="$(git diff --cached --name-only | sort)"
          test "$observed" = "$expected"
      - name: Commit helper cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time static hydration repair helpers'
          git push origin HEAD:release/fix-static-memory-route-hydration-20260715
