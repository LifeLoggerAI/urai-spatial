name: Life Map PR 861 materialization authority

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/life-map-pr861-materialize-authority.yml'

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: life-map-pr861-materialization
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_PR: '861'
      EXPECTED_BRANCH: corrective/life-map-materialized-repair-20260720
      EXPECTED_HEAD: 3c6143c5a90d08464ce9cce37a9e1c82a4bdcbe2
      EXPECTED_MARKER: .github/repair-requests/life-map-corrective-20260720.txt
    steps:
      - name: Verify exact governed PR authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}")"
          test "$(jq -r '.state' <<<"$pr")" = open
          test "$(jq -r '.draft' <<<"$pr")" = true
          test "$(jq -r '.merged' <<<"$pr")" = false
          test "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.ref' <<<"$pr")" = "$EXPECTED_BRANCH"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          files="$(curl --fail-with-body -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}/files?per_page=100")"
          test "$(jq 'length' <<<"$files")" = 1
          test "$(jq -r '.[0].filename' <<<"$files")" = "$EXPECTED_MARKER"

      - name: Checkout trusted current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Materialize retained Life Map repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_BRANCH"
          test "$(git rev-parse origin/$EXPECTED_BRANCH)" = "$EXPECTED_HEAD"
          git checkout -B "$EXPECTED_BRANCH" origin/main
          test -s .github/patches/life-map-visual-privacy.patch.gz.b64
          base64 -d .github/patches/life-map-visual-privacy.patch.gz.b64 | gzip -dc > /tmp/life-map.patch
          git apply --check /tmp/life-map.patch
          git apply /tmp/life-map.patch
          git rm -f --ignore-unmatch \
            "$EXPECTED_MARKER" \
            .github/patches/life-map-visual-privacy.patch.gz.b64 \
            .github/scripts/apply_life_map_visual_privacy_repair.py \
            .github/workflows/apply-life-map-proof-route-repair.yml \
            .github/workflows/apply-life-map-soft-weather-repair.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main | sort)
          expected=(
            scripts/capture-continuous-spatial-proof.mjs
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx
            urai-tier1/src/components/lifemap/useLifeMapEvents.ts
            urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx
            urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
            urai-tier1/tests/lifemap-data-boundary.test.mjs
            urai-tier1/tests/lifemap-scene-behavior.test.mjs
            urai-tier1/tests/lifemap-trust-loop.test.mjs
          )
          test "${changed[*]}" = "${expected[*]}"
          grep -q 'life-map-soft-weather-veil' urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx
          ! sed -n '/function EmotionalWeather/,/function MemoryPath/p' urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx | grep -q 'planeGeometry'
          grep -q 'explicitUserId === "demo-user"' urai-tier1/src/components/lifemap/useLifeMapEvents.ts
          grep -q "path: '/life-map/?demo=1" scripts/capture-continuous-spatial-proof.mjs

      - name: Verify focused contracts, types and build
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm install --frozen-lockfile
          node --test urai-tier1/tests/lifemap-scene-behavior.test.mjs
          node --test urai-tier1/tests/lifemap-data-boundary.test.mjs
          node --test urai-tier1/tests/lifemap-trust-loop.test.mjs
          node --test urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
          pnpm --dir urai-tier1 test:lifemap
          pnpm --dir urai-tier1 typecheck
          pnpm --dir urai-tier1 build

      - name: Publish one bounded corrective commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(life-map): materialize visual privacy repair"
          git push --force-with-lease=refs/heads/$EXPECTED_BRANCH:$EXPECTED_HEAD origin HEAD:refs/heads/$EXPECTED_BRANCH

      - name: Post authority receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="PR #861 materialization authority completed with job result ${JOB_STATUS}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. PR remains draft; no merge or deployment was authorized."
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${EXPECTED_PR}/comments" \
            -d "$payload"
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
