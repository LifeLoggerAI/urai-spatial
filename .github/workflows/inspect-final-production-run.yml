name: Inspect final production run

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-final-production-run.yml'

permissions:
  actions: read
  checks: read
  contents: read
  deployments: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve exact protected production run
        id: query
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: d41c5275a359e028ff2b4b3ca37e585bcdfa8515
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/final-production-run"
          mkdir -p "$out"

          api() {
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/spatial-live-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=50" \
            > "$out/runs.json"

          OUT_DIR="$out" node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const out = process.env.OUT_DIR
          const runs = JSON.parse(fs.readFileSync(path.join(out, 'runs.json'), 'utf8')).workflow_runs || []
          const matches = runs.filter(item => item.head_sha === process.env.MERGE_SHA)
          const run = matches.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0] || null
          const report = {
            schemaVersion: 2,
            inspectedAt: new Date().toISOString(),
            mergeSha: process.env.MERGE_SHA,
            matchCount: matches.length,
            run: run && {
              id: run.id,
              event: run.event,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              status: run.status,
              conclusion: run.conclusion,
              runNumber: run.run_number,
              runAttempt: run.run_attempt,
              workflowId: run.workflow_id,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              runStartedAt: run.run_started_at,
              htmlUrl: run.html_url,
              jobsUrl: run.jobs_url,
              artifactsUrl: run.artifacts_url,
            },
          }
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2) + '\n')
          console.log(JSON.stringify(report, null, 2))
          if (!run) process.exitCode = 11
          else fs.writeFileSync(path.join(out, 'run-id.txt'), `${run.id}\n`)
          NODE

          run_id="$(tr -d '\r\n' < "$out/run-id.txt")"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "out=$out" >> "$GITHUB_OUTPUT"

          api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$out/run.json"
          api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100" > "$out/jobs.json"
          api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$out/artifacts.json"
          api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/pending_deployments" > "$out/pending-deployments.json"
          api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/deployments?sha=$MERGE_SHA&per_page=100" > "$out/deployments.json"
          api "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA/check-runs?per_page=100" > "$out/check-runs.json"

          OUT_DIR="$out" RUN_ID="$run_id" node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const out = process.env.OUT_DIR
          const read = name => JSON.parse(fs.readFileSync(path.join(out, name), 'utf8'))
          const run = read('run.json')
          const jobs = read('jobs.json').jobs || []
          const artifacts = read('artifacts.json').artifacts || []
          const pending = read('pending-deployments.json') || []
          const deployments = read('deployments.json') || []
          const checks = read('check-runs.json').check_runs || []
          const summary = {
            schemaVersion: 2,
            inspectedAt: new Date().toISOString(),
            expectedMainSha: process.env.MERGE_SHA,
            exactIdentity: run.head_sha === process.env.MERGE_SHA,
            run: {
              id: run.id,
              event: run.event,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              status: run.status,
              conclusion: run.conclusion,
              runNumber: run.run_number,
              runAttempt: run.run_attempt,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              runStartedAt: run.run_started_at,
              htmlUrl: run.html_url,
            },
            jobs: jobs.map(job => ({
              id: job.id,
              name: job.name,
              status: job.status,
              conclusion: job.conclusion,
              startedAt: job.started_at,
              completedAt: job.completed_at,
              htmlUrl: job.html_url,
              steps: (job.steps || []).map(step => ({
                number: step.number,
                name: step.name,
                status: step.status,
                conclusion: step.conclusion,
              })),
            })),
            artifacts: artifacts.map(artifact => ({
              id: artifact.id,
              name: artifact.name,
              sizeInBytes: artifact.size_in_bytes,
              expired: artifact.expired,
              createdAt: artifact.created_at,
              expiresAt: artifact.expires_at,
              digest: artifact.digest,
            })),
            pendingDeployments: pending.map(item => ({
              environmentId: item.environment && item.environment.id,
              environmentName: item.environment && item.environment.name,
              waitTimer: item.wait_timer,
              waitTimerStartedAt: item.wait_timer_started_at,
              reviewers: item.reviewers,
              currentUserCanApprove: item.current_user_can_approve,
            })),
            deployments: deployments.map(item => ({
              id: item.id,
              sha: item.sha,
              ref: item.ref,
              environment: item.environment,
              task: item.task,
              createdAt: item.created_at,
              updatedAt: item.updated_at,
              statusesUrl: item.statuses_url,
            })),
            checks: checks.map(item => ({
              id: item.id,
              name: item.name,
              status: item.status,
              conclusion: item.conclusion,
              startedAt: item.started_at,
              completedAt: item.completed_at,
              detailsUrl: item.details_url,
              outputTitle: item.output && item.output.title,
              annotationsCount: item.output && item.output.annotations_count,
            })),
          }
          fs.writeFileSync(path.join(out, 'summary.json'), JSON.stringify(summary, null, 2) + '\n')
          console.log(JSON.stringify(summary, null, 2))
          if (!summary.exactIdentity) process.exitCode = 12
          NODE

      - name: Upload final run resolver receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-production-run-d41c5275a359e028ff2b4b3ca37e585bcdfa8515
          path: ${{ steps.query.outputs.out }}
          if-no-files-found: error
          retention-days: 30
