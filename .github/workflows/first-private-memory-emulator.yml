name: RFINAL First Private Memory Firebase Emulator (Non-release)
on:
  pull_request:
    paths:
      - '.github/workflows/first-private-memory-emulator.yml'
      - 'apps/functions/src/**'
      - 'apps/functions/scripts/first-private-memory-emulator-proof.cjs'
      - 'scripts/run-first-private-memory-emulator.mjs'
      - 'urai-tier1/src/lib/privacy/importFirstPreparedMemory.ts'
      - 'urai-tier1/tests/import-first-prepared-memory.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [repair/rfinal-convergence-candidate-20261020]
    paths:
      - '.github/workflows/first-private-memory-emulator.yml'
      - 'apps/functions/src/createFirstPrivateMemory.ts'
      - 'apps/functions/src/firstPrivateMemoryPacket.ts'
      - 'apps/functions/scripts/first-private-memory-emulator-proof.cjs'
      - 'scripts/run-first-private-memory-emulator.mjs'
      - 'urai-tier1/src/lib/privacy/importFirstPreparedMemory.ts'
      - 'urai-tier1/tests/import-first-prepared-memory.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: first-private-memory-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
env:
  CI: 'true'
  URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  FIREBASE_CLI_DISABLE_USAGE_REPORTING: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  isolated-real-firestore:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source with no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact clean source and parser
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(node -p 'require("./package.json").packageManager')" = 'pnpm@10.0.0'
          node --check scripts/run-first-private-memory-emulator.mjs
          node --check apps/functions/scripts/first-private-memory-emulator-proof.cjs
          mkdir -p "$RUNNER_TEMP/urai-first-memory"
          git rev-parse HEAD > "$RUNNER_TEMP/urai-first-memory/exact-head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/urai-first-memory/exact-tree.txt"
          sha256sum scripts/run-first-private-memory-emulator.mjs apps/functions/scripts/first-private-memory-emulator-proof.cjs apps/functions/src/createFirstPrivateMemory.ts urai-tier1/src/lib/privacy/importFirstPreparedMemory.ts > "$RUNNER_TEMP/urai-first-memory/source-files.sha256"
      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact dependencies
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          test "$(pnpm --version)" = '10.0.0'
          test "$(node --version | cut -d. -f1)" = 'v22'
          java -version
          pnpm install --frozen-lockfile
      - name: Run actual maintained source regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir urai-tier1 exec node --import tsx --test tests/import-first-prepared-memory.test.mjs 2>&1 | tee "$RUNNER_TEMP/urai-first-memory/importer-test.tap"
          pnpm --filter urai-functions test 2>&1 | tee "$RUNNER_TEMP/urai-first-memory/functions-test.tap"
      - name: Run local real Auth Firestore Functions emulator
        # Preserve the independent Firebase receipt even if a maintained test fails.
        # Neither failure is waived; the failing test step keeps the job red.
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-first-private-memory-emulator.mjs --preflight 2>&1 | tee "$RUNNER_TEMP/urai-first-memory/emulator-preflight.log"
          node scripts/run-first-private-memory-emulator.mjs --execute 2>&1 | tee "$RUNNER_TEMP/urai-first-memory/actual-emulator.log"
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          sha256sum -c "$RUNNER_TEMP/urai-first-memory/source-files.sha256"
          printf '%s\n' 'Synthetic local emulator only. No private media, cloud, browser playback, external review or production release acceptance.' > "$RUNNER_TEMP/urai-first-memory/scope.txt"
      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-memory-emulator-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/urai-first-memory
          if-no-files-found: warn
          retention-days: 14
