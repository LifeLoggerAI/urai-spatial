name: Life Map Founder Contract Repair One Shot

on:
  push:
    branches:
      - public-footprint-entity-authority-20260903
    paths:
      - '.github/workflows/lifemap-founder-contract-repair-one-shot.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: public-footprint-entity-authority-20260903
          fetch-depth: 0

      - name: Repair checked-in Founder proof contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          capture = Path('scripts/capture-lifemap-founder-proof-fixed.mjs')
          source = capture.read_text()
          before = 'async function readJourneyPhaseWatch(page, expectedPhase, timeout = 12_000) {'
          after = 'async function readJourneyPhaseWatch(page, expectedPhase, timeout = 30_000) {'
          if source.count(before) != 1:
            raise SystemExit(f'expected exactly one Founder phase-watch timeout marker, found {source.count(before)}')
          capture.write_text(source.replace(before, after))

          launcher = Path('scripts/run-lifemap-founder-proof-fixed.mjs')
          launcher.write_text("""import { spawnSync } from 'node:child_process'\nimport path from 'node:path'\n\nconst runnerPath = path.resolve('scripts/capture-lifemap-founder-proof-fixed.mjs')\nconst syntax = spawnSync(process.execPath, ['--check', runnerPath], { encoding: 'utf8' })\nif (syntax.status !== 0) {\n  const detail = [syntax.stdout, syntax.stderr].filter(Boolean).join('\\n').trim()\n  throw new Error(`Checked-in Founder capture runner failed syntax validation${detail ? `:\\n${detail}` : ''}`)\n}\n\nconsole.log(`FOUNDER_CAPTURE_SYNTAX_OK ${runnerPath}`)\nif (!process.argv.includes('--validate-only')) {\n  await import('../scripts/capture-lifemap-founder-proof-fixed.mjs')\n}\n""")

          workflow = Path('.github/workflows/lifemap-founder-visual-proof.yml')
          source = workflow.read_text()
          if source.count('retention-days: 365') != 1:
            raise SystemExit(f'expected exactly one Founder retention marker, found {source.count("retention-days: 365")}')
          workflow.write_text(source.replace(
            '          retention-days: 365',
            '          # Public-repository GitHub artifact retention is capped at 90 days.\n          # Longer-lived evidence requires a separately verified durable archive.\n          retention-days: 90',
          ))
          PY

          node --check scripts/capture-lifemap-founder-proof-fixed.mjs
          node --check scripts/run-lifemap-founder-proof-fixed.mjs
          node scripts/run-lifemap-founder-proof-fixed.mjs --validate-only
          node --test urai-tier1/tests/lifemap-founder-harness-contract.test.mjs
          git diff --check

      - name: Remove one-shot executor and push successor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lifemap-founder-contract-repair-one-shot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/capture-lifemap-founder-proof-fixed.mjs scripts/run-lifemap-founder-proof-fixed.mjs .github/workflows/lifemap-founder-visual-proof.yml .github/workflows/lifemap-founder-contract-repair-one-shot.yml
          git commit -m 'test: keep Founder phase observation checked-in and immutable'
          git push origin HEAD:public-footprint-entity-authority-20260903
