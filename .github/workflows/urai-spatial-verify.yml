name: URAI Spatial Verify

on:
  push:
    branches:
      - main
      - tier-1-5-final-lock
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-spatial-verify-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify URAI Spatial
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: URAI Guardian
        run: node scripts/urai-guardian.mjs

      - name: Install dependencies
        run: corepack pnpm install --no-frozen-lockfile

      - name: Check public copy
        run: corepack pnpm check:public-copy

      - name: Check Firestore boundaries
        run: corepack pnpm test:rules

      - name: Typecheck
        run: corepack pnpm check:types

      - name: Unit tests
        run: corepack pnpm test:unit

      - name: Build
        run: corepack pnpm build

      - name: Release gate
        run: corepack pnpm release:p1
