name: Life Map proof route comment authority

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: life-map-proof-route-comment-authority
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.issue.number == 857 && github.event.issue.pull_request && github.event.comment.body == '/run-life-map-proof-route-finalize-4e802bbe'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: 4e802bbeeb52790b954aed4500c43f7d9e426754
      TARGET_BRANCH: repair/life-map-proof-route-finalize-20260720
    steps:
      - name: Checkout exact finalization head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded proof-route correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          from pathlib import Path

          capture = Path('scripts/capture-continuous-spatial-proof.mjs')
          text = capture.read_text()
          replacements = {
              "    path: '/life-map/',": "    path: '/life-map/?demo=1',",
              "    path: '/life-map/?memoryId=quiet-reset&manifestId=replay-recovery-thread&node=quiet-reset',": "    path: '/life-map/?demo=1&memoryId=demo%3Aquiet-reset&manifestId=replay-recovery-thread&node=quiet-reset',",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one proof route {old!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          capture.write_text(text)

          audit = Path('scripts/live-visual-audit.mjs')
          text = audit.read_text()
          old = "    route: '/life-map',"
          new = "    route: '/life-map?demo=1',"
          if text.count(old) != 1:
              raise SystemExit(f'expected one unsigned Life Map audit route, found {text.count(old)}')
          audit.write_text(text.replace(old, new, 1))
          PY
          git rm -f --ignore-unmatch \
            .github/proof-route-finalize.trigger \
            .github/workflows/apply-life-map-proof-finalize.yml \
            .github/workflows/apply-life-map-proof-route-repair.yml \
            .github/workflows/life-map-proof-route-comment-authority.yml \
            .github/workflows/life-map-proof-route-final-authority.yml
          grep -F "path: '/life-map/?demo=1'," scripts/capture-continuous-spatial-proof.mjs
          grep -F "path: '/life-map/?demo=1&memoryId=demo%3Aquiet-reset&manifestId=replay-recovery-thread&node=quiet-reset'," scripts/capture-continuous-spatial-proof.mjs
          grep -F "route: '/life-map?demo=1'," scripts/live-visual-audit.mjs
          node --check scripts/capture-continuous-spatial-proof.mjs
          node --check scripts/live-visual-audit.mjs
          node --check scripts/run-live-visual-audit-current.mjs
          git diff --check

      - name: Verify focused contracts, types and build
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile
          node --test urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
          node --test urai-tier1/tests/lifemap-scene-behavior.test.mjs
          corepack pnpm --dir urai-tier1 typecheck
          corepack pnpm --dir urai-tier1 build

      - name: Publish exact proof correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(proof): capture explicit Life Map demo routes"
          git push --force-with-lease=refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD origin HEAD:refs/heads/$TARGET_BRANCH

      - name: Post authority receipt
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Life Map proof-finalization authority receipt.',
              '',
              `- expected head: \`${process.env.EXPECTED_HEAD}\``,
              `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'This lane changes proof route identity and removes temporary authorities. No merge or deployment is performed.'
            ].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 857, body });
