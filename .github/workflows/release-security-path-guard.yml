name: Release Security Path Guard

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/live-release.mjs'
      - 'scripts/create-static-release-bundle.mjs'
      - 'scripts/attest-static-release-bundle.mjs'
      - 'scripts/write-release-fingerprint.mjs'
      - 'scripts/verify-live-rollback-provenance.mjs'
      - 'scripts/verify-release-credential-boundary.mjs'
      - 'scripts/verify-release-credential-boundary-static.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'scripts/urai-release-control-smoke.mjs'
      - 'urai-tier1/tests/exact-static-release-contract.test.mjs'
      - '.github/workflows/spatial-live-deploy.yml'
      - '.github/workflows/release-security-path-guard.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'scripts/live-release.mjs'
      - 'scripts/create-static-release-bundle.mjs'
      - 'scripts/attest-static-release-bundle.mjs'
      - 'scripts/write-release-fingerprint.mjs'
      - 'scripts/verify-live-rollback-provenance.mjs'
      - 'scripts/verify-release-credential-boundary.mjs'
      - 'scripts/verify-release-credential-boundary-static.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'scripts/urai-release-control-smoke.mjs'
      - 'urai-tier1/tests/exact-static-release-contract.test.mjs'
      - '.github/workflows/spatial-live-deploy.yml'
      - '.github/workflows/release-security-path-guard.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-security-path-guard-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-release-security-authority:
    name: Verify release security authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact clean source identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SHA='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check release security executables
        run: |
          node --check scripts/live-release.mjs
          node --check scripts/create-static-release-bundle.mjs
          node --check scripts/attest-static-release-bundle.mjs
          node --check scripts/verify-live-rollback-provenance.mjs
          node --check scripts/verify-release-credential-boundary.mjs
          node --check scripts/verify-release-credential-boundary-static.mjs
          node --check scripts/audit-production-workflow-authority.mjs
          node --check urai-tier1/tests/exact-static-release-contract.test.mjs
      - name: Audit production workflow authority
        run: node scripts/audit-production-workflow-authority.mjs
      - name: Verify release credential boundary
        run: node scripts/verify-release-credential-boundary.mjs
      - name: Verify rollback-provenance policy
        run: node scripts/verify-live-rollback-provenance.mjs --self-test
      - name: Verify exact static release contract
        run: node urai-tier1/tests/exact-static-release-contract.test.mjs
