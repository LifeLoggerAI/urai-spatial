            'v31-heavy-asymmetric-side-walls-buttresses-and-recesses':'v32-asymmetric-tapered-load-bearing-side-pylons',
            'v31-structural-vault-ribs-terminate-in-wall-masses':'v32-grounded-vault-frames-and-roof-shell-no-floating-tubes',
            'v31-monumental-machine-apse-sanctuary-built-around-orb':'v32-reliquary-niche-built-into-sanctuary-shell',
            'foreground-midground-background-depth-and-material-separation':'v32-foreground-midground-background-massed-depth',
            'v31-buried-rectilinear-machine-base-no-display-pedestal':'v32-no-display-platform-only-embedded-machine-feet',
            'v31-sanctuary-scale-three-point-armored-reliquary-dock':'v32-sanctuary-scale-three-point-reliquary-machine',
            'v31-heavy-housings-load-arms-contact-jaws-drive-collars-conduits-no-stem':'v32-massive-housings-jaws-gussets-and-rear-armature-no-stem',
            'v31-segmented-load-bearing-yoke-not-display-halo':'v32-rear-load-armature-not-display-halo',
            'v31-integrated-reliquary-sanctuary-final':'v32-monolithic-reliquary-sanctuary-final',
          }
          for old,new in replacements.items():
              assert old in text, old
              text = text.replace(old,new)
          text = text.replace("! grep -F 'v30-enclosed-authored-sanctuary-no-test-pavilion' \"$source\"", "! grep -F 'v31-finished-authored-sanctuary-no-pavilion-grid' \"$source\"\n          ! grep -F 'v30-enclosed-authored-sanctuary-no-test-pavilion' \"$source\"", 1)
          verifier.write_text(text)
          PY

      - name: Verify V32 contracts and production build
