          for marker in required: assert marker in source, marker
          assert '<SanctuaryCeiling />' not in source
          assert '<primitive object={authoredOrb} visible={false} />' in source
          path.write_text(source)

          verifier = Path('.github/workflows/home-scanned-composition-forge.yml')
          text = verifier.read_text()
          replacements = {
            'v31-finished-authored-sanctuary-no-pavilion-grid':'v32-monolithic-extruded-sanctuary-no-box-room',
