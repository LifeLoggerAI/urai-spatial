name: One-time AAA doorway finalize

on:
  push:
    branches:
      - fix/aaa-proof-source-identity-20260716
    paths:
      - .github/workflows/one-time-aaa-doorway-finalize.yml

permissions:
  contents: write

concurrency:
  group: one-time-aaa-doorway-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'LifeLoggerAI/urai-spatial'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: ecb9417e6c736bc046fe09cfbf2676a918368385
      BRANCH: fix/aaa-proof-source-identity-20260716
    steps:
      - name: Checkout exact bootstrap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify bounded bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/one-time-aaa-doorway-finalize.yml"

      - name: Apply final doorway and proof repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected source in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          life = 'urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx'
          replace(
              life,
              '  const selectedNode = useMemo(() => nodes.find((node) => node.id === selectedId) || null, [nodes, selectedId]);',
              '  const selectedNode = useMemo(() => nodes.find((node) => node.id === selectedId) || null, [nodes, selectedId]);\n  const routeNode = selectedNode || nodes.find((node) => node.id === "quiet-reset") || nodes[0] || null;'
          )
          replace(
              life,
              '<span className="mt-3 block max-w-[290px] text-xs font-bold leading-5 text-cyan-50/70">Drag, wheel, or select. Focus and Replay keep the same memory identity and return context.</span>',
              '<span className="mt-3 block max-w-[290px] text-xs font-bold leading-5 text-cyan-50/70">Select a memory star. Drag or wheel to explore. Focus and Replay keep the same memory identity and return context.</span>'
          )
          replace(
              life,
              '''        {selectedNode ? <button type="button" onClick={() => router.push(identityHref("focus", selectedNode))} className="rounded-full border border-cyan-100/10 px-3 py-1.5 text-[10px] font-black text-cyan-50/78">Focus</button> : null}
        {selectedNode?.replayAvailable ? <button type="button" onClick={() => router.push(identityHref("replay", selectedNode))} className="rounded-full border border-cyan-100/10 px-3 py-1.5 text-[10px] font-black text-cyan-50/78">Replay</button> : null}''',
              '''        <button type="button" data-urai-audit-action="life-map-focus" disabled={!routeNode} onClick={() => routeNode && router.push(identityHref("focus", routeNode))} className="rounded-full border border-cyan-100/10 px-3 py-1.5 text-[10px] font-black text-cyan-50/78 disabled:opacity-40">Focus</button>
        <button type="button" data-urai-audit-action="life-map-replay" disabled={!routeNode?.replayAvailable || routeNode.locked} onClick={() => routeNode && router.push(identityHref("replay", routeNode))} className="rounded-full border border-cyan-100/10 px-3 py-1.5 text-[10px] font-black text-cyan-50/78 disabled:opacity-40">Replay</button>'''
          )

          audit = Path('scripts/live-visual-audit.mjs')
          text = audit.read_text()
          replacements = {
              "markers: ['Your real life has a place', 'private operating world']": "markers: ['Your private workforce.', 'Nothing acts without you']",
              "markers: ['Life Map', 'Wheel', 'Drag', 'memory star']": "markers: ['Step inside the map.', 'Select a memory star', 'Focus', 'Replay']",
              "markers: ['The Quiet Reset', 'Selected memory camera chamber', 'Replay']": "markers: ['The Quiet Reset', 'Selected memory chamber.', 'Replay']",
              "markers: ['World online', 'Route matrix', 'Tracked']": "markers: ['Launch locked. Proof before expansion.', 'Tracked', 'Pending proof']",
              "markers: ['Step inside the Life Map', 'Quest', 'manual']": "markers: ['Explorable entry chamber', 'Enter VR in Quest', 'Desktop and mobile']",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing stale audit marker: {old}')
              text = text.replace(old, new, 1)
          audit.write_text(text)

          runner = 'urai-tier1/scripts/run-unit-contract-tests-compact.mjs'
          replace(
              runner,
              "  'tests/post-deploy-ground-smoke-contract.test.mjs',\n",
              "  'tests/post-deploy-ground-smoke-contract.test.mjs',\n  'tests/persistent-world-doorway-regression.test.mjs',\n"
          )
          PY

      - name: Validate final repairs
        shell: bash
        run: |
          set -euo pipefail
          cd urai-tier1
          node --test tests/persistent-world-doorway-regression.test.mjs
          node ../scripts/run-pnpm.mjs check:types

      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/live-visual-audit.mjs \
            urai-tier1/scripts/run-unit-contract-tests-compact.mjs \
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize Life Map doorway and AAA proof contract'
          git push origin "HEAD:$BRANCH"

      - name: Remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-aaa-doorway-finalize.yml
          git commit -m 'Remove one-time AAA doorway finalizer'
          git push origin "HEAD:$BRANCH"
