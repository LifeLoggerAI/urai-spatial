name: One-time AAA doorway finalize

on:
  push:
    branches:
      - fix/aaa-proof-source-identity-20260716
    paths:
      - .github/workflows/one-time-aaa-doorway-finalize.yml

permissions:
  contents: write

concurrency:
  group: one-time-aaa-doorway-finalize
  cancel-in-progress: false

jobs:
  finalize:
    if: github.repository == 'LifeLoggerAI/urai-spatial'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_PARENT: a426b420a951148631fcaa6acb11cf36df79ab42
      BRANCH: fix/aaa-proof-source-identity-20260716
    steps:
      - name: Checkout exact bootstrap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify bounded bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/one-time-aaa-doorway-finalize.yml"

      - name: Align AAA proof contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          audit = Path('scripts/live-visual-audit.mjs')
          text = audit.read_text()
          replacements = {
              "markers: ['Your real life has a place', 'private operating world']": "markers: ['Your private workforce.', 'Nothing acts without you']",
              "markers: ['Life Map', 'Wheel', 'Drag', 'memory star']": "markers: ['Step inside the map.', 'Focus', 'Replay']",
              "markers: ['The Quiet Reset', 'Selected memory camera chamber', 'Replay']": "markers: ['The Quiet Reset', 'Selected memory chamber.', 'Replay']",
              "markers: ['World online', 'Route matrix', 'Tracked']": "markers: ['Launch locked. Proof before expansion.', 'Tracked', 'Pending proof']",
              "markers: ['Step inside the Life Map', 'Quest', 'manual']": "markers: ['Explorable entry chamber', 'Enter VR in Quest', 'Desktop and mobile']",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing stale audit marker: {old}')
              text = text.replace(old, new, 1)
          audit.write_text(text)

          runner = Path('urai-tier1/scripts/run-unit-contract-tests-compact.mjs')
          text = runner.read_text()
          old = "  'tests/post-deploy-ground-smoke-contract.test.mjs',\n"
          new = old + "  'tests/persistent-world-doorway-regression.test.mjs',\n"
          if old not in text:
              raise SystemExit('missing unit runner insertion point')
          runner.write_text(text.replace(old, new, 1))
          PY

      - name: Validate final contracts
        shell: bash
        run: |
          set -euo pipefail
          cd urai-tier1
          node --test tests/persistent-world-doorway-regression.test.mjs
          node ../scripts/run-pnpm.mjs check:types

      - name: Commit permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/live-visual-audit.mjs urai-tier1/scripts/run-unit-contract-tests-compact.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align AAA visual proof with current canon'
          git push origin "HEAD:$BRANCH"

      - name: Remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-time-aaa-doorway-finalize.yml
          git commit -m 'Remove one-time AAA doorway finalizer'
          git push origin "HEAD:$BRANCH"
