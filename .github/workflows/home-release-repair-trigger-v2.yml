name: Home Release Repair Trigger V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-release-repair-trigger-v2.yml'

permissions:
  contents: write
  pull-requests: write

env:
  EXPECTED_PARENT: 2e41ec5a863981f31d576516f96758645aea4807
  EXPECTED_BRANCH: fix/home-provider-preview-composition-20260804

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/home-provider-preview-composition-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
          persist-credentials: true
          show-progress: false

      - name: Prove trigger-only successor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/home-release-repair-trigger-v2.yml"
          test -f .github/workflows/home-release-repair-executor.yml
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Execute embedded bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const source = await readFile('.github/workflows/home-release-repair-executor.yml', 'utf8')
          const markerStart = "          node --input-type=module <<'NODE'\n"
          const markerEnd = "\n          NODE\n\n      - name: Remove one-time executor and verify bounded diff"
          const start = source.indexOf(markerStart)
          const end = source.indexOf(markerEnd)
          if (start < 0 || end < 0 || end <= start) throw new Error('embedded repair program markers not found')
          const indented = source.slice(start + markerStart.length, end)
          const program = indented.split('\n').map((line) => line.startsWith('          ') ? line.slice(10) : line).join('\n')
          await writeFile('/tmp/home-release-repair.mjs', program)
          NODE
          node /tmp/home-release-repair.mjs

      - name: Verify bounded source output
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/home-canonical-release-composition-contract.test.mjs
          test -f .github/workflows/bounded-home-visual-proof.yml
          test -f scripts/run-bounded-home-proof-case.mjs
          grep -F "desktop-1366x768" .github/workflows/bounded-home-visual-proof.yml
          grep -F "desktop-1440x1000" .github/workflows/bounded-home-visual-proof.yml
          grep -F "desktop-1440x1100" .github/workflows/bounded-home-visual-proof.yml
          grep -F "portrait-mobile" .github/workflows/bounded-home-visual-proof.yml
          grep -F "landscape-mobile" .github/workflows/bounded-home-visual-proof.yml
          grep -F "if: always()" .github/workflows/bounded-home-visual-proof.yml

      - name: Remove one-time workflows and commit product successor
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/home-release-repair-executor.yml
          rm .github/workflows/home-release-repair-trigger-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair canonical Home composition and bound visual proof'
          test ! -e .github/workflows/home-release-repair-executor.yml
          test ! -e .github/workflows/home-release-repair-trigger-v2.yml
          test -z "$(git status --porcelain --untracked-files=all)"
          git push origin "HEAD:$EXPECTED_BRANCH"
