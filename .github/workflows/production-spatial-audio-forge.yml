name: Production Spatial Audio Forge

on:
  push:
    branches:
      - agent/real-world-home-production-completion-20260808
    paths:
      - 'scripts/generate-production-spatial-audio.py'
      - '.github/workflows/production-spatial-audio-forge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: urai-production-spatial-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forge-and-promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Prove source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install deterministic forge dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'numpy==2.3.5'
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Forge and verify production Opus pack
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate-production-spatial-audio.py

      - name: Prove bounded output set
        shell: bash
        run: |
          set -euo pipefail
          expected='home-ambient-v1.opus ground-ambient-v1.opus life-map-ambient-v1.opus focus-ambient-v1.opus replay-ambient-v1.opus portal-transition-v1.opus orb-confirm-v1.opus ui-error-v1.opus'
          for file in $expected; do
            test -s "urai-tier1/public/assets/urai/generated/audio/$file"
          done
          test -s operations/assets/production-receipts/spatial-audio-production-v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path('operations/assets/production-receipts/spatial-audio-production-v1.json').read_text())
          assert receipt['verification']['passed'] is True
          assert receipt['historicalEightSecondProofBedPromoted'] is False
          assert len(receipt['assets']) == 8
          assert all(a['codec'] == 'opus' and a['channels'] == 2 for a in receipt['assets'])
          assert all(a['integratedLufs'] <= -16 and a['truePeakDbtp'] <= -1 for a in receipt['assets'])
          assert all(a['durationSeconds'] >= 59 for a in receipt['assets'] if a['role'] == 'ambient')
          PY

      - name: Commit canonical binary pack to controlling PR branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add \
            urai-tier1/public/assets/urai/generated/audio/home-ambient-v1.opus \
            urai-tier1/public/assets/urai/generated/audio/ground-ambient-v1.opus \
            urai-tier1/public/assets/urai/generated/audio/life-map-ambient-v1.opus \
            urai-tier1/public/assets/urai/generated/audio/focus-ambient-v1.opus \
            urai-tier1/public/assets/urai/generated/audio/replay-ambient-v1.opus \
            urai-tier1/public/assets/urai/generated/audio/portal-transition-v1.opus \
            urai-tier1/public/assets/urai/generated/audio/orb-confirm-v1.opus \
            urai-tier1/public/assets/urai/generated/audio/ui-error-v1.opus \
            operations/assets/production-receipts/spatial-audio-production-v1.json
          if git diff --cached --quiet; then
            echo 'Production audio pack already matches deterministic forge.'
            exit 0
          fi
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git commit -m 'Promote verified production spatial audio pack'
          git push origin "HEAD:${TARGET_BRANCH}"
