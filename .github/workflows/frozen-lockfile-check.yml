name: Frozen Lockfile Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - "**/package.json"
      - ".github/workflows/**"

env:
  URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  frozen-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install exactly the committed dependency graph
        run: pnpm install --frozen-lockfile
      - name: Prove install did not rewrite the lockfile
        run: git diff --exit-code -- pnpm-lock.yaml
