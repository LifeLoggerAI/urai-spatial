name: Sync Replay branch with main

on:
  push:
    branches:
      - repair/replay-spatial-world-20260721

permissions:
  contents: write

concurrency:
  group: sync-replay-with-main
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Replay branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repair/replay-spatial-world-20260721
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          git rm .github/workflows/sync-replay-with-main.yml
          git commit -m "chore(replay): remove one-shot branch sync workflow"
          git push origin HEAD:repair/replay-spatial-world-20260721
