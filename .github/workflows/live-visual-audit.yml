name: URAI Live Visual Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/live-visual-audit.yml'
      - 'scripts/live-visual-audit.mjs'
      - 'scripts/**'
      - 'urai-tier1/src/app/**'
      - 'urai-tier1/src/spatial/**'
      - 'urai-tier1/scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write
  actions: read

jobs:
  live-visual-audit:
    name: Screenshot and link audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm --version

      - name: Install workspace
        env:
          URAI_MIN_INSTALL_FREE_MB: '256'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run live visual audit
        id: audit
        continue-on-error: true
        env:
          URAI_AUDIT_BASE_URL: https://urai.app
          URAI_AUDIT_OUT_DIR: live-visual-audit
        run: node scripts/live-visual-audit.mjs

      - name: Print audit summary
        if: always()
        run: |
          if [ -f live-visual-audit/visual-audit-summary.md ]; then
            cat live-visual-audit/visual-audit-summary.md
            cat live-visual-audit/visual-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "visual-audit-summary.md was not created" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: urai-live-visual-audit
          path: live-visual-audit
          if-no-files-found: error

      - name: Require audit report artifact files
        if: always()
        run: |
          test -f live-visual-audit/visual-audit.json
          test -f live-visual-audit/visual-audit-summary.md
          test -d live-visual-audit/screenshots

      - name: Persist latest audit report in repo
        if: always()
        run: |
          mkdir -p docs/live-audit
          cp live-visual-audit/visual-audit-summary.md docs/live-audit/latest-visual-audit-summary.md
          cp live-visual-audit/visual-audit.json docs/live-audit/latest-visual-audit.json
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('live-visual-audit/visual-audit.json','utf8')); const names=(a.routes||[]).map(r=>r.screenshot).filter(Boolean).map(p=>p.split('/').pop()); fs.writeFileSync('docs/live-audit/latest-screenshots.txt', names.join('\n')+'\n');"
          git config user.name "urai-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/live-audit/latest-visual-audit-summary.md docs/live-audit/latest-visual-audit.json docs/live-audit/latest-screenshots.txt
          if git diff --cached --quiet; then
            echo "No audit report changes to commit."
          else
            git commit -m "Persist latest live visual audit report"
            git push
          fi
