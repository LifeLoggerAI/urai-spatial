name: System Loop Runtime

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/check-system-loop-runtime.mjs"
      - "scripts/smoke-system-loop-runtime.mjs"
      - "tsconfig.runtime.json"
      - ".github/workflows/system-loop-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/check-system-loop-runtime.mjs"
      - "scripts/smoke-system-loop-runtime.mjs"
      - "tsconfig.runtime.json"
      - ".github/workflows/system-loop-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-loop-runtime-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  runtime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check SystemLoop runtime
        run: node scripts/check-system-loop-runtime.mjs

      - name: Capture SystemLoop smoke evidence
        id: smoke
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p artifacts/system-loop
          node scripts/smoke-system-loop-runtime.mjs 2>&1 | tee artifacts/system-loop/system-loop-smoke.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload SystemLoop smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: system-loop-smoke-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: artifacts/system-loop/system-loop-smoke.log
          if-no-files-found: error
          # Public-repository GitHub artifact retention is capped at 90 days.
          # Longer-lived evidence requires a separately verified durable archive.
          retention-days: 90

      - name: Enforce SystemLoop smoke result
        shell: bash
        run: test "${{ steps.smoke.outputs.status }}" = "0"

      - name: Restore and prove final clean candidate identity
        if: always()
        shell: bash
        run: |
          rm -rf artifacts/system-loop dist-runtime
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
