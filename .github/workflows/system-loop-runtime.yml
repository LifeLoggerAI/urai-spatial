name: System Loop Runtime

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/check-system-loop-runtime.mjs"
      - "tsconfig.runtime.json"
      - ".github/workflows/system-loop-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/check-system-loop-runtime.mjs"
      - "tsconfig.runtime.json"
      - ".github/workflows/system-loop-runtime.yml"
  workflow_dispatch:

jobs:
  runtime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check SystemLoop runtime
        run: node scripts/check-system-loop-runtime.mjs
