name: Life Map Product Repair Publisher

on:
  push:
    branches:
      - feat/life-map-aaa-final-production-20260723
    paths:
      - '.github/workflows/lifemap-product-repair-publisher.yml'

permissions:
  contents: write

concurrency:
  group: lifemap-product-repair-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Extract reviewed product-only payload
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/lifemap-bounded-review-repair.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          payload = source[start:end]
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines())
          helper_start = normalized.index('def replace_once(')
          helper_end = normalized.index('\n\nscene =', helper_start)
          helper = '''def replace_once(path: Path, old: str, new: str) -> None:
              import re
              text = path.read_text()
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new, 1))
                  return
              lines = [line.strip() for line in old.splitlines() if line.strip()]
              pattern = re.compile(r'[ \\t]*\\n[ \\t]*'.join(re.escape(line) for line in lines))
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one whitespace-safe match, found {len(matches)}")
              match = matches[0]
              replacement = new.strip('\\n')
              path.write_text(text[:match.start()] + replacement + text[match.end():])'''
          normalized = normalized[:helper_start] + helper + normalized[helper_end:]
          workflow_start = normalized.index('\nworkflow = Path(')
          normalized = normalized[:workflow_start] + '\n'
          Path('/tmp/lifemap-product-only-repair.py').write_text(normalized)
          PY
          set +e
          python3 /tmp/lifemap-product-only-repair.py > /tmp/lifemap-product-only-repair.log 2>&1
          status=$?
          set -e
          cat /tmp/lifemap-product-only-repair.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Retain product-only diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemap-product-only-repair-${{ github.sha }}
          path: /tmp/lifemap-product-only-repair.log
          if-no-files-found: error
          retention-days: 30

      - name: Verify and publish reviewed product repair
        if: steps.execute.outputs.status == '0'
        shell: bash
        run: |
          set -euxo pipefail
          node --check scripts/verify-lifemap-canvas-proof.mjs
          git diff --check
          grep -q 'function selectedStagePoint' urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx
          grep -q 'setPhase("arrival")' urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx
          grep -q 'retained-webgl-canvas-png' scripts/verify-lifemap-canvas-proof.mjs
          git config user.name 'urai-release-bot'
          git config user.email actions@users.noreply.github.com
          git add urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx scripts/verify-lifemap-canvas-proof.mjs
          git commit -m 'fix(life-map): repair camera journey and canvas proof'
          git push origin HEAD:feat/life-map-aaa-final-production-20260723

      - name: Fail on product repair assertion
        if: steps.execute.outputs.status != '0'
        run: exit 1
