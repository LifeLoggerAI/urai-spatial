name: Life Map post-reset isolation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - product/canonical-six-fix-clean-v3-20260718
    paths:
      - .github/workflows/lifemap-post-reset-isolation.yml
      - scripts/capture-lifemap-post-reset-isolation.mjs

permissions:
  contents: read

concurrency:
  group: lifemap-post-reset-isolation-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  CLEAN_BASE: 23cd1bb1aef71f3f43c97b5bdbf557a64e9b1b48

jobs:
  isolate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diag/lifemap-post-reset-isolation-23cd1bb1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Prove diagnostic-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$CLEAN_BASE" HEAD)" = "$CLEAN_BASE"
          actual="$(git diff --name-only "$CLEAN_BASE...HEAD" | sort)"
          expected="$(printf '%s\n' .github/workflows/lifemap-post-reset-isolation.yml scripts/capture-lifemap-post-reset-isolation.mjs | sort)"
          test "$actual" = "$expected"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Build exact static candidate
        run: corepack pnpm build:static

      - name: Install Chromium
        run: corepack pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Capture post-reset isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lifemap-post-reset-isolation
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > /tmp/lifemap-post-reset-isolation-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/life-map/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/life-map/ >/dev/null
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_PROOF_DIR=/tmp/lifemap-post-reset-isolation \
            node scripts/capture-lifemap-post-reset-isolation.mjs

      - name: Retain post-reset isolation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemap-post-reset-isolation-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            /tmp/lifemap-post-reset-isolation
            /tmp/lifemap-post-reset-isolation-http.log
          if-no-files-found: error
          retention-days: 30
