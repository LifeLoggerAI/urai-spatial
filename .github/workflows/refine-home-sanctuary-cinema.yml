name: Refine Home Sanctuary Cinema

on:
  push:
    branches:
      - agent/replace-failed-home-lifemap-visuals
    paths:
      - .github/workflows/refine-home-sanctuary-cinema.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/replace-failed-home-lifemap-visuals
          fetch-depth: 1
      - name: Recompose sanctuary presentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('urai-tier1/src/spatial/layout/HomeWorldProduction.tsx')
          text = p.read_text()
          replacements = {
            'material.color.set("#405344");\n    material.emissive.set("#071109");\n    material.emissiveIntensity = 0.055;': 'material.color.set("#5f765d");\n    material.emissive.set("#18251a");\n    material.emissiveIntensity = 0.12;\n    material.map = null;\n    material.normalMap = null;',
            'material.color.set("#315c38");\n    material.emissive.set("#071c0d");\n    material.emissiveIntensity = 0.08;': 'material.color.set("#47754c");\n    material.emissive.set("#102a15");\n    material.emissiveIntensity = 0.13;\n    material.map = null;\n    material.normalMap = null;',
            'if (growthIndex % 4 === 0) object.visible = false;': 'if (growthIndex % 2 === 0) object.visible = false;',
            'object.visible = anchorIndex % 4 === 1;\n      object.scale.multiplyScalar(0.46);': 'object.visible = false;\n      object.scale.multiplyScalar(0.34);',
            'camera.position.set(position.current.x, portrait ? 3.35 : 3.65, position.current.z + (portrait ? 13.9 : 14.2));\n    camera.lookAt(position.current.x, 0.9 + pitch.current, position.current.z - (portrait ? 7.3 : 8.4));': 'camera.position.set(position.current.x, portrait ? 4.15 : 4.7, position.current.z + (portrait ? 14.9 : 15.8));\n    camera.lookAt(position.current.x, 1.15 + pitch.current, position.current.z - (portrait ? 8.2 : 9.6));',
            'cameraOffset.current.set(0, (portrait ? 3.35 : 3.65) + pitch.current * 0.9, portrait ? 13.9 : 14.2).applyAxisAngle(upAxis.current, yaw.current);': 'cameraOffset.current.set(0, (portrait ? 4.15 : 4.7) + pitch.current * 0.9, portrait ? 14.9 : 15.8).applyAxisAngle(upAxis.current, yaw.current);',
            'camera.lookAt(position.current.x, 0.9 + pitch.current, position.current.z - (portrait ? 7.3 : 8.4));': 'camera.lookAt(position.current.x, 1.15 + pitch.current, position.current.z - (portrait ? 8.2 : 9.6));',
            '<color attach="background" args={["#8a7163"]} />\n      <Sky distance={450000} sunPosition={[7, 2.1, -14]} inclination={0.48} azimuth={0.24} turbidity={7.5} rayleigh={1.45} mieCoefficient={0.008} mieDirectionalG={0.84} />\n      <fogExp2 attach="fog" args={["#8d826f", 0.0085]} />\n      <ambientLight intensity={0.82} color="#f2dec5" />\n      <hemisphereLight args={["#ffd8a5", "#294833", 1.5]} />\n      <directionalLight position={[9, 11, 12]} intensity={5.2} color="#ffc27c" />\n      <directionalLight position={[-10, 8, -8]} intensity={0.78} color="#a7c9d2" />\n      <pointLight position={[0, 7, -9]} color="#ffb96b" intensity={4.8} distance={38} decay={2} />\n      <pointLight position={[6, 3, 3]} color="#d4e8d1" intensity={1.4} distance={24} decay={2} />': '<color attach="background" args={["#315d69"]} />\n      <Sky distance={450000} sunPosition={[9, 6.5, -15]} inclination={0.43} azimuth={0.24} turbidity={2.6} rayleigh={3.2} mieCoefficient={0.0035} mieDirectionalG={0.78} />\n      <fogExp2 attach="fog" args={["#688078", 0.0062]} />\n      <ambientLight intensity={1.34} color="#ffe6c8" />\n      <hemisphereLight args={["#ffe0b0", "#365844", 2.05]} />\n      <directionalLight position={[9, 13, 12]} intensity={6.4} color="#ffc982" />\n      <directionalLight position={[-10, 9, -8]} intensity={1.25} color="#b8e0e3" />\n      <pointLight position={[0, 7, -9]} color="#ffbd72" intensity={6.2} distance={42} decay={2} />\n      <pointLight position={[6, 4, 3]} color="#d8f0d4" intensity={2.2} distance={26} decay={2} />',
            '<HomeEnvironment walkTarget={target} />\n      <EmbodiedSelf root={avatar} />': '<HomeEnvironment walkTarget={target} />\n      <SanctuaryPathAndLanterns />\n      <EmbodiedSelf root={avatar} />',
            'camera={{ position: [0, 3.65, 21.4], fov: 50, near: 0.08, far: 180 }}': 'camera={{ position: [0, 4.7, 23], fov: 48, near: 0.08, far: 180 }}',
            'gl.toneMappingExposure = 1.22;': 'gl.toneMappingExposure = 1.42;',
            '<EffectComposer multisampling={0}><Bloom intensity={0.3} luminanceThreshold={0.78} luminanceSmoothing={0.2} mipmapBlur /><Vignette eskil={false} offset={0.1} darkness={0.035} /></EffectComposer>': '<EffectComposer multisampling={0}><Bloom intensity={0.24} luminanceThreshold={0.82} luminanceSmoothing={0.18} mipmapBlur /><Vignette eskil={false} offset={0.12} darkness={0.018} /></EffectComposer>'
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement occurrence, found {count}: {old[:80]}')
              text = text.replace(old, new)
          anchor = 'function HomeScene({ input, yaw, pitch, target, avatar, onNearby, onOrbOpen, onGround, onLifeMap, orbState, onSceneReady }: { input: MovementInput; yaw: MutableRefObject<number>; pitch: MutableRefObject<number>; target: MutableRefObject<THREE.Vector3 | null>; avatar: MutableRefObject<THREE.Group | null>; onNearby: (value: Nearby) => void; onOrbOpen: () => void; onGround: () => void; onLifeMap: () => void; orbState: OrbState; onSceneReady: () => void; }) {'
          insert = '''function SanctuaryPathAndLanterns() {
            const lanterns: [number, number, number][] = [[-3.5, 0.52, 5.0], [3.5, 0.52, 3.4], [-3.2, 0.52, 0.7], [3.1, 0.52, -2.1], [-2.7, 0.52, -4.7], [2.5, 0.52, -6.2]];
            return (
              <group name="home-authored-sanctuary-path-and-lanterns" raycast={DISABLED_RAYCAST}>
                <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, 0.105, -1.7]} scale={[1.05, 8.9, 1]}>
                  <planeGeometry args={[1.4, 1.4, 1, 1]} />
                  <meshStandardMaterial color="#8b7960" roughness={0.98} metalness={0} />
                </mesh>
                <mesh rotation={[-Math.PI / 2, 0, -0.08]} position={[-1.5, 0.09, -6.7]} scale={[2.4, 5.2, 1]}>
                  <planeGeometry args={[1.2, 1.2, 1, 1]} />
                  <meshStandardMaterial color="#4f7f75" emissive="#143c3a" emissiveIntensity={0.2} roughness={0.18} metalness={0} transparent opacity={0.72} />
                </mesh>
                {lanterns.map((position, index) => (
                  <group key={index} position={position}>
                    <mesh position={[0, -0.28, 0]}><cylinderGeometry args={[0.035, 0.055, 0.55, 8]} /><meshStandardMaterial color="#514536" roughness={0.92} /></mesh>
                    <mesh><sphereGeometry args={[0.09, 12, 8]} /><meshStandardMaterial color="#ffe1a1" emissive="#ffad55" emissiveIntensity={3.1} roughness={0.36} /></mesh>
                    <pointLight color="#ffbd72" intensity={2.1} distance={5.8} decay={2} />
                  </group>
                ))}
              </group>
            );
          }

          '''
          if text.count(anchor) != 1:
              raise SystemExit('HomeScene insertion anchor changed')
          text = text.replace(anchor, insert + anchor)
          p.write_text(text)
          PY
          git diff --check
          git diff -- urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
      - name: Commit cinematic sanctuary repair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- urai-tier1/src/spatial/layout/HomeWorldProduction.tsx)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          git commit -m "Lift Home into an inhabited cinematic sanctuary"
          git push origin HEAD:agent/replace-failed-home-lifemap-visuals
