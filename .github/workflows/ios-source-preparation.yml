name: iOS Source Preparation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "distribution/ios-shell/**"
      - "urai-tier1/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "scripts/prepare-ios-shell.mjs"
      - "scripts/prepare-native-links.mjs"
      - ".github/workflows/ios-source-preparation.yml"

permissions:
  contents: read

jobs:
  source-preparation:
    name: Generate iOS source without signing or Apple authority
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_URAI_API_ORIGIN: https://urai.app
      URAI_IOS_APPLE_AUTH_READY: "false"
      URAI_IOS_GOOGLE_AUTH_READY: "false"
      NEXT_PUBLIC_URAI_IOS_APPLE_AUTH_READY: "false"
      NEXT_PUBLIC_URAI_IOS_GOOGLE_AUTH_READY: "false"

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Load canonical Firebase public configuration
        shell: bash
        run: |
          set -euo pipefail
          config="$(curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://urai.app/__/firebase/init.json)"
          test "$(jq -r '.projectId // empty' <<<"$config")" = "urai-4dc1d"
          test "$(jq -r '.authDomain // empty' <<<"$config")" = "urai-4dc1d.firebaseapp.com"
          for pair in \
            "NEXT_PUBLIC_FIREBASE_API_KEY apiKey" \
            "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN authDomain" \
            "NEXT_PUBLIC_FIREBASE_PROJECT_ID projectId" \
            "NEXT_PUBLIC_FIREBASE_APP_ID appId" \
            "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET storageBucket" \
            "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID messagingSenderId" \
            "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID measurementId"; do
            env_name="${pair%% *}"
            json_name="${pair#* }"
            value="$(jq -r --arg key "$json_name" '.[$key] // empty' <<<"$config")"
            test -n "$value" || { echo "Canonical Firebase config is missing: $json_name" >&2; exit 1; }
            printf '%s=%s\n' "$env_name" "$value" >> "$GITHUB_ENV"
          done


      - name: Build static export for unconfigured source preparation
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ env.URAI_EXACT_HEAD }}
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.URAI_EXACT_HEAD }}
        run: corepack pnpm build:static

      - name: Bind and verify exact native static identity
        run: node scripts/prepare-native-static-provenance.mjs --directory urai-tier1/out --source-sha "$URAI_EXACT_HEAD" --platform ios --workflow-run-id "$GITHUB_RUN_ID"

      - name: Generate iOS Swift Package Manager source
        working-directory: distribution/ios-shell
        run: |
          corepack pnpm exec cap add ios --packagemanager SPM
          node ../../scripts/prepare-ios-shell.mjs --optional --project ios --receipt-output ../../ios-source-receipt.json
          node ../../scripts/prepare-native-static-provenance.mjs --directory ios/App/App/public --source-sha "$URAI_EXACT_HEAD" --platform ios --workflow-run-id "$GITHUB_RUN_ID" --verify-only

      - name: Retain source hashes and explicit native boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          receipt = json.loads(pathlib.Path('ios-source-receipt.json').read_text())
          assert receipt['sourceSha'] == __import__('os').environ['URAI_EXACT_HEAD']
          assert receipt['compiled'] is False and receipt['signingPerformed'] is False
          assert receipt['nativeAppleAuthConfigured'] is False and receipt['nativeGoogleAuthConfigured'] is False
          assert receipt['appleAuthoritySupplied'] is False
          PY
          sha256sum \
            distribution/ios-shell/ios/App/App.xcodeproj/project.pbxproj \
            distribution/ios-shell/ios/App/CapApp-SPM/Package.swift \
            distribution/ios-shell/ios/App/App/AppDelegate.swift \
            distribution/ios-shell/ios/App/App/SceneDelegate.swift \
            distribution/ios-shell/ios/App/App/Info.plist \
            distribution/ios-shell/ios/App/App/App.entitlements \
            distribution/ios-shell/ios/App/App/capacitor.config.json \
            distribution/ios-shell/ios/App/App/public/native-build-fingerprint.json > ios-project-source.sha256

      - name: Retain source-only iOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: urai-ios-source-preparation-${{ env.URAI_EXACT_HEAD }}
          path: |
            ios-source-receipt.json
            distribution/ios-shell/ios/App/App/public/native-build-fingerprint.json
            ios-project-source.sha256
            distribution/ios-shell/ios/App/App.xcodeproj/project.pbxproj
            distribution/ios-shell/ios/App/CapApp-SPM/Package.swift
            distribution/ios-shell/ios/App/App/AppDelegate.swift
            distribution/ios-shell/ios/App/App/SceneDelegate.swift
            distribution/ios-shell/ios/App/App/Info.plist
            distribution/ios-shell/ios/App/App/App.entitlements
            distribution/ios-shell/ios/App/App/capacitor.config.json
          retention-days: 30
