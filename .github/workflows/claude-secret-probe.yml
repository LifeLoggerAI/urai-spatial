name: Claude Credential Presence Probe

on:
  push:
    branches:
      - claude-code-github-main-20260916
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HAS_CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          echo "CLAUDE_CODE_OAUTH_TOKEN present: ${HAS_CLAUDE_CODE_OAUTH_TOKEN}"
          echo "ANTHROPIC_API_KEY present: ${HAS_ANTHROPIC_API_KEY}"
          if [ "${HAS_CLAUDE_CODE_OAUTH_TOKEN}" = "true" ] || [ "${HAS_ANTHROPIC_API_KEY}" = "true" ]; then
            echo "usable_secret_present=true"
          else
            echo "usable_secret_present=false"
          fi
