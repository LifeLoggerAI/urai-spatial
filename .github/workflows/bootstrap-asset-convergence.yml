name: Bootstrap Asset Convergence Lane

on:
  push:
    branches:
      - fix/asset-authority-convergence-20260710
    paths:
      - '.github/workflows/bootstrap-asset-convergence.yml'

permissions:
  contents: write

jobs:
  transplant-reviewed-text-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: fix/asset-authority-convergence-20260710
          fetch-depth: 0
      - name: Fetch reviewed source lane
        run: git fetch origin feat/launch-critical-asset-forge-20260710
      - name: Copy only reviewed asset-governance files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '.github/workflows/launch-critical-asset-forge.yml'
            'docs/audits/ASSET_AUTHORITY_DEEP_DIVE_2026-07-10.md'
            'operations/assets/launch-critical-assets.json'
            'scripts/audit-launch-critical-artifact.mjs'
            'scripts/forge-launch-critical-assets.mjs'
            'scripts/verify-launch-critical-assets.mjs'
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/feat/launch-critical-asset-forge-20260710:$file" > "$file"
          done
          rm -f .github/workflows/bootstrap-asset-convergence.yml
      - name: Commit clean transplant
        run: |
          git config user.name 'URAI Asset Convergence'
          git config user.email 'urai-asset-convergence@users.noreply.github.com'
          git add .github/workflows docs/audits operations/assets scripts
          git commit -m 'Transplant reviewed asset governance onto current main'
          git push origin HEAD:fix/asset-authority-convergence-20260710
