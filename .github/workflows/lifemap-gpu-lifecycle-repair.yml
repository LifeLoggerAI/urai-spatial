name: Life Map GPU lifecycle repair

on:
  push:
    branches:
      - fix/life-map-independent-final-0deeba-20260718

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify bounded repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "57b93dfa2ddcd1467e669b081b761d1c3c3ede19"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/lifemap-gpu-lifecycle-repair.yml"

      - name: Apply exact lifecycle repairs
        shell: python
        run: |
          from pathlib import Path

          scene_path = Path('urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx')
          scene = scene_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '  const tube = useMemo(() => new THREE.TubeGeometry(curve, 72, active ? 0.012 : 0.005, 6, false), [active, curve]);\n\n  useEffect(() => () => tube.dispose(), [tube]);\n',
                  '',
              ),
              (
                  '      <mesh geometry={tube}>\n        <meshBasicMaterial color={active ? "#a5f7ff" : "#24344d"} transparent opacity={active ? 0.38 : 0.055} depthWrite={false} blending={THREE.AdditiveBlending} />',
                  '      <mesh>\n        <tubeGeometry args={[curve, 72, active ? 0.012 : 0.005, 6, false]} />\n        <meshBasicMaterial color={active ? "#a5f7ff" : "#24344d"} transparent opacity={active ? 0.38 : 0.055} depthWrite={false} blending={THREE.AdditiveBlending} />',
              ),
              (
                  '  const texture = useMemo(() => createMemorySurface(node, textureResolution), [node, textureResolution]);\n  const scale = 0.72 + node.intensity * 0.24;\n\n  useEffect(() => () => texture?.dispose(), [texture]);',
                  '  const [texture, setTexture] = useState<THREE.CanvasTexture | null>(null);\n  const scale = 0.72 + node.intensity * 0.24;\n\n  useEffect(() => {\n    const nextTexture = createMemorySurface(node, textureResolution);\n    setTexture(nextTexture);\n    return () => {\n      nextTexture?.dispose();\n    };\n  }, [node, textureResolution]);',
              ),
          ]

          for old, new in replacements:
              count = scene.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one exact scene replacement, found {count}: {old[:80]!r}')
              scene = scene.replace(old, new, 1)

          scene_path.write_text(scene, encoding='utf-8')

          test_path = Path('urai-tier1/tests/lifemap-scene-behavior.test.mjs')
          test_source = test_path.read_text(encoding='utf-8')
          old_test = '''  assert.match(source, /:\\s*80;\\s*const texture = useMemo\\(\\(\\) => createMemorySurface\\(node, textureResolution\\)/, 'Non-related memories must use the smallest allocation.')
  assert.ok(source.includes('[node, textureResolution]'), 'Texture replacement must track both memory identity and allocation profile.')
  assert.ok(source.includes('useEffect(() => () => texture?.dispose(), [texture])'), 'Every replaced or unmounted CanvasTexture must be disposed.')'''
          new_test = '''  assert.match(source, /:\\s*80;\\s*const \\[texture, setTexture\\] = useState<THREE\\.CanvasTexture \\| null>\\(null\\)/, 'Non-related memories must use the smallest allocation and a commit-phase texture state.')
  assert.ok(source.includes('const nextTexture = createMemorySurface(node, textureResolution)'), 'Texture creation must occur inside the committed effect lifecycle.')
  assert.ok(source.includes('[node, textureResolution]'), 'Texture replacement must track both memory identity and allocation profile.')
  assert.ok(source.includes('nextTexture?.dispose()'), 'Every committed, replaced, or unmounted CanvasTexture must be disposed.')
  assert.doesNotMatch(source, /useMemo\\(\\(\\) => createMemorySurface/, 'CanvasTexture allocation must not occur during render.')
  assert.doesNotMatch(source, /new THREE\\.TubeGeometry/, 'Temporal path geometry must not be allocated during render.')
  assert.ok(source.includes('<tubeGeometry args={[curve, 72, active ? 0.012 : 0.005, 6, false]} />'), 'Temporal path geometry must use the declarative R3F lifecycle.')'''
          if test_source.count(old_test) != 1:
              raise SystemExit('Expected one exact lifecycle assertion block')
          test_path.write_text(test_source.replace(old_test, new_test, 1), encoding='utf-8')

      - name: Run focused contracts and typecheck
        shell: bash
        run: |
          set -euo pipefail
          cd urai-tier1
          node --test tests/lifemap-scene-behavior.test.mjs
          corepack pnpm run typecheck

      - name: Commit repaired source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lifemap-gpu-lifecycle-repair.yml
          git add urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/tests/lifemap-scene-behavior.test.mjs
          git commit -m "Fix Life Map GPU resource lifecycles"
          git push origin HEAD:fix/life-map-independent-final-0deeba-20260718
