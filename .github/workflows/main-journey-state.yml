name: Main Journey State Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'urai-tier1/src/app/focus/**'
      - 'urai-tier1/src/app/replay/**'
      - 'scripts/audit-main-journey-state.mjs'
      - '.github/workflows/main-journey-state.yml'

permissions:
  contents: read

concurrency:
  group: main-journey-state-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  journey-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Audit Home to Life Map to Focus to Replay state
        run: node scripts/audit-main-journey-state.mjs

      - name: Typecheck current journey runtime
        run: corepack pnpm --dir urai-tier1 typecheck
