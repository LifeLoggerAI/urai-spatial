name: PR1151 One-Shot Syntax Repair

on:
  push:
    branches:
      - agent/founder-proof-runner-isolation-v1-20260814

permissions:
  contents: write

concurrency:
  group: pr1151-one-shot-syntax-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/founder-proof-runner-isolation-v1-20260814
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact staged parent and repair one malformed expression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a0750b85931378119a09d8886d69a226f216e1cb"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('urai-tier1/src/components/lifemap/LifeMapProductionWorld.tsx')
          source = path.read_text()
          old = 'width={0.031} />}</group>;'
          new = 'width={0.031} />)}</group>;'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one malformed PatternArtifact expression, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git diff --exit-code -- . ':!.github/workflows/pr1151-one-shot-syntax-repair.yml' >/dev/null && {
            echo 'expected bounded source repair was not produced' >&2
            exit 1
          }

      - name: Commit bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/components/lifemap/LifeMapProductionWorld.tsx
          test "$(git diff --cached --name-only)" = "urai-tier1/src/components/lifemap/LifeMapProductionWorld.tsx"
          git commit -m 'fix: restore PatternArtifact map closure'
          git push origin HEAD:agent/founder-proof-runner-isolation-v1-20260814
