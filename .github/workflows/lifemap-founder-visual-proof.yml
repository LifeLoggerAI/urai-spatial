name: Life Map Founder Visual Proof

on:
  push:
    branches:
      - agent/replace-failed-home-lifemap-visuals
    paths:
      - '.github/workflows/lifemap-founder-visual-proof.yml'
      - 'scripts/capture-lifemap-founder-proof.mjs'
      - 'scripts/capture-lifemap-founder-proof-fixed.mjs'
      - 'scripts/run-lifemap-founder-proof-fixed.mjs'
      - 'scripts/run-with-ci-webgl.mjs'
      - 'scripts/run-continuous-spatial-proof-v21-grouped.mjs'
      - 'scripts/verify-lifemap-canvas-proof.mjs'
      - 'urai-tier1/src/components/lifemap/**'
      - 'urai-tier1/src/spatial/lifemap/**'
      - 'urai-tier1/src/app/life-map/**'
      - 'urai-tier1/tests/lifemap-*.test.mjs'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lifemap-founder-visual-proof.yml'
      - 'scripts/capture-lifemap-founder-proof.mjs'
      - 'scripts/capture-lifemap-founder-proof-fixed.mjs'
      - 'scripts/run-lifemap-founder-proof-fixed.mjs'
      - 'scripts/run-with-ci-webgl.mjs'
      - 'scripts/run-continuous-spatial-proof-v21-grouped.mjs'
      - 'scripts/verify-lifemap-canvas-proof.mjs'
      - 'urai-tier1/src/components/lifemap/**'
      - 'urai-tier1/src/spatial/lifemap/**'
      - 'urai-tier1/src/app/life-map/**'
      - 'urai-tier1/tests/lifemap-*.test.mjs'

permissions:
  contents: read

concurrency:
  group: lifemap-founder-proof-${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  URAI_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Prove Founder runner syntax and ownership before Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lifemap-founder-proof
          node --check scripts/capture-lifemap-founder-proof-fixed.mjs | tee artifacts/lifemap-founder-proof/founder-runner-syntax.log
          node --check scripts/verify-lifemap-canvas-proof.mjs | tee artifacts/lifemap-founder-proof/canvas-runner-syntax.log
          node --check scripts/run-with-ci-webgl.mjs | tee artifacts/lifemap-founder-proof/webgl-wrapper-syntax.log
          node scripts/run-lifemap-founder-proof-fixed.mjs --validate-only | tee artifacts/lifemap-founder-proof/founder-launcher-validation.log
          node --test urai-tier1/tests/lifemap-founder-harness-contract.test.mjs | tee artifacts/lifemap-founder-proof/founder-harness-contract.log

      - name: Run Life Map contracts and static build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/lifemap-founder-proof
          node --test \
            urai-tier1/tests/lifemap-aaa-composition-contract.test.mjs \
            urai-tier1/tests/lifemap-scene-behavior.test.mjs \
            urai-tier1/tests/lifemap-semantic-owner-contract.test.mjs \
            urai-tier1/tests/lifemap-review-repair-contract.test.mjs \
            | tee artifacts/lifemap-founder-proof/lifemap-contract.log
          pnpm --dir urai-tier1 typecheck | tee artifacts/lifemap-founder-proof/typecheck.log
          pnpm build:static 2>&1 | tee artifacts/lifemap-founder-proof/build-static.log

      - name: Install Chromium
        run: pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Capture exact-head founder evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > artifacts/lifemap-founder-proof/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/life-map/ >/dev/null && break
            sleep 1
          done
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_PROOF_DIR=artifacts/lifemap-founder-proof \
          URAI_EXACT_HEAD="$URAI_EXACT_HEAD" \
          node scripts/run-with-ci-webgl.mjs scripts/run-lifemap-founder-proof-fixed.mjs 2>&1 | tee artifacts/lifemap-founder-proof/capture.log
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_CANVAS_PROOF_DIR=artifacts/lifemap-founder-proof/canvas-proof \
          URAI_EXACT_HEAD="$URAI_EXACT_HEAD" \
          node scripts/run-with-ci-webgl.mjs scripts/verify-lifemap-canvas-proof.mjs 2>&1 | tee artifacts/lifemap-founder-proof/canvas-proof.log

      - name: Seal exact-head founder receipt
        shell: bash
        env:
          URAI_REPOSITORY: ${{ github.repository }}
          URAI_WORKFLOW_RUN_ID: ${{ github.run_id }}
          URAI_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          URAI_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          receipt_dir=artifacts/lifemap-founder-proof
          test -d "$receipt_dir"
          printf '%s\n' "$URAI_EXACT_HEAD" > "$receipt_dir/verified-head.txt"
          cat > "$receipt_dir/exact-head-receipt.json" <<JSON
          {
            "repository": "$URAI_REPOSITORY",
            "verification_sha": "$URAI_EXACT_HEAD",
            "workflow_run_id": "$URAI_WORKFLOW_RUN_ID",
            "workflow_run_attempt": "$URAI_WORKFLOW_RUN_ATTEMPT",
            "event": "$URAI_EVENT_NAME"
          }
          JSON
          find "$receipt_dir" -type f ! -name 'sha256sums.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$receipt_dir/sha256sums.txt"
          grep -F "$URAI_EXACT_HEAD" "$receipt_dir/exact-head-receipt.json"
          test -s "$receipt_dir/sha256sums.txt"

      - name: Upload exact-head founder receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemap-founder-visual-proof-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/lifemap-founder-proof
          if-no-files-found: error
          retention-days: 365
