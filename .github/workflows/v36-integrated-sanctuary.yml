name: V36 Integrated Sanctuary Rebuild

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - scripts/v36-integrated-sanctuary-transform.py
      - .github/workflows/v36-integrated-sanctuary.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor == 'LifeLoggerAI'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply V36 production transform
        run: python3 scripts/v36-integrated-sanctuary-transform.py
      - name: Install exact lockfile
        working-directory: urai-tier1
        run: pnpm install --frozen-lockfile
      - name: Verify focused Home contracts
        working-directory: urai-tier1
        run: |
          pnpm exec vitest run src/spatial/layout/__tests__/homeCohesion.test.ts src/spatial/layout/__tests__/HomeEmbodiedExploration.test.tsx src/spatial/__tests__/continuousSpatialRestoration.test.ts src/spatial/__tests__/homeGroundLifeMapArtBible.test.ts
      - name: Verify production static build
        working-directory: urai-tier1
        run: pnpm build:static
      - name: Commit V36 runtime source if branch unchanged
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Home: rebuild integrated V36 sanctuary reliquary"
          git push origin HEAD:home-final-v24-certify-20260826
