name: URAI Tier 1-5 Launch Pipeline

on:
  workflow_dispatch:
  push:
    branches: ["main", "tier-1-5-launch-lock", "tier-1-5-final-lock"]
  pull_request:
    branches: ["main"]

jobs:
  launch-lock:
    name: Tier 1-5 launch lock
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-firebase-api-key' }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci.firebaseapp.com' }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'ci-urai-spatial' }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:000000000000:web:ci' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Check lockfile
        run: pnpm check:lockfile

      - name: Source integrity
        run: pnpm check:source-integrity

      - name: Production route exposure
        run: pnpm check:production-routes

      - name: Preflight
        run: pnpm preflight

      - name: Canon and LOCS lock
        run: pnpm canon:check && pnpm canon:lock && pnpm locs:check

      - name: Firebase boundary lock
        run: pnpm firebase:rules:check

      - name: Tier governance checks
        run: pnpm tier1:check && pnpm tier2:check && pnpm tier3:check && pnpm tier4:check && pnpm tier5:check

      - name: Tier 1 lock
        run: pnpm urai:tier1

      - name: Tier 2 lock
        run: pnpm urai:tier2

      - name: Tier 3 lock
        run: pnpm urai:tier3

      - name: Tier 4 lock
        run: pnpm urai:tier4

      - name: Scripted Tier 5 lock
        run: pnpm urai:tier5

      - name: Install Playwright browser and Linux dependencies
        run: pnpm playwright:install-deps && pnpm playwright:install

      - name: Spatial E2E browser lock
        run: pnpm lock:e2e

      - name: Full release verifier
        run: pnpm verify:release

      - name: Upload spatial artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-lock-artifacts
          path: |
            artifacts/spatial-lock
            artifacts/spatial-tier-lock-hardening
            urai-tier1/audit/tier-lock
          if-no-files-found: ignore

  summary:
    name: Launch lock summary
    runs-on: ubuntu-latest
    needs: launch-lock
    if: always()
    steps:
      - name: Summary
        run: |
          if [ "${{ needs.launch-lock.result }}" = "success" ]; then
            echo "URAI Tier 1-5 launch pipeline completed successfully."
          else
            echo "URAI Tier 1-5 launch pipeline failed: ${{ needs.launch-lock.result }}"
            exit 1
          fi
