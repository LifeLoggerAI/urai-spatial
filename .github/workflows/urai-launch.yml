name: URAI Tier 1-5 Launch Pipeline

on:
  push:
    branches: ["tier-1-5-launch-lock"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install deps
        run: npm install

      - name: Type check
        run: npm run typecheck || echo "no typecheck script"

      - name: Build
        run: npm run build || echo "no build script"

      - name: Lint
        run: npm run lint || echo "no lint script"

      - name: Firebase Deploy (dry run)
        run: echo "firebase deploy --only hosting (manual step)"

  summary:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "URAI Tier 1-5 pipeline completed"
