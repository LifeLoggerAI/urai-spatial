name: Crowdfunding Capture Authority

on:
  pull_request:
    paths:
      - 'docs/crowdfunding/**'
      - 'urai-tier1/tests/crowdfunding-capture-authority-contract.test.mjs'
      - '.github/workflows/crowdfunding-capture-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crowdfunding-capture-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact-head identity
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate manifest JSON
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('node:fs').readFileSync('docs/crowdfunding/capture-route-manifest.json','utf8'))"

      - name: Run capture authority contract
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/crowdfunding-capture-authority-contract.test.mjs

      - name: Verify clean repository
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
