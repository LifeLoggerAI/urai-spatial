name: Materialize V61 Deep Reliquary Vault

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - scripts/apply-home-v61-deep-reliquary-vault.py
      - .github/workflows/materialize-v61-deep-reliquary-vault.yml

permissions:
  contents: write

jobs:
  materialize:
    if: "github.event.head_commit.message != 'Home: materialize V61 deep reliquary vault' && github.event.head_commit.message != 'Home: owner-certify V61 runtime head'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable triggering head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Prove exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current="$(git ls-remote origin refs/heads/home-final-v24-certify-20260826 | cut -f1)"
          test "$current" = "$GITHUB_SHA"

      - name: Repair redundant V60 owner replacements and materialize V61
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/apply-home-v61-deep-reliquary-vault.py')
          text=path.read_text()
          redundant=[
            '("visualOwner:\'faceted-wall-relic-v60\'","visualOwner:\'deep-reliquary-vault-v61\'",\'visual owner\'),\n',
            '("visualTreatment:\'v60-faceted-wall-relic-retained-pixel-rebuild\'","visualTreatment:\'v61-deep-reliquary-vault-retained-pixel-rebuild\'",\'visual treatment\'),\n',
          ]
          for line in redundant:
            if line not in text:
              raise SystemExit(f'redundant V61 replacement line missing: {line!r}')
            text=text.replace(line,'',1)
          path.write_text(text)
          PY
          python3 scripts/apply-home-v61-deep-reliquary-vault.py
          git diff --check
          grep -q "v61-deep-reliquary-vault-retained-pixel-rebuild" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -q "home-v61-orb-state-slit" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -q "deep-reliquary-v61-plus-governed-orb-identity" scripts/run-continuous-spatial-proof-v22-natural.mjs
          grep -q "cinematic-pbr-v61-deep-reliquary-vault" scripts/capture-natural-home-orb-proof.mjs
          grep -q "visualOwner:'deep-reliquary-vault-v61'" .github/workflows/home-scanned-composition-forge.yml
          grep -q "const DEFAULT_YAW = 0.435" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx

      - name: Commit exact V61 candidate only if branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/home-final-v24-certify-20260826 | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The Actions token intentionally cannot update workflow files. Commit only runtime/proof files here;
          # the V61 Home composition workflow is applied separately through the owner-authorized GitHub path.
          git add scripts/apply-home-v61-deep-reliquary-vault.py urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx scripts/capture-natural-home-orb-proof.mjs scripts/run-continuous-spatial-proof-v22-natural.mjs urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          if git diff --cached --quiet; then
            echo "No V61 runtime/proof changes to commit"
            exit 0
          fi
          git commit -m "Home: materialize V61 deep reliquary vault"
          git push origin HEAD:home-final-v24-certify-20260826
