name: Android Package Prep

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "distribution/android-shell/**"
      - "urai-tier1/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
      - ".github/workflows/android-package-prep.yml"

permissions:
  contents: read

jobs:
  unsigned-aab:
    name: Build unsigned Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install canonical dependencies
        run: pnpm install --frozen-lockfile

      - name: Build governed static export
        run: pnpm build:static

      - name: Install pinned Capacitor tooling
        working-directory: distribution/android-shell
        run: npm install --no-audit --no-fund

      - name: Generate and sync Android project
        working-directory: distribution/android-shell
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Build release bundle without signing credentials
        working-directory: distribution/android-shell/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Prove bundle exists and remains non-authoritative
        shell: bash
        run: |
          AAB="distribution/android-shell/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          sha256sum "$AAB" | tee android-aab.sha256
          {
            echo "status=UNSIGNED_BUILD_EVIDENCE_ONLY"
            echo "candidate_package=com.urailabs.urai"
            echo "source_sha=$GITHUB_SHA"
            echo "aab_path=$AAB"
          } | tee android-package-receipt.txt

      - name: Retain unsigned package evidence
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-unsigned-aab-${{ github.sha }}
          path: |
            distribution/android-shell/android/app/build/outputs/bundle/release/app-release.aab
            android-aab.sha256
            android-package-receipt.txt
          retention-days: 30
