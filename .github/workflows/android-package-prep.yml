name: Android Package Prep

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "distribution/android-shell/**"
      - "urai-tier1/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/**"
      - ".github/workflows/android-package-prep.yml"

permissions:
  contents: read

jobs:
  unsigned-aab:
    name: Build unsigned Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_URAI_API_ORIGIN: https://urai.app
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}-unsigned

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install canonical dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Load canonical Firebase public configuration
        shell: bash
        run: |
          set -euo pipefail
          config="$(curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://urai.app/__/firebase/init.json)"
          test "$(jq -r '.projectId // empty' <<<"$config")" = "urai-4dc1d"
          test "$(jq -r '.authDomain // empty' <<<"$config")" = "urai-4dc1d.firebaseapp.com"
          for pair in \
            "NEXT_PUBLIC_FIREBASE_API_KEY apiKey" \
            "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN authDomain" \
            "NEXT_PUBLIC_FIREBASE_PROJECT_ID projectId" \
            "NEXT_PUBLIC_FIREBASE_APP_ID appId" \
            "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET storageBucket" \
            "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID messagingSenderId" \
            "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID measurementId"; do
            env_name="${pair%% *}"
            json_name="${pair#* }"
            value="$(jq -r --arg key "$json_name" '.[$key] // empty' <<<"$config")"
            test -n "$value" || { echo "Canonical Firebase config is missing: $json_name" >&2; exit 1; }
            printf '%s=%s\n' "$env_name" "$value" >> "$GITHUB_ENV"
          done

      - name: Require release public configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_APP_ID; do
            test -n "${!name}" || { echo "Missing required public build variable: $name" >&2; exit 1; }
          done
          test "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" = "urai-4dc1d"
          test "$NEXT_PUBLIC_URAI_API_ORIGIN" = "https://urai.app"
          [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]

      - name: Validate optional canonical Android Google sign-in configuration
        env:
          ANDROID_FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          node scripts/prepare-android-native-google-auth.mjs --optional \
            --config-output "$RUNNER_TEMP/urai-google-services.json" \
            --receipt-output android-native-auth-receipt.json

      - name: Build governed static export
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ env.URAI_EXACT_HEAD }}
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.URAI_EXACT_HEAD }}
        run: corepack pnpm build:static

      - name: Bind and verify exact native static identity
        run: node scripts/prepare-native-static-provenance.mjs --directory urai-tier1/out --source-sha "$URAI_EXACT_HEAD" --platform android --workflow-run-id "$GITHUB_RUN_ID"

      - name: Generate and sync Android project
        working-directory: distribution/android-shell
        run: |
          rm -rf android
          corepack pnpm exec cap add android
          node ../../scripts/prepare-native-links.mjs --android-project android
          node ../../scripts/prepare-android-native-google-auth.mjs --optional --apply-project android
          corepack pnpm exec cap sync android
          node ../../scripts/prepare-native-static-provenance.mjs --directory android/app/src/main/assets/public --source-sha "$URAI_EXACT_HEAD" --platform android --workflow-run-id "$GITHUB_RUN_ID" --verify-only

      - name: Apply governed Android version
        working-directory: distribution/android-shell/android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(r"versionCode\s+\d+", f"versionCode {os.environ['ANDROID_VERSION_CODE']}", text, count=1)
          text, name_count = re.subn(r'versionName\s+"[^"]+"', f'versionName "{os.environ["ANDROID_VERSION_NAME"]}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Generated Gradle version fields not found exactly once.")
          path.write_text(text)
          PY
          grep -F "versionCode $ANDROID_VERSION_CODE" app/build.gradle
          grep -F "versionName \"$ANDROID_VERSION_NAME\"" app/build.gradle

      - name: Build release bundle without signing credentials
        working-directory: distribution/android-shell/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Prove bundle exists and remains non-authoritative
        shell: bash
        run: |
          AAB="distribution/android-shell/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          sha256sum "$AAB" | tee android-aab.sha256
          {
            echo "status=UNSIGNED_BUILD_EVIDENCE_ONLY"
            echo "candidate_package=com.urailabs.urai"
            echo "source_sha=$URAI_EXACT_HEAD"
            echo "version_code=$ANDROID_VERSION_CODE"
            echo "version_name=$ANDROID_VERSION_NAME"
            echo "api_origin=$NEXT_PUBLIC_URAI_API_ORIGIN"
            echo "firebase_project=$NEXT_PUBLIC_FIREBASE_PROJECT_ID"
            echo "native_google_auth_configured=$URAI_ANDROID_NATIVE_GOOGLE_AUTH_READY"
            echo "aab_path=$AAB"
          } | tee android-package-receipt.txt

      - name: Prepare bounded independently verifiable AAB transport
        id: aab-transport
        shell: bash
        run: |
          set -euo pipefail
          node scripts/android-aab-transport.mjs split \
            --bundle distribution/android-shell/android/app/build/outputs/bundle/release/app-release.aab \
            --directory android-aab-transport \
            --source-sha "$URAI_EXACT_HEAD" \
            --expected-sha256 "$(cut -d ' ' -f1 android-aab.sha256)"
          node --input-type=module -e 'import fs from "node:fs"; const receipt=JSON.parse(fs.readFileSync("android-aab-transport/android-aab-transport.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `part_count=${receipt.partCount}\n`);'

      - name: Retain unsigned package evidence
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-unsigned-aab-${{ env.URAI_EXACT_HEAD }}
          path: |
            distribution/android-shell/android/app/build/outputs/bundle/release/app-release.aab
            android-aab.sha256
            android-package-receipt.txt
            android-native-auth-receipt.json
          retention-days: 30

      - name: Retain AAB transport identity and original receipts
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-aab-transport-${{ env.URAI_EXACT_HEAD }}
          path: |
            android-aab-transport/android-aab-transport.json
            android-aab.sha256
            android-package-receipt.txt
            android-native-auth-receipt.json
          retention-days: 30
          if-no-files-found: error

      - name: Retain AAB transport part 01
        if: ${{ fromJSON(steps.aab-transport.outputs.part_count) >= 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-aab-part-01-${{ env.URAI_EXACT_HEAD }}
          path: android-aab-transport/app-release.aab.part-01
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain AAB transport part 02
        if: ${{ fromJSON(steps.aab-transport.outputs.part_count) >= 2 }}
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-aab-part-02-${{ env.URAI_EXACT_HEAD }}
          path: android-aab-transport/app-release.aab.part-02
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain AAB transport part 03
        if: ${{ fromJSON(steps.aab-transport.outputs.part_count) >= 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-aab-part-03-${{ env.URAI_EXACT_HEAD }}
          path: android-aab-transport/app-release.aab.part-03
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain AAB transport part 04
        if: ${{ fromJSON(steps.aab-transport.outputs.part_count) >= 4 }}
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-aab-part-04-${{ env.URAI_EXACT_HEAD }}
          path: android-aab-transport/app-release.aab.part-04
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain AAB transport part 05
        if: ${{ fromJSON(steps.aab-transport.outputs.part_count) >= 5 }}
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-aab-part-05-${{ env.URAI_EXACT_HEAD }}
          path: android-aab-transport/app-release.aab.part-05
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain AAB transport part 06
        if: ${{ fromJSON(steps.aab-transport.outputs.part_count) >= 6 }}
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-aab-part-06-${{ env.URAI_EXACT_HEAD }}
          path: android-aab-transport/app-release.aab.part-06
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain AAB transport part 07
        if: ${{ fromJSON(steps.aab-transport.outputs.part_count) >= 7 }}
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-aab-part-07-${{ env.URAI_EXACT_HEAD }}
          path: android-aab-transport/app-release.aab.part-07
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Retain AAB transport part 08
        if: ${{ fromJSON(steps.aab-transport.outputs.part_count) >= 8 }}
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-aab-part-08-${{ env.URAI_EXACT_HEAD }}
          path: android-aab-transport/app-release.aab.part-08
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

