name: Tier 5 Browser Proof

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tier5-browser-proof:
    name: Tier 5 browser and release proof
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify local production gates
        run: |
          pnpm check:source-integrity
          pnpm check:production-routes
          pnpm check:spatial-copy
          pnpm check:launch-boundary-contract
          pnpm check:tier-xr-release-matrix
          pnpm tier:check
          pnpm firebase:rules:check
          pnpm tier5:production:check
          pnpm typecheck
          URAI_MIN_INSTALL_FREE_MB=512 pnpm build
          pnpm release:p1

      - name: Verify Playwright runtime
        run: pnpm playwright:ensure

      - name: Run browser E2E lock
        run: pnpm lock:e2e

      - name: Run full live check without deploy
        run: pnpm live:check
