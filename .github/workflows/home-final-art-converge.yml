name: Home Final Art Converge

on:
  push:
    branches:
      - home-final-relic-machine-realism-20260826
    paths:
      - '.github/workflows/home-final-art-converge.yml'

permissions:
  contents: write

concurrency:
  group: home-final-art-converge
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply final photographic sanctuary art and runtime corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {count}')
              return text.replace(old, new, 1)

          sacred_path = Path('urai-tier1/src/spatial/layout/HomeWorldProductionSacred.tsx')
          s = sacred_path.read_text()

          s = replace_once(s,
              "const SPAWN = new THREE.Vector3(2.35, 0.04, 7.9)\nconst ORB = new THREE.Vector3(0, 1.62, -2.65)",
              "const SPAWN = new THREE.Vector3(1.12, 0.04, 7.2)\nconst ORB = new THREE.Vector3(0, 1.52, -2.65)",
              'hero composition anchors')
          s = replace_once(s, "const DEFAULT_YAW = 0.13", "const DEFAULT_YAW = 0.075", 'default yaw')
          s = replace_once(s,
              "type Nearby = 'orb' | 'ground' | 'life-map' | null\ntype Props = { onOrbOpen?: () => void; webglAvailable?: boolean }",
              "type Nearby = 'orb' | 'ground' | 'life-map' | null\ntype TransitionSequence = 'idle' | 'ground:opening' | 'ground:traversal' | 'ground:closing' | 'life-map:opening' | 'life-map:traversal' | 'life-map:closing'\ntype Props = { onOrbOpen?: () => void; webglAvailable?: boolean }",
              'transition sequence type')

          old_path = """const APPROACH_SLABS: readonly [number, number, number, number, number][] = [
  [0.18,7.0,1.18,0.82,0.015],[-0.03,5.95,1.28,0.86,-0.018],[0.11,4.86,1.34,0.89,0.012],
  [-0.09,3.73,1.42,0.92,-0.014],[0.07,2.56,1.48,0.94,0.009],[-0.03,1.36,1.54,0.96,-0.008],
  [0.03,0.12,1.58,0.98,0.006],[-0.02,-1.13,1.62,1,-0.004],
]

function ApproachPath() {
  const pack = usePhotographicStonePack(1.7)
  return <group name=\"home-sanctuary-approach\" userData={{ treatment: 'hand-laid-photographic-stone-v16' }}>
    {APPROACH_SLABS.map(([x,z,width,depth,yaw], index) => <mesh key={index} position={[x,0.015,z]} rotation={[0,yaw,0]} castShadow receiveShadow>
      <boxGeometry args={[width,0.075,depth,8,2,8]} />
      <StoneMaterial pack={pack} color={index % 2 ? '#777b78' : '#696e6b'} bumpScale={0.028} />
    </mesh>)}
  </group>
}
"""
          new_path = """function ApproachPath() {
  return <group name=\"home-sanctuary-approach\" userData={{ treatment: 'recessed-sacred-inlay-v18' }}>
    <mesh position={[-0.5,0.008,2.55]} rotation={[-Math.PI/2,0,0]}><planeGeometry args={[0.018,8.4]} /><meshStandardMaterial color=\"#8f8268\" emissive=\"#574b39\" emissiveIntensity={0.018} metalness={0.58} roughness={0.5} /></mesh>
    <mesh position={[0.5,0.008,2.55]} rotation={[-Math.PI/2,0,0]}><planeGeometry args={[0.018,8.4]} /><meshStandardMaterial color=\"#678b8d\" emissive=\"#3d6265\" emissiveIntensity={0.018} metalness={0.55} roughness={0.52} /></mesh>
    <mesh position={[0,0.009,-2.65]} rotation={[-Math.PI/2,0,0]}><ringGeometry args={[1.72,1.735,160]} /><meshStandardMaterial color=\"#887a61\" emissive=\"#51442f\" emissiveIntensity={0.016} metalness={0.6} roughness={0.48} /></mesh>
  </group>
}
"""
          s = replace_once(s, old_path, new_path, 'approach path')
          s = replace_once(s, "const groundPack = usePhotographicStonePack(9.5)", "const groundPack = usePhotographicStonePack(2.65)", 'ground texture scale')
          s = replace_once(s, "userData={{ treatment: 'photographic-rock-pbr-v16', source: HOME_PHOTOGRAPHIC_PBR_V16 }}", "userData={{ treatment: 'photographic-rock-pbr-v18-low-frequency', source: HOME_PHOTOGRAPHIC_PBR_V16 }}", 'ground treatment')
          s = replace_once(s, "<StoneMaterial pack={groundPack} color=\"#747976\" bumpScale={0.046} />", "<StoneMaterial pack={groundPack} color=\"#4f5552\" bumpScale={0.034} />", 'ground material')
          s = replace_once(s, "return <Environment files={HOME_HDR} background={false} environmentIntensity={0.82} />", "return <Environment files={HOME_HDR} background={false} environmentIntensity={0.64} />", 'environment intensity')

          old_horizon = """function AtmosphericHorizon() {
  return <group name=\"home-distant-natural-horizon\" userData={{ geometry: 'fog-carried-horizon-without-procedural-ridges-v15' }}>
    <mesh position={[0,-0.27,-49]} rotation={[-Math.PI/2,0,0]} receiveShadow>
      <planeGeometry args={[90,90,1,1]} />
      <meshStandardMaterial color=\"#151b1a\" roughness={1} metalness={0} envMapIntensity={0.12} />
    </mesh>
  </group>
}
"""
          new_horizon = """function AtmosphericHorizon() {
  return <group name=\"home-distant-natural-horizon\" userData={{ geometry: 'fog-carried-seamless-horizon-v18', visualGeometry: 'none-sky-and-fog-own-distance' }} />
}
"""
          s = replace_once(s, old_horizon, new_horizon, 'seamless horizon')

          old_moon = """      <group position={[-18,15,-88]}>
        <mesh name=\"home-physical-moon\" castShadow>
          <sphereGeometry args={[0.72,56,56]} />
          <meshStandardMaterial color=\"#c9c7bc\" roughness={0.98} metalness={0} envMapIntensity={0.3} />
        </mesh>
      </group>"""
          new_moon = """      <group name=\"home-physical-moon\" position={[-18,15,-88]} userData={{ presentation:'off-camera-moonlight-source-v18' }} />"""
          s = replace_once(s, old_moon, new_moon, 'off-camera moonlight')

          s = replace_once(s, "transparent opacity={0.028} transmission={0.95}", "transparent opacity={0.012} transmission={0.92}", 'orb envelope')

          old_platform = """  return <group name=\"home-sanctuary-pavilion\" position={[0,0,-2.65]} userData={{ visualOwner:'photographic-obsidian-ritual-platform-v16' }}>
    <mesh position={[0,0.085,0]} castShadow receiveShadow><cylinderGeometry args={[2.26,2.34,0.17,128,4]} /><StoneMaterial pack={outerPack} color=\"#555a57\" bumpScale={0.034} /></mesh>
    <mesh position={[0,0.18,0]} rotation={[Math.PI/2,0,0]}><ringGeometry args={[1.66,1.68,160]} /><meshStandardMaterial color=\"#85765a\" emissive=\"#54462f\" emissiveIntensity={0.028} metalness={0.64} roughness={0.42} /></mesh>
    <mesh position={[0,0.184,0]} rotation={[Math.PI/2,0,0]}><ringGeometry args={[0.84,0.855,160]} /><meshStandardMaterial color=\"#719c9e\" emissive=\"#476f72\" emissiveIntensity={0.036} metalness={0.58} roughness={0.4} /></mesh>
    <mesh position={[0,0.145,0]} castShadow receiveShadow><cylinderGeometry args={[1.05,1.09,0.12,128,4]} /><StoneMaterial pack={innerPack} color=\"#626763\" bumpScale={0.028} /></mesh>
  </group>"""
          new_platform = """  return <group name=\"home-sanctuary-pavilion\" position={[0,0,-2.65]} userData={{ visualOwner:'photographic-obsidian-ritual-platform-v18-integrated-floor' }}>
    <mesh position={[0,-0.055,0]} castShadow receiveShadow><cylinderGeometry args={[1.98,2.02,0.065,128,2]} /><StoneMaterial pack={outerPack} color=\"#454b48\" bumpScale={0.024} /></mesh>
    <mesh position={[0,-0.018,0]} rotation={[Math.PI/2,0,0]}><ringGeometry args={[1.64,1.657,160]} /><meshStandardMaterial color=\"#85765a\" emissive=\"#54462f\" emissiveIntensity={0.018} metalness={0.64} roughness={0.48} /></mesh>
    <mesh position={[0,-0.016,0]} rotation={[Math.PI/2,0,0]}><ringGeometry args={[0.82,0.836,160]} /><meshStandardMaterial color=\"#719c9e\" emissive=\"#476f72\" emissiveIntensity={0.022} metalness={0.58} roughness={0.46} /></mesh>
  </group>"""
          s = replace_once(s, old_platform, new_platform, 'integrated orb platform')
          s = s.replace("  const innerPack = usePhotographicStonePack(1.45)\n", "")

          portal_clone_anchor = """function cloneSanctuary(source: THREE.Object3D) {
  const root = cloneAuthoredModel(source)
  root.visible = false
  root.userData.retainedForGovernedCompatibilityOnly = true
  root.userData.visibleWorldOwner = 'home-photographic-obsidian-sanctuary-v16'
  return root
}
"""
          portal_clone_new = portal_clone_anchor + """
function clonePortalModel(source: THREE.Object3D) {
  const root = cloneAuthoredModel(source)
  root.traverse((object) => {
    if (!(object instanceof THREE.Mesh)) return
    const materials = Array.isArray(object.material) ? object.material : [object.material]
    for (const material of materials) {
      if (!(material instanceof THREE.MeshStandardMaterial)) continue
      material.color.multiplyScalar(0.46)
      material.emissive.multiplyScalar(0.24)
      material.emissiveIntensity = Math.min(material.emissiveIntensity, 0.16)
      material.roughness = Math.max(material.roughness, 0.48)
      material.metalness = Math.max(material.metalness, 0.24)
      material.envMapIntensity = Math.min(material.envMapIntensity, 0.66)
      material.needsUpdate = true
    }
  })
  return root
}
"""
          s = replace_once(s, portal_clone_anchor, portal_clone_new, 'portal material treatment')
          s = replace_once(s, "const model = useMemo(() => cloneAuthoredModel(portal.scene), [portal.scene])", "const model = useMemo(() => clonePortalModel(portal.scene), [portal.scene])", 'portal clone')
          s = replace_once(s, "position={[0,1.55,0]} scale={0.62}", "position={[0,1.42,0]} scale={0.46}", 'portal scale')

          player_sig_old = """function PlayerRig({ input, yaw, pitch, target, avatar, onNearby, transition, reducedMotion, onTransitionComplete }: { input:MovementInput; yaw:MutableRefObject<number>; pitch:MutableRefObject<number>; target:MutableRefObject<THREE.Vector3|null>; avatar:MutableRefObject<THREE.Group|null>; onNearby:(value:Nearby)=>void; transition:'none'|'ground'|'life-map'; reducedMotion:boolean; onTransitionComplete:()=>void }) {"""
          player_sig_new = """function PlayerRig({ input, yaw, pitch, target, avatar, onNearby, transition, reducedMotion, onTransitionComplete, onTransitionSequence }: { input:MovementInput; yaw:MutableRefObject<number>; pitch:MutableRefObject<number>; target:MutableRefObject<THREE.Vector3|null>; avatar:MutableRefObject<THREE.Group|null>; onNearby:(value:Nearby)=>void; transition:'none'|'ground'|'life-map'; reducedMotion:boolean; onTransitionComplete:()=>void; onTransitionSequence:(value:TransitionSequence)=>void }) {"""
          s = replace_once(s, player_sig_old, player_sig_new, 'player transition signature')
          s = replace_once(s, "  const last = useRef<Nearby>(null)\n", "  const last = useRef<Nearby>(null)\n  const lastSequence = useRef<TransitionSequence>('idle')\n", 'sequence ref')
          s = replace_once(s,
              "    camera.position.set(2.42,1.64,8.12)\n    camera.lookAt(0.25,1.22,-2.9)",
              "    camera.position.set(1.18,1.62,7.34)\n    camera.lookAt(0,1.3,-2.65)",
              'initial camera framing')
          seq_anchor = """      const duration=reducedMotion?0.45:transition==='life-map'?3.4:2.6
      const t=THREE.MathUtils.smootherstep(THREE.MathUtils.clamp((clock.elapsedTime-started.current)/duration,0,1),0,1)
"""
          seq_new = seq_anchor + """      const sequence: TransitionSequence = transition==='life-map'
        ? (t<0.16?'life-map:opening':t<0.84?'life-map:traversal':'life-map:closing')
        : (t<0.16?'ground:opening':t<0.84?'ground:traversal':'ground:closing')
      if(sequence!==lastSequence.current){lastSequence.current=sequence;onTransitionSequence(sequence)}
"""
          s = replace_once(s, seq_anchor, seq_new, 'transition lifecycle')
          s = replace_once(s,
              "    started.current=null\n    issued.current=false\n    stepEmbodiedMotion",
              "    started.current=null\n    issued.current=false\n    if(lastSequence.current!=='idle'){lastSequence.current='idle';onTransitionSequence('idle')}\n    stepEmbodiedMotion",
              'transition lifecycle reset')

          scene_sig_old = """function SacredScene(props:{input:MovementInput;yaw:MutableRefObject<number>;pitch:MutableRefObject<number>;target:MutableRefObject<THREE.Vector3|null>;avatar:MutableRefObject<THREE.Group|null>;nearby:(value:Nearby)=>void;orbState:OrbState;reducedMotion:boolean;transition:'none'|'ground'|'life-map';onOrb:()=>void;onGround:()=>void;onLifeMap:()=>void;onTransitionComplete:()=>void;onReady:()=>void}){"""
          scene_sig_new = """function SacredScene(props:{input:MovementInput;yaw:MutableRefObject<number>;pitch:MutableRefObject<number>;target:MutableRefObject<THREE.Vector3|null>;avatar:MutableRefObject<THREE.Group|null>;nearby:(value:Nearby)=>void;orbState:OrbState;reducedMotion:boolean;transition:'none'|'ground'|'life-map';onOrb:()=>void;onGround:()=>void;onLifeMap:()=>void;onTransitionComplete:()=>void;onTransitionSequence:(value:TransitionSequence)=>void;onReady:()=>void}){"""
          s = replace_once(s, scene_sig_old, scene_sig_new, 'scene transition signature')
          s = replace_once(s, "onTransitionComplete={props.onTransitionComplete} />", "onTransitionComplete={props.onTransitionComplete} onTransitionSequence={props.onTransitionSequence} />", 'scene sequence handoff')

          s = replace_once(s, "  const [transition,setTransition]=useState<'none'|'ground'|'life-map'>('none')\n", "  const [transition,setTransition]=useState<'none'|'ground'|'life-map'>('none')\n  const [portalSequence,setPortalSequence]=useState<TransitionSequence>('idle')\n", 'portal sequence state')
          s = replace_once(s, "const ground=useCallback(()=>{if(transition!=='none')return;target.current=null;setOrbState('transition');setTransition('ground')},[transition])", "const ground=useCallback(()=>{if(transition!=='none')return;target.current=null;setOrbState('transition');setPortalSequence('ground:opening');setTransition('ground')},[transition])", 'ground opening')
          s = replace_once(s, "const lifeMap=useCallback(()=>{if(transition!=='none')return;target.current=null;setOrbState('transition');setTransition('life-map');useSceneStore.getState().enterLifeMap()},[transition])", "const lifeMap=useCallback(()=>{if(transition!=='none')return;target.current=null;setOrbState('transition');setPortalSequence('life-map:opening');setTransition('life-map');useSceneStore.getState().enterLifeMap()},[transition])", 'life-map opening')
          s = replace_once(s, "      setTransition('none')\n      setOrbState('idle')", "      setTransition('none')\n      setPortalSequence('idle')\n      setOrbState('idle')", 'escape lifecycle reset')
          s = replace_once(s, "data-home-visual-grade=\"cinematic-pbr-v17-photographic-runtime-sanctuary\"", "data-home-visual-grade=\"cinematic-pbr-v18-final-physical-sanctuary\"", 'visual grade')
          s = replace_once(s, "data-home-scene-phase={transition==='none'?'HOME':transition.toUpperCase()} data-home-input-locked", "data-home-scene-phase={transition==='none'?'HOME':transition.toUpperCase()} data-home-portal-sequence={portalSequence} data-home-portal-lifecycle=\"environmental-approach-traversal-arrival\" data-home-animation-owner=\"photographic-sanctuary-plus-cc0-fern-plus-authored-living-orb\" data-home-input-locked", 'runtime evidence ownership')
          s = replace_once(s, "camera={{position:[2.42,1.64,8.12],fov:39,near:0.1,far:180}}", "camera={{position:[1.18,1.62,7.34],fov:41,near:0.1,far:180}}", 'canvas camera')
          s = replace_once(s, "onTransitionComplete={complete} onReady={markSceneReady}", "onTransitionComplete={complete} onTransitionSequence={setPortalSequence} onReady={markSceneReady}", 'runtime sequence callback')
          sacred_path.write_text(s)

          runtime_path = Path('urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx')
          r = runtime_path.read_text()
          r = replace_once(r,
              "function HomeSemanticNavigation() {\n  return (",
              "function directHomeSemanticTravel(href: string) {\n  if (typeof window === 'undefined') return\n  window.location.assign(href)\n}\n\nfunction HomeSemanticNavigation() {\n  return (",
              'semantic direct helper')
          r = replace_once(r,
              "onClick={() => requestUraiWorldTravel({ destination: 'infrastructure-hub', href: '/ground/', entryPortal: 'home-ground', cameraCheckpoint: 'home-ground-descent' })}",
              "onClick={() => directHomeSemanticTravel('/ground/?entryPortal=home-ground&cameraCheckpoint=home-ground-descent')}",
              'semantic ground navigation')
          r = replace_once(r,
              "onClick={() => requestUraiWorldTravel({ destination: 'life-map', href: '/life-map/' })}",
              "onClick={() => directHomeSemanticTravel('/life-map/')}",
              'semantic life-map navigation')
          r = r.replace("import { requestUraiWorldOrbOpen, requestUraiWorldTravel } from '@/spatial/world/worldEvents'", "import { requestUraiWorldOrbOpen } from '@/spatial/world/worldEvents'")
          runtime_path.write_text(r)

          proof_path = Path('scripts/run-continuous-spatial-proof-v22-natural.mjs')
          p = proof_path.read_text()
          p = replace_once(p,
              "const newOwner = \"result.animationOwner === 'canonical-sanctuary-plus-cc0-fern-plus-living-orb'\"",
              "const newOwner = \"result.animationOwner === 'photographic-sanctuary-plus-cc0-fern-plus-authored-living-orb'\"",
              'visual proof ownership')
          proof_path.write_text(p)

          test_path = Path('urai-tier1/tests/home-relic-machine-realism-contract.test.mjs')
          t = test_path.read_text()
          t = t.replace('hand-laid-photographic-stone-v16', 'recessed-sacred-inlay-v18')
          t = t.replace('cinematic-pbr-v17-photographic-runtime-sanctuary', 'cinematic-pbr-v18-final-physical-sanctuary')
          t = t.replace('fog-carried-horizon-without-procedural-ridges-v15', 'fog-carried-seamless-horizon-v18')
          if 'APPROACH_SLABS' not in t:
              t = t.replace("assert.doesNotMatch(source, /function Lantern/)", "assert.doesNotMatch(source, /function Lantern/)\n  assert.doesNotMatch(source, /APPROACH_SLABS/)\n  assert.doesNotMatch(source, /planeGeometry args=\\{\\[90,90,1,1\\]\\}/)")
          test_path.write_text(t)
          PY

      - name: Run focused final-art contracts
        working-directory: urai-tier1
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/home-relic-machine-realism-contract.test.mjs tests/embodied-exploration-contract.test.mjs

      - name: Commit exact convergence successor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-relic-machine-realism-20260826" --jq .object.sha)"
          if [ "$current" != "${GITHUB_SHA}" ]; then
            echo "Branch moved to $current; refusing stale final-art patch from ${GITHUB_SHA}."
            exit 1
          fi
          test -n "$(git status --porcelain)"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionSacred.tsx urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx urai-tier1/tests/home-relic-machine-realism-contract.test.mjs scripts/run-continuous-spatial-proof-v22-natural.mjs
          git commit -m 'Finish Home photographic sanctuary final-art composition'
          gh auth setup-git
          git push origin HEAD:home-final-relic-machine-realism-20260826
