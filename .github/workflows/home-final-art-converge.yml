name: Home Final Art Converge

on:
  push:
    branches:
      - home-final-relic-machine-realism-20260826
    paths:
      - '.github/workflows/home-final-art-converge.yml'
      - 'scripts/apply-home-v20-final-art.py'

permissions:
  contents: write

concurrency:
  group: home-final-art-converge
  cancel-in-progress: true

env:
  HOME_FINAL_ART_CONVERGENCE_REVISION: '3'

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply deterministic V20 physical final-art patch
        run: python3 scripts/apply-home-v20-final-art.py

      - name: Run focused live-owner contracts
        working-directory: urai-tier1
        run: node --test --test-concurrency=1 tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs tests/continuous-spatial-restoration-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs

      - name: Commit exact successor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-relic-machine-realism-20260826" --jq .object.sha)"
          test "$current" = "${GITHUB_SHA}"
          test -n "$(git status --porcelain)"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx
          git commit -m 'Apply Home V20 physical final-art runtime'
          gh auth setup-git
          git push origin HEAD:home-final-relic-machine-realism-20260826
