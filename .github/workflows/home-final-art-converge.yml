name: Home Final Art Converge

on:
  push:
    branches:
      - home-final-relic-machine-realism-20260826
    paths:
      - '.github/workflows/home-final-art-converge.yml'

permissions:
  contents: write

concurrency:
  group: home-final-art-converge
  cancel-in-progress: true

jobs:
  converge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply deterministic final-art patch
        run: python3 scripts/apply-home-final-art-convergence.py

      - name: Run focused contracts
        working-directory: urai-tier1
        run: node --test --test-concurrency=1 tests/home-relic-machine-realism-contract.test.mjs tests/embodied-exploration-contract.test.mjs

      - name: Commit exact successor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-relic-machine-realism-20260826" --jq .object.sha)"
          test "$current" = "${GITHUB_SHA}"
          test -n "$(git status --porcelain)"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionSacred.tsx urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx urai-tier1/tests/home-relic-machine-realism-contract.test.mjs scripts/run-continuous-spatial-proof-v22-natural.mjs
          git commit -m 'Finish Home photographic sanctuary final-art composition'
          gh auth setup-git
          git push origin HEAD:home-final-relic-machine-realism-20260826
