name: One-time visible route smoke repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-visible-route-smoke-repair.yml'

permissions:
  contents: write

concurrency:
  group: one-time-visible-route-smoke-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'release/fix-visible-route-smoke-20260715'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Prove exact repair boundary
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: 0dac29563148c3e6f2b4532eee7217f6dea07e8d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE"
          test -z "$(git status --porcelain --untracked-files=all)"
          changed="$(git diff --name-only "$EXPECTED_BASE" HEAD)"
          test "$changed" = '.github/workflows/one-time-visible-route-smoke-repair.yml'

      - name: Apply fail-closed visible-surface repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/urai-release-control-smoke.mjs')
          source = script.read_text()
          old = """  async function verifyHydratedIdentity(page, check, profileName) {
            const surface = page.locator(check.selector)
            await surface.waitFor({ state: 'visible', timeout: 20000 })
"""
          new = """  async function verifyHydratedIdentity(page, check, profileName) {
            const visibleSelector = `${check.selector}:visible`
            const surface = page.locator(visibleSelector)
            await surface.waitFor({ state: 'visible', timeout: 20000 })
"""
          if source.count(old) != 1:
              raise SystemExit('Expected one exact hydrated identity locator block')
          source = source.replace(old, new)
          source = source.replace(
              "report.hydratedIdentityChecks.push({ profile: profileName, route: check.name, selector: check.selector, observed, passed: true })",
              "report.hydratedIdentityChecks.push({ profile: profileName, route: check.name, selector: visibleSelector, observed, passed: true })",
          )
          script.write_text(source)

          test = Path('urai-tier1/tests/release-control-visible-surface-contract.test.mjs')
          test.write_text("""import assert from 'node:assert/strict'\nimport { readFileSync } from 'node:fs'\nimport test from 'node:test'\n\nconst source = readFileSync(new URL('../../scripts/urai-release-control-smoke.mjs', import.meta.url), 'utf8')\n\ntest('strict release smoke targets a visible hydrated route instance', () => {\n  assert.match(source, /const visibleSelector = `\\$\\{check\\.selector\\}:visible`/)\n  assert.match(source, /page\\.locator\\(visibleSelector\\)/)\n  assert.match(source, /surface\\.waitFor\\(\\{ state: 'visible', timeout: 20000 \\}\\)/)\n  assert.doesNotMatch(source, /const surface = page\\.locator\\(check\\.selector\\)/)\n})\n\ntest('visible instance identity remains fully fail-closed', () => {\n  for (const field of ['memoryId', 'manifestId', 'node']) {\n    assert.match(source, new RegExp(`${field}: await surface\\\\.getAttribute`))\n  }\n  assert.match(source, /throw new Error\\(`\\$\\{check\\.name\\} hydrated identity failed/)\n  assert.match(source, /selector: visibleSelector/)\n})\n""")
          PY

      - name: Verify focused release contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/release-control-visible-surface-contract.test.mjs
          node --test urai-tier1/tests/exact-static-release-contract.test.mjs
          node scripts/audit-production-workflow-authority.mjs
          node scripts/verify-production-action-pins.mjs
          node scripts/verify-release-credential-boundary-static.mjs

      - name: Commit permanent repair and remove helper
        shell: bash
        env:
          BRANCH: release/fix-visible-route-smoke-20260715
        run: |
          set -euo pipefail
          rm .github/workflows/one-time-visible-route-smoke-repair.yml
          git add scripts/urai-release-control-smoke.mjs urai-tier1/tests/release-control-visible-surface-contract.test.mjs .github/workflows/one-time-visible-route-smoke-repair.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/one-time-visible-route-smoke-repair.yml' 'scripts/urai-release-control-smoke.mjs' 'urai-tier1/tests/release-control-visible-surface-contract.test.mjs' | sort)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix strict smoke visible route selection'
          git push origin "HEAD:$BRANCH"
