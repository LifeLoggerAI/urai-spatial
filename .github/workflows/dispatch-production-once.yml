name: Dispatch URAI Production Once
# Protected convergence for the fingerprint-gated Status smoke repair; transient GitHub API failures are recovered without duplicating an accepted deployment run.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-production-once.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Detect live authority and dispatch the correct protected release mode
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'spatial-live-deploy.yml';
            const releaseSha = context.sha;
            let rollbackSha = 'e2850a8b9dbd2fd11ee0197505da278322916aa0';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const transientStatuses = new Set([408, 409, 425, 429, 500, 502, 503, 504]);

            function errorStatus(error) {
              return Number(error?.status || error?.response?.status || 0);
            }

            async function withTransientRetry(label, operation, attempts = 6) {
              let lastError;
              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                try {
                  return await operation();
                } catch (error) {
                  lastError = error;
                  const status = errorStatus(error);
                  if (!transientStatuses.has(status) || attempt === attempts) throw error;
                  const delayMs = Math.min(30_000, 2_000 * (2 ** (attempt - 1)));
                  core.warning(`${label} returned transient HTTP ${status}; retrying attempt ${attempt + 1}/${attempts} after ${delayMs}ms.`);
                  await sleep(delayMs);
                }
              }
              throw lastError;
            }

            async function readLiveFingerprint() {
              const detectionTimeoutMs = 10_000;
              let lastError;
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                try {
                  const response = await fetch(`https://urai.app/release-fingerprint.json?dispatch_check=${Date.now()}`, {
                    redirect: 'manual',
                    signal: AbortSignal.timeout(detectionTimeoutMs),
                    headers: { accept: 'application/json', 'cache-control': 'no-cache, no-store, max-age=0' }
                  });
                  if (response.status >= 500 && attempt < 4) {
                    await sleep(1_000 * attempt);
                    continue;
                  }
                  if (response.status !== 200) return null;
                  const contentType = response.headers.get('content-type') || '';
                  if (!contentType.toLowerCase().includes('application/json')) return null;
                  const body = await response.json();
                  if (body?.schemaVersion !== 'urai-release-fingerprint-1') return null;
                  if (typeof body.releaseSha !== 'string' || !/^[0-9a-f]{40}$/i.test(body.releaseSha)) {
                    throw new Error('Live release fingerprint has an invalid releaseSha');
                  }
                  return body;
                } catch (error) {
                  lastError = error;
                  if (attempt < 4) {
                    await sleep(1_000 * attempt);
                    continue;
                  }
                }
              }
              const message = lastError instanceof Error ? lastError.message : String(lastError);
              throw new Error(`Live fingerprint detection failed after bounded retries: ${message}`);
            }

            async function listDispatchRuns() {
              return withTransientRetry('List protected deployment runs', () => github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                event: 'workflow_dispatch',
                head_sha: releaseSha,
                per_page: 30
              }));
            }

            function findUnseenRun(response, excludedRunIds) {
              return response.data.workflow_runs.find((candidate) =>
                candidate.head_sha === releaseSha && !excludedRunIds.has(candidate.id)
              ) || null;
            }

            async function probeAcceptedDispatch(excludedRunIds, attempts = 8) {
              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                const response = await listDispatchRuns();
                const run = findUnseenRun(response, excludedRunIds);
                if (run) return run;
                if (attempt < attempts) await sleep(5_000);
              }
              return null;
            }

            async function createDispatchSafely(confirm, excludedRunIds) {
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  await github.rest.actions.createWorkflowDispatch({
                    owner,
                    repo,
                    workflow_id,
                    ref: 'main',
                    inputs: { release_sha: releaseSha, rollback_sha: rollbackSha, confirm }
                  });
                  return null;
                } catch (error) {
                  lastError = error;
                  const status = errorStatus(error);
                  if (!transientStatuses.has(status)) throw error;

                  core.warning(`Create protected workflow dispatch returned transient HTTP ${status}; probing for an accepted run before any retry.`);
                  const acceptedRun = await probeAcceptedDispatch(excludedRunIds);
                  if (acceptedRun) {
                    core.warning(`Protected deployment run ${acceptedRun.id} was accepted despite the transient dispatch response; creation will not be repeated.`);
                    return acceptedRun;
                  }

                  if (attempt === 3) throw error;
                  const delayMs = 5_000 * attempt;
                  core.warning(`No accepted run appeared after the transient response; retrying dispatch creation attempt ${attempt + 1}/3 after ${delayMs}ms.`);
                  await sleep(delayMs);
                }
              }
              throw lastError;
            }

            async function dispatchAndWait(confirm, excludedRunIds = new Set()) {
              let run = await createDispatchSafely(confirm, excludedRunIds);

              for (let attempt = 0; !run && attempt < 90; attempt += 1) {
                const response = await listDispatchRuns();
                run = findUnseenRun(response, excludedRunIds);
                if (run) break;
                await sleep(10000);
              }
              if (!run) throw new Error(`No ${confirm} run appeared for ${releaseSha}`);

              for (let attempt = 0; attempt < 240 && run.status !== 'completed'; attempt += 1) {
                await sleep(10000);
                const response = await withTransientRetry('Read protected deployment run', () => github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                }));
                run = response.data;
              }
              if (run.status !== 'completed') throw new Error(`${confirm} run ${run.id} did not complete`);

              const jobsResponse = await withTransientRetry('List protected deployment jobs', () => github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100
              }));
              return { run, jobs: jobsResponse.data.jobs };
            }

            function receiptSection(label, result) {
              const jobLines = result.jobs.map((job) =>
                `- ${job.name}: ${job.status}/${job.conclusion || 'none'}`
              );
              return [
                `## ${label}`,
                '',
                `- Release SHA: \`${releaseSha}\``,
                `- Rollback SHA: \`${rollbackSha}\``,
                `- Workflow run: ${result.run.html_url}`,
                `- Run ID: \`${result.run.id}\``,
                `- Status: \`${result.run.status}\``,
                `- Conclusion: \`${result.run.conclusion || 'none'}\``,
                '',
                '### Jobs',
                ...jobLines
              ].join('\n');
            }

            const existingRuns = await listDispatchRuns();
            const excludedRunIds = new Set(existingRuns.data.workflow_runs.map((run) => run.id));
            const sections = [];
            const liveFingerprint = await readLiveFingerprint();

            if (!liveFingerprint) {
              const bootstrap = await dispatchAndWait('BOOTSTRAP_LEGACY_URAI_APP', excludedRunIds);
              excludedRunIds.add(bootstrap.run.id);
              sections.push(receiptSection('URAI legacy bootstrap production receipt', bootstrap));
              if (bootstrap.run.conclusion !== 'success') {
                const body = sections.join('\n\n');
                await withTransientRetry('Create bootstrap receipt issue', () => github.rest.issues.create({
                  owner,
                  repo,
                  title: `Bootstrap receipt ${releaseSha.slice(0, 12)} — ${bootstrap.run.conclusion}`,
                  body
                }));
                core.summary.addRaw(body).write();
                core.setFailed(`Legacy bootstrap concluded ${bootstrap.run.conclusion}`);
                return;
              }
            } else {
              rollbackSha = liveFingerprint.releaseSha;
              sections.push(`## URAI live authority detection\n\n- Valid release fingerprint already exists.\n- Legacy bootstrap skipped.\n- Rollback SHA: \`${rollbackSha}\`.`);
            }

            const deployment = await dispatchAndWait('DEPLOY_URAI_APP', excludedRunIds);
            sections.push(receiptSection('URAI fingerprinted production deployment receipt', deployment));
            const body = sections.join('\n\n');

            await withTransientRetry('Create production convergence issue', () => github.rest.issues.create({
              owner,
              repo,
              title: `Production convergence ${releaseSha.slice(0, 12)} — ${deployment.run.conclusion}`,
              body
            }));
            core.summary.addRaw(body).write();
            if (deployment.run.conclusion !== 'success') {
              core.setFailed(`Fingerprinted production deployment concluded ${deployment.run.conclusion}`);
            }
