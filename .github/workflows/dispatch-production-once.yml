name: Dispatch URAI Production Once
# Protected convergence request for merged V2 runtime asset authority 7b14db387ab99fc5c278d10d8fd92be7f0478531; workflow runs are listed broadly and exact-SHA filtered locally to avoid unstable server-side head_sha queries.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-production-once.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest