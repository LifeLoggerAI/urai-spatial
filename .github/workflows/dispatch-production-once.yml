name: Dispatch URAI Production Once
# One-shot production convergence retrigger for canonical main@1bd23392501267089559a8cd1d738ecc1089009d after fingerprint-gated Status truth merged without touching the path-filtered dispatcher.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-production-once.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Detect live authority and dispatch the correct protected release mode
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'spatial-live-deploy.yml';
            const releaseSha = context.sha;
            let rollbackSha = 'e2850a8b9dbd2fd11ee0197505da278322916aa0';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function readLiveFingerprint() {
              const detectionTimeoutMs = 10_000;
              try {
                const response = await fetch(`https://urai.app/release-fingerprint.json?dispatch_check=${Date.now()}`, {
                  redirect: 'manual',
                  signal: AbortSignal.timeout(detectionTimeoutMs),
                  headers: { accept: 'application/json', 'cache-control': 'no-cache, no-store, max-age=0' }
                });
                if (response.status !== 200) return null;
                const contentType = response.headers.get('content-type') || '';
                if (!contentType.toLowerCase().includes('application/json')) return null;
                const body = await response.json();
                if (body?.schemaVersion !== 'urai-release-fingerprint-1') return null;
                if (typeof body.releaseSha !== 'string' || !/^[0-9a-f]{40}$/i.test(body.releaseSha)) {
                  throw new Error('Live release fingerprint has an invalid releaseSha');
                }
                return body;
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                throw new Error(`Live fingerprint detection failed within ${detectionTimeoutMs}ms: ${message}`);
              }
            }

            async function dispatchAndWait(confirm, excludedRunIds = new Set()) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id,
                ref: 'main',
                inputs: { release_sha: releaseSha, rollback_sha: rollbackSha, confirm }
              });

              let run = null;
              for (let attempt = 0; attempt < 90; attempt += 1) {
                const response = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id,
                  event: 'workflow_dispatch',
                  head_sha: releaseSha,
                  per_page: 30
                });
                run = response.data.workflow_runs.find((candidate) =>
                  candidate.head_sha === releaseSha && !excludedRunIds.has(candidate.id)
                ) || null;
                if (run) break;
                await sleep(10000);
              }
              if (!run) throw new Error(`No ${confirm} run appeared for ${releaseSha}`);

              for (let attempt = 0; attempt < 240 && run.status !== 'completed'; attempt += 1) {
                await sleep(10000);
                const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
                run = response.data;
              }
              if (run.status !== 'completed') throw new Error(`${confirm} run ${run.id} did not complete`);

              const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100
              });
              return { run, jobs: jobsResponse.data.jobs };
            }

            function receiptSection(label, result) {
              const jobLines = result.jobs.map((job) =>
                `- ${job.name}: ${job.status}/${job.conclusion || 'none'}`
              );
              return [
                `## ${label}`,
                '',
                `- Release SHA: \`${releaseSha}\``,
                `- Rollback SHA: \`${rollbackSha}\``,
                `- Workflow run: ${result.run.html_url}`,
                `- Run ID: \`${result.run.id}\``,
                `- Status: \`${result.run.status}\``,
                `- Conclusion: \`${result.run.conclusion || 'none'}\``,
                '',
                '### Jobs',
                ...jobLines
              ].join('\n');
            }

            const existingRuns = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id,
              event: 'workflow_dispatch',
              head_sha: releaseSha,
              per_page: 30
            });
            const excludedRunIds = new Set(existingRuns.data.workflow_runs.map((run) => run.id));
            const sections = [];
            const liveFingerprint = await readLiveFingerprint();

            if (!liveFingerprint) {
              const bootstrap = await dispatchAndWait('BOOTSTRAP_LEGACY_URAI_APP', excludedRunIds);
              excludedRunIds.add(bootstrap.run.id);
              sections.push(receiptSection('URAI legacy bootstrap production receipt', bootstrap));
              if (bootstrap.run.conclusion !== 'success') {
                const body = sections.join('\n\n');
                await github.rest.issues.create({ owner, repo, title: `Bootstrap receipt ${releaseSha.slice(0, 12)} — ${bootstrap.run.conclusion}`, body });
                core.summary.addRaw(body).write();
                core.setFailed(`Legacy bootstrap concluded ${bootstrap.run.conclusion}`);
                return;
              }
            } else {
              rollbackSha = liveFingerprint.releaseSha;
              sections.push(`## URAI live authority detection\n\n- Valid release fingerprint already exists.\n- Legacy bootstrap skipped.\n- Rollback SHA: \`${rollbackSha}\`.`);
            }

            const deployment = await dispatchAndWait('DEPLOY_URAI_APP', excludedRunIds);
            sections.push(receiptSection('URAI fingerprinted production deployment receipt', deployment));
            const body = sections.join('\n\n');

            await github.rest.issues.create({
              owner,
              repo,
              title: `Production convergence ${releaseSha.slice(0, 12)} — ${deployment.run.conclusion}`,
              body
            });
            core.summary.addRaw(body).write();
            if (deployment.run.conclusion !== 'success') {
              core.setFailed(`Fingerprinted production deployment concluded ${deployment.run.conclusion}`);
            }
