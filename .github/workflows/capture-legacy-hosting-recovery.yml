name: Legacy Firebase Hosting Recovery Verification

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed Spatial commit SHA
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: urai-legacy-hosting-recovery-verification-${{ inputs.expected_sha }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  EXPECTED_SHA: ${{ inputs.expected_sha }}

jobs:
  verify:
    name: Verify legacy recovery remains quarantined
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify source-only recovery quarantine
        shell: bash
        run: |
          set -euo pipefail
          node scripts/firebase-hosting-recovery.mjs --self-test
          node --test urai-tier1/tests/firebase-hosting-recovery-contract.test.mjs
          node --test urai-tier1/tests/firebase-hosting-capture-workflow-contract.test.mjs
          node scripts/audit-production-workflow-authority.mjs
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Write NO-GO recovery receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p artifacts/legacy-hosting-recovery
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            schemaVersion: 'urai-legacy-hosting-recovery-quarantine-1',
            repository: process.env.GITHUB_REPOSITORY,
            workflowRunId: process.env.GITHUB_RUN_ID,
            exactHeadSha: process.env.EXPECTED_SHA,
            status: process.env.JOB_STATUS,
            classification: 'NO-GO',
            checksOnly: true,
            productionCredentialsAvailable: false,
            recoveryMutationAttempted: false,
            providerRecoveryVerified: false,
          };
          fs.writeFileSync(
            'artifacts/legacy-hosting-recovery/quarantine.json',
            `${JSON.stringify(receipt, null, 2)}\n`,
          );
          NODE

      - name: Upload quarantine receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-legacy-hosting-recovery-verification-${{ inputs.expected_sha }}
          path: artifacts/legacy-hosting-recovery/quarantine.json
          if-no-files-found: error
          retention-days: 365
