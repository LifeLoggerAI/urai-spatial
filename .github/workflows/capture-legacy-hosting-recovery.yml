name: Capture legacy Firebase Hosting recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CAPTURE_LEGACY_HOSTING_VERSION
        required: true
        default: CHECK_ONLY
        type: string

permissions:
  contents: read

concurrency:
  group: urai-legacy-hosting-recovery-capture
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  EXPECTED_FIREBASE_SITE: urai-4dc1d

jobs:
  capture:
    name: Capture exact current live Hosting version
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'CAPTURE_LEGACY_HOSTING_VERSION'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact protected main authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean protected main identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$GITHUB_SHA"
          test '${{ inputs.confirm }}' = 'CAPTURE_LEGACY_HOSTING_VERSION'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify source-only recovery tool
        shell: bash
        run: |
          set -euo pipefail
          node scripts/firebase-hosting-recovery.mjs --self-test
          node --test urai-tier1/tests/firebase-hosting-recovery-contract.test.mjs
          node --test urai-tier1/tests/firebase-hosting-capture-workflow-contract.test.mjs
          node scripts/audit-production-workflow-authority.mjs
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate production WIF configuration
        shell: bash
        env:
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$GCP_WIF_PROVIDER"
          test -n "$GCP_DEPLOY_SERVICE_ACCOUNT"

      - name: Authenticate dedicated production identity through GitHub OIDC/WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.EXPECTED_FIREBASE_SITE }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install pinned Google Cloud CLI action
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.EXPECTED_FIREBASE_SITE }}
          version: '>= 500.0.0'

      - name: Prove federated read-only recovery identity
        shell: bash
        env:
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "$GOOGLE_APPLICATION_CREDENTIALS"
          test -n "$GOOGLE_GHA_CREDS_PATH"
          test "$GOOGLE_APPLICATION_CREDENTIALS" = "$GOOGLE_GHA_CREDS_PATH"
          test "$(gcloud config get-value project 2>/dev/null)" = "$EXPECTED_FIREBASE_SITE"
          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test -n "$active_account"
          test "$active_account" = "$GCP_DEPLOY_SERVICE_ACCOUNT"

      - name: Discover exact current live Hosting version
        env:
          FIREBASE_SITE_ID: ${{ env.EXPECTED_FIREBASE_SITE }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          URAI_HOSTING_RECOVERY_RECEIPT: ${{ runner.temp }}/hosting-recovery/legacy-live-release.json
        run: |
          set -euo pipefail
          node scripts/firebase-hosting-recovery.mjs discover
          test -s "$URAI_HOSTING_RECOVERY_RECEIPT"

      - name: Prove no source mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload exact Hosting recovery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-legacy-hosting-recovery-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/hosting-recovery/
          if-no-files-found: error
          retention-days: 365
