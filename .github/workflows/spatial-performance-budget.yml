name: Spatial Performance Budget

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'operations/performance/**'
      - 'scripts/audit-spatial-performance-budget.mjs'
      - 'urai-tier1/src/spatial/performance/**'
      - 'urai-tier1/src/spatial/components/world/SpatialWorldCanvas.tsx'
      - 'urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx'
      - 'urai-tier1/src/components/lifemap/LifeMapRouteBoundary.tsx'
      - 'urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx'
      - 'urai-tier1/public/assets/urai/**'
      - '.github/workflows/spatial-performance-budget.yml'

permissions:
  contents: read

jobs:
  spatial-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact clean candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit performance contracts and asset budgets
        run: node scripts/audit-spatial-performance-budget.mjs
      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Typecheck adaptive spatial runtime
        run: corepack pnpm --dir urai-tier1 typecheck
