name: URAI Spatial CI

on:
  workflow_dispatch:
    inputs:
      verification_sha:
        description: "Exact 40-character commit SHA to verify"
        required: true
        type: string
  pull_request:
    paths:
      - "**"
  push:
    branches: [main, tier-1-5-final-lock]

permissions:
  contents: read

concurrency:
  group: urai-spatial-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || inputs.verification_sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}

jobs:
  workspace:
    name: Workspace install and preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Source integrity
        run: pnpm check:source-integrity
      - name: Production route exposure
        run: pnpm check:production-routes
      - name: Preflight
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-diagnostics
          pnpm preflight 2>&1 | tee artifacts/ci-diagnostics/workspace-preflight.log
      - name: Runtime authority
        run: pnpm runtime:authority
      - name: Nuclear canon check
        run: pnpm canon:check
      - name: Tier-1 canon lock
        run: pnpm canon:lock
      - name: Tier governance checks
        run: pnpm tier1:check && pnpm tier2:check && pnpm tier3:check && pnpm tier4:check && pnpm tier5:check
      - name: Tier-1 drift lock
        run: pnpm tier1:drift
      - name: Home invariant lock
        run: pnpm home:invariant
      - name: Firebase Tier-1 boundary lock
        run: pnpm firebase:rules:check
      - name: LOCS and migration checks
        run: pnpm test:canon
      - name: Upload workspace diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-workspace-preflight-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: artifacts/ci-diagnostics/workspace-preflight.log
          if-no-files-found: ignore

  lifemap-fast-gate:
    name: LifeMap targeted fast gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Run LifeMap targeted tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-diagnostics
          pnpm --filter urai-tier1 test:lifemap 2>&1 | tee artifacts/ci-diagnostics/lifemap-targeted.log
      - name: Upload LifeMap diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-lifemap-targeted-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: artifacts/ci-diagnostics/lifemap-targeted.log
          if-no-files-found: error

  tier1:
    name: Tier 1 typecheck build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Source integrity
        run: pnpm check:source-integrity
      - name: Production route exposure
        run: pnpm check:production-routes
      - name: Typecheck
        run: pnpm --filter urai-tier1 typecheck
      - name: Tier lock verifier
        run: pnpm --filter urai-tier1 verify:tier-lock
      - name: Nuclear canon check
        run: pnpm canon:check
      - name: Tier-1 canon lock
        run: pnpm canon:lock
      - name: Tier governance checks
        run: pnpm tier1:check && pnpm tier2:check && pnpm tier3:check && pnpm tier4:check && pnpm tier5:check
      - name: Tier-1 drift lock
        run: pnpm tier1:drift
      - name: Home invariant lock
        run: pnpm home:invariant
      - name: Firebase Tier-1 boundary lock
        run: pnpm firebase:rules:check
      - name: LOCS and migration checks
        run: pnpm test:canon
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-diagnostics
          pnpm --filter urai-tier1 test 2>&1 | tee artifacts/ci-diagnostics/tier1-unit.log
      - name: Lifemap focused tests
        run: pnpm --filter urai-tier1 test:lifemap
      - name: Build
        run: pnpm --filter urai-tier1 build
      - name: Upload Tier 1 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-tier1-diagnostics-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: artifacts/ci-diagnostics/tier1-unit.log
          if-no-files-found: ignore

  spatial-e2e-lock:
    name: Spatial camera navigation and ESC lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser and Linux dependencies
        run: pnpm playwright:ensure
      - name: Run spatial E2E lock
        run: pnpm test:e2e
      - name: Upload spatial lock artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spatial-lock-artifacts-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: artifacts/spatial-lock
          if-no-files-found: ignore

  functions:
    name: Functions build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build functions
        run: pnpm --filter urai-functions build
      - name: Test functions
        run: pnpm --filter urai-functions test

  firebase-config:
    name: Firebase config smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate Firebase JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firebase/firestore.indexes.json', 'utf8'))"
      - name: Verify Firebase rules and runtime
        run: |
          test -f firebase/firestore.rules
          grep -q "nodejs22" firebase.json
          grep -q "urai-spatial-functions" firebase.json
          grep -q "isAdmin" firebase/firestore.rules
          grep -Fq "match /spatial/{doc=**}" firebase/firestore.rules
      - name: Firebase Tier-1 boundary lock
        run: pnpm firebase:rules:check

  verification-lock:
    name: Verification lock preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Preflight
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci-diagnostics
          pnpm preflight 2>&1 | tee artifacts/ci-diagnostics/verification-preflight.log
      - name: Keep PR locked until signoffs complete
        run: |
          grep -q "locked_until_verified" verification/launch-lock.json
          grep -q "Status: PENDING" verification/signoffs.md
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-verification-preflight-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: artifacts/ci-diagnostics/verification-preflight.log
          if-no-files-found: error
