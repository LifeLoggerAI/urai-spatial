name: Firebase XR Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/xr/**"
      - "urai-tier1/src/app/spatial/ar-vr/**"
      - "urai-tier1/tests/xr-runtime-contract.test.mjs"
      - "urai-tier1/scripts/xr/**"
      - "scripts/check-home-xr-*.mjs"
      - "scripts/xr-firebase-preflight.mjs"
      - ".github/workflows/firebase-xr-deploy.yml"

permissions:
  contents: read

concurrency:
  group: firebase-xr-verification-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify XR runtime without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      URAI_XR_REQUIRE_SIGNED_ROOM_TOKEN: "true"

    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify XR release boundary
        run: |
          pnpm verify:routes
          pnpm verify:assets
          pnpm check:production-claims
          pnpm check:firebase
          pnpm check:system-registry
          node scripts/check-home-xr-lock.mjs
          node scripts/check-home-xr-proof-manifest.mjs
          pnpm xr:navmesh:bake
          pnpm xr:verify
          pnpm typecheck
          pnpm build

      - name: State release boundary
        run: |
          echo "This workflow performs verification only."
          echo "Physical-device certification remains separate."
          echo "The sole deployment authority is .github/workflows/urai-spatial-deploy.yml."
