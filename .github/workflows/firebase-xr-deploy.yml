name: Firebase XR Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Firebase deploy target
        required: true
        default: hosting
        type: choice
        options:
          - hosting
          - hosting,functions
      live_url:
        description: Live URL to smoke after deploy
        required: true
        default: https://urai-4dc1d.web.app
        type: string

concurrency:
  group: firebase-xr-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify XR runtime and deploy to Firebase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      URAI_XR_SESSION_SECRET: ${{ secrets.URAI_XR_SESSION_SECRET }}
      URAI_XR_ICE_SERVERS_JSON: ${{ secrets.URAI_XR_ICE_SERVERS_JSON }}
      URAI_XR_REQUIRE_SIGNED_ROOM_TOKEN: "true"
      URAI_DEPLOY_URL: ${{ inputs.live_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Static release gates
        run: |
          pnpm verify:routes
          pnpm verify:assets
          pnpm check:production-claims
          pnpm check:firebase
          pnpm check:system-registry
          node scripts/check-home-xr-lock.mjs
          node scripts/check-home-xr-proof-manifest.mjs

      - name: Bake XR navmesh
        run: pnpm xr:navmesh:bake

      - name: Verify XR contract and Firebase readiness
        run: pnpm xr:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Build hosting source
        run: pnpm build

      - name: Deploy Firebase hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_URAI_SPATIAL }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Deploy Firebase functions when requested
        if: ${{ contains(inputs.deploy_target, 'functions') }}
        run: pnpm exec firebase deploy --only functions --project "$FIREBASE_PROJECT_ID"

      - name: Live smoke and proof checks
        run: |
          echo "Smoking $URAI_DEPLOY_URL"
          pnpm smoke:home-xr:live
          pnpm smoke:live
          node scripts/check-home-xr-live-deploy-proof.mjs
