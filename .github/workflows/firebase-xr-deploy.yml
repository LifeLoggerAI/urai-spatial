name: Firebase XR Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: Firebase deploy target
        required: true
        default: hosting
        type: choice
        options:
          - hosting
          - hosting,functions
  push:
    branches:
      - main
    paths:
      - firebase.json
      - package.json
      - pnpm-lock.yaml
      - urai-tier1/**
      - apps/functions/**
      - scripts/xr-firebase-preflight.mjs
      - .github/workflows/firebase-xr-deploy.yml

concurrency:
  group: firebase-xr-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify XR runtime and deploy to Firebase
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      URAI_XR_SESSION_SECRET: ${{ secrets.URAI_XR_SESSION_SECRET }}
      URAI_XR_ICE_SERVERS_JSON: ${{ secrets.URAI_XR_ICE_SERVERS_JSON }}
      URAI_XR_REQUIRE_SIGNED_ROOM_TOKEN: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bake XR navmesh
        run: pnpm xr:navmesh:bake

      - name: Verify XR contract and Firebase readiness
        run: pnpm xr:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Build hosting source
        run: pnpm build

      - name: Deploy Firebase hosting
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_URAI_SPATIAL }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Deploy Firebase functions when requested
        if: ${{ github.event_name == 'workflow_dispatch' && contains(inputs.deploy_target, 'functions') }}
        run: pnpm exec firebase deploy --only functions --project "$FIREBASE_PROJECT_ID"
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_URAI_SPATIAL }}
