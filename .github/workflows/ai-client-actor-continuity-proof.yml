name: AI Client Actor Continuity Proof

on:
  pull_request:
    paths:
      - '.github/workflows/ai-client-actor-continuity-proof.yml'
      - 'urai-tier1/src/lib/privacy/aiActorBoundary.ts'
      - 'urai-tier1/src/lib/firebase/client.ts'
      - 'urai-tier1/src/lib/clientApiUrl.ts'
      - 'urai-tier1/src/lib/i18n/**'
      - 'packages/localization/src/contentLanguage.ts'
      - 'urai-tier1/src/spatial/council/**'
      - 'urai-tier1/src/spatial/orb/**'
      - 'urai-tier1/src/spatial/narrator/**'
      - 'urai-tier1/tests/ai-client-actor-continuity.test.mjs'
      - 'urai-tier1/tests/council-conversation-lifecycle.test.mjs'
      - 'urai-tier1/tests/council-provider-registry-contract.test.mjs'
      - 'urai-tier1/package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact source commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-client-actor-continuity-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || inputs.verification_sha || github.sha }}
  cancel-in-progress: false

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha || github.sha }}

jobs:
  actor-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Require exact clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck actual clients and consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-actor-proof"
          pnpm --dir urai-tier1 exec tsc --noEmit --incremental false 2>&1 | tee "$RUNNER_TEMP/ai-actor-proof/project-types.log"
          pnpm --dir urai-tier1 exec node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createRequire } from 'node:module'
          const root = process.cwd(), require = createRequire(path.join(root, 'package.json'))
          const files = ['src/lib/privacy/aiActorBoundary.ts', 'src/spatial/council/councilClient.ts', 'src/spatial/orb/openaiClient.ts', 'src/spatial/council/CouncilConversationPanel.tsx', 'src/spatial/orb/OrbConversationPanel.tsx'].map(file => path.join(root, file))
          files.push(require.resolve('next/types/global.d.ts'))
          const config = { compilerOptions: { target: 'ES2017', lib: ['dom', 'dom.iterable', 'esnext'], module: 'esnext', moduleResolution: 'bundler', jsx: 'preserve', strict: true, skipLibCheck: true, noEmit: true, incremental: false, esModuleInterop: true, resolveJsonModule: true, types: ['node', 'react'], typeRoots: [...new Set(['@types/node', '@types/react'].map(name => path.dirname(path.dirname(require.resolve(name + '/package.json')))))], paths: { '@/*': [path.join(root, 'src/*')] } }, files }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'ai-actor-proof', 'strict-types.json'), JSON.stringify(config, null, 2))
          NODE
          pnpm --dir urai-tier1 exec tsc -p "$RUNNER_TEMP/ai-actor-proof/strict-types.json" 2>&1 | tee "$RUNNER_TEMP/ai-actor-proof/strict-types.log"
      - name: Exercise actual source with fenced identity and HTTP boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir urai-tier1 exec node --test tests/ai-client-actor-continuity.test.mjs 2>&1 | tee "$RUNNER_TEMP/ai-actor-proof/actor-tests.tap"
          pnpm --dir urai-tier1 exec node --test tests/council-conversation-lifecycle.test.mjs 2>&1 | tee "$RUNNER_TEMP/ai-actor-proof/council-lifecycle-tests.tap"
          pnpm --dir urai-tier1 exec node --import tsx --test tests/council-provider-registry-contract.test.mjs 2>&1 | tee "$RUNNER_TEMP/ai-actor-proof/registry-tests.tap"
      - name: Bind retained proof to unchanged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createHash } from 'node:crypto'
          const output = path.join(process.env.RUNNER_TEMP, 'ai-actor-proof')
          const readCounts = (name, minimum) => {
            const log = fs.readFileSync(path.join(output, name), 'utf8')
            const counts = Object.fromEntries([...log.matchAll(/^(?:#|ℹ) (tests|pass|fail|cancelled|skipped|todo) (\d+)\s*$/gm)].map(match => [match[1], Number(match[2])]))
            if (!(counts.tests >= minimum) || counts.pass !== counts.tests || ['fail', 'cancelled', 'skipped', 'todo'].some(key => counts[key] !== 0)) throw new Error('Missing or incomplete ' + name)
            return counts
          }
          const files = ['urai-tier1/src/lib/privacy/aiActorBoundary.ts', 'urai-tier1/src/spatial/council/councilClient.ts', 'urai-tier1/src/spatial/orb/openaiClient.ts', 'urai-tier1/src/spatial/council/CouncilConversationPanel.tsx', 'urai-tier1/src/spatial/orb/OrbConversationPanel.tsx', 'urai-tier1/src/spatial/council/councilProviderRegistry.ts', 'urai-tier1/src/spatial/scenario/ScenarioCouncilPanel.tsx', 'urai-tier1/src/lib/firebase/client.ts', 'urai-tier1/src/lib/clientApiUrl.ts', 'urai-tier1/src/lib/orb-companion-contract.ts', 'urai-tier1/src/lib/i18n/localePreference.ts', 'packages/localization/src/contentLanguage.ts', 'urai-tier1/tests/ai-client-actor-continuity.test.mjs', 'urai-tier1/tests/council-conversation-lifecycle.test.mjs', 'urai-tier1/tests/council-provider-registry-contract.test.mjs', 'urai-tier1/package.json', 'urai-tier1/tsconfig.json', 'pnpm-lock.yaml', '.github/workflows/ai-client-actor-continuity-proof.yml']
          const sources = Object.fromEntries(files.map(file => [file, createHash('sha256').update(fs.readFileSync(file)).digest('hex')]))
          const receipt = { schema: 'urai-ai-client-actor-continuity-proof-1', sourceHead: process.env.URAI_EXACT_HEAD, workflowRun: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version, actorTests: readCounts('actor-tests.tap', 45), councilLifecycleTests: readCounts('council-lifecycle-tests.tap', 10), registryTests: readCounts('registry-tests.tap', 8), sources, transport: 'synthetic SDK identity events and HTTP terminals; actual existing client/panel source', mountedBrowserAcceptance: false, deployedProviderAcceptance: false, remoteCancellationProof: false, wholePrivacyCertification: false, releaseCertification: false }
          fs.writeFileSync(path.join(output, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\n')
          NODE
      - name: Retain complete scoped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ai-client-actor-continuity-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ai-actor-proof
          if-no-files-found: error
          retention-days: 90
