name: AAA World Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare diagnostic evidence directory
        run: mkdir -p release-control-evidence
      - name: Runtime dependency bootstrap
        run: node urai-tier1/scripts/require-test-bootstrap.mjs
      - name: AAA artifact contract
        run: |
          set -o pipefail
          cd urai-tier1
          node --import tsx --test tests/aaa-world-artifact-contract.test.mjs 2>&1 | tee ../release-control-evidence/aaa-artifact-contract.log
      - name: Unit contracts
        if: always()
        run: |
          set -o pipefail
          pnpm --dir urai-tier1 test:unit 2>&1 | tee release-control-evidence/aaa-unit-contracts.log
      - name: Production build
        if: always()
        run: |
          set -o pipefail
          pnpm --dir urai-tier1 build 2>&1 | tee release-control-evidence/aaa-build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aaa-world-diagnostics-${{ github.sha }}
          path: release-control-evidence/
          if-no-files-found: error
          retention-days: 30
