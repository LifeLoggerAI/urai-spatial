name: URAI Life Map render-loop repair

on:
  push:
    branches:
      - reconcile/lifemap-current-main-20260817
    paths:
      - .github/workflows/urai-lifemap-render-loop-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: reconcile/lifemap-current-main-20260817
          fetch-depth: 0

      - name: Apply bounded render-loop correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scene_path = Path('urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx')
          test_path = Path('urai-tier1/tests/lifemap-cinematic-contract.test.mjs')
          scene = scene_path.read_text()
          test = test_path.read_text()

          old_loop = 'frameloop={profile.documentVisible ? (profile.reducedMotion || softwareRenderer ? "demand" : "always") : "never"}'
          new_loop = 'frameloop={profile.documentVisible ? "always" : "never"}'
          if old_loop not in scene:
              raise SystemExit('Expected adaptive demand frameloop not found')
          scene = scene.replace(old_loop, new_loop, 1)

          old_assert = 'assert.match(scene, /frameloop=\\{profile\\.documentVisible \\? \\(profile\\.reducedMotion \\|\\| softwareRenderer \\? "demand" : "always"\\) : "never"\\}/)'
          new_assert = 'assert.match(scene, /frameloop=\\{profile\\.documentVisible \\? "always" : "never"\\}/)'
          if old_assert not in test:
              raise SystemExit('Expected adaptive frameloop contract assertion not found')
          test = test.replace(old_assert, new_assert, 1)

          scene_path.write_text(scene)
          test_path.write_text(test)
          PY
          git diff --check

      - name: Commit correction and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "URAI release repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/urai-lifemap-render-loop-repair.yml
          git add urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx urai-tier1/tests/lifemap-cinematic-contract.test.mjs
          git diff --cached --check
          git commit -m "fix: keep Life Map render loop proof-ready"
          git push origin HEAD:reconcile/lifemap-current-main-20260817
