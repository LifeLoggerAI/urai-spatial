name: V26 Final Home Repair

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - .github/workflows/v26-final-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-final-v24-certify-20260826
          fetch-depth: 0
      - name: Apply V26 repair
        run: python3 scripts/apply-v26-final-repair.py
      - name: Commit exact successor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/tests/embodied-exploration-contract.test.mjs scripts/capture-continuous-spatial-proof-v18.mjs urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Finish V26 Home relic-machine and deterministic proofs'
          git push origin HEAD:home-final-v24-certify-20260826
