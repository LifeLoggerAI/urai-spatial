name: Canonical Consent Admission Proof

on:
  pull_request:
    paths:
      - 'apps/functions/src/**'
      - 'apps/functions/test/canonical-consent-admission.test.js'
      - 'apps/functions/test/protectedProviderSpend.test.mjs'
      - 'apps/functions/test/privacy-policy-fallback.test.js'
      - 'apps/functions/test/privacy-consent-worker-lifecycle.test.js'
      - 'apps/functions/test/privacy-export-download.test.js'
      - 'apps/functions/test/lifeModelPrivateInputs.test.js'
      - 'packages/tier-locks/src/**'
      - 'packages/localization/src/contentLanguage.ts'
      - 'apps/functions/package.json'
      - 'apps/functions/tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/canonical-consent-admission-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-consent-admission-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXACT_SHA }}
          persist-credentials: false
      - name: Require exact clean source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/canonical-consent-admission"
          git rev-parse HEAD > "$RUNNER_TEMP/canonical-consent-admission/head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/canonical-consent-admission/tree.txt"
          sha256sum apps/functions/src/consentPolicyAuthority.ts apps/functions/src/privacyOperations.ts apps/functions/src/memoryMedia.ts apps/functions/src/councilProviderFunctions.ts apps/functions/test/privacy-policy-fallback.test.js apps/functions/test/privacy-consent-worker-lifecycle.test.js apps/functions/test/privacy-export-download.test.js apps/functions/test/lifeModelPrivateInputs.test.js apps/functions/test/canonical-consent-admission.test.js apps/functions/test/protectedProviderSpend.test.mjs .github/workflows/canonical-consent-admission-proof.yml docs/CANONICAL_CONSENT_ADMISSION_20261008.md > "$RUNNER_TEMP/canonical-consent-admission/source-sha256.txt"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Strict actual Functions compile
        run: |
          set -euo pipefail
          pnpm --filter urai-functions build 2>&1 | tee "$RUNNER_TEMP/canonical-consent-admission/build.log"
      - name: Run actual compiled admission and retained rights regression cases
        run: |
          set -euo pipefail
          pnpm --dir apps/functions exec node --test test/privacy-policy-fallback.test.js test/privacy-consent-worker-lifecycle.test.js test/lifeModelPrivateInputs.test.js test/privacy-export-download.test.js test/canonical-consent-admission.test.js 2>&1 | tee "$RUNNER_TEMP/canonical-consent-admission/tests.tap"
          pnpm --dir apps/functions exec node --test test/protectedProviderSpend.test.mjs 2>&1 | tee "$RUNNER_TEMP/canonical-consent-admission/protected-spend-tests.tap"
          sha256sum -c "$RUNNER_TEMP/canonical-consent-admission/source-sha256.txt"
      - name: Preserve proof scope and tool versions
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/canonical-consent-admission"
          node --version > "$RUNNER_TEMP/canonical-consent-admission/node-version.txt"
          pnpm --version > "$RUNNER_TEMP/canonical-consent-admission/pnpm-version.txt"
          printf '%s\n' 'Actual server modules and controlled SDK/DAO/provider terminals only. No real authentication, Storage, provider, account, deletion, model, deployed runtime, independent approval or release acceptance is claimed.' > "$RUNNER_TEMP/canonical-consent-admission/acceptance-limits.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: canonical-consent-admission-${{ env.EXACT_SHA }}
          path: ${{ runner.temp }}/canonical-consent-admission
          if-no-files-found: error
