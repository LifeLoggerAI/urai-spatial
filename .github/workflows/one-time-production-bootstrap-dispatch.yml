name: One-time production release dispatch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-production-bootstrap-dispatch.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-production-bootstrap-dispatch.yml'

permissions:
  contents: read

concurrency:
  group: one-time-production-release-dispatch
  cancel-in-progress: false

env:
  TARGET_WORKFLOW: spatial-live-deploy.yml
  ROLLBACK_SHA: 3a7aaf7bf47bd4ccf713584390201fd13317065e
  CONFIRMATION: DEPLOY_URAI_APP
  RETRY_REASON: final-spatial-convergence-20260717-live-dispatch-c

jobs:
  verify-dispatch-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact dispatcher candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean dispatcher candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Prove dispatcher is not a production mutation authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-production-workflow-authority.mjs
          node scripts/verify-production-action-pins.mjs
          node - <<'NODE'
          const { readFileSync } = require('node:fs')
          const source = readFileSync('.github/workflows/one-time-production-bootstrap-dispatch.yml', 'utf8')
          const forbidden = [
            ['live-release.mjs', ' --deploy-prebuilt'].join(''),
            ['firebase', ' deploy'].join(''),
            ['firebase-tools', ' deploy'].join(''),
            ['firebase-hosting-recovery.mjs', ' restore'].join(''),
            ['pnpm live:', 'deploy'].join(''),
            ['FIREBASE_', 'SERVICE_ACCOUNT_JSON'].join(''),
          ]
          for (const marker of forbidden) {
            if (source.includes(marker)) throw new Error(`Dispatcher contains forbidden mutation marker: ${marker}`)
          }
          NODE
      - name: Verify immutable production request
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'TARGET_WORKFLOW: spatial-live-deploy.yml' .github/workflows/one-time-production-bootstrap-dispatch.yml
          grep -Fq 'ROLLBACK_SHA: 3a7aaf7bf47bd4ccf713584390201fd13317065e' .github/workflows/one-time-production-bootstrap-dispatch.yml
          grep -Fq 'CONFIRMATION: DEPLOY_URAI_APP' .github/workflows/one-time-production-bootstrap-dispatch.yml
          grep -Fq 'RETRY_REASON: final-spatial-convergence-20260717-live-dispatch-c' .github/workflows/one-time-production-bootstrap-dispatch.yml
          grep -Fq 'actions: write' .github/workflows/one-time-production-bootstrap-dispatch.yml
          test -z "$(git status --porcelain --untracked-files=all)"

  dispatch-protected-production-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact merged dispatcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Prove exact main identity and one-file merge
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$GITHUB_SHA"
          test "$ROLLBACK_SHA" != "$GITHUB_SHA"
          if git rev-parse "$GITHUB_SHA^2" >/dev/null 2>&1; then
            changed="$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA")"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          fi
          test "$changed" = '.github/workflows/one-time-production-bootstrap-dispatch.yml'
      - name: Request protected production release
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/production-release-dispatch"
          mkdir -p "$receipt_dir"
          payload="$receipt_dir/request.json"
          response="$receipt_dir/response.txt"
          RELEASE_SHA="$GITHUB_SHA" node - <<'NODE' > "$payload"
          process.stdout.write(`${JSON.stringify({
            ref: 'main',
            inputs: {
              release_sha: process.env.RELEASE_SHA,
              rollback_sha: process.env.ROLLBACK_SHA,
              confirm: process.env.CONFIRMATION,
            },
          })}\n`)
          NODE
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/dispatches" \
            --data-binary "@$payload")"
          test "$status" = '204'
          cat > "$receipt_dir/receipt.json" <<EOF
          {
            "schemaVersion": "urai-one-time-production-release-dispatch-1",
            "requestedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "$GITHUB_REPOSITORY",
            "dispatcherWorkflow": "$GITHUB_WORKFLOW",
            "dispatcherRunId": "$GITHUB_RUN_ID",
            "dispatcherSha": "$GITHUB_SHA",
            "targetWorkflow": "$TARGET_WORKFLOW",
            "releaseSha": "$GITHUB_SHA",
            "rollbackSha": "$ROLLBACK_SHA",
            "confirmation": "$CONFIRMATION",
            "retryReason": "$RETRY_REASON",
            "httpStatus": $status,
            "firebaseCredentialAvailableToDispatcher": false,
            "productionMutationAttemptedByDispatcher": false
          }
          EOF
          echo "receipt_dir=$receipt_dir" >> "$GITHUB_OUTPUT"
      - name: Upload dispatch receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-release-dispatch-${{ github.sha }}
          path: ${{ steps.dispatch.outputs.receipt_dir }}
          if-no-files-found: error
          retention-days: 365
