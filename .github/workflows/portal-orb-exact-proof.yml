name: Portal and Orb Exact Proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/capture-portal-orb-proof.mjs'
      - 'scripts/run-with-ci-webgl.mjs'
      - '.github/workflows/portal-orb-exact-proof.yml'
      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
      - 'urai-tier1/src/app/home/**'
      - 'urai-tier1/src/spatial/assets/**'
      - 'urai-tier1/public/assets/urai/generated/models/portal-ring-master-v1.glb'
      - 'urai-tier1/public/assets/urai/generated/models/urai-orb-avatar-v1.glb'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-orb-exact-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: '0'
      NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate authored Portal and Orb assets
        run: node scripts/verify-home-finalization-authored-assets.mjs
      - name: Build exact static candidate
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.URAI_EXACT_HEAD }}
          URAI_FIREBASE_STATIC_EXPORT: 'true'
        run: pnpm build:static
      - name: Install Chromium
        run: |
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
          node --check scripts/run-with-ci-webgl.mjs
      - name: Capture exact desktop, mobile, and reduced-motion proof
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > /tmp/urai-portal-orb-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/home/ >/dev/null && break; sleep 1; done
          URAI_PROOF_BASE=http://127.0.0.1:4173 URAI_PROOF_DIR=artifacts/portal-orb-proof \
            node scripts/run-with-ci-webgl.mjs scripts/capture-portal-orb-proof.mjs
      - name: Retain exact proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-orb-proof-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/portal-orb-proof
          if-no-files-found: error
          retention-days: 365
