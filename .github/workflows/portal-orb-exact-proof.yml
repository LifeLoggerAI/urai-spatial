name: Portal and Orb Exact Proof

on:
  push:
    paths:
      - '.github/workflows/portal-orb-exact-proof.yml'
      - '.github/workflows/launch-verification.yml'
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/capture-home-sky-interaction-proof.mjs'
      - 'scripts/run-with-ci-webgl.mjs'
      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
      - 'urai-tier1/src/app/currentHomeVisualAuthority.json'
      - 'urai-tier1/src/spatial/layout/HomeVisualAuthority.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV223.tsx'
      - 'urai-tier1/src/spatial/assets/HomeOrbReliquaryV286.tsx'
      - 'urai-tier1/src/spatial/assets/HomeOrbGroundedV288.tsx'
      - 'urai-tier1/src/spatial/assets/HomeAtmosphericSky.tsx'
  pull_request:
    branches: [main, home-final-v24-certify-20260826]
    paths:
      - '.github/workflows/portal-orb-exact-proof.yml'
      - '.github/workflows/launch-verification.yml'
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/capture-home-sky-interaction-proof.mjs'
      - 'scripts/run-with-ci-webgl.mjs'
      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'
      - 'urai-tier1/src/app/currentHomeVisualAuthority.json'
      - 'urai-tier1/src/spatial/layout/HomeVisualAuthority.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV223.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProduction.module.css'
      - 'urai-tier1/src/spatial/assets/**'
      - 'urai-tier1/public/assets/urai/replay/replay-memory-film-main.webp'
      - 'urai-tier1/public/assets/urai/replay/replay-memory-film-mobile.webp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-orb-exact-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: '0'
      NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify V289 reliquary polish plus V288 grounding and broad-sky authority
        run: |
          set -euo pipefail
          home='urai-tier1/src/spatial/layout/HomeWorldProductionV223.tsx'
          sky='urai-tier1/src/spatial/assets/HomeAtmosphericSky.tsx'
          asset='urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
          visual='urai-tier1/src/spatial/layout/HomeVisualAuthority.tsx'
          adapter='urai-tier1/src/spatial/assets/HomeOrbGroundedV288.tsx'
          reliquary='urai-tier1/src/spatial/assets/HomeOrbReliquaryV286.tsx'
          authority='urai-tier1/src/app/currentHomeVisualAuthority.json'
          state='urai-tier1/src/app/home/orbStateController.ts'
          grep -Fq 'v289-cinematic-lived-world-grounded-reliquary-aaa-convergence' "$authority"
          grep -Fq 'v289-grounded-biomorphic-reliquary-aaa-convergence' "$authority"
          grep -Fq 'cinematic-lived-world-threshold' "$authority"
          grep -Fq 'HomeOrbGroundedV288' "$visual"
          grep -Fq 'home-v288-grounded-biomorphic-memory-reliquary' "$adapter"
          grep -Fq 'v289-grounded-biomorphic-memory-reliquary-aaa-convergence' "$adapter"
          grep -Fq 'fallbackVisualOwner: false' "$adapter"
          grep -Fq 'material.colorWrite = false' "$adapter"
          grep -Fq 'interactionOwner: true' "$adapter"
          grep -Fq 'interactionOwner: false' "$adapter"
          grep -Fq 'v289-aaa-reliquary-convergence' "$reliquary"
          grep -Fq 'grounded-fractured-mineral-memory-reliquary-with-distributed-internal-light' "$reliquary"
          grep -Fq 'plateSpecsV286' "$reliquary"
          grep -Fq 'home-v286-layered-internal-memory-world' "$reliquary"
          grep -Fq 'raycast={() => null}' "$reliquary"
          grep -Fq 'URAI_ORB_VISUAL_CANON' "$state"
          grep -Fq 'RETIRED_VISUAL_TOKENS' "$state"
          if grep -Fq 'home-v253-literal-living-memory-heart' "$reliquary"; then
            echo 'Retired heart Orb authority returned to current reliquary source' >&2
            exit 1
          fi
          grep -Fq 'home-visible-user-avatar' "$home"
          grep -Fq 'home-gold-companion' "$home"
          grep -Fq 'RetireLegacyHomeHotspots' "$home"
          grep -Fq "data-home-ground-entry=\"physical-world-surface\"" "$home"
          grep -Fq "data-home-life-map-entry=\"visible-sky-broad-interaction\"" "$home"
          grep -Fq "data-home-portal-sequence=\"idle\"" "$home"
          grep -Fq 'home-sky-life-map-threshold' "$sky"
          grep -Fq "threshold: 'broad-visible-sky'" "$sky"
          grep -Fq 'localGroundPortal: false' "$sky"
          grep -Fq 'home-life-map-sky-threshold' "$asset"
          if grep -Fq 'home-life-map-physical-portal' "$asset"; then
            echo 'Localized Life Map ground portal returned to live Home authority' >&2
            exit 1
          fi
          if grep -Eq "nearby.?===.?['\"]life-map['\"]|HOME_LIFE_MAP" "$home" "$asset"; then
            echo 'Fixed/proximity Life Map ownership returned to live Home authority' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate authored Home assets
        run: node scripts/verify-home-finalization-authored-assets.mjs
      - name: Build exact static candidate
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.URAI_EXACT_HEAD }}
          URAI_FIREBASE_STATIC_EXPORT: 'true'
        run: pnpm build:static
      - name: Install Chromium
        run: |
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
          node --check scripts/run-with-ci-webgl.mjs
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/capture-home-sky-interaction-proof.mjs
      - name: Capture exact Home, Orb, broad-sky interaction and reduced-motion proof
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > /tmp/urai-portal-orb-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/home/ >/dev/null && break; sleep 1; done
          URAI_PROOF_BASE=http://127.0.0.1:4173 URAI_PROOF_DIR=artifacts/portal-orb-proof \
            node scripts/run-with-ci-webgl.mjs scripts/capture-natural-home-orb-proof.mjs
          URAI_PROOF_BASE=http://127.0.0.1:4173 URAI_PROOF_DIR=artifacts/portal-orb-proof \
            node scripts/run-with-ci-webgl.mjs scripts/capture-home-sky-interaction-proof.mjs
      - name: Retain exact proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-orb-proof-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/portal-orb-proof
          if-no-files-found: error
          retention-days: 90
