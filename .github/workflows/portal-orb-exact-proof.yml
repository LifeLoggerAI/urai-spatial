name: Portal and Orb Exact Proof

on:
  push:
    paths:
      - '.github/workflows/portal-orb-exact-proof.yml'
      - '.github/workflows/launch-verification.yml'
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/run-with-ci-webgl.mjs'
      - 'urai-tier1/src/spatial/layout/HomeVisualAuthority.tsx'
      - 'urai-tier1/src/spatial/assets/HomeOrbReliquaryV286.tsx'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/run-with-ci-webgl.mjs'
      - '.github/workflows/portal-orb-exact-proof.yml'
      - '.github/workflows/launch-verification.yml'
      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'
      - 'urai-tier1/src/spatial/layout/HomeVisualAuthority.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProduction.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProduction.module.css'
      - 'urai-tier1/src/spatial/assets/**'
      - 'urai-tier1/public/assets/urai/generated/models/urai-orb-avatar-v1.glb'
      - 'urai-tier1/public/assets/urai/replay/replay-memory-film-main.webp'
      - 'urai-tier1/public/assets/urai/replay/replay-memory-film-mobile.webp'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-orb-exact-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: '0'
      NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify V286 biomorphic Orb authority is bound to exact-head proof
        run: |
          set -euo pipefail
          authority='urai-tier1/src/spatial/assets/HomeOrbReliquaryV286.tsx'
          ownership='urai-tier1/src/spatial/layout/HomeVisualAuthority.tsx'
          grep -Fq 'home-v286-biomorphic-memory-reliquary' "$authority"
          grep -Fq 'reliquaryPlateGeometryV286' "$authority"
          grep -Fq 'reliquaryFilamentGeometriesV286' "$authority"
          grep -Fq 'reliquaryGroundTracesV286' "$authority"
          grep -Fq 'memoryFieldV286' "$authority"
          grep -Fq 'stateVisualsV286' "$authority"
          grep -Fq 'home-v286-layered-internal-memory-world' "$authority"
          grep -Fq 'home-v286-localized-memory-field' "$authority"
          grep -Fq 'interactionOwner: false' "$authority"
          grep -Fq "import { HomeOrbReliquaryV286 } from '../assets/HomeOrbReliquaryV286'" "$ownership"
          grep -Fq '<HomeOrbReliquaryV286 />' "$ownership"
          grep -Fq 'home-v253-authored-sanctuary-dressing' "$ownership"
          grep -Fq 'layered-lantern-grove-cairn-path' "$ownership"
          if grep -Eq 'livingHeart|living-memory-heart|SphereGeometry\(|<sphereGeometry|wireframe|DoubleSide' "$authority"; then
            echo 'V286 Orb regressed to retired heart/sphere/crystal-style authority' >&2
            exit 1
          fi
          if grep -Eq 'livingHeartGeometryV253|home-v253-literal-living-memory-heart|<GroundedOrbRootsV253|<LiteralOrbAuthorityV253' "$ownership"; then
            echo 'Retired V253 heart/root render authority remains mounted in current Home authority' >&2
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate authored Home and Orb assets
        run: node scripts/verify-home-finalization-authored-assets.mjs
      - name: Build exact static candidate
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.URAI_EXACT_HEAD }}
          URAI_FIREBASE_STATIC_EXPORT: 'true'
        run: pnpm build:static
      - name: Install Chromium
        run: |
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
          node --check scripts/run-with-ci-webgl.mjs
          node --check scripts/capture-natural-home-orb-proof.mjs
      - name: Capture exact desktop, mobile, reduced-motion, natural-threshold and Orb proof
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > /tmp/urai-portal-orb-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/home/ >/dev/null && break; sleep 1; done
          URAI_PROOF_BASE=http://127.0.0.1:4173 URAI_PROOF_DIR=artifacts/portal-orb-proof \
            node scripts/run-with-ci-webgl.mjs scripts/capture-natural-home-orb-proof.mjs
      - name: Retain exact proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-orb-proof-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/portal-orb-proof
          if-no-files-found: error
          retention-days: 90
