name: Founder Launcher Placement Proof

on:
  pull_request:
    branches: [repair/release-closure-integration-20261007]
    paths:
      - '.github/workflows/adam-placement-proof.yml'
      - 'urai-tier1/src/app/settings/DeviceSettingsClient.tsx'
      - 'urai-tier1/src/app/passport/PassportVaultClient.tsx'
      - 'urai-tier1/src/app/passport/passport-vault.css'
      - 'urai-tier1/src/spatial/adam/**'
      - 'urai-tier1/src/app/privacy-policy/page.tsx'
      - 'urai-tier1/src/app/privacy/page.tsx'
      - 'urai-tier1/src/app/terms/page.tsx'
      - 'urai-tier1/src/app/account-deletion/page.tsx'
      - 'urai-tier1/src/app/sms-opt-in/page.tsx'
      - 'urai-tier1/src/app/settings/communications/CommunicationSettingsClient.tsx'
      - 'urai-tier1/src/app/spatial/ar-vr/UraiQuestEntryWorldV2.tsx'
      - 'urai-tier1/src/spatial/council/CouncilRealm.tsx'
      - 'urai-tier1/src/app/spatial/captured-reality/CapturedRealityRouteClient.tsx'
      - 'urai-tier1/src/app/spatial/interpretive-world/InterpretiveWorldRouteClient.tsx'
      - 'urai-tier1/src/app/spatial/memory-world/MemoryWorldRouteClient.tsx'
      - 'urai-tier1/src/spatial/memory-world/MemoryWorldRuntime.tsx'
      - 'urai-tier1/src/app/life-movie/LifeMovieClient.tsx'
      - 'urai-tier1/tests/accessibility-performance-adam-placement.spec.ts'
      - 'urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx'
      - 'urai-tier1/src/pages/404.tsx'
      - 'urai-tier1/src/app/GroundSpatialWorldClean.tsx'
      - 'urai-tier1/src/app/ground/ground-production-polish.css'
      - 'urai-tier1/src/app/mirror/MirrorBareEntryGuard.tsx'
      - 'urai-tier1/src/app/possible-futures/PossibleFuturesClient.tsx'
      - 'urai-tier1/src/app/launch/page.tsx'
      - 'urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx'
      - 'urai-tier1/src/app/spatial/ar-vr/UraiQuestEntryWorld.module.css'
      - 'scripts/visual-proof-transport.mjs'
      - 'urai-tier1/tests/visual-proof-transport.test.mjs'
      - 'urai-tier1/tests/lifemap-signed-out-navigation-behavior.test.mjs'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: adam-placement-proof-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_PROOF_GROUP: adam-placement
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  URAI_PROOF_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_PUBLIC_URAI_ACCEPTANCE_FIXTURES: '1'
  PLAYWRIGHT_HTML_OUTPUT_DIR: artifacts/adam-placement/playwright-report
  PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/adam-placement/results.json

jobs:
  browser-placement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact donor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_PROOF_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_PROOF_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_PROOF_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify bounded transport and mounted Life Map navigation
        run: node --test urai-tier1/tests/visual-proof-transport.test.mjs urai-tier1/tests/lifemap-signed-out-navigation-behavior.test.mjs

      - name: Typecheck and build exact static donor
        run: |
          pnpm --dir urai-tier1 typecheck
          pnpm build:static

      - name: Install exact Chromium
        run: pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Prove actual hydrated text and fallback placement
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/adam-placement
          pnpm exec playwright test --config playwright.accessibility.config.ts \
            urai-tier1/tests/accessibility-performance-adam-placement.spec.ts \
            --reporter=line,html,json 2>&1 | tee artifacts/adam-placement/playwright.log

      - name: Bind receipts and reject recovered flakes
        if: ${{ always() && steps.browser.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('artifacts/adam-placement')
          source = os.environ['URAI_PROOF_SOURCE_SHA']
          checkout = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert checkout == source
          report = json.loads((root / 'results.json').read_text())
          tests = []
          def collect(suite):
              for spec in suite.get('specs', []):
                  tests.extend(spec.get('tests', []))
              for nested in suite.get('suites', []):
                  collect(nested)
          for suite in report.get('suites', []):
              collect(suite)
          images = [{'path': str(p.relative_to(root)), 'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'bytes': p.stat().st_size} for p in sorted(root.rglob('*.png'))]
          receipt = {'schemaVersion': 'urai-adam-placement-proof-v1', 'repository': os.environ['GITHUB_REPOSITORY'], 'exactHead': source, 'checkoutMatchesExactHead': True, 'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'], 'scope': 'focused-donor-founder-launcher-placement-only', 'productionVerified': False, 'deviceVerified': False, 'releaseAccepted': False, 'expectedTests': 75, 'recordedTests': len(tests), 'testResults': [{'status': t.get('status'), 'attempts': [{'status': r.get('status'), 'retry': r.get('retry')} for r in t.get('results', [])]} for t in tests], 'images': images}
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          assert len(tests) == 75, 'Missing or extra test coverage'
          assert images, 'Literal screenshot receipts are required'
          assert all(t.get('status') == 'expected' for t in tests), 'Browser assertion failed'
          if any(r.get('retry', 0) > 0 for t in tests for r in t.get('results', [])):
              raise SystemExit(86)
          assert all(r.get('status') == 'passed' for t in tests for r in t.get('results', [])), 'Not every test passed'
          PY

      - name: Upload exact-head focused native proof
        id: original-visual-proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-proof-${{ env.URAI_PROOF_SOURCE_SHA }}
          path: artifacts/adam-placement
          if-no-files-found: error
          retention-days: 90

      - name: Partition the original native visual archive
        id: bounded-visual-transport
        if: ${{ always() && steps.original-visual-proof.outputs.artifact-id != '' }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          URAI_ORIGINAL_ARTIFACT_ID: ${{ steps.original-visual-proof.outputs.artifact-id }}
          URAI_ORIGINAL_ARTIFACT_DIGEST: ${{ steps.original-visual-proof.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/visual-proof-transport.mjs prepare-native \
            --output "artifacts/adam-placement-transport"

      - name: Upload bounded visual transport manifest
        id: bounded-visual-manifest
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: artifacts/adam-placement-transport/manifest.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload bounded visual archive part 01
        id: bounded-visual-part-01
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' && steps.bounded-visual-transport.outputs.part_count >= 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-01
          path: artifacts/adam-placement-transport/adam-placement.zip.part-01
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload bounded visual archive part 02
        id: bounded-visual-part-02
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' && steps.bounded-visual-transport.outputs.part_count >= 2 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-02
          path: artifacts/adam-placement-transport/adam-placement.zip.part-02
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload bounded visual archive part 03
        id: bounded-visual-part-03
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' && steps.bounded-visual-transport.outputs.part_count >= 3 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-03
          path: artifacts/adam-placement-transport/adam-placement.zip.part-03
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload bounded visual archive part 04
        id: bounded-visual-part-04
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' && steps.bounded-visual-transport.outputs.part_count >= 4 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-04
          path: artifacts/adam-placement-transport/adam-placement.zip.part-04
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload bounded visual archive part 05
        id: bounded-visual-part-05
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' && steps.bounded-visual-transport.outputs.part_count >= 5 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-05
          path: artifacts/adam-placement-transport/adam-placement.zip.part-05
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload bounded visual archive part 06
        id: bounded-visual-part-06
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' && steps.bounded-visual-transport.outputs.part_count >= 6 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-06
          path: artifacts/adam-placement-transport/adam-placement.zip.part-06
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload bounded visual archive part 07
        id: bounded-visual-part-07
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' && steps.bounded-visual-transport.outputs.part_count >= 7 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-07
          path: artifacts/adam-placement-transport/adam-placement.zip.part-07
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload bounded visual archive part 08
        id: bounded-visual-part-08
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' && steps.bounded-visual-transport.outputs.part_count >= 8 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-08
          path: artifacts/adam-placement-transport/adam-placement.zip.part-08
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Verify separate native transport artifact identities and byte limits
        id: verified-visual-transport
        if: ${{ always() && steps.bounded-visual-transport.outcome == 'success' }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          URAI_ORIGINAL_ARTIFACT_ID: ${{ steps.original-visual-proof.outputs.artifact-id }}
          URAI_ORIGINAL_ARTIFACT_DIGEST: ${{ steps.original-visual-proof.outputs.artifact-digest }}
          URAI_MANIFEST_ID: ${{ steps.bounded-visual-manifest.outputs.artifact-id }}
          URAI_MANIFEST_DIGEST: ${{ steps.bounded-visual-manifest.outputs.artifact-digest }}
          URAI_PART_01_ID: ${{ steps.bounded-visual-part-01.outputs.artifact-id }}
          URAI_PART_01_DIGEST: ${{ steps.bounded-visual-part-01.outputs.artifact-digest }}
          URAI_PART_02_ID: ${{ steps.bounded-visual-part-02.outputs.artifact-id }}
          URAI_PART_02_DIGEST: ${{ steps.bounded-visual-part-02.outputs.artifact-digest }}
          URAI_PART_03_ID: ${{ steps.bounded-visual-part-03.outputs.artifact-id }}
          URAI_PART_03_DIGEST: ${{ steps.bounded-visual-part-03.outputs.artifact-digest }}
          URAI_PART_04_ID: ${{ steps.bounded-visual-part-04.outputs.artifact-id }}
          URAI_PART_04_DIGEST: ${{ steps.bounded-visual-part-04.outputs.artifact-digest }}
          URAI_PART_05_ID: ${{ steps.bounded-visual-part-05.outputs.artifact-id }}
          URAI_PART_05_DIGEST: ${{ steps.bounded-visual-part-05.outputs.artifact-digest }}
          URAI_PART_06_ID: ${{ steps.bounded-visual-part-06.outputs.artifact-id }}
          URAI_PART_06_DIGEST: ${{ steps.bounded-visual-part-06.outputs.artifact-digest }}
          URAI_PART_07_ID: ${{ steps.bounded-visual-part-07.outputs.artifact-id }}
          URAI_PART_07_DIGEST: ${{ steps.bounded-visual-part-07.outputs.artifact-digest }}
          URAI_PART_08_ID: ${{ steps.bounded-visual-part-08.outputs.artifact-id }}
          URAI_PART_08_DIGEST: ${{ steps.bounded-visual-part-08.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/visual-proof-transport.mjs verify-native-uploads \
            --manifest "artifacts/adam-placement-transport/manifest.json" \
            --output "artifacts/adam-placement-transport/upload-receipt.json"

      - name: Upload verified native visual transport receipt
        if: ${{ always() && steps.verified-visual-transport.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adam-placement-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-upload-receipt
          path: artifacts/adam-placement-transport/upload-receipt.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
