name: PR1177 Temporary Convergence Check

on:
  push:
    branches:
      - steward/pr1177-systemic-convergence-transfer-20260912
    paths:
      - 'urai-tier1/**'
      - '.github/workflows/pr1177-temp-convergence-check.yml'

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.0.0'
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Compact systemic contract matrix
        run: corepack pnpm --dir urai-tier1 run test:unit
      - name: Exact source cleanliness
        run: git diff --check
