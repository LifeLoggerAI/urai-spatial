name: One-time fix static SHA proof

on:
  push:
    branches:
      - release/fix-static-sha-proof-20260714
    paths:
      - '.github/workflows/one-time-fix-static-sha-proof.yml'

permissions:
  contents: write

concurrency:
  group: one-time-fix-static-sha-proof-20260714
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/fix-static-sha-proof-20260714
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Prove isolated repair base
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/fix-static-sha-proof-20260714'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = '40edee19e6354257682ac24f8f78b107dac8b90b'
          git merge-base --is-ancestor 40edee19e6354257682ac24f8f78b107dac8b90b HEAD
          changed="$(git diff --name-only 40edee19e6354257682ac24f8f78b107dac8b90b HEAD)"
          test "$changed" = '.github/workflows/one-time-fix-static-sha-proof.yml'
      - name: Replace SIGPIPE-prone checks and add regression contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/spatial-live-deploy.yml')
          workflow = workflow_path.read_text()
          replacements = {
              "grep -R --fixed-strings \"$PROOF_SHA\" urai-tier1/out --include='*.html' -l | grep -q .":
                  "grep -R --fixed-strings --include='*.html' -q \"$PROOF_SHA\" urai-tier1/out",
              "grep -R --fixed-strings \"$RELEASE_SHA\" target/urai-tier1/out --include='*.html' -l | grep -q .":
                  "grep -R --fixed-strings --include='*.html' -q \"$RELEASE_SHA\" target/urai-tier1/out",
          }
          for old, new in replacements.items():
              count = workflow.count(old)
              if count != 1:
                  raise SystemExit(f'expected one workflow marker, found {count}: {old}')
              workflow = workflow.replace(old, new)
          workflow_path.write_text(workflow)

          test_path = Path('urai-tier1/tests/exact-static-release-contract.test.mjs')
          source = test_path.read_text()
          marker = "test('manual deploy and rollback preserve distinct target and recovery identities', () => {"
          if source.count(marker) != 1:
              raise SystemExit('manual release test insertion marker drifted')
          regression = r'''test('static SHA proofs avoid pipefail SIGPIPE false negatives', () => {
            hasAll(workflow, [
              'grep -R --fixed-strings --include=\'*.html\' -q "$PROOF_SHA" urai-tier1/out',
              'grep -R --fixed-strings --include=\'*.html\' -q "$RELEASE_SHA" target/urai-tier1/out',
            ], 'direct static SHA proof')
            assert.doesNotMatch(workflow, /--include='\*\.html' -l \| grep -q \./)
          })

          '''
          if "static SHA proofs avoid pipefail SIGPIPE false negatives" in source:
              raise SystemExit('regression contract already exists')
          source = source.replace(marker, regression + marker)
          test_path.write_text(source)
          PY
          git rm .github/workflows/one-time-fix-static-sha-proof.yml
          git diff --check
      - name: Run focused release contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/exact-static-release-contract.test.mjs
          node scripts/audit-production-workflow-authority.mjs
          node scripts/verify-production-action-pins.mjs
          node scripts/verify-release-security-path-guard.mjs
          git diff --check
      - name: Commit exact permanent repair
        shell: bash
        run: |
          set -euo pipefail
          changed="$({ git diff --name-only; git diff --cached --name-only; } | sort -u)"
          expected="$(printf '%s\n' '.github/workflows/one-time-fix-static-sha-proof.yml' '.github/workflows/spatial-live-deploy.yml' 'urai-tier1/tests/exact-static-release-contract.test.mjs' | sort)"
          test "$changed" = "$expected"
          git config user.name 'LifeLoggerAI'
          git config user.email '215797546+LifeLoggerAI@users.noreply.github.com'
          git add -A
          git commit -m 'Fix static SHA proof pipefail false negative'
          git push origin HEAD:release/fix-static-sha-proof-20260714
