name: One-shot Home mobile overlap repair

on:
  pull_request:
    branches:
      - feat/home-ground-lifemap-art-bible-convergence-20260718
    paths:
      - .github/workflows/one-shot-home-mobile-overlap-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/home-mobile-prompt-overlap-9d1bc177-20260718
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded Home mobile overlap repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8')
            const matches = source.split(before).length - 1
            if (matches !== 1) throw new Error(`${path}: expected one match, found ${matches}`)
            fs.writeFileSync(path, source.replace(before, after))
          }

          const home = 'urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx'
          replaceOnce(
            home,
            '@media(max-width:700px){.urai-home-embodied-art{background-image:linear-gradient(180deg,rgba(1,6,14,.04),rgba(1,7,14,.16) 50%,rgba(1,5,11,.74)),radial-gradient(circle at 50% 38%,rgba(126,239,245,.08),transparent 32%),var(--home-authored-mobile);background-position:calc(50% + var(--home-walk-x,0) * -.32%) calc(44% + var(--home-walk-z,0) * .14%)}.urai-home-movement-prompt{bottom:max(142px,calc(env(safe-area-inset-bottom) + 132px));min-width:min(310px,calc(100vw - 24px))}',
            '@media(max-width:700px){.urai-home-embodied-art{background-image:linear-gradient(180deg,rgba(1,6,14,.04),rgba(1,7,14,.16) 50%,rgba(1,5,11,.74)),radial-gradient(circle at 50% 38%,rgba(126,239,245,.08),transparent 32%),var(--home-authored-mobile);background-position:calc(50% + var(--home-walk-x,0) * -.32%) calc(44% + var(--home-walk-z,0) * .14%)}.urai-home-movement-prompt{bottom:max(202px,calc(env(safe-area-inset-bottom) + 192px));min-width:min(310px,calc(100vw - 24px))}'
          )

          const proof = 'scripts/capture-continuous-spatial-proof.mjs'
          replaceOnce(
            proof,
            "      const firstHomeFrameMarked = await page.evaluate(() => performance.getEntriesByName('urai:first-home-spatial-frame').length > 0)\n      const canvas = await canvasEvidence(page, '[data-home-spatial-renderer=\"webgl\"] canvas')",
            "      const firstHomeFrameMarked = await page.evaluate(() => performance.getEntriesByName('urai:first-home-spatial-frame').length > 0)\n      const mobileControlsDoNotOverlapPrompt = await page.evaluate(() => {\n        if (window.innerWidth > 700) return true\n        const prompt = document.querySelector('.urai-home-movement-prompt')\n        const pad = document.querySelector('.urai-mobile-movement')\n        if (!prompt || !pad) return false\n        const promptRect = prompt.getBoundingClientRect()\n        const padRect = pad.getBoundingClientRect()\n        return promptRect.bottom <= padRect.top - 12\n      })\n      const canvas = await canvasEvidence(page, '[data-home-spatial-renderer=\"webgl\"] canvas')"
          )
          replaceOnce(
            proof,
            '        firstHomeFrameMarked,\n        authoredSceneMounted,',
            '        firstHomeFrameMarked,\n        mobileControlsDoNotOverlapPrompt,\n        authoredSceneMounted,'
          )
          NODE

      - name: Prove focused source contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const home = fs.readFileSync('urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx', 'utf8')
          const proof = fs.readFileSync('scripts/capture-continuous-spatial-proof.mjs', 'utf8')
          if (!home.includes('bottom:max(202px,calc(env(safe-area-inset-bottom) + 192px))')) throw new Error('missing raised Home mobile prompt')
          if (!proof.includes('mobileControlsDoNotOverlapPrompt')) throw new Error('missing no-overlap proof')
          if (!proof.includes('promptRect.bottom <= padRect.top - 12')) throw new Error('missing overlap geometry assertion')
          NODE
          git diff --check
          rm .github/workflows/one-shot-home-mobile-overlap-repair.yml
          test ! -e .github/workflows/one-shot-home-mobile-overlap-repair.yml

      - name: Commit clean repaired product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spatial): separate Home mobile prompt from movement pad'
          git push origin HEAD:fix/home-mobile-prompt-overlap-9d1bc177-20260718
