name: V1 Asset Verification and Proof

on:
  workflow_dispatch:
  repository_dispatch:
    types: [urai-v1-assets-ready]
  pull_request:
    branches: [main]
    paths:
      - urai-tier1/public/assets/urai/**
      - .github/workflows/v1-asset-promote.yml
      - scripts/verify-asset-factory-handoff.mjs
      - scripts/audit-v123-asset-wall.mjs

concurrency:
  group: urai-v1-asset-proof-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-proof:
    name: Verify V1 assets without production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROOF_URL: http://127.0.0.1:4173
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install visual audit dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate sole deployment authority
        run: node scripts/check-deployment-authority.mjs

      - name: Verify provider-scored Asset Factory handoff
        run: node scripts/verify-asset-factory-handoff.mjs

      - name: Audit V1 asset wall
        run: node scripts/audit-v123-asset-wall.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build static proof source
        run: pnpm build:static

      - name: Serve static proof source
        run: |
          test -d urai-tier1/out
          test -f urai-tier1/out/index.html
          python3 -m http.server 4173 --directory urai-tier1/out > /tmp/urai-v1-proof-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS "$PROOF_URL" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/urai-v1-proof-server.log
          exit 1

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Capture V1 route proof
        run: |
          node scripts/aaa-launch-proof.mjs \
            --skip-install \
            --skip-typecheck \
            --skip-test \
            --skip-build \
            --screenshots \
            --base="$PROOF_URL" | tee v1-assets-launch-proof.log
          proof_dir="$(grep -E '^Receipt: ' v1-assets-launch-proof.log | tail -1 | sed 's/^Receipt: //')"
          test -d "$proof_dir/screenshots"
          echo "PROOF_DIR=$proof_dir" >> "$GITHUB_ENV"
          count="$(find "$proof_dir/screenshots" -maxdepth 1 -name '*.png' | wc -l | tr -d ' ')"
          test "$count" = "24"

      - name: Machine image and structural gates
        run: |
          LOOP_NAME="v1-provider-assets" EXPECTED_PNG_COUNT=24 PROOF_DIR="$PROOF_DIR" \
            python scripts/urai-machine-visual-verdict.py
          LOOP_NAME="v1-provider-assets" BASE_URL="$PROOF_URL" \
            node scripts/urai-v1-structural-audit.mjs
          LOOP_NAME="v1-provider-assets" BASE_URL="$PROOF_URL" \
            node scripts/urai-v1-realm-audit.mjs

      - name: Package proof
        run: |
          mkdir -p artifacts
          zip -r artifacts/v1-provider-assets-${GITHUB_SHA}.zip \
            "$PROOF_DIR/screenshots" \
            "$PROOF_DIR/screenshots.json" \
            "$PROOF_DIR/final-report.md" \
            "$PROOF_DIR/route-matrix.md" \
            "$PROOF_DIR/route-matrix.json" \
            "$PROOF_DIR/summary.json"
          cp docs/receipts/visual-verdicts/v1-provider-assets-machine-visual-verdict.* artifacts/ || true
          cp docs/receipts/visual-verdicts/v1-provider-assets-structural-audit.* artifacts/ || true
          cp docs/receipts/visual-verdicts/v1-provider-assets-realm-audit.* artifacts/ || true
          cp urai-tier1/public/assets/urai/final/manifests/asset-factory-spatial-handoff.json artifacts/

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1-provider-assets-proof-${{ github.sha }}
          retention-days: 90
          path: artifacts/**
          if-no-files-found: error

      - name: State promotion boundary
        run: |
          echo "This workflow verifies assets and produces proof only."
          echo "It does not deploy production or write evidence to main."
          echo "Promotion requires the sole exact-SHA deployment workflow."
