name: Deploy ElevenLabs Provider Once 2026-08-10

on:
  push:
    branches:
      - ops/elevenlabs-provider-deploy-20260810
    paths:
      - '.github/workflows/deploy-elevenlabs-provider-once-20260810.yml'

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: urai-elevenlabs-provider-deploy-20260810
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'
  EXPECTED_PROJECT: urai-4dc1d
  CANONICAL_SHA: a58628601b3cb257ed81d93b6089a1f482484630
  FUNCTION_ID: elevenLabsVoiceProvider
  FUNCTIONS_CODEBASE: urai-spatial-functions
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ vars.GCP_MAPS_ADMIN_SERVICE_ACCOUNT || vars.GCP_ASSET_FACTORY_ADMIN_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
  CREDENTIAL_ROTATION_GO: ${{ vars.URAI_CREDENTIAL_ROTATION_GO }}

jobs:
  deploy:
    name: WIF preflight, deploy, and smoke ElevenLabs provider
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Guard one-time trusted branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/urai-spatial'
          test "$GITHUB_REF" = 'refs/heads/ops/elevenlabs-provider-deploy-20260810'

      - name: Checkout exact canonical main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANONICAL_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove canonical identity is still current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$CANONICAL_SHA"
          node - <<'NODE'
          const fs = require('fs')
          const rc = JSON.parse(fs.readFileSync('.firebaserc', 'utf8'))
          if (rc.projects?.spatial !== 'urai-4dc1d' || rc.projects?.['urai-spatial'] !== 'urai-4dc1d') {
            throw new Error('Canonical Firebase project mapping drifted')
          }
          const config = JSON.parse(fs.readFileSync('firebase.json', 'utf8'))
          if (config.functions?.source !== 'apps/functions') throw new Error('Unexpected functions source')
          if (config.functions?.codebase !== 'urai-spatial-functions') throw new Error('Unexpected functions codebase')
          NODE

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and test provider boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter urai-functions build
          pnpm --filter urai-functions test
          node urai-tier1/tests/provider-boundary-contract.test.mjs
          node urai-tier1/tests/provider-hosting-runtime-contract.test.mjs
          grep -Fq "const ELEVENLABS_API_KEY = defineSecret('ELEVENLABS_API_KEY')" apps/functions/src/providerFunctions.ts
          grep -Fq 'secrets: [ELEVENLABS_API_KEY]' apps/functions/src/providerFunctions.ts
          grep -Fq "export { elevenLabsVoiceProvider, openAiOrbProvider }" apps/functions/src/index.ts

      - name: Require short-lived Google identity
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo '::error::Production WIF is not configured. Refusing to use the legacy Firebase service-account JSON credential.'
            exit 65
          fi

      - name: Authenticate through Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.EXPECTED_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.EXPECTED_PROJECT }}
          version: '>= 500.0.0'

      - name: Verify WIF project and secret metadata access
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = "$EXPECTED_PROJECT"
          active_account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          test -n "$active_account"
          test "$active_account" = "$WIF_SERVICE_ACCOUNT"
          gcloud secrets describe OPENAI_API_KEY --project "$EXPECTED_PROJECT" --format='value(name)' >/dev/null
          gcloud secrets describe ELEVENLABS_API_KEY --project "$EXPECTED_PROJECT" --format='value(name)' >/dev/null
          echo 'WIF can read required Secret Manager metadata without exposing secret values.'

      - name: Enforce credential-rotation production gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CREDENTIAL_ROTATION_GO" != 'GO' ]; then
            echo '::error::URAI_CREDENTIAL_ROTATION_GO is not GO. Production deploy remains blocked until the potentially exposed Firebase key is revoked/rotated and the protected identity path is validated.'
            exit 78
          fi

      - name: Deploy only ElevenLabs voice provider
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec firebase deploy \
            --project "$EXPECTED_PROJECT" \
            --only "functions:${FUNCTIONS_CODEBASE}:${FUNCTION_ID}" \
            --non-interactive

      - name: Smoke deployed auth boundary
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          url="https://us-central1-${EXPECTED_PROJECT}.cloudfunctions.net/${FUNCTION_ID}"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/elevenlabs-smoke-body.json" --write-out '%{http_code}' \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{}' \
            --max-time 30 \
            "$url")"
          test "$status" = '401'
          node - "$RUNNER_TEMP/elevenlabs-smoke-body.json" <<'NODE'
          const fs = require('fs')
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (body?.error !== 'UNAUTHORIZED') throw new Error('Unexpected unauthenticated provider response')
          NODE
          printf 'url=%s\nstatus=%s\n' "$url" "$status" >> "$GITHUB_OUTPUT"

      - name: Write deployment receipt
        shell: bash
        env:
          FUNCTION_URL: ${{ steps.smoke.outputs.url }}
          SMOKE_STATUS: ${{ steps.smoke.outputs.status }}
        run: |
          set -euo pipefail
          mkdir -p provider-deployment-receipt
          node - <<'NODE'
          const fs = require('fs')
          const receipt = {
            schemaVersion: 'urai-provider-deployment-receipt-2',
            recordedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            canonicalSha: process.env.CANONICAL_SHA,
            workflowRunId: process.env.GITHUB_RUN_ID,
            projectId: process.env.EXPECTED_PROJECT,
            functionId: process.env.FUNCTION_ID,
            functionUrl: process.env.FUNCTION_URL,
            deploymentCredentialClass: 'workload-identity-federation',
            secretBinding: 'ELEVENLABS_API_KEY',
            secretValueRecorded: false,
            unauthenticatedSmokeExpected: 401,
            unauthenticatedSmokeObserved: Number(process.env.SMOKE_STATUS),
            result: 'deployed-and-auth-boundary-verified'
          }
          fs.writeFileSync('provider-deployment-receipt/elevenlabs-20260810.json', JSON.stringify(receipt, null, 2) + '\n')
          NODE

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-elevenlabs-provider-deploy-20260810
          path: provider-deployment-receipt/
          if-no-files-found: warn
          retention-days: 365

      - name: Report deployment outcome
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          JOB_STATUS: ${{ job.status }}
          FUNCTION_URL: ${{ steps.smoke.outputs.url }}
          SMOKE_STATUS: ${{ steps.smoke.outputs.status }}
        with:
          script: |
            const status = process.env.JOB_STATUS || 'unknown'
            const title = `ElevenLabs provider deploy ${process.env.CANONICAL_SHA.slice(0, 12)} — ${status}`
            const body = [
              '## ElevenLabs provider deployment receipt',
              '',
              `- Canonical SHA: \`${process.env.CANONICAL_SHA}\``,
              `- Firebase project: \`${process.env.EXPECTED_PROJECT}\``,
              `- Function: \`${process.env.FUNCTION_ID}\``,
              `- Credential path: Workload Identity Federation only`,
              `- Function URL: ${process.env.FUNCTION_URL || 'not reached'}`,
              `- Unauthenticated smoke HTTP: \`${process.env.SMOKE_STATUS || 'not reached'}\` (expected \`401\`)`,
              `- Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Job status at report step: \`${status}\``,
              '',
              'No provider secret value is recorded in this receipt, and the legacy Firebase service-account JSON credential is not used by this workflow.'
            ].join('\n')
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body })

      - name: Remove temporary diagnostics
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/elevenlabs-smoke-body.json"
