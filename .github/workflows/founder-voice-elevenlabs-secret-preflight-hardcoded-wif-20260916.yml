name: Founder Voice ElevenLabs Secret Preflight Hardcoded WIF 2026-09-16

on:
  push:
    branches:
      - ops/founder-voice-elevenlabs-preflight-20260916
    paths:
      - '.github/workflows/founder-voice-elevenlabs-secret-preflight-hardcoded-wif-20260916.yml'

permissions:
  contents: read
  id-token: write

env:
  EXPECTED_PROJECT: urai-4dc1d

jobs:
  preflight:
    name: Verify ElevenLabs secret payload access with production WIF identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Guard isolated branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/urai-spatial'
          test "$GITHUB_REF" = 'refs/heads/ops/founder-voice-elevenlabs-preflight-20260916'

      - name: Authenticate through repository production WIF identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.EXPECTED_PROJECT }}
          workload_identity_provider: 'projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/github-actions'
          service_account: 'urai-spatial-github-deployer@urai-4dc1d.iam.gserviceaccount.com'
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.EXPECTED_PROJECT }}
          version: '>= 500.0.0'

      - name: Probe ElevenLabs secret payload without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = "$EXPECTED_PROJECT"
          gcloud secrets describe ELEVENLABS_API_KEY --project "$EXPECTED_PROJECT" --format='value(name)' >/dev/null
          gcloud secrets versions access latest --secret=ELEVENLABS_API_KEY --project "$EXPECTED_PROJECT" >/dev/null
          echo 'ELEVENLABS_API_KEY payload access confirmed without disclosure.'
