name: V28 Authored Sanctuary Repair

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/v28-authored-sanctuary-repair.yml'
      - 'scripts/apply-v28-authored-sanctuary.py'

permissions:
  contents: write

concurrency:
  group: v28-authored-sanctuary-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply V28 authored sanctuary repair
        run: python3 scripts/apply-v28-authored-sanctuary.py

      - name: Verify V28 source markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'v28-filtered-authored-spatial-depth-no-fantasy-families' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v28-authored-threshold-court-no-box-walls' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v28-curved-machined-load-paths-attached-to-piers' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v28-continuous-curved-rib-skylight-no-floating-bars' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F "'mirror-basin-'" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F "'orb-sanctuary-pedestal'" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F "'inhabited-village-'" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F "'sanctuary-waterfall-'" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx

      - name: Verify focused runtime contracts
        working-directory: urai-tier1
        run: node --test --test-concurrency=1 tests/embodied-exploration-contract.test.mjs tests/continuous-spatial-restoration-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs

      - name: Commit clean successor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$current" = "${GITHUB_SHA}"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git rm .github/workflows/v28-authored-sanctuary-repair.yml scripts/apply-v28-authored-sanctuary.py
          test -n "$(git status --porcelain)"
          git commit -m 'Apply V28 authored sanctuary architecture repair'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826
