name: V1 Pipeline Self Report

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1-self-report.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile

      - name: Verify handoff
        id: handoff
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-asset-factory-handoff.mjs

      - name: Audit asset wall
        id: assetwall
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: node scripts/audit-v123-asset-wall.mjs

      - name: Typecheck
        id: typecheck
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm typecheck

      - name: Build static
        id: build
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm build:static

      - name: Report outcomes
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL: ${{ steps.install.outcome }}
          HANDOFF: ${{ steps.handoff.outcome }}
          ASSETWALL: ${{ steps.assetwall.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
        with:
          script: |
            const body = [
              `Run: ${context.runId}`,
              `Commit: ${context.sha}`,
              '',
              `install=${process.env.INSTALL}`,
              `handoff=${process.env.HANDOFF}`,
              `assetwall=${process.env.ASSETWALL}`,
              `typecheck=${process.env.TYPECHECK}`,
              `build=${process.env.BUILD}`
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `V1 pipeline self-report ${context.runId}`,
              body
            });
