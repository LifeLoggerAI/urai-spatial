name: URAI Spatial Firebase Preview Guard

on:
  workflow_dispatch:
    inputs:
      verification_ref:
        description: Exact branch, tag, or commit to verify before enabling a preview channel
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: urai-spatial-preview-guard-${{ inputs.verification_ref }}
  cancel-in-progress: true

jobs:
  preview-guard:
    name: Verify preview readiness without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verification_ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run canonical preflight
        run: pnpm preflight

      - name: Build canonical app
        run: pnpm --filter urai-tier1 build

      - name: State preview boundary
        run: |
          echo "This workflow verifies preview readiness only."
          echo "It does not deploy a Firebase preview channel."
          echo "A future preview deployment requires a dedicated service account, project/site ID, exact ref, expiry, and receipt."
