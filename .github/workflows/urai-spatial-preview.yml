name: URAI Spatial Firebase Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: urai-spatial-preview-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  EXPECTED_FIREBASE_PROJECT: urai-4dc1d

jobs:
  preview:
    name: Exact-head isolated preview deploy and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Preflight
        run: pnpm preflight
      - name: Build exact static candidate with acceptance fixtures
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.URAI_EXACT_HEAD }}
          URAI_LOCATION_MAP_ACCEPTANCE_FIXTURES: '1'
          URAI_FIREBASE_STATIC_EXPORT: 'true'
        run: pnpm build:static
      - name: Prove exact source remained clean
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Verify and stage isolated preview payload
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/firebase.preview.json
          test -d urai-tier1/out
          test -f urai-tier1/out/index.html
          test -f urai-tier1/out/location-map/index.html
          rm -rf .github/urai-tier1
          mkdir -p .github/urai-tier1
          cp -R urai-tier1/out .github/urai-tier1/out
          test -f .github/urai-tier1/out/index.html
          test -f .github/urai-tier1/out/location-map/index.html
      - name: Deploy isolated Firebase preview channel
        id: deploy
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ env.EXPECTED_FIREBASE_PROJECT }}
        run: |
          set -euo pipefail
          SERVICE_ACCOUNT_STATUS=missing
          PROJECT_ID_STATUS=missing
          test -n "$FIREBASE_SERVICE_ACCOUNT" && SERVICE_ACCOUNT_STATUS=present
          test -n "$FIREBASE_PROJECT_ID" && PROJECT_ID_STATUS=present
          printf 'firebase_service_account=%s\nfirebase_project_id=%s\n' "$SERVICE_ACCOUNT_STATUS" "$PROJECT_ID_STATUS" > preview-auth-boundary.txt
          test "$SERVICE_ACCOUNT_STATUS" = present
          test "$PROJECT_ID_STATUS" = present
          CREDENTIALS_FILE="$RUNNER_TEMP/firebase-preview-service-account.json"
          cleanup() { rm -f "$CREDENTIALS_FILE"; }
          trap cleanup EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDENTIALS_FILE"
          chmod 600 "$CREDENTIALS_FILE"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIALS_FILE"
          CHANNEL_ID="lane6-889-${URAI_EXACT_HEAD:0:7}"
          test "$CHANNEL_ID" != "live"
          set +e
          pnpm exec firebase hosting:channel:deploy "$CHANNEL_ID" --config .github/firebase.preview.json --project "$FIREBASE_PROJECT_ID" --expires 1d --non-interactive --json > preview-deploy.json 2> preview-deploy.stderr
          DEPLOY_STATUS=$?
          set -e
          printf '%s\n' "$DEPLOY_STATUS" > preview-deploy.exit-code
          if [ "$DEPLOY_STATUS" -ne 0 ]; then cat preview-deploy.stderr >&2; exit "$DEPLOY_STATUS"; fi
          PREVIEW_URL=$(node -e "const fs=require('fs');const value=JSON.parse(fs.readFileSync('preview-deploy.json','utf8'));const urls=[];const walk=x=>{if(typeof x==='string'&&/^https:\/\//.test(x))urls.push(x);else if(Array.isArray(x))x.forEach(walk);else if(x&&typeof x==='object')Object.values(x).forEach(walk)};walk(value);const url=urls.find(x=>x.includes('.web.app'))||urls[0];if(!url)process.exit(1);process.stdout.write(url)")
          case "$PREVIEW_URL" in https://*.web.app|https://*.firebaseapp.com) ;; *) echo "Unexpected non-preview URL: $PREVIEW_URL" >&2; exit 65 ;; esac
          test "$PREVIEW_URL" != "https://urai.app"
          test "$PREVIEW_URL" != "https://urai.app/"
          printf 'preview_url=%s\n' "$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          printf 'channel_id=%s\n' "$CHANNEL_ID" >> "$GITHUB_OUTPUT"
          node - "$PREVIEW_URL" "$CHANNEL_ID" <<'NODE'
          const fs = require('fs')
          const crypto = require('crypto')
          const previewUrl = process.argv[2]
          const channelId = process.argv[3]
          const deploymentPath = 'preview-deploy.json'
          const digest = crypto.createHash('sha256').update(fs.readFileSync(deploymentPath)).digest('hex')
          fs.writeFileSync('preview-receipt.txt', [
            `exact_sha=${process.env.URAI_EXACT_HEAD}`,
            `run_id=${process.env.GITHUB_RUN_ID}`,
            `job=${process.env.GITHUB_JOB}`,
            'environment=firebase-hosting-preview-channel',
            `channel_id=${channelId}`,
            `preview_url=${previewUrl}`,
            'production_targeted=false',
            `deployed_at=${new Date().toISOString()}`,
            `deployment_receipt_sha256=${digest}`,
            '',
          ].join('\n'))
          NODE
      - name: Verify reachable preview runtime and SHA identity
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30 "$PREVIEW_URL/location-map/" -o preview-location-map.html
          grep -q 'URAI' preview-location-map.html
          grep -q "$URAI_EXACT_HEAD" preview-location-map.html
      - name: Install Chromium for deployed acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Run complete browser acceptance against deployed preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.preview_url }}
          URAI_EXACT_HEAD: ${{ env.URAI_EXACT_HEAD }}
        run: node scripts/run-location-map-browser-acceptance-fixed.mjs
      - name: Create exact-head evidence manifest
        if: always()
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          CHANNEL_ID: ${{ steps.deploy.outputs.channel_id }}
        run: |
          set -euo pipefail
          mkdir -p preview-evidence
          cp -f preview-auth-boundary.txt preview-deploy.json preview-deploy.stderr preview-deploy.exit-code preview-receipt.txt preview-location-map.html preview-evidence/ 2>/dev/null || true
          printf 'exact_sha=%s\nrun_id=%s\njob_id=%s\nworkflow=%s\npreview_url=%s\nchannel_id=%s\ncaptured_at=%s\n' "$URAI_EXACT_HEAD" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$GITHUB_WORKFLOW" "$PREVIEW_URL" "$CHANNEL_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > preview-evidence/manifest.txt
          evidence_paths=(preview-evidence)
          test -d test-results && evidence_paths+=(test-results)
          test -d playwright-report && evidence_paths+=(playwright-report)
          find "${evidence_paths[@]}" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > "$RUNNER_TEMP/location-map-evidence-sha256sums"
          mv "$RUNNER_TEMP/location-map-evidence-sha256sums" preview-evidence/SHA256SUMS
      - name: Retain preview deployment and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-location-map-preview-acceptance-${{ env.URAI_EXACT_HEAD }}
          path: |
            preview-evidence
            test-results
            playwright-report
          if-no-files-found: error
          retention-days: 90
