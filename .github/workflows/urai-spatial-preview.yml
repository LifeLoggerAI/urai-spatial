name: URAI Spatial Firebase Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: urai-spatial-pr-proof-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  local-browser-proof:
    name: Exact-head local browser acceptance without deployment credentials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Preflight
        run: pnpm preflight
      - name: Build exact static candidate with acceptance fixtures
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.URAI_EXACT_HEAD }}
          URAI_LOCATION_MAP_ACCEPTANCE_FIXTURES: '1'
          URAI_FIREBASE_STATIC_EXPORT: 'true'
        run: pnpm build:static
      - name: Prove exact source remained clean
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
      - name: Serve exact static candidate locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory urai-tier1/out > local-preview-server.log 2>&1 &
          echo $! > local-preview-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/location-map/ > local-location-map.html; then
              break
            fi
            sleep 1
          done
          grep -q "$URAI_EXACT_HEAD" local-location-map.html
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run exact-head Location Map smoke without secrets
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          URAI_EXACT_HEAD: ${{ env.URAI_EXACT_HEAD }}
        run: pnpm exec playwright test tests/location-map-trusted-preview-smoke.spec.ts --config=playwright.config.ts
      - name: Run complete exact-head Location Map browser acceptance without secrets
        # Match the canonical Location Map verifier's full gesture budget. This does not
        # skip or relax drag, pinch, selection, deselection, console, or network assertions.
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          URAI_EXACT_HEAD: ${{ env.URAI_EXACT_HEAD }}
          URAI_LOCATION_MAP_ACCEPTANCE_FIXTURES: '1'
        run: pnpm exec playwright test tests/location-map-browser-acceptance-v2.spec.ts --config=playwright.config.ts --timeout=120000
      - name: Build exact-head local evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-evidence
          cp -f local-preview-server.log local-location-map.html preview-evidence/ 2>/dev/null || true
          printf 'exact_sha=%s\nrun_id=%s\nworkflow=%s\nmode=local-no-secrets\nproduction_targeted=false\ncaptured_at=%s\n' \
            "$URAI_EXACT_HEAD" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > preview-evidence/manifest.txt
          evidence_paths=(preview-evidence)
          test -d test-results && evidence_paths+=(test-results)
          test -d playwright-report && evidence_paths+=(playwright-report)
          find "${evidence_paths[@]}" -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > preview-evidence/SHA256SUMS
      - name: Retain exact-head local browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-location-map-local-acceptance-${{ env.URAI_EXACT_HEAD }}
          path: |
            preview-evidence
            test-results
            playwright-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
