name: One-shot final review repairs

on:
  push:
    branches:
      - feat/embodied-exploration-frozen-85f9754-20260718
    paths:
      - .github/workflows/one-shot-final-review-repairs.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore(review): queue exact final review repairs'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/embodied-exploration-frozen-85f9754-20260718
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded review repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1))

          navigation = Path('urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx')
          replace_once(
              navigation,
              """      if (event.code === 'Enter' || event.code === 'Space') {
                callbacksRef.current.onInteract?.()
                return
              }
          """,
              """      if (event.code === 'Enter' || event.code === 'Space') {
                event.preventDefault()
                callbacksRef.current.onInteract?.()
                return
              }
          """,
          )

          boundary = Path('urai-tier1/src/spatial/world/LifeMapIndependentInputBoundary.tsx')
          replace_once(
              boundary,
              """    const attach = () => {
                attached.forEach((element) => {
                  if (!element.isConnected) {
                    removeGestureBoundary(element)
                    attached.delete(element)
                  }
                })
                document.querySelectorAll<HTMLElement>(INTERACTIVE_SELECTOR).forEach((element) => {
          """,
              """    const attach = () => {
                const detached = [...attached].filter((element) => !element.isConnected)
                detached.forEach((element) => {
                  removeGestureBoundary(element)
                  attached.delete(element)
                })
                document.querySelectorAll<HTMLElement>(INTERACTIVE_SELECTOR).forEach((element) => {
          """,
          )

          scene = Path('urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx')
          replace_once(
              scene,
              """  const normalized = value.length === 3 ? value.split(\"\").map((part) => part + part).join(\"\") : value.padEnd(6, \"0\").slice(0, 6);
            const number = Number.parseInt(normalized, 16);
            const red = (number >> 16) & 255;
          """,
              """  const normalized = value.length === 3 ? value.split(\"\").map((part) => part + part).join(\"\") : value.padEnd(6, \"0\").slice(0, 6);
            if (!/^[0-9a-f]{6}$/i.test(normalized)) return `rgba(138, 223, 255, ${alpha})`;
            const number = Number.parseInt(normalized, 16);
            const red = (number >> 16) & 255;
          """,
          )
          replace_once(
              scene,
              """  useEffect(() => {
                const nextTexture = createMemorySurface(node, textureResolution);
                setTexture(nextTexture);
                return () => nextTexture?.dispose();
              }, [node, textureResolution]);
          """,
              """  useEffect(() => {
                const nextTexture = createMemorySurface(node, textureResolution);
                setTexture(nextTexture);
                return () => {
                  if (typeof window === \"undefined\") {
                    nextTexture?.dispose();
                    return;
                  }
                  window.requestAnimationFrame(() => nextTexture?.dispose());
                };
              }, [node, textureResolution]);
          """,
          )

          embodied_test = Path('urai-tier1/tests/embodied-exploration-contract.test.mjs')
          replace_once(
              embodied_test,
              """  assert.match(kernel, /callbacksRef\.current = \{ onEscape, onInteract, onReset \}/)
            assert.match(kernel, /\}, \[enabled\]\)/)
          """,
              """  assert.match(kernel, /callbacksRef\.current = \{ onEscape, onInteract, onReset \}/)
            assert.match(kernel, /event\.code === 'Enter' \|\| event\.code === 'Space'[\s\S]*event\.preventDefault\(\)/)
            assert.match(kernel, /\}, \[enabled\]\)/)
          """,
          )
          replace_once(
              embodied_test,
              """  assert.match(lifeMapBoundary, /life-map-memory-portals/)
            assert.match(embodiedLayout, /data-world-destination='life-map'[\s\S]*\.life-map-movement-help[\s\S]*top: max\(78px/)
          """,
              """  assert.match(lifeMapBoundary, /life-map-memory-portals/)
            assert.match(lifeMapBoundary, /const detached = \[\.\.\.attached\]\.filter\(\(element\) => !element\.isConnected\)/)
            assert.match(lifeMapBoundary, /detached\.forEach\(\(element\) => \{[\s\S]*removeGestureBoundary\(element\)[\s\S]*attached\.delete\(element\)/)
            assert.match(embodiedLayout, /data-world-destination='life-map'[\s\S]*\.life-map-movement-help[\s\S]*top: max\(78px/)
          """,
          )

          lifemap_test = Path('urai-tier1/tests/lifemap-scene-behavior.test.mjs')
          replace_once(
              lifemap_test,
              """  assert.ok(source.includes('setTexture(nextTexture)'), 'Committed textures must enter React state only after creation.')
            assert.ok(source.includes('return () => nextTexture?.dispose()'), 'Every replaced or unmounted CanvasTexture must be disposed.')
            assert.doesNotMatch(source, /useMemo\(\(\) => createMemorySurface/, 'CanvasTexture allocation must never occur during render.')
          """,
              """  assert.ok(source.includes('setTexture(nextTexture)'), 'Committed textures must enter React state only after creation.')
            assert.ok(source.includes('window.requestAnimationFrame(() => nextTexture?.dispose())'), 'Replaced textures must remain alive through the replacement commit and paint.')
            assert.doesNotMatch(source, /return \(\) => nextTexture\?\.dispose\(\)/, 'Texture cleanup must not dispose the previous texture synchronously before replacement paint.')
            assert.ok(source.includes('if (!/^[0-9a-f]{6}$/i.test(normalized))'), 'Invalid aura metadata must fall back before RGB bitwise conversion.')
            assert.ok(source.includes('return `rgba(138, 223, 255, ${alpha})`'), 'Invalid aura metadata must use the canonical cyan fallback.')
            assert.doesNotMatch(source, /useMemo\(\(\) => createMemorySurface/, 'CanvasTexture allocation must never occur during render.')
          """,
          )
          PY

      - name: Prove focused contracts and clean patch
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            urai-tier1/tests/embodied-exploration-contract.test.mjs \
            urai-tier1/tests/lifemap-scene-behavior.test.mjs
          git diff --check
          rm .github/workflows/one-shot-final-review-repairs.yml
          test ! -e .github/workflows/one-shot-final-review-repairs.yml

      - name: Commit exact repaired product
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx \
            urai-tier1/src/spatial/world/LifeMapIndependentInputBoundary.tsx \
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx \
            urai-tier1/tests/embodied-exploration-contract.test.mjs \
            urai-tier1/tests/lifemap-scene-behavior.test.mjs \
            .github/workflows/one-shot-final-review-repairs.yml
          git commit -m 'fix(spatial): close final interaction and texture lifecycle reviews'
          git push origin HEAD:feat/embodied-exploration-frozen-85f9754-20260718
