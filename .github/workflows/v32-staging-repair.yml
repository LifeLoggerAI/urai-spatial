name: V32 Staging Repair

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/v32-staging-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Make V32 ceiling removal formatting-independent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/v32-sanctuary-rebuild.yml')
          s = p.read_text()
          old = "source = source.replace('<SanctuaryArchitecture /><SanctuaryGlazing /><SanctuaryCeiling /><AtmosphericDepth />', '<SanctuaryArchitecture /><SanctuaryGlazing /><AtmosphericDepth />', 1)"
          new = "assert '<SanctuaryCeiling />' in source, 'live SanctuaryCeiling call missing before V32 transform'\n          source = source.replace('<SanctuaryCeiling />', '', 1)"
          assert old in s, 'expected V32 ceiling transform not found'
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit repair and remove helper
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add .github/workflows/v32-sanctuary-rebuild.yml
          git rm .github/workflows/v32-staging-repair.yml
          git commit -m 'Repair V32 ceiling-removal staging transform'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826