name: URAI Canonical Production Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/deny-direct-production-deploy.mjs'
      - 'scripts/urai-release-control-smoke.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spatial-live-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/deny-direct-production-deploy.mjs'
      - 'scripts/urai-release-control-smoke.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spatial-live-deploy.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Release current main or roll back to a verified main ancestor
        required: true
        default: release
        type: choice
        options: [release, rollback]
      release_sha:
        description: Exact 40-character main commit SHA to deploy
        required: true
        type: string
      rollback_sha:
        description: Distinct verified ancestor reserved if this deployment must be reversed
        required: true
        type: string
      confirm:
        description: Type DEPLOY_URAI_APP
        required: true
        default: CHECK_ONLY
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'urai-app-production' || format('urai-app-verify-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'
  EXPECTED_FIREBASE_PROJECT: urai-4dc1d
  LIVE_URL: https://urai.app

jobs:
  verify:
    name: Exact-head release verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact clean target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
      - name: Validate manual release or rollback inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${{ github.ref }}" = 'refs/heads/main'
          test "$RELEASE_SHA" = "$TARGET_SHA"
          test "$RELEASE_SHA" != "$ROLLBACK_SHA"
          git cat-file -e "$RELEASE_SHA^{commit}"
          git cat-file -e "$ROLLBACK_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$DISPATCH_SHA"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$RELEASE_SHA"
          if test "$MODE" = 'release'; then
            test "$RELEASE_SHA" = "$DISPATCH_SHA"
          else
            test "$MODE" = 'rollback'
            test "$RELEASE_SHA" != "$DISPATCH_SHA"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production workflow authority
        run: node scripts/audit-production-workflow-authority.mjs
      - name: Validate canonical assets
        run: pnpm --dir urai-tier1 assets:validate
      - name: Materialize asset receipt
        run: pnpm --dir urai-tier1 receipt:assets
      - name: Typecheck Tier1
        run: pnpm --dir urai-tier1 typecheck
      - name: Verify AAA world
        run: pnpm --dir urai-tier1 verify:aaa-world
      - name: Verify XR contracts
        run: pnpm --dir urai-tier1 xr:verify
      - name: Verify live release contract
        env:
          GITHUB_SHA: ${{ env.TARGET_SHA }}
          URAI_TARGET_SHA: ${{ env.TARGET_SHA }}
          FIREBASE_PROJECT_ID: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_EXPECTED_FIREBASE_PROJECT: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_LIVE_BASE_URL: ${{ env.LIVE_URL }}
        run: pnpm live:check
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-exact-head-${{ env.TARGET_SHA }}
          path: |
            docs/ASSET_VERIFICATION_REPORT.md
            docs/final-asset-receipt.md
            deployment-receipt/${{ env.TARGET_SHA }}/
            release/
            STATUS.md
            EVIDENCE.md
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 90

  verify-rollback:
    name: Exact-SHA rollback verification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ inputs.rollback_sha }}
    steps:
      - name: Checkout exact rollback target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ROLLBACK_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove rollback ancestry and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ROLLBACK_SHA"
          test -z "$(git status --porcelain)"
          test "$ROLLBACK_SHA" != "$RELEASE_SHA"
          git cat-file -e "$RELEASE_SHA^{commit}"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$RELEASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify rollback release-critical contract
        env:
          GITHUB_SHA: ${{ env.ROLLBACK_SHA }}
          URAI_TARGET_SHA: ${{ env.ROLLBACK_SHA }}
          FIREBASE_PROJECT_ID: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_EXPECTED_FIREBASE_PROJECT: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_LIVE_BASE_URL: ${{ env.LIVE_URL }}
        run: pnpm live:check
      - name: Upload rollback verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-rollback-verified-${{ env.ROLLBACK_SHA }}
          path: |
            deployment-receipt/${{ env.ROLLBACK_SHA }}/
            STATUS.md
            EVIDENCE.md
          if-no-files-found: warn
          retention-days: 365

  deploy:
    name: Deploy exact SHA to urai.app
    needs: [verify, verify-rollback]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'DEPLOY_URAI_APP'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      DISPATCH_SHA: ${{ github.sha }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      URAI_EXPECTED_FIREBASE_PROJECT: urai-4dc1d
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ inputs.release_sha }}
      URAI_TARGET_SHA: ${{ inputs.release_sha }}
      URAI_LIVE_BASE_URL: https://urai.app
      URAI_DEPLOY_CONFIRM: DEPLOY_STATIC_URAI
      URAI_CANONICAL_DEPLOY_WORKFLOW: 'true'
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
    steps:
      - name: Checkout frozen release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate authority and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$FIREBASE_PROJECT_ID" = "$URAI_EXPECTED_FIREBASE_PROJECT"
          test "$RELEASE_SHA" != "$ROLLBACK_SHA"
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" "$DISPATCH_SHA"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$RELEASE_SHA"
          if test "$RELEASE_MODE" = 'release'; then
            test "$RELEASE_SHA" = "$DISPATCH_SHA"
          else
            test "$RELEASE_MODE" = 'rollback'
            test "$RELEASE_SHA" != "$DISPATCH_SHA"
          fi
          test -n '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
      - name: Write and validate temporary service account
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GOOGLE_APPLICATION_CREDENTIALS" <<'JSON'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          JSON
          python -m json.tool "$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null
          python - "$GOOGLE_APPLICATION_CREDENTIALS" "$URAI_EXPECTED_FIREBASE_PROJECT" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              service_account = json.load(handle)
          if service_account.get('project_id') != sys.argv[2]:
              raise SystemExit(f"Service-account project mismatch: {service_account.get('project_id')!r}")
          PY
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for live evidence
        run: pnpm exec playwright install --with-deps chromium
      - name: Deploy exact release and run built-in smoke
        env:
          GITHUB_SHA: ${{ env.RELEASE_SHA }}
        run: pnpm live:deploy
      - name: Run canonical live smoke
        env:
          URAI_EXPECTED_DEPLOYED_SHA: ${{ env.RELEASE_SHA }}
        run: node scripts/urai-release-control-smoke.mjs
      - name: Record protected rollback request
        run: |
          mkdir -p "deployment-receipt/$RELEASE_SHA"
          cat > "deployment-receipt/$RELEASE_SHA/rollback-request.json" <<EOF
          {
            "workflow": ".github/workflows/spatial-live-deploy.yml",
            "mode": "rollback",
            "targetReleaseSha": "$ROLLBACK_SHA",
            "requiredFallback": "Select a distinct verified ancestor of $ROLLBACK_SHA",
            "confirmation": "DEPLOY_URAI_APP",
            "workstationDeployAllowed": false
          }
          EOF
          cat > "deployment-receipt/$RELEASE_SHA/rollback.txt" <<EOF
          Rollback must be dispatched from the protected URAI Canonical Production Release workflow on main.
          Set mode=rollback and release_sha=$ROLLBACK_SHA.
          Set rollback_sha to a distinct verified ancestor of $ROLLBACK_SHA.
          Set confirm=DEPLOY_URAI_APP.
          Do not deploy from a workstation.
          EOF
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-production-${{ env.RELEASE_SHA }}
          path: |
            deployment-receipt/${{ env.RELEASE_SHA }}/
            release-control-evidence/
          if-no-files-found: error
          retention-days: 365
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
