name: URAI Canonical Production Release Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/firebase-hosting-recovery.mjs'
      - 'scripts/verify-release-credential-boundary.mjs'
      - 'scripts/verify-release-credential-boundary-static.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'package.json'
      - '.github/workflows/spatial-live-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/firebase-hosting-recovery.mjs'
      - 'scripts/verify-release-credential-boundary.mjs'
      - 'scripts/verify-release-credential-boundary-static.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'package.json'
      - '.github/workflows/spatial-live-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-app-production-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'
  EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    name: Verify canonical source with production release quarantined
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production authority is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-production-workflow-authority.mjs
          node scripts/verify-release-credential-boundary.mjs
          node scripts/verify-release-credential-boundary-static.mjs
          # Failure contract: Long-lived Google/Firebase credential material is forbidden in the canonical production release boundary.
          # Production mutation is forbidden while provider WIF/IAM and runtime identity remain unproven.
          # A successful main-only WIF proof satisfies only that identity sub-gate; revocation, live-provider and remaining release gates still block mutation.

      - name: Verify canonical Tier1 source
        run: |
          pnpm --dir urai-tier1 assets:validate
          pnpm --dir urai-tier1 typecheck
          pnpm --dir urai-tier1 verify:aaa-world
          pnpm --dir urai-tier1 xr:verify

      - name: Record NO-GO release classification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-control-evidence
          {
            echo '# URAI Spatial production release status'
            echo
            echo 'Classification: NO-GO'
            echo 'Production release and Hosting recovery are intentionally quarantined.'
            echo 'A short-lived read-only WIF identity proof may run on canonical main; it grants no production mutation path.'
            echo 'Re-enable only after short-lived provider identity, WIF/IAM trust, least privilege, runtime read-back, rollback evidence, and historical credential revocation are independently verified.'
            echo 'Even after the WIF identity sub-gate passes, remaining provider, revocation, governance, live and device gates must still close before mutation.'
            echo "Commit: $EXACT_HEAD_SHA"
          } > release-control-evidence/spatial-production-quarantine.md

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-spatial-production-quarantine-${{ env.EXACT_HEAD_SHA }}
          path: release-control-evidence/
          if-no-files-found: warn
          retention-days: 90

  wif-proof:
    name: Prove short-lived Google WIF identity
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact main source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/urai-spatial'
          test "$GITHUB_REF" = 'refs/heads/main'
          test -z "$(git status --porcelain --untracked-files=all)"

      - id: google-auth
        name: Exchange GitHub OIDC for short-lived Google identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: 'urai-4dc1d'
          workload_identity_provider: 'projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/github-actions'
          service_account: 'urai-spatial-github-deployer@urai-4dc1d.iam.gserviceaccount.com'
          token_format: 'access_token'
          access_token_lifetime: '300s'
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform.read-only'
          create_credentials_file: false
          export_environment_variables: false
          request_reason: 'URAI keyless WIF runtime identity proof'

      - name: Record keyless runtime identity receipt
        shell: bash
        env:
          GOOGLE_WIF_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_WIF_ACCESS_TOKEN:-}"
          mkdir -p release-control-evidence
          {
            echo '# URAI Google WIF runtime identity proof'
            echo
            echo 'Result: PASS'
            echo 'Token exchange: completed'
            echo 'Service-account impersonation: completed'
            echo "Commit: $GITHUB_SHA"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Ref: $GITHUB_REF"
            echo 'Workflow: .github/workflows/spatial-live-deploy.yml'
            echo 'Provider: projects/952723774155/locations/global/workloadIdentityPools/urai-github-prod/providers/github-actions'
            echo 'Service account: urai-spatial-github-deployer@urai-4dc1d.iam.gserviceaccount.com'
            echo 'Credential class: short-lived GitHub OIDC via Google Workload Identity Federation'
            echo 'OAuth scope: https://www.googleapis.com/auth/cloud-platform.read-only'
            echo 'Requested access-token lifetime: 300s'
            echo 'Production mutation command: none'
            echo 'Token value: not persisted'
          } > release-control-evidence/google-wif-runtime-identity.md

      - name: Upload WIF identity proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-google-wif-proof-${{ github.sha }}
          path: release-control-evidence/
          if-no-files-found: error
          retention-days: 90
