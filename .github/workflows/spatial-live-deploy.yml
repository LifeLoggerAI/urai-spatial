name: URAI Spatial Live Release Check

on:
  push:
    branches:
      - main
    paths:
      - "urai-tier1/**"
      - "apps/functions/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "src/canon/**"
      - "docs/**"
      - "release/**"
      - "audit/**"
      - "firebase/**"
      - "firebase.json"
      - "firebase.static.json"
      - "CANONICAL_RUNTIME.md"
      - "STATUS.md"
      - "EVIDENCE.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "urai-tier1/**"
      - "apps/functions/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "src/canon/**"
      - "docs/**"
      - "release/**"
      - "audit/**"
      - "firebase/**"
      - "firebase.json"
      - "firebase.static.json"
      - "CANONICAL_RUNTIME.md"
      - "STATUS.md"
      - "EVIDENCE.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-spatial-live-release-check-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Spatial release gates without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_URAI_SPATIAL_DOMAIN: ${{ vars.NEXT_PUBLIC_URAI_SPATIAL_DOMAIN }}
      NEXT_PUBLIC_URAI_DEBUG_SPATIAL: ${{ vars.NEXT_PUBLIC_URAI_DEBUG_SPATIAL }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      URAI_CORE_BASE_URL: ${{ vars.URAI_CORE_BASE_URL }}
      URAI_STUDIO_BASE_URL: ${{ vars.URAI_STUDIO_BASE_URL }}
      ASSET_FACTORY_BASE_URL: ${{ vars.ASSET_FACTORY_BASE_URL }}
      URAI_JOBS_BASE_URL: ${{ vars.URAI_JOBS_BASE_URL }}
    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "verified_sha=$actual"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm --version

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate fail-closed release receipt
        run: node scripts/check-release-receipt.mjs

      - name: Check versioned asset readiness
        run: node scripts/check-v1-v6-asset-ready.mjs

      - name: Run authoritative live release checks
        run: pnpm live:check

      - name: Run resilient E2E evidence
        if: always()
        run: pnpm verify:e2e:resilient

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-spatial-live-check-evidence-${{ github.sha }}
          path: |
            EVIDENCE.md
            STATUS.md
            LIVE_RELEASE.md
            DEPLOYMENT.md
            RUNBOOK.md
            docs
            operations
            release
            audit
            firebase
            urai-tier1/src/data/release-receipt.json
            urai-tier1/src/lib/release-evidence.ts
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 30

      - name: State deployment authority
        run: |
          echo "This workflow performs verification only."
          echo "The sole deployment authority is .github/workflows/urai-spatial-deploy.yml."
