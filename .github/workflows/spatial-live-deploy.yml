name: URAI Spatial Canonical Production Deploy

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact current main SHA to certify and deploy
        required: true
        type: string
      current_deployed_sha:
        description: Exact SHA currently deployed to urai.app, established before this run
        required: true
        type: string
      rollback_sha:
        description: Exact rollback SHA; must equal the recorded current deployed SHA
        required: true
        type: string
      current_deployment_receipt:
        description: Receipt or evidence reference proving the current deployed SHA
        required: true
        type: string
      live_url:
        description: Canonical custom domain to verify
        required: true
        default: https://urai.app
        type: string
      confirm_deploy:
        description: Type DEPLOY-EXACT-SHA
        required: true
        type: string
      confirm_rollback_rehearsal:
        description: Type EXERCISE-ROLLBACK to prove rollback and restore the target
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: urai-spatial-canonical-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: urai-4dc1d
  LIVE_URL: ${{ inputs.live_url }}
  TARGET_SHA: ${{ inputs.expected_sha }}
  CURRENT_DEPLOYED_SHA: ${{ inputs.current_deployed_sha }}
  ROLLBACK_SHA: ${{ inputs.rollback_sha }}

jobs:
  verify:
    name: Verify exact Spatial release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Enforce production authority and rollback inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_deploy }}" = "DEPLOY-EXACT-SHA"
          test "${{ inputs.confirm_rollback_rehearsal }}" = "EXERCISE-ROLLBACK"
          test -n "${{ inputs.current_deployment_receipt }}"
          for value in "$TARGET_SHA" "$CURRENT_DEPLOYED_SHA" "$ROLLBACK_SHA"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit SHA: $value" >&2; exit 1; }
            git cat-file -e "$value^{commit}"
          done
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --force
          test "$(git rev-parse origin/main)" = "$TARGET_SHA" || {
            echo "Production target must equal the current origin/main SHA." >&2
            exit 1
          }
          test "$CURRENT_DEPLOYED_SHA" = "$ROLLBACK_SHA" || {
            echo "Rollback SHA must equal the recorded pre-deploy production SHA." >&2
            exit 1
          }
          test "$TARGET_SHA" != "$ROLLBACK_SHA" || {
            echo "Target and rollback SHAs must differ." >&2
            exit 1
          }

      - name: Setup Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Frozen installation
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Generate exact-head core evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/core
          pnpm runtime:authority 2>&1 | tee release-evidence/core/canonical-contract.log
          node urai-tier1/tests/spatial-system-contract-route-coverage.test.mjs 2>&1 | tee release-evidence/core/route-contract.log
          node scripts/check-system-loop-runtime.mjs 2>&1 | tee release-evidence/core/runtime-compile.log
          node scripts/smoke-system-loop-runtime.mjs 2>&1 | tee release-evidence/core/runtime-smoke.log
          pnpm typecheck 2>&1 | tee release-evidence/core/product-typecheck.log
          pnpm verify:assets 2>&1 | tee release-evidence/core/assets.log
          pnpm test:unit 2>&1 | tee release-evidence/core/unit-tests.log
          pnpm build:static 2>&1 | tee release-evidence/core/product-build.log
          node scripts/check-release-receipt.mjs 2>&1 | tee release-evidence/core/fail-closed-receipt.log

      - name: Upload immutable exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: urai-spatial-core-evidence-${{ inputs.expected_sha }}
          path: release-evidence/core
          if-no-files-found: error
          retention-days: 365

  deploy-certify-rollback:
    name: Deploy, externally verify, exercise rollback, and certify
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Download core evidence
        uses: actions/download-artifact@v4
        with:
          name: urai-spatial-core-evidence-${{ inputs.expected_sha }}
          path: ${{ runner.temp }}/urai-core-evidence

      - name: Setup Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Authenticate to Google Cloud with workload identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: urai-4dc1d

      - name: Install Firebase CLI and dependencies
        run: |
          pnpm add --global firebase-tools
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium --with-deps

      - name: Capture pre-deploy public fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/predeploy
          {
            echo "CURRENT_DEPLOYED_SHA=$CURRENT_DEPLOYED_SHA"
            echo "ROLLBACK_SHA=$ROLLBACK_SHA"
            echo "CURRENT_DEPLOYMENT_RECEIPT=${{ inputs.current_deployment_receipt }}"
            echo "CAPTURED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release-evidence/predeploy/authority.txt
          HOST="$LIVE_URL" node scripts/smoke-live-route-fingerprints.mjs 2>&1 | tee release-evidence/predeploy/live-route-fingerprints.log || true
          curl --fail-with-body --location "$LIVE_URL/status/" > release-evidence/predeploy/status.html

      - name: Materialize prepared release receipt
        shell: bash
        env:
          URAI_RELEASE_RECEIPT_PHASE: prepared
          URAI_RELEASE_CANDIDATE_SHA: ${{ inputs.expected_sha }}
          URAI_RELEASE_TESTED_SHA: ${{ inputs.expected_sha }}
          URAI_RELEASE_DEPLOYED_SHA: ${{ inputs.expected_sha }}
          URAI_RELEASE_ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          URAI_RELEASE_CANONICAL_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/canonical-contract.log
          URAI_RELEASE_ROUTE_CONTRACT_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/route-contract.log
          URAI_RELEASE_RUNTIME_COMPILE_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/runtime-compile.log
          URAI_RELEASE_RUNTIME_SMOKE_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/runtime-smoke.log
          URAI_RELEASE_TYPECHECK_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/product-typecheck.log
          URAI_RELEASE_BUILD_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/product-build.log
        run: |
          node scripts/materialize-release-receipt.mjs
          node scripts/check-release-receipt.mjs

      - name: Build and deploy prepared exact SHA
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:static 2>&1 | tee release-evidence/prepared-build.log
          firebase deploy --config firebase.static.json --only hosting --project urai-4dc1d --non-interactive 2>&1 | tee release-evidence/prepared-deploy.log

      - name: External browser, mobile, route, and accessibility proof
        shell: bash
        env:
          URAI_BASE_URL: ${{ inputs.live_url }}
          URAI_RECEIPT_ROOT: ${{ runner.temp }}/urai-live-proof
          URAI_ACCESSIBILITY_EVIDENCE: ${{ github.workspace }}/release-evidence/accessibility.json
        run: |
          set -euo pipefail
          mkdir -p release-evidence/live
          node scripts/aaa-launch-proof.mjs --skip-install --skip-typecheck --skip-assets --skip-test --skip-build --screenshots --base="$LIVE_URL" 2>&1 | tee release-evidence/live/browser-mobile-proof.log
          node scripts/verify-live-accessibility.mjs "$LIVE_URL" 2>&1 | tee release-evidence/live/accessibility.log
          HOST="$LIVE_URL" node scripts/smoke-live-route-fingerprints.mjs 2>&1 | tee release-evidence/live/custom-domain.log

      - name: Exercise rollback SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-evidence/rollback
          git checkout --force "$ROLLBACK_SHA"
          pnpm install --frozen-lockfile
          pnpm build:static 2>&1 | tee release-evidence/rollback/rollback-build.log
          firebase deploy --config firebase.static.json --only hosting --project urai-4dc1d --non-interactive 2>&1 | tee release-evidence/rollback/rollback-deploy.log
          HOST="$LIVE_URL" node scripts/smoke-live-route-fingerprints.mjs 2>&1 | tee release-evidence/rollback/rollback-smoke.log
          echo "ROLLBACK_VERIFIED_SHA=$ROLLBACK_SHA" >> release-evidence/rollback/rollback-smoke.log

      - name: Restore exact target and materialize certified receipt
        shell: bash
        env:
          URAI_RELEASE_RECEIPT_PHASE: certified
          URAI_RELEASE_CANDIDATE_SHA: ${{ inputs.expected_sha }}
          URAI_RELEASE_TESTED_SHA: ${{ inputs.expected_sha }}
          URAI_RELEASE_DEPLOYED_SHA: ${{ inputs.expected_sha }}
          URAI_RELEASE_ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          URAI_RELEASE_CANONICAL_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/canonical-contract.log
          URAI_RELEASE_ROUTE_CONTRACT_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/route-contract.log
          URAI_RELEASE_RUNTIME_COMPILE_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/runtime-compile.log
          URAI_RELEASE_RUNTIME_SMOKE_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/runtime-smoke.log
          URAI_RELEASE_TYPECHECK_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/product-typecheck.log
          URAI_RELEASE_BUILD_EVIDENCE: ${{ runner.temp }}/urai-core-evidence/product-build.log
          URAI_RELEASE_BROWSER_EVIDENCE: ${{ github.workspace }}/release-evidence/live/browser-mobile-proof.log
          URAI_RELEASE_MOBILE_EVIDENCE: ${{ github.workspace }}/release-evidence/live/browser-mobile-proof.log
          URAI_RELEASE_ACCESSIBILITY_EVIDENCE: ${{ github.workspace }}/release-evidence/accessibility.json
          URAI_RELEASE_CUSTOM_DOMAIN_EVIDENCE: ${{ github.workspace }}/release-evidence/live/custom-domain.log
          URAI_RELEASE_ROLLBACK_EVIDENCE: ${{ github.workspace }}/release-evidence/rollback/rollback-smoke.log
        run: |
          set -euo pipefail
          git checkout --force "$TARGET_SHA"
          pnpm install --frozen-lockfile
          node scripts/materialize-release-receipt.mjs
          node scripts/check-release-receipt.mjs
          pnpm build:static 2>&1 | tee release-evidence/certified-build.log
          firebase deploy --config firebase.static.json --only hosting --project urai-4dc1d --non-interactive 2>&1 | tee release-evidence/certified-deploy.log

      - name: Final exact-domain verification
        shell: bash
        run: |
          set -euo pipefail
          HOST="$LIVE_URL" node scripts/smoke-live-route-fingerprints.mjs 2>&1 | tee release-evidence/final-route-fingerprints.log
          curl --fail-with-body --location "$LIVE_URL/status/" > release-evidence/final-status.html
          grep -q "${TARGET_SHA:0:12}" release-evidence/final-status.html
          grep -q "${ROLLBACK_SHA:0:12}" release-evidence/final-status.html
          grep -q "URAI Privacy Controls" <(curl --fail-with-body --location "$LIVE_URL/privacy-controls/")

      - name: Write deployment receipt
        if: always()
        shell: bash
        run: |
          mkdir -p release-evidence
          node - <<'NODE'
          const fs = require('node:fs');
          const receipt = {
            schemaVersion: 'urai-spatial-canonical-deployment-1',
            generatedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            workflowRunId: process.env.GITHUB_RUN_ID,
            targetSha: process.env.TARGET_SHA,
            currentDeployedShaBeforeRun: process.env.CURRENT_DEPLOYED_SHA,
            rollbackSha: process.env.ROLLBACK_SHA,
            currentDeploymentReceipt: '${{ inputs.current_deployment_receipt }}',
            firebaseProject: 'urai-4dc1d',
            liveUrl: process.env.LIVE_URL,
            rollbackRehearsed: true,
            finalTargetRestored: true,
          };
          fs.writeFileSync('release-evidence/deployment.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE

      - name: Upload immutable production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-spatial-production-${{ inputs.expected_sha }}
          path: |
            release-evidence
            urai-tier1/src/data/release-receipt.json
            ${{ runner.temp }}/urai-live-proof
          if-no-files-found: error
          retention-days: 365
