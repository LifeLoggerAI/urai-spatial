name: URAI Canonical Production Release Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/firebase-hosting-recovery.mjs'
      - 'scripts/verify-release-credential-boundary.mjs'
      - 'scripts/verify-release-credential-boundary-static.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'package.json'
      - '.github/workflows/spatial-live-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/firebase-hosting-recovery.mjs'
      - 'scripts/verify-release-credential-boundary.mjs'
      - 'scripts/verify-release-credential-boundary-static.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'package.json'
      - '.github/workflows/spatial-live-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-app-production-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'

jobs:
  verify:
    name: Verify canonical source with production release quarantined
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          test "$(pnpm --version)" = "$PNPM_VERSION"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify production authority is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-production-workflow-authority.mjs
          node scripts/verify-release-credential-boundary.mjs
          node scripts/verify-release-credential-boundary-static.mjs
          # Failure contract: Long-lived Google/Firebase credential material remains in the canonical production release boundary.
          # Failure contract: Production mutation is forbidden while provider WIF/IAM and runtime identity remain unproven.

      - name: Verify canonical Tier1 source
        run: |
          pnpm --dir urai-tier1 assets:validate
          pnpm --dir urai-tier1 typecheck
          pnpm --dir urai-tier1 verify:aaa-world
          pnpm --dir urai-tier1 xr:verify

      - name: Record NO-GO release classification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-control-evidence
          {
            echo '# URAI Spatial production release status'
            echo
            echo 'Classification: NO-GO'
            echo 'Production release and Hosting recovery are intentionally quarantined.'
            echo 'Re-enable only after short-lived provider identity, WIF/IAM trust, least privilege, runtime read-back, rollback evidence, and historical credential revocation are independently verified.'
            echo "Commit: $GITHUB_SHA"
          } > release-control-evidence/spatial-production-quarantine.md

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: urai-spatial-production-quarantine-${{ github.sha }}
          path: release-control-evidence/
          if-no-files-found: warn
          retention-days: 90
