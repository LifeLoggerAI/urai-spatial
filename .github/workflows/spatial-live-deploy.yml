name: URAI Canonical Production Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/urai-release-control-smoke.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spatial-live-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/urai-release-control-smoke.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spatial-live-deploy.yml'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character target SHA; current main for deploy or proven ancestor for rollback
        required: true
        type: string
      rollback_sha:
        description: Proven production SHA reserved for rollback; must equal target during rollback
        required: true
        type: string
      confirm:
        description: Type DEPLOY_URAI_APP or ROLLBACK_URAI_APP
        required: true
        default: CHECK_ONLY
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'urai-app-production' || format('urai-app-verify-{0}-{1}', github.event.pull_request.number || github.ref, github.event.pull_request.head.sha || github.sha) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'
  EXPECTED_FIREBASE_PROJECT: urai-4dc1d
  LIVE_URL: https://urai.app

jobs:
  verify:
    name: Exact-head release verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      CURRENT_MAIN_SHA: ${{ github.sha }}
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact clean target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
      - name: Validate manual release inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${{ github.ref }}" = 'refs/heads/main'
          git cat-file -e "$RELEASE_SHA^{commit}"
          git cat-file -e "$ROLLBACK_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$CURRENT_MAIN_SHA"
          case "$CONFIRM" in
            DEPLOY_URAI_APP)
              test "$RELEASE_SHA" = "$CURRENT_MAIN_SHA"
              test "$ROLLBACK_SHA" != "$RELEASE_SHA"
              git merge-base --is-ancestor "$ROLLBACK_SHA" "$RELEASE_SHA"
              ;;
            ROLLBACK_URAI_APP)
              test "$RELEASE_SHA" = "$ROLLBACK_SHA"
              test "$RELEASE_SHA" != "$CURRENT_MAIN_SHA"
              git merge-base --is-ancestor "$RELEASE_SHA" "$CURRENT_MAIN_SHA"
              ;;
            CHECK_ONLY)
              ;;
            *)
              echo "Unsupported confirmation: $CONFIRM" >&2
              exit 64
              ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production workflow authority
        run: node scripts/audit-production-workflow-authority.mjs
      - name: Validate canonical assets
        run: pnpm --dir urai-tier1 assets:validate
      - name: Materialize asset receipt
        run: pnpm --dir urai-tier1 receipt:assets
      - name: Typecheck Tier1
        run: pnpm --dir urai-tier1 typecheck
      - name: Verify AAA world
        run: pnpm --dir urai-tier1 verify:aaa-world
      - name: Verify XR contracts
        run: pnpm --dir urai-tier1 xr:verify
      - name: Verify live release contract
        env:
          GITHUB_SHA: ${{ env.TARGET_SHA }}
          URAI_TARGET_SHA: ${{ env.TARGET_SHA }}
          FIREBASE_PROJECT_ID: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_EXPECTED_FIREBASE_PROJECT: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_LIVE_BASE_URL: ${{ env.LIVE_URL }}
        run: pnpm live:check
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-exact-head-${{ env.TARGET_SHA }}
          path: |
            docs/ASSET_VERIFICATION_REPORT.md
            docs/final-asset-receipt.md
            deployment-receipt/${{ env.TARGET_SHA }}/
            release/
            release-control-evidence/
            STATUS.md
            EVIDENCE.md
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 90

  deploy:
    name: Deploy or roll back exact SHA on urai.app
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.confirm == 'DEPLOY_URAI_APP' || inputs.confirm == 'ROLLBACK_URAI_APP')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      CURRENT_MAIN_SHA: ${{ github.sha }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      URAI_EXPECTED_FIREBASE_PROJECT: urai-4dc1d
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ inputs.release_sha }}
      URAI_TARGET_SHA: ${{ inputs.release_sha }}
      URAI_LIVE_BASE_URL: https://urai.app
      URAI_DEPLOY_CONFIRM: DEPLOY_STATIC_URAI
      URAI_RELEASE_OPERATION: ${{ inputs.confirm == 'ROLLBACK_URAI_APP' && 'rollback' || 'deploy' }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
    steps:
      - name: Checkout frozen target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate authority and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$FIREBASE_PROJECT_ID" = "$URAI_EXPECTED_FIREBASE_PROJECT"
          test "$GITHUB_WORKFLOW" = 'URAI Canonical Production Release'
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/urai-spatial'
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          if test "$URAI_RELEASE_OPERATION" = 'deploy'; then
            test "$RELEASE_SHA" = "$CURRENT_MAIN_SHA"
            test "$ROLLBACK_SHA" != "$RELEASE_SHA"
            git merge-base --is-ancestor "$ROLLBACK_SHA" "$RELEASE_SHA"
          else
            test "$RELEASE_SHA" = "$ROLLBACK_SHA"
            test "$RELEASE_SHA" != "$CURRENT_MAIN_SHA"
            git merge-base --is-ancestor "$RELEASE_SHA" "$CURRENT_MAIN_SHA"
          fi
          test -n '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'
      - name: Write and validate temporary service account
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GOOGLE_APPLICATION_CREDENTIALS" <<'JSON'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          JSON
          python -m json.tool "$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null
          python - "$GOOGLE_APPLICATION_CREDENTIALS" "$URAI_EXPECTED_FIREBASE_PROJECT" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              service_account = json.load(handle)
          if service_account.get('project_id') != sys.argv[2]:
              raise SystemExit(f"Service-account project mismatch: {service_account.get('project_id')!r}")
          PY
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for live evidence
        run: pnpm exec playwright install --with-deps chromium
      - name: Deploy exact target and run built-in smoke
        run: pnpm live:deploy
      - name: Run canonical live smoke
        env:
          URAI_EXPECTED_DEPLOYED_SHA: ${{ env.RELEASE_SHA }}
        run: node scripts/urai-release-control-smoke.mjs
      - name: Record protected recovery command
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "deployment-receipt/$RELEASE_SHA"
          if test "$URAI_RELEASE_OPERATION" = 'deploy'; then
            RECOVERY_TARGET="$ROLLBACK_SHA"
            RECOVERY_ROLLBACK="$ROLLBACK_SHA"
            RECOVERY_CONFIRM='ROLLBACK_URAI_APP'
          else
            RECOVERY_TARGET="$CURRENT_MAIN_SHA"
            RECOVERY_ROLLBACK="$RELEASE_SHA"
            RECOVERY_CONFIRM='DEPLOY_URAI_APP'
          fi
          cat > "deployment-receipt/$RELEASE_SHA/rollback.txt" <<EOF
          gh workflow run spatial-live-deploy.yml --ref main -f release_sha=$RECOVERY_TARGET -f rollback_sha=$RECOVERY_ROLLBACK -f confirm=$RECOVERY_CONFIRM
          EOF
          cat > "deployment-receipt/$RELEASE_SHA/operation.txt" <<EOF
          operation=$URAI_RELEASE_OPERATION
          deployed_sha=$RELEASE_SHA
          current_main_sha=$CURRENT_MAIN_SHA
          rollback_sha=$ROLLBACK_SHA
          recovery_target=$RECOVERY_TARGET
          recovery_confirmation=$RECOVERY_CONFIRM
          EOF
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-production-${{ env.RELEASE_SHA }}-${{ env.URAI_RELEASE_OPERATION }}
          path: |
            deployment-receipt/${{ env.RELEASE_SHA }}/
            release-control-evidence/
          if-no-files-found: error
          retention-days: 365
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
