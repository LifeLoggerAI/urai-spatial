name: URAI Spatial Release Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/**"
      - "apps/functions/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "src/**"
      - "docs/**"
      - "operations/**"
      - "release/**"
      - "audit/**"
      - "firebase/**"
      - "firebase.json"
      - "firebase.static.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "urai-tier1/**"
      - "apps/functions/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "src/**"
      - "docs/**"
      - "operations/**"
      - "release/**"
      - "audit/**"
      - "firebase/**"
      - "firebase.json"
      - "firebase.static.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urai-spatial-release-verification-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Spatial release gates without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_URAI_SPATIAL_DOMAIN: ${{ vars.NEXT_PUBLIC_URAI_SPATIAL_DOMAIN }}
      NEXT_PUBLIC_URAI_DEBUG_SPATIAL: ${{ vars.NEXT_PUBLIC_URAI_DEBUG_SPATIAL }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      URAI_CORE_BASE_URL: ${{ vars.URAI_CORE_BASE_URL }}
      URAI_STUDIO_BASE_URL: ${{ vars.URAI_STUDIO_BASE_URL }}
      ASSET_FACTORY_BASE_URL: ${{ vars.ASSET_FACTORY_BASE_URL }}
      URAI_JOBS_BASE_URL: ${{ vars.URAI_JOBS_BASE_URL }}

    steps:
      - name: Checkout exact event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "verified_sha=$actual"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare verification evidence
        run: mkdir -p artifacts/release-verification

      - name: Validate single deployment authority
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-deployment-authority.mjs 2>&1 | tee artifacts/release-verification/deployment-authority.log

      - name: Validate fail-closed release receipt
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-release-receipt.mjs 2>&1 | tee artifacts/release-verification/release-receipt.log

      - name: Check versioned asset readiness
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-v1-v6-asset-ready.mjs 2>&1 | tee artifacts/release-verification/asset-readiness.log

      - name: Run authoritative release checks
        shell: bash
        run: |
          set -o pipefail
          pnpm live:check 2>&1 | tee artifacts/release-verification/live-check.log

      - name: Run resilient E2E evidence
        if: always()
        shell: bash
        run: |
          set -o pipefail
          pnpm verify:e2e:resilient 2>&1 | tee artifacts/release-verification/resilient-e2e.log

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-spatial-release-verification-${{ github.sha }}
          path: |
            artifacts/release-verification
            EVIDENCE.md
            STATUS.md
            LIVE_RELEASE.md
            DEPLOYMENT.md
            RUNBOOK.md
            docs
            operations
            release
            audit
            firebase
            urai-tier1/src/data/release-receipt.json
            urai-tier1/src/lib/release-evidence.ts
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 90

      - name: State deployment authority
        run: |
          echo "This workflow performs verification only."
          echo "The sole deployment authority is .github/workflows/urai-spatial-deploy.yml."
