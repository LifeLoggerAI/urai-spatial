name: URAI Canonical Production Release

on:
  pull_request:
    branches:
      - main
    paths:
      - "urai-tier1/**"
      - "apps/functions/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "firebase/**"
      - "firebase.json"
      - "firebase.static.json"
      - "release/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "urai-tier1/**"
      - "apps/functions/**"
      - "packages/**"
      - "scripts/**"
      - "tests/**"
      - "firebase/**"
      - "firebase.json"
      - "firebase.static.json"
      - "release/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Exact 40-character main-branch commit SHA to deploy"
        required: true
        type: string
      rollback_sha:
        description: "Previously proven production SHA reserved for rollback"
        required: true
        type: string
      confirm:
        description: "Type DEPLOY_URAI_APP to publish urai.app"
        required: true
        default: "CHECK_ONLY"
        type: string
      live_url:
        description: "Canonical URL to smoke after deployment"
        required: true
        default: "https://urai.app"
        type: string

permissions:
  contents: read

concurrency:
  group: urai-app-canonical-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.0.0"
  EXPECTED_FIREBASE_PROJECT: "urai-4dc1d"

jobs:
  verify:
    name: Verify exact release head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact checked-out SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$RELEASE_SHA"
          test "$(git status --porcelain)" = ""
          echo "Verified release SHA: $actual_sha"

      - name: Validate dispatch release inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$REQUESTED_RELEASE_SHA" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$RELEASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Run canonical release verification
        env:
          GITHUB_SHA: ${{ env.RELEASE_SHA }}
          URAI_TARGET_SHA: ${{ env.RELEASE_SHA }}
          FIREBASE_PROJECT_ID: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_EXPECTED_FIREBASE_PROJECT: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_LIVE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.live_url || 'https://urai.app' }}
        run: pnpm live:check

      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-release-verification-${{ env.RELEASE_SHA }}
          path: |
            deployment-receipt/${{ env.RELEASE_SHA }}/
            docs/release-evidence/
            release/
            STATUS.md
            EVIDENCE.md
          if-no-files-found: warn
          retention-days: 90

  deploy:
    name: Deploy exact SHA to urai.app
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'DEPLOY_URAI_APP' &&
      inputs.release_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      URAI_EXPECTED_FIREBASE_PROJECT: "urai-4dc1d"
      URAI_LIVE_BASE_URL: ${{ inputs.live_url }}
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ inputs.release_sha }}
      URAI_TARGET_SHA: ${{ inputs.release_sha }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json
    steps:
      - name: Checkout frozen release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate production authority and inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$FIREBASE_PROJECT_ID" = "$URAI_EXPECTED_FIREBASE_PROJECT"
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$RELEASE_SHA"
          test -n '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}'

      - name: Write temporary service-account credentials
        shell: bash
        run: |
          set -euo pipefail
          cat > "$GOOGLE_APPLICATION_CREDENTIALS" <<'JSON'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          JSON
          python -m json.tool "$GOOGLE_APPLICATION_CREDENTIALS" > /dev/null
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Install dependencies reproducibly
        run: pnpm install --frozen-lockfile

      - name: Deploy and smoke exact release
        env:
          GITHUB_SHA: ${{ env.RELEASE_SHA }}
          GITHUB_EVENT_NAME: workflow_dispatch
        run: pnpm live:deploy

      - name: Upload deployment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-production-deployment-${{ env.RELEASE_SHA }}
          path: deployment-receipt/${{ env.RELEASE_SHA }}/
          if-no-files-found: error
          retention-days: 365

      - name: Record production and rollback SHAs
        if: always()
        shell: bash
        run: |
          {
            echo "# URAI production release"
            echo ""
            echo "- Authority: LifeLoggerAI/urai-spatial/urai-tier1"
            echo "- Release SHA: $RELEASE_SHA"
            echo "- Rollback SHA: $ROLLBACK_SHA"
            echo "- Firebase project: $FIREBASE_PROJECT_ID"
            echo "- Live URL: $URAI_LIVE_BASE_URL"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
