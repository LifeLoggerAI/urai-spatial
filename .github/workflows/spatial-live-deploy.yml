name: URAI Canonical Production Release

on:
  pull_request:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/write-release-fingerprint.mjs'
      - 'scripts/urai-release-control-smoke.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'scripts/verify-release-credential-boundary.mjs'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spatial-live-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'urai-tier1/**'
      - 'scripts/live-release.mjs'
      - 'scripts/write-release-fingerprint.mjs'
      - 'scripts/urai-release-control-smoke.mjs'
      - 'scripts/audit-production-workflow-authority.mjs'
      - 'scripts/verify-release-credential-boundary.mjs'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/spatial-live-deploy.yml'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact target SHA; current main for deploy or proven ancestor for rollback
        required: true
        type: string
      rollback_sha:
        description: Distinct recovery SHA; proven prior production for deploy or current main for rollback
        required: true
        type: string
      confirm:
        description: Type DEPLOY_URAI_APP or ROLLBACK_URAI_APP
        required: true
        default: CHECK_ONLY
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'urai-app-production' || format('urai-app-verify-{0}-{1}', github.event.pull_request.number || github.ref, github.event.pull_request.head.sha || github.sha) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.0.0'
  EXPECTED_FIREBASE_PROJECT: urai-4dc1d
  LIVE_URL: https://urai.app

jobs:
  verify:
    name: Exact-head release verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
      CURRENT_MAIN_SHA: ${{ github.sha }}
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact clean target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
      - name: Validate manual release inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "${{ github.ref }}" = 'refs/heads/main'
          git cat-file -e "$RELEASE_SHA^{commit}"
          git cat-file -e "$ROLLBACK_SHA^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" "$CURRENT_MAIN_SHA"
          case "$CONFIRM" in
            DEPLOY_URAI_APP)
              test "$RELEASE_SHA" = "$CURRENT_MAIN_SHA"
              test "$ROLLBACK_SHA" != "$RELEASE_SHA"
              git merge-base --is-ancestor "$ROLLBACK_SHA" "$RELEASE_SHA"
              ;;
            ROLLBACK_URAI_APP)
              # Retired rule: test "$RELEASE_SHA" = "$ROLLBACK_SHA"; recovery now points to current main.
              test "$RELEASE_SHA" != "$CURRENT_MAIN_SHA"
              test "$ROLLBACK_SHA" = "$CURRENT_MAIN_SHA"
              git merge-base --is-ancestor "$RELEASE_SHA" "$CURRENT_MAIN_SHA"
              ;;
            CHECK_ONLY)
              ;;
            *)
              echo "Unsupported confirmation: $CONFIRM" >&2
              exit 64
              ;;
          esac
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production workflow authority
        if: github.event_name != 'workflow_dispatch' || inputs.confirm != 'ROLLBACK_URAI_APP'
        run: node scripts/audit-production-workflow-authority.mjs
      - name: Verify release credential boundary
        run: node scripts/verify-release-credential-boundary.mjs
      - name: Validate canonical assets
        run: pnpm --dir urai-tier1 assets:validate
      - name: Materialize asset receipt
        run: pnpm --dir urai-tier1 receipt:assets
      - name: Typecheck Tier1
        run: pnpm --dir urai-tier1 typecheck
      - name: Verify AAA world
        run: pnpm --dir urai-tier1 verify:aaa-world
      - name: Verify XR contracts
        run: pnpm --dir urai-tier1 xr:verify
      - name: Verify live release contract
        if: github.event_name != 'workflow_dispatch' || inputs.confirm != 'ROLLBACK_URAI_APP'
        env:
          GITHUB_SHA: ${{ env.TARGET_SHA }}
          URAI_TARGET_SHA: ${{ env.TARGET_SHA }}
          FIREBASE_PROJECT_ID: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_EXPECTED_FIREBASE_PROJECT: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_LIVE_BASE_URL: ${{ env.LIVE_URL }}
        run: pnpm live:check
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-exact-head-${{ env.TARGET_SHA }}
          path: |
            docs/ASSET_VERIFICATION_REPORT.md
            docs/final-asset-receipt.md
            deployment-receipt/${{ env.TARGET_SHA }}/
            release/
            release-control-evidence/
            STATUS.md
            EVIDENCE.md
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 90

  rollback-verify:
    name: Prove rollback target with current authority
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.confirm == 'DEPLOY_URAI_APP' || inputs.confirm == 'ROLLBACK_URAI_APP')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROOF_SHA: ${{ inputs.confirm == 'ROLLBACK_URAI_APP' && inputs.release_sha || inputs.rollback_sha }}
      CURRENT_MAIN_SHA: ${{ github.sha }}
    steps:
      - name: Checkout current release authority
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CURRENT_MAIN_SHA }}
          path: authority
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout rollback target
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PROOF_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Prove authority and rollback identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C authority rev-parse HEAD)" = "$CURRENT_MAIN_SHA"
          test "$(git -C target rev-parse HEAD)" = "$PROOF_SHA"
          test -z "$(git -C authority status --porcelain)"
          test -z "$(git -C target status --porcelain)"
          git -C authority merge-base --is-ancestor "$PROOF_SHA" "$CURRENT_MAIN_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install rollback target dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile
      - name: Audit current production authority
        working-directory: authority
        run: node scripts/audit-production-workflow-authority.mjs
      - name: Verify current credential boundary
        working-directory: authority
        run: node scripts/verify-release-credential-boundary.mjs
      - name: Validate rollback target assets
        working-directory: target
        run: pnpm --dir urai-tier1 assets:validate
      - name: Materialize rollback asset receipt
        working-directory: target
        run: pnpm --dir urai-tier1 receipt:assets
      - name: Typecheck rollback target
        working-directory: target
        run: pnpm --dir urai-tier1 typecheck
      - name: Verify rollback AAA world
        working-directory: target
        run: pnpm --dir urai-tier1 verify:aaa-world
      - name: Verify rollback XR contracts
        working-directory: target
        run: pnpm --dir urai-tier1 xr:verify
      - name: Verify rollback target with current release executable
        working-directory: target
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.PROOF_SHA }}
          URAI_TARGET_SHA: ${{ env.PROOF_SHA }}
          FIREBASE_PROJECT_ID: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_EXPECTED_FIREBASE_PROJECT: ${{ env.EXPECTED_FIREBASE_PROJECT }}
          URAI_LIVE_BASE_URL: ${{ env.LIVE_URL }}
        run: node ../authority/scripts/live-release.mjs
      - name: Build rollback static output
        working-directory: target
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.PROOF_SHA }}
        run: pnpm build:static
      - name: Verify rollback output embeds exact SHA
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          test -f urai-tier1/out/index.html
          grep -R --fixed-strings "$PROOF_SHA" urai-tier1/out --include='*.html' -l | grep -q .
      - name: Upload rollback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-rollback-proof-${{ env.PROOF_SHA }}
          path: |
            target/docs/ASSET_VERIFICATION_REPORT.md
            target/docs/final-asset-receipt.md
            target/deployment-receipt/${{ env.PROOF_SHA }}/
            target/release-control-evidence/
          if-no-files-found: error
          retention-days: 365

  deploy:
    name: Deploy or roll back exact SHA on urai.app
    needs: [verify, rollback-verify]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      (inputs.confirm == 'DEPLOY_URAI_APP' || inputs.confirm == 'ROLLBACK_URAI_APP')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      CURRENT_MAIN_SHA: ${{ github.sha }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      URAI_EXPECTED_FIREBASE_PROJECT: urai-4dc1d
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ inputs.release_sha }}
      URAI_TARGET_SHA: ${{ inputs.release_sha }}
      URAI_LIVE_BASE_URL: https://urai.app
      URAI_DEPLOY_CONFIRM: DEPLOY_STATIC_URAI
      URAI_RELEASE_OPERATION: ${{ inputs.confirm == 'ROLLBACK_URAI_APP' && 'rollback' || 'deploy' }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/urai-firebase-service-account.json
    steps:
      - name: Checkout current release authority
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CURRENT_MAIN_SHA }}
          path: authority
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout frozen target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Validate authority and target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C authority rev-parse HEAD)" = "$CURRENT_MAIN_SHA"
          test "$(git -C target rev-parse HEAD)" = "$RELEASE_SHA"
          test "$FIREBASE_PROJECT_ID" = "$URAI_EXPECTED_FIREBASE_PROJECT"
          test "$GITHUB_WORKFLOW" = 'URAI Canonical Production Release'
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/urai-spatial'
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$ROLLBACK_SHA" =~ ^[0-9a-f]{40}$ ]]
          if test "$URAI_RELEASE_OPERATION" = 'deploy'; then
            test "$RELEASE_SHA" = "$CURRENT_MAIN_SHA"
            test "$ROLLBACK_SHA" != "$RELEASE_SHA"
            git -C authority merge-base --is-ancestor "$ROLLBACK_SHA" "$RELEASE_SHA"
          else
            test "$RELEASE_SHA" != "$CURRENT_MAIN_SHA"
            test "$ROLLBACK_SHA" = "$CURRENT_MAIN_SHA"
            git -C authority merge-base --is-ancestor "$RELEASE_SHA" "$CURRENT_MAIN_SHA"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
      - name: Install frozen target dependencies without production credentials
        working-directory: target
        run: pnpm install --frozen-lockfile
      - name: Install Chromium without production credentials
        working-directory: target
        run: pnpm exec playwright install --with-deps chromium
      - name: Revalidate current credential boundary
        working-directory: authority
        run: node scripts/verify-release-credential-boundary.mjs
      - name: Deploy exact target with current authority and ephemeral credentials
        working-directory: target
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" >/dev/null
          node ../authority/scripts/live-release.mjs --deploy
      - name: Run canonical live smoke with current authority
        working-directory: target
        env:
          URAI_EXPECTED_DEPLOYED_SHA: ${{ env.RELEASE_SHA }}
          URAI_EXPECTED_ROLLBACK_SHA: ${{ env.ROLLBACK_SHA }}
        run: node ../authority/scripts/urai-release-control-smoke.mjs
      - name: Record protected recovery command
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "deployment-receipt/$RELEASE_SHA"
          if test "$URAI_RELEASE_OPERATION" = 'deploy'; then
            RECOVERY_TARGET="$ROLLBACK_SHA"
            RECOVERY_ROLLBACK="$CURRENT_MAIN_SHA"
            RECOVERY_CONFIRM='ROLLBACK_URAI_APP'
          else
            RECOVERY_TARGET="$CURRENT_MAIN_SHA"
            RECOVERY_ROLLBACK="$RELEASE_SHA"
            RECOVERY_CONFIRM='DEPLOY_URAI_APP'
          fi
          cat > "deployment-receipt/$RELEASE_SHA/rollback.txt" <<EOF_RECOVERY
          gh workflow run spatial-live-deploy.yml --ref main -f release_sha=$RECOVERY_TARGET -f rollback_sha=$RECOVERY_ROLLBACK -f confirm=$RECOVERY_CONFIRM
          EOF_RECOVERY
          cat > "deployment-receipt/$RELEASE_SHA/operation.txt" <<EOF_OPERATION
          operation=$URAI_RELEASE_OPERATION
          deployed_sha=$RELEASE_SHA
          current_main_sha=$CURRENT_MAIN_SHA
          rollback_sha=$ROLLBACK_SHA
          recovery_target=$RECOVERY_TARGET
          recovery_confirmation=$RECOVERY_CONFIRM
          EOF_OPERATION
      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-production-${{ env.RELEASE_SHA }}-${{ env.URAI_RELEASE_OPERATION }}
          path: |
            target/deployment-receipt/${{ env.RELEASE_SHA }}/
            target/release-control-evidence/
          if-no-files-found: error
          retention-days: 365
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
