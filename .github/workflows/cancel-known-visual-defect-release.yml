name: Cancel known visual-defect release

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cancel-known-visual-defect-release.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUN_ID: '29461374412'
      EXPECTED_SHA: '3a7aaf7bf47bd4ccf713584390201fd13317065e'
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify exact run and cancel before deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipt
          api="https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID"
          auth=(--header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body --silent --show-error "${auth[@]}" "$api" > receipt/before.json
          node - <<'NODE'
          const fs = require('node:fs')
          const run = JSON.parse(fs.readFileSync('receipt/before.json', 'utf8'))
          if (String(run.id) !== process.env.RUN_ID) throw new Error('run id drift')
          if (run.head_sha !== process.env.EXPECTED_SHA) throw new Error(`head drift: ${run.head_sha}`)
          if (run.name !== 'URAI Canonical Production Release') throw new Error(`workflow drift: ${run.name}`)
          if (run.event !== 'workflow_dispatch') throw new Error(`event drift: ${run.event}`)
          if (run.status === 'completed' && run.conclusion === 'success') throw new Error('release already completed successfully; cancellation is too late')
          NODE
          status="$(node -p "JSON.parse(require('fs').readFileSync('receipt/before.json')).status")"
          if [[ "$status" != "completed" ]]; then
            curl --fail-with-body --silent --show-error --request POST "${auth[@]}" "$api/cancel" -o receipt/cancel-response.txt
          fi
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error "${auth[@]}" "$api" > receipt/after.json
            final_status="$(node -p "JSON.parse(require('fs').readFileSync('receipt/after.json')).status")"
            if [[ "$final_status" == "completed" ]]; then break; fi
            sleep 5
          done
          node - <<'NODE'
          const fs = require('node:fs')
          const before = JSON.parse(fs.readFileSync('receipt/before.json', 'utf8'))
          const after = JSON.parse(fs.readFileSync('receipt/after.json', 'utf8'))
          const receipt = {
            schemaVersion: 'urai-protected-release-cancellation-1',
            runId: after.id,
            headSha: after.head_sha,
            beforeStatus: before.status,
            beforeConclusion: before.conclusion,
            afterStatus: after.status,
            afterConclusion: after.conclusion,
            deploymentMutation: false,
            sourceMutation: false,
          }
          fs.writeFileSync('receipt/result.json', JSON.stringify(receipt, null, 2) + '\n')
          if (after.status !== 'completed') throw new Error(`run did not become terminal: ${after.status}`)
          if (!['cancelled', 'failure'].includes(after.conclusion)) throw new Error(`unsafe terminal conclusion: ${after.conclusion}`)
          NODE
      - name: Upload cancellation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-release-cancellation-${{ env.RUN_ID }}
          path: receipt
          if-no-files-found: error
          retention-days: 30
