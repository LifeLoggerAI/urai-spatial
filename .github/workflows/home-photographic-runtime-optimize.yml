name: Home Photographic Runtime Optimize

on:
  push:
    branches:
      - home-final-relic-machine-realism-20260826
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-photo-runtime-optimize
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Optimize or verify governed photographic maps
        shell: bash
        run: |
          set -euo pipefail
          root='urai-tier1/public/assets/urai/home-production/cc0/rock-tile-floor'
          if [[ -s "$root/rock-tile-floor-diff-1k.png" && -s "$root/rock-tile-floor-normal-gl-1k.png" && -s "$root/rock-tile-floor-arm-1k.png" ]]; then
            if ! command -v cwebp >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq webp
            fi
            cwebp -quiet -mt -q 92 -m 6 "$root/rock-tile-floor-diff-1k.png" -o "$root/rock-tile-floor-diff-1k.webp"
            cwebp -quiet -mt -q 94 -m 6 -sharp_yuv "$root/rock-tile-floor-normal-gl-1k.png" -o "$root/rock-tile-floor-normal-gl-1k.webp"
            cwebp -quiet -mt -q 96 -m 6 -sharp_yuv "$root/rock-tile-floor-arm-1k.png" -o "$root/rock-tile-floor-arm-1k.webp"
            python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          limit = 2_097_152
          root = Path('urai-tier1/public/assets/urai/home-production/cc0/rock-tile-floor')
          outputs = {
              'diffuse': root / 'rock-tile-floor-diff-1k.webp',
              'normalGL': root / 'rock-tile-floor-normal-gl-1k.webp',
              'arm': root / 'rock-tile-floor-arm-1k.webp',
          }
          for role, path in outputs.items():
              data = path.read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', (role, path)
              assert len(data) < limit, (role, len(data), limit)

          sacred = Path('urai-tier1/src/spatial/layout/HomeWorldProductionSacred.tsx')
          source = sacred.read_text()
          replacements = {
              'rock-tile-floor-diff-1k.png': 'rock-tile-floor-diff-1k.webp',
              'rock-tile-floor-normal-gl-1k.png': 'rock-tile-floor-normal-gl-1k.webp',
              'rock-tile-floor-arm-1k.png': 'rock-tile-floor-arm-1k.webp',
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          source = source.replace('cinematic-pbr-v16-photographic-cc0-sanctuary', 'cinematic-pbr-v17-photographic-runtime-sanctuary')
          source = source.replace('polyhaven-rock-tile-floor-pbr-v1', 'polyhaven-rock-tile-floor-pbr-v2-optimized')
          sacred.write_text(source)

          test_path = Path('urai-tier1/tests/home-relic-machine-realism-contract.test.mjs')
          test_source = test_path.read_text()
          for old, new in replacements.items():
              test_source = test_source.replace(old.replace('.', r'\.'), new.replace('.', r'\.'))
              test_source = test_source.replace(old, new)
          test_source = test_source.replace('cinematic-pbr-v16-photographic-cc0-sanctuary', 'cinematic-pbr-v17-photographic-runtime-sanctuary')
          if 'source PNG runtime variants stay retired' not in test_source:
              test_source = test_source.replace("assert.doesNotMatch(source, /<Lightformer/)", "assert.doesNotMatch(source, /<Lightformer/)\n  assert.doesNotMatch(source, /rock-tile-floor-(?:diff|normal-gl|arm)-1k\\.png/, 'source PNG runtime variants stay retired')")
          test_path.write_text(test_source)

          receipt_path = Path('operations/assets/third-party/home-photographic-pbr-v1.json')
          receipt = json.loads(receipt_path.read_text())
          receipt['runtimeOptimization'] = {
              'format': 'WebP',
              'singleTextureBudgetBytes': limit,
              'quality': {'diffuse': 92, 'normalGL': 94, 'arm': 96},
              'runtimeFiles': {
                  role: {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest(), 'bytes': path.stat().st_size}
                  for role, path in outputs.items()
              },
              'sourcePngsRetained': False,
              'reason': 'Preserve photographic PBR fidelity while satisfying the governed single-texture production budget.'
          }
          receipt['promotionState'] = 'vendored-production-optimized-pending-exact-head-visual-approval'
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          for path in [root / 'rock-tile-floor-diff-1k.png', root / 'rock-tile-floor-normal-gl-1k.png', root / 'rock-tile-floor-arm-1k.png']:
              path.unlink(missing_ok=True)
          PY
          else
            python3 - <<'PY'
          from pathlib import Path
          limit = 2_097_152
          root = Path('urai-tier1/public/assets/urai/home-production/cc0/rock-tile-floor')
          for name in ['rock-tile-floor-diff-1k.webp','rock-tile-floor-normal-gl-1k.webp','rock-tile-floor-arm-1k.webp']:
              path = root / name
              data = path.read_bytes()
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', name
              assert len(data) < limit, (name, len(data), limit)
          sacred = Path('urai-tier1/src/spatial/layout/HomeWorldProductionSacred.tsx').read_text()
          assert 'rock-tile-floor-diff-1k.webp' in sacred
          assert 'rock-tile-floor-normal-gl-1k.webp' in sacred
          assert 'rock-tile-floor-arm-1k.webp' in sacred
          assert 'rock-tile-floor-diff-1k.png' not in sacred
          print('Photographic runtime maps already optimized; verified exact head.')
          PY
          fi

      - name: Prove runtime texture budget
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-spatial-performance-budget.mjs

      - name: Commit optimized runtime assets if head is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo 'No runtime optimization changes.'
            exit 0
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-relic-machine-realism-20260826" --jq .object.sha)"
          if [ "$current" != "${GITHUB_SHA}" ]; then
            echo "Branch moved to $current; refusing stale optimization from ${GITHUB_SHA}."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A urai-tier1/public/assets/urai/home-production/cc0/rock-tile-floor urai-tier1/src/spatial/layout/HomeWorldProductionSacred.tsx urai-tier1/tests/home-relic-machine-realism-contract.test.mjs operations/assets/third-party/home-photographic-pbr-v1.json
          git commit -m 'Optimize Home photographic PBR runtime assets'
          gh auth setup-git
          git push origin HEAD:home-final-relic-machine-realism-20260826
