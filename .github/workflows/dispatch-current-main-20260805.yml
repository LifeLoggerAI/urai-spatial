name: Dispatch Verified Current Main 2026-08-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-current-main-20260805.yml'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: urai-current-main-one-time-dispatch-20260805
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Dispatch protected URAI production release and retain receipt
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'spatial-live-deploy.yml';
            const releaseSha = context.sha;
            const fallbackRollbackSha = 'e2850a8b9dbd2fd11ee0197505da278322916aa0';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function liveFingerprint() {
              try {
                const response = await fetch(`https://urai.app/release-fingerprint.json?one_time=${Date.now()}`, {
                  redirect: 'manual',
                  signal: AbortSignal.timeout(12000),
                  headers: { accept: 'application/json', 'cache-control': 'no-cache, no-store' }
                });
                if (response.status !== 200) return null;
                const body = await response.json();
                if (body?.schemaVersion !== 'urai-release-fingerprint-1') return null;
                if (!/^[0-9a-f]{40}$/i.test(String(body.releaseSha || ''))) return null;
                return body;
              } catch {
                return null;
              }
            }

            async function listRuns() {
              return github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                branch: 'main',
                event: 'workflow_dispatch',
                per_page: 100
              });
            }

            async function dispatch(confirm, rollbackSha, excluded) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id,
                ref: 'main',
                inputs: {
                  release_sha: releaseSha,
                  rollback_sha: rollbackSha,
                  confirm
                }
              });

              let run = null;
              for (let attempt = 0; attempt < 60; attempt += 1) {
                const response = await listRuns();
                run = response.data.workflow_runs.find((candidate) =>
                  candidate.head_sha === releaseSha && !excluded.has(candidate.id)
                ) || null;
                if (run) break;
                await sleep(10000);
              }
              if (!run) throw new Error(`No ${confirm} run appeared for ${releaseSha}`);

              for (let attempt = 0; attempt < 300 && run.status !== 'completed'; attempt += 1) {
                await sleep(10000);
                run = (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id })).data;
              }
              if (run.status !== 'completed') throw new Error(`Protected run ${run.id} did not complete`);

              const jobs = (await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100
              })).data.jobs;

              return { run, jobs };
            }

            function section(title, result, rollbackSha) {
              return [
                `## ${title}`,
                '',
                `- Release SHA: \`${releaseSha}\``,
                `- Rollback SHA: \`${rollbackSha}\``,
                `- Run: ${result.run.html_url}`,
                `- Status: \`${result.run.status}\``,
                `- Conclusion: \`${result.run.conclusion || 'none'}\``,
                '',
                '### Jobs',
                ...result.jobs.map((job) => `- ${job.name}: ${job.status}/${job.conclusion || 'none'}`)
              ].join('\n');
            }

            const existing = await listRuns();
            const excluded = new Set(existing.data.workflow_runs
              .filter((run) => run.head_sha === releaseSha)
              .map((run) => run.id));

            const fingerprint = await liveFingerprint();
            let rollbackSha = fingerprint?.releaseSha || fallbackRollbackSha;
            const sections = [];

            if (!fingerprint) {
              const bootstrap = await dispatch('BOOTSTRAP_LEGACY_URAI_APP', rollbackSha, excluded);
              excluded.add(bootstrap.run.id);
              sections.push(section('Legacy bootstrap', bootstrap, rollbackSha));
              if (bootstrap.run.conclusion !== 'success') {
                const body = sections.join('\n\n');
                await github.rest.issues.create({ owner, repo, title: `Production bootstrap ${releaseSha.slice(0, 12)} — ${bootstrap.run.conclusion}`, body });
                core.summary.addRaw(body).write();
                core.setFailed(`Bootstrap concluded ${bootstrap.run.conclusion}`);
                return;
              }
              const refreshed = await liveFingerprint();
              if (refreshed?.releaseSha) rollbackSha = refreshed.releaseSha;
            }

            if (rollbackSha === releaseSha) {
              const body = [
                '## Deployment skipped',
                '',
                `The current main SHA \`${releaseSha}\` is already the live fingerprint.`,
                'No duplicate deployment was created.'
              ].join('\n');
              await github.rest.issues.create({ owner, repo, title: `Production already current ${releaseSha.slice(0, 12)}`, body });
              core.summary.addRaw(body).write();
              return;
            }

            const deployment = await dispatch('DEPLOY_URAI_APP', rollbackSha, excluded);
            sections.push(section('Protected production deployment', deployment, rollbackSha));
            const body = sections.join('\n\n');
            await github.rest.issues.create({ owner, repo, title: `Production deployment ${releaseSha.slice(0, 12)} — ${deployment.run.conclusion}`, body });
            core.summary.addRaw(body).write();
            if (deployment.run.conclusion !== 'success') core.setFailed(`Deployment concluded ${deployment.run.conclusion}`);
