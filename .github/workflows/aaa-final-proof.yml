name: URAI AAA Final Proof

on:
  workflow_call:
    inputs:
      target_sha:
        description: Exact source SHA to verify
        required: true
        type: string
      base_url:
        description: Base URL to smoke after build
        required: false
        type: string
        default: http://127.0.0.1:4173
      screenshots:
        description: Capture Playwright screenshots
        required: false
        type: string
        default: "true"
  workflow_dispatch:
    inputs:
      base_url:
        description: Live base URL to smoke after build
        required: false
        default: https://urai.app
      screenshots:
        description: Capture Playwright screenshots
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/aaa-final-proof.yml"
      - "scripts/aaa-launch-proof.mjs"
      - "scripts/check-workflow-phase-boundaries.mjs"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: urai-aaa-final-proof-${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  final-proof:
    name: Build, asset, route, and screenshot proof
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      FORCE_COLOR: "0"
      URAI_PROOF_SOURCE_SHA: ${{ env.TARGET_SHA }}
      URAI_RECEIPT_ROOT: ${{ github.workspace }}/urai-final-receipts
      URAI_BASE_URL: ${{ inputs.base_url || 'http://127.0.0.1:4173' }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git write-tree)" = "$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate provider-aware asset receipt
        run: node scripts/final-asset-receipt.mjs

      - name: Verify assets
        run: pnpm verify:assets

      - name: Typecheck
        run: pnpm typecheck

      - name: Static build
        run: pnpm build:static

      - name: Serve built main for proof
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python3 -m http.server 4173 --directory urai-tier1/out > /tmp/urai-static-server.log 2>&1 &
          sleep 3
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

      - name: Install Chromium for screenshots
        if: ${{ inputs.screenshots != 'false' }}
        run: pnpm exec playwright install chromium --with-deps

      - name: Prepare exact clean proof source
        shell: bash
        run: |
          set -euo pipefail
          PROOF_SOURCE="$GITHUB_WORKSPACE/.urai-proof-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$PROOF_SOURCE"
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$PROOF_SOURCE"
          git -C "$PROOF_SOURCE" checkout --detach "$TARGET_SHA"
          test "$(git -C "$PROOF_SOURCE" rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git -C "$PROOF_SOURCE" status --porcelain --untracked-files=all)"
          echo "URAI_PROOF_SOURCE_ROOT=$PROOF_SOURCE" >> "$GITHUB_ENV"

      - name: Final launch proof receipt
        run: |
          cd "$URAI_PROOF_SOURCE_ROOT"
          FLAGS="--skip-install --skip-typecheck --skip-assets --skip-test --skip-build --base=${URAI_BASE_URL}"
          if [ "${{ inputs.screenshots }}" != "false" ]; then
            FLAGS="$FLAGS --screenshots"
          fi
          node scripts/aaa-launch-proof.mjs $FLAGS

      - name: Print final receipt summary
        if: always()
        run: |
          find "$URAI_RECEIPT_ROOT" -name final-report.md -print -exec sed -n '1,220p' {} \; || true

      - name: Upload proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-aaa-final-proof-${{ env.TARGET_SHA }}
          path: urai-final-receipts
          if-no-files-found: warn
