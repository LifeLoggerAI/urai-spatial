name: URAI AAA Final Proof
on:
  workflow_call:
    inputs:
      target_sha: {required: true, type: string}
      base_url: {required: false, type: string, default: http://127.0.0.1:4173}
      screenshots: {required: false, type: string, default: "true"}
  workflow_dispatch:
  push: {branches: [main]}
permissions: {contents: read}
concurrency:
  group: urai-aaa-final-proof-${{ inputs.target_sha || github.sha }}
  cancel-in-progress: true
env:
  TARGET_SHA: ${{ inputs.target_sha || github.sha }}
jobs:
  final-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env