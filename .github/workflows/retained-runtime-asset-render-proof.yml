name: Retained Runtime Asset Render Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'urai-tier1/src/spatial/layout/HomeSanctuaryGeometry.ts'
      - 'urai-tier1/src/spatial/council/CouncilRealm.tsx'
      - 'urai-tier1/src/spatial/council/CouncilAnimationLayers.ts'
      - 'scripts/test-runtime-asset-bindings.mjs'
      - 'scripts/capture-council-animation-layer-proof.mjs'
      - '.github/workflows/retained-runtime-asset-render-proof.yml'

permissions:
  contents: read

concurrency:
  group: retained-runtime-asset-render-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retained-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - name: Checkout exact isolated runtime donor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify unchanged model and receipt authorities before build
        run: |
          node --test scripts/production-asset-receipt-bindings.test.mjs
          node scripts/verify-production-asset-receipt-bindings.mjs --report artifacts/retained-runtime-asset-render-proof/receipt-bindings.json
          node scripts/author-final-glb-pack.mjs
          node scripts/verify-final-glb-pack.mjs
          URAI_ASSET_PROMOTION_DECISION=operations/assets/promotion-decisions/home-entry-chamber-v1.json node scripts/verify-governed-asset-promotion.mjs
          cd urai-tier1
          node --test tests/home-entry-governed-production-contract.test.mjs tests/home-finalization-truth-contract.test.mjs
      - name: Verify actual geometry and mixer behavior, then build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node --test scripts/test-runtime-asset-bindings.mjs
          pnpm build:static
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Capture actual Home and Council renderers
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/retained-runtime-asset-render-proof
          mkdir -p "$output"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > "$output/http-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/home/ >/dev/null && break
            sleep 1
          done
          URAI_PROOF_BASE=http://127.0.0.1:4173 URAI_PROOF_DIR="$output/home" node scripts/run-with-ci-webgl.mjs scripts/capture-restored-home-source-proof.mjs
          URAI_PROOF_BASE=http://127.0.0.1:4173 URAI_PROOF_DIR="$output/council" node scripts/run-with-ci-webgl.mjs scripts/capture-council-animation-layer-proof.mjs
          node scripts/verify-production-asset-receipt-bindings.mjs --report "$output/after-build-bindings.json"
      - name: Retain source-bound screenshots and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-runtime-asset-render-proof-${{ env.CANDIDATE_SHA }}
          path: artifacts/retained-runtime-asset-render-proof/
          if-no-files-found: error
          retention-days: 90
