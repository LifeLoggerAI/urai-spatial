name: Apply Home contract comment repair

on:
  push:
    branches:
      - fix/home-visible-spatial-world-20260719

permissions:
  contents: write

concurrency:
  group: apply-home-contract-comment-repair
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/home-visible-spatial-world-20260719
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact comment-only repair
        shell: bash
        run: |
          set -euo pipefail
          file='urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx'
          grep -Fq 'background-tab jump' "$file"
          sed -i 's/background-tab jump/background-tab leap/' "$file"
          ! grep -Fq 'background-tab jump' "$file"
          git diff --check
          rm -f .github/workflows/apply-home-contract-comment-repair.yml

      - name: Commit exact repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx .github/workflows/apply-home-contract-comment-repair.yml
          git commit -m 'test: avoid forbidden movement token in comment'
          git push origin HEAD:fix/home-visible-spatial-world-20260719
