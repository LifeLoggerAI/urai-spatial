name: TEMP Regenerate Canon Critical GLBs

on:
  push:
    branches:
      - converge/final-canon-spatial-20260922
    paths:
      - 'scripts/author-urai-aaa-assets.py'
      - '.github/workflows/temp-regenerate-canon-critical-glbs.yml'

permissions:
  contents: write

concurrency:
  group: temp-canon-critical-glb-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: converge/final-canon-spatial-20260922
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic authoring dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy pillow scikit-image scipy

      - name: Regenerate only canon-critical GLBs and receipts
        env:
          URAI_CANON_CRITICAL_ONLY: '1'
        run: |
          python scripts/author-urai-aaa-assets.py

      - name: Verify final GLB structural contracts
        run: node scripts/verify-final-glb-pack.mjs

      - name: Verify launch-critical receipt/hash contracts
        run: node scripts/verify-launch-critical-assets.mjs

      - name: Refuse theater portal ring or crystal authority in regenerated assets
        run: |
          python - <<'PY'
          import json, struct
          from pathlib import Path

          names = [
              'life-map-memory-star-v1.glb',
              'focus-memory-chamber-v1.glb',
              'replay-memory-environment-v1.glb',
              'urai-orb-avatar-v1.glb',
          ]
          forbidden = (
              'memory-star-orbit',
              'memory-star-shard',
              'focus-tunnel-ring',
              'focus-memory-rune',
              'replay-film-portal',
              'replay-film-veil',
              'replay-memory-panel',
              'replay-screen',
              'replay-theater-floor',
              'orb-orbit-',
              'orb-equatorial-ring',
              'orb-polar-ring',
          )
          base = Path('urai-tier1/public/assets/urai/generated/models')
          for name in names:
              payload = (base / name).read_bytes()
              json_len = struct.unpack_from('<I', payload, 12)[0]
              doc = json.loads(payload[20:20+json_len])
              node_names = [node.get('name','') for node in doc.get('nodes',[])]
              bad = [node for node in node_names if any(token in node for token in forbidden)]
              if bad:
                  raise SystemExit(f'{name}: forbidden canon nodes: {bad}')
              print(name, 'canon nodes OK', len(node_names))
          PY

      - name: Commit exact generated candidates to convergence branch
        run: |
          git config user.name "urai-canon-asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add             urai-tier1/public/assets/urai/generated/models/life-map-memory-star-v1.glb             urai-tier1/public/assets/urai/generated/models/focus-memory-chamber-v1.glb             urai-tier1/public/assets/urai/generated/models/replay-memory-environment-v1.glb             urai-tier1/public/assets/urai/generated/models/urai-orb-avatar-v1.glb             operations/assets/generated-receipts/urai-final-glb-pack-v1.json             operations/assets/generated-receipts/life-map-memory-star-v1.json             operations/assets/generated-receipts/focus-memory-chamber-v1.json             operations/assets/generated-receipts/replay-memory-environment-v1.json             operations/assets/generated-receipts/urai-orb-avatar-v1.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "assets: commit canon-clean critical GLB candidates"
          git push origin HEAD:converge/final-canon-spatial-20260922
