name: Provider and Scenario Canonical Consent Proof

on:
  pull_request:
    paths:
      - 'apps/functions/src/**'
      - 'apps/functions/test/provider-scenario-canonical-consent.test.js'
      - 'apps/functions/test/scenarioCouncilBundle.test.js'
      - 'urai-tier1/tests/elevenlabs-output-authority.test.mjs'
      - 'urai-tier1/tests/spatial-audio-behavior.test.mjs'
      - 'urai-tier1/src/spatial/audio/**'
      - 'apps/functions/package.json'
      - 'apps/functions/tsconfig.json'
      - 'urai-tier1/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/provider-scenario-consent-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-scenario-consent-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXACT_SHA }}
          persist-credentials: false
      - name: Bind exact clean source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/provider-scenario-consent"
          git rev-parse HEAD > "$RUNNER_TEMP/provider-scenario-consent/head.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/provider-scenario-consent/tree.txt"
          sha256sum apps/functions/src/providerFunctions.ts apps/functions/src/scenarioOperations.ts apps/functions/src/consentPolicyAuthority.ts apps/functions/test/provider-scenario-canonical-consent.test.js apps/functions/test/scenarioCouncilBundle.test.js urai-tier1/tests/elevenlabs-output-authority.test.mjs urai-tier1/tests/spatial-audio-behavior.test.mjs urai-tier1/scripts/run-unit-contract-tests*.mjs .github/workflows/provider-scenario-consent-proof.yml > "$RUNNER_TEMP/provider-scenario-consent/source-sha256.txt"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact frozen graph
        run: pnpm install --frozen-lockfile
      - name: Compile actual Functions strictly
        run: |
          set -euo pipefail
          pnpm --filter urai-functions build 2>&1 | tee "$RUNNER_TEMP/provider-scenario-consent/build.log"
      - name: Execute canonical admission and retained Scenario cases
        working-directory: apps/functions
        run: |
          set -euo pipefail
          pnpm exec node --test --test-concurrency=1 test/provider-scenario-canonical-consent.test.js test/scenarioCouncilBundle.test.js 2>&1 | tee "$RUNNER_TEMP/provider-scenario-consent/functions.tap"
      - name: Execute bounded voice and source audio behavior
        working-directory: urai-tier1
        run: |
          set -euo pipefail
          pnpm exec node --test --test-concurrency=1 tests/elevenlabs-output-authority.test.mjs tests/spatial-audio-behavior.test.mjs 2>&1 | tee "$RUNNER_TEMP/provider-scenario-consent/media.tap"
      - name: Verify immutable source after execution
        run: sha256sum -c "$RUNNER_TEMP/provider-scenario-consent/source-sha256.txt"
      - name: Preserve actual scope and versions
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/provider-scenario-consent"
          node --version > "$RUNNER_TEMP/provider-scenario-consent/node-version.txt"
          pnpm --version > "$RUNNER_TEMP/provider-scenario-consent/pnpm-version.txt"
          printf '%s\n' 'Actual modules with controlled synthetic SDK/Auth/DAO/transaction/provider/media terminals. No live credentials, provider request, spending, Firestore transaction, loaded Functions, device sound, deployment or release acceptance.' > "$RUNNER_TEMP/provider-scenario-consent/scope.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: provider-scenario-consent-${{ env.EXACT_SHA }}
          path: ${{ runner.temp }}/provider-scenario-consent
          if-no-files-found: error
