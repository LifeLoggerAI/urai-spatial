name: Actual Captured Reality Hybrid WebGL Browser Proof (Non-release)
on:
  pull_request:
    paths:
      - '.github/workflows/captured-reality-hybrid-browser-proof.yml'
      - 'scripts/prove-captured-reality-hybrid-browser.mjs'
      - 'urai-tier1/src/spatial/captured-reality/**'
      - 'urai-tier1/src/app/spatial/captured-reality/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: captured-reality-hybrid-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-component-hybrid:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - name: Assert exact source
        run: test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies and software-rendered browser
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Execute REAL production components with synthetic authorized fixture
        run: node scripts/prove-captured-reality-hybrid-browser.mjs
      - name: Preserve exact-head two-layer screenshot and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: captured-reality-hybrid-browser-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/captured-reality-hybrid-browser/
          if-no-files-found: error
          retention-days: 90
