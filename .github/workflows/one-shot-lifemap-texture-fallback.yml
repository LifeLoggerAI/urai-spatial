name: One-shot Life Map texture fallback repair

on:
  push:
    branches:
      - integrate/final-world-main-88287-20260718
    paths:
      - .github/workflows/one-shot-lifemap-texture-fallback.yml

permissions:
  contents: write

concurrency:
  group: one-shot-lifemap-texture-fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@v4
        with:
          ref: integrate/final-world-main-88287-20260718
          fetch-depth: 0

      - name: Prove bounded repair authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "integrate/final-world-main-88287-20260718"
          test "$(git rev-parse HEAD^)" = "b82caf92640053a5d5391b3a744105737c924df1"
          test -f scripts/one-shot-lifemap-texture-fallback.mjs
          test -f .github/workflows/one-shot-lifemap-texture-fallback.yml
          git diff --quiet

      - name: Apply dark texture fallback and regression contract
        run: node scripts/one-shot-lifemap-texture-fallback.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Run texture fallback contract
        run: node --test urai-tier1/tests/lifemap-texture-fallback-contract.test.mjs

      - name: Typecheck and build exact candidate
        run: |
          pnpm --dir urai-tier1 typecheck
          pnpm --dir urai-tier1 build

      - name: Publish one clean product repair commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LifeLoggerAI"
          git config user.email "LifeLoggerAI@users.noreply.github.com"
          git add \
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx \
            urai-tier1/tests/lifemap-texture-fallback-contract.test.mjs \
            .github/workflows/one-shot-lifemap-texture-fallback.yml \
            scripts/one-shot-lifemap-texture-fallback.mjs
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/one-shot-lifemap-texture-fallback.yml' \
            'scripts/one-shot-lifemap-texture-fallback.mjs' \
            'urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx' \
            'urai-tier1/tests/lifemap-texture-fallback-contract.test.mjs' | sort)"
          test "$actual" = "$expected"
          git commit -m "fix(life-map): prevent untextured mobile memory planes"
          git push origin HEAD:integrate/final-world-main-88287-20260718
