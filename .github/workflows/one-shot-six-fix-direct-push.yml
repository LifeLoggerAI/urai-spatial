name: One-shot six-fix direct push repair

on:
  push:
    branches:
      - fix/canonical-six-fix-direct-1d172afd-20260718
    paths:
      - .github/workflows/one-shot-six-fix-direct-push.yml

permissions:
  contents: write

concurrency:
  group: one-shot-six-fix-direct-push
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      START_SHA: 6eb78098339450813a07adfaff8064a35c32fa3e
      TARGET_BRANCH: fix/canonical-six-fix-direct-1d172afd-20260718
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
          show-progress: false

      - name: Prove bounded starting authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "$TARGET_BRANCH"
          test "$(git rev-parse HEAD^)" = "$START_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply exactly six approved product repairs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')

          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8')
            const count = source.split(before).length - 1
            if (count !== 1) throw new Error(`${path}: expected exactly one replacement target, found ${count}`)
            fs.writeFileSync(path, source.replace(before, after))
          }

          const lifeMap = 'urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx'
          const home = 'urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx'
          const ground = 'urai-tier1/src/app/GroundSpatialWorldClean.tsx'
          const navigation = 'urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx'

          replaceOnce(
            lifeMap,
            `  const textureResolution = selected
    ? profile.tier === "high" ? 512 : 384
    : overview
      ? profile.tier === "high" ? 128 : 96
      : related
        ? profile.tier === "high" ? 224 : 160
        : 80;`,
            `  const textureResolution = selected
    ? profile.tier === "high" ? 512 : 384
    : profile.tier === "high" ? 128 : 96;`
          )

          replaceOnce(
            home,
            `    update()
    media.addEventListener?.('change', update)
    return () => media.removeEventListener?.('change', update)`,
            `    update()
    if (media.addEventListener) {
      media.addEventListener('change', update)
      return () => media.removeEventListener('change', update)
    }
    media.addListener(update)
    return () => media.removeListener(update)`
          )

          replaceOnce(
            ground,
            `    update();
    query.addEventListener?.("change", update);
    return () => query.removeEventListener?.("change", update);`,
            `    update();
    if (query.addEventListener) {
      query.addEventListener("change", update);
      return () => query.removeEventListener("change", update);
    }
    query.addListener(update);
    return () => query.removeListener(update);`
          )

          replaceOnce(
            navigation,
            `  const damping = requested.lengthSq() > 0 ? acceleration : deceleration
  velocity.x = THREE.MathUtils.damp(velocity.x, requested.x, damping, delta)
  velocity.z = THREE.MathUtils.damp(velocity.z, requested.z, damping, delta)

  const next = MOTION_NEXT.copy(position).addScaledVector(velocity, Math.min(delta, 0.05))`,
            `  const damping = requested.lengthSq() > 0 ? acceleration : deceleration
  const clampedDelta = Math.min(delta, 0.05)
  velocity.x = THREE.MathUtils.damp(velocity.x, requested.x, damping, clampedDelta)
  velocity.z = THREE.MathUtils.damp(velocity.z, requested.z, damping, clampedDelta)

  const next = MOTION_NEXT.copy(position).addScaledVector(velocity, clampedDelta)`
          )

          replaceOnce(
            ground,
            `            onFocus: (event: FocusEvent<HTMLElement>) => {
              setActiveId(destination.id);
              const target = event.currentTarget;
              target.scrollIntoView({ block: "nearest", inline: "center" });
              window.requestAnimationFrame(() => target.scrollIntoView({ block: "nearest", inline: "center" }));
            },`,
            `            onFocus: (event: FocusEvent<HTMLElement>) => {
              setActiveId(destination.id);
              const target = event.currentTarget;
              const reveal = () => target.scrollIntoView({ block: "nearest", inline: "center" });
              reveal();
              window.requestAnimationFrame(reveal);
              window.setTimeout(reveal, reducedMotion ? 0 : 260);
            },`
          )

          replaceOnce(
            ground,
            `.ground-destination-compass :is(a,button):hover,.ground-destination-compass :is(a,button):focus-visible,.ground-destination-compass :is(a,button)[aria-current]{max-width:220px;`,
            `.ground-destination-compass :is(a,button):focus-visible{transition:none!important}.ground-destination-compass :is(a,button):hover,.ground-destination-compass :is(a,button):focus-visible,.ground-destination-compass :is(a,button)[aria-current]{max-width:220px;`
          )

          replaceOnce(
            lifeMap,
            `  const rendererCleanupRef = useRef<(() => void) | null>(null);
  const recoveryTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);`,
            `  const rendererCleanupRef = useRef<(() => void) | null>(null);
  const recoveryTimerRef = useRef<ReturnType<typeof setTimeout> | null>(null);
  const overviewIdentityRef = useRef<string | null>(null);`
          )

          replaceOnce(
            lifeMap,
            `  useEffect(() => {
    if (!queryNodeId || !nodes.length) return;
    const node = nodes.find((candidate) => candidate.id === queryNodeId);
    if (!node) return;
    setSelectedId(node.id);
    setCameraIntent(cameraForNode(node));
    setNarratorText(narrationForNode(node).text);
  }, [nodes, queryNodeId]);`,
            `  useEffect(() => {
    if (!queryNodeId || !nodes.length) return;
    if (overviewIdentityRef.current === queryNodeId) return;
    overviewIdentityRef.current = null;
    const node = nodes.find((candidate) => candidate.id === queryNodeId);
    if (!node) return;
    setSelectedId(node.id);
    setCameraIntent(cameraForNode(node));
    setNarratorText(narrationForNode(node).text);
  }, [nodes, queryNodeId]);`
          )

          replaceOnce(
            lifeMap,
            `  const selectNode = useCallback((node: LifeMapNode) => {
    setSelectedId(node.id);`,
            `  const selectNode = useCallback((node: LifeMapNode) => {
    overviewIdentityRef.current = null;
    setSelectedId(node.id);`
          )

          replaceOnce(
            lifeMap,
            `  const recenter = useCallback(() => {
    setSelectedId(null);
    setCameraIntent(OVERVIEW_CAMERA);
    setNarratorText("Back to the whole private constellation. Select any star to enter it.");
    router.replace("/life-map", { scroll: false });
  }, [router]);`,
            `  const recenter = useCallback(() => {
    const preservedId = selectedId;
    if (preservedId) overviewIdentityRef.current = preservedId;
    setSelectedId(null);
    setCameraIntent(OVERVIEW_CAMERA);
    setNarratorText("Back to the whole private constellation. Select any star to enter it.");
    const next = new URLSearchParams();
    if (preservedId) next.set("memoryId", preservedId);
    next.set("manifestId", manifestId);
    router.replace(\`/life-map?\${next.toString()}\`, { scroll: false });
  }, [manifestId, router, selectedId]);`
          )
          NODE

          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx
            urai-tier1/src/app/GroundSpatialWorldClean.tsx
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx
            urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx
          )
          test "${changed[*]}" = "${expected[*]}"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify unit contracts, types and static build
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm --dir urai-tier1 test:unit
          corepack pnpm --dir urai-tier1 typecheck
          corepack pnpm build:static

      - name: Install Chromium
        run: corepack pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Run full accessibility and performance evidence suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/accessibility-performance
          corepack pnpm exec playwright test --config playwright.accessibility.config.ts 2>&1 | tee artifacts/accessibility-performance/playwright.log

      - name: Commit one clean four-file product repair
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts test-results playwright-report
          rm .github/workflows/one-shot-six-fix-direct-push.yml
          rm -f docs/verification/TRIGGER_CANONICAL_SIX_FIX_DIRECT.md
          git diff --check
          mapfile -t changed < <(git status --porcelain | sed 's/^...//' | sort)
          expected=(
            urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx
            urai-tier1/src/app/GroundSpatialWorldClean.tsx
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx
            urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx
          )
          test "${changed[*]}" = "${expected[*]}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spatial): close canonical mobile and accessibility defects'
          git push origin "HEAD:$TARGET_BRANCH"
