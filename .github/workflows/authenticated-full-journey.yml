name: Original Authenticated App Journey (Non-release)
on:
  pull_request:
    paths:
      - '.github/workflows/authenticated-full-journey.yml'
      - 'scripts/prove-authenticated-full-journey.mjs'
      - 'urai-tier1/src/lib/firebase/client.ts'
      - 'urai-tier1/src/app/login/LoginClient.tsx'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact tested SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha }}
      GCLOUD_PROJECT: demo-urai-auth-journey
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      NEXT_PUBLIC_FIREBASE_API_KEY: fictional-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-urai-auth-journey.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-urai-auth-journey
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-urai-auth-journey.appspot.com
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:journey
      NEXT_PUBLIC_URAI_AUTH_JOURNEY_EMULATOR: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - name: Exact source boundary
        run: |
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          node --check scripts/prove-authenticated-full-journey.mjs
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Frozen install and Chromium
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Nonrelease emulator integration proof
        run: pnpm exec firebase emulators:exec --project demo-urai-auth-journey --only auth,firestore --config firebase.captured-reality-emulator.json 'node scripts/prove-authenticated-full-journey.mjs'
      - name: Keep redacted failure receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-journey-nonrelease-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/authenticated-full-journey/
          if-no-files-found: warn
          retention-days: 30
