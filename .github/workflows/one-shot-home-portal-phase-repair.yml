name: One-shot Home portal phase repair

on:
  push:
    branches:
      - feat/home-final-personalized-sanctuary-20260723
    paths:
      - '.github/workflows/one-shot-home-portal-phase-repair.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-home-portal-phase-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout governed Home branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/home-final-personalized-sanctuary-20260723
          fetch-depth: 2
          persist-credentials: true
          show-progress: false

      - name: Verify exact repair parent and clean authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/home-final-personalized-sanctuary-20260723"
          test "$(git rev-parse HEAD^)" = "4ff3db6ade90ad6259bfc418f824660b642c5f6a"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply bounded runtime repair and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('urai-tier1/src/app/AssetDrivenHomeWorld.tsx')
          source = runtime.read_text()
          old = """    const traversalDelay = reducedMotion ? 90 : 620
              const closingDelay = reducedMotion ? 170 : 1180
              const travelDelay = reducedMotion ? 230 : 1540
              timers.current.push(window.setTimeout(() => { setPhase('traversal'); setPortalEvidence(`${destination}:traversal`) }, traversalDelay))
              timers.current.push(window.setTimeout(() => { setPhase('closing'); setPortalEvidence(`${destination}:closing`) }, closingDelay))
              timers.current.push(window.setTimeout(() => requestUraiWorldTravel(route), travelDelay))"""
          new = """    const openingDuration = reducedMotion ? 90 : 620
              const traversalDuration = reducedMotion ? 80 : 560
              const closingDuration = reducedMotion ? 60 : 360
              const enterTraversal = () => {
                setPhase('traversal')
                setPortalEvidence(`${destination}:traversal`)
                const closingTimer = window.setTimeout(() => {
                  setPhase('closing')
                  setPortalEvidence(`${destination}:closing`)
                  const travelTimer = window.setTimeout(() => requestUraiWorldTravel(route), closingDuration)
                  timers.current.push(travelTimer)
                }, traversalDuration)
                timers.current.push(closingTimer)
              }
              timers.current.push(window.setTimeout(enterTraversal, openingDuration))"""
          if source.count(old) != 1:
              raise SystemExit(f'expected one exact portal timing block, found {source.count(old)}')
          runtime.write_text(source.replace(old, new))

          contract = Path('urai-tier1/tests/home-portal-phase-sequence-contract.test.mjs')
          contract.write_text("""import test from 'node:test'\nimport assert from 'node:assert/strict'\nimport { readFile } from 'node:fs/promises'\n\nconst source = await readFile(new URL('../src/app/AssetDrivenHomeWorld.tsx', import.meta.url), 'utf8')\nconst start = source.indexOf('const openingDuration = reducedMotion ? 90 : 620')\nconst end = source.indexOf('\\n  }\\n\\n  const approach', start)\nconst sequence = start >= 0 && end > start ? source.slice(start, end) : ''\n\ntest('Home portal phases are chained so traversal renders before closing and travel', () => {\n  assert.ok(sequence, 'portal phase sequence must be present')\n  assert.match(sequence, /const traversalDuration = reducedMotion \\? 80 : 560/)\n  assert.match(sequence, /const closingDuration = reducedMotion \\? 60 : 360/)\n  const traversal = sequence.indexOf(\"setPhase('traversal')\")\n  const closingTimer = sequence.indexOf('const closingTimer = window.setTimeout')\n  const closing = sequence.indexOf(\"setPhase('closing')\")\n  const travelTimer = sequence.indexOf('const travelTimer = window.setTimeout')\n  const travel = sequence.indexOf('requestUraiWorldTravel(route)')\n  assert.ok(traversal >= 0 && traversal < closingTimer)\n  assert.ok(closingTimer < closing && closing < travelTimer && travelTimer < travel)\n  assert.doesNotMatch(sequence, /traversalDelay|closingDelay|travelDelay/)\n})\n""")
          PY
          git rm .github/workflows/one-shot-home-portal-phase-repair.yml
          git diff --check
          node --test urai-tier1/tests/home-portal-phase-sequence-contract.test.mjs

      - name: Commit exact bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LifeLoggerAI Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add urai-tier1/src/app/AssetDrivenHomeWorld.tsx urai-tier1/tests/home-portal-phase-sequence-contract.test.mjs .github/workflows/one-shot-home-portal-phase-repair.yml
          git commit -m "fix(home): make portal phases observable under host saturation"
          git push origin HEAD:feat/home-final-personalized-sanctuary-20260723
