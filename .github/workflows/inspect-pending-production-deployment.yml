name: Inspect pending production deployment

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-pending-production-deployment.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Query pending deployment review
        id: query
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '29388368963'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pending-production-deployment"
          mkdir -p "$out"
          curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/pending_deployments" \
            > "$out/pending-deployments.json"
          cat "$out/pending-deployments.json"
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Upload pending deployment receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pending-production-deployment-29388368963
          path: ${{ steps.query.outputs.out }}
          if-no-files-found: error
          retention-days: 30
