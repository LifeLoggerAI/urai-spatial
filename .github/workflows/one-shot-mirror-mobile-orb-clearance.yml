name: One-shot Mirror mobile Orb clearance

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-shot-mirror-mobile-orb-clearance
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/mirror-embodied-spatial-realm-v2-20260801
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  repair:
    if: github.repository == 'LifeLoggerAI/urai-spatial' && github.event.pull_request.head.ref == 'feat/mirror-embodied-spatial-realm-v2-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact Mirror branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Verify exact clean authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply bounded mobile Orb clearance repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          client = Path('urai-tier1/src/app/mirror/MirrorSpatialClient.tsx')
          source = client.read_text()

          old_orb = '.mirrorOrb{position:absolute;z-index:19;'
          new_orb = '.mirrorOrb{position:absolute;z-index:22;'
          if old_orb not in source:
              raise SystemExit('expected Mirror Orb z-index boundary not found')
          source = source.replace(old_orb, new_orb, 1)

          old_mobile = '.mirrorInspection{left:12px;right:12px;top:max(72px,calc(env(safe-area-inset-top) + 62px));width:auto;max-height:calc(100svh - 250px)}'
          new_mobile = '.mirrorInspection{left:12px;right:12px;top:max(72px,calc(env(safe-area-inset-top) + 62px));bottom:max(238px,calc(env(safe-area-inset-bottom) + 232px));width:auto;max-height:none}'
          if old_mobile not in source:
              raise SystemExit('expected mobile Mirror inspection boundary not found')
          source = source.replace(old_mobile, new_mobile, 1)
          client.write_text(source)

          regression = Path('urai-tier1/tests/mirror-canonical-owner-hydration-contract.test.mjs')
          test_source = regression.read_text()
          addition = '''\n\ntest('mobile Mirror reserves a clear touch zone for the Orb', () => {\n  assert.match(mirrorClient, /\\.mirrorOrb\\{position:absolute;z-index:22;/)\n  assert.match(mirrorClient, /\\.mirrorInspection\\{left:12px;right:12px;top:max\\(72px,calc\\(env\\(safe-area-inset-top\\) \\+ 62px\\)\\);bottom:max\\(238px,calc\\(env\\(safe-area-inset-bottom\\) \\+ 232px\\)\\);width:auto;max-height:none\\}/)\n  assert.doesNotMatch(mirrorClient, /\\.mirrorOrb\\{position:absolute;z-index:19;/)\n  assert.doesNotMatch(mirrorClient, /max-height:calc\\(100svh - 250px\\)/)\n})\n'''
          if "mobile Mirror reserves a clear touch zone for the Orb" not in test_source:
              regression.write_text(test_source.rstrip() + addition)
          PY

          git rm .github/workflows/one-shot-mirror-mobile-orb-clearance.yml
          git add \
            urai-tier1/src/app/mirror/MirrorSpatialClient.tsx \
            urai-tier1/tests/mirror-canonical-owner-hydration-contract.test.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '3'

      - name: Verify repaired touch boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '.mirrorOrb{position:absolute;z-index:22;' urai-tier1/src/app/mirror/MirrorSpatialClient.tsx
          grep -Fq 'bottom:max(238px,calc(env(safe-area-inset-bottom) + 232px));width:auto;max-height:none' urai-tier1/src/app/mirror/MirrorSpatialClient.tsx
          ! grep -Fq '.mirrorOrb{position:absolute;z-index:19;' urai-tier1/src/app/mirror/MirrorSpatialClient.tsx
          ! grep -Fq 'max-height:calc(100svh - 250px)' urai-tier1/src/app/mirror/MirrorSpatialClient.tsx
          grep -Fq 'mobile Mirror reserves a clear touch zone for the Orb' urai-tier1/tests/mirror-canonical-owner-hydration-contract.test.mjs

      - name: Commit exact mobile clearance repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Reserve mobile Mirror Orb touch clearance'
          git push origin "HEAD:$TARGET_BRANCH"
