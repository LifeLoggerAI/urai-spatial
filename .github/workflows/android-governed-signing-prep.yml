name: Android Governed Signing Prep

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed source SHA to package and sign
        required: true
        type: string
      pull_request:
        description: Merged PR number whose exact approved head is being signed
        required: true
        type: string
      version_code:
        description: Monotonically increasing Google Play versionCode
        required: true
        type: string
      version_name:
        description: User-visible Android versionName
        required: true
        type: string

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize exact reviewed signing source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      PR_NUMBER: ${{ inputs.pull_request }}
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Prove exact clean signing authority source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Validate exact merged source and governed approval
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]

          pr="$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.merged' <<<"$pr")" = 'true' || {
            echo 'signing_source_pr_not_merged' >&2
            exit 1
          }
          test "$(jq -r '.head.sha' <<<"$pr")" = "$SOURCE_SHA" || {
            echo 'signing_source_not_exact_pr_head' >&2
            exit 1
          }
          pr_author="$(jq -r '.user.login' <<<"$pr")"

          reviews="$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")"

          mapfile -t candidates < <(
            jq -r \
              --arg sha "$SOURCE_SHA" \
              --arg author "$pr_author" \
              '[.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")]
              | sort_by(.user.login, (.submitted_at // ""), .id)
              | group_by(.user.login)
              | map(last)
              | .[]
              | select(.state == "APPROVED" and .commit_id == $sha and .user.login != $author)
              | .user.login' \
              <<<"$reviews"
          )

          for reviewer in "${candidates[@]}"; do
            permission="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$REPOSITORY/collaborators/$reviewer/permission" \
              | jq -r '.permission // empty')"
            case "$permission" in
              admin|maintain|write)
                echo "Signing authorized by native independent exact-head approval from $reviewer."
                exit 0
                ;;
            esac
          done

          pr_body="$(jq -r '.body // ""' <<<"$pr")"
          field() {
            local key="$1"
            sed -n "s/^$key=//p" <<<"$pr_body" | tail -n 1
          }

          external_reviewer="$(field INDEPENDENT_REVIEWER_ID)"
          external_sha="$(field INDEPENDENT_APPROVED_SHA)"
          external_decision="$(field INDEPENDENT_DECISION)"
          external_reviewed_at="$(field INDEPENDENT_REVIEWED_AT)"
          external_attestation_sha256="$(field INDEPENDENT_ATTESTATION_SHA256)"
          external_attestation_uri="$(field INDEPENDENT_ATTESTATION_URI)"
          external_witness="$(field INDEPENDENT_WITNESS)"
          external_signature_b64="$(field INDEPENDENT_SIGNATURE_B64)"
          external_sshsig_b64="$(field INDEPENDENT_SSHSIG_B64)"

          test -n "$external_reviewer" || { echo 'eligible_exact_head_approval_missing' >&2; exit 1; }
          test "$external_reviewer" = 'LimberNutz0' || { echo 'external_reviewer_must_be_LimberNutz0' >&2; exit 1; }
          test "$external_reviewer" != "$pr_author" || { echo 'external_reviewer_matches_pr_author' >&2; exit 1; }
          test "$external_sha" = "$SOURCE_SHA" || { echo 'external_approval_sha_mismatch' >&2; exit 1; }
          test "$external_decision" = 'APPROVED' || { echo 'external_approval_decision_invalid' >&2; exit 1; }
          test -n "$external_reviewed_at" || { echo 'external_reviewed_at_missing' >&2; exit 1; }
          [[ "$external_attestation_sha256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo 'external_attestation_sha256_invalid' >&2; exit 1; }
          test -n "$external_attestation_uri" || { echo 'external_attestation_uri_missing' >&2; exit 1; }
          test -n "$external_witness" || { echo 'external_witness_missing' >&2; exit 1; }
          if test -z "$external_signature_b64" && test -z "$external_sshsig_b64"; then
            echo 'external_signature_missing' >&2
            exit 1
          fi

          key_path="docs/release-governance/reviewers/$external_reviewer-public.pem"
          ssh_key_path="docs/release-governance/reviewers/$external_reviewer-public.ssh"

          message="$RUNNER_TEMP/external-review-message.txt"
          signature="$RUNNER_TEMP/external-review-signature.bin"
          cat > "$message" <<EOF
          URAI-INDEPENDENT-RELEASE-APPROVAL-V1
          repository=$REPOSITORY
          pull_request=$PR_NUMBER
          exact_sha=$SOURCE_SHA
          reviewer=$external_reviewer
          decision=$external_decision
          reviewed_at=$external_reviewed_at
          attestation_sha256=$external_attestation_sha256
          attestation_uri=$external_attestation_uri
          witness=$external_witness
          EOF
          if test -n "$external_sshsig_b64"; then
            test -f "$ssh_key_path" || { echo "trusted_reviewer_ssh_public_key_missing:$ssh_key_path" >&2; exit 1; }
            ssh_signature="$RUNNER_TEMP/external-review-signature.sshsig"
            allowed_signers="$RUNNER_TEMP/external-review-allowed-signers"
            printf '%s' "$external_sshsig_b64" | base64 --decode > "$ssh_signature"
            printf '%s %s\n' "$external_reviewer" "$(cat "$ssh_key_path")" > "$allowed_signers"
            ssh-keygen -Y verify \
              -f "$allowed_signers" \
              -I "$external_reviewer" \
              -n urai-release \
              -s "$ssh_signature" \
              < "$message"
            echo "Signing authorized by cryptographically verified external independent SSH exact-head approval."
          else
            test -f "$key_path" || { echo "trusted_reviewer_public_key_missing:$key_path" >&2; exit 1; }
            printf '%s' "$external_signature_b64" | base64 --decode > "$signature"
            openssl pkeyutl -verify \
              -pubin \
              -inkey "$key_path" \
              -rawin \
              -in "$message" \
              -sigfile "$signature"
            echo "Signing authorized by cryptographically verified external independent exact-head approval."
          fi


  sign-aab:
    needs: authorize
    environment: production
    name: Build and sign exact Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_PACKAGE: com.urailabs.urai
      SOURCE_SHA: ${{ inputs.source_sha }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      NEXT_PUBLIC_URAI_API_ORIGIN: https://urai.app

    steps:
      - name: Validate exact SHA input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout exact requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Require deliberate signing credentials
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail
          test "$LICENSE_STATUS" -eq 0
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install canonical dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify pinned native Gradle integrity preparation
        run: node --test urai-tier1/tests/native-gradle-integrity.test.mjs

      - name: Verify candidate package identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F "appId: '$EXPECTED_PACKAGE'" distribution/android-shell/capacitor.config.ts

      - name: Load canonical Firebase public configuration
        shell: bash
        run: |
          set -euo pipefail
          config="$(curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 https://urai.app/__/firebase/init.json)"
          test "$(jq -r '.projectId // empty' <<<"$config")" = "urai-4dc1d"
          test "$(jq -r '.authDomain // empty' <<<"$config")" = "urai-4dc1d.firebaseapp.com"
          for pair in \
            "NEXT_PUBLIC_FIREBASE_API_KEY apiKey" \
            "NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN authDomain" \
            "NEXT_PUBLIC_FIREBASE_PROJECT_ID projectId" \
            "NEXT_PUBLIC_FIREBASE_APP_ID appId" \
            "NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET storageBucket" \
            "NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID messagingSenderId" \
            "NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID measurementId"; do
            env_name="${pair%% *}"
            json_name="${pair#* }"
            value="$(jq -r --arg key "$json_name" '.[$key] // empty' <<<"$config")"
            test -n "$value" || { echo "Canonical Firebase config is missing: $json_name" >&2; exit 1; }
            printf '%s=%s\n' "$env_name" "$value" >> "$GITHUB_ENV"
          done

      - name: Require release public configuration and version
        shell: bash
        run: |
          set -euo pipefail
          for name in NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_APP_ID; do
            test -n "${!name}" || { echo "Missing required public build variable: $name" >&2; exit 1; }
          done
          test "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" = "urai-4dc1d"
          test "$NEXT_PUBLIC_URAI_API_ORIGIN" = "https://urai.app"
          [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          [[ "$ANDROID_VERSION_NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,63}$ ]]

      - name: Require canonical Android Google sign-in configuration
        env:
          ANDROID_FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_FIREBASE_GOOGLE_SERVICES_JSON }}
        run: |
          node scripts/prepare-android-native-google-auth.mjs \
            --config-output "$RUNNER_TEMP/urai-google-services.json" \
            --receipt-output android-native-auth-receipt.json

      - name: Build governed static export
        env:
          VERCEL_GIT_COMMIT_SHA: ${{ env.SOURCE_SHA }}
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.SOURCE_SHA }}
        run: corepack pnpm build:static

      - name: Bind and verify exact native static identity
        run: node scripts/prepare-native-static-provenance.mjs --directory urai-tier1/out --source-sha "$SOURCE_SHA" --platform android --workflow-run-id "$GITHUB_RUN_ID"

      - name: Generate and sync Android project
        working-directory: distribution/android-shell
        run: |
          set -euo pipefail
          rm -rf android
          corepack pnpm exec cap add android
          node ../../scripts/prepare-native-links.mjs --android-project android
          node ../../scripts/prepare-native-gradle-integrity.mjs --android-project android
          node ../../scripts/prepare-android-native-google-auth.mjs --apply-project android
          corepack pnpm exec cap sync android
          node ../../scripts/prepare-native-static-provenance.mjs --directory android/app/src/main/assets/public --source-sha "$SOURCE_SHA" --platform android --workflow-run-id "$GITHUB_RUN_ID" --verify-only

      - name: Apply governed Android version
        working-directory: distribution/android-shell/android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("app/build.gradle")
          text = path.read_text()
          text, code_count = re.subn(r"versionCode\s+\d+", f"versionCode {os.environ['ANDROID_VERSION_CODE']}", text, count=1)
          text, name_count = re.subn(r'versionName\s+"[^"]+"', f'versionName "{os.environ["ANDROID_VERSION_NAME"]}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Generated Gradle version fields not found exactly once.")
          path.write_text(text)
          PY
          grep -F "versionCode $ANDROID_VERSION_CODE" app/build.gradle
          grep -F "versionName \"$ANDROID_VERSION_NAME\"" app/build.gradle

      - name: Build unsigned release AAB
        working-directory: distribution/android-shell/android
        run: ./gradlew bundleRelease --stacktrace

      - name: Materialize durable upload keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/urai-upload-key.jks"
          test -s "$RUNNER_TEMP/urai-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/urai-upload-key.jks"

      - name: Sign exact AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="distribution/android-shell/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner \
            -keystore "$RUNNER_TEMP/urai-upload-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify -strict "$AAB"
          sha256sum "$AAB" | tee android-signed-aab.sha256
          keytool -list -v \
            -keystore "$RUNNER_TEMP/urai-upload-key.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            | awk '/SHA256:/{print "upload_certificate_sha256=" $2}' \
            | tee android-upload-certificate.txt
          {
            echo "status=SIGNED_BUILD_EVIDENCE_ONLY"
            echo "play_upload_performed=false"
            echo "candidate_package=$EXPECTED_PACKAGE"
            echo "source_sha=$SOURCE_SHA"
            echo "workflow_sha=$GITHUB_SHA"
            echo "version_code=$ANDROID_VERSION_CODE"
            echo "version_name=$ANDROID_VERSION_NAME"
            echo "api_origin=$NEXT_PUBLIC_URAI_API_ORIGIN"
            echo "firebase_project=$NEXT_PUBLIC_FIREBASE_PROJECT_ID"
            echo "native_google_auth_configured=$URAI_ANDROID_NATIVE_GOOGLE_AUTH_READY"
            echo "aab_path=$AAB"
          } | tee android-signed-package-receipt.txt

      - name: Retain signed package evidence
        uses: actions/upload-artifact@v4
        with:
          name: urai-android-signed-aab-${{ env.SOURCE_SHA }}
          path: |
            distribution/android-shell/android/app/build/outputs/bundle/release/app-release.aab
            android-signed-aab.sha256
            android-upload-certificate.txt
            android-signed-package-receipt.txt
            android-native-auth-receipt.json
          retention-days: 30

      - name: Remove local keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/urai-upload-key.jks"
