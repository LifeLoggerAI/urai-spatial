name: Apply complete Life Map visual privacy repair

on:
  push:
    branches:
      - repair/life-map-soft-weather-demo-continuity-20260719

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-life-map-visual-privacy-repair
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/life-map-soft-weather-demo-continuity-20260719
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic source and proof patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_life_map_visual_privacy_repair.py
          git diff --check

      - name: Publish bounded product and contract commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-life-map-soft-weather-repair.yml
          git rm .github/scripts/apply_life_map_visual_privacy_repair.py
          git add \
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx \
            urai-tier1/src/components/lifemap/useLifeMapEvents.ts \
            urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx \
            scripts/capture-continuous-spatial-proof.mjs \
            urai-tier1/tests/lifemap-scene-behavior.test.mjs \
            urai-tier1/tests/lifemap-data-boundary.test.mjs \
            urai-tier1/tests/lifemap-trust-loop.test.mjs \
            urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
          git diff --cached --check
          git commit -m "fix(life-map): remove slab weather and enforce explicit demo privacy"
          git push origin HEAD:repair/life-map-soft-weather-demo-continuity-20260719

      - name: Post executor receipt
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Life Map deterministic executor receipt.',
              '',
              `- trigger SHA: \`${context.sha}\``,
              `- apply: ${{ steps.apply.outcome }}`,
              `- publish: ${{ steps.publish.outcome }}`,
              `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'No merge or deployment was performed by this executor.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 842,
              body,
            });
