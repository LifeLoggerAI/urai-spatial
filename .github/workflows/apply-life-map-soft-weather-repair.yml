name: Apply complete Life Map visual privacy repair

on:
  push:
    branches:
      - repair/life-map-materialize-corrective-20260720

permissions:
  contents: write
  issues: write

concurrency:
  group: apply-life-map-visual-privacy-repair-corrective
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact current corrective branch
        uses: actions/checkout@v4
        with:
          ref: repair/life-map-materialize-corrective-20260720
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trigger and apply deterministic source patch
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -s .github/patches/life-map-visual-privacy.patch.gz.b64
          test -s .github/scripts/apply_life_map_visual_privacy_repair.py
          python3 .github/scripts/apply_life_map_visual_privacy_repair.py
          git diff --check

      - name: Verify focused materialized contracts
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/lifemap-scene-behavior.test.mjs
          node --test urai-tier1/tests/lifemap-data-boundary.test.mjs
          node --test urai-tier1/tests/lifemap-trust-loop.test.mjs
          node --test urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs

      - name: Publish one bounded materialized product commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-life-map-soft-weather-repair.yml
          git rm .github/scripts/apply_life_map_visual_privacy_repair.py
          git rm .github/patches/life-map-visual-privacy.patch.gz.b64
          git add \
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx \
            urai-tier1/src/components/lifemap/useLifeMapEvents.ts \
            urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx \
            scripts/capture-continuous-spatial-proof.mjs \
            urai-tier1/tests/lifemap-scene-behavior.test.mjs \
            urai-tier1/tests/lifemap-data-boundary.test.mjs \
            urai-tier1/tests/lifemap-trust-loop.test.mjs \
            urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
          git diff --cached --check
          git commit -m "fix(life-map): materialize soft weather and explicit demo privacy"
          git push --force-with-lease=refs/heads/repair/life-map-materialize-corrective-20260720:${GITHUB_SHA} origin HEAD:refs/heads/repair/life-map-materialize-corrective-20260720

      - name: Post exact materialization receipt
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              'Life Map corrective materialization receipt.',
              '',
              `- trigger SHA: \`${context.sha}\``,
              `- apply: ${{ steps.apply.outcome }}`,
              `- focused verification: ${{ steps.verify.outcome }}`,
              `- publish: ${{ steps.publish.outcome }}`,
              `- run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The final commit removes the patch archive, apply script, and temporary executor. No merge or deployment was performed.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 853,
              body,
            });