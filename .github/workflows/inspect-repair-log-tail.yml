name: Inspect repair log tail

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-repair-log-tail.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact failed repair job log
        id: logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '87262436237'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/repair-log-tail"
          mkdir -p "$out"
          curl --fail --location --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" \
            > "$out/full.log"
          tail -n 250 "$out/full.log" > "$out/tail.log"
          cat "$out/tail.log"
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Upload repair log tail
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repair-log-tail-87262436237
          path: ${{ steps.logs.outputs.out }}
          if-no-files-found: error
          retention-days: 30
