name: Inspect failed protected deploy log

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-repair-log-tail.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact failed protected deploy job log
        id: logs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '87378340286'
          EXPECTED_RUN_ID: '29422581477'
          EXPECTED_SHA: d41c5275a359e028ff2b4b3ca37e585bcdfa8515
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/failed-protected-deploy-log"
          mkdir -p "$out"
          curl --fail --location --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" \
            > "$out/full.log"

          grep -Fq "$EXPECTED_SHA" "$out/full.log"
          grep -Fq "$EXPECTED_RUN_ID" "$out/full.log" || true
          tail -n 1100 "$out/full.log" > "$out/tail.log"
          grep -Ein -C 16 'error|failed|failure|post-deploy|smoke|focus|replay|expected|observed|timeout|console|network|resource|restore|recovery|selector|identity|screenshot' "$out/full.log" \
            > "$out/diagnostic-excerpts.log" || true
          cat "$out/diagnostic-excerpts.log"
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Upload failed protected deploy log evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: failed-protected-deploy-log-87378340286
          path: ${{ steps.logs.outputs.out }}
          if-no-files-found: error
          retention-days: 30
