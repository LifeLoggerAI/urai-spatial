name: Founder Voice ElevenLabs Secret Preflight 2026-09-16

on:
  push:
    branches:
      - ops/founder-voice-elevenlabs-preflight-20260916
    paths:
      - '.github/workflows/founder-voice-elevenlabs-secret-preflight-20260916.yml'

permissions:
  contents: read
  issues: write
  id-token: write

env:
  EXPECTED_PROJECT: urai-4dc1d
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ vars.GCP_MAPS_ADMIN_SERVICE_ACCOUNT || vars.GCP_ASSET_FACTORY_ADMIN_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

jobs:
  preflight:
    name: Verify protected ElevenLabs secret payload access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Guard isolated preflight branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'LifeLoggerAI/urai-spatial'
          test "$GITHUB_REF" = 'refs/heads/ops/founder-voice-elevenlabs-preflight-20260916'

      - name: Require short-lived Google identity configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WIF_PROVIDER"
          test -n "$WIF_SERVICE_ACCOUNT"

      - name: Authenticate through Workload Identity Federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: ${{ env.EXPECTED_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.EXPECTED_PROJECT }}
          version: '>= 500.0.0'

      - name: Probe ElevenLabs secret without exposing value
        id: secret
        shell: bash
        run: |
          set -euo pipefail
          test "$(gcloud config get-value project 2>/dev/null)" = "$EXPECTED_PROJECT"
          gcloud secrets describe ELEVENLABS_API_KEY --project "$EXPECTED_PROJECT" --format='value(name)' >/dev/null
          if gcloud secrets versions access latest --secret=ELEVENLABS_API_KEY --project "$EXPECTED_PROJECT" >/dev/null 2>&1; then
            echo 'accessible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'accessible=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Record non-secret preflight result on founder PR
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          ACCESSIBLE: ${{ steps.secret.outputs.accessible }}
        with:
          script: |
            const accessible = process.env.ACCESSIBLE === 'true'
            const body = [
              'Founder ElevenLabs protected-secret preflight',
              '',
              `- Branch: \`${context.ref.replace('refs/heads/', '')}\``,
              `- Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '- WIF authentication: attempted',
              `- ELEVENLABS_API_KEY payload readable without disclosure: **${accessible ? 'YES' : 'NO'}**`,
              '- Secret value was not printed, committed, uploaded, or added to this comment.',
              '- This preflight does not create a voice, deploy a function, modify #1177, merge, or release.'
            ].join('\n')
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 1208, body })

      - name: Fail closed if payload access is unavailable
        shell: bash
        env:
          ACCESSIBLE: ${{ steps.secret.outputs.accessible }}
        run: |
          set -euo pipefail
          test "$ACCESSIBLE" = 'true'
