name: Actual Replay In-World Candidate Proof (Non-release)
on:
  pull_request:
    branches: [main, repair/release-closure-integration-20261007, codex/combine-current-visual-7e794e-20261010, codex/replay-art-focus-compatible-proof-20261012, codex/replay-software-wide-raster-budget-20261012]
    paths:
      - '.github/workflows/replay-inworld-candidate-proof.yml'
      - 'scripts/capture-replay-inworld-candidate.mjs'
      - 'urai-tier1/src/app/replay/DevReplayCandidateWorld.tsx'
      - 'urai-tier1/src/app/replay/CinematicReplayClient.tsx'
      - 'urai-tier1/src/app/replay/ReplayDefaultTrailEvidence.tsx'
      - 'urai-tier1/src/app/replay/replayTrailGeometry.ts'
      - 'urai-tier1/src/app/replay/replayHorizonVertexShader.ts'
      - 'urai-tier1/src/spatial/performance/softwareWebGLRenderer.ts'
      - 'urai-tier1/src/spatial/performance/useAdaptiveSpatialQuality.ts'
      - 'urai-tier1/tests/replay-trail-geometry.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-actual-replay-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_URAI_PREVIEW_MODE: 'true'
      NEXT_PUBLIC_URAI_CANDIDATE_WORLD_REVIEW: 'true'
      NEXT_PUBLIC_URAI_PREVIEW_CHANNEL: 'replay-art-review-non-release'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - name: Verify exact source and closed admission gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          node -e "if(require('./operations/assets/launch-critical-assets.json').releasePolicy.candidateAssetsMayShip!==false)process.exit(1)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact models and real browser
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          node scripts/verify-final-glb-pack.mjs
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Capture Replay candidate and default actual application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/replay-inworld-candidate
          pnpm --dir urai-tier1 exec next dev --hostname 127.0.0.1 --port 4173 > artifacts/replay-inworld-candidate/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent 'http://127.0.0.1:4173/replay/?demo=1' >/dev/null; then break; fi
            sleep 2
          done
          node scripts/capture-replay-inworld-candidate.mjs
      - name: Preserve exact-head genuine browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-inworld-candidate-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/replay-inworld-candidate/
          if-no-files-found: error
          retention-days: 90
