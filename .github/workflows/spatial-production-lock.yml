name: Spatial Production Lock

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main]

jobs:
  production-lock:
    name: Validate production spatial lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Validate source-of-truth paths
        run: |
          test -f package.json
          test -f pnpm-workspace.yaml
          test -f firebase.json
          test -f firebase/firestore.rules
          test -f firebase/firestore.indexes.json
          test -f scripts/preflight.mjs
          test -f scripts/check-runtime-authority.mjs
          test -f urai-tier1/package.json
          test -f urai-tier1/src/app/page.tsx
          test -f urai-tier1/src/app/home/page.tsx
          test -f urai-tier1/src/app/ascent/page.tsx
          test -f urai-tier1/src/app/life-map/page.tsx
          test -f urai-tier1/src/app/focus/page.tsx
          test -f urai-tier1/src/app/replay/page.tsx
          test -f urai-tier1/src/app/mirror/page.tsx
          test -f urai-tier1/src/app/loading.tsx
          test -f urai-tier1/src/app/error.tsx
          test -f urai-tier1/src/app/not-found.tsx
          test -f urai-tier1/src/spatial/layout/TierOneExperience.tsx
          test -f urai-tier1/src/scene/HomeScene.tsx
          test -f urai-tier1/src/spatial/constellation/ConstellationLayer.tsx
          test -f docs/ARCHITECTURE_LOCK.md
          test -f docs/URAI_SPATIAL_SOURCE_OF_TRUTH_LOCK.md
          test -f tests/spatial-lock.mjs
          test -f tests/replay-tier5-lock.mjs
      - name: Preflight
        run: pnpm preflight
      - name: Runtime authority
        run: pnpm runtime:authority
      - name: Firebase boundary lock
        run: pnpm firebase:rules:check
