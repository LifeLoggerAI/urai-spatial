name: One-shot Life Map material fallback repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-shot-lifemap-material-fallback-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 801 && github.event.pull_request.head.ref == 'integrate/final-world-main-88287-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLEAN_HEAD: 691859dc0ab827278b07f537ab68b3d152ce43de
      SCRIPT_HEAD: b9418758ce0ec18bc14569bf3ca2060b8147e530
      TARGET_BRANCH: integrate/final-world-main-88287-20260718
    steps:
      - name: Checkout exact staged repair head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prove exact bounded authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SCRIPT_HEAD"
          test "$(git rev-parse HEAD^^)" = "$CLEAN_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          actual="$(git diff --name-only "$CLEAN_HEAD...HEAD" | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/one-shot-lifemap-material-fallback.yml' \
            'scripts/one-shot-lifemap-material-fallback.mjs' | sort)"
          test "$actual" = "$expected"

      - name: Apply material fallback and self-remove execution files
        run: node scripts/one-shot-lifemap-material-fallback.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify material contract, types, and build
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/lifemap-material-fallback-contract.test.mjs
          pnpm --dir urai-tier1 typecheck
          pnpm --dir urai-tier1 build

      - name: Publish one clean product repair commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/one-shot-lifemap-material-fallback.yml' \
            'scripts/one-shot-lifemap-material-fallback.mjs' \
            'urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx' \
            'urai-tier1/tests/lifemap-material-fallback-contract.test.mjs' | sort)"
          test "$actual" = "$expected"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(life-map): prevent default-white memory planes"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
