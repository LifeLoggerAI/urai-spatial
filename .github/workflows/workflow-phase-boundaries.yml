name: Workflow Phase Boundaries

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/spatial-production-lock.yml"
      - ".github/workflows/aaa-final-proof.yml"
      - ".github/workflows/urai-spatial-lock.yml"
      - ".github/workflows/urai-spatial-release-certification.yml"
      - ".github/workflows/spatial-live-deploy.yml"
      - ".github/workflows/workflow-phase-boundaries.yml"
      - "scripts/aaa-launch-proof.mjs"
      - "scripts/check-workflow-phase-boundaries.mjs"
      - "urai-tier1/src/app/status/**"
      - "urai-tier1/src/data/launchTruth.ts"
      - "urai-tier1/tests/status-live-authority-contract.test.mjs"
      - "urai-tier1/src/spatial/world/WorldTransitionController.tsx"
      - "urai-tier1/tests/persistent-world-doorway-regression.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-phase-boundaries-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify workflow phase boundaries
        run: node scripts/check-workflow-phase-boundaries.mjs

  aaa-proof:
    name: Post-merge/manual exact-head AAA proof
    needs: verify
    uses: ./.github/workflows/aaa-final-proof.yml
    with:
      target_sha: ${{ github.sha }}
      base_url: http://127.0.0.1:4173
      screenshots: "true"
