name: V2 Runtime Asset Certification

on:
  pull_request:
    paths:
      - scripts/certify-v2-runtime-assets.py
      - scripts/test-certify-v2-runtime-assets.py
      - .github/workflows/v2-runtime-asset-certification.yml
      - urai-tier1/src/spatial/assets/uraiV2Assets.ts
      - urai-tier1/public/assets/urai/v2/**
  push:
    branches: [main]
    paths:
      - scripts/certify-v2-runtime-assets.py
      - scripts/test-certify-v2-runtime-assets.py
      - .github/workflows/v2-runtime-asset-certification.yml
      - urai-tier1/src/spatial/assets/uraiV2Assets.ts
      - urai-tier1/public/assets/urai/v2/**

permissions:
  contents: read

concurrency:
  group: v2-runtime-asset-certification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install certification dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Run certification regression tests
        run: python scripts/test-certify-v2-runtime-assets.py
      - name: Certify all 80 existing V2 runtime assets
        run: python scripts/certify-v2-runtime-assets.py
      - name: Prove zero-provider and zero-deployment authority
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ASSET_RENDERER_API_KEY:-}"
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('urai-tier1/artifacts/v2-certification/v2-certification.json').read_text())
          assert p['expected']==80
          assert p['present']==80
          assert p['technicallyNoncompliant']==0
          assert p['providerCalls']==0
          assert p['spendUsd']=='0.00'
          assert p['promotionAuthorized'] is False
          assert p['deploymentAuthorized'] is False
          PY
      - name: Upload complete V2 certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-runtime-asset-certification-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: urai-tier1/artifacts/v2-certification/**
