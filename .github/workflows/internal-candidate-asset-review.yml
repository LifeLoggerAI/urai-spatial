name: Actual Candidate GLB Browser Review (Non-release)
on:
  pull_request:
    branches: [main, repair/release-closure-integration-20261007]
    paths:
      - '.github/workflows/internal-candidate-asset-review.yml'
      - 'urai-tier1/src/app/internal/asset-candidates/**'
      - 'scripts/capture-candidate-review.mjs'
      - 'scripts/internal-candidate-review.test.mjs'
      - 'operations/assets/launch-critical-assets.json'
      - 'operations/assets/generated-receipts/urai-final-glb-pack-v1.json'
      - 'urai-tier1/public/assets/urai/generated/models/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: urai-candidate-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser-candidate-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_URAI_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NEXT_PUBLIC_URAI_PREVIEW_MODE: 'true'
      NEXT_PUBLIC_URAI_PREVIEW_CHANNEL: 'internal-art-review-not-release'
      URAI_INTERNAL_CANDIDATE_REVIEW: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - name: Checkout immutable exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source and non-release gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain)"
          node -e "const x=require('./operations/assets/launch-critical-assets.json');if(x.releasePolicy.candidateAssetsMayShip!==false)process.exit(1)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate immutable bytes and install local Chromium
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          node --test scripts/internal-candidate-review.test.mjs
          node scripts/author-final-glb-pack.mjs
          node scripts/verify-final-glb-pack.mjs
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Render actual GLBs with separate development-only runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/internal-candidate-review
          pnpm --dir urai-tier1 exec next dev --hostname 127.0.0.1 --port 4173 > artifacts/internal-candidate-review/next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/internal/asset-candidates/ >/dev/null; then break; fi
            sleep 2
          done
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
            URAI_PROOF_DIR=artifacts/internal-candidate-review \
            node scripts/capture-candidate-review.mjs
      - name: Preserve original browser pixels and inspection receipts, never approval
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: internal-candidate-asset-review-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/internal-candidate-review/
          if-no-files-found: error
          retention-days: 90
