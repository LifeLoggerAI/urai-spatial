name: Council Provider Request Truth

on:
  pull_request:
    paths:
      - '.github/workflows/council-provider-request-truth.yml'
      - 'urai-tier1/src/spatial/council/councilProviderRegistry.ts'
      - 'urai-tier1/src/spatial/council/CouncilConversationPanel.tsx'
      - 'urai-tier1/src/spatial/scenario/ScenarioCouncilPanel.tsx'
      - 'urai-tier1/tests/council-provider-registry-contract.test.mjs'
      - 'urai-tier1/tests/council-provider-boundary-contract.test.mjs'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact source commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: council-provider-request-truth-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || inputs.verification_sha || github.sha }}
  cancel-in-progress: false

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha || github.sha }}

jobs:
  request-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Require exact clean source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Exercise actual request routes and rendered readiness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/council-provider-proof"
          pnpm --dir urai-tier1 exec node --import tsx --test \
            tests/council-provider-registry-contract.test.mjs \
            tests/council-provider-boundary-contract.test.mjs \
            tests/possible-futures-truth-contract.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/council-provider-proof/tests.tap"
      - name: Bind retained proof to unchanged source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'
          import { createHash } from 'node:crypto'
          const output = path.join(process.env.RUNNER_TEMP, 'council-provider-proof')
          const log = fs.readFileSync(path.join(output, 'tests.tap'), 'utf8')
          const counts = Object.fromEntries([...log.matchAll(/^(?:#|ℹ) (tests|pass|fail|cancelled|skipped|todo) (\d+)\s*$/gm)].map((match) => [match[1], Number(match[2])]))
          if (!(counts.tests >= 27) || counts.pass !== counts.tests || ['fail', 'cancelled', 'skipped', 'todo'].some((key) => counts[key] !== 0)) throw new Error('Missing or incomplete Council test evidence')
          const files = ['urai-tier1/src/spatial/council/councilProviderRegistry.ts', 'urai-tier1/src/spatial/council/CouncilConversationPanel.tsx', 'urai-tier1/src/spatial/scenario/ScenarioCouncilPanel.tsx', 'urai-tier1/src/spatial/council/councilClient.ts', 'urai-tier1/src/spatial/orb/openaiClient.ts', 'urai-tier1/tests/council-provider-registry-contract.test.mjs', 'urai-tier1/tests/council-provider-boundary-contract.test.mjs', 'urai-tier1/tests/possible-futures-truth-contract.test.mjs', '.github/workflows/council-provider-request-truth.yml']
          const sources = Object.fromEntries(files.map((file) => [file, createHash('sha256').update(fs.readFileSync(file)).digest('hex')]))
          const receipt = { schema: 'urai-council-request-truth-proof-1', sourceHead: process.env.URAI_EXACT_HEAD, workflowRun: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT, node: process.version, tests: counts, sources, transport: 'synthetic in-process responses; actual existing adapters', protectedRuntimeAcceptance: false, providerCanaryAcceptance: false, releaseCertification: false }
          fs.writeFileSync(path.join(output, 'receipt.json'), `${JSON.stringify(receipt, null, 2)}\n`)
          NODE
      - name: Retain complete Council evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: council-provider-request-truth-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: ${{ runner.temp }}/council-provider-proof
          if-no-files-found: error
          retention-days: 90
