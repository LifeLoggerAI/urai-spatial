name: Apply Home low-FPS accessibility repair

on:
  push:
    branches:
      - fix/home-visible-spatial-world-20260719

permissions:
  contents: write

concurrency:
  group: apply-home-low-fps-accessibility-repair
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/home-visible-spatial-world-20260719
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic accessibility repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          navigation = Path('urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx')
          text = navigation.read_text()
          old = """  const damping = requested.lengthSq() > 0 ? acceleration : deceleration
  const clampedDelta = Math.min(delta, 0.05)
  velocity.x = THREE.MathUtils.damp(velocity.x, requested.x, damping, clampedDelta)
  velocity.z = THREE.MathUtils.damp(velocity.z, requested.z, damping, clampedDelta)

  const next = MOTION_NEXT.copy(position).addScaledVector(velocity, clampedDelta)
  next.x = THREE.MathUtils.clamp(next.x, bounds.minX, bounds.maxX)
  next.z = THREE.MathUtils.clamp(next.z, bounds.minZ, bounds.maxZ)

  for (const obstacle of obstacles) {
    const dx = next.x - obstacle.x
    const dz = next.z - obstacle.z
    const distance = Math.hypot(dx, dz)
    if (distance >= obstacle.radius || distance === 0) continue
    const scale = obstacle.radius / distance
    next.x = obstacle.x + dx * scale
    next.z = obstacle.z + dz * scale
  }

  position.copy(next)
"""
          new = """  const damping = requested.lengthSq() > 0 ? acceleration : deceleration
  // Preserve real elapsed movement on slow devices without allowing an unbounded
  // background-tab jump. Integrating in 50 ms substeps keeps damping and collision
  // behavior stable instead of discarding all frame time above the old hard clamp.
  let remainingDelta = Math.min(delta, 0.25)
  while (remainingDelta > 0) {
    const stepDelta = Math.min(remainingDelta, 0.05)
    velocity.x = THREE.MathUtils.damp(velocity.x, requested.x, damping, stepDelta)
    velocity.z = THREE.MathUtils.damp(velocity.z, requested.z, damping, stepDelta)

    const next = MOTION_NEXT.copy(position).addScaledVector(velocity, stepDelta)
    next.x = THREE.MathUtils.clamp(next.x, bounds.minX, bounds.maxX)
    next.z = THREE.MathUtils.clamp(next.z, bounds.minZ, bounds.maxZ)

    for (const obstacle of obstacles) {
      const dx = next.x - obstacle.x
      const dz = next.z - obstacle.z
      const distance = Math.hypot(dx, dz)
      if (distance >= obstacle.radius || distance === 0) continue
      const scale = obstacle.radius / distance
      next.x = obstacle.x + dx * scale
      next.z = obstacle.z + dz * scale
    }

    position.copy(next)
    remainingDelta -= stepDelta
  }
"""
          if old not in text:
              raise SystemExit('motion kernel target block not found')
          navigation.write_text(text.replace(old, new, 1))

          home = Path('urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx')
          text = home.read_text()
          old_copy = "WASD / arrows · click ground · drag to look"
          new_copy = "WASD or arrows move · click ground · drag to look"
          if old_copy not in text:
              raise SystemExit('Home movement copy target not found')
          home.write_text(text.replace(old_copy, new_copy, 1))
          PY

          rm .github/workflows/apply-home-low-fps-accessibility-repair.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx .github/workflows/apply-home-low-fps-accessibility-repair.yml
          git commit -m "fix: preserve Home movement at low frame rates"
          git push origin HEAD:fix/home-visible-spatial-world-20260719
