    </group>

    <group name="home-v32-depth-envelope" userData={{treatment:'v34-recessed-side-bays-and-practical-depth'}}>
      <RecessedPractical position={[-5.2,0.42,2.15]} />
      <RecessedPractical position={[5.25,0.42,1.25]} warm={false} />
      <RecessedPractical position={[-4.95,0.42,-5.6]} warm={false} />
      <RecessedPractical position={[4.8,0.42,-5.05]} />
    </group>
  </group>
}

function SanctuaryGlazing(){'''

          source, count = re.subn(r"function PointedArchMass\([\s\S]*?\nfunction SanctuaryGlazing\(\)\{", architecture, source, count=1)
          assert count == 1, f'architecture replacement count={count}'

          machine = r'''function OrbPlatform(){
  const shoes:readonly [Vec3,Vec3][]=[
    [[-1.42,0.12,-1.78],[0,0.1,-0.08]],
