name: V34 Authored Sanctuary Machine

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/v34-authored-sanctuary-machine.yml'
      - 'scripts/v34-authored-sanctuary-transform.py'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout exact owner candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Align transform preconditions with live V33 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx')
          source=path.read_text()
          pairs={
            '<ambientLight intensity={0.24} color="#d6dbd4" />':'<ambientLight intensity={0.34} color="#d6dbd4" />',
            "<hemisphereLight args={['#819c97','#111612',0.38]} />":"<hemisphereLight args={['#819c97','#111612',0.52]} />",
            '<directionalLight position={[-10,15,8]} intensity={0.52} color="#d9d7cb" />':'<directionalLight position={[-10,15,8]} intensity={0.72} color="#d9d7cb" />',
            '<directionalLight position={[9,8,-10]} intensity={0.34} color="#608783" />':'<directionalLight position={[9,8,-10]} intensity={0.48} color="#608783" />',
            '<spotLight position={[-1.5,8.8,4.8]} intensity={1.72}':'<spotLight position={[-1.5,8.8,4.8]} intensity={2.45}',
            '<pointLight position={[0,3.0,-2.8]} intensity={0.34}':'<pointLight position={[0,3.0,-2.8]} intensity={0.58}',
            'data-home-final-art-revision="v33-angular-reliquary-sanctuary-final"':'data-home-final-art-revision="v33-buttressed-reliquary-sanctuary-final"',
            'data-home-art-certification="v33-pending-retained-pixel-certification"':'data-home-art-certification="v33-production-final"',
          }
          for old,new in pairs.items():
            assert old in source, f'live V33 precondition missing: {old}'
            source=source.replace(old,new,1)
          path.write_text(source)
          PY

      - name: Apply V34 source transform
        run: python3 scripts/v34-authored-sanctuary-transform.py

      - name: Verify V34 contracts and production build
        shell: bash
        run: |
          set -euo pipefail
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          grep -F 'v34-authored-stone-sanctuary-final' "$source"
          grep -F 'v34-sanctuary-scale-mechanical-reliquary-assembly' "$source"
          grep -F 'v34-segmented-spindle-reactor-integrated-with-cradle' "$source"
          grep -F 'data-home-art-certification="v34-production-final"' "$source"
          cd urai-tier1
          node --test --test-concurrency=1 tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs tests/continuous-spatial-restoration-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs
          cd ..
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:static

      - name: Commit V34 source only if branch is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git diff --cached --quiet && { echo 'No V34 source changes to commit'; exit 1; }
          git commit -m 'Complete V34 authored sanctuary relic-machine rebuild'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826
