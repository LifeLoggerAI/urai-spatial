name: V34 Authored Sanctuary Machine

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/v34-authored-sanctuary-machine.yml'

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - name: Checkout exact owner candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply V34 authored sanctuary and integrated machine rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx')
          source = path.read_text()

          architecture = r'''function PointedArchMass({pack,position,rotation=[0,0,0],width,height,depth,openingWidth,openingHeight,color='#171d1a',metalness=0.06,roughness=0.76}:{pack:SurfacePack;position:Vec3;rotation?:Vec3;width:number;height:number;depth:number;openingWidth:number;openingHeight:number;color?:string;metalness?:number;roughness?:number}) {
  const geometry = useMemo(() => {
    const shape = new THREE.Shape()
    shape.moveTo(-width/2,0)
    shape.lineTo(width/2,0)
    shape.lineTo(width/2,height*0.64)
    shape.quadraticCurveTo(width*0.44,height*0.84,0,height)
    shape.quadraticCurveTo(-width*0.44,height*0.84,-width/2,height*0.64)
    shape.lineTo(-width/2,0)
    const hole = new THREE.Path()
    hole.moveTo(-openingWidth/2,0)
    hole.lineTo(-openingWidth/2,openingHeight*0.62)
    hole.quadraticCurveTo(-openingWidth*0.38,openingHeight*0.84,0,openingHeight)
    hole.quadraticCurveTo(openingWidth*0.38,openingHeight*0.84,openingWidth/2,openingHeight*0.62)
    hole.lineTo(openingWidth/2,0)
    hole.lineTo(-openingWidth/2,0)
    shape.holes.push(hole)
    const geo = new THREE.ExtrudeGeometry(shape,{depth,steps:1,curveSegments:8,bevelEnabled:true,bevelSegments:3,bevelSize:0.055,bevelThickness:0.055})
    geo.center()
    geo.computeVertexNormals()
    return geo
  },[depth,height,openingHeight,openingWidth,width])
  useEffect(()=>()=>geometry.dispose(),[geometry])
  return <mesh geometry={geometry} position={position as [number,number,number]} rotation={rotation as [number,number,number]} castShadow receiveShadow><meshPhysicalMaterial color={color} map={pack.color} normalMap={pack.normal} normalScale={new THREE.Vector2(0.34,0.34)} roughnessMap={pack.arm} roughness={roughness} metalness={metalness} clearcoat={0.025} clearcoatRoughness={0.82} envMapIntensity={0.48} /></mesh>
}

function ButtressMass({pack,position,rotation=[0,0,0],height=4.4,width=1.25,depth=1.6,color='#202724'}:{pack:SurfacePack;position:Vec3;rotation?:Vec3;height?:number;width?:number;depth?:number;color?:string}) {
  const geometry = useMemo(() => {
    const shape = new THREE.Shape()
    shape.moveTo(-width*0.56,-height*0.5)
    shape.lineTo(width*0.58,-height*0.5)
    shape.lineTo(width*0.47,-height*0.12)
    shape.lineTo(width*0.31,height*0.34)
    shape.lineTo(width*0.12,height*0.5)
    shape.lineTo(-width*0.18,height*0.46)
    shape.lineTo(-width*0.38,height*0.08)
    shape.lineTo(-width*0.56,-height*0.5)
    const geo = new THREE.ExtrudeGeometry(shape,{depth,steps:1,curveSegments:2,bevelEnabled:true,bevelSegments:3,bevelSize:0.06,bevelThickness:0.06})
    geo.center()
    geo.computeVertexNormals()
    return geo
  },[depth,height,width])
  useEffect(()=>()=>geometry.dispose(),[geometry])
  return <group position={position as [number,number,number]} rotation={rotation as [number,number,number]}>
    <mesh geometry={geometry} castShadow receiveShadow><meshPhysicalMaterial color={color} map={pack.color} normalMap={pack.normal} normalScale={new THREE.Vector2(0.3,0.3)} roughnessMap={pack.arm} roughness={0.78} metalness={0.05} clearcoat={0.02} clearcoatRoughness={0.84} envMapIntensity={0.46} /></mesh>
    <mesh position={[0,-height*0.22,depth*0.51]} rotation={[0.1,0,0]} scale={[width*0.34,0.055,width*0.18]} castShadow><octahedronGeometry args={[1,0]} /><meshStandardMaterial color="#665e4e" roughness={0.46} metalness={0.5} envMapIntensity={0.62} /></mesh>
  </group>
}

