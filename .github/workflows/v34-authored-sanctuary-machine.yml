function MachineLink({from,to,thickness=0.18,color='#68746e'}:{from:Vec3;to:Vec3;thickness?:number;color?:string}){
  const {mid,quat,length}=useMemo(()=>{const a=new THREE.Vector3(...from),b=new THREE.Vector3(...to),d=b.clone().sub(a),length=d.length(),mid=a.clone().add(b).multiplyScalar(0.5),quat=new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1),d.normalize());return{mid,quat,length}},[from,to])
  return <mesh position={mid} quaternion={quat} castShadow receiveShadow><boxGeometry args={[thickness,thickness*0.68,length]} /><meshPhysicalMaterial color={color} roughness={0.4} metalness={0.68} clearcoat={0.035} clearcoatRoughness={0.46} envMapIntensity={0.68} /></mesh>
}

function ReliquaryHousing({position,rotation=[0,0,0],tone='#26342f',accent='#596b63'}:{position:Vec3;rotation?:Vec3;tone?:string;accent?:string}) {
