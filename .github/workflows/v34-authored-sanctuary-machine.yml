function SacredOrb({state,reducedMotion,onOpen}:{state:OrbState;reducedMotion:boolean;onOpen:()=>void}){
  const root=useRef<THREE.Group>(null),authoredCore=useRef<THREE.Group>(null),activeAction=useRef<THREE.AnimationAction|null>(null); const orb=useGLTF(ORB_MODEL); const authoredOrb=useMemo(()=>cloneOrbModel(orb.scene),[orb.scene]); const {actions}=useAnimations(orb.animations,authoredOrb); const sensory=useMemo(()=>resolveOrbSensoryOutput(state,reducedMotion,true),[state,reducedMotion])
  useEffect(()=>{const allActions=Object.values(actions).filter((action):action is THREE.AnimationAction=>Boolean(action));if(reducedMotion){allActions.forEach((action)=>action.stop());activeAction.current=null;return}const next=actions[ORB_CLIPS[state]];if(!next)return;const previous=activeAction.current;if(previous&&previous!==next)previous.fadeOut(0.2);next.reset().setLoop(THREE.LoopRepeat,Infinity).fadeIn(0.2).play();activeAction.current=next},[actions,reducedMotion,state]); useEffect(()=>()=>{Object.values(actions).forEach((action)=>action?.stop())},[actions])
  useFrame(()=>{if(!root.current)return;root.current.rotation.y=0;root.current.position.y=ORB.y;if(authoredCore.current)authoredCore.current.scale.setScalar(0.035)})
  const stateColor=state==='warning'?'#d69a62':state==='thinking'||state==='reflecting'?'#90a0c9':'#80cbc2'; const intensity=state==='speaking'?1.18:state==='listening'?1.02:0.82
  return <group ref={root} name="home-orb-sanctuary" position={ORB} onClick={(event)=>{event.stopPropagation();onOpen()}} userData={{orbState:state,animation:sensory.animation,modelClip:ORB_CLIPS[state],runtimeAsset:ORB_MODEL,treatment:'v34-segmented-spindle-reactor-integrated-with-cradle'}}>
    <group ref={authoredCore} scale={0.035} name="home-orb-authored-core"><primitive object={authoredOrb} visible={false} /></group>
    <group name="home-orb-engineered-body" rotation={[0.02,0.16,-0.01]}>
      <mesh name="home-orb-faceted-reactor" scale={[0.62,1.05,0.58]} castShadow receiveShadow><cylinderGeometry args={[0.52,0.68,1.65,8,1,false]} /><meshPhysicalMaterial color="#13201c" emissive={stateColor} emissiveIntensity={intensity*0.015} roughness={0.42} metalness={0.72} clearcoat={0.045} clearcoatRoughness={0.48} envMapIntensity={0.72} /></mesh>
      <mesh position={[0,0.9,0]} scale={[0.68,0.42,0.64]} castShadow><octahedronGeometry args={[0.72,0]} /><meshPhysicalMaterial color="#34463e" roughness={0.34} metalness={0.76} envMapIntensity={0.72} /></mesh>
      <mesh position={[0,-0.92,0]} scale={[0.72,0.38,0.66]} rotation={[0.08,0.16,0]} castShadow><octahedronGeometry args={[0.72,0]} /><meshPhysicalMaterial color="#4f493a" roughness={0.36} metalness={0.72} envMapIntensity={0.7} /></mesh>
      {([[-0.62,0.28,0.1],[0.62,0.28,0.1],[-0.52,-0.34,-0.12],[0.52,-0.34,-0.12]] as Vec3[]).map((position,index)=><RoundedBox key={`reactor-plate-${index}`} args={[0.28,0.78,0.5]} radius={0.06} smoothness={3} position={position as [number,number,number]} rotation={[0,index%2===0?0.22:-0.22,index%2===0?-0.22:0.22]} castShadow><meshPhysicalMaterial color={index%2===0?'#2b3d36':'#4e493a'} roughness={0.34} metalness={0.74} envMapIntensity={0.72} /></RoundedBox>)}
      <mesh name="home-orb-energy-aperture" position={[0,0.08,0.61]} scale={[0.18,0.32,0.08]}><octahedronGeometry args={[1,0]} /><meshBasicMaterial color={stateColor} transparent opacity={0.42} toneMapped={false} /></mesh>
      <MachineLink from={[-0.48,0.62,0.1]} to={[0.48,0.62,0.1]} thickness={0.12} color="#5d6d65" />
      <MachineLink from={[-0.46,-0.58,-0.08]} to={[0.46,-0.58,-0.08]} thickness={0.12} color="#70664f" />
    </group>
    <pointLight color={stateColor} intensity={intensity*0.22} distance={3.5} decay={2} />
