    <RoundedBox args={[1.1,1.72,1.2]} radius={0.16} smoothness={5} castShadow receiveShadow><meshPhysicalMaterial color={tone} roughness={0.42} metalness={0.62} clearcoat={0.05} clearcoatRoughness={0.48} envMapIntensity={0.7} /></RoundedBox>
    <mesh position={[0,0.36,0.66]} rotation={[Math.PI/2,0,0]} castShadow><cylinderGeometry args={[0.34,0.4,0.2,8,1,false]} /><meshStandardMaterial color={accent} metalness={0.72} roughness={0.34} envMapIntensity={0.72} /></mesh>
    <mesh position={[0,-0.52,0.64]} scale={[0.42,0.16,0.1]} castShadow><octahedronGeometry args={[1,0]} /><meshStandardMaterial color="#756b55" metalness={0.64} roughness={0.4} /></mesh>
