name: Expansion Prebuild Verify

on:
  pull_request:
    paths:
      - "expansion/**"
      - ".github/workflows/expansion-prebuild-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify hard-off expansion registry
        run: node expansion/registry/validate-registry.mjs
      - name: Verify EWI synthetic conformance
        run: node expansion/ewi/conformance.test.mjs
      - name: Verify V2 Living World dormant state contract
        run: node expansion/v2-living-world/state-machine.test.mjs
      - name: Verify V3 relationship controls
        run: node expansion/v3-relationships/relationship-graph.test.mjs
