name: Presence Content Language

on:
  pull_request:
    branches: [main, 'converge/**', 'integration/**', 'repair/release-closure-integration-20261007', 'repair/localization-content-routing-20261007']
    paths:
      - '.github/workflows/presence-content-language.yml'
      - 'packages/localization/src/contentLanguage.ts'
      - 'apps/functions/src/adamPresenceFunctions.ts'
      - 'apps/functions/src/personPresenceProvider.ts'
      - 'apps/functions/src/personPresenceAuthority.ts'
      - 'urai-tier1/tests/presence-content-language.test.mjs'
      - 'urai-tier1/tests/adam-presence-runtime-contract.test.mjs'
      - 'urai-tier1/tests/person-presence-provider-contract.test.mjs'
      - 'brand/PRESENCE_CONTENT_LANGUAGE_HANDOFF.md'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}

jobs:
  presence-language:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prove exact clean source
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Test actual server language handlers and retained presence contracts without provider requests
        run: |
          set -euo pipefail
          mkdir -p artifacts/presence-content-language
          pnpm --dir urai-tier1 exec node --import tsx --test \
            tests/presence-content-language.test.mjs \
            tests/adam-presence-runtime-contract.test.mjs \
            tests/person-presence-provider-contract.test.mjs \
            2>&1 | tee artifacts/presence-content-language/tests.log
      - name: Compile the complete actual Functions project
        run: |
          set -euo pipefail
          pnpm --dir apps/functions run build 2>&1 | tee artifacts/presence-content-language/functions-build.log
      - name: Retain exact source receipt without language or voice acceptance
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          head = os.environ['URAI_EXACT_HEAD']
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == head
          paths = [
            'packages/localization/src/contentLanguage.ts',
            'apps/functions/src/adamPresenceFunctions.ts',
            'apps/functions/src/personPresenceProvider.ts',
            'apps/functions/src/personPresenceAuthority.ts',
            'urai-tier1/tests/presence-content-language.test.mjs',
            'urai-tier1/tests/adam-presence-runtime-contract.test.mjs',
            'urai-tier1/tests/person-presence-provider-contract.test.mjs',
            '.github/workflows/presence-content-language.yml',
            'brand/PRESENCE_CONTENT_LANGUAGE_HANDOFF.md',
          ]
          receipt = {
            'source_sha':head, 'run_id':os.environ['GITHUB_RUN_ID'], 'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'source_sha256':{path:hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in paths},
            'synthetic_server_tests_and_functions_compilation_passed':True,
            'provider_requests_performed':False, 'protected_runtime_accepted':False,
            'native_translation_review_granted':False, 'voice_identity_accepted':False, 'release_certified':False,
          }
          pathlib.Path('artifacts/presence-content-language/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Upload exact source diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: presence-content-language-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/presence-content-language
          if-no-files-found: error
          retention-days: 365
