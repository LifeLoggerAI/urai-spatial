name: Replay Focus Return Lifecycle Proof (Non-release)
on:
  push:
    branches: [codex/replay-focus-lifecycle-20261012]
  pull_request:
    branches: [codex/combine-current-visual-7e794e-20261010]
permissions:
  contents: read
env:
  URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_PUBLIC_URAI_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  focus-return-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact repair source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify source and release guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          node -e "if (require('./operations/assets/launch-critical-assets.json').releasePolicy.candidateAssetsMayShip !== false) process.exit(1)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build real source and install Chromium
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:static
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Test mobile Replay return, focus, and repeated lifecycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/replay-focus-return
          set +e
          FORCE_COLOR=0 pnpm exec playwright test --config playwright.accessibility.config.ts \
            urai-tier1/tests/accessibility-performance-replay.spec.ts \
            --grep 'no-WebGL demo remains truthful|Focus keyboard restoration survives two Replay exits' \
            --trace on 2>&1 | tee artifacts/replay-focus-return/real-browser.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -Eq '(^|[[:space:]])[1-9][0-9]* flaky([[:space:]]|$)' artifacts/replay-focus-return/real-browser.log; then
            exit 86
          fi
          exit "$status"
      - name: Retain real browser trace and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-focus-return-${{ env.URAI_EXACT_HEAD }}
          path: |
            artifacts/replay-focus-return/
            artifacts/accessibility-performance/playwright-report/
            artifacts/accessibility-performance/test-results/
          if-no-files-found: warn
          retention-days: 90
