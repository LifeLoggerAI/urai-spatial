name: Export Spatial E2E Source

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v4
        with:
          name: spatial-e2e-source-${{ env.URAI_EXACT_HEAD }}
          path: |
            tests/spatial-lock.mjs
            .github/workflows/urai-spatial-ci.yml
          if-no-files-found: error
          retention-days: 7
