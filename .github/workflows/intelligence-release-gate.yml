name: URAI Intelligence Release Gate

on:
  pull_request:
    paths:
      - 'operations/intelligence/**'
      - 'scripts/verify-intelligence-release-gate.mjs'
      - '.github/workflows/intelligence-release-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-intelligence-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact clean candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic intelligence release gate
        run: node scripts/verify-intelligence-release-gate.mjs
