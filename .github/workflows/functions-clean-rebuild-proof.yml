name: Functions Exact-Head Clean Rebuild & Offline Firebase Package Proof

on:
  pull_request:
    paths:
      - 'apps/functions/**'
      - 'packages/tier-locks/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'firebase.json'
      - 'scripts/verify_functions_source_archive.py'
      - 'scripts/test_verify_functions_source_archive.py'
      - 'scripts/prove-firebase-functions-package.mjs'
      - 'scripts/prove-firebase-functions-package.test.mjs'
      - '.github/workflows/functions-clean-rebuild-proof.yml'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact Git SHA to verify, no deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: urai-functions-clean-rebuild-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || inputs.verification_sha || github.sha }}
  cancel-in-progress: false

env:
  URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || inputs.verification_sha || github.sha }}
  CI: 'true'
  FIREBASE_CLI_DISABLE_USAGE_REPORTING: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  offline-functions-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Establish source authority before installing
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          case "$(git remote get-url origin)" in https://github.com/LifeLoggerAI/urai-spatial|https://github.com/LifeLoggerAI/urai-spatial.git) ;; *) exit 1;; esac
          test "$(node -p 'require("./package.json").packageManager')" = 'pnpm@10.0.0'
          test "$(node -p 'require("./firebase.json").functions.source')" = 'apps/functions'
      - name: Setup pnpm 10.0.0
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node 22 and reuse frozen pnpm store
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact locked workspace and compile genuine Functions
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version | cut -d. -f1)" = 'v22'
          test "$(pnpm --version)" = '10.0.0'
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter urai-functions build
          test -s apps/functions/lib/apps/functions/src/index.js
          git diff --exit-code -- package.json pnpm-lock.yaml pnpm-workspace.yaml firebase.json apps/functions/package.json apps/functions/tsconfig.json
      - name: Install isolated original deploy-version Firebase packager (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firebase-cli-v15" "$RUNNER_TEMP/urai-functions-proof"
          npm install --prefix "$RUNNER_TEMP/firebase-cli-v15" --no-audit --no-fund --ignore-scripts --no-save --package-lock=false firebase-tools@15.22.3
          test "$(node -p 'require(process.argv[1]).version' "$RUNNER_TEMP/firebase-cli-v15/node_modules/firebase-tools/package.json")" = '15.22.3'
      - name: Prepare exact Gen-2 ZIP through native Firebase CLI without upload
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/prove-firebase-functions-package.mjs
          node --test scripts/prove-firebase-functions-package.test.mjs
          node scripts/prove-firebase-functions-package.mjs \
            --repo-root "$GITHUB_WORKSPACE" \
            --cli-root "$RUNNER_TEMP/firebase-cli-v15" \
            --archive "$RUNNER_TEMP/urai-functions-proof/functions-source.zip" \
            --receipt "$RUNNER_TEMP/urai-functions-proof/cli-package-receipt.json" \
            --expected-sha "$URAI_EXACT_HEAD"
      - name: Independently replay exact reviewed Functions build offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_verify_functions_source_archive.py'
          python3 scripts/verify_functions_source_archive.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-dir "$GITHUB_WORKSPACE/apps/functions" \
            --archive "$RUNNER_TEMP/urai-functions-proof/functions-source.zip" \
            --expected-sha "$URAI_EXACT_HEAD" --rebuild-generated \
            > "$RUNNER_TEMP/urai-functions-proof/rebuild-receipt.json"
          python3 - <<'PY'
          import json, os, pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'urai-functions-proof'
          build=json.loads((root/'rebuild-receipt.json').read_text())
          cli=json.loads((root/'cli-package-receipt.json').read_text())
          assert build['checkoutSha']==cli['sourceSha']==os.environ['URAI_EXACT_HEAD']
          assert build['archiveSha256']==cli['archiveSha256']
          assert build['archiveFormat']=='zip' and cli['firebaseCliVersion']=='15.22.3'
          assert build['generatedOutputBuildVerified'] and build['toolchainVerifiedByOfflineRebuild']
          assert build['independentlyRebuiltFileCount']>0 and build['reviewedInputFileCount']>0
          assert all(build[k] is False for k in ('trustedUploadVerified','cloudStorageGenerationVerified','cloudBuildVerified','servingRevisionVerified','stagingAdmission','productionAcceptance'))
          assert all(cli[k] is False for k in ('trustedCloudUploadVerified','cloudStorageGenerationVerified','cloudBuildSourceVerified','cloudRunRevisionVerified','stagingMediaAccepted','releaseCertified'))
          assert build['status']=='OFFLINE_PACKAGE_BYTES_MATCH_ONLY'
          (root/'acceptance-boundary.txt').write_text('REVIEWED_SOURCE_BUILD_VERIFIED local offline only; CLOUD_UPLOAD/BUILD/REVISION/J9/RELEASE NOT VERIFIED\n')
          print(json.dumps({'replay':'REVIEWED_SOURCE_BUILD_VERIFIED_OFFLINE_ONLY','archiveSha256':build['archiveSha256'],'manifestSha256':build['entryManifestSha256'],'generatedFileCount':build['independentlyRebuiltFileCount'],'packagedDependencyLockPresent':build['packagedDependencyLockPresent']},sort_keys=True))
          PY
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          git diff --exit-code HEAD
      - name: Retain sanitized local-only identities (no source ZIP or credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-functions-clean-rebuild-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/urai-functions-proof/cli-package-receipt.json
            ${{ runner.temp }}/urai-functions-proof/rebuild-receipt.json
            ${{ runner.temp }}/urai-functions-proof/acceptance-boundary.txt
          if-no-files-found: warn
          retention-days: 90
