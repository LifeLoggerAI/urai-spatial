name: Council Authenticated Browser Emulator Proof (Non-release)
on:
  pull_request:
    paths:
      - '.github/workflows/council-authenticated-browser-emulator.yml'
      - 'scripts/prove-council-authenticated-browser.mjs'
      - 'urai-tier1/src/spatial/council/**'
      - 'urai-tier1/src/spatial/memory/**'
      - 'urai-tier1/src/lib/privacy/aiActorBoundary.ts'
      - 'urai-tier1/src/lib/firebase/client.ts'
      - 'firebase.captured-reality-emulator.json'
      - 'firebase/firestore.rules'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: council-auth-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  authenticated-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-urai-council-browser
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - name: Verify exact SHA and isolated project
        run: |
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test "$GCLOUD_PROJECT" = demo-urai-council-browser
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies and Chromium
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Run authenticated real React and Firebase emulator browser proof
        run: |
          pnpm exec firebase emulators:exec --project demo-urai-council-browser --only auth,firestore --config firebase.captured-reality-emulator.json 'node scripts/prove-council-authenticated-browser.mjs'
      - name: Upload redacted receipt and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: council-auth-browser-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/council-authenticated-browser/
          if-no-files-found: warn
          retention-days: 45
