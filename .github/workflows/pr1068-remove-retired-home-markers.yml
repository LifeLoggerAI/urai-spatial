name: PR1068 Remove Retired Home Markers

on:
  push:
    branches:
      - agent/replace-failed-home-lifemap-visuals
    paths:
      - .github/workflows/pr1068-remove-retired-home-markers.yml

permissions:
  contents: write

concurrency:
  group: pr1068-remove-retired-home-markers
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/replace-failed-home-lifemap-visuals
          fetch-depth: 1
      - name: Remove retired Home ownership markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('urai-tier1/src/spatial/layout/HomeWorldProduction.tsx')
          text = path.read_text()
          replacements = {
              '      data-home-asset-mode={assetMode}\n': '',
              '      data-home-personalization-mode="private-personalized"\n': '',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected retired marker: {old.strip()}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          grep -q 'data-home-review-fixture={reviewFixture}' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          ! grep -q 'data-home-asset-mode=' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          ! grep -q 'data-home-personalization-mode=' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
      - name: Commit exact source correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          git diff --cached --check
          git commit -m 'Remove retired Home owner markers'
          git push origin HEAD:agent/replace-failed-home-lifemap-visuals
