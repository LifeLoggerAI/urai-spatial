name: Main Deploy Run Inspector

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/main-deploy-inspector.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query main commit workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const headSha = '1d25dc06234c22af30d725fbc8ab98ea10a6233e'
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: headSha,
              per_page: 100,
            })
            const runs = response.data.workflow_runs.map((run) => ({
              id: run.id,
              name: run.name,
              path: run.path,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              run_number: run.run_number,
              head_sha: run.head_sha,
              html_url: run.html_url,
              created_at: run.created_at,
              updated_at: run.updated_at,
            }))
            fs.writeFileSync('main-deploy-runs.json', JSON.stringify({ headSha, runs }, null, 2))
      - name: Download failed deploy job logs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for item in \
            'live-check 85094917882' \
            'static-deploy 85094917928'
          do
            name="${item%% *}"
            job_id="${item##* }"
            curl --fail --location --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
              --output "${name}.log"
            tail -n 300 "${name}.log" > "${name}-tail.log"
          done
      - name: Upload main deploy report
        uses: actions/upload-artifact@v4
        with:
          name: main-deploy-run-report
          path: |
            main-deploy-runs.json
            live-check-tail.log
            static-deploy-tail.log
          if-no-files-found: error
          retention-days: 7
