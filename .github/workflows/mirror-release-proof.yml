name: Mirror Release Proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-release-proof-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_PROOF_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  URAI_AUDIT_BASE_URL: http://127.0.0.1:4173
  URAI_MIRROR_PROOF_OUT_DIR: mirror-release-proof
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_PUBLIC_URAI_ACCEPTANCE_FIXTURES: '1'

jobs:
  mirror-release-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_PROOF_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_PROOF_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build exact static candidate
        run: pnpm build:static

      - name: Serve exact static candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > /tmp/urai-mirror-release-proof.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent "http://127.0.0.1:4173/mirror/?memoryId=demo%3Aquiet-reset&demo=1" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/urai-mirror-release-proof.log
          exit 1

      - name: Install exact Chromium
        run: pnpm --dir urai-tier1 exec playwright install chromium --with-deps

      - name: Prove Mirror release candidate
        run: node tests/mirror-release-proof-runner.mjs

      - name: Prove mobile inspection is unobstructed
        run: node tests/mirror-mobile-inspection-proof.mjs

      - name: Upload Mirror release proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mirror-release-proof-${{ env.URAI_PROOF_SOURCE_SHA }}
          path: mirror-release-proof
          if-no-files-found: error
          # Public-repository GitHub artifact retention is capped at 90 days.
          # Longer-lived evidence requires a separately verified durable archive.
          retention-days: 90
