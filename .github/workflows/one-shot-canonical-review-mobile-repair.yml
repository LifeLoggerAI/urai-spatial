name: One-shot canonical review mobile repair

on:
  push:
    branches:
      - fix/canonical-review-mobile-a7146e3c-20260718
  pull_request:
    branches:
      - feat/home-ground-lifemap-art-bible-convergence-20260718
    paths:
      - .github/workflows/one-shot-canonical-review-mobile-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/canonical-review-mobile-a7146e3c-20260718
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded canonical repairs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          function replaceOnce(path, before, after) {
            const source = fs.readFileSync(path, 'utf8')
            const matches = source.split(before).length - 1
            if (matches !== 1) throw new Error(`${path}: expected one match, found ${matches}`)
            fs.writeFileSync(path, source.replace(before, after))
          }

          replaceOnce(
            'urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx',
            `  const textureResolution = selected
    ? profile.tier === "high" ? 512 : 384
    : overview
      ? profile.tier === "high" ? 128 : 96
      : related
        ? profile.tier === "high" ? 224 : 160
        : 80;`,
            `  const textureResolution = selected
    ? profile.tier === "high" ? 512 : 384
    : profile.tier === "high" ? 128 : 96;`
          )

          replaceOnce(
            'urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx',
            `    update()
    media.addEventListener?.('change', update)
    return () => media.removeEventListener?.('change', update)`,
            `    update()
    if (media.addEventListener) {
      media.addEventListener('change', update)
      return () => media.removeEventListener('change', update)
    }
    media.addListener(update)
    return () => media.removeListener(update)`
          )

          replaceOnce(
            'urai-tier1/src/app/GroundSpatialWorldClean.tsx',
            `    update();
    query.addEventListener?.("change", update);
    return () => query.removeEventListener?.("change", update);`,
            `    update();
    if (query.addEventListener) {
      query.addEventListener("change", update);
      return () => query.removeEventListener("change", update);
    }
    query.addListener(update);
    return () => query.removeListener(update);`
          )

          replaceOnce(
            'urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx',
            `  const damping = requested.lengthSq() > 0 ? acceleration : deceleration
  velocity.x = THREE.MathUtils.damp(velocity.x, requested.x, damping, delta)
  velocity.z = THREE.MathUtils.damp(velocity.z, requested.z, damping, delta)

  const next = MOTION_NEXT.copy(position).addScaledVector(velocity, Math.min(delta, 0.05))`,
            `  const damping = requested.lengthSq() > 0 ? acceleration : deceleration
  const clampedDelta = Math.min(delta, 0.05)
  velocity.x = THREE.MathUtils.damp(velocity.x, requested.x, damping, clampedDelta)
  velocity.z = THREE.MathUtils.damp(velocity.z, requested.z, damping, clampedDelta)

  const next = MOTION_NEXT.copy(position).addScaledVector(velocity, clampedDelta)`
          )

          replaceOnce(
            'urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx',
            `.urai-home-movement-prompt{bottom:max(142px,calc(env(safe-area-inset-bottom) + 132px));min-width:min(310px,calc(100vw - 24px))}`,
            `.urai-home-movement-prompt{bottom:max(202px,calc(env(safe-area-inset-bottom) + 192px));min-width:min(310px,calc(100vw - 24px))}`
          )

          replaceOnce(
            'scripts/capture-continuous-spatial-proof.mjs',
            `      const firstHomeFrameMarked = await page.evaluate(() => performance.getEntriesByName('urai:first-home-spatial-frame').length > 0)
      const canvas = await canvasEvidence(page, '[data-home-spatial-renderer="webgl"] canvas')`,
            `      const firstHomeFrameMarked = await page.evaluate(() => performance.getEntriesByName('urai:first-home-spatial-frame').length > 0)
      const mobileControlsDoNotOverlapPrompt = await page.evaluate(() => {
        if (window.innerWidth > 700) return true
        const prompt = document.querySelector('.urai-home-movement-prompt')
        const pad = document.querySelector('.urai-mobile-movement')
        if (!prompt || !pad) return false
        const promptRect = prompt.getBoundingClientRect()
        const padRect = pad.getBoundingClientRect()
        return promptRect.bottom <= padRect.top - 12
      })
      const canvas = await canvasEvidence(page, '[data-home-spatial-renderer="webgl"] canvas')`
          )
          replaceOnce(
            'scripts/capture-continuous-spatial-proof.mjs',
            `        firstHomeFrameMarked,
        authoredSceneMounted,`,
            `        firstHomeFrameMarked,
        mobileControlsDoNotOverlapPrompt,
        authoredSceneMounted,`
          )
          NODE

      - name: Prove focused contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq ': profile.tier === "high" ? 128 : 96;' urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx
          grep -Fq "media.addListener(update)" urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx
          grep -Fq "query.addListener(update);" urai-tier1/src/app/GroundSpatialWorldClean.tsx
          grep -Fq "const clampedDelta = Math.min(delta, 0.05)" urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx
          grep -Fq "bottom:max(202px,calc(env(safe-area-inset-bottom) + 192px))" urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx
          grep -Fq "mobileControlsDoNotOverlapPrompt" scripts/capture-continuous-spatial-proof.mjs
          git diff --check
          rm .github/workflows/one-shot-canonical-review-mobile-repair.yml

      - name: Commit clean repaired product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(spatial): consolidate review and mobile evidence repairs'
          git push origin HEAD:fix/canonical-review-mobile-a7146e3c-20260718

