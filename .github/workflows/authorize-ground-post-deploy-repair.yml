name: Authorize Ground post-deploy repair contract

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/authorize-ground-post-deploy-repair.yml
      - scripts/one-shot-authorize-ground-post-deploy.mjs

permissions:
  contents: write

concurrency:
  group: authorize-ground-post-deploy-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  SOURCE_BRANCH: product/canonical-seven-fix-clean-r3-20260718

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'product/canonical-seven-fix-clean-r3-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Authorize exact eighth repair file
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node scripts/one-shot-authorize-ground-post-deploy.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            .github/workflows/lifemap-fullscreen-selected-actions.yml \
            .github/workflows/lifemap-route-dom-source-diagnostic.yml | sort)"

      - name: Publish and self-remove authority tooling
        run: |
          set -euo pipefail
          git rm .github/workflows/authorize-ground-post-deploy-repair.yml scripts/one-shot-authorize-ground-post-deploy.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ci): authorize post-deploy Ground smoke repair"
          git push origin HEAD:refs/heads/$SOURCE_BRANCH
