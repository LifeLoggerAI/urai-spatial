name: Presence Client Content Language
on:
  pull_request:
    paths:
      - '.github/workflows/presence-client-content-language.yml'
      - 'packages/localization/src/contentLanguage.ts'
      - 'urai-tier1/src/lib/i18n/contentLanguage.ts'
      - 'urai-tier1/src/lib/i18n/presenceContentStream.ts'
      - 'urai-tier1/src/spatial/adam/adamClient.ts'
      - 'urai-tier1/src/spatial/adam/AdamPresenceRuntime.tsx'
      - 'urai-tier1/src/spatial/life-model/personPresenceClient.ts'
      - 'urai-tier1/src/spatial/life-model/personPresenceVoiceClient.ts'
      - 'urai-tier1/src/app/replay/ReplayPersonPresence.tsx'
      - 'urai-tier1/tests/presence-client-content-language.test.mjs'
      - 'urai-tier1/tests/adam-client-language-ui.test.mjs'
      - 'urai-tier1/tests/replay-person-presence-lifecycle.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: presence-client-language-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  client-language:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean source
        run: |
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Validate actual clients, captured UI language and privacy lifecycle without provider calls
        run: |
          set -euo pipefail
          mkdir -p artifacts/presence-client-language
          pnpm --dir urai-tier1 exec node --import tsx --test tests/presence-client-content-language.test.mjs tests/adam-client-language-ui.test.mjs tests/replay-person-presence-lifecycle.test.mjs tests/adam-presence-runtime-contract.test.mjs tests/replay-person-presence-ui.test.mjs tests/person-presence-voice-contract.test.mjs 2>&1 | tee artifacts/presence-client-language/tests.log
          pnpm --dir urai-tier1 typecheck 2>&1 | tee artifacts/presence-client-language/typecheck.log
      - name: Retain exact source diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: presence-client-language-${{ env.EXACT_HEAD }}
          path: artifacts/presence-client-language
          if-no-files-found: error
          retention-days: 365
