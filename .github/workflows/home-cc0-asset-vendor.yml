name: Home CC0 Asset Vendor Forge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-cc0-vendor-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  vendor-home-cc0:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify current governed CC0 Home assets and owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          required = [
              Path('urai-tier1/public/assets/urai/home-production/cc0/polyhaven-v48/fern_02/asset.gltf'),
              Path('urai-tier1/public/assets/urai/home-production/cc0/polyhaven-v48/fern_02/fern_02.bin'),
              Path('urai-tier1/public/assets/urai/home-production/cc0/polyhaven-v48/fern_02/textures/fern_02_alpha_1k.png'),
              Path('urai-tier1/public/assets/urai/home-production/cc0/polyhaven-v48/fern_02/textures/fern_02_diff_1k.jpg'),
              Path('urai-tier1/public/assets/urai/home-production/cc0/polyhaven-v48/fern_02/textures/fern_02_nor_gl_1k.jpg'),
              Path('urai-tier1/public/assets/urai/home-production/cc0/polyhaven-v48/rock_face_01/asset.gltf'),
              Path('urai-tier1/public/assets/urai/home-production/cc0/polyhaven-v48/rock_face_02/asset.gltf'),
              Path('operations/assets/home-fern-material-provenance.json'),
          ]
          missing = [str(path) for path in required if not path.is_file() or path.stat().st_size <= 0]
          assert not missing, {'missingOrEmpty': missing}

          v223 = Path('urai-tier1/src/spatial/layout/HomeWorldProductionV223.tsx').read_text()
          polish = Path('urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx').read_text()
          launch = Path('urai-tier1/src/spatial/assets/HomeLaunchSanctuaryV254.tsx').read_text()

          assert 'HomeV225PolishV3' in v223
          assert 'HomeLaunchSanctuaryV254' in v223
          assert '/assets/urai/home-production/cc0/polyhaven-v48/fern_02/asset.gltf' in polish
          assert '/assets/urai/home-production/cc0/polyhaven-v48/fern_02/asset.gltf' in launch
          assert 'rock_face_01/asset.gltf' in launch and 'rock_face_02/asset.gltf' in launch
          assert 'HomeWorldProductionFinal' not in v223
          assert 'polyhaven-fern-02-geometry-v1.glb' not in v223 + polish + launch

          receipt = {
              'schemaVersion': 'urai-home-cc0-current-owner-verification-1',
              'exactHead': os.environ['URAI_SOURCE_SHA'],
              'runtimeOwner': 'HomeWorldProductionV223.tsx',
              'cc0Owners': ['HomeWorldProductionV225PolishV3.tsx', 'HomeLaunchSanctuaryV254.tsx'],
              'assets': [
                  {
                      'path': str(path),
                      'bytes': path.stat().st_size,
                      'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
                  for path in required
              ],
              'sourceMutationPerformed': False,
              'passed': True,
          }
          Path('home-cc0-current-owner-verification.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          PY

      - name: Prove verification did not mutate tracked source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all -- . ':!home-cc0-current-owner-verification.json')"

      - name: Upload verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: home-cc0-current-owner-${{ env.URAI_SOURCE_SHA }}
          path: home-cc0-current-owner-verification.json
          if-no-files-found: error
          retention-days: 14
