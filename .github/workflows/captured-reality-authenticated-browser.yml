name: Captured Reality Authenticated Firebase Browser Circuit (Non-release)
on:
  pull_request:
    paths:
      - '.github/workflows/captured-reality-authenticated-browser.yml'
      - 'scripts/prove-captured-reality-authenticated-browser.mjs'
      - 'scripts/prove-captured-reality-firebase-emulator.mjs'
      - 'firebase.captured-reality-emulator.json'
      - 'urai-tier1/src/spatial/captured-reality/**'
      - 'urai-tier1/src/app/spatial/captured-reality/**'
      - 'urai-tier1/src/lib/firebase/client.ts'
      - 'apps/functions/src/capturedReality.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: captured-reality-auth-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  authenticated-real-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GCLOUD_PROJECT: demo-urai-hybrid-proof
      FIREBASE_STORAGE_BUCKET: demo-urai-hybrid-proof.appspot.com
      URAI_ENABLE_CAPTURED_REALITY: 'true'
      URAI_ENABLE_CAPTURED_REALITY_PROOF: 'true'
      URAI_ENABLE_CAPTURED_REALITY_MESH: 'true'
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      FUNCTIONS_EMULATOR: 'true'
      URAI_BROWSER_INTEGRATION: 'true'
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies and Chromium
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
          pnpm --filter urai-functions build
      - name: Run four real emulators and actual authenticated browser circuit
        run: |
          pnpm exec firebase emulators:exec --project demo-urai-hybrid-proof --only auth,firestore,storage,functions --config firebase.captured-reality-emulator.json 'node scripts/prove-captured-reality-firebase-emulator.mjs'
      - name: Preserve authentic browser screenshots and redacted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: captured-reality-authenticated-browser-${{ env.URAI_EXACT_HEAD }}
          path: |
            artifacts/captured-reality-authenticated-browser/
            artifacts/captured-reality-firebase-emulator/receipt.json
          if-no-files-found: warn
          retention-days: 60
