name: Apply Home final repair
on:
  push:
    branches: [fix/home-visible-spatial-world-20260719]
    paths: [.github/workflows/apply-home-final-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/home-visible-spatial-world-20260719
          fetch-depth: 2
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d37ddac944fb8701e02f0c825f8186855b99b256"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/apply-home-final-repair.yml"
          nav=urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx
          sed -i 's/Math.min(delta, 0.25)/Math.min(delta, 0.5)/' "$nav"
          grep -Fq 'Math.min(delta, 0.5)' "$nav"
          python3 - <<'PY'
          from pathlib import Path
          additions = [
            "      - 'urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx'",
            "      - 'urai-tier1/src/app/HomeSanctuaryWorld.tsx'",
            "      - 'urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx'",
          ]
          for name, marker in [
            ('.github/workflows/accessibility-performance-evidence.yml', "      - 'urai-tier1/tests/accessibility-performance-*.spec.ts'"),
            ('.github/workflows/continuous-spatial-visual-proof.yml', "      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'"),
          ]:
            p = Path(name)
            s = p.read_text()
            if additions[0] not in s:
              s = s.replace(marker, marker + '\n' + '\n'.join(additions))
            p.write_text(s)
          PY
          rm .github/workflows/apply-home-final-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(home): preserve movement on severely throttled frames'
          git push origin HEAD:fix/home-visible-spatial-world-20260719