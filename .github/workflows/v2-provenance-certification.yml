name: V2 Provenance Binding Certification

on:
  pull_request:
    paths:
      - scripts/certify-v2-provenance.py
      - urai-tier1/src/spatial/assets/v2-provenance-ledger.json
      - urai-tier1/src/spatial/assets/uraiV2Assets.ts
      - urai-tier1/public/assets/urai/v2/**
      - urai-tier1/public/assets/urai/final/manifests/asset-factory-spatial-handoff.json
      - scripts/certify-v2-runtime-assets.py
      - .github/workflows/v2-provenance-certification.yml
  push:
    branches: [main]
    paths:
      - scripts/certify-v2-provenance.py
      - urai-tier1/src/spatial/assets/v2-provenance-ledger.json
      - urai-tier1/src/spatial/assets/uraiV2Assets.ts
      - urai-tier1/public/assets/urai/v2/**
      - urai-tier1/public/assets/urai/final/manifests/asset-factory-spatial-handoff.json
      - scripts/certify-v2-runtime-assets.py
      - .github/workflows/v2-provenance-certification.yml

permissions:
  contents: read

concurrency:
  group: v2-provenance-certification-${{ github.sha }}
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install certification dependencies
        run: python -m pip install Pillow==11.3.0
      - name: Rebuild independent technical certification
        run: python scripts/certify-v2-runtime-assets.py
      - name: Bind paid and preserved-source provenance
        run: python scripts/certify-v2-provenance.py
      - name: Prove no generation, spend, promotion, or deployment authority
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ASSET_RENDERER_API_KEY:-}"
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('urai-tier1/artifacts/v2-provenance-certification/v2-provenance-certification.json').read_text())
          assert p['expected'] == 80
          assert p['technicalPassed'] == 80
          assert p['providerGeneratedReceiptBound'] == 71
          assert p['preservedV1SourceBound'] == 9
          assert p['provenanceBound'] == 80
          assert p['provenanceFailed'] == 0
          assert p['newProviderCalls'] == 0
          assert p['newSpendUsd'] == '0.00'
          assert p['promotionAuthorized'] is False
          assert p['deploymentAuthorized'] is False
          PY
      - name: Upload V2 provenance certification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v2-provenance-certification-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
          path: |
            urai-tier1/artifacts/v2-certification/**
            urai-tier1/artifacts/v2-provenance-certification/**
