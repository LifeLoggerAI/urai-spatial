name: URAI Ecosystem Governance Verify

on:
  pull_request:
    paths:
      - '.github/workflows/urai-ecosystem-governance-verify.yml'
      - 'governance/**'
      - 'operations/ecosystem/**'
      - 'operations/spatial/SPATIAL_AAA_PROGRAM_LEDGER.md'
      - 'urai-tier1/tests/urai-ecosystem-governance-contract.test.mjs'
      - 'urai-tier1/scripts/run-unit-contract-tests-compact.mjs'

permissions:
  contents: read

concurrency:
  group: urai-ecosystem-governance-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
  EXPECTED_REPOSITORY: LifeLoggerAI/urai-spatial

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify governance contract
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter urai-tier1 exec node --import tsx --test tests/urai-ecosystem-governance-contract.test.mjs

      - name: Write exact candidate receipt
        shell: node
        run: |
          const fs = require('node:fs')
          const registry = JSON.parse(fs.readFileSync('governance/urai-ecosystem-governance.json', 'utf8'))
          const receipt = {
            schema: 'urai-ecosystem-governance-verification-1',
            repository: process.env.GITHUB_REPOSITORY,
            candidateSha: process.env.CANDIDATE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            stackedBaseCommit: registry.stackedBaseCommit,
            currentMainAtRebuild: registry.currentMainAtRebuild,
            trustedPreview: registry.dependencies.trustedPreview,
            embodiedMirror: registry.dependencies.embodiedMirror,
            consentGatedGeography: registry.dependencies.consentGatedGeography,
            productionAuthorityIssue: registry.productionAuthorityIssue,
            productionMutation: false,
            providerCalls: 0,
            spendUsd: '0.00',
            verifiedAt: new Date().toISOString(),
          }
          fs.mkdirSync('artifacts/governance', { recursive: true })
          fs.writeFileSync('artifacts/governance/exact-governance-receipt.json', `${JSON.stringify(receipt, null, 2)}\n`)

      - name: Retain exact governance receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-ecosystem-governance-${{ env.CANDIDATE_SHA }}
          path: artifacts/governance/exact-governance-receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Reject tracked mutation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/governance
          test -z "$(git status --porcelain --untracked-files=all)"
