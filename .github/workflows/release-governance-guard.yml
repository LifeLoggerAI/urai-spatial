name: Release Governance Guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - 'docs/release-governance/**'
      - 'evidence/release/**'
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-governance-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Determine governance scope
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          applies=true
          if [ "$GITHUB_EVENT_NAME" = 'pull_request_review' ]; then
            applies=false
            page=1
            while :; do
              files="$(curl --fail --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GH_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$GITHUB_API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page")"
              if jq -e '
                def governed:
                  . == ".github/CODEOWNERS"
                  or startswith(".github/workflows/")
                  or startswith("docs/release-governance/")
                  or startswith("evidence/release/");
                any(.[];
                  ((.filename // "") | governed)
                  or ((.previous_filename // "") | governed))
              ' <<<"$files" >/dev/null; then
                applies=true
                break
              fi
              count="$(jq 'length' <<<"$files")"
              if [ "$count" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
            done
          fi
          echo "applies=$applies" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source
        if: steps.scope.outputs.applies == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXACT_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean tree
        if: steps.scope.outputs.applies == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Require exact-head governed approval
        if: steps.scope.outputs.applies == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          reviews="$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")"

          mapfile -t candidates < <(
            jq -r \
              --arg sha "$EXACT_SHA" \
              --arg author "$PR_AUTHOR" \
              '[.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")]
              | sort_by(.user.login, (.submitted_at // ""), .id)
              | group_by(.user.login)
              | map(last)
              | .[]
              | select(.state == "APPROVED" and .commit_id == $sha and .user.login != $author)
              | .user.login' \
              <<<"$reviews"
          )

          approved_reviewer=''
          for reviewer in "${candidates[@]}"; do
            permission="$(curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$REPOSITORY/collaborators/$reviewer/permission" \
              | jq -r '.permission // empty')"
            case "$permission" in
              admin|maintain|write)
                approved_reviewer="$reviewer"
                break
                ;;
            esac
          done

          mkdir -p artifacts/release-governance
          if test -n "$approved_reviewer"; then
            printf '%s\n' 'independent-collaborator' > artifacts/release-governance/approval-mode.txt
            printf '%s\n' "$approved_reviewer" > artifacts/release-governance/approved-reviewer.txt
            : > artifacts/release-governance/approved-steward.txt
            exit 0
          fi

          # Offline independent approval is accepted only when it is cryptographically
          # signed by the independent reviewer over this exact frozen SHA. This removes
          # the legacy solo-steward self-approval fallback while avoiding any requirement
          # that the reviewer receive permanent private-repository access.
          pr_body="$(curl --fail --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$REPOSITORY/pulls/$PR_NUMBER" \
            | jq -r '.body // ""')"

          field() {
            local key="$1"
            sed -n "s/^$key=//p" <<<"$pr_body" | tail -n 1
          }

          external_reviewer="$(field INDEPENDENT_REVIEWER_ID)"
          external_sha="$(field INDEPENDENT_APPROVED_SHA)"
          external_decision="$(field INDEPENDENT_DECISION)"
          external_reviewed_at="$(field INDEPENDENT_REVIEWED_AT)"
          external_attestation_sha256="$(field INDEPENDENT_ATTESTATION_SHA256)"
          external_attestation_uri="$(field INDEPENDENT_ATTESTATION_URI)"
          external_witness="$(field INDEPENDENT_WITNESS)"
          external_signature_b64="$(field INDEPENDENT_SIGNATURE_B64)"

          test -n "$external_reviewer" || {
            echo "No native exact-head approval and no signed external reviewer identity is recorded." >&2
            exit 1
          }
          test "$external_reviewer" != "$PR_AUTHOR" || {
            echo "Independent approval denied: external reviewer matches PR author." >&2
            exit 1
          }
          test "$external_sha" = "$EXACT_SHA" || {
            echo "Independent approval denied: signed SHA does not equal exact head." >&2
            exit 1
          }
          test "$external_decision" = 'APPROVED' || {
            echo "Independent approval denied: decision must be APPROVED." >&2
            exit 1
          }
          test -n "$external_reviewed_at" || {
            echo "Independent approval denied: reviewed-at timestamp is required." >&2
            exit 1
          }
          [[ "$external_attestation_sha256" =~ ^[0-9a-fA-F]{64}$ ]] || {
            echo "Independent approval denied: attestation SHA-256 must be 64 hex characters." >&2
            exit 1
          }
          test -n "$external_attestation_uri" || {
            echo "Independent approval denied: attestation URI is required." >&2
            exit 1
          }
          test -n "$external_witness" || {
            echo "Independent approval denied: witness identity is required." >&2
            exit 1
          }
          test -n "$external_signature_b64" || {
            echo "Independent approval denied: reviewer signature is required." >&2
            exit 1
          }

          key_path="docs/release-governance/reviewers/$external_reviewer-public.pem"
          test -f "$key_path" || {
            echo "Independent approval denied: trusted reviewer public key not found: $key_path" >&2
            exit 1
          }

          cat > artifacts/release-governance/external-review-message.txt <<EOF
          URAI-INDEPENDENT-RELEASE-APPROVAL-V1
          repository=$REPOSITORY
          pull_request=$PR_NUMBER
          exact_sha=$EXACT_SHA
          reviewer=$external_reviewer
          decision=$external_decision
          reviewed_at=$external_reviewed_at
          attestation_sha256=$external_attestation_sha256
          attestation_uri=$external_attestation_uri
          witness=$external_witness
          EOF

          printf '%s' "$external_signature_b64" | base64 --decode > artifacts/release-governance/external-review-signature.bin
          openssl pkeyutl -verify \
            -pubin \
            -inkey "$key_path" \
            -rawin \
            -in artifacts/release-governance/external-review-message.txt \
            -sigfile artifacts/release-governance/external-review-signature.bin

          printf '%s\n' 'external-independent-cryptographic-signature' > artifacts/release-governance/approval-mode.txt
          printf '%s\n' "$external_reviewer" > artifacts/release-governance/approved-reviewer.txt
          : > artifacts/release-governance/approved-steward.txt
          printf '%s\n' "$external_reviewed_at" > artifacts/release-governance/external-review-reviewed-at.txt
          printf '%s\n' "$external_attestation_sha256" > artifacts/release-governance/external-review-attestation-sha256.txt
          printf '%s\n' "$external_attestation_uri" > artifacts/release-governance/external-review-attestation-uri.txt
          printf '%s\n' "$external_witness" > artifacts/release-governance/external-review-witness.txt
          sha256sum "$key_path" | awk '{print $1}' > artifacts/release-governance/external-review-public-key-sha256.txt

      - name: Reject temporary dispatchers on canonical source
        if: steps.scope.outputs.applies == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/dispatch-frozen-full-preview.yml
          mapfile -d '' workflow_files < <(
            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) \
              ! -name 'release-governance-guard.yml' -print0
          )
          if ((${#workflow_files[@]})) && grep -IlE \
            'temporary dispatcher|diagnostic deployment dispatcher|Do not merge this PR' \
            "${workflow_files[@]}"; then
            echo 'Temporary or diagnostic dispatcher language is forbidden in canonical workflows.' >&2
            exit 1
          fi

      - name: Require permanent release ownership
        if: steps.scope.outputs.applies == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/.github/workflows/** @release-governance' .github/CODEOWNERS
          grep -Fq '/docs/release-governance/** @release-governance' .github/CODEOWNERS
          grep -Fq '/evidence/release/** @release-governance' .github/CODEOWNERS

      - name: Validate changed release workflows are exact-head and clean-tree bound
        if: steps.scope.outputs.applies == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if test -z "$base" || test "$base" = '0000000000000000000000000000000000000000' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^)"
          fi
          mkdir -p artifacts/release-governance
          git diff --name-only "$base" "$EXACT_SHA" > artifacts/release-governance/changed-files.txt
          : > artifacts/release-governance/validated-release-workflows.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/*.yml|.github/workflows/*.yaml)
                test "$path" != '.github/workflows/release-governance-guard.yml' || continue
                test -f "$path" || continue
                if printf '%s\n' "$path" | grep -Eqi 'deploy|production|release|preview' \
                  || grep -Eqi 'actions:[[:space:]]*write|environment:[[:space:]]*production|firebase[[:space:]]+deploy|gcloud[[:space:]]+run[[:space:]]+deploy' "$path"; then
                  grep -Eq 'github\.event\.pull_request\.head\.sha|github\.sha|inputs\.(candidate_sha|verification_sha|release_sha)' "$path"
                  grep -Eq 'persist-credentials:[[:space:]]*false' "$path"
                  grep -Eq 'git rev-parse HEAD' "$path"
                  grep -Eq 'git status --porcelain' "$path"
                  printf '%s\n' "$path" >> artifacts/release-governance/validated-release-workflows.txt
                fi
                ;;
            esac
          done < artifacts/release-governance/changed-files.txt

      - name: Reject unsupported production authorization records
        if: steps.scope.outputs.applies == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-governance
          : > artifacts/release-governance/validated-production-records.txt
          if test -d evidence/release; then
            while IFS= read -r record; do
              test -n "$record" || continue
              for field in exactMergedMainSha providerProject providerSite providerVersion previewUrl founderDecision independentApproval rollbackTarget; do
                grep -Eq "\"$field\"[[:space:]]*:" "$record"
              done
              grep -Eq '"founderDecision"[[:space:]]*:[[:space:]]*"APPROVE HOME"' "$record"
              grep -Eq '"productionTargeted"[[:space:]]*:[[:space:]]*true' "$record"
              printf '%s\n' "$record" >> artifacts/release-governance/validated-production-records.txt
            done < <(grep -RIlE '"production(Authorized|Certified)"[[:space:]]*:[[:space:]]*true' evidence/release || true)
          fi

      - name: Require incident record and fail-closed release boundary
        if: steps.scope.outputs.applies == 'true'
        shell: bash
        run: |
          set -euo pipefail
          incident=docs/release-governance/2026-08-04-spatial-governance-incident.md
          test -f "$incident"
          grep -Fq '869eb1df8d75351d046a22e82a85a100389d6a82' "$incident"
          grep -Fq '64b2070b0dbb66db57f2493119ed6568efac9d46' "$incident"
          grep -Fq '62d77f7d406e78cbfcefad73ca31247f90a377be' "$incident"
          grep -Fq 'aa2fa1883f6627f4da872a3e80bd8ae125e98f82' "$incident"
          grep -Fq 'MERGED SOURCE NOT PRODUCTION-AUTHORIZED' "$incident"
          grep -Fq 'Independent approval: evidence not found' "$incident"
          grep -Fq 'Provider production identity: evidence not found' "$incident"
          grep -Fq 'Rollback authority: evidence not found' "$incident"

      - name: Retain guard receipt
        if: steps.scope.outputs.applies == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release-governance
          changed_release_count="$(wc -l < artifacts/release-governance/validated-release-workflows.txt | tr -d ' ')"
          production_record_count="$(wc -l < artifacts/release-governance/validated-production-records.txt | tr -d ' ')"
          approval_mode="$(cat artifacts/release-governance/approval-mode.txt 2>/dev/null || true)"
          approved_reviewer="$(cat artifacts/release-governance/approved-reviewer.txt 2>/dev/null || true)"
          approved_steward="$(cat artifacts/release-governance/approved-steward.txt 2>/dev/null || true)"
          cat > artifacts/release-governance/receipt.json <<EOF
          {
            "schemaVersion": "urai-release-governance-guard-6",
            "repository": "$GITHUB_REPOSITORY",
            "exactSha": "$EXACT_SHA",
            "baseSha": "$BASE_SHA",
            "governanceScopeApplied": true,
            "temporaryDispatcherPresent": false,
            "workflowCodeownerRequired": true,
            "incidentRecordPresent": true,
            "approvalMode": "$approval_mode",
            "independentApprovedReviewer": "$approved_reviewer",
            "soloSteward": "$approved_steward",
            "externalReviewReviewedAt": "$(cat artifacts/release-governance/external-review-reviewed-at.txt 2>/dev/null || true)",
            "externalReviewAttestationSha256": "$(cat artifacts/release-governance/external-review-attestation-sha256.txt 2>/dev/null || true)",
            "externalReviewAttestationUri": "$(cat artifacts/release-governance/external-review-attestation-uri.txt 2>/dev/null || true)",
            "externalReviewWitness": "$(cat artifacts/release-governance/external-review-witness.txt 2>/dev/null || true)",
            "externalReviewPublicKeySha256": "$(cat artifacts/release-governance/external-review-public-key-sha256.txt 2>/dev/null || true)",
            "changedReleaseWorkflowsValidated": $changed_release_count,
            "productionAuthorizationRecordsValidated": $production_record_count,
            "productionAuthorized": false
          }
          EOF

      - name: Upload governance receipt
        if: steps.scope.outputs.applies == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-governance-${{ env.EXACT_SHA }}
          path: artifacts/release-governance
          if-no-files-found: error
          retention-days: 90
