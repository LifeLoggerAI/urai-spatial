name: Trigger reviewed governance materializer on PR sync

# Exact-step extraction preserves the reviewed workflow's heredocs verbatim.
on:
  pull_request:
    types: [synchronize]
    branches:
      - feat/geographic-location-launch-minimum-v5-20260801

permissions:
  contents: write

concurrency:
  group: trigger-governance-materializer-pr
  cancel-in-progress: false

env:
  TARGET_BRANCH: reconcile/ecosystem-authority-after-geography-v4-20260801
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
  REVIEWED_GOVERNANCE_HEAD: db50fa80708d771eb9012d35a82638f8b8440985

jobs:
  materialize:
    if: github.repository == 'LifeLoggerAI/urai-spatial' && github.event.pull_request.head.ref == 'reconcile/ecosystem-authority-after-geography-v4-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Extract reviewed materializer blocks
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-governance-after-geography.yml')
          lines = workflow.read_text().splitlines()
          names = [
              'Verify exact clean authorities',
              'Apply reviewed policy and current stack authority',
              'Verify combined governance boundary',
              'Commit final governance stack',
          ]

          markdown_hard_break_check = """git diff --cached --check -- . \\
            ':(exclude)governance/RUAI_ACCESS_AND_DATA_GOVERNANCE.md' \\
            ':(exclude)operations/ecosystem/URAI_ECOSYSTEM_CONVERGENCE_RECEIPT.md' \\
            ':(exclude)operations/spatial/SPATIAL_AAA_PROGRAM_LEDGER.md'"""

          for index, name in enumerate(names):
              marker = f'      - name: {name}'
              start = lines.index(marker)
              run_line = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
              end = next(
                  (i for i in range(run_line + 1, len(lines)) if lines[i].startswith('      - name: ')),
                  len(lines),
              )
              prefix = '          '
              block = [line[len(prefix):] if line.startswith(prefix) else line for line in lines[run_line + 1:end]]
              script = '\n'.join(block).rstrip() + '\n'
              if index == 1:
                  script = script.replace('git diff --cached --check', markdown_hard_break_check, 1)
              Path(f'/tmp/governance-step-{index}.sh').write_text(script)

      - name: Verify exact source authority
        run: bash /tmp/governance-step-0.sh

      - name: Create reviewed receipt directories
        run: mkdir -p governance operations/ecosystem operations/spatial urai-tier1/tests urai-tier1/scripts

      - name: Apply reviewed governance source
        run: bash /tmp/governance-step-1.sh

      - name: Remove temporary trigger wrappers
        run: |
          git rm .github/workflows/trigger-governance-materializer.yml
          git rm .github/workflows/trigger-governance-materializer-pr.yml

      - name: Verify final governance boundary
        run: bash /tmp/governance-step-2.sh

      - name: Commit final governance stack
        run: bash /tmp/governance-step-3.sh
