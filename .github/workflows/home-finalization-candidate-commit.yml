name: Home Finalization Candidate Commit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/apply-home-v42-relic-machine.py'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-v42-materializer-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  forge-verify-and-commit:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'home-final-v24-certify-20260826') ||
       (github.event_name == 'workflow_dispatch' && github.ref_name == 'home-final-v24-certify-20260826'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOME_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact V42 authoring head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HOME_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Verify exact clean authoring head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOME_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Materialize V42 Home
        run: |
          set -euo pipefail
          python3 scripts/apply-home-v42-relic-machine.py
          grep -F 'v42-sanctuary-integrated-relic-machine-production-candidate' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v42-governed-authored-orb-massive-relic-machine-hero' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'scale={1.05}' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F '<torusGeometry' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F '<ReliquarySpine/>' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx

      - name: Type-check V42
        working-directory: urai-tier1
        run: pnpm exec tsc --noEmit

      - name: Commit materialized V42 candidate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git commit -m 'Home: materialize V42 sanctuary relic-machine'
          git push origin HEAD:home-final-v24-certify-20260826
