name: Home Finalization Candidate Commit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/capture-home-state-proof.mjs'
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/run-continuous-spatial-proof-v22-natural.mjs'
      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProduction.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx'
      - 'urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
      - 'urai-tier1/tests/home-v88-retained-pixel-repair-contract.test.mjs'
      - 'urai-tier1/tests/embodied-exploration-contract.test.mjs'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: home-current-finalization-${{ github.event.pull_request.number || inputs.verification_sha || github.ref_name }}-${{ github.event.pull_request.head.sha || inputs.verification_sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-current-home-finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact V125 candidate markers
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          grep -Fq 'HomeWorldProductionV70 as HomeWorldProduction' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          grep -Fq 'function SculptedCanyonGround(' urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx
          grep -Fq 'function GeologicalFrame(' urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx
          grep -Fq 'function FramedFissure(' urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx
          grep -Fq 'function LivingOrb(' urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx
          grep -Fq 'home-v126-continuous-walkable-terrace-network' urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx
          grep -Fq 'home-v126-bounded-geological-edge-masses' urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx
          grep -Fq 'home-v126-orb-memory-motes' urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx
          grep -Fq 'home-v126-layered-apse-orb-cradle' urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx
          grep -Fq "data-home-v126-certification', 'retained-pixel-candidate-not-certified" urai-tier1/src/app/AssetDrivenHomeWorld.tsx
          ! grep -Eq 'PRODUCTION CERTIFIED|retained-pixel-pass|pixel-certified' urai-tier1/src/app/AssetDrivenHomeWorld.tsx urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 10.0.0, run_install: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify Home contracts and proof syntax
        run: |
          node --check scripts/capture-home-state-proof.mjs
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs
          node --check scripts/run-home-state-proof-bounded.mjs
          cd urai-tier1
          node --test --test-concurrency=1 tests/home-ground-lifemap-art-bible-contract.test.mjs
          node --test --test-concurrency=1 tests/home-relic-machine-realism-contract.test.mjs
          node --test --test-concurrency=1 tests/home-v88-retained-pixel-repair-contract.test.mjs
          node --test --test-concurrency=1 tests/embodied-exploration-contract.test.mjs
          node --test --test-concurrency=1 tests/continuous-spatial-restoration-contract.test.mjs
          node --test --test-concurrency=1 tests/final-aaa-world-convergence-contract.test.mjs
          pnpm exec tsc --noEmit
      - name: Prove exact final clean candidate identity
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
