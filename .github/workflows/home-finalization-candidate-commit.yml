name: Home Finalization Candidate Commit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/import-home-v48-production-assets.mjs'
      - 'scripts/apply-home-v48-production-assets.py'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-v48-production-assets-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  materialize-v48-production-assets:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'home-final-v24-certify-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: home-final-v24-certify-20260826
          fetch-depth: 1
          persist-credentials: true
      - name: Import committed CC0 production sanctuary assets
        run: node scripts/import-home-v48-production-assets.mjs
      - name: Apply V48 production-asset sanctuary integration
        shell: bash
        run: |
          set -euo pipefail
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          if grep -Fq "v48-production-asset-sanctuary-candidate" "$source"; then
            echo 'V48 production-asset sanctuary is already materialized; no mutation required.'
          else
            python3 scripts/apply-home-v48-production-assets.py
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify V48 production asset contract and type-check
        run: |
          node --test --test-concurrency=1 urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          pnpm --dir urai-tier1 exec tsc --noEmit
      - name: Commit V48 runtime, assets and provenance when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI'
          git config user.email 'LifeLoggerAI@gmail.com'
          git add \
            urai-tier1/public/assets/urai/home-production/cc0/polyhaven-v48 \
            operations/assets/home-v48-production-asset-provenance.json \
            urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx \
            urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          if git diff --cached --quiet; then
            echo 'No V48 production materialized changes to commit'
            exit 0
          fi
          git commit -m 'Home: materialize V48 committed production sanctuary assets'
          git push origin HEAD:home-final-v24-certify-20260826
