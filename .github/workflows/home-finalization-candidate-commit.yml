name: Home Finalization Candidate Commit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
      - 'urai-tier1/src/app/GroundSpatialWorldClean.tsx'
      - 'urai-tier1/src/spatial/world/persistentRealmAtmosphere.css'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
      - 'tests/native-doorway-proof.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-v42-finalization-verifier-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  forge-verify-and-commit:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'home-final-v24-certify-20260826') ||
       (github.event_name == 'workflow_dispatch' && github.ref_name == 'home-final-v24-certify-20260826'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOME_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact V42 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HOME_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOME_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify materialized V42 Home and Ground candidate
        working-directory: urai-tier1
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/home-relic-machine-realism-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs tests/post-deploy-ground-smoke-contract.test.mjs tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs
          pnpm exec tsc --noEmit
          grep -F 'v42-sanctuary-integrated-relic-machine-production-candidate' src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v42-governed-authored-orb-massive-relic-machine-hero' src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'scale={1.05}' src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v41-depth-fog-continuity-no-horizontal-band' src/app/GroundSpatialWorldClean.tsx
          ! grep -F '<torusGeometry' src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F '<ReliquarySpine/>' src/spatial/layout/HomeWorldProductionFinal.tsx
