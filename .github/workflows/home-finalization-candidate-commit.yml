name: Home Finalization Candidate Commit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/apply-home-v44-readiness-fix.py'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-v44-readiness-materializer-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  materialize-v44-readiness:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'home-final-v24-certify-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: home-final-v24-certify-20260826
          fetch-depth: 1
          persist-credentials: true
      - name: Apply V44 readiness repair
        run: python3 scripts/apply-home-v44-readiness-fix.py
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Type-check repaired Home
        working-directory: urai-tier1
        run: pnpm exec tsc --noEmit
      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI'
          git config user.email 'LifeLoggerAI@gmail.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          if git diff --cached --quiet; then
            echo 'No runtime change to commit'
            exit 0
          fi
          git commit -m 'Home: bind V44 readiness to current production objects'
          git push origin HEAD:home-final-v24-certify-20260826
