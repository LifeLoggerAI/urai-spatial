name: Home Finalization Candidate Commit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/import-home-v48-production-assets.mjs'
      - 'scripts/apply-home-v48-production-assets.py'
      - 'scripts/apply-home-v49-authored-reliquary.py'
      - 'scripts/repair-and-apply-home-v49-materializer.py'
      - 'scripts/apply-home-v50-retained-pixel-rebuild.py'
      - 'scripts/apply-home-v51-open-reliquary-rebuild.py'
      - 'scripts/apply-home-v52-deep-reliquary-rebuild.py'
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/run-continuous-spatial-proof-v22-natural.mjs'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-v52-deep-reliquary-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  materialize-v52-deep-reliquary:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'home-final-v24-certify-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: home-final-v24-certify-20260826
          fetch-depth: 1
          persist-credentials: true
      - name: Preserve governed provenance and materialize V52 deep reliquary rebuild once
        shell: bash
        run: |
          set -euo pipefail
          test -f operations/assets/home-v48-production-asset-provenance.json
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          if grep -Fq "v52-deep-reliquary-retained-pixel-rebuild" "$source"; then
            echo 'V52 deep reliquary rebuild is already materialized; no mutation required.'
          else
            python3 scripts/apply-home-v52-deep-reliquary-rebuild.py
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify V52 deep reliquary contract and type-check
        run: |
          node --test --test-concurrency=1 urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs
          pnpm --dir urai-tier1 exec tsc --noEmit
      - name: Commit V52 runtime when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI'
          git config user.email 'LifeLoggerAI@gmail.com'
          git add \
            scripts/apply-home-v52-deep-reliquary-rebuild.py \
            scripts/capture-natural-home-orb-proof.mjs \
            scripts/run-continuous-spatial-proof-v22-natural.mjs \
            urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx \
            urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          if git diff --cached --quiet; then
            echo 'No V52 deep-reliquary changes to commit'
            exit 0
          fi
          git commit -m 'Home: materialize V52 deep reliquary rebuild'
          git push origin HEAD:home-final-v24-certify-20260826
