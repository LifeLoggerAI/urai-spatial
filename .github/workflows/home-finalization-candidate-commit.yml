# V66 owner-authorized finalization verifier. V66 is materially landed; verify the exact PR head without rematerializing retired art.
name: Home Finalization Candidate Commit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/capture-home-state-proof.mjs'
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/run-continuous-spatial-proof-v22-natural.mjs'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
      - '.github/workflows/home-scanned-composition-forge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-v66-finalization-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-v66-finalization:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'home-final-v24-certify-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact V66 candidate markers
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f operations/assets/home-v48-production-asset-provenance.json
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          grep -Fq "root.visible = false" "$source"
          grep -Fq "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -Fq "home-v66-enclosed-reliquary" "$source"
          grep -Fq "v66-authored-chamber-retained-provenance-never-visible" "$source"
          grep -Fq "v66-contiguous-enclosed-stone-reliquary-no-open-sky-no-floating-geology" "$source"
          grep -Fq "v66-recessed-practicals-integrated-into-enclosure" "$source"
          grep -Fq "visualOwner:'enclosed-reliquary-v66'" "$source"
          grep -Fq "visualTreatment:'v66-enclosed-reliquary-retained-pixel-rebuild'" "$source"
          grep -Fq "v66-six-fragment-engineered-orb-no-glass-sphere-no-pedestal" "$source"
          grep -Fq "v66-interaction-anchor-for-six-fragment-engineered-orb" "$source"
          grep -Fq "enclosed-reliquary-v66-six-fragment-orb" scripts/run-continuous-spatial-proof-v22-natural.mjs
          grep -Fq "cinematic-pbr-v66-enclosed-reliquary" scripts/capture-natural-home-orb-proof.mjs
          grep -Fq "data-home-art-certification=\"v66-retained-pixel-candidate-not-certified\"" "$source"
          grep -Fq "const ORB = new THREE.Vector3(0, 2.35, -7.25)" "$source"
          ! grep -Fq "visualOwner:'photogrammetry-orb-sanctuary-v64'" "$source"
          ! grep -Fq "home-v64-left-deep-wall" "$source"
          ! grep -Fq "home-v64-right-deep-wall" "$source"
          ! grep -Fq "home-v64-upper-left-vault" "$source"
          ! grep -Fq "home-v64-upper-right-vault" "$source"
          ! grep -Fq "data-home-art-certification=\"v65-retained-pixel-candidate-not-certified\"" "$source"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify V66 realism contract and type-check
        run: |
          node --test --test-concurrency=1 urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          node --check scripts/capture-home-state-proof.mjs
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs
          pnpm --dir urai-tier1 exec tsc --noEmit
