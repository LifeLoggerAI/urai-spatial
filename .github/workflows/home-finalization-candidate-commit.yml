name: Home Finalization Candidate Commit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-v2-repair-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PR_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

jobs:
  forge-verify-and-commit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove clean exact input and governed assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 - <<'PY'
          import hashlib, json, pathlib
          checks = [
            ('operations/assets/generated-receipts/home-entry-chamber-v1.json', '73f2a49ed2cfd6cd7ae9baed7b3908d53e0cac75b9f36ff1b8be9654e3d3e2f2'),
            ('operations/assets/generated-receipts/ground-world-terrain-v1.json', 'b5309b854729566efcc444db029458bd4193ed18e6c83199e164ca8cb3fb2b76'),
            ('operations/assets/generated-receipts/urai-orb-avatar-v1.json', '06b21ff93a2221a6367fb8b8e305a0453cb151d3a92194445d72e4d48d6c7708'),
          ]
          for receipt_path, expected in checks:
            r = json.loads(pathlib.Path(receipt_path).read_text())
            p = pathlib.Path(r['fixedPath'])
            assert p.is_file()
            assert hashlib.sha256(p.read_bytes()).hexdigest() == r['sha256'] == expected
          fern = json.loads(pathlib.Path('operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json').read_text())
          fp = pathlib.Path(fern['output'])
          assert fp.is_file()
          assert hashlib.sha256(fp.read_bytes()).hexdigest() == fern['outputSha256'] == '9e3d29b1f917ec9f6e72f713fc7131f1d413ffecfbd3c96e7d72f92529f31a87'
          PY

      - name: Recompose Home from governed authored assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx')
          s = path.read_text()
          if 'HOME_COMPOSITION_V2' in s:
            print('Home V2 already composed')
            raise SystemExit(0)
          def one(old, new):
            global s
            c = s.count(old)
            assert c == 1, f'expected one match, got {c}: {old[:100]!r}'
            s = s.replace(old, new, 1)
          one('const HOME_FERN_MODEL = "/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb";\nconst HOME_SCANNED_COMPOSITION_V1 = "owned-sanctuary-plus-cc0-fern";', 'const HOME_FERN_MODEL = "/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb";\nconst HOME_GROUND_MODEL = "/assets/urai/generated/models/ground-world-terrain-v1.glb";\nconst HOME_ORB_MODEL = "/assets/urai/generated/models/urai-orb-avatar-v1.glb";\nconst HOME_COMPOSITION_V2 = "owned-sanctuary-ground-landscape-cc0-nature-authored-orb";')
          one('const ORB = new THREE.Vector3(0, 1.45, -2.85);', 'const ORB = new THREE.Vector3(0, 1.02, -2.85);')
          insert_at = s.index('function CinematicBackdrop()')
          helper = '''function prepareGroundLandscape(source: THREE.Object3D) {
  const world = source.clone(true);
  const keep = /terrain|ground|path|floor|rock|stone|moss|land|slope|hill|basin/i;
  const reject = /portal|ring|nexus|chamber|threshold|marker|label|debug|beam|column|monolith|orb|avatar|mannequin/i;
  let kept = 0;
  const bounds = new THREE.Box3();
  world.traverse((object) => {
    if (!(object instanceof THREE.Mesh)) return;
    object.visible = keep.test(object.name) && !reject.test(object.name);
    if (!object.visible) return;
    const rocky = /rock|stone|basin/.test(object.name.toLowerCase());
    object.material = new THREE.MeshStandardMaterial({ color: rocky ? "#56615a" : "#314d3a", roughness: 0.97, metalness: 0 });
    object.castShadow = true;
    object.receiveShadow = true;
    object.updateWorldMatrix(true, false);
    const meshBounds = new THREE.Box3().setFromObject(object);
    if (!meshBounds.isEmpty()) bounds.union(meshBounds);
    kept += 1;
  });
  if (kept > 0 && !bounds.isEmpty()) {
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());
    const span = Math.max(size.x, size.z, 1);
    const scale = Math.min(1.35, 24 / span);
    world.scale.setScalar(scale);
    world.position.set(-center.x * scale, -bounds.min.y * scale - 0.34, -4.2 - center.z * scale);
  }
  world.userData.homeLandscapeSupport = true;
  world.userData.visibleLandscapeMeshes = kept;
  return world;
}

function prepareAuthoredOrb(source: THREE.Object3D) {
  const orb = source.clone(true);
  orb.traverse((object) => {
    if (!(object instanceof THREE.Mesh)) return;
    object.castShadow = true;
    object.receiveShadow = true;
  });
  orb.scale.setScalar(0.46);
  orb.userData.authoredOrb = true;
  return orb;
}

'''
          s = s[:insert_at] + helper + s[insert_at:]
          one('  const sanctuary = useGLTF(HOME_SANCTUARY_MODEL);\n  const authored = useMemo(() => prepareAuthoredSanctuary(sanctuary.scene), [sanctuary.scene]);', '  const sanctuary = useGLTF(HOME_SANCTUARY_MODEL);\n  const ground = useGLTF(HOME_GROUND_MODEL);\n  const authored = useMemo(() => prepareAuthoredSanctuary(sanctuary.scene), [sanctuary.scene]);\n  const landscape = useMemo(() => prepareGroundLandscape(ground.scene), [ground.scene]);')
          one('      <primitive object={authored} />\n      <mesh name="home-natural-terrain"', '      <primitive object={authored} />\n      <primitive object={landscape} />\n      <mesh name="home-natural-terrain"')
          one('<meshStandardMaterial color="#29483a" roughness={0.98} metalness={0} />', '<meshStandardMaterial color="#355640" roughness={0.99} metalness={0} />')
          a = s.index('function orbitGeometry(')
          b = s.index('function GroundThresholdLandmark', a)
          replacement = '''function OrbSanctuary({ onOpen }: { onOpen: () => void }) {
  const reducedMotion = useContext(ReducedMotionContext);
  const source = useGLTF(HOME_ORB_MODEL);
  const orb = useMemo(() => prepareAuthoredOrb(source.scene), [source.scene]);
  const root = useRef<THREE.Group>(null);
  const light = useRef<THREE.PointLight>(null);
  useFrame(({ clock }) => {
    if (reducedMotion) return;
    const breathe = 1 + Math.sin(clock.elapsedTime * 0.82) * 0.012;
    root.current?.scale.setScalar(breathe);
    if (light.current) light.current.intensity = 0.72 + Math.sin(clock.elapsedTime * 0.82) * 0.08;
  });
  return (
    <group ref={root} name="home-orb-sanctuary" position={ORB} onClick={(event) => { event.stopPropagation(); onOpen(); }} userData={{ geometryOwner: "urai-orb-avatar-v1.glb", primitiveSphere: false }}>
      <primitive object={orb} />
      <pointLight ref={light} color="#8fc9c4" intensity={0.72} distance={5.5} decay={2} />
    </group>
  );
}

'''
          s = s[:a] + replacement + s[b:]
          s = s.replace('camera.lookAt(look.current.x, 1.28 + pitch.current, look.current.z);', 'camera.lookAt(look.current.x, 0.96 + pitch.current, look.current.z);')
          assert s.count('camera.lookAt(look.current.x, 0.96 + pitch.current, look.current.z);') == 2
          one('const candidates: readonly [Nearby, THREE.Vector3, number][] = [["orb", ORB, 2.2], ["ground", GROUND_THRESHOLD, 2.55], ["life-map", LIFE_MAP_LOOKOUT, 2.55]];', 'const candidates: readonly [Nearby, THREE.Vector3, number][] = [["orb", ORB, 3.15], ["ground", GROUND_THRESHOLD, 2.55], ["life-map", LIFE_MAP_LOOKOUT, 2.55]];')
          one('{cosmic ? <color attach="background" args={["#01050b"]} /> : null}', '<color attach="background" args={[cosmic ? "#01050b" : "#183033"]} />')
          one('<Stars radius={190} depth={90} count={cosmic ? 2500 : 1100} factor={cosmic ? 2.8 : 1.25} saturation={0.16} fade speed={props.reducedMotion ? 0 : 0.035} />', '<Stars radius={190} depth={90} count={cosmic ? 2500 : 180} factor={cosmic ? 2.8 : 0.48} saturation={0.12} fade speed={props.reducedMotion ? 0 : 0.018} />')
          one('<fogExp2 attach="fog" args={[cosmic ? "#050b14" : "#0b1b1c", cosmic ? 0.0017 : 0.014]} />', '<fogExp2 attach="fog" args={[cosmic ? "#050b14" : "#183033", cosmic ? 0.0017 : 0.011]} />')
          one('<ambientLight intensity={cosmic ? 0.12 : 0.42} color="#c6dbd4" />', '<ambientLight intensity={cosmic ? 0.12 : 0.58} color="#d2ded6" />')
          one('<hemisphereLight args={["#a7cdd0", "#101b13", cosmic ? 0.2 : 0.72]} />', '<hemisphereLight args={["#bfd7d2", "#17251a", cosmic ? 0.2 : 0.88]} />')
          one('<directionalLight position={[9, 17, 4]} intensity={cosmic ? 0.32 : 1.7} color="#e8eee5" castShadow />', '<directionalLight position={[8, 16, 7]} intensity={cosmic ? 0.32 : 2.0} color="#eef3e8" castShadow />')
          one('data-home-runtime-assets="home-entry-chamber-v1.glb polyhaven-fern-02-geometry-v1.glb local-three-dimensional-terrain living-orb reflecting-water"', 'data-home-runtime-assets="home-entry-chamber-v1.glb ground-world-terrain-v1.glb polyhaven-fern-02-geometry-v1.glb urai-orb-avatar-v1.glb reflecting-water"')
          one('data-home-animation-owner={HOME_SCANNED_COMPOSITION_V1}', 'data-home-animation-owner={HOME_COMPOSITION_V2}')
          one('gl={{ antialias: true, alpha: true, powerPreference: "high-performance" }}', 'gl={{ antialias: true, alpha: false, powerPreference: "high-performance" }}')
          one('gl.setClearColor(0x000000, 0);', 'gl.setClearColor(0x183033, 1);')
          assert '<sphereGeometry args={[1,64,64]}' not in s
          assert 'OrbDust' not in s
          path.write_text(s)
          css = Path('urai-tier1/src/spatial/layout/HomeWorldProduction.module.css')
          c = css.read_text()
          assert c.count('opacity: .028;') == 1 and c.count('opacity: .02;') == 1
          css.write_text(c.replace('opacity: .028;', 'opacity: .006;', 1).replace('opacity: .02;', 'opacity: .004;', 1))
          proof = Path('scripts/run-continuous-spatial-proof-v22-natural.mjs')
          p = proof.read_text()
          old = 'const newOwner = "result.animationOwner === \'provider-natural-world-plus-authored-physical-interactions\'"'
          new = 'const newOwner = "result.animationOwner === \'owned-sanctuary-ground-landscape-cc0-nature-authored-orb\'"'
          assert p.count(old) == 1
          proof.write_text(p.replace(old, new, 1))
          PY

      - name: Validate repair source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'HOME_COMPOSITION_V2' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'ground-world-terrain-v1.glb' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'urai-orb-avatar-v1.glb' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F '<sphereGeometry args={[1,64,64]}' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs

      - name: Commit only from still-current exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
            test "$current_head" = "$URAI_SOURCE_SHA" || { echo "stale repair input; refusing push"; exit 0; }
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx urai-tier1/src/spatial/layout/HomeWorldProduction.module.css scripts/run-continuous-spatial-proof-v22-natural.mjs
          git commit -m 'Recompose Home with authored Orb and governed landscape'
          gh auth setup-git
          git push origin "HEAD:${PR_BRANCH}"
