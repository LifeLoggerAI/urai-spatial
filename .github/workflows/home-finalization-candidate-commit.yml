# V62 owner-authorized finalization verifier. V62 is already materially landed; this workflow verifies the exact PR head without rematerializing retired V61 art.
name: Home Finalization Candidate Commit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/capture-home-state-proof.mjs'
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/run-continuous-spatial-proof-v22-natural.mjs'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
      - '.github/workflows/home-scanned-composition-forge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-v62-finalization-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-v62-finalization:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'home-final-v24-certify-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact V62 candidate markers
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -f operations/assets/home-v48-production-asset-provenance.json
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          grep -Fq "visualOwner:'asset-backed-service-vault-v62'" "$source"
          grep -Fq "visualTreatment:'v62-asset-backed-service-vault-retained-pixel-rebuild'" "$source"
          grep -Fq "v62-open-service-vault-with-integrated-geology-no-display-frame" "$source"
          grep -Fq "home-v62-machine-main-manifold" "$source"
          grep -Fq "home-v62-orb-core-housing" "$source"
          grep -Fq "v62-governed-glb-animation-identity-retained-invisibly-for-state-contract" "$source"
          grep -Fq "asset-backed-service-vault-v62-plus-governed-orb-identity" scripts/run-continuous-spatial-proof-v22-natural.mjs
          grep -Fq "cinematic-pbr-v62-asset-backed-service-vault" scripts/capture-natural-home-orb-proof.mjs
          grep -Fq "data-home-art-certification=\"v62-retained-pixel-candidate-not-certified\"" "$source"
          ! grep -Fq "v61-deep-reliquary-vault-retained-pixel-rebuild" "$source"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify V62 realism contract and type-check
        run: |
          node --test --test-concurrency=1 urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          node --check scripts/capture-home-state-proof.mjs
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs
          pnpm --dir urai-tier1 exec tsc --noEmit
