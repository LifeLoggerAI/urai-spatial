name: Home Finalization Candidate Commit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/apply-ground-v41-production-finish.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ground-v41-pr-materializer-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  forge-verify-and-commit:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'home-final-v24-certify-20260826') ||
       (github.event_name == 'workflow_dispatch' && github.ref_name == 'home-final-v24-certify-20260826'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOME_BRANCH: home-final-v24-certify-20260826
      HOME_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact Ground V41 authoring head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HOME_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Refuse stale authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$HOME_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HOME_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply deterministic Ground V41 repair
        run: python3 scripts/apply-ground-v41-production-finish.py

      - name: Verify Ground V41 visual invariants and release contracts
        working-directory: urai-tier1
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/home-ground-lifemap-art-bible-contract.test.mjs tests/post-deploy-ground-smoke-contract.test.mjs tests/embodied-exploration-contract.test.mjs
          pnpm exec tsc --noEmit

      - name: Commit materialized Ground V41 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HOME_BRANCH}" --jq .object.sha)"
          test "$current" = "$HOME_EXACT_HEAD"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/spatial/world/persistentRealmAtmosphere.css urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs
          git diff --cached --quiet && { echo 'No Ground V41 materialization required.'; exit 0; }
          git commit -m 'Ground: materialize V41 seam and readability repair'
          gh auth setup-git
          git push origin HEAD:${HOME_BRANCH}
