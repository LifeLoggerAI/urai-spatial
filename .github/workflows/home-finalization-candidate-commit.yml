name: Home Finalization Candidate Commit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
      - 'urai-tier1/src/spatial/world/GroundWorldProduction.tsx'
      - 'urai-tier1/src/spatial/world/persistentRealmAtmosphere.css'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
      - 'tests/native-doorway-proof.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-v44-exact-head-verifier-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-v44:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'home-final-v24-certify-20260826') ||
       (github.event_name == 'workflow_dispatch' && github.ref_name == 'home-final-v24-certify-20260826'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HOME_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.HOME_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact clean V44 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HOME_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          grep -F 'v44-monolithic-reliquary-apse-production-candidate' "$source"
          grep -F 'v44-broad-floor-rooted-armor-yoke-no-spikes-no-feet' "$source"
          grep -F 'v44-authored-heart-filament-core-no-glass-petals-no-rings' "$source"
          ! grep -F '<coneGeometry' "$source"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify V44 Home Ground and embodied contracts
        working-directory: urai-tier1
        run: node --test --test-concurrency=1 tests/home-relic-machine-realism-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs tests/home-postdeploy-art-readiness-contract.test.mjs tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs tests/continuous-spatial-restoration-contract.test.mjs
      - name: Type-check exact V44
        working-directory: urai-tier1
        run: pnpm exec tsc --noEmit
