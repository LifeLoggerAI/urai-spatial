# Current owner-authorized Home finalization verifier.
# This workflow verifies the exact PR head without materializing or mutating art.
name: Home Finalization Candidate Commit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/capture-home-state-proof.mjs'
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/run-continuous-spatial-proof-v22-natural.mjs'
      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProduction.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
      - 'urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs'
      - 'urai-tier1/tests/final-aaa-world-convergence-contract.test.mjs'
      - 'urai-tier1/tests/embodied-exploration-contract.test.mjs'
      - '.github/workflows/home-scanned-composition-forge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-current-finalization-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-current-home-finalization:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'home-final-v24-certify-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact scanned-industrial V70 candidate markers
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f operations/assets/home-v48-production-asset-provenance.json
          entry='urai-tier1/src/spatial/layout/HomeWorldProduction.tsx'
          source='urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx'
          telemetry='urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
          proof='scripts/capture-natural-home-orb-proof.mjs'
          grep -Fq 'HomeWorldProductionV70 as HomeWorldProduction' "$entry"
          grep -Fq "const ROCK_FACE_A = '/assets/urai/home-production/cc0/polyhaven-v48/rock_face_01/asset.gltf'" "$source"
          grep -Fq "const ROCK_FACE_B = '/assets/urai/home-production/cc0/polyhaven-v48/rock_face_02/asset.gltf'" "$source"
          grep -Fq "const PIPE_SYSTEM = '/assets/urai/home-production/cc0/polyhaven-v48/modular_industrial_pipes_01/asset.gltf'" "$source"
          grep -Fq "const CAGED_SCONCE = '/assets/urai/home-production/cc0/polyhaven-v48/industrial_caged_sconce/asset.gltf'" "$source"
          grep -Fq "const GOVERNED_HOME = '/assets/urai/generated/models/home-entry-chamber-v1.glb'" "$source"
          grep -Fq "const GOVERNED_PORTAL = '/assets/urai/generated/models/portal-ring-master-v1.glb'" "$source"
          grep -Fq "const GOVERNED_ORB = '/assets/urai/generated/models/urai-orb-avatar-v1.glb'" "$source"
          grep -Fq 'home-v70-scanned-reliquary-back' "$source"
          grep -Fq 'home-v70-scanned-left-shell' "$source"
          grep -Fq 'home-v70-scanned-right-shell' "$source"
          grep -Fq 'home-v70-left-service-manifold' "$source"
          grep -Fq 'home-v70-right-service-manifold' "$source"
          grep -Fq 'home-orb-engineered-cradle' "$source"
          grep -Fq 'home-life-map-physical-portal' "$source"
          grep -Fq 'v70-compact-six-panel-contained-machine-core' "$source"
          grep -Fq 'data-home-visible-world="v70-deep-photogrammetry-industrial-reliquary"' "$source"
          grep -Fq 'data-home-physical-base="deep-scanned-rock-industrial-machine-sanctuary"' "$source"
          grep -Fq 'data-home-visual-grade="cinematic-pbr-v70-deep-scanned-industrial"' "$source"
          grep -Fq 'data-home-final-art-revision="v70-recessed-apse-rebuild"' "$source"
          grep -Fq 'data-home-art-certification="v70-retained-pixel-candidate-not-certified"' "$source"
          grep -Fq 'data-home-visible-production-assets="rock_face_01 rock_face_02 modular_industrial_pipes_01 industrial_caged_sconce rock-tile-floor-pbr"' "$source"
          grep -Fq 'const HOME_SPAWN = { x: 0, z: 4.6 } as const' "$telemetry"
          grep -Fq 'const HOME_ORB = { x: 0, z: -9.1 } as const' "$telemetry"
          grep -Fq 'const HOME_GROUND = { x: -4.85, z: -8.25 } as const' "$telemetry"
          grep -Fq 'const HOME_LIFE_MAP = { x: 4.85, z: -8.25 } as const' "$telemetry"
          grep -Fq 'dpr={1}' "$source"
          grep -Fq 'shadow-mapSize-width={768}' "$source"
          grep -Fq 'setPortalSequence(traversal), reducedMotion ? 180 : 900' "$source"
          grep -Fq 'setPortalSequence(closing), reducedMotion ? 700 : 2500' "$source"
          grep -Fq "schemaVersion: 'urai-scanned-industrial-home-orb-proof-6'" "$proof"
          grep -Fq 'verifyGovernedBinary(homePath)' "$proof"
          grep -Fq 'verifyGovernedBinary(orbPath)' "$proof"
          grep -Fq 'verifyGovernedBinary(portalPath)' "$proof"
          grep -Fq 'record.portalRequests.length >= 1' "$proof"
          grep -Fq "record.visibleProductionAssets === 'rock_face_01 rock_face_02 modular_industrial_pipes_01 industrial_caged_sconce rock-tile-floor-pbr'" "$proof"
          ! grep -Eq '<GovernedModel|RoundedBox|icosahedronGeometry|torusGeometry|#37e5ff|#48dfff|#6cf4ff' "$source"
          ! grep -Fq 'PRODUCTION CERTIFIED' "$source"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify root-scoped Home realism and proof syntax
        run: |
          node --test --test-concurrency=1 urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          node --check scripts/capture-home-state-proof.mjs
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs
      - name: Verify tier-one Home restoration and exploration contracts
        working-directory: urai-tier1
        run: |
          node --test --test-concurrency=1 tests/continuous-spatial-restoration-contract.test.mjs
          node --test --test-concurrency=1 tests/final-aaa-world-convergence-contract.test.mjs
          node --test --test-concurrency=1 tests/embodied-exploration-contract.test.mjs
          pnpm exec tsc --noEmit
      - name: Prove exact final clean candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
