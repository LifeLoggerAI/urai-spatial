# V57 owner-authored materialization workflow. Owner exact-head certification trigger after runtime materialization 34915e457dd143f1543b2d4db89d8a1e3a47f803.
name: Home Finalization Candidate Commit
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-finalization-candidate-commit.yml'
      - 'scripts/apply-home-v57-photogrammetry-service-vault.py'
      - 'scripts/capture-home-state-proof.mjs'
      - 'scripts/capture-natural-home-orb-proof.mjs'
      - 'scripts/run-continuous-spatial-proof-v22-natural.mjs'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-v57-photogrammetry-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
jobs:
  materialize-v57-photogrammetry:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'home-final-v24-certify-20260826'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: home-final-v24-certify-20260826
          fetch-depth: 1
          persist-credentials: true
      - name: Materialize V57 photogrammetry service vault once
        shell: bash
        run: |
          set -euo pipefail
          test -f operations/assets/home-v48-production-asset-provenance.json
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          if grep -Fq "v57-photogrammetry-service-vault-retained-pixel-rebuild" "$source"; then
            echo 'V57 photogrammetry service vault is already materialized.'
          else
            python3 scripts/apply-home-v57-photogrammetry-service-vault.py
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Verify V57 realism contract and type-check
        run: |
          node --test --test-concurrency=1 urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          node --check scripts/capture-home-state-proof.mjs
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs
          pnpm --dir urai-tier1 exec tsc --noEmit
      - name: Commit V57 runtime when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI'
          git config user.email 'LifeLoggerAI@gmail.com'
          git add \
            scripts/apply-home-v57-photogrammetry-service-vault.py \
            scripts/capture-natural-home-orb-proof.mjs \
            scripts/run-continuous-spatial-proof-v22-natural.mjs \
            urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx \
            urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          if git diff --cached --quiet; then
            echo 'No V57 changes to commit'
            exit 0
          fi
          git commit -m 'Home: materialize V57 photogrammetry service vault'
          git push origin HEAD:home-final-v24-certify-20260826
