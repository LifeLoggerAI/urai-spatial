name: One-time predeploy receipt source repair

on:
  push:
    branches:
      - release/protected-rollback-authority-20260711-v2
    paths:
      - '.github/workflows/one-time-fix-predeploy-receipt-order.yml'
  pull_request:
    branches: [main]
    types: [synchronize, reopened]
    paths:
      - '.github/workflows/one-time-fix-predeploy-receipt-order.yml'

permissions:
  contents: write

concurrency:
  group: one-time-predeploy-receipt-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'release/protected-rollback-authority-20260711-v2' || github.ref == 'refs/heads/release/protected-rollback-authority-20260711-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/protected-rollback-authority-20260711-v2
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Keep predeploy receipt outside source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          operator_path = Path('scripts/live-release.mjs')
          regression_path = Path('urai-tier1/tests/final-protected-deploy-regressions.test.mjs')
          operator = operator_path.read_text()

          old_signature = "function writeReceipt(targetSha, status, details = {}) {\n  const directory = path.join('deployment-receipt', targetSha)\n"
          new_signature = dedent("""\
          function resolvePreDeployReceiptRoot() {
            if (!runnerTemp) throw new Error('RUNNER_TEMP is required for pre-deploy receipt evidence')
            const receiptRoot = path.resolve(runnerTemp, 'deployment-receipt')
            const resolvedAuthorityRoot = realpathSync(authorityRoot)
            if (receiptRoot === resolvedAuthorityRoot || receiptRoot.startsWith(`${resolvedAuthorityRoot}${path.sep}`)) {
              throw new Error('Pre-deploy receipt evidence must remain outside the authority checkout')
            }
            return receiptRoot
          }

          function writeReceipt(
            targetSha,
            status,
            details = {},
            { rootDirectory = 'deployment-receipt', includeLiveRollbackProvenance = true } = {},
          ) {
            const directory = path.join(rootDirectory, targetSha)
          """)
          if old_signature in operator:
              operator = operator.replace(old_signature, new_signature, 1)
          elif 'function resolvePreDeployReceiptRoot()' not in operator:
              raise SystemExit('writeReceipt signature marker missing')

          old_copy = "  if (status === 'deployed' && liveRollbackProvenancePath && existsSync(liveRollbackProvenancePath)) {"
          new_copy = "  if (includeLiveRollbackProvenance && liveRollbackProvenancePath && existsSync(liveRollbackProvenancePath)) {"
          if old_copy in operator:
              operator = operator.replace(old_copy, new_copy, 1)
          elif new_copy not in operator:
              raise SystemExit('provenance copy marker missing')

          old_predeploy = dedent("""\
          const htmlFiles = releaseFiles.filter((entry) => entry.path.endsWith('.html'))
          const receiptPath = writeReceipt(targetSha, 'built-awaiting-deploy', {
            authorizedMainSha,
            authoritySha,
            outputFileCount: releaseFiles.length,
            htmlFileCount: htmlFiles.length,
            indexSha256: sha256('urai-tier1/out/index.html'),
            fingerprintSha256: sha256('urai-tier1/out/release-fingerprint.json'),
            ...outputDetails,
          })

          const preDeployMainSha = assertRemoteMainUnchanged(targetSha)
          """)
          new_predeploy = dedent("""\
          const htmlFiles = releaseFiles.filter((entry) => entry.path.endsWith('.html'))
          const preDeployReceiptRoot = resolvePreDeployReceiptRoot()
          const receiptPath = writeReceipt(targetSha, 'built-awaiting-deploy', {
            authorizedMainSha,
            authoritySha,
            outputFileCount: releaseFiles.length,
            htmlFileCount: htmlFiles.length,
            indexSha256: sha256('urai-tier1/out/index.html'),
            fingerprintSha256: sha256('urai-tier1/out/release-fingerprint.json'),
            ...outputDetails,
          }, {
            rootDirectory: preDeployReceiptRoot,
            includeLiveRollbackProvenance: false,
          })
          if (output('git', ['status', '--porcelain'])) {
            throw new Error('Current authority checkout must remain clean immediately before deployment')
          }

          const preDeployMainSha = assertRemoteMainUnchanged(targetSha)
          """)
          if old_predeploy in operator:
              operator = operator.replace(old_predeploy, new_predeploy, 1)
          elif 'rootDirectory: preDeployReceiptRoot' not in operator:
              raise SystemExit('predeploy receipt block marker missing')

          old_final = dedent("""\
          writeReceipt(targetSha, 'deployed', {
            authorizedMainSha,
            preDeployMainSha,
            authoritySha,
            outputFileCount: releaseFiles.length,
            htmlFileCount: htmlFiles.length,
            indexSha256: sha256('urai-tier1/out/index.html'),
            fingerprintSha256: sha256('urai-tier1/out/release-fingerprint.json'),
            previousReceipt: receiptPath,
            ...outputDetails,
          })
          """)
          new_final = dedent("""\
          const finalReceiptPath = writeReceipt(targetSha, 'deployed', {
            authorizedMainSha,
            preDeployMainSha,
            authoritySha,
            outputFileCount: releaseFiles.length,
            htmlFileCount: htmlFiles.length,
            indexSha256: sha256('urai-tier1/out/index.html'),
            fingerprintSha256: sha256('urai-tier1/out/release-fingerprint.json'),
            previousReceipt: receiptPath,
            ...outputDetails,
          })
          copyFileSync(receiptPath, path.join(path.dirname(finalReceiptPath), 'predeploy-receipt.json'))
          """)
          if old_final in operator:
              operator = operator.replace(old_final, new_final, 1)
          elif 'predeploy-receipt.json' not in operator:
              raise SystemExit('final receipt block marker missing')

          operator_path.write_text(operator)

          regression_path.write_text(dedent(r"""\
          import test from 'node:test'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import path from 'node:path'
          import { fileURLToPath } from 'node:url'

          const testDirectory = path.dirname(fileURLToPath(import.meta.url))
          const repositoryRoot = path.resolve(testDirectory, '../..')
          const readRepositoryFile = (file) => readFileSync(path.join(repositoryRoot, file), 'utf8').replace(/\r\n?/g, '\n')
          const releaseOperator = readRepositoryFile('scripts/live-release.mjs')
          const credentialBoundary = readRepositoryFile('scripts/verify-release-credential-boundary.mjs')

          test('prebuilt release verification rejects every dot-prefixed path segment', () => {
            assert.match(releaseOperator, /relative\.split\('\/'\)\.some\(\(segment\) => segment\.startsWith\('\.'\)\)/)
            assert.doesNotMatch(releaseOperator, /path\.posix\.basename\(relative\)\.startsWith\('\.'\)/)
            assert.match(releaseOperator, /Firebase-ignored dot path/)
          })

          test('live rollback provenance evidence stays outside the authority checkout', () => {
            assert.match(credentialBoundary, /const runnerTemp = \(process\.env\.RUNNER_TEMP \|\| ''\)\.trim\(\)/)
            assert.match(credentialBoundary, /path\.join\(runnerTemp, 'release-control-evidence'\)/)
            assert.match(credentialBoundary, /verifyLiveRollbackProvenance\(\{ evidenceDirectory: liveRollbackEvidenceDirectory \}\)/)
          })

          test('predeploy receipt stays external and is retained only after deploy', () => {
            assert.match(releaseOperator, /function resolvePreDeployReceiptRoot\(\)/)
            assert.match(releaseOperator, /rootDirectory: preDeployReceiptRoot/)
            assert.match(releaseOperator, /includeLiveRollbackProvenance: false/)
            assert.match(releaseOperator, /Current authority checkout must remain clean immediately before deployment/)
            assert.match(releaseOperator, /copyFileSync\(receiptPath, path\.join\(path\.dirname\(finalReceiptPath\), 'predeploy-receipt\.json'\)\)/)

            const predeployReceipt = releaseOperator.indexOf("writeReceipt(targetSha, 'built-awaiting-deploy'")
            const deploy = releaseOperator.indexOf('deployHostingWithTemporaryCredentials()')
            const finalReceipt = releaseOperator.indexOf("writeReceipt(targetSha, 'deployed'")
            const retainedPredeploy = releaseOperator.indexOf("'predeploy-receipt.json'")
            assert.ok(predeployReceipt >= 0 && deploy > predeployReceipt && finalReceipt > deploy && retainedPredeploy > finalReceipt)
          })
          """))
          PY

      - name: Syntax-check release operator
        run: node --check scripts/live-release.mjs

      - name: Syntax-check permanent regression test
        run: node --check urai-tier1/tests/final-protected-deploy-regressions.test.mjs

      - name: Prove clean patch
        run: git diff --check

      - name: Commit normal source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/live-release.mjs urai-tier1/tests/final-protected-deploy-regressions.test.mjs
          git diff --cached --check
          git commit -m 'Keep predeploy receipts outside authority checkout'
          git push origin HEAD:release/protected-rollback-authority-20260711-v2
