name: URAI Spatial Copy and Identity Policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'ENVIRONMENT.md'
      - 'docs/**'
      - 'urai-tier1/src/**'
      - 'urai-tier1/public/humans.txt'
      - 'urai-tier1/public/llms.txt'
      - 'urai-tier1/public/.well-known/urai-authority.json'
      - 'scripts/check-spatial-copy.mjs'
      - 'scripts/audit-public-identity.mjs'
      - '.github/workflows/spatial-copy-policy.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'ENVIRONMENT.md'
      - 'docs/**'
      - 'urai-tier1/src/**'
      - 'urai-tier1/public/humans.txt'
      - 'urai-tier1/public/llms.txt'
      - 'urai-tier1/public/.well-known/urai-authority.json'
      - 'scripts/check-spatial-copy.mjs'
      - 'scripts/audit-public-identity.mjs'
      - '.github/workflows/spatial-copy-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatial-copy-identity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  copy-and-identity-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture claims and identity policy output
        id: policy
        shell: bash
        run: |
          set +e
          {
            echo '=== PUBLIC CLAIMS POLICY ==='
            node scripts/check-spatial-copy.mjs
            claims_status=$?
            echo
            echo '=== PUBLIC IDENTITY AUTHORITY ==='
            node scripts/audit-public-identity.mjs
            identity_status=$?
            if test "$claims_status" = '0' && test "$identity_status" = '0'; then
              status=0
            else
              status=1
            fi
            echo "claims_status=$claims_status"
            echo "identity_status=$identity_status"
          } > copy-identity-policy.log 2>&1
          status=$?
          cat copy-identity-policy.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload policy output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-copy-identity-${{ env.TARGET_SHA }}
          path: copy-identity-policy.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce policy result
        shell: bash
        run: test "${{ steps.policy.outputs.status }}" = "0"
