name: URAI Spatial Copy Policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'README.md'
      - 'ENVIRONMENT.md'
      - 'docs/**'
      - 'urai-tier1/src/**'
      - 'scripts/check-spatial-copy.mjs'
      - '.github/workflows/spatial-copy-policy.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'ENVIRONMENT.md'
      - 'docs/**'
      - 'urai-tier1/src/**'
      - 'scripts/check-spatial-copy.mjs'
      - '.github/workflows/spatial-copy-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatial-copy-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copy-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check public provider and XR claims
        run: node scripts/check-spatial-copy.mjs
