name: Shadow Council Runtime Proof

on:
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/shadow-council-runtime-proof.yml'
      - 'scripts/capture-shadow-council-runtime-proof.mjs'
      - 'urai-tier1/src/app/shadow/**'
      - 'urai-tier1/src/app/council/**'
      - 'urai-tier1/src/spatial/realms/SpatialRealmExperience.tsx'
      - 'urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx'

permissions:
  contents: read

concurrency:
  group: shadow-council-runtime-proof-${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build exact static candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/shadow-council-runtime-proof
          pnpm build:static 2>&1 | tee artifacts/shadow-council-runtime-proof/build-static.log

      - name: Install exact Chromium
        run: pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Capture exact-head Shadow and Council proof
        shell: bash
        run: |
          set -euo pipefail
          output=artifacts/shadow-council-runtime-proof
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > "$output/http-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/shadow/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/council/ >/dev/null
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_PROOF_DIR="$output" \
          URAI_EXACT_HEAD="$URAI_EXACT_HEAD" \
            node scripts/capture-shadow-council-runtime-proof.mjs

      - name: Prove complete exact-head receipt
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - artifacts/shadow-council-runtime-proof/receipt.json "$URAI_EXACT_HEAD" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const [path, head] = process.argv.slice(2)
          const receipt = JSON.parse(await readFile(path, 'utf8'))
          if (receipt.exactHead !== head) throw new Error('Exact-head receipt mismatch')
          if (receipt.captureTransport !== 'chrome-devtools-protocol-page-captureScreenshot') throw new Error('Unexpected capture transport')
          if (receipt.captures.length !== 4) throw new Error('Expected four route captures')
          if (receipt.errors.length) throw new Error(`Receipt contains ${receipt.errors.length} errors`)
          if (!receipt.captures.every((capture) => capture.passed)) throw new Error('A route capture did not pass')
          const expected = new Set(['shadow:desktop', 'shadow:mobile', 'council:desktop', 'council:mobile'])
          for (const capture of receipt.captures) expected.delete(`${capture.realm}:${capture.viewport}`)
          if (expected.size) throw new Error(`Missing captures: ${[...expected].join(', ')}`)
          NODE

      - name: Upload exact-head Shadow and Council proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shadow-council-runtime-proof-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/shadow-council-runtime-proof
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
