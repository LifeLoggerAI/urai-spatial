name: Captured Reality Integrity

on:
  pull_request:
    paths:
      - '.github/workflows/captured-reality-integrity.yml'
      - 'scripts/*captured-reality*.mjs'
      - 'apps/functions/src/capturedReality.ts'
      - 'urai-tier1/src/spatial/captured-reality/**'
      - 'urai-tier1/src/app/spatial/captured-reality/**'
      - 'urai-tier1/tests/captured-reality-*.test.mjs'
      - 'operations/captured-reality/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: captured-reality-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify private delivery, binary integrity and source preservation
        working-directory: urai-tier1
        run: node --import tsx --test tests/captured-reality-*.test.mjs
      - name: Typecheck runtime
        run: pnpm --dir urai-tier1 typecheck
