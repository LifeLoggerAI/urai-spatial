name: Captured Reality Integrity

on:
  pull_request:
    paths:
      - '.github/workflows/captured-reality-integrity.yml'
      - 'scripts/*captured-reality*.mjs'
      - 'scripts/*interpretive-world*.mjs'
      - 'apps/functions/src/capturedReality.ts'
      - 'apps/functions/src/interpretiveWorld.ts'
      - 'urai-tier1/src/spatial/captured-reality/**'
      - 'urai-tier1/src/app/spatial/captured-reality/**'
      - 'urai-tier1/src/spatial/interpretive-world/**'
      - 'urai-tier1/src/app/spatial/interpretive-world/**'
      - 'urai-tier1/src/app/replay/CinematicReplayClient.tsx'
      - 'urai-tier1/tests/captured-reality-*.test.mjs'
      - 'urai-tier1/tests/interpretive-world-*.test.mjs'
      - 'operations/captured-reality/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: captured-reality-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - name: Verify exact candidate
        run: test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install media tools for source-preservation controls
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
      - name: Require actual media tools for source-preservation controls
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -version
          ffprobe -version
      - name: Verify private delivery, generated-world integrity and source preservation
        working-directory: urai-tier1
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t spatial_reconstruction_tests < <(find tests -maxdepth 1 -type f \( -name 'captured-reality-*.test.mjs' -o -name 'interpretive-world-*.test.mjs' \) -print | sort)
          if [ "${#spatial_reconstruction_tests[@]}" -eq 0 ]; then
            echo "::error::No spatial reconstruction integrity tests were found."
            exit 66
          fi
          printf 'Spatial reconstruction integrity tests: %s\n' "${#spatial_reconstruction_tests[@]}"
          node --import tsx --test "${spatial_reconstruction_tests[@]}"
          node ../scripts/validate-interpretive-world-visual-acceptance.mjs ../operations/captured-reality/worlds/URAI-IW-001-QUIET-RESET/visual-acceptance.current.json
          node ../scripts/validate-interpretive-world-receipt.mjs ../operations/captured-reality/worlds/URAI-IW-001-QUIET-RESET/reconstruction-receipt.pending.json
      - name: Typecheck runtime
        run: pnpm --dir urai-tier1 typecheck
