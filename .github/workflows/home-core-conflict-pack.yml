name: Home Core Conflict Pack

on:
  pull_request:
    branches:
      - release/core-convergence-20260729

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/home-onto-core-resolve-20260729
      - name: Reproduce exact Home merge and capture stages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p conflict-pack/files
          merge_status=0
          git merge --no-commit --no-ff 51db7b3ba77a657659da34ca5e146e049dd03d31 || merge_status=$?
          git status --short > conflict-pack/git-status.txt
          git ls-files -u > conflict-pack/unmerged-index.txt
          git diff --name-only --diff-filter=U > conflict-pack/conflicted-paths.txt
          git merge-base HEAD 51db7b3ba77a657659da34ca5e146e049dd03d31 > conflict-pack/merge-base.txt
          printf '%s\n' "8792f909ce7e4f747dafb23c8e50e774eb1690ca" > conflict-pack/core-head.txt
          printf '%s\n' "51db7b3ba77a657659da34ca5e146e049dd03d31" > conflict-pack/home-head.txt
          printf '%s\n' "$merge_status" > conflict-pack/merge-exit.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            safe="conflict-pack/files/$path"
            mkdir -p "$(dirname "$safe")"
            cp "$path" "$safe.merged" || true
            git show ":1:$path" > "$safe.base" 2>/dev/null || true
            git show ":2:$path" > "$safe.core" 2>/dev/null || true
            git show ":3:$path" > "$safe.home" 2>/dev/null || true
          done < conflict-pack/conflicted-paths.txt
          git diff --cc > conflict-pack/combined-conflict.diff || true
      - uses: actions/upload-artifact@v4
        with:
          name: home-core-conflict-pack
          path: conflict-pack
          retention-days: 14
