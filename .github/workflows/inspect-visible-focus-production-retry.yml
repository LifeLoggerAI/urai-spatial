name: Inspect visible Focus production retry

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-visible-focus-production-retry.yml'

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: inspect-visible-focus-production-retry-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPECTED_DISPATCH_SHA: e2850a8b9dbd2fd11ee0197505da278322916aa0
  DISPATCHER_WORKFLOW: one-time-production-bootstrap-dispatch.yml
  PRODUCTION_WORKFLOW: spatial-live-deploy.yml

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact inspector candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Prove exact read-only inspector scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "$EXPECTED_HEAD")"
          test "$changed" = '.github/workflows/inspect-visible-focus-production-retry.yml'
          node - <<'NODE'
          const { readFileSync } = require('node:fs')
          const source = readFileSync('.github/workflows/inspect-visible-focus-production-retry.yml', 'utf8')
          const forbidden = [
            ['actions:', 'write'].join(' '),
            ['firebase', 'deploy'].join(' '),
            ['FIREBASE_', 'SERVICE_ACCOUNT_JSON'].join(''),
            ['workflow', 'run'].join(' '),
            ['/', 'dispatches'].join(''),
          ]
          for (const marker of forbidden) {
            if (source.includes(marker)) throw new Error(`Inspector contains forbidden mutation marker: ${marker}`)
          }
          NODE

      - name: Inspect dispatcher and protected production run
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/visible-focus-production-retry"
          mkdir -p "$receipt_dir"
          dispatch_id=''
          production_id=''

          for attempt in $(seq 1 60); do
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${DISPATCHER_WORKFLOW}/runs?branch=main&event=push&per_page=100" \
              > "$receipt_dir/dispatcher-runs.json"
            dispatch_id="$(jq -r --arg sha "$EXPECTED_DISPATCH_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0].id // empty' "$receipt_dir/dispatcher-runs.json")"

            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${PRODUCTION_WORKFLOW}/runs?branch=main&event=workflow_dispatch&per_page=100" \
              > "$receipt_dir/production-runs.json"
            production_id="$(jq -r --arg sha "$EXPECTED_DISPATCH_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | reverse | .[0].id // empty' "$receipt_dir/production-runs.json")"

            if test -n "$dispatch_id" && test -n "$production_id"; then
              break
            fi
            sleep 10
          done

          if test -n "$dispatch_id"; then
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${dispatch_id}" > "$receipt_dir/dispatcher-run.json"
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${dispatch_id}/jobs?per_page=100" > "$receipt_dir/dispatcher-jobs.json"
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${dispatch_id}/artifacts?per_page=100" > "$receipt_dir/dispatcher-artifacts.json"
          else
            printf '%s\n' '{}' > "$receipt_dir/dispatcher-run.json"
            printf '%s\n' '{"jobs":[]}' > "$receipt_dir/dispatcher-jobs.json"
            printf '%s\n' '{"artifacts":[]}' > "$receipt_dir/dispatcher-artifacts.json"
          fi

          if test -n "$production_id"; then
            for attempt in $(seq 1 60); do
              gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${production_id}" > "$receipt_dir/production-run.json"
              status="$(jq -r '.status // empty' "$receipt_dir/production-run.json")"
              if test "$status" = 'completed'; then
                break
              fi
              sleep 10
            done
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${production_id}/jobs?per_page=100" > "$receipt_dir/production-jobs.json"
            gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${production_id}/artifacts?per_page=100" > "$receipt_dir/production-artifacts.json"
            if ! gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${production_id}/pending_deployments" > "$receipt_dir/pending-deployments.json"; then
              printf '%s\n' '[]' > "$receipt_dir/pending-deployments.json"
            fi

            mkdir -p "$receipt_dir/production-logs"
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${production_id}/logs" > "$receipt_dir/production-logs.zip" \
              && unzip -q "$receipt_dir/production-logs.zip" -d "$receipt_dir/production-logs"; then
              grep -RhoE 'sites/urai-4dc1d/(releases|versions)/[A-Za-z0-9._-]+' "$receipt_dir/production-logs" \
                | sort -u > "$receipt_dir/hosting-resource-markers.txt" || true
            else
              printf '%s\n' 'production-log-download-unavailable' > "$receipt_dir/hosting-resource-markers.txt"
            fi
          else
            printf '%s\n' '{}' > "$receipt_dir/production-run.json"
            printf '%s\n' '{"jobs":[]}' > "$receipt_dir/production-jobs.json"
            printf '%s\n' '{"artifacts":[]}' > "$receipt_dir/production-artifacts.json"
            printf '%s\n' '[]' > "$receipt_dir/pending-deployments.json"
            printf '%s\n' 'production-run-not-found' > "$receipt_dir/hosting-resource-markers.txt"
          fi

          cache_bust="$(date +%s%N)"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "https://urai.app/release-fingerprint.json?receipt=${cache_bust}" \
            > "$receipt_dir/custom-domain-release-fingerprint.json"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
            "https://urai-4dc1d.web.app/release-fingerprint.json?receipt=${cache_bust}" \
            > "$receipt_dir/firebase-site-release-fingerprint.json"

          DISPATCH_ID="$dispatch_id" PRODUCTION_ID="$production_id" RECEIPT_DIR="$receipt_dir" node - <<'NODE'
          const crypto = require('node:crypto')
          const fs = require('node:fs')
          const path = require('node:path')
          const dir = process.env.RECEIPT_DIR
          const read = (name, fallback) => {
            try { return JSON.parse(fs.readFileSync(path.join(dir, name), 'utf8')) } catch { return fallback }
          }
          const readText = (name) => {
            try { return fs.readFileSync(path.join(dir, name), 'utf8') } catch { return '' }
          }
          const hash = (value) => crypto.createHash('sha256').update(value).digest('hex')
          const dispatcher = read('dispatcher-run.json', {})
          const production = read('production-run.json', {})
          const dispatcherJobs = read('dispatcher-jobs.json', { jobs: [] }).jobs || []
          const productionJobs = read('production-jobs.json', { jobs: [] }).jobs || []
          const dispatcherArtifacts = read('dispatcher-artifacts.json', { artifacts: [] }).artifacts || []
          const productionArtifacts = read('production-artifacts.json', { artifacts: [] }).artifacts || []
          const pending = read('pending-deployments.json', [])
          const customFingerprintText = readText('custom-domain-release-fingerprint.json')
          const firebaseFingerprintText = readText('firebase-site-release-fingerprint.json')
          const customFingerprint = read('custom-domain-release-fingerprint.json', {})
          const firebaseFingerprint = read('firebase-site-release-fingerprint.json', {})
          const hostingMarkers = readText('hosting-resource-markers.txt').split(/\r?\n/).map((item) => item.trim()).filter(Boolean)
          const expectedSha = process.env.EXPECTED_DISPATCH_SHA
          const summary = {
            schemaVersion: 'urai-visible-focus-production-retry-inspection-2',
            inspectedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            expectedDispatchSha: expectedSha,
            inspectorHead: process.env.GITHUB_SHA,
            dispatcher: process.env.DISPATCH_ID ? {
              found: true,
              id: Number(process.env.DISPATCH_ID),
              name: dispatcher.name,
              event: dispatcher.event,
              headSha: dispatcher.head_sha,
              status: dispatcher.status,
              conclusion: dispatcher.conclusion,
              url: dispatcher.html_url,
              createdAt: dispatcher.created_at,
              updatedAt: dispatcher.updated_at,
              jobs: dispatcherJobs.map(({ id, name, status, conclusion, html_url }) => ({ id, name, status, conclusion, url: html_url })),
              artifacts: dispatcherArtifacts.map(({ id, name, size_in_bytes, digest, expired, created_at, expires_at }) => ({ id, name, sizeInBytes: size_in_bytes, digest, expired, createdAt: created_at, expiresAt: expires_at })),
            } : { found: false },
            production: process.env.PRODUCTION_ID ? {
              found: true,
              id: Number(process.env.PRODUCTION_ID),
              name: production.name,
              event: production.event,
              headSha: production.head_sha,
              status: production.status,
              conclusion: production.conclusion,
              url: production.html_url,
              createdAt: production.created_at,
              updatedAt: production.updated_at,
              runStartedAt: production.run_started_at,
              jobs: productionJobs.map(({ id, name, status, conclusion, html_url, started_at, completed_at }) => ({ id, name, status, conclusion, url: html_url, startedAt: started_at, completedAt: completed_at })),
              artifacts: productionArtifacts.map(({ id, name, size_in_bytes, digest, expired, created_at, expires_at }) => ({ id, name, sizeInBytes: size_in_bytes, digest, expired, createdAt: created_at, expiresAt: expires_at })),
              pendingDeployments: Array.isArray(pending) ? pending.map((item) => ({
                environmentId: item.environment?.id || null,
                environmentName: item.environment?.name || null,
                waitTimer: item.wait_timer || 0,
                currentUserCanApprove: Boolean(item.current_user_can_approve),
                reviewers: item.reviewers || [],
              })) : [],
              hostingResourceMarkers: hostingMarkers,
            } : { found: false },
            publicFingerprintParity: {
              customDomain: customFingerprint,
              firebaseSite: firebaseFingerprint,
              customDomainSha256: hash(customFingerprintText),
              firebaseSiteSha256: hash(firebaseFingerprintText),
              exactBytesMatch: customFingerprintText === firebaseFingerprintText,
              customDomainContainsExpectedSha: customFingerprintText.includes(expectedSha),
              firebaseSiteContainsExpectedSha: firebaseFingerprintText.includes(expectedSha),
            },
          }
          fs.writeFileSync(path.join(dir, 'summary.json'), `${JSON.stringify(summary, null, 2)}\n`)
          console.log(JSON.stringify(summary, null, 2))
          NODE

          echo "receipt_dir=$receipt_dir" >> "$GITHUB_OUTPUT"

      - name: Upload read-only inspection receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visible-focus-production-retry-final-inspection-${{ env.EXPECTED_DISPATCH_SHA }}
          path: ${{ steps.inspect.outputs.receipt_dir }}
          if-no-files-found: error
          retention-days: 365
