name: One-shot geography after Mirror

on:
  pull_request:
    types: [reopened]
    branches:
      - feat/mirror-embodied-spatial-realm-v2-20260801

permissions:
  contents: write

concurrency:
  group: one-shot-geography-after-mirror
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/geographic-location-launch-minimum-v5-20260801
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
  REVIEWED_GEOGRAPHY_HEAD: f8b624251514ee979d230efc7675e8936f6e14de

jobs:
  materialize:
    if: github.repository == 'LifeLoggerAI/urai-spatial' && github.event.pull_request.head.ref == 'feat/geographic-location-launch-minimum-v5-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact geography branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify exact clean authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin "$REVIEWED_GEOGRAPHY_HEAD"
          git cat-file -e "$REVIEWED_GEOGRAPHY_HEAD^{commit}"

      - name: Apply reviewed geography and preserve Mirror contracts
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/urai-maps-cloud-bootstrap.yml
            operations/maps/geographic-maps-launch-policy.json
            urai-tier1/src/app/location-map/geographic-route-bridge.css
            urai-tier1/src/app/location-map/geographic/GeographicLocationClient.tsx
            urai-tier1/src/app/location-map/geographic/geographic-location.css
            urai-tier1/src/app/location-map/geographic/page.tsx
            urai-tier1/src/spatial/places/geographicLocationVault.ts
            urai-tier1/tests/geographic-location-vault.test.mjs
            urai-tier1/tests/geographic-maps-launch-policy.test.mjs
            urai-tier1/tests/maps-cloud-bootstrap-contract.test.mjs
          )
          git checkout "$REVIEWED_GEOGRAPHY_HEAD" -- "${files[@]}"

          python3 - <<'PY'
          from pathlib import Path

          page = Path('urai-tier1/src/app/location-map/page.tsx')
          source = page.read_text()
          if "import Link from 'next/link'" not in source:
              source = "import Link from 'next/link'\n" + source
          css_anchor = "import '@/spatial/places/location-map-mobile-release-fixes.css'\n"
          if "import './geographic-route-bridge.css'" not in source:
              if css_anchor not in source:
                  raise SystemExit('location-map CSS anchor not found')
              source = source.replace(css_anchor, css_anchor + "import './geographic-route-bridge.css'\n", 1)
          section_anchor = '      <LocationMapNativeWheelBridge />\n'
          bridge = '''      <aside className="locationMapGeographicBridge" aria-label="Geographic location layer">\n        <span>Optional supporting layer</span>\n        <Link href="/location-map/geographic/">Open consent-gated geographic places</Link>\n      </aside>\n'''
          if 'locationMapGeographicBridge' not in source:
              if section_anchor not in source:
                  raise SystemExit('location-map bridge anchor not found')
              source = source.replace(section_anchor, section_anchor + bridge, 1)
          page.write_text(source)

          runner = Path('urai-tier1/scripts/run-unit-contract-tests-compact.mjs')
          source = runner.read_text()
          anchor = "  'tests/v1-aaa-asset-program-matrix-contract.test.mjs',\n"
          additions = [
              "  'tests/geographic-location-vault.test.mjs',\n",
              "  'tests/geographic-maps-launch-policy.test.mjs',\n",
              "  'tests/maps-cloud-bootstrap-contract.test.mjs',\n",
          ]
          if anchor not in source:
              raise SystemExit('compact-runner geography anchor not found')
          insertion = anchor + ''.join(item for item in additions if item.strip(" ,'\n") not in source)
          if insertion != anchor:
              source = source.replace(anchor, insertion, 1)
          for required in [
              'mirror-spatial-realm-contract.test.mjs',
              'mirror-canonical-owner-hydration-contract.test.mjs',
              'geographic-location-vault.test.mjs',
              'geographic-maps-launch-policy.test.mjs',
              'maps-cloud-bootstrap-contract.test.mjs',
          ]:
              if required not in source:
                  raise SystemExit(f'missing required compact-runner contract: {required}')
          runner.write_text(source)
          PY

          git rm .github/workflows/one-shot-geography-after-mirror.yml
          git add "${files[@]}" \
            urai-tier1/src/app/location-map/page.tsx \
            urai-tier1/scripts/run-unit-contract-tests-compact.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '13'

      - name: Verify exact combined boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Open consent-gated geographic places' urai-tier1/src/app/location-map/page.tsx
          grep -Fq 'geographic-location-vault.test.mjs' urai-tier1/scripts/run-unit-contract-tests-compact.mjs
          grep -Fq 'mirror-spatial-realm-contract.test.mjs' urai-tier1/scripts/run-unit-contract-tests-compact.mjs
          grep -Fq 'mirror-canonical-owner-hydration-contract.test.mjs' urai-tier1/scripts/run-unit-contract-tests-compact.mjs
          test ! -e .github/workflows/one-shot-geography-after-mirror.yml

      - name: Commit combined geography stack
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stack consent-gated geography after Mirror'
          git push origin "HEAD:$TARGET_BRANCH"
