name: One-time final deploy review repairs v2

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/one-time-finalize-deploy-review-repairs-v2.yml'

permissions:
  contents: write

concurrency:
  group: one-time-finalize-deploy-review-repairs-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'release/protected-rollback-authority-20260711-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/protected-rollback-authority-20260711-v2
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Finalize reviewed repairs and remove temporary authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          operator = Path('scripts/live-release.mjs').read_text()
          if "relative.split('/').some((segment) => segment.startsWith('.'))" not in operator:
              raise SystemExit('release operator does not reject every dot-prefixed path segment')
          if "path.posix.basename(relative).startsWith('.')" in operator:
              raise SystemExit('retired basename-only dot-path verifier remains')

          credential = Path('scripts/verify-release-credential-boundary.mjs').read_text()
          if 'liveRollbackEvidenceDirectory' not in credential or 'RUNNER_TEMP' not in credential:
              raise SystemExit('live provenance evidence is not confined outside the authority checkout')

          workflow_path = Path('.github/workflows/spatial-live-deploy.yml')
          workflow = workflow_path.read_text()
          old = '            release-control-evidence/\n'
          new = '            ${{ runner.temp }}/release-control-evidence/\n'
          if old in workflow:
              workflow = workflow.replace(old, new, 1)
          elif new not in workflow:
              raise SystemExit('deployment receipt does not retain confined provenance evidence')
          workflow_path.write_text(workflow)

          Path('urai-tier1/tests/final-protected-deploy-regressions.test.mjs').write_text("""import test from 'node:test'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'

          const operator = readFileSync('scripts/live-release.mjs', 'utf8')
          const credentialBoundary = readFileSync('scripts/verify-release-credential-boundary.mjs', 'utf8')
          const workflow = readFileSync('.github/workflows/spatial-live-deploy.yml', 'utf8')

          test('prebuilt release verification rejects every dot-prefixed path segment', () => {
            assert.match(operator, /relative\.split\('\/'\)\.some\(\(segment\) => segment\.startsWith\('\.'\)\)/)
            assert.doesNotMatch(operator, /path\.posix\.basename\(relative\)\.startsWith\('\.'\)/)
            assert.match(operator, /Firebase-ignored dot path/)
          })

          test('live rollback provenance stays outside source and remains in the receipt', () => {
            assert.match(credentialBoundary, /liveRollbackEvidenceDirectory/)
            assert.match(credentialBoundary, /RUNNER_TEMP/)
            assert.match(credentialBoundary, /verifyLiveRollbackProvenance\(\{ evidenceDirectory: liveRollbackEvidenceDirectory \}\)/)
            assert.match(workflow, /\$\{\{ runner\.temp \}\}\/release-control-evidence\//)
            assert.doesNotMatch(workflow, /^\s+release-control-evidence\/$/m)
          })
          """.replace(/^          /gm, ''))

          for temporary in [
              '.github/workflows/one-time-finalize-deploy-review-repairs.yml',
              '.github/workflows/one-time-finalize-deploy-review-repairs-v2.yml',
          ]:
              path = Path(temporary)
              if path.exists():
                  path.unlink()
          PY

      - name: Run focused release authority regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/final-protected-deploy-regressions.test.mjs
          node urai-tier1/tests/exact-static-release-contract.test.mjs
          node scripts/audit-production-workflow-authority.mjs
          node scripts/verify-release-credential-boundary.mjs
          git diff --check

      - name: Commit clean reviewed authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize protected deploy review repairs'
          git push origin HEAD:release/protected-rollback-authority-20260711-v2
