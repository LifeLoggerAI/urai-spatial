name: URAI Spatial Live Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after release gate passes
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      firebase_project_id:
        description: Firebase project ID for manual deploy
        required: false
        type: string
      live_url:
        description: Optional live URL to smoke and record after deploy
        required: false
        type: string

concurrency:
  group: urai-spatial-live-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-check:
    name: Live release check
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright OS dependencies
        run: pnpm exec playwright install-deps chromium

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Run live release gate
        run: pnpm live:check

  manual-deploy:
    name: Manual Firebase deploy
    needs: live-check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'true'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deploy input
        run: |
          if [ -z "${{ inputs.firebase_project_id }}" ]; then
            echo "firebase_project_id is required when deploy=true" >&2
            exit 1
          fi
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ] && [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "Set FIREBASE_SERVICE_ACCOUNT or FIREBASE_TOKEN before deploying." >&2
            exit 1
          fi

      - name: Write Firebase service account
        if: secrets.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy to Firebase with service account
        if: secrets.FIREBASE_SERVICE_ACCOUNT != ''
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        run: pnpm live:deploy

      - name: Deploy to Firebase with token
        if: secrets.FIREBASE_SERVICE_ACCOUNT == '' && secrets.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
        run: pnpm live:deploy

      - name: Smoke live URL
        if: inputs.live_url != ''
        env:
          HOST: ${{ inputs.live_url }}
        run: pnpm smoke

      - name: Record live status
        if: inputs.live_url != ''
        env:
          LIVE_URL: ${{ inputs.live_url }}
          FIREBASE_PROJECT_ID: ${{ inputs.firebase_project_id }}
          RELEASE_GATE_RESULT: passed
          LIVE_SMOKE_RESULT: passed
          DEPLOY_METHOD: github-actions
        run: pnpm live:record

      - name: Commit live status ledger
        if: inputs.live_url != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/LIVE_STATUS.md
          git commit -m "Record verified URAI Spatial live status" || echo "No live status changes to commit"
          git push
