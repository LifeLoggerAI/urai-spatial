name: URAI Spatial Legacy Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify release without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate deployment authority
        run: node scripts/check-deployment-authority.mjs
      - name: Run release gate
        run: pnpm live:check
      - name: State release boundary
        run: |
          echo "This workflow performs verification only."
          echo "It does not deploy or write status to main."
          echo "The sole deployment authority is .github/workflows/urai-spatial-deploy.yml."
