name: Discover premium release runs

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/discover-premium-release.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: premium-release-operations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Cancel only the exact stale protected release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STALE_RUN_ID: '29458138935'
          STALE_SHA: 5385ad6d7e3cea5c8bb8e86cbda8e8c82ca8558b
        run: |
          set -euo pipefail
          mkdir -p receipt
          meta="$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$STALE_RUN_ID")"
          printf '%s\n' "$meta" > receipt/stale-run-before.json
          META="$meta" node - <<'NODE'
          const run = JSON.parse(process.env.META)
          if (String(run.id) !== process.env.STALE_RUN_ID) throw new Error('stale run id mismatch')
          if (run.head_sha !== process.env.STALE_SHA) throw new Error(`stale SHA mismatch: ${run.head_sha}`)
          if (run.event !== 'workflow_dispatch') throw new Error(`unexpected stale event: ${run.event}`)
          if (run.name !== 'URAI Canonical Production Release') throw new Error(`unexpected stale workflow: ${run.name}`)
          NODE
          status="$(META="$meta" node -e "process.stdout.write(JSON.parse(process.env.META).status)")"
          if [ "$status" = queued ] || [ "$status" = in_progress ] || [ "$status" = waiting ] || [ "$status" = pending ]; then
            http="$(curl --silent --show-error --output receipt/cancel-response.txt --write-out '%{http_code}' \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$STALE_RUN_ID/cancel")"
            test "$http" = 202
          fi
      - name: Query dispatcher and protected release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: a8aab1206f4c7ccf14cb3ce0390820179a130ce3
        run: |
          set -euo pipefail
          mkdir -p receipt
          api_get() {
            curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }
          api_get "https://api.github.com/repos/$REPOSITORY/actions/workflows/one-time-production-bootstrap-dispatch.yml/runs?branch=main&per_page=40" > receipt/dispatcher-runs.json
          api_get "https://api.github.com/repos/$REPOSITORY/actions/workflows/spatial-live-deploy.yml/runs?branch=main&per_page=40" > receipt/release-runs.json
          node - <<'NODE'
          const fs = require('node:fs')
          const target = process.env.TARGET_SHA
          const normalize = (run) => ({
            id: run.id,
            name: run.name,
            event: run.event,
            status: run.status,
            conclusion: run.conclusion,
            headSha: run.head_sha,
            headBranch: run.head_branch,
            runNumber: run.run_number,
            runAttempt: run.run_attempt,
            htmlUrl: run.html_url,
            createdAt: run.created_at,
            updatedAt: run.updated_at,
          })
          const dispatcher = JSON.parse(fs.readFileSync('receipt/dispatcher-runs.json', 'utf8')).workflow_runs || []
          const releases = JSON.parse(fs.readFileSync('receipt/release-runs.json', 'utf8')).workflow_runs || []
          const result = {
            schemaVersion: 'urai-premium-release-run-discovery-2',
            generatedAt: new Date().toISOString(),
            targetSha: target,
            dispatcherRuns: dispatcher.filter((run) => run.head_sha === target).map(normalize),
            protectedReleaseRuns: releases.filter((run) => run.head_sha === target).map(normalize),
            latestWorkflowDispatchRuns: releases.filter((run) => run.event === 'workflow_dispatch').slice(0, 10).map(normalize),
          }
          fs.writeFileSync('receipt/latest.json', JSON.stringify(result, null, 2) + '\n')
          console.log(JSON.stringify(result, null, 2))
          NODE
      - name: Upload operational discovery receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: premium-release-discovery-${{ github.event.pull_request.head.sha }}
          path: receipt
          if-no-files-found: error
          retention-days: 30
