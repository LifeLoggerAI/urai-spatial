name: Passport Ownership Vault Verification

on:
  push:
    branches:
      - main
      - feat/passport-ownership-vault-891-20260721
      - feat/passport-ownership-vault-891-rebased-20260722
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: passport-ownership-vault-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-and-capture:
    name: Exact-head local browser evidence without deployment credentials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Assert exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run Passport contract
        run: node urai-tier1/tests/passport-ownership-vault-contract.test.mjs
      - name: Build exact static candidate
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.EXACT_HEAD_SHA }}
          URAI_FIREBASE_STATIC_EXPORT: 'true'
        run: pnpm build:static
      - name: Serve exact static candidate locally
        shell: bash
        run: |
          set -euo pipefail
          test -f urai-tier1/out/passport/index.html
          python3 -m http.server 4174 --directory urai-tier1/out > passport-local-server.log 2>&1 &
          echo $! > passport-local-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/passport/ > local-passport.html; then
              break
            fi
            sleep 1
          done
          grep -q 'UrAi Passport' local-passport.html
          grep -q "$EXACT_HEAD_SHA" local-passport.html
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run local browser acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174
        run: pnpm exec playwright test tests/passport-browser-acceptance.spec.ts --config=playwright.config.ts
      - name: Build exact evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p passport-evidence
          cp -f passport-local-server.log local-passport.html passport-evidence/ 2>/dev/null || true
          printf 'exact_sha=%s\nrun_id=%s\nworkflow=%s\nmode=local-no-secrets\nproduction_targeted=false\ncaptured_at=%s\n' \
            "$EXACT_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > passport-evidence/manifest.txt
          evidence_paths=(passport-evidence)
          test -d test-results && evidence_paths+=(test-results)
          test -d playwright-report && evidence_paths+=(playwright-report)
          find "${evidence_paths[@]}" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > passport-evidence/SHA256SUMS
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-passport-local-acceptance-${{ env.EXACT_HEAD_SHA }}
          path: |
            passport-evidence
            test-results
            playwright-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
