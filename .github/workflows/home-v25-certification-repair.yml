name: Home V25 Certification Repair

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/home-v25-certification-repair.yml'
      - 'scripts/apply-home-v25-certification-repair.py'
      - 'scripts/apply-v25-proof-authority-repairs.py'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

permissions:
  contents: write

concurrency:
  group: home-v25-certification-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply deterministic V25 physical certification repair
        run: python3 scripts/apply-home-v25-certification-repair.py

      - name: Apply exact-head proof authority repairs
        run: python3 scripts/apply-v25-proof-authority-repairs.py

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile

      - name: Run focused Home and continuous-world contracts
        working-directory: urai-tier1
        run: node --test --test-concurrency=1 tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs tests/continuous-spatial-restoration-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs

      - name: Syntax-check repaired proof runners
        run: |
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/compare-legacy-asset-candidates.mjs
          node --check tests/mirror-release-proof.mjs

      - name: Commit repaired source only if branch head is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
            scripts/capture-natural-home-orb-proof.mjs
            scripts/compare-legacy-asset-candidates.mjs
            tests/mirror-release-proof.mjs
          )
          if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo 'Home V25 source and proof authority are already converged.'
            exit 0
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$current" = "${GITHUB_SHA}"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add "${paths[@]}"
          git commit -m 'Apply Home V25 physical and proof certification repairs'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826
