name: Home V25 Certification Repair

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/home-v25-certification-repair.yml'
      - 'scripts/apply-home-v25-certification-repair.py'
      - 'scripts/apply-v25-proof-authority-repairs.py'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

permissions:
  contents: write

concurrency:
  group: home-v25-certification-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact source files without repository checkout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p urai-tier1/src/spatial/layout scripts tests
          fetch_file() {
            local path="$1"
            gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_SHA}" --jq .content | tr -d '\n' | base64 -d > "${path}"
          }
          fetch_file urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          fetch_file scripts/capture-natural-home-orb-proof.mjs
          fetch_file scripts/compare-legacy-asset-candidates.mjs
          fetch_file tests/mirror-release-proof.mjs
          fetch_file scripts/apply-home-v25-certification-repair.py
          fetch_file scripts/apply-v25-proof-authority-repairs.py

      - name: Apply deterministic V25 physical certification repair
        run: python3 scripts/apply-home-v25-certification-repair.py

      - name: Apply exact-head proof authority repairs
        run: python3 scripts/apply-v25-proof-authority-repairs.py

      - name: Syntax-check repaired proof runners
        run: |
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/compare-legacy-asset-candidates.mjs
          node --check tests/mirror-release-proof.mjs

      - name: Create clean exact-head repair commit atomically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='home-final-v24-certify-20260826'
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)"
          test "$current" = "${GITHUB_SHA}"
          base_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${GITHUB_SHA}" --jq .tree.sha)"
          make_blob() {
            local path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' "${path}" | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha
          }
          b1="$(make_blob urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx)"
          b2="$(make_blob scripts/capture-natural-home-orb-proof.mjs)"
          b3="$(make_blob scripts/compare-legacy-asset-candidates.mjs)"
          b4="$(make_blob tests/mirror-release-proof.mjs)"
          tree="$(jq -n \
            --arg base "$base_tree" --arg b1 "$b1" --arg b2 "$b2" --arg b3 "$b3" --arg b4 "$b4" \
            '{base_tree:$base,tree:[
              {path:"urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx",mode:"100644",type:"blob",sha:$b1},
              {path:"scripts/capture-natural-home-orb-proof.mjs",mode:"100644",type:"blob",sha:$b2},
              {path:"scripts/compare-legacy-asset-candidates.mjs",mode:"100644",type:"blob",sha:$b3},
              {path:"tests/mirror-release-proof.mjs",mode:"100644",type:"blob",sha:$b4},
              {path:".github/workflows/home-v25-certification-repair.yml",mode:"100644",type:"blob",sha:null},
              {path:"scripts/apply-home-v25-certification-repair.py",mode:"100644",type:"blob",sha:null},
              {path:"scripts/apply-v25-proof-authority-repairs.py",mode:"100644",type:"blob",sha:null}
            ]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"
          commit="$(jq -n --arg message 'Apply Home V25 physical and proof certification repairs' --arg tree "$tree" --arg parent "$GITHUB_SHA" '{message:$message,tree:$tree,parents:[$parent]}' | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq .object.sha)"
          test "$current" = "${GITHUB_SHA}"
          jq -n --arg sha "$commit" '{sha:$sha,force:false}' | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" --input -
          echo "V25_REPAIR_COMMIT=${commit}"
