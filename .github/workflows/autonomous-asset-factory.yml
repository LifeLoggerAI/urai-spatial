name: Autonomous Asset Factory

on:
  pull_request:
    paths:
      - '.github/workflows/autonomous-asset-factory.yml'
      - 'docs/AUTONOMOUS_ASSET_FACTORY.md'
      - 'urai-tier1/config/asset-factory.json'
      - 'urai-tier1/scripts/asset-factory/**'
      - 'urai-tier1/src/spatial/assets/assetManifest.ts'
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urai-tier1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build bounded asset job plan
        run: node --import tsx scripts/asset-factory/plan-jobs.mjs
      - name: Validate existing promoted assets
        run: pnpm assets:validate
      - uses: actions/upload-artifact@v4
        with:
          name: autonomous-asset-factory-plan
          path: urai-tier1/artifacts/asset-factory/jobs/latest-plan.json
          if-no-files-found: error
