name: URAI Spatial Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      static_export:
        description: Use static Firebase hosting config
        required: true
        default: false
        type: boolean
      deploy_url:
        description: Optional deployed base URL for smoke route output and HTTP smoke validation
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/urai-spatial-deploy.yml'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/**'
      - 'tests/**'
      - 'urai-tier1/src/app/**'
      - 'urai-tier1/src/spatial/**'

jobs:
  deploy:
    name: Deploy URAI Spatial
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Guardian
        if: github.event_name == 'workflow_dispatch'
        run: corepack pnpm urai:guardian

      - name: Verify finalized V1 provider assets
        if: github.event_name == 'push'
        run: |
          node scripts/verify-asset-factory-handoff.mjs
          node scripts/audit-v123-asset-wall.mjs

      - name: Typecheck
        run: corepack pnpm check:types

      - name: Build
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.static_export }}
        run: corepack pnpm build

      - name: Build static export
        if: ${{ github.event_name == 'push' || inputs.static_export }}
        run: corepack pnpm build:static

      - name: Configure Firebase authentication
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]]; then
            credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
            printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${credentials_file}"
            python -m json.tool "${credentials_file}" > /dev/null
            chmod 600 "${credentials_file}"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${credentials_file}" >> "${GITHUB_ENV}"
            echo 'URAI_FIREBASE_AUTH_MODE=service-account' >> "${GITHUB_ENV}"
          elif [[ -n "${FIREBASE_TOKEN}" ]]; then
            echo 'URAI_FIREBASE_AUTH_MODE=token' >> "${GITHUB_ENV}"
          else
            echo '::error::Firebase deployment requires FIREBASE_SERVICE_ACCOUNT_JSON or FIREBASE_TOKEN.'
            exit 1
          fi

      - name: Firebase deploy hosting
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.static_export }}
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_FALLBACK_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_PROJECT_ID}"
          if [[ "${URAI_FIREBASE_AUTH_MODE}" == 'token' ]]; then
            test -n "${FIREBASE_FALLBACK_TOKEN}"
            npx firebase-tools deploy --only hosting --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_FALLBACK_TOKEN}"
          else
            unset FIREBASE_TOKEN FIREBASE_FALLBACK_TOKEN
            npx firebase-tools deploy --only hosting --project "${FIREBASE_PROJECT_ID}"
          fi

      - name: Firebase deploy static hosting
        if: ${{ github.event_name == 'push' || inputs.static_export }}
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_FALLBACK_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_PROJECT_ID}"
          if [[ "${URAI_FIREBASE_AUTH_MODE}" == 'token' ]]; then
            test -n "${FIREBASE_FALLBACK_TOKEN}"
            npx firebase-tools deploy --config firebase.static.json --only hosting --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_FALLBACK_TOKEN}"
          else
            unset FIREBASE_TOKEN FIREBASE_FALLBACK_TOKEN
            npx firebase-tools deploy --config firebase.static.json --only hosting --project "${FIREBASE_PROJECT_ID}"
          fi

      - name: Print smoke routes
        if: ${{ github.event_name == 'push' || inputs.deploy_url != '' }}
        env:
          URAI_DEPLOY_URL: ${{ inputs.deploy_url || 'https://urai.app' }}
        run: corepack pnpm smoke:deployed

      - name: Validate live routes
        if: ${{ github.event_name == 'push' || inputs.deploy_url != '' }}
        env:
          URAI_DEPLOY_URL: ${{ inputs.deploy_url || 'https://urai.app' }}
        run: corepack pnpm smoke:live

# Finalized V1 provider asset production deploy trigger, scoped to V1 web gates on push.
