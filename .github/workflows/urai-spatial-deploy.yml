name: URAI Spatial Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      target_sha:
        description: Full 40-character commit SHA to build and deploy
        required: true
        type: string
      rollback_sha:
        description: Full 40-character commit SHA approved for rollback
        required: true
        type: string
      expected_firebase_project:
        description: Firebase project expected from the selected environment secret
        required: true
        type: string
      deploy_url:
        description: Staging URL to verify; production must use https://urai.app
        required: false
        default: ''
        type: string
      confirmation:
        description: DEPLOY_URAI_STAGING or DEPLOY_URAI_PRODUCTION
        required: true
        type: string
      pull_request:
        description: Optional source PR number for the receipt
        required: false
        default: ''
        type: string
      release_issue:
        description: Optional release issue number for the receipt
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: urai-spatial-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact URAI Spatial SHA
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    env:
      URAI_TARGET_SHA: ${{ inputs.target_sha }}
      URAI_ROLLBACK_SHA: ${{ inputs.rollback_sha }}
      URAI_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      URAI_DEPLOYMENT_MODE: framework
      URAI_PULL_REQUEST: ${{ inputs.pull_request }}
      URAI_RELEASE_ISSUE: ${{ inputs.release_issue }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout exact target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Validate release identity and rollback
        shell: bash
        env:
          EXPECTED_FIREBASE_PROJECT: ${{ inputs.expected_firebase_project }}
          INPUT_DEPLOY_URL: ${{ inputs.deploy_url }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          [[ "${URAI_TARGET_SHA}" =~ ${sha_pattern} ]] || { echo '::error::target_sha must be a full lowercase 40-character SHA.'; exit 1; }
          [[ "${URAI_ROLLBACK_SHA}" =~ ${sha_pattern} ]] || { echo '::error::rollback_sha must be a full lowercase 40-character SHA.'; exit 1; }
          [[ "${URAI_TARGET_SHA}" != "${URAI_ROLLBACK_SHA}" ]] || { echo '::error::rollback_sha must differ from target_sha.'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${URAI_TARGET_SHA}" ]] || { echo '::error::Checked-out SHA does not match target_sha.'; exit 1; }
          git cat-file -e "${URAI_ROLLBACK_SHA}^{commit}" || { echo '::error::rollback_sha is not a reachable commit.'; exit 1; }
          [[ -n "${FIREBASE_PROJECT_ID}" ]] || { echo '::error::The selected environment requires FIREBASE_PROJECT_ID.'; exit 1; }
          [[ "${FIREBASE_PROJECT_ID}" == "${EXPECTED_FIREBASE_PROJECT}" ]] || { echo '::error::Environment Firebase project does not match expected_firebase_project.'; exit 1; }

          if [[ "${URAI_DEPLOY_ENVIRONMENT}" == 'production' ]]; then
            [[ "${DEPLOY_CONFIRMATION}" == 'DEPLOY_URAI_PRODUCTION' ]] || { echo '::error::Production confirmation must be DEPLOY_URAI_PRODUCTION.'; exit 1; }
            [[ "${FIREBASE_PROJECT_ID}" == 'urai-4dc1d' ]] || { echo '::error::Production may deploy only to urai-4dc1d.'; exit 1; }
            [[ -z "${INPUT_DEPLOY_URL}" || "${INPUT_DEPLOY_URL}" == 'https://urai.app' ]] || { echo '::error::Production verification URL must be https://urai.app.'; exit 1; }
            echo 'URAI_DEPLOY_URL=https://urai.app' >> "${GITHUB_ENV}"
            echo 'REQUIRE_CUSTOM_DOMAIN=true' >> "${GITHUB_ENV}"
          else
            [[ "${DEPLOY_CONFIRMATION}" == 'DEPLOY_URAI_STAGING' ]] || { echo '::error::Staging confirmation must be DEPLOY_URAI_STAGING.'; exit 1; }
            [[ "${FIREBASE_PROJECT_ID}" != 'urai-4dc1d' ]] || { echo '::error::Staging may not target the production Firebase project.'; exit 1; }
            [[ "${INPUT_DEPLOY_URL}" =~ ^https:// ]] || { echo '::error::Staging requires an explicit HTTPS deploy_url.'; exit 1; }
            echo "URAI_DEPLOY_URL=${INPUT_DEPLOY_URL%/}" >> "${GITHUB_ENV}"
            echo 'REQUIRE_CUSTOM_DOMAIN=false' >> "${GITHUB_ENV}"
          fi

          echo 'REQUIRE_LIVE_COMMIT_SHA=true' >> "${GITHUB_ENV}"
          echo "URAI_DEPLOYMENT_RECEIPT_PATH=operations/receipts/releases/${URAI_TARGET_SHA}/deployment-receipt.json" >> "${GITHUB_ENV}"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact lockfile
        run: corepack pnpm install --frozen-lockfile

      - name: Run authoritative release gates
        run: corepack pnpm verify:release

      - name: Build Firebase framework release
        run: corepack pnpm build

      - name: Configure Firebase authentication
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]]; then
            credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
            printf '%s' "${FIREBASE_SERVICE_ACCOUNT_JSON}" > "${credentials_file}"
            python -m json.tool "${credentials_file}" > /dev/null
            chmod 600 "${credentials_file}"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${credentials_file}" >> "${GITHUB_ENV}"
            echo 'URAI_FIREBASE_AUTH_MODE=service-account' >> "${GITHUB_ENV}"
          elif [[ -n "${FIREBASE_TOKEN}" ]]; then
            echo 'URAI_FIREBASE_AUTH_MODE=token' >> "${GITHUB_ENV}"
          else
            echo '::error::Firebase deployment requires FIREBASE_SERVICE_ACCOUNT_JSON or FIREBASE_TOKEN.'
            exit 1
          fi

      - name: Deploy Firebase framework hosting
        env:
          FIREBASE_FALLBACK_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${URAI_FIREBASE_AUTH_MODE}" == 'token' ]]; then
            test -n "${FIREBASE_FALLBACK_TOKEN}"
            npx firebase-tools deploy --only hosting --project "${FIREBASE_PROJECT_ID}" --token "${FIREBASE_FALLBACK_TOKEN}"
          else
            unset FIREBASE_TOKEN FIREBASE_FALLBACK_TOKEN
            npx firebase-tools deploy --only hosting --project "${FIREBASE_PROJECT_ID}"
          fi

      - name: Validate public route and query behavior
        run: |
          corepack pnpm smoke:deployed
          corepack pnpm smoke:live
          corepack pnpm smoke:home-xr:live

      - name: Write exact deployment receipt
        run: node scripts/write-deployment-receipt.mjs

      - name: Upload deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: urai-spatial-deployment-receipt-${{ inputs.target_sha }}
          path: ${{ env.URAI_DEPLOYMENT_RECEIPT_PATH }}
          if-no-files-found: error
          retention-days: 90
