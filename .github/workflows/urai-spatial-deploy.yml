name: URAI Spatial Exact-SHA Deploy

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full commit SHA already merged into main
        required: true
        type: string
      rollback_sha:
        description: Full known-good ancestor SHA approved for rollback
        required: true
        type: string
      certification_run_id:
        description: Passing V50 workflow run ID for target_sha
        required: true
        type: string
      expected_firebase_project:
        description: Firebase project expected from the protected environment
        required: true
        default: urai-4dc1d
        type: string
      deploy_url:
        description: Exact production URL to verify after deployment
        required: true
        default: https://urai.app
        type: string
      confirmation:
        description: Type DEPLOY VERIFIED URAI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: urai-spatial-deploy-production
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha }}
  ROLLBACK_SHA: ${{ inputs.rollback_sha }}
  CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
  EXPECTED_FIREBASE_PROJECT: ${{ inputs.expected_firebase_project }}
  URAI_DEPLOY_URL: ${{ inputs.deploy_url }}
  URAI_DEPLOY_ENVIRONMENT: production
  URAI_DEPLOY_CONFIRM: ${{ inputs.confirmation }}
  URAI_TARGET_SHA: ${{ inputs.target_sha }}
  URAI_ROLLBACK_SHA: ${{ inputs.rollback_sha }}
  URAI_FIREBASE_PROJECT: ${{ inputs.expected_firebase_project }}
  URAI_LIVE_BASE_URL: ${{ inputs.deploy_url }}
  URAI_DEPLOY_RECEIPT_DIR: deployment-receipt/production-release-${{ inputs.target_sha }}

jobs:
  deploy:
    name: Deploy exact V50-certified static URAI Spatial revision
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate target, rollback, project, and domain
        shell: bash
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-f]{40}$'
          [[ "$TARGET_SHA" =~ $sha_pattern ]] || { echo 'target_sha must be a lowercase full SHA' >&2; exit 1; }
          [[ "$ROLLBACK_SHA" =~ $sha_pattern ]] || { echo 'rollback_sha must be a lowercase full SHA' >&2; exit 1; }
          [ "$TARGET_SHA" != "$ROLLBACK_SHA" ] || { echo 'rollback_sha must differ from target_sha' >&2; exit 1; }
          [ "$URAI_DEPLOY_CONFIRM" = 'DEPLOY VERIFIED URAI' ] || { echo 'production confirmation is invalid' >&2; exit 1; }
          [ "$URAI_DEPLOY_URL" = 'https://urai.app' ] || { echo 'production URL must be https://urai.app' >&2; exit 1; }
          [ "$EXPECTED_FIREBASE_PROJECT" = 'urai-4dc1d' ] || { echo 'production Firebase project must be urai-4dc1d' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --force --prune
          git cat-file -e "$ROLLBACK_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || { echo 'target_sha is not merged into main' >&2; exit 1; }
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$TARGET_SHA" || { echo 'rollback_sha is not an ancestor of target_sha' >&2; exit 1; }
          [ -n "$FIREBASE_PROJECT_ID" ] || { echo 'FIREBASE_PROJECT_ID secret is required' >&2; exit 1; }
          [ "$FIREBASE_PROJECT_ID" = "$EXPECTED_FIREBASE_PROJECT" ] || { echo 'Firebase project mismatch' >&2; exit 1; }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Download exact V50 evidence
        uses: actions/download-artifact@v4
        with:
          name: v50-canonical-evidence-${{ inputs.target_sha }}
          path: certification-evidence
          repository: ${{ github.repository }}
          run-id: ${{ inputs.certification_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate V50 artifact identity
        shell: bash
        run: |
          set -euo pipefail
          tested_file="$(find certification-evidence -type f -name tested-commit-sha.txt -print -quit)"
          [ -n "$tested_file" ] || { echo 'V50 artifact is missing tested-commit-sha.txt' >&2; exit 1; }
          tested_sha="$(tr -d '\r\n ' < "$tested_file")"
          [ "$tested_sha" = "$TARGET_SHA" ] || { echo 'V50 artifact SHA mismatch' >&2; exit 1; }
          for name in canonical-contract.log route-contract.log runtime-compile.log runtime-smoke.log product-typecheck.log product-build.log; do
            file="$(find certification-evidence -type f -name "$name" -print -quit)"
            [ -n "$file" ] && [ -s "$file" ] || { echo "missing non-empty V50 evidence: $name" >&2; exit 1; }
          done

      - name: Validate single deployment authority
        run: node scripts/check-deployment-authority.mjs

      - name: Write and validate Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || { echo 'FIREBASE_SERVICE_ACCOUNT_JSON is required' >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
          if (value.project_id !== process.env.FIREBASE_PROJECT_ID) throw new Error('Service-account project mismatch');
          NODE

      - name: Execute exact static Hosting release
        run: node scripts/deploy-exact-static-release.mjs

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-spatial-deployment-${{ inputs.target_sha }}
          path: deployment-receipt
          if-no-files-found: error
          retention-days: 365
