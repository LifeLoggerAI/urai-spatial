name: URAI Spatial Exact-SHA Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      target_sha:
        description: Full commit SHA already merged into main
        required: true
        type: string
      rollback_sha:
        description: Full known-good ancestor SHA approved for rollback
        required: true
        type: string
      expected_firebase_project:
        description: Firebase project expected from the protected environment
        required: true
        default: urai-4dc1d
        type: string
      deploy_url:
        description: Exact HTTPS URL to verify after deployment
        required: true
        default: https://urai.app
        type: string
      confirmation:
        description: DEPLOY_URAI_STAGING or DEPLOY_URAI_PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: urai-spatial-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TARGET_SHA: ${{ inputs.target_sha }}
  ROLLBACK_SHA: ${{ inputs.rollback_sha }}
  EXPECTED_FIREBASE_PROJECT: ${{ inputs.expected_firebase_project }}
  URAI_DEPLOY_URL: ${{ inputs.deploy_url }}
  URAI_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}

jobs:
  deploy:
    name: Deploy exact URAI Spatial revision
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: ${{ inputs.environment }}
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate target, rollback, environment, and domain
        shell: bash
        env:
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          sha_pattern='^[0-9a-fA-F]{40}$'
          [[ "$TARGET_SHA" =~ $sha_pattern ]] || { echo 'target_sha must be a full SHA' >&2; exit 1; }
          [[ "$ROLLBACK_SHA" =~ $sha_pattern ]] || { echo 'rollback_sha must be a full SHA' >&2; exit 1; }
          [ "$TARGET_SHA" != "$ROLLBACK_SHA" ] || { echo 'rollback_sha must differ from target_sha' >&2; exit 1; }
          TARGET_SHA="$(echo "$TARGET_SHA" | tr '[:upper:]' '[:lower:]')"
          ROLLBACK_SHA="$(echo "$ROLLBACK_SHA" | tr '[:upper:]' '[:lower:]')"
          export TARGET_SHA ROLLBACK_SHA
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --force --prune
          git cat-file -e "$ROLLBACK_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || { echo 'target_sha is not merged into main' >&2; exit 1; }
          git merge-base --is-ancestor "$ROLLBACK_SHA" "$TARGET_SHA" || { echo 'rollback_sha is not an ancestor of target_sha' >&2; exit 1; }
          [ -n "$FIREBASE_PROJECT_ID" ] || { echo 'FIREBASE_PROJECT_ID secret is required' >&2; exit 1; }
          [ "$FIREBASE_PROJECT_ID" = "$EXPECTED_FIREBASE_PROJECT" ] || { echo 'Firebase project mismatch' >&2; exit 1; }

          if [ "$URAI_DEPLOY_ENVIRONMENT" = production ]; then
            [ "$DEPLOY_CONFIRMATION" = DEPLOY_URAI_PRODUCTION ] || { echo 'production confirmation is invalid' >&2; exit 1; }
            [ "$URAI_DEPLOY_URL" = https://urai.app ] || { echo 'production URL must be https://urai.app' >&2; exit 1; }
          else
            [ "$DEPLOY_CONFIRMATION" = DEPLOY_URAI_STAGING ] || { echo 'staging confirmation is invalid' >&2; exit 1; }
            [[ "$URAI_DEPLOY_URL" =~ ^https:// ]] || { echo 'staging URL must use HTTPS' >&2; exit 1; }
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate sole deployment authority
        run: node scripts/check-deployment-authority.mjs

      - name: Write and validate Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          [ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ] || { echo 'FIREBASE_SERVICE_ACCOUNT_JSON is required' >&2; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          node - <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, 'utf8'));
          if (value.project_id !== process.env.FIREBASE_PROJECT_ID) {
            throw new Error('Service-account project_id does not match FIREBASE_PROJECT_ID');
          }
          NODE

      - name: Run authoritative release gates
        run: pnpm live:check

      - name: Deploy canonical Firebase surfaces
        env:
          URAI_LIVE_VERIFY_SCRIPT: verify:release:critical
        run: pnpm live:deploy

      - name: Verify deployed routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deployment-receipt
          set -o pipefail
          HOST="$URAI_DEPLOY_URL" pnpm smoke 2>&1 | tee deployment-receipt/smoke.log
          URAI_DEPLOY_URL="$URAI_DEPLOY_URL" pnpm smoke:deployed 2>&1 | tee deployment-receipt/deployed-smoke.log
          URAI_DEPLOY_URL="$URAI_DEPLOY_URL" pnpm smoke:live 2>&1 | tee deployment-receipt/live-smoke.log

      - name: Write deployment receipt
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p deployment-receipt
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const hash = (file) => fs.existsSync(file)
            ? crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
            : null;
          const receipt = {
            schemaVersion: 'urai-deployment-receipt-2',
            repository: process.env.GITHUB_REPOSITORY,
            workflowRunId: process.env.GITHUB_RUN_ID,
            workflowRunUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            environment: process.env.URAI_DEPLOY_ENVIRONMENT,
            targetSha: process.env.TARGET_SHA,
            rollbackSha: process.env.ROLLBACK_SHA,
            firebaseProject: process.env.FIREBASE_PROJECT_ID,
            liveUrl: process.env.URAI_DEPLOY_URL,
            generatedAt: new Date().toISOString(),
            conclusion: process.env.JOB_STATUS,
            evidence: {
              smokeSha256: hash('deployment-receipt/smoke.log'),
              deployedSmokeSha256: hash('deployment-receipt/deployed-smoke.log'),
              liveSmokeSha256: hash('deployment-receipt/live-smoke.log')
            },
            boundary: 'Deployment evidence only. Browser, mobile, accessibility, exercised rollback, provider assets, and physical XR remain separate receipts.'
          };
          fs.writeFileSync('deployment-receipt/deployment.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE

      - name: Upload deployment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-spatial-deployment-${{ inputs.target_sha }}
          path: deployment-receipt
          if-no-files-found: error
          retention-days: 365
