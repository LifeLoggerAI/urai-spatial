name: Life Map route DOM source diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/lifemap-route-dom-source-diagnostic.yml
      - scripts/one-shot-lifemap-fullscreen-selected-actions.mjs

permissions:
  contents: read

concurrency:
  group: lifemap-route-dom-source-diagnostic-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'product/canonical-seven-fix-clean-r3-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false

      - name: Apply exact route DOM repair in isolated checkout
        run: |
          set -euo pipefail
          node scripts/one-shot-lifemap-fullscreen-selected-actions.mjs
          git diff --check
          git diff --name-only | sort

      - name: Install exact dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Capture focused source-contract result
        id: source
        shell: bash
        run: |
          set +e
          corepack pnpm --dir urai-tier1 test > /tmp/lifemap-route-dom-source.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "$status" > /tmp/lifemap-route-dom-source.status
          exit 0

      - name: Print focused source-contract result
        if: always()
        shell: bash
        run: |
          echo "SOURCE_CONTRACT_STATUS=$(cat /tmp/lifemap-route-dom-source.status 2>/dev/null || echo missing)"
          tail -n 100 /tmp/lifemap-route-dom-source.log 2>/dev/null || true

      - name: Retain focused source-contract result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemap-route-dom-source-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            /tmp/lifemap-route-dom-source.log
            /tmp/lifemap-route-dom-source.status
          if-no-files-found: error
          retention-days: 30

      - name: Require source contracts
        if: steps.source.outputs.status != '0'
        run: exit 1
