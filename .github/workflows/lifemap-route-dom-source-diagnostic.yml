name: Combined Spatial repair source diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/lifemap-route-dom-source-diagnostic.yml
      - scripts/one-shot-lifemap-fullscreen-selected-actions.mjs
      - scripts/one-shot-ground-mobile-containment.mjs

permissions:
  contents: read

concurrency:
  group: combined-spatial-source-diagnostic-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'product/canonical-seven-fix-clean-r3-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false

      - name: Apply both bounded repairs in isolated checkout
        run: |
          set -euo pipefail
          node scripts/one-shot-lifemap-fullscreen-selected-actions.mjs
          node scripts/one-shot-ground-mobile-containment.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            urai-tier1/src/app/GroundSpatialWorldClean.tsx \
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx \
            urai-tier1/src/spatial/world/lifeMapSelectedCinematic.css \
            urai-tier1/tests/accessibility-performance-source-contract.test.mjs \
            urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs \
            urai-tier1/tests/final-aaa-world-convergence-contract.test.mjs \
            urai-tier1/tests/lifemap-deep-link-controls-contract.test.mjs | sort)"

      - name: Install exact dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Capture combined source-contract result
        id: source
        shell: bash
        run: |
          set +e
          corepack pnpm --dir urai-tier1 test > /tmp/combined-spatial-source.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "$status" > /tmp/combined-spatial-source.status
          exit 0

      - name: Print combined source-contract result
        if: always()
        shell: bash
        run: |
          echo "SOURCE_CONTRACT_STATUS=$(cat /tmp/combined-spatial-source.status 2>/dev/null || echo missing)"
          tail -n 140 /tmp/combined-spatial-source.log 2>/dev/null || true

      - name: Retain combined source-contract result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-spatial-source-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            /tmp/combined-spatial-source.log
            /tmp/combined-spatial-source.status
          if-no-files-found: error
          retention-days: 30

      - name: Require source contracts
        if: steps.source.outputs.status != '0'
        run: exit 1
