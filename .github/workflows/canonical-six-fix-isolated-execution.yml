name: Canonical six-fix isolated execution
# trigger: strict nine-file publication 2026-07-18T18:55:00Z

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/home-ground-lifemap-art-bible-convergence-20260718
    paths:
      - .github/workflows/canonical-six-fix-isolated-execution.yml
      - scripts/one-shot-six-fix-direct.mjs
      - scripts/one-shot-six-fix-doorway-correction.mjs

permissions:
  contents: write

concurrency:
  group: canonical-six-fix-isolated-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  CLEAN_BASE: 1d172afdce8ce1e0b70152b62892dace4cf06fab
  SOURCE_BRANCH: exec/canonical-six-fix-product-r2-20260718
  PRODUCT_BRANCH: product/canonical-six-fix-clean-20260718

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'exec/canonical-six-fix-product-r2-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact isolated head
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Prove exact authority and apply bounded repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$CLEAN_BASE" HEAD)" = "$CLEAN_BASE"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff --name-only "$CLEAN_BASE...HEAD" | sort)" = "$(printf '%s\n' .github/workflows/canonical-six-fix-isolated-execution.yml scripts/one-shot-six-fix-direct.mjs scripts/one-shot-six-fix-doorway-correction.mjs | sort)"
          node scripts/one-shot-six-fix-direct.mjs 2>&1 | tee /tmp/canonical-six-fix-apply.log
          node scripts/one-shot-six-fix-doorway-correction.mjs 2>&1 | tee -a /tmp/canonical-six-fix-apply.log
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' scripts/run-live-visual-audit-current.mjs urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx urai-tier1/tests/accessibility-performance-source-contract.test.mjs urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs urai-tier1/tests/final-aaa-world-convergence-contract.test.mjs urai-tier1/tests/lifemap-scene-behavior.test.mjs | sort)"

      - name: Install exact dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Unit contracts
        id: unit
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm --dir urai-tier1 test 2>&1 | tee /tmp/canonical-six-fix-unit.log

      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm --dir urai-tier1 typecheck 2>&1 | tee /tmp/canonical-six-fix-typecheck.log

      - name: Build exact candidate
        id: build
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm --dir urai-tier1 build 2>&1 | tee /tmp/canonical-six-fix-build.log

      - name: Install Chromium
        id: chromium
        run: corepack pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Verify exact prior accessibility failures
        id: browser
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm exec playwright test --config=playwright.accessibility.config.ts accessibility-performance-evidence.spec.ts accessibility-performance-lifemap-independent.spec.ts --project=chromium --grep "mobile visible controls stay inside the visual viewport and safe area|reduced motion keeps selection and unwind behavior equivalent" 2>&1 | tee /tmp/canonical-six-fix-browser.log

      - name: Publish one clean nine-file product commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/urai-six-fix/scripts /tmp/urai-six-fix/urai-tier1/src/app /tmp/urai-six-fix/urai-tier1/src/components/lifemap /tmp/urai-six-fix/urai-tier1/src/spatial/navigation /tmp/urai-six-fix/urai-tier1/tests
          cp scripts/run-live-visual-audit-current.mjs /tmp/urai-six-fix/scripts/
          cp urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx /tmp/urai-six-fix/urai-tier1/src/app/
          cp urai-tier1/src/app/GroundSpatialWorldClean.tsx /tmp/urai-six-fix/urai-tier1/src/app/
          cp urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx /tmp/urai-six-fix/urai-tier1/src/components/lifemap/
          cp urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx /tmp/urai-six-fix/urai-tier1/src/spatial/navigation/
          cp urai-tier1/tests/accessibility-performance-source-contract.test.mjs /tmp/urai-six-fix/urai-tier1/tests/
          cp urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs /tmp/urai-six-fix/urai-tier1/tests/
          cp urai-tier1/tests/final-aaa-world-convergence-contract.test.mjs /tmp/urai-six-fix/urai-tier1/tests/
          cp urai-tier1/tests/lifemap-scene-behavior.test.mjs /tmp/urai-six-fix/urai-tier1/tests/
          git checkout --detach "$CLEAN_BASE"
          cp /tmp/urai-six-fix/scripts/run-live-visual-audit-current.mjs scripts/
          cp /tmp/urai-six-fix/urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/
          cp /tmp/urai-six-fix/urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/app/
          cp /tmp/urai-six-fix/urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/components/lifemap/
          cp /tmp/urai-six-fix/urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx urai-tier1/src/spatial/navigation/
          cp /tmp/urai-six-fix/urai-tier1/tests/accessibility-performance-source-contract.test.mjs urai-tier1/tests/
          cp /tmp/urai-six-fix/urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs urai-tier1/tests/
          cp /tmp/urai-six-fix/urai-tier1/tests/final-aaa-world-convergence-contract.test.mjs urai-tier1/tests/
          cp /tmp/urai-six-fix/urai-tier1/tests/lifemap-scene-behavior.test.mjs urai-tier1/tests/
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' scripts/run-live-visual-audit-current.mjs urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx urai-tier1/tests/accessibility-performance-source-contract.test.mjs urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs urai-tier1/tests/final-aaa-world-convergence-contract.test.mjs urai-tier1/tests/lifemap-scene-behavior.test.mjs | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(spatial): close bounded accessibility and runtime defects"
          git push --force-with-lease=refs/heads/$PRODUCT_BRANCH:$CLEAN_BASE origin HEAD:refs/heads/$PRODUCT_BRANCH
          echo "product_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Retain exact verification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-six-fix-diagnostics-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: /tmp/canonical-six-fix-*.log
          if-no-files-found: ignore
          retention-days: 90
