name: Canonical six-fix isolated execution

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/home-ground-lifemap-art-bible-convergence-20260718
    paths:
      - .github/workflows/canonical-six-fix-isolated-execution.yml
      - scripts/one-shot-six-fix-direct.mjs

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: canonical-six-fix-isolated-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  CLEAN_BASE: 1d172afdce8ce1e0b70152b62892dace4cf06fab
  SOURCE_BRANCH: exec/canonical-six-fix-product-r2-20260718
  PRODUCT_BRANCH: product/canonical-six-fix-clean-20260718

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'exec/canonical-six-fix-product-r2-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact isolated head
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Prove exact authority and apply bounded repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$CLEAN_BASE" HEAD)" = "$CLEAN_BASE"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff --name-only "$CLEAN_BASE...HEAD" | sort)" = "$(printf '%s\n' .github/workflows/canonical-six-fix-isolated-execution.yml scripts/one-shot-six-fix-direct.mjs | sort)"
          node scripts/one-shot-six-fix-direct.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx | sort)"

      - name: Install exact dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify contracts, types and build
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm --dir urai-tier1 test
          corepack pnpm --dir urai-tier1 typecheck
          corepack pnpm --dir urai-tier1 build

      - name: Install Chromium
        id: chromium
        run: corepack pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Verify exact prior accessibility failures
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm --dir urai-tier1 exec playwright test tests/accessibility-performance-evidence.spec.ts tests/accessibility-performance-lifemap-independent.spec.ts --project=chromium --grep "mobile visible controls stay inside the visual viewport and safe area|reduced motion keeps selection and unwind behavior equivalent"

      - name: Publish one clean four-file product commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/urai-six-fix/urai-tier1/src/app /tmp/urai-six-fix/urai-tier1/src/components/lifemap /tmp/urai-six-fix/urai-tier1/src/spatial/navigation
          cp urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx /tmp/urai-six-fix/urai-tier1/src/app/
          cp urai-tier1/src/app/GroundSpatialWorldClean.tsx /tmp/urai-six-fix/urai-tier1/src/app/
          cp urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx /tmp/urai-six-fix/urai-tier1/src/components/lifemap/
          cp urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx /tmp/urai-six-fix/urai-tier1/src/spatial/navigation/
          git checkout --detach "$CLEAN_BASE"
          cp /tmp/urai-six-fix/urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/
          cp /tmp/urai-six-fix/urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/app/
          cp /tmp/urai-six-fix/urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/components/lifemap/
          cp /tmp/urai-six-fix/urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx urai-tier1/src/spatial/navigation/
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(spatial): close bounded accessibility and runtime defects"
          git push --force-with-lease=refs/heads/$PRODUCT_BRANCH:$CLEAN_BASE origin HEAD:refs/heads/$PRODUCT_BRANCH
          echo "product_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post exact execution receipt
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const rows = [
              ['checkout', '${{ steps.checkout.outcome }}'],
              ['repair', '${{ steps.repair.outcome }}'],
              ['install', '${{ steps.install.outcome }}'],
              ['verify', '${{ steps.verify.outcome }}'],
              ['chromium', '${{ steps.chromium.outcome }}'],
              ['browser', '${{ steps.browser.outcome }}'],
              ['publish', '${{ steps.publish.outcome }}']
            ];
            const product = '${{ steps.publish.outputs.product_sha }}' || 'not-published';
            const body = ['Canonical six-fix isolated execution receipt.', '', ...rows.map(([name, outcome]) => `- ${name}: ${outcome}`), `- product SHA: ${product}`, '', `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });