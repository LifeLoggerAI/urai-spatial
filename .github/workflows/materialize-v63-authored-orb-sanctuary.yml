name: Materialize V63 Authored Orb Sanctuary

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - scripts/apply-home-v63-authored-orb-sanctuary.py
      - .github/workflows/materialize-v63-authored-orb-sanctuary.yml

permissions:
  contents: write

jobs:
  materialize:
    if: "github.event.head_commit.message != 'Home: materialize V63 authored Orb sanctuary'"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable triggering head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Prove exact triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current="$(git ls-remote origin refs/heads/home-final-v24-certify-20260826 | cut -f1)"
          test "$current" = "$GITHUB_SHA"

      - name: Materialize V63 authored Orb sanctuary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-home-v63-authored-orb-sanctuary.py
          git diff --check
          grep -q "visualOwner:'authored-orb-sanctuary-v63'" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -q "home-v63-visible-authored-orb" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -q "authored-orb-sanctuary-v63-plus-governed-orb-identity" scripts/run-continuous-spatial-proof-v22-natural.mjs
          grep -q "cinematic-pbr-v63-authored-orb-sanctuary" scripts/capture-natural-home-orb-proof.mjs
          ! grep -q "home-v62-orb-core-housing" urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify V63 realism contract and type-check
        run: |
          node --test --test-concurrency=1 urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          node --check scripts/capture-home-state-proof.mjs
          node --check scripts/capture-natural-home-orb-proof.mjs
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs
          pnpm --dir urai-tier1 exec tsc --noEmit

      - name: Commit exact V63 candidate only if branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/home-final-v24-certify-20260826 | cut -f1)"
          test "$current" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx \
            scripts/capture-natural-home-orb-proof.mjs \
            scripts/run-continuous-spatial-proof-v22-natural.mjs \
            urai-tier1/tests/home-relic-machine-realism-contract.test.mjs
          git commit -m "Home: materialize V63 authored Orb sanctuary"
          git push origin HEAD:home-final-v24-certify-20260826
