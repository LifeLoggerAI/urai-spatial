name: Private Life Model source authority
on:
  pull_request:
    paths:
      - 'apps/functions/src/privateLifeModelReview.ts'
      - 'tests/private-life-model-owner-authority.test.mjs'
      - 'tests/fixtures/private-life-model-producer-5da7829.ts'
      - '.github/workflows/private-life-model-source-authority.yml'
permissions:
  contents: read
jobs:
  producer-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test tests/private-life-model-owner-authority.test.mjs

