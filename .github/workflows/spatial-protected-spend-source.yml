name: Spatial Protected Spend Source

on:
  pull_request:
    paths:
      - 'apps/functions/src/protectedProviderSpend.ts'
      - 'apps/functions/src/providerFunctions.ts'
      - 'apps/functions/src/adamPresenceFunctions.ts'
      - 'apps/functions/src/personPresenceProvider.ts'
      - 'apps/functions/src/personPresenceVoiceProvider.ts'
      - 'apps/functions/src/councilProviderFunctions.ts'
      - 'apps/functions/test/protectedProviderSpend.test.mjs'
      - 'urai-tier1/tests/localization-content-routing.test.mjs'
      - 'urai-tier1/tests/presence-content-language.test.mjs'
      - 'docs/protected-spatial-provider-spend.md'
      - '.github/workflows/spatial-protected-spend-source.yml'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact immutable Git SHA for source-only proof
        required: true
        type: string

permissions:
  contents: read

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha || github.sha }}

jobs:
  synthetic-paid-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean source
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen source dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile actual Functions imports
        run: |
          set -euo pipefail
          mkdir -p artifacts/spatial-protected-spend
          pnpm --dir apps/functions run build 2>&1 | tee artifacts/spatial-protected-spend/functions-build.log
      - name: Exercise actual paid leaves with synthetic in-process services
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ELEVENLABS_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${SPATIAL_SPEND_WORKER_TOKENS_JSON:-}"
          pnpm --dir apps/functions exec node --test test/protectedProviderSpend.test.mjs 2>&1 | tee artifacts/spatial-protected-spend/boundary-tests.log
      - name: Retain actual Orb Adam and person locale boundaries
        run: |
          set -euo pipefail
          pnpm --dir urai-tier1 exec node --import tsx --test \
            tests/localization-content-routing.test.mjs \
            tests/presence-content-language.test.mjs \
            2>&1 | tee artifacts/spatial-protected-spend/locale-tests.log
      - name: Retain source proof with acceptance false
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          head=os.environ['URAI_EXACT_HEAD']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
          paths=[
            'apps/functions/src/protectedProviderSpend.ts',
            'apps/functions/src/providerFunctions.ts',
            'apps/functions/src/adamPresenceFunctions.ts',
            'apps/functions/src/personPresenceProvider.ts',
            'apps/functions/src/personPresenceVoiceProvider.ts',
            'apps/functions/src/councilProviderFunctions.ts',
            'apps/functions/test/protectedProviderSpend.test.mjs',
            'urai-tier1/tests/localization-content-routing.test.mjs',
            'urai-tier1/tests/presence-content-language.test.mjs',
            'docs/protected-spatial-provider-spend.md',
            '.github/workflows/spatial-protected-spend-source.yml',
          ]
          result={'source_sha':head,'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'source_sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},
            'synthetic_source_tests_and_compilation_passed':True,'provider_calls_performed':False,
            'spend_usd':0,'authentic_approval_granted':False,'protected_runtime_accepted':False,
            'voice_rights_accepted':False,'native_language_review_granted':False,'release_certified':False}
          pathlib.Path('artifacts/spatial-protected-spend/receipt.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Prove tracked source was not changed
        run: git diff --exit-code HEAD
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spatial-protected-spend-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/spatial-protected-spend
          if-no-files-found: error
          retention-days: 365
