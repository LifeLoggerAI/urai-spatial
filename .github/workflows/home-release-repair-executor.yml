name: Home Release Repair Executor

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-release-repair-executor.yml'

permissions:
  contents: write
  pull-requests: write

env:
  EXPECTED_PARENT: 72d0a3169ac8e246cd097264884cf16e0d0ce74a
  EXPECTED_BRANCH: fix/home-provider-preview-composition-20260804

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/home-provider-preview-composition-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout bounded repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: true
          show-progress: false

      - name: Prove executor-only trigger commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git branch --show-current)" = "$EXPECTED_BRANCH" || true
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/home-release-repair-executor.yml"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply canonical Home and bounded-proof repair
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile, mkdir } from 'node:fs/promises'

          const replaceOnce = (source, before, after, label) => {
            const count = source.split(before).length - 1
            if (count !== 1) throw new Error(`${label}: expected one match, found ${count}`)
            return source.replace(before, after)
          }

          const runtimePath = 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'
          let runtime = await readFile(runtimePath, 'utf8')
          runtime = replaceOnce(runtime, `function HomeMovementPrompt() {\n  return (\n    <button type="button" className="home-movement-prompt" tabIndex={-1} aria-label="Move through Home">\n      Move through Home\n    </button>\n  )\n}\n\n`, '', 'remove permanent Home movement prompt component')
          const promptCall = '      <HomeMovementPrompt />\n'
          const promptCount = runtime.split(promptCall).length - 1
          if (promptCount !== 2) throw new Error(`remove Home movement prompt calls: expected 2, found ${promptCount}`)
          runtime = runtime.split(promptCall).join('')
          await writeFile(runtimePath, runtime)

          const worldPath = 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
          let world = await readFile(worldPath, 'utf8')
          world = replaceOnce(world,
            `const SPAWN = new THREE.Vector3(0, 0, 7.2)`,
            `const SPAWN = new THREE.Vector3(0, 0, 8.0)`,
            'move canonical desktop spawn back')
          world = replaceOnce(world,
            `    camera.position.set(position.current.x, 1.68, position.current.z)`,
            `    camera.position.set(position.current.x, 1.82, position.current.z)`,
            'raise canonical camera')
          world = replaceOnce(world,
            `  useEffect(() => {\n    setReviewMode(new URLSearchParams(window.location.search).get('homeAssetReview') === '1')\n  }, [])\n`,
            `  useEffect(() => {\n    setReviewMode(new URLSearchParams(window.location.search).get('homeAssetReview') === '1')\n  }, [])\n  const [mobileControlsVisible, setMobileControlsVisible] = useState(false)\n  useEffect(() => {\n    const coarsePointer = window.matchMedia('(pointer: coarse)')\n    const narrowViewport = window.matchMedia('(max-width: 900px)')\n    const synchronize = () => setMobileControlsVisible(coarsePointer.matches || narrowViewport.matches)\n    synchronize()\n    coarsePointer.addEventListener('change', synchronize)\n    narrowViewport.addEventListener('change', synchronize)\n    return () => {\n      coarsePointer.removeEventListener('change', synchronize)\n      narrowViewport.removeEventListener('change', synchronize)\n    }\n  }, [])\n`,
            'gate mobile controls by actual device capability')
          world = replaceOnce(world,
            `      <Canvas shadows dpr={[1, 1.5]} camera={{ position: [0, 1.68, 7.2], fov: 52, near: 0.08, far: 140 }} gl={{ antialias: true, alpha: false, powerPreference: 'high-performance' }}>`,
            `      <Canvas shadows dpr={[1, 1.5]} camera={{ position: [0, 1.82, 8.0], fov: 48, near: 0.08, far: 140 }} gl={{ antialias: true, alpha: false, powerPreference: 'high-performance' }}>`,
            'correct canonical Home camera')
          world = replaceOnce(world,
            `      <MobileMovementPad input={input} label="Home movement controls" />`,
            `      {mobileControlsVisible ? <MobileMovementPad input={input} label="Home movement controls" /> : null}`,
            'prevent desktop mobile-control DOM leakage')
          world = replaceOnce(world,
            `    <AnimatedAsset path={path} name="home-authored-orb" clips={[ORB_CLIP[state]]} reducedMotion={reducedMotion} scale={[1.22 * stateScale, 1.22 * stateScale, 1.22 * stateScale]} />`,
            `    <AnimatedAsset path={path} name="home-authored-orb" clips={[ORB_CLIP[state]]} reducedMotion={reducedMotion} scale={[1.38 * stateScale, 1.38 * stateScale, 1.38 * stateScale]} />`,
            'strengthen Orb focal hierarchy')
          world = replaceOnce(world,
            `    <pointLight position={[0, 5, 4]} intensity={1.0} color="#b8eadb" distance={18} decay={2} />`,
            `    <pointLight position={[0, 5, 4]} intensity={1.42} color="#b8eadb" distance={20} decay={2} />`,
            'restore foreground and midground separation')
          await writeFile(worldPath, world)

          const sanctuaryPath = 'urai-tier1/src/app/HomeSanctuaryWorld.tsx'
          let sanctuary = await readFile(sanctuaryPath, 'utf8')
          sanctuary = replaceOnce(sanctuary,
            `{[-7.9, -5.2, -2.5, .2, 2.9, 5.6].map((z, index) => (\n        <SanctuaryRib key={z} z={z} intensity={index === 2 || index === 3 ? .34 : .2} />\n      ))}`,
            `{[-6.8, -2.8, 1.2, 5.2].map((z, index) => (\n        <SanctuaryRib key={z} z={z} intensity={index === 1 || index === 2 ? .22 : .14} />\n      ))}`,
            'reduce ceiling-rib dominance')
          sanctuary = replaceOnce(sanctuary,
            `<meshStandardMaterial color="#030a12" roughness={.78} metalness={.18} />`,
            `<meshStandardMaterial color="#06131d" roughness={.76} metalness={.16} />`,
            'lift foreground floor visibility')
          sanctuary = replaceOnce(sanctuary,
            `<meshPhysicalMaterial color="#082938" roughness={.2} metalness={.42} clearcoat={.92} clearcoatRoughness={.24} />`,
            `<meshPhysicalMaterial color="#0b3442" roughness={.24} metalness={.36} clearcoat={.84} clearcoatRoughness={.28} />`,
            'lift central path visibility')
          sanctuary = replaceOnce(sanctuary,
            `<pointLight position={[0, 2.3, -8.9]} color="#78d8df" intensity={2.1} distance={9} decay={2} />`,
            `<pointLight position={[0, 2.3, -8.9]} color="#78d8df" intensity={2.65} distance={11} decay={2} />`,
            'strengthen background focal anchor')
          await writeFile(sanctuaryPath, sanctuary)

          const cssPath = 'urai-tier1/src/app/home-provider-preview-composition.css'
          await writeFile(cssPath, `/* Canonical Home release composition. Product geometry and camera are repaired in source; this layer only enforces presentation boundaries. */\n.urai-home-spatial-runtime-layer[data-webgl-ready="true"] > .home-movement-prompt {\n  display: none !important;\n}\n\n.urai-home-spatial-runtime-layer[data-webgl-ready="true"]\n  .urai-asset-home-world[data-home-primary-owner="asset-driven"]::after {\n  content: "";\n  position: absolute;\n  inset: 0;\n  z-index: 18;\n  pointer-events: none;\n  background:\n    radial-gradient(circle at 50% 58%, rgba(119, 222, 211, 0.08), transparent 34%),\n    linear-gradient(180deg, rgba(1, 8, 18, 0.02), transparent 34%, rgba(1, 8, 18, 0.12));\n}\n\n@media (min-width: 901px) and (pointer: fine) {\n  .urai-home-spatial-runtime-layer[data-webgl-ready="true"] .urai-mobile-movement {\n    display: none !important;\n  }\n\n  .urai-home-spatial-runtime-layer[data-webgl-ready="true"] .home-discreet-controls {\n    opacity: 0.14 !important;\n  }\n\n  .urai-home-spatial-runtime-layer[data-webgl-ready="true"] .home-discreet-controls:hover,\n  .urai-home-spatial-runtime-layer[data-webgl-ready="true"] .home-discreet-controls:focus-within {\n    opacity: 0.84 !important;\n  }\n}\n\n.urai-home-spatial-runtime-layer[data-webgl-ready="true"] .home-audio:disabled {\n  display: none !important;\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .urai-home-spatial-runtime-layer[data-webgl-ready="true"]\n    .urai-asset-home-world[data-home-primary-owner="asset-driven"]::after {\n    transition: none !important;\n  }\n}\n`)

          const contractPath = 'urai-tier1/tests/home-canonical-release-composition-contract.test.mjs'
          await writeFile(contractPath, `import assert from 'node:assert/strict'\nimport fs from 'node:fs'\nimport test from 'node:test'\n\nconst appFile = (path) => fs.readFileSync(new URL('../src/app/' + path, import.meta.url), 'utf8')\n\ntest('Home runtime no longer mounts a permanent movement proof prompt', () => {\n  const source = appFile('HomeSpatialRuntimeLayer.tsx')\n  assert.doesNotMatch(source, /function HomeMovementPrompt/)\n  assert.doesNotMatch(source, /<HomeMovementPrompt \\/>/)\n})\n\ntest('fine-pointer desktop never mounts mobile movement controls', () => {\n  const source = appFile('AssetDrivenHomeWorld.tsx')\n  assert.match(source, /mobileControlsVisible/)\n  assert.match(source, /coarsePointer\.matches \\|\\| narrowViewport\.matches/)\n  assert.match(source, /mobileControlsVisible \\? <MobileMovementPad/)\n})\n\ntest('canonical camera is raised, moved back and narrowed without CSS canvas scaling', () => {\n  const world = appFile('AssetDrivenHomeWorld.tsx')\n  const css = appFile('home-provider-preview-composition.css')\n  assert.match(world, /SPAWN = new THREE\.Vector3\\(0, 0, 8\.0\\)/)\n  assert.match(world, /camera\.position\.set\\(position\.current\.x, 1\.82, position\.current\.z\\)/)\n  assert.match(world, /camera=\\{\\{ position: \\[0, 1\.82, 8\.0\\], fov: 48/)\n  assert.doesNotMatch(css, /transform: scale/)\n  assert.doesNotMatch(css, /width: 112%/)\n})\n\ntest('sanctuary source reduces ribs and restores three-plane depth', () => {\n  const source = appFile('HomeSanctuaryWorld.tsx')\n  assert.match(source, /\\[-6\.8, -2\.8, 1\.2, 5\.2\\]/)\n  assert.match(source, /color="#06131d"/)\n  assert.match(source, /color="#0b3442"/)\n  assert.match(source, /intensity=\\{2\.65\\}/)\n})\n\ntest('Orb remains the explicit authored focal anchor', () => {\n  const source = appFile('AssetDrivenHomeWorld.tsx')\n  assert.match(source, /scale=\\{\\[1\.38 \\* stateScale/)\n  assert.match(source, /home-authored-orb/)\n})\n`)

          const caseScript = `import { mkdir, writeFile } from 'node:fs/promises'\nimport { createRequire } from 'node:module'\nimport path from 'node:path'\n\nconst requireFromTierOne = createRequire(new URL('../urai-tier1/package.json', import.meta.url))\nconst { chromium } = requireFromTierOne('playwright')\nconst caseId = process.env.URAI_HOME_CASE\nconst exactHead = process.env.URAI_EXACT_HEAD\nconst base = process.env.URAI_PROOF_BASE || 'http://127.0.0.1:4173'\nconst outputDir = path.resolve(process.env.URAI_PROOF_DIR || 'artifacts/bounded-home-proof/' + caseId)\nif (!caseId || !exactHead) throw new Error('URAI_HOME_CASE and URAI_EXACT_HEAD are required')\n\nconst cases = {\n  'desktop-1366x768': { viewport: { width: 1366, height: 768 }, query: 'homeAssetReview=1&homePrivateFixture=1' },\n  'desktop-1440x1000': { viewport: { width: 1440, height: 1000 }, query: 'homeAssetReview=1&homePrivateFixture=1' },\n  'desktop-1440x1100': { viewport: { width: 1440, height: 1100 }, query: 'homeAssetReview=1&homePrivateFixture=1' },\n  'portrait-mobile': { viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, query: 'homeAssetReview=1&homePrivateFixture=1' },\n  'landscape-mobile': { viewport: { width: 844, height: 390 }, isMobile: true, hasTouch: true, query: 'homeAssetReview=1&homePrivateFixture=1' },\n  'reduced-motion': { viewport: { width: 1366, height: 768 }, reducedMotion: 'reduce', query: 'homeAssetReview=1&homePrivateFixture=1' },\n  'loading': { viewport: { width: 1366, height: 768 }, query: 'homeAssetReview=1&homePrivateFixture=1&homeLoadingHold=1', loading: true },\n  'permission-limited': { viewport: { width: 1366, height: 768 }, query: 'homeAssetReview=1&homeState=permission-limited' },\n  'empty-world-forming': { viewport: { width: 1366, height: 768 }, query: 'homeAssetReview=1&homeState=world-forming' },\n  'offline': { viewport: { width: 1366, height: 768 }, query: 'homeAssetReview=1&homePrivateFixture=1', offlineAfterReady: true },\n  'failed-resource': { viewport: { width: 1366, height: 768 }, query: 'homeAssetReview=1&homeAssetFailure=1' },\n  'no-webgl': { viewport: { width: 1366, height: 768 }, query: 'homeAssetReview=1', noWebgl: true },\n}\nconst spec = cases[caseId]\nif (!spec) throw new Error('Unknown bounded Home case: ' + caseId)\nawait mkdir(outputDir, { recursive: true })\nconst progressPath = path.join(outputDir, 'progress.jsonl')\nconst progress = async (phase, detail = {}) => writeFile(progressPath, JSON.stringify({ at: new Date().toISOString(), caseId, phase, ...detail }) + '\\n', { flag: 'a' })\nconst diagnostics = { consoleErrors: [], pageErrors: [], failedRequests: [] }\nlet browser\nlet context\nlet page\nlet receipt = { schemaVersion: 'urai-bounded-home-proof-1', exactHead, caseId, spec, startedAt: new Date().toISOString(), passed: false, diagnostics }\nconst withTimeout = (promise, ms, label) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' exceeded ' + ms + 'ms')), ms))])\ntry {\n  await progress('browser-launch-start')\n  browser = await withTimeout(chromium.launch({ headless: true }), 20000, 'browser launch')\n  context = await withTimeout(browser.newContext({ viewport: spec.viewport, isMobile: Boolean(spec.isMobile), hasTouch: Boolean(spec.hasTouch), reducedMotion: spec.reducedMotion, recordVideo: { dir: outputDir, size: spec.viewport } }), 20000, 'context creation')\n  page = await context.newPage()\n  page.on('console', (message) => { if (message.type() === 'error') diagnostics.consoleErrors.push(message.text()) })\n  page.on('pageerror', (error) => diagnostics.pageErrors.push(String(error)))\n  page.on('requestfailed', (request) => diagnostics.failedRequests.push({ url: request.url(), failure: request.failure()?.errorText || 'unknown' }))\n  if (spec.noWebgl) await page.addInitScript(() => { Object.defineProperty(HTMLCanvasElement.prototype, 'getContext', { configurable: true, value: () => null }) })\n  if (spec.loading) await page.route('**/*.glb', async (route) => { await new Promise((resolve) => setTimeout(resolve, 1800)); await route.continue() })\n  await progress('navigation-start')\n  await withTimeout(page.goto(base + '/home/?' + spec.query, { waitUntil: 'domcontentloaded', timeout: 30000 }), 35000, 'navigation')\n  if (spec.loading) {\n    await withTimeout(page.getByText('Your private world is forming', { exact: true }).first().waitFor({ state: 'visible', timeout: 15000 }), 18000, 'loading state')\n  } else if (spec.noWebgl || spec.query.includes('homeAssetFailure=1')) {\n    await withTimeout(page.getByRole('region', { name: 'Spatial Home fallback' }).waitFor({ state: 'visible', timeout: 30000 }), 33000, 'fallback state')\n  } else {\n    await withTimeout(page.locator('.urai-asset-home-world[data-home-primary-owner="asset-driven"]').waitFor({ state: 'visible', timeout: 30000 }), 33000, 'asset Home owner')\n    await withTimeout(page.waitForFunction(() => document.querySelector('.urai-asset-home-world[data-home-primary-owner="asset-driven"]')?.getAttribute('data-home-assets-ready') === 'true', null, { timeout: 30000 }), 33000, 'asset readiness')\n  }\n  if (spec.offlineAfterReady) { await context.setOffline(true); await page.evaluate(() => window.dispatchEvent(new Event('offline'))); await page.waitForTimeout(700) }\n  await progress('capture-start')\n  const screenshot = path.join(outputDir, caseId + '-' + exactHead.slice(0, 12) + '.png')\n  await withTimeout(page.screenshot({ path: screenshot, fullPage: false }), 15000, 'screenshot')\n  const state = await page.evaluate(() => {\n    const owner = document.querySelector('.urai-asset-home-world[data-home-primary-owner="asset-driven"]')\n    const visible = (selector) => [...document.querySelectorAll(selector)].filter((node) => { const style = getComputedStyle(node); const rect = node.getBoundingClientRect(); return style.display !== 'none' && style.visibility !== 'hidden' && Number(style.opacity || 1) > .02 && rect.width > 4 && rect.height > 4 }).length\n    return {\n      title: document.title,\n      ownerCount: document.querySelectorAll('.urai-asset-home-world[data-home-primary-owner="asset-driven"]').length,\n      fallbackCount: visible('.urai-home-asset-fallback, .urai-final-home-world'),\n      mobileControlsVisible: visible('.urai-mobile-movement'),\n      movementPromptVisible: visible('.home-movement-prompt'),\n      canvasCount: document.querySelectorAll('canvas').length,\n      assetMode: owner?.getAttribute('data-home-asset-mode') || null,\n      assetsReady: owner?.getAttribute('data-home-assets-ready') || null,\n      personalizationMode: owner?.getAttribute('data-home-personalization-mode') || null,\n    }\n  })\n  receipt = { ...receipt, completedAt: new Date().toISOString(), screenshot: path.basename(screenshot), state, passed: diagnostics.consoleErrors.length === 0 && diagnostics.pageErrors.length === 0 && (caseId.startsWith('desktop-') ? state.mobileControlsVisible === 0 && state.movementPromptVisible === 0 : true) }\n  await writeFile(path.join(outputDir, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\\n')\n  await progress('capture-complete', { passed: receipt.passed })\n  if (!receipt.passed) process.exitCode = 1\n} catch (error) {\n  receipt = { ...receipt, completedAt: new Date().toISOString(), fatal: String(error), stack: error?.stack || null, passed: false }\n  await writeFile(path.join(outputDir, 'receipt.json'), JSON.stringify(receipt, null, 2) + '\\n')\n  await progress('case-failed', { fatal: String(error) })\n  process.exitCode = 1\n} finally {\n  await progress('cleanup-start').catch(() => {})\n  if (context) await withTimeout(context.close(), 10000, 'context close').catch(() => {})\n  if (browser) await withTimeout(browser.close(), 10000, 'browser close').catch(() => {})\n  await progress('cleanup-complete').catch(() => {})\n}\n`
          await writeFile('scripts/run-bounded-home-proof-case.mjs', caseScript)

          const workflow = `name: Bounded Home Visual Proof\n\non:\n  pull_request:\n    branches: [main]\n    paths:\n      - '.github/workflows/bounded-home-visual-proof.yml'\n      - 'scripts/run-bounded-home-proof-case.mjs'\n      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'\n      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'\n      - 'urai-tier1/src/app/HomeSanctuaryWorld.tsx'\n      - 'urai-tier1/src/app/home-provider-preview-composition.css'\n      - 'urai-tier1/tests/home-canonical-release-composition-contract.test.mjs'\n  workflow_dispatch:\n    inputs:\n      verification_sha:\n        description: Exact 40-character commit SHA to verify\n        required: true\n        type: string\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: bounded-home-proof-\\${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}\n  cancel-in-progress: true\n\nenv:\n  URAI_EXACT_HEAD: \\${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.verification_sha }}\n  PLAYWRIGHT_BROWSERS_PATH: '0'\n  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'\n\njobs:\n  prepare:\n    runs-on: ubuntu-24.04\n    timeout-minutes: 30\n    steps:\n      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2\n        with:\n          ref: \\${{ env.URAI_EXACT_HEAD }}\n          fetch-depth: 1\n          persist-credentials: false\n          show-progress: false\n      - name: Prove exact clean candidate\n        run: |\n          set -euo pipefail\n          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]\n          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"\n          test -z "$(git status --porcelain --untracked-files=all)"\n      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0\n        with: { version: 10.0.0, run_install: false }\n      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0\n        with:\n          node-version: 22\n          cache: pnpm\n          cache-dependency-path: pnpm-lock.yaml\n      - run: corepack enable && pnpm install --frozen-lockfile\n      - run: node --test urai-tier1/tests/home-canonical-release-composition-contract.test.mjs\n      - run: pnpm build:static\n      - name: Upload exact static candidate\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2\n        with:\n          name: bounded-home-static-\\${{ env.URAI_EXACT_HEAD }}\n          path: urai-tier1/out\n          if-no-files-found: error\n          retention-days: 30\n\n  case:\n    needs: prepare\n    strategy:\n      fail-fast: false\n      matrix:\n        case_id:\n          - desktop-1366x768\n          - desktop-1440x1000\n          - desktop-1440x1100\n          - portrait-mobile\n          - landscape-mobile\n          - reduced-motion\n          - loading\n          - permission-limited\n          - empty-world-forming\n          - offline\n          - failed-resource\n          - no-webgl\n    runs-on: ubuntu-24.04\n    timeout-minutes: 18\n    steps:\n      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2\n        with:\n          ref: \\${{ env.URAI_EXACT_HEAD }}\n          fetch-depth: 1\n          persist-credentials: false\n          show-progress: false\n      - name: Prove exact clean candidate\n        run: |\n          set -euo pipefail\n          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"\n          test -z "$(git status --porcelain --untracked-files=all)"\n      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0\n        with: { version: 10.0.0, run_install: false }\n      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0\n        with:\n          node-version: 22\n          cache: pnpm\n          cache-dependency-path: pnpm-lock.yaml\n      - run: corepack enable && pnpm install --frozen-lockfile\n      - run: pnpm --dir urai-tier1 exec playwright install --with-deps chromium\n      - name: Download exact static candidate\n        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0\n        with:\n          name: bounded-home-static-\\${{ env.URAI_EXACT_HEAD }}\n          path: urai-tier1/out\n      - name: Start isolated preview\n        run: |\n          set -euo pipefail\n          mkdir -p artifacts/bounded-home-proof/\\${{ matrix.case_id }}\n          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > artifacts/bounded-home-proof/\\${{ matrix.case_id }}/http-server.log 2>&1 &\n          echo $! > artifacts/bounded-home-proof/\\${{ matrix.case_id }}/server.pid\n          for attempt in $(seq 1 45); do curl -fsS http://127.0.0.1:4173/home/ >/dev/null && exit 0; sleep 1; done\n          exit 1\n      - name: Capture bounded Home case\n        timeout-minutes: 10\n        env:\n          URAI_HOME_CASE: \\${{ matrix.case_id }}\n          URAI_PROOF_BASE: http://127.0.0.1:4173\n          URAI_PROOF_DIR: artifacts/bounded-home-proof/\\${{ matrix.case_id }}\n        run: node scripts/run-bounded-home-proof-case.mjs\n      - name: Terminate isolated preview\n        if: always()\n        run: |\n          pid_file=artifacts/bounded-home-proof/\\${{ matrix.case_id }}/server.pid\n          test -f "$pid_file" && kill "$(cat "$pid_file")" 2>/dev/null || true\n          pkill -f 'http.server 4173' 2>/dev/null || true\n      - name: Upload partial case evidence\n        if: always()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2\n        with:\n          name: bounded-home-\\${{ matrix.case_id }}-\\${{ env.URAI_EXACT_HEAD }}\n          path: artifacts/bounded-home-proof/\\${{ matrix.case_id }}\n          if-no-files-found: error\n          retention-days: 365\n          compression-level: 9\n`
          await mkdir('.github/workflows', { recursive: true })
          await writeFile('.github/workflows/bounded-home-visual-proof.yml', workflow)
          NODE

      - name: Remove one-time executor and verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
