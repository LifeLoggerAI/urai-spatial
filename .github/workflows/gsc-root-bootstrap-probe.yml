name: URAI GSC Root Bootstrap Probe

on:
  push:
    branches:
      - gsc-root-bootstrap-probe-20260920
    paths:
      - '.github/workflows/gsc-root-bootstrap-probe.yml'

permissions:
  contents: read

concurrency:
  group: urai-gsc-root-bootstrap-probe
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record WIF boundary truth
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gsc-bootstrap-proof
          cat > gsc-bootstrap-proof/receipt.json <<'JSON'
          {
            "schema": "urai-gsc-root-bootstrap-classification-1",
            "rootProperty": "sc-domain:urai.app",
            "gscWizardConnectedIdentity": "adam@urailabs.com",
            "gscWizardProperties": 0,
            "providerConditionRef": "refs/heads/main",
            "providerConditionEvent": "workflow_dispatch",
            "probeBranchCanAuthenticate": false,
            "providerMutationPerformed": false,
            "dnsMutationPerformed": false,
            "searchConsoleMutationPerformed": false,
            "classification": "EXTERNAL_AUTHENTICATED_ROOT_PROPERTY_CREATION_REQUIRED",
            "note": "URAI production WIF is intentionally bound to main + workflow_dispatch. Side-branch OIDC cannot be used to bootstrap the root Search Console property."
          }
          JSON

      - name: Upload classification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-gsc-root-bootstrap-classification-${{ github.sha }}
          path: gsc-bootstrap-proof/receipt.json
          if-no-files-found: error
          retention-days: 30
