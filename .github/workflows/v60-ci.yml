name: v60 Distributed Runtime CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, v60-kernel-next ]

jobs:
  v60-determinism-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install runtime test dependencies
        run: npm install --no-save typescript ts-node @types/node

      - name: Verify v60 distributed source files exist
        run: |
          test -f src/distributed/sharedEventLog.ts
          test -f src/distributed/kernelSync.ts
          test -f src/distributed/eventOrdering.ts
          test -f src/distributed/stateConvergence.ts
          test -f src/distributed/conflictResolution.ts
          test -f src/distributed/runtimeTest.ts
          test -f src/distributed/runDistributedDemo.ts

      - name: Run enforced v60 deterministic convergence test
        run: npx ts-node --compiler-options '{"module":"commonjs"}' src/distributed/runDistributedDemo.ts
