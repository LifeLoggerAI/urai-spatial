name: v60 CI

on:
  push:
    branches: [ main, v60-kernel-next ]
  pull_request:
    branches: [ main ]

jobs:
  v60-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Run v60 static lock
        run: pnpm lock:static

      - name: Run v60 build lock
        run: pnpm lock:build

      - name: Run distributed demo
        run: pnpm demo
