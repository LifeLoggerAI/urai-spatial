name: v60 CI

on:
  push:
    branches: [ main, v60-kernel-next ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: v60-ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  v60-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Run v60 static lock
        run: pnpm lock:static

      - name: Run v60 build lock
        run: pnpm lock:build

      - name: Run distributed demo
        run: pnpm demo
