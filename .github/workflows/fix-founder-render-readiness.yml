name: Fix Founder Render Readiness

on:
  push:
    branches:
      - agent/replace-failed-home-lifemap-visuals
    paths:
      - .github/workflows/fix-founder-render-readiness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/replace-failed-home-lifemap-visuals
          fetch-depth: 1
      - name: Patch production readiness bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx')
          text = p.read_text()
          old = '''function RenderProofBridge({ phase, onProof }: { phase: JourneyPhase; onProof: (proof: RenderProof) => void }) {
            const { gl, scene } = useThree();
            const frames = useRef(0);
            const publishedPhase = useRef<JourneyPhase | null>(null);
            useFrame(() => {
              frames.current += 1;
              if (frames.current < 4 || publishedPhase.current === phase) return;
              let objects = 0;
              let anchors = 0;
              scene.traverse((object) => {
                if (object.visible) objects += 1;
                if (object.visible && object.name.startsWith("life-map-")) anchors += 1;
              });
              publishedPhase.current = phase;
              onProof({
                ready: gl.info.render.calls > 0 && objects > 20 && anchors >= 8,
                objects,
                anchors,
                calls: gl.info.render.calls,
                triangles: gl.info.render.triangles,
              });
            });
            return null;
          }
          '''
          new = '''function RenderProofBridge({ phase, onProof }: { phase: JourneyPhase; onProof: (proof: RenderProof) => void }) {
            const { gl, scene } = useThree();
            const frames = useRef(0);
            const publishedPhase = useRef<JourneyPhase | null>(null);
            const publishedSignature = useRef("");
            useEffect(() => {
              frames.current = 0;
              publishedPhase.current = null;
              publishedSignature.current = "";
            }, [phase]);
            useFrame(() => {
              frames.current += 1;
              if (frames.current < 4) return;
              let objects = 0;
              let anchors = 0;
              scene.traverse((object) => {
                if (object.visible) objects += 1;
                if (object.visible && object.name.startsWith("life-map-")) anchors += 1;
              });
              const calls = gl.info.render.calls;
              const triangles = gl.info.render.triangles;
              const ready = calls > 0 && objects > 20 && anchors >= 8;
              const signature = `${phase}:${ready}:${objects}:${anchors}:${calls}:${triangles}`;
              if (publishedPhase.current === phase && publishedSignature.current === signature) return;
              publishedPhase.current = phase;
              publishedSignature.current = signature;
              onProof({ ready, objects, anchors, calls, triangles });
            });
            return null;
          }
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one RenderProofBridge block, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          git diff --check
          git diff -- urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx
      - name: Commit production repair
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx
          git commit -m "Republish Life Map readiness after authored assets settle"
          git push origin HEAD:agent/replace-failed-home-lifemap-visuals
