name: URAI Production Verify

on:
  workflow_dispatch:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          pnpm --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify
        shell: bash
        run: |
          set -o pipefail
          node scripts/urai-production-verify.mjs 2>&1 | tee production-verify.log
      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-production-verify-${{ github.run_id }}
          path: production-verify.log
          if-no-files-found: warn
