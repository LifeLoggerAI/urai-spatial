name: Patch Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  patch-check:
    name: pnpm patch:check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Capture production route output
        run: |
          set +e
          node scripts/check-production-route-exposure.mjs > route-check.log 2>&1
          status=$?
          cat route-check.log
          echo "$status" > route-check-status.txt
          exit 0

      - name: Upload production route output
        uses: actions/upload-artifact@v4
        with:
          name: production-route-output
          path: |
            route-check.log
            route-check-status.txt
          if-no-files-found: error

      - name: Verify production routes
        run: test "$(cat route-check-status.txt)" = "0"
