name: Patch Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  patch-check:
    name: pnpm patch:check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Verify production routes
        run: node scripts/check-production-route-exposure.mjs
