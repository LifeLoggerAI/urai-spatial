name: Patch Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  patch-check:
    name: pnpm patch:check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run patch checks
        run: pnpm patch:check
