name: Patch Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  patch-check:
    name: pnpm patch:check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Verify production routes
        run: node scripts/check-production-route-exposure.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify privacy defaults
        run: node scripts/run-pnpm.mjs firebase:rules:check

      - name: Run unit tests if available
        run: node scripts/run-pnpm.mjs test:unit
        continue-on-error: true

      - name: Run smoke test
        run: node scripts/run-pnpm.mjs smoke
        continue-on-error: true

      - name: Run build
        run: node scripts/run-pnpm.mjs build
