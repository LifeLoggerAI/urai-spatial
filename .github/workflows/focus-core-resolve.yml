name: Resolve Focus Onto Core

on:
  pull_request:
    branches:
      - release/core-convergence-20260729

permissions:
  contents: write

jobs:
  resolve:
    if: github.head_ref == 'agent/focus-onto-core-resolve-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/focus-onto-core-resolve-20260729
      - name: Merge accepted Focus and resolve exact conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "urai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          merge_status=0
          git merge --no-ff --no-commit 6e7a7f59ea8537ad516c4dbdfd832718ebf0f507 || merge_status=$?
          test "$merge_status" -ne 0
          python3 - <<'PY'
          from pathlib import Path

          choices = {
              'scripts/capture-lifemap-founder-proof.mjs': 'ours',
              'scripts/run-continuous-spatial-proof-fixed.mjs': 'both',
              'urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx': 'theirs',
              'urai-tier1/src/components/lifemap/LifeMapSemanticNavigator.tsx': 'theirs',
          }

          def resolve(text: str, choice: str) -> str:
              out = []
              lines = text.splitlines(keepends=True)
              i = 0
              while i < len(lines):
                  if not lines[i].startswith('<<<<<<< '):
                      out.append(lines[i]); i += 1; continue
                  i += 1
                  ours = []
                  while i < len(lines) and not lines[i].startswith('======='):
                      ours.append(lines[i]); i += 1
                  if i >= len(lines): raise RuntimeError('missing separator')
                  i += 1
                  theirs = []
                  while i < len(lines) and not lines[i].startswith('>>>>>>> '):
                      theirs.append(lines[i]); i += 1
                  if i >= len(lines): raise RuntimeError('missing end marker')
                  i += 1
                  if choice == 'ours': out.extend(ours)
                  elif choice == 'theirs': out.extend(theirs)
                  elif choice == 'both': out.extend(ours + theirs)
                  else: raise RuntimeError(choice)
              return ''.join(out)

          for name, choice in choices.items():
              path = Path(name)
              path.write_text(resolve(path.read_text(), choice))
          PY
          git add scripts/capture-lifemap-founder-proof.mjs scripts/run-continuous-spatial-proof-fixed.mjs urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx urai-tier1/src/components/lifemap/LifeMapSemanticNavigator.tsx
          remaining="$(git diff --name-only --diff-filter=U)"
          test -z "$remaining"
          grep -RIl '^<<<<<<<\|^=======\|^>>>>>>>' scripts/capture-lifemap-founder-proof.mjs scripts/run-continuous-spatial-proof-fixed.mjs urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx urai-tier1/src/components/lifemap/LifeMapSemanticNavigator.tsx && exit 1 || true
          git add -A
          rm -f .github/workflows/focus-core-conflict-pack.yml .github/workflows/focus-core-resolve.yml
          git add -A
          git commit -m "merge: converge accepted Focus onto Life Map"
          git push origin HEAD:agent/focus-onto-core-resolve-20260729
