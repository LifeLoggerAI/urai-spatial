name: Launch Critical Asset Forge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'operations/assets/**'
      - 'scripts/forge-launch-critical-assets.mjs'
      - 'scripts/normalize-launch-critical-assets.mjs'
      - 'scripts/verify-launch-critical-assets.mjs'
      - 'scripts/audit-launch-critical-artifact.mjs'
      - 'scripts/validate-radiance-hdr.mjs'
      - 'scripts/compare-legacy-asset-candidates.mjs'
      - 'scripts/author-home-finalization-assets.mjs'
      - 'scripts/record-home-finalization-authored-candidates.mjs'
      - 'scripts/verify-home-finalization-authored-assets.mjs'
      - '.github/workflows/launch-critical-asset-forge.yml'

permissions:
  contents: read

concurrency:
  group: launch-critical-asset-forge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LEGACY_ASSET_HEAD: e4e94a501a64e7375a5cfdbe9547436fbc8e75a2

jobs:
  forge-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Validate committed authored source tools
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/author-home-finalization-assets.mjs
          node --check scripts/record-home-finalization-authored-candidates.mjs
          node --check scripts/verify-home-finalization-authored-assets.mjs
          grep -q "urai-home-authored-sanctuary-source-v3" scripts/author-home-finalization-assets.mjs

      - name: Forge baseline launch candidates
        run: node scripts/forge-launch-critical-assets.mjs

      - name: Normalize baseline formats
        run: node scripts/normalize-launch-critical-assets.mjs

      - name: Author Home Portal and Orb candidates
        run: >-
          node scripts/author-home-finalization-assets.mjs
          urai-tier1/public/assets/urai/generated/models
          operations/assets/sources/home-finalization-authored-source-v2.json

      - name: Apply Meshopt compression without pruning authored scene structure
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb \
            urai-tier1/public/assets/urai/generated/models/portal-ring-master-v1.glb \
            urai-tier1/public/assets/urai/generated/models/urai-orb-avatar-v1.glb; do
            output="${file%.glb}.meshopt.glb"
            npx --yes @gltf-transform/cli@4.2.1 meshopt "$file" "$output" --level medium
            mv "$output" "$file"
          done

      - name: Record exact authored identities
        run: node scripts/record-home-finalization-authored-candidates.mjs

      - name: Verify authored nodes clips compression and truth boundary
        run: node scripts/verify-home-finalization-authored-assets.mjs

      - name: Verify manifest receipts and budgets
        run: node scripts/verify-launch-critical-assets.mjs

      - name: Independently audit generated formats and metrics
        run: node scripts/audit-launch-critical-artifact.mjs

      - name: Strictly decode every Radiance HDR scanline
        run: node scripts/validate-radiance-hdr.mjs

      - name: Validate every GLB with Khronos-compatible validator
        shell: bash
        run: |
          set -euo pipefail
          for file in urai-tier1/public/assets/urai/generated/models/*.glb; do
            npx --yes @gltf-transform/cli@4.2.1 validate "$file"
          done

      - name: Extract pinned legacy comparison candidates
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$LEGACY_ASSET_HEAD"
          files=(
            'urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb'
            'urai-tier1/public/assets/urai/generated/models/ground-world-terrain-v1.glb'
            'urai-tier1/public/assets/urai/generated/models/focus-star-flight-v1.glb'
            'urai-tier1/public/assets/urai/generated/models/replay-memory-film-v1.glb'
            'urai-tier1/public/assets/urai/generated/models/portal-ring-master-v1.glb'
            'urai-tier1/public/assets/urai/generated/models/passport-status-room-v1.glb'
            'urai-tier1/public/assets/urai/generated/skyboxes/life-map-galaxy-skybox-v1.hdr'
            'urai-tier1/public/assets/urai/generated/textures/global-cinematic-material-pack-v1.json'
          )
          for file in "${files[@]}"; do
            destination="comparison/legacy/$file"
            mkdir -p "$(dirname "$destination")"
            git show "$LEGACY_ASSET_HEAD:$file" > "$destination"
          done

      - name: Compare authored current and pinned legacy candidates
        run: node scripts/compare-legacy-asset-candidates.mjs --legacy-root comparison/legacy --legacy-head "$LEGACY_ASSET_HEAD"

      - name: Upload reviewable authored candidate bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-launch-critical-authored-candidates-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            urai-tier1/public/assets/urai/generated/
            operations/assets/generated-receipts/
            operations/assets/sources/home-finalization-authored-source-v2.json
            operations/assets/home-finalization-candidate-decisions.json
            operations/assets/launch-critical-assets.json

      - name: Upload legacy comparison evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-legacy-asset-comparison-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            operations/assets/comparison/
            comparison/legacy/urai-tier1/public/assets/urai/generated/
