name: URAI Real Consumer Static Export Evidence
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
jobs:
  consumer-export:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify clean head
        run: test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD" && test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Build actual compiled UrAi static consumer
        run: env -u GITHUB_SHA SOURCE_VERSION="$URAI_EXACT_HEAD" NEXT_PUBLIC_GIT_SHA="$URAI_EXACT_HEAD" pnpm build:static
      - name: Hash and verify compiled consumer bytes
        run: node scripts/capture-real-consumer-static-export.mjs
      - name: Retain real export for governed staging assembler
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-real-consumer-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: |
            urai-tier1/out/
            artifacts/consumer-export/real-static-manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Verify tracked source remains unchanged
        if: always()
        run: test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD" && git diff --exit-code && git diff --cached --exit-code
