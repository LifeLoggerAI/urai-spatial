name: Inspect static hydration v7 log

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-static-hydration-v7-log.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Capture exact hydration probe log
        id: capture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '87383541538'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/static-hydration-v7-log"
          mkdir -p "$out"
          curl --fail --location --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$JOB_ID/logs" \
            > "$out/full.log"
          tail -n 500 "$out/full.log" > "$out/tail.log"
          grep -Ein -C 18 'Probe local hydrated|Error|failed|failure|pageerror|console|request|selector|focus|replay|ENOENT|ECONN|404|timeout|artifact|out=' "$out/full.log" \
            > "$out/diagnostic-excerpts.log" || true
          cat "$out/diagnostic-excerpts.log"
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Upload hydration v7 log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-hydration-v7-log-87383541538
          path: ${{ steps.capture.outputs.out }}
          if-no-files-found: error
          retention-days: 30
