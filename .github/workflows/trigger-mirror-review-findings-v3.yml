name: Run exact reviewed Mirror findings repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: trigger-mirror-review-findings-v3
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/mirror-embodied-spatial-realm-v2-20260801
  REVIEWED_HEAD: d3778b630a722ad51de8abe10ee1ed1a4de01a94
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  repair:
    if: github.repository == 'LifeLoggerAI/urai-spatial' && github.event.pull_request.head.ref == 'feat/mirror-embodied-spatial-realm-v2-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact staged branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify exact staging authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD^)" = "$REVIEWED_HEAD"
          test -f .github/workflows/one-shot-mirror-review-findings.yml
          test -f .github/workflows/trigger-mirror-review-findings-v2.yml
          test -f .github/workflows/trigger-mirror-review-findings-v3.yml
          test -f scripts/repair-mirror-review-findings.py
          mapfile -t changed < <(git diff --name-only "$REVIEWED_HEAD"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/trigger-mirror-review-findings-v3.yml'

      - name: Correct generated fixture contract literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/repair-mirror-review-findings.py')
          text = path.read_text()
          old = '''assert.equal(bareEntrySource.includes("const ACCEPTANCE_FIXTURES_ENABLED = process.env.NEXT_PUBLIC_URAI_ACCEPTANCE_FIXTURES === '1'"), true)'''
          new = '''assert.equal(bareEntrySource.includes("const ACCEPTANCE_FIXTURES_ENABLED = process.env.NEXT_PUBLIC_URAI_ACCEPTANCE_FIXTURES === '1';"), true)'''
          count = text.count(old)
          if count != 1:
              raise AssertionError(f'expected one generated fixture assertion, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply reviewed source corrections
        run: python scripts/repair-mirror-review-findings.py

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen graph
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify full Tier-1 boundary
        run: |
          pnpm --filter urai-tier1 test
          pnpm --filter urai-tier1 typecheck
          pnpm --filter urai-tier1 build

      - name: Commit clean reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-mirror-review-findings.yml
          git rm .github/workflows/trigger-mirror-review-findings-v2.yml
          git rm .github/workflows/trigger-mirror-review-findings-v3.yml
          git rm scripts/repair-mirror-review-findings.py
          git add .github/workflows/mirror-release-proof.yml \
            tests/mirror-release-proof.mjs \
            urai-tier1/src/app/mirror/MirrorBareEntryGuard.tsx \
            urai-tier1/src/app/mirror/MirrorSpatialClient.tsx \
            urai-tier1/tests/mirror-spatial-realm-contract.test.mjs
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "9"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close Mirror automated review findings"
          git push origin "HEAD:$TARGET_BRANCH"
