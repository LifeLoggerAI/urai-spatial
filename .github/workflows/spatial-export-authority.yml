name: Spatial Export Authority

on:
  pull_request:
    paths:
      - apps/functions/src/exportPagination.ts
      - apps/functions/src/lifeModelPrivateInputs.ts
      - apps/functions/scripts/export-pagination-emulator-proof.cjs
      - firebase.export-pagination-test.json
      - '.github/workflows/spatial-export-authority.yml'
      - 'apps/functions/src/index.ts'
      - 'apps/functions/src/privacyOperations.ts'
      - 'apps/functions/test/privacy-export-download.test.js'
      - 'apps/functions/test/lifeModelPrivateInputs.test.js'
      - 'scripts/check-spatial-export-deployment-boundary.mjs'
      - 'firebase.json'
      - '.firebaserc'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spatial-export-authority-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXACT_SHA }}
          persist-credentials: false
      - name: Require exact clean source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact frozen graph
        run: pnpm install --frozen-lockfile
      - name: Verify separate canonical and operational deployment authority
        run: node scripts/check-spatial-export-deployment-boundary.mjs
      - name: Strict compile and actual compiled Functions regression cases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spatial-export-proof"
          pnpm --filter urai-functions build 2>&1 | tee "$RUNNER_TEMP/spatial-export-proof/build.log"
          pnpm --filter urai-functions test 2>&1 | tee "$RUNNER_TEMP/spatial-export-proof/tests.tap"
      - name: Prove actual snapshot pagination in an isolated demo Firestore
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="${JAVA_HOME_21_X64:?Java21 runtime is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version 2>&1 | tee "$RUNNER_TEMP/spatial-export-proof/java-version.log"
          java -version 2>&1 | grep -E 'version "21\.'
          pnpm exec firebase emulators:exec --project demo-spatial-export-pages --config firebase.export-pagination-test.json --only firestore "node apps/functions/scripts/export-pagination-emulator-proof.cjs" 2>&1 | tee "$RUNNER_TEMP/spatial-export-proof/firestore-pagination.log"
      - name: Preserve exact source and acceptance limits
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/spatial-export-proof"
          printf '%s\n' "$EXACT_SHA" > "$RUNNER_TEMP/spatial-export-proof/source-sha.txt"
          printf '%s\n' 'Strict-compiled export handlers plus retained fixtures; the separate actual Firestore snapshot proof must pass. No loaded Functions, provider, deployed-runtime or independent-review acceptance is claimed.' > "$RUNNER_TEMP/spatial-export-proof/acceptance-limits.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: spatial-export-authority-${{ env.EXACT_SHA }}
          path: ${{ runner.temp }}/spatial-export-proof
          if-no-files-found: error
