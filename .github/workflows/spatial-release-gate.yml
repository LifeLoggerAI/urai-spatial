name: Spatial Release Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify spatial release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm playwright:ensure

      - name: Verify release gate
        run: pnpm verify:release:full
