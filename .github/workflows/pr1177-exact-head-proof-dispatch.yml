name: PR1177 Disposable V250 Final Pixel Dispatch

on:
  push:
    branches:
      - steward/pr1177-proof-dispatch-20260912
    paths:
      - '.github/workflows/pr1177-exact-head-proof-dispatch.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: pr1177-v250-final-pixel-dispatch
  cancel-in-progress: false

env:
  EXPECTED_HEAD: 316a2caa8585236d2f5dda5c61ae5d6516870873
  TARGET_BRANCH: steward/pr1177-v250-pixel-convergence-20260913

jobs:
  dispatch-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify exact disposable branch head and dispatch retained-pixel proofs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expected = process.env.EXPECTED_HEAD;
            const targetBranch = process.env.TARGET_BRANCH;
            const branch = await github.rest.repos.getBranch({ owner, repo, branch: targetBranch });
            if (branch.data.commit.sha !== expected) {
              core.setFailed(`Disposable branch moved: expected ${expected}, got ${branch.data.commit.sha}`);
              return;
            }
            const dispatches = [
              ['continuous-spatial-visual-proof.yml', { verification_sha: expected }],
              ['lifemap-founder-visual-proof.yml', { verification_sha: expected }],
              ['home-state-proof.yml', {}],
              ['portal-orb-exact-proof.yml', {}],
              ['accessibility-performance-evidence.yml', { verification_sha: expected }],
            ];
            for (const [workflow_id, inputs] of dispatches) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id, ref: targetBranch, inputs });
              core.info(`dispatched ${workflow_id} for ${expected}`);
            }
