name: PR1177 Disposable V250 Source Gate

on:
  push:
    branches:
      - steward/pr1177-proof-dispatch-20260912
    paths:
      - '.github/workflows/pr1177-exact-head-proof-dispatch.yml'

permissions:
  contents: read

concurrency:
  group: pr1177-v250-source-gate
  cancel-in-progress: false

env:
  EXPECTED_HEAD: 316a2caa8585236d2f5dda5c61ae5d6516870873

jobs:
  compact-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact disposable candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Run compact exact-head contract matrix
        run: corepack pnpm --dir urai-tier1 run test:unit
      - name: Prove source cleanliness
        run: git diff --check
