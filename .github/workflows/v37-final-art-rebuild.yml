name: V37 Final Sanctuary Art Rebuild

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - scripts/v37-final-art-transform.py
      - .github/workflows/v37-final-art-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor == 'LifeLoggerAI'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Apply V37 production art rebuild
        run: python3 scripts/v37-final-art-transform.py
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify current Home contracts
        working-directory: urai-tier1
        run: node --import tsx --test tests/aaa-presentation-convergence-contract.test.mjs tests/aaa-spatial-world-upgrade.test.mjs tests/aaa-world-artifact-contract.test.mjs
      - name: Verify TypeScript
        run: pnpm typecheck
      - name: Verify production static build
        run: pnpm build:static
      - name: Commit V37 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Home: rebuild final V37 sanctuary reliquary art"
          git push origin HEAD:home-final-v24-certify-20260826
