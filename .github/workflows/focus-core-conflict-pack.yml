name: Focus Core Conflict Pack

on:
  push:
    branches:
      - agent/focus-onto-core-resolve-20260729
  pull_request:
    branches:
      - release/core-convergence-20260729
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reproduce exact merge and capture stages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "urai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p conflict-pack/files
          set +e
          git merge --no-commit --no-ff 6e7a7f59ea8537ad516c4dbdfd832718ebf0f507
          status=$?
          set -e
          git status --short > conflict-pack/git-status.txt
          git ls-files -u > conflict-pack/unmerged-index.txt
          git diff --name-only --diff-filter=U > conflict-pack/conflicted-paths.txt
          git merge-base HEAD 6e7a7f59ea8537ad516c4dbdfd832718ebf0f507 > conflict-pack/merge-base.txt
          printf '%s\n' "0e263d6dacdc1510dc03897418a6335b939e55e6" > conflict-pack/lifemap-head.txt
          printf '%s\n' "6e7a7f59ea8537ad516c4dbdfd832718ebf0f507" > conflict-pack/focus-head.txt
          printf '%s\n' "$status" > conflict-pack/merge-exit.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            safe="conflict-pack/files/$path"
            mkdir -p "$(dirname "$safe")"
            cp "$path" "$safe.merged" || true
            git show ":1:$path" > "$safe.base" 2>/dev/null || true
            git show ":2:$path" > "$safe.lifemap" 2>/dev/null || true
            git show ":3:$path" > "$safe.focus" 2>/dev/null || true
          done < conflict-pack/conflicted-paths.txt
          git diff --cc > conflict-pack/combined-conflict.diff || true
          git diff --stat > conflict-pack/merge-stat.txt || true
      - name: Upload exact conflict pack
        uses: actions/upload-artifact@v4
        with:
          name: focus-core-conflict-pack
          path: conflict-pack
          if-no-files-found: error
          retention-days: 14
