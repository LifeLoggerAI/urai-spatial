name: Inspect existing Hosting capture evidence

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - ops/evidence-query-base-20260714
    paths:
      - '.github/workflows/inspect-existing-hosting-capture.yml'

permissions:
  actions: read
  contents: read

concurrency:
  group: inspect-existing-hosting-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ops/inspect-existing-hosting-capture-20260714'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DISPATCHER_SHA: 48835d090bdc2db0a46f79a09cc414f1fd7f82c3
      DISPATCHER_WORKFLOW: one-time-hosting-capture-dispatch.yml
      CAPTURE_WORKFLOW: capture-legacy-hosting-recovery.yml
      STATUS_WORKFLOW: one-time-hosting-capture-status.yml
    steps:
      - name: Checkout exact read-only inspector
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove read-only inspector identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('.github/workflows/inspect-existing-hosting-capture.yml').read_text(encoding='utf-8')
          match = re.search(r'^permissions:\n((?:  [^\n]+\n)+)', source, re.MULTILINE)
          if not match:
              raise SystemExit('workflow permissions block is missing')
          permissions = [line.strip() for line in match.group(1).splitlines() if line.strip()]
          if permissions != ['actions: read', 'contents: read']:
              raise SystemExit(f'unexpected workflow permissions: {permissions}')
          if 'persist-credentials: false' not in source:
              raise SystemExit('checkout must not persist credentials')
          PY

      - name: Query existing dispatcher, capture, status, jobs, and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/hosting-capture-inspection"
          mkdir -p "$out"
          api() {
            curl --fail --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }
          api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${DISPATCHER_WORKFLOW}/runs?branch=main&event=push&head_sha=${DISPATCHER_SHA}&per_page=50" > "$out/dispatcher-runs.json"
          api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${CAPTURE_WORKFLOW}/runs?branch=main&event=workflow_dispatch&per_page=50" > "$out/capture-runs.json"
          api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${STATUS_WORKFLOW}/runs?branch=main&event=push&per_page=50" > "$out/status-runs.json"

          node - <<'NODE' "$out"
          const fs = require('node:fs')
          const path = require('node:path')
          const out = process.argv[2]
          const loadRuns = (name) => (JSON.parse(fs.readFileSync(path.join(out, name), 'utf8')).workflow_runs || [])
          const dispatchers = loadRuns('dispatcher-runs.json')
          const captures = loadRuns('capture-runs.json')
          const statuses = loadRuns('status-runs.json')
          const dispatcher = dispatchers.find((run) => run.head_sha === process.env.DISPATCHER_SHA) || null
          const dispatcherTime = dispatcher ? Date.parse(dispatcher.created_at || '') : NaN
          const eligibleCaptures = captures
            .filter((run) => run.head_branch === 'main' && (!Number.isFinite(dispatcherTime) || Date.parse(run.created_at || '') >= dispatcherTime))
            .sort((a, b) => Date.parse(a.created_at || '') - Date.parse(b.created_at || ''))
          const capture = eligibleCaptures[0] || null
          const status = statuses
            .filter((run) => run.head_branch === 'main')
            .sort((a, b) => Date.parse(b.created_at || '') - Date.parse(a.created_at || ''))[0] || null
          const compact = (run) => run && ({
            id: run.id,
            name: run.name,
            event: run.event,
            status: run.status,
            conclusion: run.conclusion,
            headSha: run.head_sha,
            headBranch: run.head_branch,
            createdAt: run.created_at,
            updatedAt: run.updated_at,
            htmlUrl: run.html_url,
            runNumber: run.run_number,
            runAttempt: run.run_attempt,
          })
          const report = {
            schemaVersion: 'urai-existing-hosting-capture-inspection-1',
            recordedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            inspectorSha: process.env.GITHUB_SHA,
            dispatcherExpectedSha: process.env.DISPATCHER_SHA,
            dispatcher: compact(dispatcher),
            capture: compact(capture),
            statusReporter: compact(status),
            captureFound: Boolean(capture),
            eligibleCaptureCount: eligibleCaptures.length,
            allCaptureRuns: captures.map(compact),
            productionMutationPerformedByInspector: false,
          }
          fs.writeFileSync(path.join(out, 'inspection.json'), `${JSON.stringify(report, null, 2)}\n`)
          if (capture) fs.writeFileSync(path.join(out, 'capture-run-id.txt'), `${capture.id}\n`)
          console.log(JSON.stringify(report, null, 2))
          NODE

          if test -s "$out/capture-run-id.txt"; then
            run_id="$(cat "$out/capture-run-id.txt")"
            api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100" > "$out/capture-jobs.json"
            api "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" > "$out/capture-artifacts.json"
          else
            printf '%s\n' '{"total_count":0,"jobs":[]}' > "$out/capture-jobs.json"
            printf '%s\n' '{"total_count":0,"artifacts":[]}' > "$out/capture-artifacts.json"
          fi
          cp -R "$out" ./hosting-capture-inspection
          test -z "$(git status --porcelain --untracked-files=normal | grep -v '^?? hosting-capture-inspection/' || true)"

      - name: Upload read-only inspection receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: existing-hosting-capture-inspection-${{ github.event.pull_request.head.sha }}
          path: hosting-capture-inspection/
          if-no-files-found: error
          retention-days: 7
