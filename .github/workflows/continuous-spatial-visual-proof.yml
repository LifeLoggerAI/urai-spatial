name: Continuous Spatial Visual Proof

on:
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
  pull_request:
    branches: [main, 'converge/**']
    paths:
      - '.github/workflows/continuous-spatial-visual-proof.yml'
      - 'scripts/capture-continuous-spatial-proof-v18.mjs'
      - 'scripts/capture-memory-world-runtime-proof.mjs'
      - 'scripts/capture-launch-route-matrix.mjs'
      - 'release/route-manifest.json'
      - 'scripts/run-continuous-spatial-proof-v18-stable.mjs'
      - 'scripts/run-continuous-spatial-proof-v18-portal-stable.mjs'
      - 'scripts/run-continuous-spatial-proof-v19-portal-stable.mjs'
      - 'scripts/run-continuous-spatial-proof-v21-grouped.mjs'
      - 'scripts/run-continuous-spatial-proof-v22-natural.mjs'
      - 'scripts/run-with-ci-webgl.mjs'
      - 'urai-tier1/src/app/**'
      - 'urai-tier1/src/spatial/**'
      - 'urai-tier1/src/components/lifemap/**'
      - 'urai-tier1/tests/**'

permissions:
  contents: read

concurrency:
  group: continuous-spatial-visual-proof-${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  NEXT_PUBLIC_URAI_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'
  URAI_PROOF_RECORD_VIDEO: 'false'

jobs:
  browser-proof:
    name: browser-proof-${{ matrix.proof_group }}
    runs-on: ubuntu-24.04
    # The visual group runs 15 Home/Orb captures plus the full 65-case launch route matrix.
    # Exact-head evidence on 099470... reached 59/65 route captures with zero errors before the prior 40-minute job cap cancelled it.
    # Keep every proof/assertion intact and allow the bounded matrix enough wall-clock budget to finish.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        proof_group: [visual, desktop, mobile, portal-fallback]
    env:
      URAI_PROOF_GROUP: ${{ matrix.proof_group }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build exact static release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/continuous-spatial-proof-$URAI_PROOF_GROUP"
          pnpm build:static 2>&1 | tee "artifacts/continuous-spatial-proof-$URAI_PROOF_GROUP/build-static.log"

      - name: Install and prove exact Tier-1 Chromium
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
          pnpm --dir urai-tier1 exec playwright --version
          node --check scripts/run-with-ci-webgl.mjs
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs
          node --check scripts/capture-memory-world-runtime-proof.mjs
          node --check scripts/capture-launch-route-matrix.mjs
          node scripts/capture-launch-route-matrix.mjs --validate-only

      - name: Capture bounded spatial proof group
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/continuous-spatial-proof-$URAI_PROOF_GROUP"
          mkdir -p "$output"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > "$output/http-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/home/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/home/ >/dev/null
          memory_status=0
          if [ "$URAI_PROOF_GROUP" = 'portal-fallback' ]; then
            URAI_PROOF_BASE=http://127.0.0.1:4173 \
            URAI_PROOF_DIR="$output/memory-world" \
              node scripts/run-with-ci-webgl.mjs scripts/capture-memory-world-runtime-proof.mjs 2>&1 | tee "$output/memory-world-capture.log" || memory_status=$?
          fi
          spatial_status=0
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_PROOF_DIR="$output" \
          URAI_EXACT_HEAD="$URAI_EXACT_HEAD" \
          URAI_PROOF_GROUP="$URAI_PROOF_GROUP" \
          URAI_PROOF_RECORD_VIDEO="$URAI_PROOF_RECORD_VIDEO" \
            node scripts/run-with-ci-webgl.mjs scripts/run-continuous-spatial-proof-v22-natural.mjs 2>&1 | tee "$output/capture.log" || spatial_status=$?
          route_matrix_status=0
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_PROOF_DIR="$output/launch-route-matrix" \
          URAI_EXACT_HEAD="$URAI_EXACT_HEAD" \
          URAI_PROOF_GROUP="$URAI_PROOF_GROUP" \
            node scripts/run-with-ci-webgl.mjs scripts/capture-launch-route-matrix.mjs 2>&1 | tee "$output/launch-route-matrix-capture.log" || route_matrix_status=$?
          test "$memory_status" = 0
          test "$spatial_status" = 0
          test "$route_matrix_status" = 0

      - name: Prove complete group receipt
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/continuous-spatial-proof-$URAI_PROOF_GROUP"
          node --input-type=module - "$output/receipt.json" "$URAI_PROOF_GROUP" "$URAI_EXACT_HEAD" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const [path, group, head] = process.argv.slice(2)
          const receipt = JSON.parse(await readFile(path, 'utf8'))
          const expected = { visual: [15, 0], desktop: [0, 4], mobile: [0, 6], 'portal-fallback': [1, 2] }
          const [captures, interactions] = expected[group]
          if (receipt.exactHead !== head || receipt.group !== group) throw new Error('Exact-head or group receipt mismatch')
          if (receipt.captures.length !== captures || receipt.interactions.length !== interactions) throw new Error(`Incomplete ${group} receipt`)
          if (receipt.errors.length) throw new Error(`Receipt contains ${receipt.errors.length} errors`)
          NODE

      - name: Prove complete unsigned route matrix receipt
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/continuous-spatial-proof-$URAI_PROOF_GROUP/launch-route-matrix"
          node --input-type=module - "$output/receipt.json" "$URAI_PROOF_GROUP" "$URAI_EXACT_HEAD" <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFile } from 'node:fs/promises'
          import path from 'node:path'
          const [file, group, head] = process.argv.slice(2)
          const receipt = JSON.parse(await readFile(file, 'utf8'))
          const manifest = JSON.parse(await readFile('release/route-manifest.json', 'utf8'))
          const routes = manifest.criticalRoutes
          const demoCount = ['/life-map', '/focus', '/replay'].filter(route => routes.includes(route)).length
          const primaryCount = routes.length + demoCount
          const primaryProfiles = { visual: ['desktop-1440x900', 1440, 900], mobile: ['narrow-320x700', 320, 700], desktop: ['landscape-844x390', 844, 390], 'portal-fallback': ['no-webgl-390x844', 390, 844] }
          const representativeRoutes = ['/home', '/life-map', '/focus', '/replay', '/passport', '/privacy-controls']
          const representativeProfiles = [['tablet-portrait-768x1024', 768, 1024], ['tablet-landscape-1024x768', 1024, 768], ['wide-desktop-2560x1440', 2560, 1440]]
          const representativeCount = group === 'visual' ? representativeRoutes.length * representativeProfiles.length : 0
          const expectedCount = primaryCount + representativeCount
          if (receipt.schemaVersion !== 'urai-launch-route-matrix-1' || receipt.exactHead !== head || receipt.group !== group) throw new Error('Route matrix identity mismatch')
          if (receipt.expectedCaptures !== expectedCount || receipt.expectedRouteMatrixCaptures !== expectedCount || receipt.expectedPrimaryCaptures !== primaryCount || receipt.expectedRepresentativeCaptures !== representativeCount || receipt.captures.length !== expectedCount) throw new Error('Incomplete route matrix capture count')
          if (receipt.errors.length) throw new Error(`Route matrix contains ${receipt.errors.length} technical defects`)
          if (new Set(receipt.captures.map(capture => capture.id)).size !== expectedCount) throw new Error('Route matrix has duplicate capture identities')
          const primary = receipt.captures.filter(capture => capture.coverage === 'primary-critical-routes')
          const representatives = receipt.captures.filter(capture => capture.coverage === 'representative-tablet-or-wide')
          if (primary.length !== primaryCount || representatives.length !== representativeCount) throw new Error('Route matrix coverage counts differ')
          const initialRoutes = new Set(primary.filter(capture => capture.requestedState === 'initial-unsigned').map(capture => capture.route))
          if (initialRoutes.size !== routes.length || routes.some(route => !initialRoutes.has(route))) throw new Error('Route matrix omitted a critical initial route')
          for (const route of ['/life-map', '/focus', '/replay'].filter(route => routes.includes(route))) {
            if (primary.filter(capture => capture.route === route && capture.requestedState === 'explicit-demo').length !== 1) throw new Error(`Route matrix omitted a primary disclosed demo: ${route}`)
          }
          if (group === 'visual') {
            for (const [profile] of representativeProfiles) for (const route of representativeRoutes) {
              const expectedState = ['/life-map', '/focus', '/replay'].includes(route) ? 'explicit-demo' : 'initial-unsigned'
              if (!routes.includes(route) || representatives.filter(capture => capture.route === route && capture.profile === profile && capture.requestedState === expectedState).length !== 1) throw new Error(`Route matrix omitted a representative: ${profile} ${route}`)
            }
          }
          for (const capture of receipt.captures) {
            const expectedProfile = capture.coverage === 'primary-critical-routes' ? primaryProfiles[group] : representativeProfiles.find(([id]) => id === capture.profile)
            if (!expectedProfile || capture.profile !== expectedProfile[0] || capture.profileMetadata?.width !== expectedProfile[1] || capture.profileMetadata?.height !== expectedProfile[2] || capture.profileMetadata?.deviceScaleFactor !== 1) throw new Error(`Route matrix profile mismatch: ${capture.id}`)
            if (capture.exactHead !== head || !capture.dom || !capture.readiness || !capture.image || !capture.events || capture.technicalDefects.length || capture.sessionState !== 'fresh-unsigned-initial-entry' || capture.returningSession !== 'not-exercised') throw new Error(`Incomplete route matrix evidence: ${capture.id}`)
            const bytes = await readFile(path.join(path.dirname(file), capture.image.path))
            if (createHash('sha256').update(bytes).digest('hex') !== capture.image.sha256) throw new Error(`Route matrix image hash mismatch: ${capture.id}`)
            if (capture.image.profile !== capture.profile || capture.image.width !== expectedProfile[1] || capture.image.height !== expectedProfile[2] || bytes.readUInt32BE(16) !== capture.image.width || bytes.readUInt32BE(20) !== capture.image.height) throw new Error(`Route matrix PNG dimensions mismatch: ${capture.id}`)
          }
          NODE

      - name: Upload exact-head grouped visual proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-spatial-visual-proof-${{ matrix.proof_group }}-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/continuous-spatial-proof-${{ matrix.proof_group }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
