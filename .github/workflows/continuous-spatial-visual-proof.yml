name: Continuous Spatial Visual Proof

on:
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/continuous-spatial-visual-proof.yml'
      - 'scripts/capture-continuous-spatial-proof.mjs'
      - 'scripts/capture-continuous-spatial-proof-v18.mjs'
      - 'scripts/run-continuous-spatial-proof-v18-stable.mjs'
      - 'scripts/run-continuous-spatial-proof-v18-portal-stable.mjs'
      - 'scripts/run-continuous-spatial-proof-v19-portal-stable.mjs'
      - 'scripts/run-continuous-spatial-proof-v19.mjs'
      - 'scripts/run-continuous-spatial-proof-v20.mjs'
      - 'scripts/run-continuous-spatial-proof-fixed.mjs'
      - 'scripts/run-continuous-spatial-proof-classified.mjs'
      - 'urai-tier1/src/app/HomeSpatialCanvas.tsx'
      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'
      - 'urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx'
      - 'urai-tier1/src/app/HomeSanctuaryWorld.tsx'
      - 'urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx'
      - 'urai-tier1/src/app/spatial-runtime-restoration.css'
      - 'urai-tier1/src/app/template.tsx'
      - 'urai-tier1/src/app/status/**'
      - 'urai-tier1/src/data/launchTruth.ts'
      - 'urai-tier1/tests/status-live-authority-contract.test.mjs'
      - 'urai-tier1/src/app/GroundSpatialWorldClean.tsx'
      - 'urai-tier1/src/components/lifemap/**'
      - 'urai-tier1/src/spatial/lifemap/**'
      - 'urai-tier1/src/spatial/world/**'

permissions:
  contents: read

concurrency:
  group: continuous-spatial-visual-proof-${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build exact static release candidate before browser installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-spatial-proof
          set +e
          set -o pipefail
          pnpm build:static 2>&1 | tee artifacts/continuous-spatial-proof/build-static.log
          build_status=${PIPESTATUS[0]}
          printf '%s\n' "$build_status" > artifacts/continuous-spatial-proof/build-static-exit-code.txt
          set -e
          exit "$build_status"

      - name: Install and prove exact Tier-1 Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-spatial-proof
          set +e
          set -o pipefail
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium \
            2>&1 | tee artifacts/continuous-spatial-proof/playwright-install.log
          install_status=${PIPESTATUS[0]}
          printf '%s\n' "$install_status" > artifacts/continuous-spatial-proof/playwright-install-exit-code.txt
          set -e
          test "$install_status" -eq 0

          pnpm --dir urai-tier1 exec playwright --version \
            | tee artifacts/continuous-spatial-proof/playwright-version.txt
          browser_path="$(node --input-type=module - <<'NODE'
          import { createRequire } from 'node:module'
          const requireFromTierOne = createRequire(new URL('./urai-tier1/package.json', import.meta.url))
          const { chromium } = requireFromTierOne('playwright')
          process.stdout.write(chromium.executablePath())
          NODE
          )"
          test -n "$browser_path"
          test -x "$browser_path"
          printf '%s\n' "$browser_path" > artifacts/continuous-spatial-proof/playwright-executable-path.txt

      - name: Capture desktop mobile and fallback spatial proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-spatial-proof
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out \
            > artifacts/continuous-spatial-proof/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/home/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/home/ >/dev/null
          set +e
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_PROOF_DIR=artifacts/continuous-spatial-proof \
          URAI_EXACT_HEAD="$URAI_EXACT_HEAD" \
            node scripts/run-continuous-spatial-proof-v19-portal-stable.mjs \
            2>&1 | tee artifacts/continuous-spatial-proof/capture.log
          capture_status=${PIPESTATUS[0]}
          printf '%s\n' "$capture_status" > artifacts/continuous-spatial-proof/capture-exit-code.txt
          set -e
          exit "$capture_status"

      - name: Create compact exact-head diagnostic receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-spatial-proof
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const outputDir = 'artifacts/continuous-spatial-proof'
          const sourcePath = `${outputDir}/receipt.json`
          let receipt = null
          let parseError = null
          try {
            receipt = JSON.parse(await readFile(sourcePath, 'utf8'))
          } catch (error) {
            parseError = String(error)
          }

          const diagnostics = (value) => ({
            consoleErrors: value?.consoleErrors || [],
            pageErrors: value?.pageErrors || [],
            failedRequests: value?.failedRequests || [],
            ignoredAbortedRequests: value?.ignoredAbortedRequests || [],
          })
          const errorDetail = (value) => value ? ({
            message: value?.message || String(value),
            stack: value?.stack || null,
          }) : null
          const movement = (value) => value ? ({
            method: value.method || null,
            target: value.target || null,
            start: value.start || null,
            end: value.end || null,
            elapsedMs: value.elapsedMs ?? null,
            distanceTravelled: value.distanceTravelled ?? null,
            bestDistanceToTarget: value.bestDistanceToTarget ?? null,
            reached: value.reached ?? null,
            maxPulses: value.maxPulses ?? null,
            pulsesUsed: value.pulsesUsed ?? null,
            phaseLabels: (value.phases || []).map((phase) => phase?.label || phase?.direction || null),
          }) : null
          const route = (value) => value ? ({
            href: value.href || null,
            pathname: value.pathname || null,
            entryPortal: value.entryPortal || null,
            cameraCheckpoint: value.cameraCheckpoint || null,
            from: value.from || null,
            expected: value.expected || null,
            routeSettled: value.routeSettled ?? null,
            openingObserved: value.openingObserved ?? null,
            traversalObserved: value.traversalObserved ?? null,
            closingObserved: value.closingObserved ?? null,
            lifecycleObserved: value.lifecycleObserved ?? null,
            phases: value.phases || [],
          }) : null
          const error = (value) => ({
            fatal: value?.fatal || null,
            stack: value?.stack || null,
            id: value?.id || null,
            destination: value?.destination || null,
            method: value?.method || null,
            videoError: errorDetail(value?.videoError),
            activationFailure: errorDetail(value?.activationFailure),
            movementFailure: errorDetail(value?.movementFailure),
            movement: movement(value?.movement || value?.result?.movement),
            finalTelemetry: value?.finalTelemetry || value?.result?.finalTelemetry || null,
            routeEvidence: route(value?.routeEvidence),
            diagnostics: diagnostics(value?.diagnostics),
            screenshot: value?.screenshot || null,
            video: value?.video || null,
          })

          const compact = {
            schemaVersion: 'urai-continuous-spatial-visual-proof-compact-1',
            exactHead: process.env.URAI_EXACT_HEAD || null,
            sourceReceiptPresent: Boolean(receipt),
            sourceSchemaVersion: receipt?.schemaVersion || null,
            capturedAt: receipt?.capturedAt || null,
            expectReady: receipt?.expectReady ?? null,
            captureCount: receipt?.captures?.length || 0,
            interactionCount: receipt?.interactions?.length || 0,
            errorCount: receipt?.errors?.length || 0,
            parseError,
            captures: (receipt?.captures || []).map((record) => ({
              id: record.id || null,
              route: record.route || null,
              query: record.query || null,
              viewport: record.viewport || null,
              screenshot: record.screenshot || null,
              video: record.video || null,
              passed: record.verification?.passed ?? null,
              fallbackVisible: record.fallbackVisible ?? null,
              semanticButtons: record.semanticButtons ?? null,
              diagnostics: diagnostics(record.diagnostics),
            })),
            interactions: (receipt?.interactions || []).map((record) => ({
              id: record.id || null,
              method: record.method || null,
              destination: record.destination || null,
              screenshot: record.screenshot || null,
              video: record.video || null,
              videoError: errorDetail(record.videoError),
              nearby: record.result?.nearby || null,
              contextVisible: record.result?.contextVisible ?? null,
              editableFocusProven: record.result?.editableFocusProven ?? null,
              movementFailure: errorDetail(record.result?.movementFailure || record.movementFailure),
              movement: movement(record.movement || record.result?.movement),
              finalTelemetry: record.finalTelemetry || record.result?.finalTelemetry || null,
              activationFailure: errorDetail(record.activationFailure),
              routeEvidence: route(record.routeEvidence),
              diagnostics: diagnostics(record.diagnostics),
            })),
            errors: (receipt?.errors || []).map(error),
          }
          await writeFile(`${outputDir}/compact-receipt.json`, `${JSON.stringify(compact, null, 2)}\n`)
          NODE

      - name: Upload compact exact-head diagnostic receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: continuous-spatial-visual-proof-compact-${{ env.URAI_EXACT_HEAD }}
          path: |
            artifacts/continuous-spatial-proof/compact-receipt.json
            artifacts/continuous-spatial-proof/capture-exit-code.txt
            artifacts/continuous-spatial-proof/build-static-exit-code.txt
            artifacts/continuous-spatial-proof/playwright-install-exit-code.txt
            artifacts/continuous-spatial-proof/playwright-version.txt
            artifacts/continuous-spatial-proof/http-server.log
          if-no-files-found: error
          retention-days: 365
          compression-level: 9

      - name: Upload exact-head visual receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: continuous-spatial-visual-proof-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/continuous-spatial-proof
          if-no-files-found: error
          retention-days: 365
