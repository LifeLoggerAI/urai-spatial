name: Continuous Spatial Visual Proof

on:
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/continuous-spatial-visual-proof.yml'
      - 'scripts/capture-continuous-spatial-proof-v18.mjs'
      - 'urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs'
      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
      - 'urai-tier1/src/app/HomeSpatialCanvas.tsx'
      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'
      - 'urai-tier1/src/app/home/**'
      - 'urai-tier1/src/spatial/assets/**'
      - 'urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx'
      - 'urai-tier1/src/app/spatial-runtime-restoration.css'
      - 'urai-tier1/src/app/template.tsx'
      - 'urai-tier1/src/app/status/**'
      - 'urai-tier1/src/data/launchTruth.ts'
      - 'urai-tier1/tests/status-live-authority-contract.test.mjs'
      - 'urai-tier1/src/app/GroundSpatialWorldClean.tsx'
      - 'urai-tier1/src/components/lifemap/**'
      - 'urai-tier1/src/spatial/lifemap/**'
      - 'urai-tier1/src/spatial/world/**'

permissions:
  contents: read

concurrency:
  group: continuous-spatial-visual-proof-${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Resolve whether canonical Home assets are promoted
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import fs from 'node:fs'
          const source = fs.readFileSync('urai-tier1/src/spatial/assets/assetManifest.ts', 'utf8')
          const ids = ['home-entry-chamber-model-v1', 'portal-ring-master-glb-v1', 'urai-orb-avatar-glb-v1']
          const ready = ids.every((id) => {
            const start = source.indexOf(`id: '${id}'`)
            return start >= 0 && /status: 'ready'/.test(source.slice(start, start + 800))
          })
          console.log(`URAI_HOME_EXPECT_READY=${ready}`)
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build exact static release candidate before browser installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-spatial-proof
          set +e
          set -o pipefail
          pnpm build:static 2>&1 | tee artifacts/continuous-spatial-proof/build-static.log
          build_status=${PIPESTATUS[0]}
          printf '%s\n' "$build_status" > artifacts/continuous-spatial-proof/build-static-exit-code.txt
          set -e
          exit "$build_status"

      - name: Install and prove exact Tier-1 Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-spatial-proof
          set +e
          set -o pipefail
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium \
            2>&1 | tee artifacts/continuous-spatial-proof/playwright-install.log
          install_status=${PIPESTATUS[0]}
          printf '%s\n' "$install_status" > artifacts/continuous-spatial-proof/playwright-install-exit-code.txt
          set -e
          test "$install_status" -eq 0
          pnpm --dir urai-tier1 exec playwright --version | tee artifacts/continuous-spatial-proof/playwright-version.txt

      - name: Capture exact Home visual interaction and fallback proof v18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/continuous-spatial-proof
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out \
            > artifacts/continuous-spatial-proof/http-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/home/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/home/ >/dev/null
          set +e
          set -o pipefail
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_PROOF_DIR=artifacts/continuous-spatial-proof \
          URAI_EXACT_HEAD="$URAI_EXACT_HEAD" \
          URAI_HOME_EXPECT_READY="$URAI_HOME_EXPECT_READY" \
            node scripts/capture-continuous-spatial-proof-v18.mjs \
            2>&1 | tee artifacts/continuous-spatial-proof/capture.log
          capture_status=${PIPESTATUS[0]}
          set -e
          exit "$capture_status"

      - name: Upload exact-head visual receipt screenshots and recordings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-spatial-visual-proof-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/continuous-spatial-proof
          if-no-files-found: error
          retention-days: 365
