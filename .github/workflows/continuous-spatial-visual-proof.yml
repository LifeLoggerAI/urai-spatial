name: Continuous Spatial Visual Proof

on:
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/continuous-spatial-visual-proof.yml'
      - 'scripts/capture-continuous-spatial-proof-v18.mjs'
      - 'scripts/run-continuous-spatial-proof-v18-stable.mjs'
      - 'scripts/run-continuous-spatial-proof-v18-portal-stable.mjs'
      - 'scripts/run-continuous-spatial-proof-v19-portal-stable.mjs'
      - 'scripts/run-continuous-spatial-proof-v21-grouped.mjs'
      - 'scripts/run-continuous-spatial-proof-v22-natural.mjs'
      - 'scripts/run-with-ci-webgl.mjs'
      - 'urai-tier1/src/app/**'
      - 'urai-tier1/src/spatial/**'
      - 'urai-tier1/src/components/lifemap/**'
      - 'urai-tier1/tests/**'

permissions:
  contents: read

concurrency:
  group: continuous-spatial-visual-proof-${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  PLAYWRIGHT_BROWSERS_PATH: '0'
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'
  URAI_PROOF_RECORD_VIDEO: 'false'

jobs:
  browser-proof:
    name: browser-proof-${{ matrix.proof_group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        proof_group: [visual, desktop, mobile, portal-fallback]
    env:
      URAI_PROOF_GROUP: ${{ matrix.proof_group }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build exact static release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "artifacts/continuous-spatial-proof-$URAI_PROOF_GROUP"
          pnpm build:static 2>&1 | tee "artifacts/continuous-spatial-proof-$URAI_PROOF_GROUP/build-static.log"

      - name: Install and prove exact Tier-1 Chromium
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir urai-tier1 exec playwright install --with-deps chromium
          pnpm --dir urai-tier1 exec playwright --version
          node --check scripts/run-with-ci-webgl.mjs
          node --check scripts/run-continuous-spatial-proof-v22-natural.mjs

      - name: Capture bounded spatial proof group
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/continuous-spatial-proof-$URAI_PROOF_GROUP"
          mkdir -p "$output"
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > "$output/http-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/home/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/home/ >/dev/null
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_PROOF_DIR="$output" \
          URAI_EXACT_HEAD="$URAI_EXACT_HEAD" \
          URAI_PROOF_GROUP="$URAI_PROOF_GROUP" \
          URAI_PROOF_RECORD_VIDEO="$URAI_PROOF_RECORD_VIDEO" \
            node scripts/run-with-ci-webgl.mjs scripts/run-continuous-spatial-proof-v22-natural.mjs 2>&1 | tee "$output/capture.log"

      - name: Prove complete group receipt
        shell: bash
        run: |
          set -euo pipefail
          output="artifacts/continuous-spatial-proof-$URAI_PROOF_GROUP"
          node --input-type=module - "$output/receipt.json" "$URAI_PROOF_GROUP" "$URAI_EXACT_HEAD" <<'NODE'
          import { readFile } from 'node:fs/promises'
          const [path, group, head] = process.argv.slice(2)
          const receipt = JSON.parse(await readFile(path, 'utf8'))
          const expected = { visual: [15, 0], desktop: [0, 4], mobile: [0, 6], 'portal-fallback': [1, 2] }
          const [captures, interactions] = expected[group]
          if (receipt.exactHead !== head || receipt.group !== group) throw new Error('Exact-head or group receipt mismatch')
          if (receipt.captures.length !== captures || receipt.interactions.length !== interactions) throw new Error(`Incomplete ${group} receipt`)
          if (receipt.errors.length) throw new Error(`Receipt contains ${receipt.errors.length} errors`)
          NODE

      - name: Upload exact-head grouped visual proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuous-spatial-visual-proof-${{ matrix.proof_group }}-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/continuous-spatial-proof-${{ matrix.proof_group }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
