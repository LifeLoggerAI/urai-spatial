name: Home V38 Generated Source Repair

on:
  workflow_dispatch:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/home-v38-generated-source-repair.yml'
      - 'scripts/repair-home-v38-generated-source.py'

permissions:
  contents: write

concurrency:
  group: home-v38-generated-source-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Repair malformed V38 generated source
        run: python3 scripts/repair-home-v38-generated-source.py

      - name: Verify focused Home contracts
        working-directory: urai-tier1
        run: node --test --test-concurrency=1 tests/home-relic-machine-realism-contract.test.mjs tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs

      - name: Commit repaired V38 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx; then
            echo 'V38 generated source already clean.'
            exit 0
          fi
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$current" = "${GITHUB_SHA}"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git commit -m 'Home: repair V38 generated reliquary source'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826
