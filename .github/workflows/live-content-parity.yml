name: URAI Live Content Parity

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full 40-character reviewed main SHA whose deployment is being certified
        required: true
        type: string
      expected_deployed_sha:
        description: Exact SHA required from x-urai-commit-sha, x-deployed-sha, or page metadata
        required: true
        type: string
      confirm:
        description: Type VERIFY LIVE URAI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: urai-live-content-parity
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  URAI_CANONICAL_LIVE_URL: https://urai.app

jobs:
  verify-live-content:
    name: Verify urai.app route content and SHA parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate operator inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.confirm }}' == 'VERIFY LIVE URAI' ]] || { echo 'Confirmation phrase mismatch.' >&2; exit 1; }
          [[ '${{ inputs.target_sha }}' =~ ^[0-9a-f]{40}$ ]] || { echo 'target_sha must be a full lowercase 40-character SHA.' >&2; exit 1; }
          [[ '${{ inputs.expected_deployed_sha }}' =~ ^[0-9a-f]{40}$ ]] || { echo 'expected_deployed_sha must be a full lowercase 40-character SHA.' >&2; exit 1; }
          [[ '${{ inputs.expected_deployed_sha }}' == '${{ inputs.target_sha }}' ]] || { echo 'Expected deployed SHA must equal the reviewed target SHA.' >&2; exit 1; }

      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify checked-out SHA and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [[ "$actual" == '${{ inputs.target_sha }}' ]] || { echo "Checked out $actual, expected ${{ inputs.target_sha }}" >&2; exit 1; }
          git fetch origin main --no-tags --prune
          git merge-base --is-ancestor "$actual" origin/main || { echo 'Target SHA is not reachable from origin/main.' >&2; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify live route content
        working-directory: urai-tier1
        env:
          URAI_LIVE_BASE_URL: ${{ env.URAI_CANONICAL_LIVE_URL }}
          URAI_EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
          URAI_LIVE_RECEIPT_PATH: artifacts/live-content-parity.json
        run: node scripts/verify-live-content-parity.mjs

      - name: Record verifier metadata
        if: always()
        working-directory: urai-tier1
        shell: bash
        run: |
          mkdir -p artifacts
          cat > artifacts/live-content-parity-metadata.json <<EOF
          {
            "repository": "${GITHUB_REPOSITORY}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunNumber": "${GITHUB_RUN_NUMBER}",
            "actor": "${GITHUB_ACTOR}",
            "targetSha": "${{ inputs.target_sha }}",
            "expectedDeployedSha": "${{ inputs.expected_deployed_sha }}",
            "baseUrl": "${URAI_CANONICAL_LIVE_URL}",
            "certificationMode": "exact-sha-required"
          }
          EOF

      - name: Upload live parity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-live-content-parity-${{ inputs.target_sha }}
          path: |
            urai-tier1/artifacts/live-content-parity.json
            urai-tier1/artifacts/live-content-parity-metadata.json
          if-no-files-found: error
          retention-days: 90
