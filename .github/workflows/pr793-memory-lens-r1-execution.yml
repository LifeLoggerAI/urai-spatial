name: PR 793 memory lens R2 execution

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - product/canonical-seven-fix-clean-r3-20260718
    paths:
      - .github/workflows/pr793-memory-lens-r1-execution.yml
      - scripts/apply-pr793-memory-lens-redesign.mjs

permissions:
  contents: write

concurrency:
  group: pr793-memory-lens-r2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOURCE_BASE: 50e5e883ebea050c30795e0ff934860b7caf567f
  PRODUCT_TREE_BASE: 50e5e883ebea050c30795e0ff934860b7caf567f
  SOURCE_BRANCH: exec/pr793-memory-lens-r2-20260718
  PRODUCT_BRANCH: product/canonical-seven-fix-clean-r3-20260718

jobs:
  redesign:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'exec/pr793-memory-lens-r2-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact memory-lens execution head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Prove execution authority and apply to latest product head
        shell: bash
        run: |
          exec > >(tee /tmp/pr793-memory-lens-apply.log) 2>&1
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git merge-base "$SOURCE_BASE" HEAD)" = "$SOURCE_BASE"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff --name-only "$PRODUCT_TREE_BASE" HEAD | sort)" = "$(printf '%s\n' .github/workflows/pr793-memory-lens-r1-execution.yml scripts/apply-pr793-memory-lens-redesign.mjs | sort)"
          cp scripts/apply-pr793-memory-lens-redesign.mjs /tmp/apply-pr793-memory-lens-redesign.mjs
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/apply-pr793-memory-lens-redesign.mjs')
          source = path.read_text()
          pattern = re.compile(r"(?m)^(\s*)if \(menu\) menu\.open = true\n\1window\.setTimeout\(keepSelectedControlsOpen, 0\)")
          source, click_count = pattern.subn(
              lambda match: f"{match.group(1)}if (menu) menu.open = true\n{match.group(1)}queueMicrotask(keepSelectedControlsOpen)\n{match.group(1)}window.setTimeout(keepSelectedControlsOpen, 0)",
              source,
              count=1,
          )
          old_call = "replaceOnce(boundary, '      queueMicrotask(keepSelectedControlsOpen)\\n', '')"
          new_call = """replaceOnce(
            boundary,
            `      queueMicrotask(keepSelectedControlsOpen)\n      return true\n`,
            `      return true\n`,
          )"""
          cycle_count = source.count(old_call)
          if click_count != 1:
              raise SystemExit(f'click-selection applicator target count={click_count}')
          if cycle_count != 1:
              raise SystemExit(f'cycle-selection applicator target count={cycle_count}')
          source = source.replace(old_call, new_call, 1)
          path.write_text(source)
          PY
          product_base="$(git rev-parse origin/$PRODUCT_BRANCH)"
          test -n "$product_base"
          echo "PRODUCT_BASE=$product_base" >> "$GITHUB_ENV"
          git checkout --detach "$product_base"
          test -z "$(git status --porcelain --untracked-files=all)"
          node /tmp/apply-pr793-memory-lens-redesign.mjs
          python3 - <<'PY'
          from pathlib import Path

          path = Path('urai-tier1/tests/lifemap-scene-behavior.test.mjs')
          source = path.read_text()
          old = """  assert.match(source, /:\s*80;\s*const \[texture, setTexture\] = useState<THREE\.CanvasTexture \| null>\(null\)/, 'Non-related memories must use the smallest allocation before commit-phase texture state.')
  assert.ok(source.includes('const nextTexture = createMemorySurface(node, textureResolution)'), 'Texture creation must occur inside the committed effect lifecycle.')
  assert.ok(source.includes('setTexture(nextTexture)'), 'Committed textures must enter React state only after creation.')
  assert.ok(source.includes('window.requestAnimationFrame(() => nextTexture?.dispose())'), 'Replaced textures must remain alive through the replacement commit and paint.')
  assert.doesNotMatch(source, /return \(\) => nextTexture\?\.dispose\(\)/, 'Texture cleanup must not dispose the previous texture synchronously before replacement paint.')
  assert.ok(source.includes('if (!/^[0-9a-f]{6}$/i.test(normalized))'), 'Invalid aura metadata must fall back before RGB bitwise conversion.')
  assert.ok(source.includes('return `rgba(138, 223, 255, ${alpha})`'), 'Invalid aura metadata must use the canonical cyan fallback.')
  assert.doesNotMatch(source, /useMemo\(\(\) => createMemorySurface/, 'CanvasTexture allocation must never occur during render.')
"""
          new = """  assert.match(source, /:\s*80;\s*const texture = useMemo\(\(\) => createMemorySurface\(node, textureResolution\)/, 'Non-related memories must retain the smallest allocation under synchronous texture ownership.')
  assert.ok(source.includes('const texture = useMemo(() => createMemorySurface(node, textureResolution), [node, textureResolution])'), 'Texture creation must be memoized by node and allocation tier.')
  assert.doesNotMatch(source, /setTexture\(|useState<THREE\.CanvasTexture \| null>/, 'Synchronous texture ownership must not use delayed React texture state.')
  assert.ok(source.includes('const dispose = () => texture?.dispose()'), 'Texture replacements must retain deterministic disposal ownership.')
  assert.ok(source.includes('window.requestAnimationFrame(dispose)'), 'Replaced textures must remain alive through the replacement paint.')
  assert.ok(source.includes('opacity={texture ? visibleOpacity : 0}'), 'Unavailable textures must remain transparent rather than exposing a white fallback.')
  assert.ok(source.includes('name="life-map-memory-lens-hit-target"'), 'Memory lenses must retain a stable transparent interaction target.')
  assert.ok(source.includes('if (!/^[0-9a-f]{6}$/i.test(normalized))'), 'Invalid aura metadata must fall back before RGB bitwise conversion.')
  assert.ok(source.includes('return `rgba(138, 223, 255, ${alpha})`'), 'Invalid aura metadata must use the canonical cyan fallback.')
  assert.match(source, /useMemo\(\(\) => createMemorySurface/, 'CanvasTexture allocation must use bounded synchronous memoization.')
"""
          if source.count(old) != 1:
              raise SystemExit(f'texture contract target count={source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/spatial/world/LifeMapIndependentInputBoundary.tsx urai-tier1/src/spatial/world/lifeMapConvergence.css urai-tier1/tests/accessibility-performance-embodied-exploration.spec.ts urai-tier1/tests/embodied-exploration-contract.test.mjs urai-tier1/tests/final-aaa-world-convergence-contract.test.mjs urai-tier1/tests/lifemap-scene-behavior.test.mjs | sort)"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Unit contracts
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm --dir urai-tier1 test 2>&1 | tee /tmp/pr793-memory-lens-unit.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm --dir urai-tier1 typecheck 2>&1 | tee /tmp/pr793-memory-lens-typecheck.log

      - name: Build exact static candidate
        shell: bash
        env:
          URAI_FIREBASE_STATIC_EXPORT: "true"
        run: |
          set -o pipefail
          corepack pnpm --dir urai-tier1 build 2>&1 | tee /tmp/pr793-memory-lens-build.log
          test -f urai-tier1/out/life-map/index.html

      - name: Install Chromium
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Verify Life Map interaction and accessibility regressions
        shell: bash
        run: |
          set -o pipefail
          corepack pnpm exec playwright test --config=playwright.accessibility.config.ts --project=chromium urai-tier1/tests/accessibility-performance-embodied-exploration.spec.ts urai-tier1/tests/accessibility-performance-lifemap-independent.spec.ts 2>&1 | tee /tmp/pr793-memory-lens-browser.log

      - name: Publish clean seven-file memory-lens redesign
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_BASE"
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/spatial/world/LifeMapIndependentInputBoundary.tsx urai-tier1/src/spatial/world/lifeMapConvergence.css urai-tier1/tests/accessibility-performance-embodied-exploration.spec.ts urai-tier1/tests/embodied-exploration-contract.test.mjs urai-tier1/tests/final-aaa-world-convergence-contract.test.mjs urai-tier1/tests/lifemap-scene-behavior.test.mjs | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(life-map): replace memory slabs with synchronous luminous lenses"
          git push --force-with-lease=refs/heads/$PRODUCT_BRANCH:$PRODUCT_BASE origin HEAD:refs/heads/$PRODUCT_BRANCH
          echo "product_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Retain exact memory-lens diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr793-memory-lens-r2-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: /tmp/pr793-memory-lens-*.log
          if-no-files-found: ignore
          retention-days: 90
