name: Privacy Controls Operational Verification

on:
  push:
    branches: [feat/privacy-consent-sanctuary-550-20260721]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: privacy-controls-local-proof-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  verify-and-capture:
    name: Exact-head local browser evidence without deployment credentials
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Assert exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          node --version
          test "$(node --version | cut -d. -f1 | tr -d v)" -ge 22
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - name: Install exact lockfile
        run: |
          corepack enable
          test "$(pnpm --version)" = "10.0.0"
          pnpm install --frozen-lockfile
      - name: Run privacy contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p privacy-controls-evidence
          node urai-tier1/tests/privacy-consent-sanctuary-contract.test.mjs 2>&1 | tee privacy-controls-evidence/privacy-contracts.log
      - name: Build privacy functions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p privacy-controls-evidence
          pnpm --dir apps/functions build 2>&1 | tee privacy-controls-evidence/functions-build.log
      - name: Build exact static candidate
        env:
          NEXT_PUBLIC_URAI_BUILD_SHA: ${{ env.EXACT_HEAD_SHA }}
          URAI_FIREBASE_STATIC_EXPORT: 'true'
        shell: bash
        run: |
          set -o pipefail
          pnpm build:static 2>&1 | tee privacy-controls-evidence/static-build.log
      - name: Serve exact static candidate locally
        shell: bash
        run: |
          set -euo pipefail
          test -f urai-tier1/out/privacy-controls/index.html
          python3 -m http.server 4175 --directory urai-tier1/out > privacy-local-server.log 2>&1 &
          echo $! > privacy-local-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4175/privacy-controls/ > local-privacy-controls.html; then
              break
            fi
            sleep 1
          done
          grep -q 'UrAi Consent Sanctuary' local-privacy-controls.html
          grep -q "$EXACT_HEAD_SHA" local-privacy-controls.html
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run local browser acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4175
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test tests/privacy-controls-browser-acceptance.spec.ts --config=playwright.config.ts 2>&1 | tee privacy-controls-evidence/browser-acceptance.log
      - name: Build exact evidence manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p privacy-controls-evidence
          cp -f privacy-local-server.log local-privacy-controls.html privacy-controls-evidence/ 2>/dev/null || true
          printf 'exact_sha=%s\nrun_id=%s\nworkflow=%s\nmode=local-no-secrets\nproduction_targeted=false\ncaptured_at=%s\n' \
            "$EXACT_HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_WORKFLOW" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > privacy-controls-evidence/manifest.txt
          evidence_paths=(privacy-controls-evidence)
          test -d test-results && evidence_paths+=(test-results)
          test -d playwright-report && evidence_paths+=(playwright-report)
          find "${evidence_paths[@]}" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > privacy-controls-evidence/SHA256SUMS
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: urai-privacy-controls-local-acceptance-${{ env.EXACT_HEAD_SHA }}
          path: |
            privacy-controls-evidence
            test-results
            playwright-report
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
