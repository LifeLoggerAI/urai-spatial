name: One-time final deploy review repairs

on:
  push:
    paths:
      - '.github/workflows/one-time-finalize-deploy-review-repairs.yml'

permissions:
  contents: write

concurrency:
  group: one-time-finalize-deploy-review-repairs
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/release/protected-rollback-authority-20260711-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/protected-rollback-authority-20260711-v2
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply exact reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one exact replacement, found {count}')
              file.write_text(source.replace(old, new))

          replace_exact(
              'scripts/live-release.mjs',
              "function isFirebaseIgnoredPath(relative) {\n  return path.posix.basename(relative).startsWith('.')\n}",
              "function isFirebaseIgnoredPath(relative) {\n  return relative.split('/').some((segment) => segment.startsWith('.'))\n}",
          )
          replace_exact(
              'scripts/live-release.mjs',
              'Release surface contains a Firebase-ignored dotfile:',
              'Release surface contains a Firebase-ignored dot path:',
          )
          replace_exact(
              'scripts/verify-release-credential-boundary.mjs',
              "let liveRollbackProvenanceVerified = false\nif (liveRollbackProvenanceRequired) {\n  await verifyLiveRollbackProvenance()\n  liveRollbackProvenanceVerified = true\n}",
              "let liveRollbackProvenanceVerified = false\nconst liveRollbackEvidenceDirectory = (process.env.RUNNER_TEMP || '').trim()\n  ? path.join((process.env.RUNNER_TEMP || '').trim(), 'urai-release-control-evidence')\n  : path.resolve('release-control-evidence')\nif (liveRollbackProvenanceRequired) {\n  await verifyLiveRollbackProvenance({ evidenceDirectory: liveRollbackEvidenceDirectory })\n  liveRollbackProvenanceVerified = true\n}",
          )
          replace_exact(
              'urai-tier1/tests/exact-static-release-contract.test.mjs',
              "    'downloadedBundleFingerprintBound',\n  ], 'credential boundary')",
              "    'downloadedBundleFingerprintBound',\n    'liveRollbackEvidenceDirectory',\n    'urai-release-control-evidence',\n    'verifyLiveRollbackProvenance({ evidenceDirectory: liveRollbackEvidenceDirectory })',\n  ], 'credential boundary')",
          )
          replace_exact(
              'urai-tier1/tests/exact-static-release-contract.test.mjs',
              "  assert.doesNotMatch(bundleBuilder, /path\\.posix\\.basename\\(relative\\)\\.startsWith\\('\\.'\\)/)\n  hasAll(credentialBoundary, [",
              "  assert.doesNotMatch(bundleBuilder, /path\\.posix\\.basename\\(relative\\)\\.startsWith\\('\\.'\\)/)\n  hasAll(operator, [\n    'isFirebaseIgnoredPath',\n    \"relative.split('/').some((segment) => segment.startsWith('.'))\",\n    'Release surface contains a Firebase-ignored dot path',\n  ], 'release operator')\n  assert.doesNotMatch(operator, /path\\.posix\\.basename\\(relative\\)\\.startsWith\\('\\.'\\)/)\n  hasAll(credentialBoundary, [",
          )

          Path('.github/workflows/one-time-finalize-deploy-review-repairs.yml').unlink()
          PY

      - name: Run focused release authority regressions
        shell: bash
        run: |
          set -euo pipefail
          node urai-tier1/tests/exact-static-release-contract.test.mjs
          node scripts/audit-production-workflow-authority.mjs
          test -z "$(git diff --check)"

      - name: Commit reviewed repairs and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/live-release.mjs scripts/verify-release-credential-boundary.mjs urai-tier1/tests/exact-static-release-contract.test.mjs .github/workflows/one-time-finalize-deploy-review-repairs.yml
          git diff --cached --check
          git commit -m 'Close final protected deploy review findings'
          git push origin HEAD:release/protected-rollback-authority-20260711-v2
