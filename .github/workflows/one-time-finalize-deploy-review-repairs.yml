name: One-time final deploy review repairs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/one-time-finalize-deploy-review-repairs.yml'

permissions:
  contents: write

concurrency:
  group: one-time-finalize-deploy-review-repairs-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'release/protected-rollback-authority-20260711-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/protected-rollback-authority-20260711-v2
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply exact reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              file = Path(path)
              source = file.read_text()
              count = source.count(old)
              print(f'{path}: replacement count={count}')
              if count < 1:
                  raise SystemExit(f'{path}: required source marker missing')
              file.write_text(source.replace(old, new, 1))

          replace_one(
              'scripts/live-release.mjs',
              "return path.posix.basename(relative).startsWith('.')",
              "return relative.split('/').some((segment) => segment.startsWith('.'))",
          )
          replace_one(
              'scripts/live-release.mjs',
              'Release surface contains a Firebase-ignored dotfile:',
              'Release surface contains a Firebase-ignored dot path:',
          )
          replace_one(
              'scripts/verify-release-credential-boundary.mjs',
              '  await verifyLiveRollbackProvenance()\n  liveRollbackProvenanceVerified = true',
              "  const evidenceDirectory = (process.env.RUNNER_TEMP || '').trim()\n    ? path.join((process.env.RUNNER_TEMP || '').trim(), 'urai-release-control-evidence')\n    : path.resolve('release-control-evidence')\n  await verifyLiveRollbackProvenance({ evidenceDirectory })\n  liveRollbackProvenanceVerified = true",
          )

          Path('urai-tier1/tests/final-protected-deploy-regressions.test.mjs').write_text("""import test from 'node:test'
import assert from 'node:assert/strict'
import { readFileSync } from 'node:fs'

const operator = readFileSync('scripts/live-release.mjs', 'utf8')
const credentialBoundary = readFileSync('scripts/verify-release-credential-boundary.mjs', 'utf8')

test('prebuilt release verification rejects every dot-prefixed path segment', () => {
  assert.match(operator, /relative\.split\('\/'\)\.some\(\(segment\) => segment\.startsWith\('\.'\)\)/)
  assert.doesNotMatch(operator, /path\.posix\.basename\(relative\)\.startsWith\('\.'\)/)
  assert.match(operator, /Firebase-ignored dot path/)
})

test('live rollback provenance evidence stays outside the authority checkout', () => {
  assert.match(credentialBoundary, /process\.env\.RUNNER_TEMP/)
  assert.match(credentialBoundary, /urai-release-control-evidence/)
  assert.match(credentialBoundary, /verifyLiveRollbackProvenance\(\{ evidenceDirectory \}\)/)
})
""")

          Path('.github/workflows/one-time-finalize-deploy-review-repairs.yml').unlink()
          PY

      - name: Run focused release authority regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/final-protected-deploy-regressions.test.mjs
          node urai-tier1/tests/exact-static-release-contract.test.mjs
          node scripts/audit-production-workflow-authority.mjs
          git diff --check

      - name: Commit reviewed repairs and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/live-release.mjs scripts/verify-release-credential-boundary.mjs urai-tier1/tests/final-protected-deploy-regressions.test.mjs .github/workflows/one-time-finalize-deploy-review-repairs.yml
          git diff --cached --check
          git commit -m 'Close final protected deploy review findings'
          git push origin HEAD:release/protected-rollback-authority-20260711-v2
