name: One-time Spatial 539 Codex repair

on:
  push:
    branches:
      - repair/spatial-539-codex-20260714
    paths:
      - .github/workflows/one-time-spatial-539-codex-repair.yml

permissions:
  contents: write

concurrency:
  group: one-time-spatial-539-codex-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'LifeLoggerAI/urai-spatial' && github.ref == 'refs/heads/repair/spatial-539-codex-20260714'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: repair/spatial-539-codex-20260714
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact clean repair source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = 'repair/spatial-539-codex-20260714'
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply exact reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function edit(file, transform) {
            const before = fs.readFileSync(file, 'utf8');
            const after = transform(before);
            if (after === before) throw new Error(`${file}: repair produced no change`);
            fs.writeFileSync(file, after);
          }

          for (const file of ['scripts/create-static-release-bundle.mjs', 'scripts/live-release.mjs']) {
            edit(file, (source) => {
              if (!source.includes("return path.posix.basename(relative).startsWith('.')")) throw new Error(`${file}: old dot-path predicate missing`);
              return source
                .replace("return path.posix.basename(relative).startsWith('.')", "return relative.split('/').some((segment) => segment.startsWith('.'))")
                .replace('Firebase-ignored dotfile:', 'Firebase-ignored dot path:');
            });
          }

          edit('.github/workflows/release-security-path-guard.yml', (source) => {
            const marker = "      - '.github/workflows/spatial-live-deploy.yml'";
            const count = source.split(marker).length - 1;
            if (count !== 2) throw new Error(`workflow guard: expected two path sections, found ${count}`);
            return source.split(marker).join("      - '.github/workflows/**'\n" + marker);
          });

          edit('scripts/verify-release-security-path-guard.mjs', (source) => {
            if (!source.includes("  '.github/workflows/spatial-live-deploy.yml',")) throw new Error('guard verifier workflow marker missing');
            return source
              .replace("  '.github/workflows/spatial-live-deploy.yml',", "  '.github/workflows/**',\n  '.github/workflows/spatial-live-deploy.yml',")
              .replace("schemaVersion: 'urai-release-security-path-guard-3'", "schemaVersion: 'urai-release-security-path-guard-4'");
          });

          edit('urai-tier1/tests/exact-static-release-contract.test.mjs', (source) => {
            const oldPredicate = "path.posix.basename(relative).startsWith('.')";
            const count = source.split(oldPredicate).length - 1;
            if (count !== 2) throw new Error(`static contract: expected two old predicate markers, found ${count}`);
            return source
              .split(oldPredicate).join("relative.split('/').some((segment) => segment.startsWith('.'))")
              .replaceAll('Firebase-ignored dotfile', 'Firebase-ignored dot path')
              .replace('assert.doesNotMatch(operator,', 'assert.match(operator,')
              .replace('assert.doesNotMatch(bundleBuilder,', 'assert.match(bundleBuilder,');
          });

          edit('docs/P0_VERIFICATION_CLOSURE_RUNBOOK.md', (source) => {
            const lines = source.split('\n');
            const rollbackInput = lines.findIndex((line) => line.includes('-f rollback_sha=<PROVEN_ROLLBACK_SHA>'));
            if (rollbackInput < 0) throw new Error('runbook rollback input marker missing');
            lines[rollbackInput] = lines[rollbackInput].replace('<PROVEN_ROLLBACK_SHA>', '<EXACT_CURRENT_MAIN_SHA>');
            const explanation = lines.findIndex((line) => line.startsWith('The workflow requires the rollback target to be a non-current ancestor'));
            if (explanation < 0) throw new Error('runbook rollback explanation missing');
            lines[explanation] = 'The workflow requires the rollback target to be a non-current ancestor of `main` and `rollback_sha` to be the exact current `main` recovery authority. It re-runs verification against the target, uses the protected production environment, deploys the exact ancestor, and repeats live smoke. Never perform rollback through a local Firebase command.';
            return lines.join('\n');
          });
          NODE

      - name: Remove one-time repair workflow
        run: rm .github/workflows/one-time-spatial-539-codex-repair.yml

      - name: Validate repaired release boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/create-static-release-bundle.mjs
          node --check scripts/live-release.mjs
          node --check scripts/verify-release-security-path-guard.mjs
          node scripts/verify-release-security-path-guard.mjs
          node urai-tier1/tests/exact-static-release-contract.test.mjs
          test "$(grep -F "'.github/workflows/**'" .github/workflows/release-security-path-guard.yml | wc -l)" -eq 2
          grep -F 'rollback_sha=<EXACT_CURRENT_MAIN_SHA>' docs/P0_VERIFICATION_CLOSURE_RUNBOOK.md
          test -z "$(git diff --check)"

      - name: Commit one atomic repair and push
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          staged="$(git diff --cached --name-only | sort)"
          printf '%s\n' "$staged"
          for required in \
            .github/workflows/one-time-spatial-539-codex-repair.yml \
            .github/workflows/release-security-path-guard.yml \
            docs/P0_VERIFICATION_CLOSURE_RUNBOOK.md \
            scripts/create-static-release-bundle.mjs \
            scripts/live-release.mjs \
            scripts/verify-release-security-path-guard.mjs \
            urai-tier1/tests/exact-static-release-contract.test.mjs; do
            printf '%s\n' "$staged" | grep -Fx "$required"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close final Spatial release review findings'
          git push origin HEAD:repair/spatial-539-codex-20260714
