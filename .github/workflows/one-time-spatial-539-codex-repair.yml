name: One-time Spatial 539 Codex repair

on:
  push:
    branches:
      - repair/spatial-539-codex-20260714
    paths:
      - .github/workflows/one-time-spatial-539-codex-repair.yml

permissions:
  contents: write

concurrency:
  group: one-time-spatial-539-codex-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'LifeLoggerAI/urai-spatial' && github.ref == 'refs/heads/repair/spatial-539-codex-20260714'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: repair/spatial-539-codex-20260714
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact clean repair source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = 'repair/spatial-539-codex-20260714'
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Apply exact reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(file, before, after, expected = 1) {
            const source = fs.readFileSync(file, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== expected) {
              throw new Error(`${file}: expected ${expected} occurrences, found ${count}: ${before}`);
            }
            fs.writeFileSync(file, source.split(before).join(after));
          }

          for (const file of ['scripts/create-static-release-bundle.mjs', 'scripts/live-release.mjs']) {
            replaceExact(
              file,
              "return path.posix.basename(relative).startsWith('.')",
              "return relative.split('/').some((segment) => segment.startsWith('.'))",
            );
          }

          replaceExact(
            'scripts/create-static-release-bundle.mjs',
            'Static output contains a Firebase-ignored dotfile:',
            'Static output contains a Firebase-ignored dot path:',
          );
          replaceExact(
            'scripts/live-release.mjs',
            'Release surface contains a Firebase-ignored dotfile:',
            'Release surface contains a Firebase-ignored dot path:',
          );

          const guardedWorkflowBlock = "      - '.github/workflows/spatial-live-deploy.yml'\n      - '.github/workflows/release-security-path-guard.yml'";
          replaceExact(
            '.github/workflows/release-security-path-guard.yml',
            guardedWorkflowBlock,
            "      - '.github/workflows/**'\n" + guardedWorkflowBlock,
            2,
          );

          replaceExact(
            'scripts/verify-release-security-path-guard.mjs',
            "  '.github/workflows/spatial-live-deploy.yml',\n  workflowRelativePath,",
            "  '.github/workflows/**',\n  '.github/workflows/spatial-live-deploy.yml',\n  workflowRelativePath,",
          );
          replaceExact(
            'scripts/verify-release-security-path-guard.mjs',
            "schemaVersion: 'urai-release-security-path-guard-3'",
            "schemaVersion: 'urai-release-security-path-guard-4'",
          );

          replaceExact(
            'urai-tier1/tests/exact-static-release-contract.test.mjs',
            "path.posix.basename(relative).startsWith('.')",
            "relative.split('/').some((segment) => segment.startsWith('.'))",
            2,
          );
          replaceExact(
            'urai-tier1/tests/exact-static-release-contract.test.mjs',
            'Release surface contains a Firebase-ignored dotfile',
            'Release surface contains a Firebase-ignored dot path',
          );
          replaceExact(
            'urai-tier1/tests/exact-static-release-contract.test.mjs',
            'Static output contains a Firebase-ignored dotfile',
            'Static output contains a Firebase-ignored dot path',
          );
          replaceExact(
            'urai-tier1/tests/exact-static-release-contract.test.mjs',
            'assert.doesNotMatch(operator,',
            'assert.match(operator,',
          );
          replaceExact(
            'urai-tier1/tests/exact-static-release-contract.test.mjs',
            'assert.doesNotMatch(bundleBuilder,',
            'assert.match(bundleBuilder,',
          );

          replaceExact(
            'docs/P0_VERIFICATION_CLOSURE_RUNBOOK.md',
            '  -f rollback_sha=<PROVEN_ROLLBACK_SHA> \\\n  -f confirm=ROLLBACK_URAI_APP',
            '  -f rollback_sha=<EXACT_CURRENT_MAIN_SHA> \\\n  -f confirm=ROLLBACK_URAI_APP',
          );
          replaceExact(
            'docs/P0_VERIFICATION_CLOSURE_RUNBOOK.md',
            'The workflow requires the rollback target to be a non-current ancestor of `main`, re-runs verification against that target, uses the protected production environment, deploys the exact ancestor, and repeats live smoke.',
            'The workflow requires the rollback target to be a non-current ancestor of `main` and `rollback_sha` to be the exact current `main` recovery authority. It re-runs verification against the target, uses the protected production environment, deploys the exact ancestor, and repeats live smoke.',
          );
          NODE

      - name: Remove one-time repair workflow
        run: rm .github/workflows/one-time-spatial-539-codex-repair.yml

      - name: Validate repaired release boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/create-static-release-bundle.mjs
          node --check scripts/live-release.mjs
          node --check scripts/verify-release-security-path-guard.mjs
          node scripts/verify-release-security-path-guard.mjs
          node urai-tier1/tests/exact-static-release-contract.test.mjs
          grep -F "'.github/workflows/**'" .github/workflows/release-security-path-guard.yml
          grep -F "rollback_sha=<EXACT_CURRENT_MAIN_SHA>" docs/P0_VERIFICATION_CLOSURE_RUNBOOK.md
          test -z "$(git diff --check)"

      - name: Commit one atomic repair and push
        shell: bash
        run: |
          set -euo pipefail
          git add \
            .github/workflows/release-security-path-guard.yml \
            .github/workflows/one-time-spatial-539-codex-repair.yml \
            docs/P0_VERIFICATION_CLOSURE_RUNBOOK.md \
            scripts/create-static-release-bundle.mjs \
            scripts/live-release.mjs \
            scripts/verify-release-security-path-guard.mjs \
            urai-tier1/tests/exact-static-release-contract.test.mjs
          mapfile -t changed < <(git diff --cached --name-only | sort)
          test "${#changed[@]}" -eq 7
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Close final Spatial release review findings'
          git push origin HEAD:repair/spatial-539-codex-20260714
