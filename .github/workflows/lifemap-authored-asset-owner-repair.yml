name: Life Map authored asset owner repair

on:
  push:
    branches:
      - fix/life-map-independent-final-0deeba-20260718

permissions:
  contents: write

concurrency:
  group: lifemap-authored-asset-owner-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify bounded repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a16fad8163443c44d33a0e41b191f4d2e62d722f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/lifemap-authored-asset-owner-repair.yml"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply authored-asset-first compositing repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          scene_path = Path('urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx')
          scene = scene_path.read_text()
          scene = replace_once(scene, '      <color attach="background" args={["#01030a"]} />\n', '', 'opaque scene background')
          scene = replace_once(
              scene,
              '        gl={{ antialias: stableCanvas.current.antialias, alpha: false, powerPreference: "high-performance" }}',
              '        gl={{ antialias: stableCanvas.current.antialias, alpha: true, powerPreference: "high-performance" }}',
              'transparent renderer',
          )
          marker = '    gl.shadowMap.enabled = profile.shadows;\n'
          if scene.count(marker) != 2:
              raise SystemExit(f'clear alpha: expected two renderer markers, found {scene.count(marker)}')
          scene = scene.replace(marker, marker + '    gl.setClearColor(0x01030a, 0);\n')
          scene = replace_once(
              scene,
              '      <div className="life-map-cosmic-wash" aria-hidden="true" />\n',
              '      <div className="life-map-authored-universe" aria-hidden="true" />\n      <div className="life-map-cosmic-wash" aria-hidden="true" />\n',
              'authored universe layer',
          )
          scene = replace_once(
              scene,
              '        <span>{narratorText}</span>\n',
              '        <span>{error && !usingSeedData ? "Your private memories are unavailable. No sample memories are shown." : narratorText}</span>\n',
              'private unavailable narration',
          )
          scene_path.write_text(scene)

          css_path = Path('urai-tier1/src/spatial/world/lifeMapConvergence.css')
          css = css_path.read_text()
          if '.life-map-authored-universe {' in css:
              raise SystemExit('Authored universe CSS already exists')
          css += '''\n\n/* Authored galaxy owns the visible frame. WebGL supplies transparent depth, stars, and interaction. */\n.life-map-authored-universe {\n  position: absolute;\n  inset: -2%;\n  z-index: 0;\n  pointer-events: none;\n  background-image:\n    linear-gradient(180deg, rgba(1, 3, 10, .08), rgba(1, 3, 10, .3)),\n    url('/assets/urai/life-map/life-map-galaxy-main.webp'),\n    url('/assets/urai/life-map/life-map-galaxy-fallback.svg');\n  background-size: cover, cover, cover;\n  background-position: center, center, center;\n  background-repeat: no-repeat;\n  filter: saturate(1.12) contrast(1.06) brightness(.78);\n  transform: scale(1.025);\n}\n\n.life-map-cosmic-wash {\n  z-index: 1;\n  opacity: .58;\n  mix-blend-mode: screen;\n}\n\n.life-map-independent-realm > canvas.life-map-canvas {\n  z-index: 2;\n  opacity: .9;\n  mix-blend-mode: screen;\n}\n\n.life-map-depth-vignette {\n  z-index: 3;\n  background:\n    linear-gradient(180deg, rgba(0, 0, 0, .18), transparent 18%, transparent 76%, rgba(0, 0, 0, .42)),\n    radial-gradient(ellipse at 50% 48%, transparent 0 51%, rgba(0, 0, 0, .54) 100%);\n}\n\n@media (max-width: 700px) {\n  .life-map-authored-universe {\n    inset: -1%;\n    background-image:\n      linear-gradient(180deg, rgba(1, 3, 10, .06), rgba(1, 3, 10, .26)),\n      url('/assets/urai/life-map/life-map-galaxy-mobile.webp'),\n      url('/assets/urai/life-map/life-map-galaxy-fallback.svg');\n    background-position: center, center, center;\n    filter: saturate(1.08) contrast(1.04) brightness(.82);\n    transform: scale(1.015);\n  }\n\n  .life-map-independent-realm > canvas.life-map-canvas {\n    opacity: .84;\n  }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .life-map-authored-universe { transform: none; }\n}\n'''
          css_path.write_text(css)

          contract_path = Path('urai-tier1/tests/lifemap-scene-behavior.test.mjs')
          contract = contract_path.read_text()
          anchor = "  assert.ok(source.includes('<Canvas'), 'Life Map must keep the true R3F canvas.')\n"
          replacement = anchor + "  assert.ok(source.includes('className=\"life-map-authored-universe\"'), 'The authored galaxy must own the visible frame.')\n  assert.ok(source.includes('alpha: true'), 'The WebGL field must remain transparent over the authored galaxy.')\n  assert.ok(source.includes('gl.setClearColor(0x01030a, 0)'), 'Renderer recovery must preserve transparent compositing.')\n  assert.ok(!source.includes('<color attach=\"background\"'), 'The R3F scene must not repaint an opaque background.')\n  assert.ok(source.includes('Your private memories are unavailable. No sample memories are shown.'), 'Unavailable private data must not tell users to select invisible stars.')\n  assert.ok(convergenceCss.includes('life-map-galaxy-main.webp'), 'Desktop authored galaxy asset must be visible.')\n  assert.ok(convergenceCss.includes('life-map-galaxy-mobile.webp'), 'Mobile authored galaxy crop must be visible.')\n  assert.ok(convergenceCss.includes('mix-blend-mode: screen'), 'Spatial depth must blend over, not obscure, the authored universe.')\n"
          contract = replace_once(contract, anchor, replacement, 'authored visual contracts')
          contract_path.write_text(contract)
          PY

          git diff --check
          node --test urai-tier1/tests/lifemap-scene-behavior.test.mjs
          pnpm --dir urai-tier1 run typecheck

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/lifemap-authored-asset-owner-repair.yml
          git add urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx \
                  urai-tier1/src/spatial/world/lifeMapConvergence.css \
                  urai-tier1/tests/lifemap-scene-behavior.test.mjs
          git commit -m 'Make authored Life Map galaxy the visible world owner'
          git push origin HEAD:fix/life-map-independent-final-0deeba-20260718
