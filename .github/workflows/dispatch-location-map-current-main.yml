name: RETIRED - Dispatch Location Map Current Main Once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse obsolete production dispatcher
        shell: bash
        run: |
          echo 'This legacy production dispatcher is retired and cannot launch production.' >&2
          echo 'Production mutation is manual-only through .github/workflows/spatial-governed-wif-deploy.yml after independent exact-head approval, merge, successful Governance, and separate deployment authorization.' >&2
          exit 1
