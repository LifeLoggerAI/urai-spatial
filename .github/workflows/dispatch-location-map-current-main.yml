name: Dispatch Location Map Current Main Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-location-map-current-main.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Dispatch protected current-main production and retain receipt
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'spatial-live-deploy.yml';
            const releaseSha = context.sha;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function readLiveFingerprint() {
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                try {
                  const response = await fetch(`https://urai.app/release-fingerprint.json?location_map_dispatch=${Date.now()}`, {
                    redirect: 'manual',
                    signal: AbortSignal.timeout(10_000),
                    headers: {
                      accept: 'application/json',
                      'cache-control': 'no-cache, no-store, max-age=0'
                    }
                  });
                  if (response.status !== 200) throw new Error(`HTTP ${response.status}`);
                  const body = await response.json();
                  if (body?.schemaVersion !== 'urai-release-fingerprint-1') {
                    throw new Error('Unexpected live fingerprint schema');
                  }
                  if (typeof body.releaseSha !== 'string' || !/^[0-9a-f]{40}$/i.test(body.releaseSha)) {
                    throw new Error('Invalid live fingerprint releaseSha');
                  }
                  return body;
                } catch (error) {
                  if (attempt === 5) throw error;
                  await sleep(attempt * 2_000);
                }
              }
              throw new Error('Live fingerprint unavailable');
            }

            async function listProtectedRuns() {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                branch: 'main',
                event: 'workflow_dispatch',
                per_page: 100
              });
              return response.data.workflow_runs;
            }

            const fingerprint = await readLiveFingerprint();
            const rollbackSha = fingerprint.releaseSha;

            if (rollbackSha === releaseSha) {
              const body = [
                '## Location Map protected production receipt',
                '',
                '- Canonical lane: PR #889 / issue #872',
                '- Evidence refresh: PR #988',
                `- Current main: \`${releaseSha}\``,
                `- Live fingerprint: \`${rollbackSha}\``,
                '- Result: already live; duplicate deployment refused'
              ].join('\n');
              await github.rest.issues.create({
                owner,
                repo,
                title: `Location Map production ${releaseSha.slice(0, 12)} — already live`,
                body
              });
              core.summary.addRaw(body).write();
              return;
            }

            const before = await listProtectedRuns();
            const excluded = new Set(before.filter((run) => run.head_sha === releaseSha).map((run) => run.id));

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: 'main',
              inputs: {
                release_sha: releaseSha,
                rollback_sha: rollbackSha,
                confirm: 'DEPLOY_URAI_APP'
              }
            });

            let run = null;
            for (let attempt = 0; attempt < 90 && !run; attempt += 1) {
              const runs = await listProtectedRuns();
              run = runs.find((candidate) => candidate.head_sha === releaseSha && !excluded.has(candidate.id)) || null;
              if (!run) await sleep(10_000);
            }
            if (!run) throw new Error(`No protected deployment run appeared for ${releaseSha}`);

            for (let attempt = 0; attempt < 240 && run.status !== 'completed'; attempt += 1) {
              await sleep(10_000);
              const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
              run = response.data;
            }
            if (run.status !== 'completed') throw new Error(`Protected deployment run ${run.id} did not complete`);

            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100
            });
            const jobs = jobsResponse.data.jobs;
            const body = [
              '## Location Map protected production receipt',
              '',
              '- Canonical lane: PR #889 / issue #872',
              '- Evidence refresh: PR #988',
              `- Released current main: \`${releaseSha}\``,
              `- Rollback authority: \`${rollbackSha}\``,
              `- Protected run: ${run.html_url}`,
              `- Conclusion: \`${run.conclusion || 'none'}\``,
              '',
              '### Jobs',
              ...jobs.map((job) => `- ${job.name}: ${job.status}/${job.conclusion || 'none'}`)
            ].join('\n');

            await github.rest.issues.create({
              owner,
              repo,
              title: `Location Map production ${releaseSha.slice(0, 12)} — ${run.conclusion || 'none'}`,
              body
            });
            core.summary.addRaw(body).write();

            if (run.conclusion !== 'success') {
              core.setFailed(`Protected production concluded ${run.conclusion}`);
            }
