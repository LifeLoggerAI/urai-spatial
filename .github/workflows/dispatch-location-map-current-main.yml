name: Dispatch Location Map Current Main Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-location-map-current-main.yml'

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Dispatch protected current-main production and retain receipt
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'spatial-live-deploy.yml';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function resolveCurrentMainSha() {
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              const sha = branch.data.commit.sha;
              if (typeof sha !== 'string' || !/^[0-9a-f]{40}$/i.test(sha)) {
                throw new Error(`Invalid current main SHA: ${sha}`);
              }
              return sha;
            }

            async function readLiveFingerprint() {
              for (let attempt = 1; attempt <= 5; attempt += 1) {
                try {
                  const response = await fetch(`https://urai.app/release-fingerprint.json?location_map_dispatch=${Date.now()}`, {
                    redirect: 'manual',
                    signal: AbortSignal.timeout(10_000),
                    headers: {
                      accept: 'application/json',
                      'cache-control': 'no-cache, no-store, max-age=0'
                    }
                  });
                  if (response.status !== 200) throw new Error(`HTTP ${response.status}`);
                  const body = await response.json();
                  if (body?.schemaVersion !== 'urai-release-fingerprint-1') {
                    throw new Error('Unexpected live fingerprint schema');
                  }
                  if (typeof body.releaseSha !== 'string' || !/^[0-9a-f]{40}$/i.test(body.releaseSha)) {
                    throw new Error('Invalid live fingerprint releaseSha');
                  }
                  return body;
                } catch (error) {
                  if (attempt === 5) throw error;
                  await sleep(attempt * 2_000);
                }
              }
              throw new Error('Live fingerprint unavailable');
            }

            async function listProtectedRuns() {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id,
                branch: 'main',
                event: 'workflow_dispatch',
                per_page: 100
              });
              return response.data.workflow_runs;
            }

            async function writeReceiptIssue(title, body) {
              const searched = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue in:title "${title}"`,
                per_page: 20
              });
              const existing = searched.data.items.find((item) => item.title === title) || null;
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                return existing.html_url;
              }
              const created = await github.rest.issues.create({ owner, repo, title, body });
              return created.data.html_url;
            }

            let releaseSha = await resolveCurrentMainSha();
            let fingerprint = await readLiveFingerprint();
            let rollbackSha = fingerprint.releaseSha;

            const confirmedMainSha = await resolveCurrentMainSha();
            if (confirmedMainSha !== releaseSha) {
              core.warning(`main advanced while preparing dispatch: ${releaseSha} -> ${confirmedMainSha}`);
              releaseSha = confirmedMainSha;
              fingerprint = await readLiveFingerprint();
              rollbackSha = fingerprint.releaseSha;
            }

            if (rollbackSha === releaseSha) {
              const body = [
                '## Location Map protected production receipt',
                '',
                '- Canonical lane: PR #889 / issue #872',
                '- Evidence refresh: PR #988',
                `- Current main: \`${releaseSha}\``,
                `- Live fingerprint: \`${rollbackSha}\``,
                '- Result: already live; duplicate deployment refused'
              ].join('\n');
              const title = `Location Map production ${releaseSha.slice(0, 12)} — already live`;
              const issueUrl = await writeReceiptIssue(title, body);
              core.notice(`Retained receipt: ${issueUrl}`);
              core.summary.addRaw(body).write();
              return;
            }

            const finalMainSha = await resolveCurrentMainSha();
            if (finalMainSha !== releaseSha) {
              throw new Error(`main advanced immediately before dispatch: ${releaseSha} -> ${finalMainSha}; refusing stale deployment`);
            }

            const before = await listProtectedRuns();
            const excludedRunIds = new Set(before.map((candidate) => candidate.id));

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id,
              ref: 'main',
              inputs: {
                release_sha: releaseSha,
                rollback_sha: rollbackSha,
                confirm: 'DEPLOY_URAI_APP'
              }
            });

            let run = null;
            for (let attempt = 0; attempt < 180 && !run; attempt += 1) {
              await sleep(5_000);
              const listed = await listProtectedRuns();
              run = listed.find((candidate) =>
                candidate.head_sha === releaseSha &&
                !excludedRunIds.has(candidate.id)
              ) || null;
            }
            if (!run) throw new Error(`No new protected DEPLOY_URAI_APP run appeared for ${releaseSha}`);

            for (let attempt = 0; attempt < 2040 && run.status !== 'completed'; attempt += 1) {
              await sleep(10_000);
              const response = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: run.id });
              run = response.data;
            }
            if (run.status !== 'completed') {
              throw new Error(`Protected deployment run ${run.id} did not complete within the bounded 340-minute receipt window`);
            }

            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              filter: 'latest',
              per_page: 100
            });
            const jobs = jobsResponse.data.jobs;
            const body = [
              '## Location Map protected production receipt',
              '',
              '- Canonical lane: PR #889 / issue #872',
              '- Evidence refresh: PR #988',
              `- Released current main: \`${releaseSha}\``,
              `- Rollback authority: \`${rollbackSha}\``,
              '- Dispatch identity: newly created by this dispatcher after snapshotting all prior workflow run IDs',
              `- Protected run: ${run.html_url}`,
              `- Conclusion: \`${run.conclusion || 'none'}\``,
              '',
              '### Jobs',
              ...jobs.map((job) => `- ${job.name}: ${job.status}/${job.conclusion || 'none'}`)
            ].join('\n');

            const title = `Location Map production ${releaseSha.slice(0, 12)} — ${run.conclusion || 'none'}`;
            const issueUrl = await writeReceiptIssue(title, body);
            core.notice(`Retained receipt: ${issueUrl}`);
            core.summary.addRaw(body).write();

            if (run.conclusion !== 'success') {
              core.setFailed(`Protected production concluded ${run.conclusion}`);
            }
