name: One-time legacy bootstrap dispatch

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-legacy-bootstrap-dispatch.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-legacy-bootstrap-dispatch.yml'

permissions:
  contents: read

concurrency:
  group: one-time-legacy-bootstrap-dispatch
  cancel-in-progress: false

env:
  RECOVERY_SHA: 2b2a0f62984767554de5031c85e5e92b0b26776d
  CANONICAL_WORKFLOW: spatial-live-deploy.yml
  CONFIRMATION: BOOTSTRAP_LEGACY_URAI_APP

jobs:
  verify-dispatch-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact dispatcher candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean dispatcher candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$RECOVERY_SHA" "$EXPECTED_SHA"
      - name: Prove dispatcher is not a deployment authority
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-production-workflow-authority.mjs
          node scripts/verify-production-action-pins.mjs
          ! grep -Eq 'live-release\.mjs --deploy-prebuilt|firebase(-tools)?[^\n]* deploy|pnpm live:deploy' .github/workflows/one-time-legacy-bootstrap-dispatch.yml
      - name: Verify immutable dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RECOVERY_SHA: 2b2a0f62984767554de5031c85e5e92b0b26776d' .github/workflows/one-time-legacy-bootstrap-dispatch.yml
          grep -Fq 'CANONICAL_WORKFLOW: spatial-live-deploy.yml' .github/workflows/one-time-legacy-bootstrap-dispatch.yml
          grep -Fq 'CONFIRMATION: BOOTSTRAP_LEGACY_URAI_APP' .github/workflows/one-time-legacy-bootstrap-dispatch.yml
          grep -Fq "actions: write" .github/workflows/one-time-legacy-bootstrap-dispatch.yml
          test -z "$(git status --porcelain --untracked-files=all)"

  dispatch-protected-bootstrap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact merged dispatcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Prove exact main identity and one-file merge
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RECOVERY_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$RECOVERY_SHA" != "$GITHUB_SHA"
          git merge-base --is-ancestor "$RECOVERY_SHA" "$GITHUB_SHA"
          if git rev-parse "$GITHUB_SHA^2" >/dev/null 2>&1; then
            changed="$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA")"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          fi
          test "$changed" = '.github/workflows/one-time-legacy-bootstrap-dispatch.yml'
      - name: Request canonical protected bootstrap
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/legacy-bootstrap-dispatch"
          mkdir -p "$receipt_dir"
          payload="$receipt_dir/request.json"
          response="$receipt_dir/response.txt"
          node - <<'NODE' > "$payload"
          const payload = {
            ref: 'main',
            inputs: {
              release_sha: process.env.GITHUB_SHA,
              rollback_sha: process.env.RECOVERY_SHA,
              confirm: process.env.CONFIRMATION,
            },
          }
          process.stdout.write(`${JSON.stringify(payload)}\n`)
          NODE
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${CANONICAL_WORKFLOW}/dispatches" \
            --data-binary "@$payload")"
          test "$status" = '204'
          cat > "$receipt_dir/receipt.json" <<EOF
          {
            "schemaVersion": "urai-one-time-bootstrap-dispatch-1",
            "requestedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "$GITHUB_REPOSITORY",
            "dispatcherWorkflow": "$GITHUB_WORKFLOW",
            "dispatcherRunId": "$GITHUB_RUN_ID",
            "dispatcherSha": "$GITHUB_SHA",
            "targetWorkflow": "$CANONICAL_WORKFLOW",
            "releaseSha": "$GITHUB_SHA",
            "recoverySha": "$RECOVERY_SHA",
            "confirmation": "$CONFIRMATION",
            "httpStatus": $status,
            "productionMutationAttemptedByDispatcher": false
          }
          EOF
          echo "receipt_dir=$receipt_dir" >> "$GITHUB_OUTPUT"
      - name: Upload dispatch receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: legacy-bootstrap-dispatch-${{ github.sha }}
          path: ${{ steps.dispatch.outputs.receipt_dir }}
          if-no-files-found: error
          retention-days: 365
