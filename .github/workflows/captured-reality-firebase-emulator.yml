name: Captured Reality Firebase Auth and Mesh Emulator Proof (Non-release)
on:
  pull_request:
    paths:
      - '.github/workflows/captured-reality-firebase-emulator.yml'
      - 'scripts/prove-captured-reality-firebase-emulator.mjs'
      - 'apps/functions/src/capturedReality.ts'
      - 'apps/functions/src/index.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: captured-reality-firebase-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-firebase-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GCLOUD_PROJECT: demo-urai-hybrid-proof
      FIREBASE_STORAGE_BUCKET: demo-urai-hybrid-proof.appspot.com
      URAI_ENABLE_CAPTURED_REALITY: 'true'
      URAI_ENABLE_CAPTURED_REALITY_PROOF: 'true'
      URAI_ENABLE_CAPTURED_REALITY_MESH: 'true'
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      FUNCTIONS_EMULATOR: 'true'
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked repo and compile actual Functions
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter urai-functions build
      - name: Execute actual Auth, Firestore, Storage and Functions emulators
        run: |
          pnpm exec firebase emulators:exec --project demo-urai-hybrid-proof --only auth,firestore,storage,functions --config firebase.json 'node scripts/prove-captured-reality-firebase-emulator.mjs'
      - name: Retain redacted test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: captured-reality-firebase-emulator-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/captured-reality-firebase-emulator/receipt.json
          retention-days: 30
          if-no-files-found: warn
