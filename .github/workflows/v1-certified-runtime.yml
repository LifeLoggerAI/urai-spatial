name: V1 Certified Runtime Handoff

on:
  pull_request:
    paths:
      - scripts/assets/verify-v1-certified-runtime.py
      - scripts/assets/run-v1-certified-runtime.py
      - scripts/assets/build-v1-certified-runtime-ledger.py
      - scripts/assets/integrate-v1-certified-runtime.py
      - scripts/assets/sync-v1-certified-handoff-manifest.py
      - .github/workflows/v1-certified-runtime.yml
      - urai-tier1/public/assets/urai/**
      - urai-tier1/src/spatial/assets/uraiAssets.ts
  push:
    branches: [main]
    paths:
      - scripts/assets/verify-v1-certified-runtime.py
      - scripts/assets/run-v1-certified-runtime.py
      - scripts/assets/build-v1-certified-runtime-ledger.py
      - scripts/assets/integrate-v1-certified-runtime.py
      - scripts/assets/sync-v1-certified-handoff-manifest.py
      - .github/workflows/v1-certified-runtime.yml
      - urai-tier1/public/assets/urai/**
      - urai-tier1/src/spatial/assets/uraiAssets.ts

permissions:
  actions: read
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install image verifier
        run: python -m pip install 'Pillow>=10,<12'
      - name: Download immutable V1 source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/source/v1-original artifacts/source/v1-recovery artifacts/assets
          gh api /repos/LifeLoggerAI/asset-factory/actions/artifacts/8741010314/zip > /tmp/v1-original.zip
          gh api /repos/LifeLoggerAI/asset-factory/actions/artifacts/8742902079/zip > /tmp/v1-recovery.zip
          test "$(sha256sum /tmp/v1-recovery.zip | cut -d' ' -f1)" = 'd42a4549fd5ebd90a761ced87a72d6765de6bb56403055af5c9cec8bda6ed731'
          unzip -q /tmp/v1-original.zip -d artifacts/source/v1-original
          unzip -q /tmp/v1-recovery.zip -d artifacts/source/v1-recovery
      - name: Rebuild immutable 53-row V1 ledger
        run: |
          python scripts/assets/build-v1-certified-runtime-ledger.py \
            --original-root artifacts/source/v1-original \
            --recovery-root artifacts/source/v1-recovery \
            --output artifacts/assets/v1-certified-runtime-ledger.json
      - name: Validate rebuilt V1 ledger
        run: python scripts/assets/run-v1-certified-runtime.py --self-test
      - name: Integrate certified V1 files and synchronize authorities
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          source_root='artifacts/assets/v1-ledger-webp-staging/assets/urai'
          target_root='urai-tier1/public/assets/urai'
          manifest='urai-tier1/public/assets/urai/final/manifests/asset-factory-spatial-handoff.json'
          test -d "$source_root"
          test "$(find "$source_root" -type f -name '*.webp' | wc -l | tr -d ' ')" = '53'
          mkdir -p "$target_root"
          cp -a "$source_root"/. "$target_root"/
          python scripts/assets/run-v1-certified-runtime.py
          python scripts/assets/sync-v1-certified-handoff-manifest.py \
            --repo-root . \
            --ledger artifacts/assets/v1-certified-runtime-ledger.json \
            --manifest "$manifest"
          node scripts/reconcile-asset-pack-independent-ledger.mjs --check \
            --out artifacts/assets/v1-independent-ledger.json \
            --csv artifacts/assets/v1-independent-ledger.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/public/assets/urai "$manifest"
          if git diff --cached --quiet; then
            echo 'Certified V1 runtime and authorities already synchronized.'
          else
            git commit -m 'Synchronize certified V1 runtime authorities'
            git push origin "HEAD:${{ github.head_ref }}"
          fi
      - name: Compare certified V1 handoff with runtime
        run: python scripts/assets/run-v1-certified-runtime.py
      - name: Prove zero-spend boundary
        run: |
          set -euo pipefail
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ASSET_RENDERER_API_KEY:-}"
      - name: Upload exact per-asset receipt and immutable ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-certified-runtime-${{ github.run_id }}
          path: |
            artifacts/assets/v1-runtime-certification.json
            artifacts/assets/v1-certified-runtime-ledger.json
            artifacts/assets/v1-independent-ledger.json
            artifacts/assets/v1-independent-ledger.csv
          if-no-files-found: warn
          retention-days: 90
