name: V1 Certified Runtime Handoff

on:
  pull_request:
    paths:
      - scripts/assets/verify-v1-certified-runtime.py
      - scripts/assets/run-v1-certified-runtime.py
      - scripts/assets/build-v1-certified-runtime-ledger.py
      - .github/workflows/v1-certified-runtime.yml
      - urai-tier1/public/assets/urai/**
      - urai-tier1/src/spatial/assets/uraiAssets.ts
  push:
    branches: [main]
    paths:
      - scripts/assets/verify-v1-certified-runtime.py
      - scripts/assets/run-v1-certified-runtime.py
      - scripts/assets/build-v1-certified-runtime-ledger.py
      - .github/workflows/v1-certified-runtime.yml
      - urai-tier1/public/assets/urai/**
      - urai-tier1/src/spatial/assets/uraiAssets.ts

permissions:
  actions: read
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact clean candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install image verifier
        run: python -m pip install 'Pillow>=10,<12'
      - name: Download immutable V1 source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/source/v1-original artifacts/source/v1-recovery artifacts/assets
          gh api /repos/LifeLoggerAI/asset-factory/actions/artifacts/8741010314/zip > /tmp/v1-original.zip
          gh api /repos/LifeLoggerAI/asset-factory/actions/artifacts/8742902079/zip > /tmp/v1-recovery.zip
          unzip -q /tmp/v1-original.zip -d artifacts/source/v1-original
          unzip -q /tmp/v1-recovery.zip -d artifacts/source/v1-recovery
      - name: Rebuild immutable 53-row V1 ledger
        run: |
          python scripts/assets/build-v1-certified-runtime-ledger.py \
            --original-root artifacts/source/v1-original \
            --recovery-root artifacts/source/v1-recovery \
            --output artifacts/assets/v1-certified-runtime-ledger.json
      - name: Validate rebuilt V1 ledger
        run: python scripts/assets/run-v1-certified-runtime.py --self-test
      - name: Compare certified V1 handoff with runtime
        run: python scripts/assets/run-v1-certified-runtime.py
      - name: Upload exact per-asset receipt and immutable ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-certified-runtime-${{ github.run_id }}
          path: |
            artifacts/assets/v1-runtime-certification.json
            artifacts/assets/v1-certified-runtime-ledger.json
          if-no-files-found: warn
          retention-days: 90
