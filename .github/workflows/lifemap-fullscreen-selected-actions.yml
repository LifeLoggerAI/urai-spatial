name: Life Map fullscreen selected actions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/lifemap-fullscreen-selected-actions.yml
      - scripts/one-shot-lifemap-fullscreen-selected-actions.mjs

permissions:
  contents: write

concurrency:
  group: lifemap-fullscreen-selected-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  SOURCE_BRANCH: product/canonical-seven-fix-clean-r3-20260718
  NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'

jobs:
  repair-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'product/canonical-seven-fix-clean-r3-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact canonical head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply bounded fullscreen portal repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -z "$(git status --porcelain --untracked-files=all)"
          node scripts/one-shot-lifemap-fullscreen-selected-actions.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx \
            urai-tier1/src/spatial/world/lifeMapSelectedCinematic.css \
            urai-tier1/tests/final-aaa-world-convergence-contract.test.mjs \
            urai-tier1/tests/lifemap-deep-link-controls-contract.test.mjs | sort)"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Run full source contracts
        shell: bash
        run: corepack pnpm --dir urai-tier1 test

      - name: Typecheck exact repair
        shell: bash
        run: corepack pnpm --dir urai-tier1 typecheck

      - name: Build exact static candidate
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm build:static
          test -f urai-tier1/out/life-map/index.html
          test -f urai-tier1/out/focus/index.html

      - name: Install Chromium
        run: corepack pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Run and retain exact accessibility regressions
        id: a11y
        shell: bash
        run: |
          set +e
          corepack pnpm exec playwright test \
            --config=playwright.accessibility.config.ts \
            accessibility-performance-evidence.spec.ts \
            accessibility-performance-lifemap-independent.spec.ts \
            --project=chromium \
            --reporter=json \
            > /tmp/lifemap-fullscreen-a11y.json \
            2> /tmp/lifemap-fullscreen-a11y.stderr.log
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "$status" > /tmp/lifemap-fullscreen-a11y.status
          exit 0

      - name: Summarize accessibility result
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const reportPath = '/tmp/lifemap-fullscreen-a11y.json'
          const summaryPath = '/tmp/lifemap-fullscreen-a11y-summary.json'
          const failures = []
          try {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'))
            const walk = (suite, parents = []) => {
              const nextParents = suite.title ? [...parents, suite.title] : parents
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  for (const result of test.results || []) {
                    if (!['passed', 'skipped'].includes(result.status)) {
                      failures.push({
                        title: [...nextParents, spec.title, test.title].filter(Boolean).join(' > '),
                        file: spec.file || '',
                        line: spec.line || 0,
                        status: result.status,
                        error: result.error?.message || result.errors?.[0]?.message || '',
                      })
                    }
                  }
                }
              }
              for (const child of suite.suites || []) walk(child, nextParents)
            }
            for (const suite of report.suites || []) walk(suite)
            const summary = {
              status: Number(fs.readFileSync('/tmp/lifemap-fullscreen-a11y.status', 'utf8').trim()),
              failures,
              stats: report.stats || null,
            }
            fs.writeFileSync(summaryPath, JSON.stringify(summary, null, 2))
            console.log(JSON.stringify(summary, null, 2))
          } catch (error) {
            const summary = { status: 1, failures: [], parseError: String(error) }
            fs.writeFileSync(summaryPath, JSON.stringify(summary, null, 2))
            console.error(JSON.stringify(summary, null, 2))
          }
          NODE

      - name: Require accessibility regressions
        if: steps.a11y.outputs.status != '0'
        shell: bash
        run: |
          cat /tmp/lifemap-fullscreen-a11y-summary.json
          exit 1

      - name: Start exact static server
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > /tmp/lifemap-fullscreen-http.log 2>&1 &
          echo $! > /tmp/lifemap-fullscreen-http.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/life-map/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/lifemap-fullscreen-http.log
          exit 1

      - name: Run exact visual proof
        shell: bash
        run: |
          set -euo pipefail
          URAI_PROOF_BASE=http://127.0.0.1:4173 \
          URAI_PROOF_DIR=/tmp/lifemap-fullscreen-visual \
          URAI_EXACT_HEAD="${{ github.event.pull_request.head.sha }}" \
            node scripts/run-continuous-spatial-proof-fixed.mjs

      - name: Run and retain exact AAA interaction audit
        id: aaa
        shell: bash
        run: |
          set +e
          URAI_VISUAL_AUDIT_BASE=http://127.0.0.1:4173 \
          URAI_VISUAL_AUDIT_DIR=/tmp/lifemap-fullscreen-audit \
            node scripts/run-live-visual-audit-current.mjs \
            > /tmp/lifemap-fullscreen-aaa.stdout.log \
            2> /tmp/lifemap-fullscreen-aaa.stderr.log
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "$status" > /tmp/lifemap-fullscreen-aaa.status
          exit 0

      - name: Summarize AAA audit result
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const summary = {
            status: Number(fs.readFileSync('/tmp/lifemap-fullscreen-aaa.status', 'utf8').trim()),
            stdoutTail: fs.existsSync('/tmp/lifemap-fullscreen-aaa.stdout.log')
              ? fs.readFileSync('/tmp/lifemap-fullscreen-aaa.stdout.log', 'utf8').split('\n').slice(-160).join('\n')
              : '',
            stderrTail: fs.existsSync('/tmp/lifemap-fullscreen-aaa.stderr.log')
              ? fs.readFileSync('/tmp/lifemap-fullscreen-aaa.stderr.log', 'utf8').split('\n').slice(-160).join('\n')
              : '',
            auditFiles: fs.existsSync('/tmp/lifemap-fullscreen-audit')
              ? fs.readdirSync('/tmp/lifemap-fullscreen-audit', { recursive: true }).map(String).sort()
              : [],
          }
          fs.writeFileSync('/tmp/lifemap-fullscreen-aaa-summary.json', JSON.stringify(summary, null, 2))
          console.log(JSON.stringify(summary, null, 2))
          NODE

      - name: Require AAA interaction audit
        if: steps.aaa.outputs.status != '0'
        shell: bash
        run: |
          cat /tmp/lifemap-fullscreen-aaa-summary.json
          exit 1

      - name: Publish clean canonical product commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/lifemap-fullscreen-selected-actions.yml scripts/one-shot-lifemap-fullscreen-selected-actions.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(life-map): stabilize selected actions in fullscreen DOM"
          git push origin HEAD:refs/heads/$SOURCE_BRANCH

      - name: Retain fullscreen portal proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemap-fullscreen-selected-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}
          path: |
            /tmp/lifemap-fullscreen-http.log
            /tmp/lifemap-fullscreen-visual
            /tmp/lifemap-fullscreen-audit
            /tmp/lifemap-fullscreen-a11y.json
            /tmp/lifemap-fullscreen-a11y.stderr.log
            /tmp/lifemap-fullscreen-a11y.status
            /tmp/lifemap-fullscreen-a11y-summary.json
            /tmp/lifemap-fullscreen-aaa.stdout.log
            /tmp/lifemap-fullscreen-aaa.stderr.log
            /tmp/lifemap-fullscreen-aaa.status
            /tmp/lifemap-fullscreen-aaa-summary.json
            urai-tier1/test-results
          if-no-files-found: ignore
          retention-days: 90
