name: URAI Spatial Release Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'urai-tier1/**'
      - 'apps/functions/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'firebase/**'
      - 'firebase.json'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release-readiness.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'urai-tier1/**'
      - 'apps/functions/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'firebase/**'
      - 'firebase.json'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release-readiness.yml'
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Optional deployed base URL for live smoke checks'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify static release contract
        run: pnpm lock:static

      - name: Verify build release contract
        run: pnpm lock:build

      - name: Verify XR contract
        run: pnpm xr:verify

      - name: Build static Firebase export
        run: pnpm build:static

      - name: Verify live smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_url != '' }}
        env:
          URAI_LIVE_URL: ${{ inputs.live_url }}
          BASE_URL: ${{ inputs.live_url }}
        run: pnpm smoke:live
