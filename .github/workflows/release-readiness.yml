name: URAI Spatial Release Readiness

on:
  push:
    branches:
      - main
    paths:
      - 'urai-tier1/**'
      - 'apps/functions/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'firebase/**'
      - 'firebase.json'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release-readiness.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'urai-tier1/**'
      - 'apps/functions/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'firebase/**'
      - 'firebase.json'
      - 'firebase.static.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release-readiness.yml'
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Optional deployed base URL for live smoke checks'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: urai-spatial-release-readiness-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0
        with:
          version: '10.0.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove install preserved exact source
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify static release contract
        run: pnpm lock:static

      - name: Verify build release contract
        run: pnpm lock:build

      - name: Verify XR contract
        run: pnpm xr:verify

      - name: Capture static Firebase export
        id: static_build
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p artifacts/release-readiness
          pnpm build:static 2>&1 | tee artifacts/release-readiness/static-firebase-export.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/release-readiness/static-firebase-export-exit-code.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload static export diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spatial-release-readiness-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}
          path: artifacts/release-readiness
          if-no-files-found: error
          # Public-repository GitHub artifact retention is capped at 90 days.
          # Longer-lived evidence requires a separately verified durable archive.
          retention-days: 90

      - name: Enforce static Firebase export
        shell: bash
        run: test "${{ steps.static_build.outputs.status }}" = "0"

      - name: Remove retained diagnostics
        if: always()
        run: rm -rf artifacts

      - name: Verify live smoke
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_url != '' }}
        env:
          URAI_DEPLOY_URL: ${{ inputs.live_url }}
        run: pnpm smoke:live

      - name: Reject tracked mutation and remove generated output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          git diff --exit-code
          git diff --cached --exit-code
          git status --short --untracked-files=all
          git clean -fdx
          test -z "$(git status --porcelain --untracked-files=all)"
