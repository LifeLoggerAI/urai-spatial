name: V1 Firebase Error Report

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1-firebase-error-report.yml
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const jobId = 84898607871;
            const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
              owner,
              repo,
              job_id: jobId
            });
            let text = response.data;
            if (Buffer.isBuffer(text)) text = text.toString('utf8');
            else if (text instanceof ArrayBuffer) text = Buffer.from(text).toString('utf8');
            else if (ArrayBuffer.isView(text)) text = Buffer.from(text.buffer, text.byteOffset, text.byteLength).toString('utf8');
            else if (typeof text !== 'string') text = JSON.stringify(text);
            const lines = text.split(/\r?\n/);
            const selected = [];
            const pattern = /firebase|hosting|error|failed|failure|token|auth|permission|denied|credential|expired|project/i;
            for (let index = 0; index < lines.length; index += 1) {
              if (!pattern.test(lines[index])) continue;
              const start = Math.max(0, index - 2);
              const end = Math.min(lines.length, index + 3);
              selected.push(...lines.slice(start, end));
            }
            const concise = [...new Set(selected)].slice(-120).join('\n');
            await github.rest.issues.create({
              owner,
              repo,
              title: `V1 Firebase concise error ${jobId}`,
              body: ['```text', concise || 'No matching Firebase error lines found.', '```'].join('\n')
            });
