name: V1 Audit Error Report

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v1-firebase-error-report.yml
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const jobId = 84901242996;
            const response = await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {
              owner,
              repo,
              job_id: jobId
            });
            let text = response.data;
            if (Buffer.isBuffer(text)) text = text.toString('utf8');
            else if (text instanceof ArrayBuffer) text = Buffer.from(text).toString('utf8');
            else if (ArrayBuffer.isView(text)) text = Buffer.from(text.buffer, text.byteOffset, text.byteLength).toString('utf8');
            else if (typeof text !== 'string') text = JSON.stringify(text);
            const marker = 'Machine image and structural gates';
            const index = text.lastIndexOf(marker);
            const section = (index >= 0 ? text.slice(index) : text.slice(-9000)).slice(0, 9000);
            await github.rest.issues.create({
              owner,
              repo,
              title: `V1 final machine gate ${jobId}`,
              body: ['```text', section, '```'].join('\n')
            });
