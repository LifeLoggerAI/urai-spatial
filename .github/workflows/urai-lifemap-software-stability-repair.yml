name: URAI Life Map software stability repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/urai-lifemap-software-stability-repair.yml

permissions:
  contents: write

concurrency:
  group: urai-lifemap-software-stability-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'reconcile/lifemap-current-main-20260817' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: reconcile/lifemap-current-main-20260817
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply bounded software-renderer stability repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scene_path = Path('urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx')
          wrapper_path = Path('urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx')
          scene = scene_path.read_text()
          wrapper = wrapper_path.read_text()

          renderer_fn = '''function isSoftwareWebGLRenderer(gl: THREE.WebGLRenderer) {
            const context = gl.getContext();
            const debugInfo = context.getExtension("WEBGL_debug_renderer_info") as { UNMASKED_RENDERER_WEBGL?: number } | null;
            const renderer = debugInfo?.UNMASKED_RENDERER_WEBGL
              ? context.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL)
              : context.getParameter(context.RENDERER);
            return /swiftshader|llvmpipe|lavapipe|software/i.test(String(renderer || ""));
          }
          '''
          governor_fn = renderer_fn + '''
          function SoftwareRendererCadence({ active, documentVisible }: { active: boolean; documentVisible: boolean }) {
            const { invalidate, setFrameloop } = useThree();
            useEffect(() => {
              if (!active) {
                setFrameloop(documentVisible ? "always" : "never");
                return;
              }
              if (!documentVisible) {
                setFrameloop("never");
                return;
              }

              // SwiftShader/software WebGL must remain truly 3D without monopolizing the main thread.
              // Bootstrap several real frames for render proof, then sustain a bounded 10 FPS cadence.
              setFrameloop("demand");
              let disposed = false;
              const bootstrap = [0, 40, 80, 120, 180, 260].map((delay) => window.setTimeout(() => {
                if (!disposed) invalidate();
              }, delay));
              const interval = window.setInterval(() => {
                if (!disposed) invalidate();
              }, 100);
              return () => {
                disposed = true;
                bootstrap.forEach((timer) => window.clearTimeout(timer));
                window.clearInterval(interval);
              };
            }, [active, documentVisible, invalidate, setFrameloop]);
            return null;
          }
          '''
          if scene.count(renderer_fn) != 1:
              raise SystemExit('Expected exactly one software renderer detector')
          scene = scene.replace(renderer_fn, governor_fn, 1)

          canvas_anchor = '''    >
              <WebGLRecoveryBridge onStateChange={setWebglState} />
              <Suspense fallback={null}>'''
          canvas_replacement = '''    >
              <SoftwareRendererCadence active={softwareRenderer} documentVisible={profile.documentVisible} />
              <WebGLRecoveryBridge onStateChange={setWebglState} />
              <Suspense fallback={null}>'''
          if scene.count(canvas_anchor) != 1:
              raise SystemExit('Expected exactly one Life Map Canvas child anchor')
          scene = scene.replace(canvas_anchor, canvas_replacement, 1)

          data_anchor = '    data-software-renderer={softwareRenderer ? "true" : "false"}\n'
          data_replacement = data_anchor + '    data-software-render-cadence={softwareRenderer ? "bounded-demand-10fps" : "continuous"}\n'
          if scene.count(data_anchor) != 1:
              raise SystemExit('Expected exactly one software renderer data attribute')
          scene = scene.replace(data_anchor, data_replacement, 1)

          probe_old = '''      const canvas = document.createElement("canvas");
                const context = canvas.getContext("webgl2") || canvas.getContext("webgl");
                setAvailable(Boolean(context));'''
          probe_new = '''      const canvas = document.createElement("canvas");
                const context = canvas.getContext("webgl2") || canvas.getContext("webgl");
                const supported = Boolean(context);
                context?.getExtension("WEBGL_lose_context")?.loseContext();
                canvas.width = 1;
                canvas.height = 1;
                setAvailable(supported);'''
          if wrapper.count(probe_old) != 1:
              raise SystemExit('Expected exactly one WebGL capability probe')
          wrapper = wrapper.replace(probe_old, probe_new, 1)

          scene_path.write_text(scene)
          wrapper_path.write_text(wrapper)
          PY
          git diff --check

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "URAI release repair"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/urai-lifemap-software-stability-repair.yml
          git add urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx
          git diff --cached --check
          git commit -m "fix: bound Life Map software renderer cadence"
          git push origin HEAD:reconcile/lifemap-current-main-20260817
