name: Trigger reviewed Mirror findings repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: trigger-mirror-review-findings-v2
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/mirror-embodied-spatial-realm-v2-20260801
  REVIEWED_HEAD: 069f864cf531a4bfb1297eee2c7c55770dc4ad53
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  repair:
    if: github.repository == 'LifeLoggerAI/urai-spatial' && github.event.pull_request.head.ref == 'feat/mirror-embodied-spatial-realm-v2-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact staged branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify bounded staging authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$REVIEWED_HEAD" HEAD
          mapfile -t changed < <(git diff --name-only "$REVIEWED_HEAD"...HEAD)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/one-shot-mirror-review-findings.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx '.github/workflows/trigger-mirror-review-findings-v2.yml'
          printf '%s\n' "${changed[@]}" | grep -Fx 'scripts/repair-mirror-review-findings.py'

      - name: Apply reviewed source corrections
        run: python scripts/repair-mirror-review-findings.py

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen graph
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify full Tier-1 boundary
        run: |
          pnpm --filter urai-tier1 test
          pnpm --filter urai-tier1 typecheck
          pnpm --filter urai-tier1 build

      - name: Commit clean reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-mirror-review-findings.yml
          git rm .github/workflows/trigger-mirror-review-findings-v2.yml
          git rm scripts/repair-mirror-review-findings.py
          git add .github/workflows/mirror-release-proof.yml \
            tests/mirror-release-proof.mjs \
            urai-tier1/src/app/mirror/MirrorBareEntryGuard.tsx \
            urai-tier1/src/app/mirror/MirrorSpatialClient.tsx \
            urai-tier1/tests/mirror-spatial-realm-contract.test.mjs
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "8"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Close Mirror automated review findings"
          git push origin "HEAD:$TARGET_BRANCH"
