name: Spatial Lock Diagnostic Receipt

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/spatial-lock-diagnostic-receipt.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/spatial-lock-diagnostic-receipt.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: urai-spatial-lock-diagnostic-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      LOCK_DIAGNOSTIC_DIR: artifacts/spatial-lock-diagnostics
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright runtime
        run: pnpm playwright:ensure

      - name: Static lock
        id: static_gate
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$LOCK_DIAGNOSTIC_DIR"
          set -o pipefail
          pnpm lock:static 2>&1 | tee "$LOCK_DIAGNOSTIC_DIR/lock-static.log"

      - name: Build lock
        id: build_gate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$LOCK_DIAGNOSTIC_DIR"
          set -o pipefail
          pnpm lock:build 2>&1 | tee "$LOCK_DIAGNOSTIC_DIR/lock-build.log"

      - name: Browser lock
        id: browser_gate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$LOCK_DIAGNOSTIC_DIR"
          set -o pipefail
          pnpm lock:e2e 2>&1 | tee "$LOCK_DIAGNOSTIC_DIR/lock-e2e.log"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-lock-diagnostic-${{ github.run_id }}
          path: |
            artifacts/spatial-lock-diagnostics
            artifacts/spatial-lock
          if-no-files-found: warn
          retention-days: 30

      - name: Publish exact diagnostic receipt
        if: always()
        uses: actions/github-script@v7
        env:
          STATIC_OUTCOME: ${{ steps.static_gate.outcome }}
          BUILD_OUTCOME: ${{ steps.build_gate.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_gate.outcome }}
        with:
          script: |
            const sourceSha = process.env.SOURCE_SHA;
            const shortSha = sourceSha.slice(0, 12);
            const title = `Spatial Lock diagnostic ${shortSha}`;
            const body = [
              '# Spatial Lock diagnostic receipt',
              '',
              `- Commit: \`${sourceSha}\``,
              `- Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Static lock: **${process.env.STATIC_OUTCOME}**`,
              `- Build lock: **${process.env.BUILD_OUTCOME}**`,
              `- Browser lock: **${process.env.BROWSER_OUTCOME}**`,
              '',
              'The workflow artifact contains the complete logs for each subgate.',
            ].join('\n');
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = existing.find((issue) => issue.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Enforce diagnostic result
        if: always()
        shell: bash
        run: |
          test "${{ steps.static_gate.outcome }}" = success
          test "${{ steps.build_gate.outcome }}" = success
          test "${{ steps.browser_gate.outcome }}" = success
