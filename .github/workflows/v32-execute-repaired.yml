name: V32 Execute Repaired

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/v32-execute-repaired.yml'

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Checkout exact owner head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Execute V32 transform with robust ceiling and tuple repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/v32-sanctuary-rebuild.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Verify V32 contracts and production build"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])

          old_ceiling = "source = source.replace('<SanctuaryArchitecture /><SanctuaryGlazing /><SanctuaryCeiling /><AtmosphericDepth />', '<SanctuaryArchitecture /><SanctuaryGlazing /><AtmosphericDepth />', 1)"
          replacement_ceiling = "assert '<SanctuaryCeiling />' in source, 'live SanctuaryCeiling call missing before V32 transform'\nsource = source.replace('<SanctuaryCeiling />', '', 1)"
          assert old_ceiling in script, 'original V32 ceiling transform not found'
          script = script.replace(old_ceiling, replacement_ceiling, 1)

          old_rotation = "rotation={[0,index===0?0.12:index===1?-0.12:0,0]}"
          typed_rotation = "rotation={[0,index===0?0.12:index===1?-0.12:0,0] as [number,number,number]}"
          assert old_rotation in script, 'V32 foundation rotation expression not found'
          script = script.replace(old_rotation, typed_rotation, 1)

          Path('/tmp/v32-transform.py').write_text(script)
          PY
          python3 /tmp/v32-transform.py

      - name: Verify V32 contracts and production build
        shell: bash
        run: |
          set -euo pipefail
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          grep -F 'v32-monolithic-extruded-sanctuary-no-box-room' "$source"
          grep -F 'v32-sanctuary-scale-three-point-reliquary-machine' "$source"
          grep -F 'v32-faceted-heavy-relic-reactor-integrated-with-sanctuary' "$source"
          grep -F 'v32-monolithic-reliquary-sanctuary-final' "$source"
          ! grep -F '<SanctuaryCeiling />' "$source"
          cd urai-tier1
          node --test --test-concurrency=1 tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs tests/continuous-spatial-restoration-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs
          cd ..
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:static

      - name: Commit only V32 implementation files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx .github/workflows/home-scanned-composition-forge.yml
          git commit -m 'Complete V32 monolithic sanctuary relic-machine rebuild'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826
