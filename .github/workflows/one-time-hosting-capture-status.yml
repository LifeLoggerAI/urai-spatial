name: One-time Hosting capture status report

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-time-hosting-capture-status.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-hosting-capture-status.yml'

permissions:
  contents: read

concurrency:
  group: one-time-hosting-capture-status
  cancel-in-progress: false

env:
  DISPATCHER_SHA: 48835d090bdc2db0a46f79a09cc414f1fd7f82c3
  DISPATCHER_WORKFLOW: one-time-hosting-capture-dispatch.yml
  CAPTURE_WORKFLOW: capture-legacy-hosting-recovery.yml
  CONTROL_ISSUE: '414'

jobs:
  verify-status-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact status candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean status candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Prove reporter is read-only toward production
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-production-workflow-authority.mjs
          node scripts/verify-production-action-pins.mjs
          node - <<'NODE'
          const { readFileSync } = require('node:fs')
          const source = readFileSync('.github/workflows/one-time-hosting-capture-status.yml', 'utf8')
          const forbidden = [
            ['live-release.mjs', ' --deploy-prebuilt'].join(''),
            ['firebase', ' deploy'].join(''),
            ['firebase-tools', ' deploy'].join(''),
            ['firebase-hosting-recovery.mjs', ' restore'].join(''),
            ['FIREBASE_SERVICE_ACCOUNT', '_JSON'].join(''),
          ]
          for (const marker of forbidden) {
            if (source.includes(marker)) throw new Error(`Status reporter contains forbidden marker: ${marker}`)
          }
          NODE
      - name: Verify immutable query scope
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'DISPATCHER_SHA: 48835d090bdc2db0a46f79a09cc414f1fd7f82c3' .github/workflows/one-time-hosting-capture-status.yml
          grep -Fq 'DISPATCHER_WORKFLOW: one-time-hosting-capture-dispatch.yml' .github/workflows/one-time-hosting-capture-status.yml
          grep -Fq 'CAPTURE_WORKFLOW: capture-legacy-hosting-recovery.yml' .github/workflows/one-time-hosting-capture-status.yml
          grep -Fq "actions: read" .github/workflows/one-time-hosting-capture-status.yml
          grep -Fq "issues: write" .github/workflows/one-time-hosting-capture-status.yml
          test -z "$(git status --porcelain --untracked-files=all)"

  report-capture-status:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact merged reporter
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Prove exact main identity and one-file merge
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$GITHUB_SHA"
          if git rev-parse "$GITHUB_SHA^2" >/dev/null 2>&1; then
            changed="$(git diff --name-only "$GITHUB_SHA^1" "$GITHUB_SHA")"
          else
            changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          fi
          test "$changed" = '.github/workflows/one-time-hosting-capture-status.yml'
      - name: Query dispatcher and capture runs
        id: status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/hosting-capture-status"
          mkdir -p "$report_dir"
          api() {
            curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }
          dispatcher_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${DISPATCHER_WORKFLOW}/runs?branch=main&event=push&head_sha=${DISPATCHER_SHA}&per_page=20"
          capture_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${CAPTURE_WORKFLOW}/runs?branch=main&event=workflow_dispatch&per_page=20"
          api "$dispatcher_url" > "$report_dir/dispatcher-runs.json"
          api "$capture_url" > "$report_dir/capture-runs.json"
          node - <<'NODE' "$report_dir"
          const { readFileSync, writeFileSync } = require('node:fs')
          const path = require('node:path')
          const reportDir = process.argv[2]
          const dispatcher = JSON.parse(readFileSync(path.join(reportDir, 'dispatcher-runs.json'), 'utf8')).workflow_runs || []
          const captures = JSON.parse(readFileSync(path.join(reportDir, 'capture-runs.json'), 'utf8')).workflow_runs || []
          const exactDispatcher = dispatcher.find((run) => run.head_sha === process.env.DISPATCHER_SHA) || null
          const capture = captures.find((run) => {
            const started = Date.parse(run.created_at || '')
            const dispatcherTime = exactDispatcher ? Date.parse(exactDispatcher.created_at || '') : 0
            return !Number.isNaN(started) && started >= dispatcherTime && run.head_branch === 'main'
          }) || null
          const report = {
            schemaVersion: 'urai-hosting-capture-status-1',
            recordedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            reporterSha: process.env.GITHUB_SHA,
            dispatcherExpectedSha: process.env.DISPATCHER_SHA,
            dispatcherRun: exactDispatcher && {
              id: exactDispatcher.id,
              name: exactDispatcher.name,
              event: exactDispatcher.event,
              status: exactDispatcher.status,
              conclusion: exactDispatcher.conclusion,
              headSha: exactDispatcher.head_sha,
              createdAt: exactDispatcher.created_at,
              updatedAt: exactDispatcher.updated_at,
              htmlUrl: exactDispatcher.html_url,
            },
            captureRun: capture && {
              id: capture.id,
              name: capture.name,
              event: capture.event,
              status: capture.status,
              conclusion: capture.conclusion,
              headSha: capture.head_sha,
              headBranch: capture.head_branch,
              createdAt: capture.created_at,
              updatedAt: capture.updated_at,
              htmlUrl: capture.html_url,
            },
            captureRequested: Boolean(capture),
            productionMutationPerformedByReporter: false,
          }
          writeFileSync(path.join(reportDir, 'status.json'), `${JSON.stringify(report, null, 2)}\n`)
          const value = (x) => x === null || x === undefined ? 'none' : String(x)
          const body = [
            '## Hosting recovery capture status',
            '',
            `- Reporter SHA: \`${report.reporterSha}\``,
            `- Dispatcher expected SHA: \`${report.dispatcherExpectedSha}\``,
            `- Dispatcher run ID: \`${value(report.dispatcherRun?.id)}\``,
            `- Dispatcher state: \`${value(report.dispatcherRun?.status)} / ${value(report.dispatcherRun?.conclusion)}\``,
            `- Capture requested: **${report.captureRequested ? 'yes' : 'no'}**`,
            `- Capture run ID: \`${value(report.captureRun?.id)}\``,
            `- Capture state: \`${value(report.captureRun?.status)} / ${value(report.captureRun?.conclusion)}\``,
            `- Capture head: \`${value(report.captureRun?.headSha)}\``,
            '- Reporter production mutation: `false`',
            '',
            report.captureRequested
              ? 'The protected read-only Hosting capture request exists. Its run must complete and its retained receipt must be inspected before any deployment decision.'
              : 'No matching protected capture run was found. Do not infer that Firebase was queried or that a recovery version was captured.',
          ].join('\n')
          writeFileSync(path.join(reportDir, 'issue-comment.md'), `${body}\n`)
          NODE
          echo "report_dir=$report_dir" >> "$GITHUB_OUTPUT"
      - name: Publish status to control issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DIR: ${{ steps.status.outputs.report_dir }}
        run: |
          set -euo pipefail
          node - <<'NODE' > "$RUNNER_TEMP/issue-comment.json"
          const { readFileSync } = require('node:fs')
          process.stdout.write(JSON.stringify({ body: readFileSync(`${process.env.REPORT_DIR}/issue-comment.md`, 'utf8') }))
          NODE
          curl --fail --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${CONTROL_ISSUE}/comments" \
            --data-binary "@$RUNNER_TEMP/issue-comment.json" > "$RUNNER_TEMP/comment-response.json"
      - name: Upload status receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosting-capture-status-${{ github.sha }}
          path: ${{ steps.status.outputs.report_dir }}
          if-no-files-found: error
          retention-days: 365
