      - 'urai-tier1/src/spatial/world/persistentWorldCompanion.css'
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
  pull_request:
    branches: [main, repair/release-closure-integration-20261007]
    paths:
      - '.github/workflows/accessibility-performance-evidence.yml'
      - 'scripts/visual-proof-transport.mjs'
      - 'urai-tier1/tests/visual-proof-transport.test.mjs'
      - 'playwright.accessibility.config.ts'
      - 'scripts/materialize-accessibility-performance-current.mjs'
      - 'scripts/materialize-accessibility-performance-current-v2.mjs'
      - 'scripts/materialize-accessibility-performance-current-v3.mjs'
      - 'scripts/materialize-accessibility-performance-current-v4.mjs'
      - 'scripts/materialize-accessibility-performance-current-v5.mjs'
      - 'scripts/materialize-accessibility-performance-lifemap-authority.mjs'
      - 'tests/accessibility-performance-materialization.test.mjs'
      - 'urai-tier1/tests/accessibility-performance-*.spec.ts'
      - 'urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx'
      - 'urai-tier1/src/app/HomeSanctuaryWorld.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx'
      - 'urai-tier1/tests/home-vegetation-instancing-behavior.test.mjs'
      - 'urai-tier1/tests/orb-menu-commit-ordering-behavior.test.mjs'
      - 'urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx'
      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'
      - 'urai-tier1/src/app/focus/FocusChamberClient.tsx'
      - 'urai-tier1/src/app/replay/CinematicReplayClient.tsx'
      - 'urai-tier1/src/app/life-movie/**'
      - 'urai-tier1/src/spatial/life-movie/**'
      - 'urai-tier1/src/spatial/world/worldEvents.ts'
      - 'urai-tier1/src/spatial/world/WorldTransitionController.tsx'
      - 'urai-tier1/src/spatial/memory/useSelectedMemory.ts'
      - 'urai-tier1/src/spatial/memory/explicitDemoMemory.ts'
      - 'urai-tier1/src/components/lifemap/**'
      - 'urai-tier1/src/app/passport/**'
      - 'urai-tier1/src/app/privacy-controls/**'
      - 'urai-tier1/src/app/status/**'
      - 'urai-tier1/src/data/launchTruth.ts'
      - 'urai-tier1/tests/status-live-authority-contract.test.mjs'
      - 'urai-tier1/src/spatial/world/PersistentWorldCompanion.tsx'
      - 'urai-tier1/src/spatial/world/persistentWorldCompanion.css'

permissions:
  contents: read
  actions: read # Download and check this run's immutable native artifact bytes.

concurrency:
  group: accessibility-performance-${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  PLAYWRIGHT_BROWSERS_PATH: '0'
  URAI_PROOF_GROUP: accessibility-performance

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify retained Home vegetation construction
        run: node --test urai-tier1/tests/home-vegetation-instancing-behavior.test.mjs

      - name: Verify Orb menu commit and focus before external Home updates
        run: node --test urai-tier1/tests/orb-menu-commit-ordering-behavior.test.mjs

      - name: Typecheck and build exact candidate
        run: |
          pnpm --dir urai-tier1 typecheck
          pnpm build:static

      - name: Install Chromium
        run: pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Materialize current accessibility proof contract
        run: |
          node --test tests/accessibility-performance-materialization.test.mjs
          node scripts/materialize-accessibility-performance-current-v5.mjs

      - name: Run isolated accessibility and performance suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/accessibility-performance/spec-logs \
            artifacts/accessibility-performance/test-logs \
            artifacts/accessibility-performance/spec-reports \
            artifacts/accessibility-performance/spec-results
          : > artifacts/accessibility-performance/playwright.log

          mapfile -t specs < <(find urai-tier1/tests -maxdepth 1 -type f -name 'accessibility-performance-*.spec.ts' -print | sort)
          test "${#specs[@]}" -gt 0
          status=0

          for spec in "${specs[@]}"; do
            slug="$(basename "$spec" .spec.ts)"
            spec_log="artifacts/accessibility-performance/spec-logs/${slug}.log"
            list_log="artifacts/accessibility-performance/spec-logs/${slug}-list.log"
            : > "$spec_log"
            : > "$list_log"
            echo "=== ACCESSIBILITY SPEC START: $spec ===" | tee -a artifacts/accessibility-performance/playwright.log "$spec_log"
            echo "=== ACCESSIBILITY DISCOVERY START: $spec ===" | tee -a artifacts/accessibility-performance/playwright.log "$spec_log"

            set +e
            FORCE_COLOR=0 pnpm exec playwright test --config playwright.accessibility.config.ts "$spec" --list > "$list_log" 2>&1
            list_status=$?
            set -e
            cat "$list_log" | tee -a artifacts/accessibility-performance/playwright.log "$spec_log"
            echo "=== ACCESSIBILITY DISCOVERY END: $spec status=$list_status ===" | tee -a artifacts/accessibility-performance/playwright.log "$spec_log"
            if [[ "$list_status" -ne 0 ]]; then
              echo "Playwright discovery failed for $spec" | tee -a artifacts/accessibility-performance/playwright.log "$spec_log"
              status="$list_status"
              continue
            fi

            mapfile -t test_cases < <(
              node - "$spec" "$list_log" <<'NODE'
          const { createHash } = require('node:crypto')
          const { readFileSync } = require('node:fs')
          const spec = process.argv[2]
          const listLog = process.argv[3]
          const stripAnsi = (value) => value.replace(/\u001B\[[0-?]*[ -/]*[@-~]/g, '')
          const output = stripAnsi(readFileSync(listLog, 'utf8'))
          const titles = []

          for (const rawLine of output.split(/\r?\n/)) {
            const line = rawLine.trim()
            const parts = line.split(' › ')
            if (parts.length < 3 || !/^\[[^\]]+\]$/.test(parts[0])) continue
            if (!/\.spec\.ts:\d+:\d+$/.test(parts[1])) continue
            const title = parts[parts.length - 1].trim()
            if (title) titles.push(title)
          }

          if (!titles.length) {
            console.error(`Playwright discovery returned no runnable tests for ${spec}`)
            process.exit(2)
          }
          if (new Set(titles).size !== titles.length) {
            console.error(`Duplicate discovered leaf test titles are not safe for isolated grep execution in ${spec}`)
            process.exit(3)
          }
          for (let left = 0; left < titles.length; left += 1) {
            for (let right = 0; right < titles.length; right += 1) {
              if (left === right) continue
              if (titles[right].endsWith(titles[left])) {
                console.error(`Ambiguous discovered leaf-title suffix in ${spec}: ${JSON.stringify({ shorter: titles[left], longer: titles[right] })}`)
                process.exit(4)
              }
            }
          }

          for (const title of titles) {
            if (/[\r\n\t]/.test(title)) {
              console.error(`Multiline discovered test title is not safe for isolated execution in ${spec}`)
              process.exit(5)
            }
            const escaped = title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '$'
            const hash = createHash('sha256').update(title).digest('hex').slice(0, 12)
            process.stdout.write(`${hash}\t${Buffer.from(escaped, 'utf8').toString('base64')}\n`)
          }
          NODE
            )
            test "${#test_cases[@]}" -gt 0
            spec_status=0

            for test_case in "${test_cases[@]}"; do
              test_hash="${test_case%%$'\t'*}"
              encoded_regex="${test_case#*$'\t'}"
              test_regex="$(printf '%s' "$encoded_regex" | base64 --decode)"
              test_log="artifacts/accessibility-performance/test-logs/${slug}-${test_hash}.log"
              rm -rf artifacts/accessibility-performance/playwright-report \
                artifacts/accessibility-performance/test-results
              echo "=== ACCESSIBILITY TEST START: $spec hash=$test_hash ===" | tee -a artifacts/accessibility-performance/playwright.log "$spec_log" "$test_log"

              set +e
              FORCE_COLOR=0 pnpm exec playwright test --config playwright.accessibility.config.ts "$spec" --grep "$test_regex" \
                2>&1 | tee -a artifacts/accessibility-performance/playwright.log "$spec_log" "$test_log"
              test_status=${PIPESTATUS[0]}
              set -e

              # Playwright exits 0 when an initially failing test passes on retry and
              # reports it as "flaky". Retain one retry for diagnostic trace capture,
              # but never promote a recovered flake to release-green evidence.
              if grep -Eq '(^|[[:space:]])[1-9][0-9]* flaky([[:space:]]|$)' "$test_log"; then
                echo "Recovered Playwright flake is a release failure for $spec hash=$test_hash" \
                  | tee -a artifacts/accessibility-performance/playwright.log "$spec_log" "$test_log"
                if [[ "$test_status" -eq 0 ]]; then
                  test_status=86
                fi
              fi

              if [[ -d artifacts/accessibility-performance/playwright-report ]]; then
                mv artifacts/accessibility-performance/playwright-report \
                  "artifacts/accessibility-performance/spec-reports/${slug}-${test_hash}"
              fi
              if [[ -d artifacts/accessibility-performance/test-results ]]; then
                mv artifacts/accessibility-performance/test-results \
                  "artifacts/accessibility-performance/spec-results/${slug}-${test_hash}"
              fi

              echo "=== ACCESSIBILITY TEST END: $spec hash=$test_hash status=$test_status ===" | tee -a artifacts/accessibility-performance/playwright.log "$spec_log" "$test_log"
              if [[ "$test_status" -ne 0 ]]; then
                spec_status="$test_status"
                status="$test_status"
              fi
            done

            echo "=== ACCESSIBILITY SPEC END: $spec status=$spec_status ===" | tee -a artifacts/accessibility-performance/playwright.log "$spec_log"
          done

          exit "$status"

      - name: Retain exact-head evidence
        id: original-accessibility-proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-evidence-${{ env.URAI_EXACT_HEAD }}
          path: artifacts/accessibility-performance
          if-no-files-found: error
          retention-days: 365

      - name: Partition the original native accessibility archive
        id: bounded-accessibility-transport
        if: ${{ always() && steps.original-accessibility-proof.outputs.artifact-id != '' }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          URAI_ORIGINAL_ARTIFACT_ID: ${{ steps.original-accessibility-proof.outputs.artifact-id }}
          URAI_ORIGINAL_ARTIFACT_DIGEST: ${{ steps.original-accessibility-proof.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/visual-proof-transport.mjs prepare-native \
            --output "artifacts/accessibility-performance-transport"

      - name: Upload bounded accessibility transport manifest
        id: bounded-accessibility-manifest
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-manifest
          path: artifacts/accessibility-performance-transport/manifest.json
          if-no-files-found: error
          retention-days: 365
          compression-level: 0

      - name: Upload bounded accessibility archive part 01
        id: bounded-accessibility-part-01
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' && steps.bounded-accessibility-transport.outputs.part_count >= 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-01
          path: artifacts/accessibility-performance-transport/accessibility-performance.zip.part-01
          if-no-files-found: error
          retention-days: 365
          compression-level: 0

      - name: Upload bounded accessibility archive part 02
        id: bounded-accessibility-part-02
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' && steps.bounded-accessibility-transport.outputs.part_count >= 2 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-02
          path: artifacts/accessibility-performance-transport/accessibility-performance.zip.part-02
          if-no-files-found: error
          retention-days: 365
          compression-level: 0

      - name: Upload bounded accessibility archive part 03
        id: bounded-accessibility-part-03
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' && steps.bounded-accessibility-transport.outputs.part_count >= 3 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-03
          path: artifacts/accessibility-performance-transport/accessibility-performance.zip.part-03
          if-no-files-found: error
          retention-days: 365
          compression-level: 0

      - name: Upload bounded accessibility archive part 04
        id: bounded-accessibility-part-04
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' && steps.bounded-accessibility-transport.outputs.part_count >= 4 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-04
          path: artifacts/accessibility-performance-transport/accessibility-performance.zip.part-04
          if-no-files-found: error
          retention-days: 365
          compression-level: 0

      - name: Upload bounded accessibility archive part 05
        id: bounded-accessibility-part-05
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' && steps.bounded-accessibility-transport.outputs.part_count >= 5 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-05
          path: artifacts/accessibility-performance-transport/accessibility-performance.zip.part-05
          if-no-files-found: error
          retention-days: 365
          compression-level: 0

      - name: Upload bounded accessibility archive part 06
        id: bounded-accessibility-part-06
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' && steps.bounded-accessibility-transport.outputs.part_count >= 6 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-06
          path: artifacts/accessibility-performance-transport/accessibility-performance.zip.part-06
          if-no-files-found: error
          retention-days: 365
          compression-level: 0

      - name: Upload bounded accessibility archive part 07
        id: bounded-accessibility-part-07
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' && steps.bounded-accessibility-transport.outputs.part_count >= 7 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-07
          path: artifacts/accessibility-performance-transport/accessibility-performance.zip.part-07
          if-no-files-found: error
          retention-days: 365
          compression-level: 0

      - name: Upload bounded accessibility archive part 08
        id: bounded-accessibility-part-08
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' && steps.bounded-accessibility-transport.outputs.part_count >= 8 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-part-08
          path: artifacts/accessibility-performance-transport/accessibility-performance.zip.part-08
          if-no-files-found: error
          retention-days: 365
          compression-level: 0

      - name: Verify separate native transport artifact identities and byte limits
        id: verified-accessibility-transport
        if: ${{ always() && steps.bounded-accessibility-transport.outcome == 'success' }}
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          URAI_ORIGINAL_ARTIFACT_ID: ${{ steps.original-accessibility-proof.outputs.artifact-id }}
          URAI_ORIGINAL_ARTIFACT_DIGEST: ${{ steps.original-accessibility-proof.outputs.artifact-digest }}
          URAI_MANIFEST_ID: ${{ steps.bounded-accessibility-manifest.outputs.artifact-id }}
          URAI_MANIFEST_DIGEST: ${{ steps.bounded-accessibility-manifest.outputs.artifact-digest }}
          URAI_PART_01_ID: ${{ steps.bounded-accessibility-part-01.outputs.artifact-id }}
          URAI_PART_01_DIGEST: ${{ steps.bounded-accessibility-part-01.outputs.artifact-digest }}
          URAI_PART_02_ID: ${{ steps.bounded-accessibility-part-02.outputs.artifact-id }}
          URAI_PART_02_DIGEST: ${{ steps.bounded-accessibility-part-02.outputs.artifact-digest }}
          URAI_PART_03_ID: ${{ steps.bounded-accessibility-part-03.outputs.artifact-id }}
          URAI_PART_03_DIGEST: ${{ steps.bounded-accessibility-part-03.outputs.artifact-digest }}
          URAI_PART_04_ID: ${{ steps.bounded-accessibility-part-04.outputs.artifact-id }}
          URAI_PART_04_DIGEST: ${{ steps.bounded-accessibility-part-04.outputs.artifact-digest }}
          URAI_PART_05_ID: ${{ steps.bounded-accessibility-part-05.outputs.artifact-id }}
          URAI_PART_05_DIGEST: ${{ steps.bounded-accessibility-part-05.outputs.artifact-digest }}
          URAI_PART_06_ID: ${{ steps.bounded-accessibility-part-06.outputs.artifact-id }}
          URAI_PART_06_DIGEST: ${{ steps.bounded-accessibility-part-06.outputs.artifact-digest }}
          URAI_PART_07_ID: ${{ steps.bounded-accessibility-part-07.outputs.artifact-id }}
          URAI_PART_07_DIGEST: ${{ steps.bounded-accessibility-part-07.outputs.artifact-digest }}
          URAI_PART_08_ID: ${{ steps.bounded-accessibility-part-08.outputs.artifact-id }}
          URAI_PART_08_DIGEST: ${{ steps.bounded-accessibility-part-08.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/visual-proof-transport.mjs verify-native-uploads \
            --manifest "artifacts/accessibility-performance-transport/manifest.json" \
            --output "artifacts/accessibility-performance-transport/upload-receipt.json"

      - name: Upload verified native accessibility transport receipt
        if: ${{ always() && steps.verified-accessibility-transport.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-transport-${{ env.URAI_EXACT_HEAD }}-${{ github.run_id }}-${{ github.run_attempt }}-upload-receipt
          path: artifacts/accessibility-performance-transport/upload-receipt.json
          if-no-files-found: error
          retention-days: 365
          compression-level: 0
