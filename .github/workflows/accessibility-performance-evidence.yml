name: Accessibility Performance Evidence

on:
  workflow_dispatch:
    inputs:
      verification_sha:
        description: Exact 40-character commit SHA to verify
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/accessibility-performance-evidence.yml'
      - 'playwright.accessibility.config.ts'
      - 'urai-tier1/tests/accessibility-performance-*.spec.ts'
      - 'urai-tier1/tests/accessibility-performance-*.test.mjs'
      - 'urai-tier1/tests/focus-continuity-contract.test.mjs'
      - 'urai-tier1/tests/selected-memory-production-contract.test.mjs'
      - 'urai-tier1/scripts/run-unit-contract-tests*.mjs'
      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'
      - 'urai-tier1/src/app/focus/FocusChamberClient.tsx'
      - 'urai-tier1/src/app/focus/FocusChamber.module.css'
      - 'urai-tier1/src/app/focus/FocusChamberCinematic.module.css'
      - 'urai-tier1/src/app/focus/FocusChamberLandscape.module.css'
      - 'urai-tier1/src/spatial/lifemap/LifeMapDeepLinkControls.tsx'
      - 'urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx'
      - 'urai-tier1/src/spatial/memory/explicitDemoMemory.ts'
      - 'urai-tier1/src/spatial/memory/selectedMemoryContract.ts'
      - 'urai-tier1/src/spatial/memory/useSelectedMemory.ts'
      - 'urai-tier1/src/spatial/world/PersistentWorldCompanion.tsx'
      - 'urai-tier1/src/spatial/world/persistentWorldCompanion.css'
      - 'urai-tier1/src/spatial/world/UraiWorldShell.tsx'
      - 'urai-tier1/src/spatial/world/WorldStateProvider.tsx'
      - 'urai-tier1/src/spatial/world/WorldTransitionController.tsx'
      - 'urai-tier1/src/spatial/world/worldEvents.ts'

permissions:
  contents: read

concurrency:
  group: accessibility-performance-${{ github.event.pull_request.number || inputs.verification_sha || github.ref }}
  cancel-in-progress: true

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.verification_sha || github.sha }}
  PLAYWRIGHT_BROWSERS_PATH: '0'

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$URAI_EXACT_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact lockfile
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run focused unit and contract suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p accessibility-performance-evidence
          cd urai-tier1
          node scripts/run-unit-contract-tests-compact.mjs 2>&1 | tee ../accessibility-performance-evidence/focused-unit-contracts.log

      - name: Typecheck and build exact static candidate
        run: |
          pnpm --dir urai-tier1 typecheck
          pnpm build:static
          test -f urai-tier1/out/focus/index.html
          test -f urai-tier1/out/replay/index.html
          test -f urai-tier1/out/life-map/index.html

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run isolated accessibility and performance suite
        run: pnpm exec playwright test --config playwright.accessibility.config.ts

      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: accessibility-performance-evidence-${{ env.URAI_EXACT_HEAD }}
          path: |
            accessibility-performance-evidence
            artifacts/accessibility-performance
          if-no-files-found: error
          retention-days: 90
