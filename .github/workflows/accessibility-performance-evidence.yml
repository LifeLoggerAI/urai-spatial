name: Accessibility Performance Evidence

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/accessibility-performance-evidence.yml'

permissions:
  contents: write

concurrency:
  group: focus-url-identity-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event.pull_request.head.ref == 'feat/focus-current-main-20260723'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded URL identity repair
        shell: python
        run: |
          from pathlib import Path

          home = Path('urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx')
          life_map = Path('urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx')
          contract = Path('urai-tier1/tests/focus-url-identity-repair-contract.test.mjs')

          home_source = home.read_text()
          old_travel = """  const travel = useCallback((destination: 'life-map' | 'infrastructure-hub') => requestUraiWorldTravel(destination === 'life-map'
            ? { destination: 'life-map', href: '/life-map?from=home-sky', entryPortal: 'home-sky', cameraCheckpoint: 'home-sky-ascent' }
            : { destination: 'infrastructure-hub', href: '/ground/', entryPortal: 'home-ground', cameraCheckpoint: 'home-ground-descent' }), [])
          """
          new_travel = """  const travel = useCallback((destination: 'life-map' | 'infrastructure-hub') => requestUraiWorldTravel(destination === 'life-map'
            ? { destination: 'life-map', href: '/life-map?from=home-sky&entryPortal=home-sky&cameraCheckpoint=home-sky-ascent', entryPortal: 'home-sky', cameraCheckpoint: 'home-sky-ascent' }
            : { destination: 'infrastructure-hub', href: '/ground/?entryPortal=home-ground&cameraCheckpoint=home-ground-descent', entryPortal: 'home-ground', cameraCheckpoint: 'home-ground-descent' }), [])
          """
          if old_travel not in home_source:
              raise SystemExit('expected Home travel block is absent; fail closed')
          home.write_text(home_source.replace(old_travel, new_travel, 1))

          life_source = life_map.read_text()
          old_identity = """    next.set("memoryId", selected.id);
              next.set("node", selected.id);
          """
          new_identity = """    next.set("memoryId", explicitDemoRequested ? `demo:${selected.id}` : selected.id);
              next.set("node", selected.id);
          """
          if old_identity not in life_source:
              raise SystemExit('expected Life Map destination identity block is absent; fail closed')
          life_source = life_source.replace(old_identity, new_identity, 1)
          old_deps = "  }, [selected, withIdentity]);"
          new_deps = "  }, [explicitDemoRequested, selected, withIdentity]);"
          if old_deps not in life_source:
              raise SystemExit('expected destination dependency block is absent; fail closed')
          life_map.write_text(life_source.replace(old_deps, new_deps, 1))

          contract.write_text("""import assert from 'node:assert/strict'
          import fs from 'node:fs'

          const home = fs.readFileSync(new URL('../src/app/EmbodiedHomeSpatialCanvas.tsx', import.meta.url), 'utf8')
          const lifeMap = fs.readFileSync(new URL('../src/components/lifemap/AdaptiveLifeMapScene.tsx', import.meta.url), 'utf8')

          assert.match(home, /\/ground\/\?entryPortal=home-ground&cameraCheckpoint=home-ground-descent/)
          assert.match(home, /\/life-map\?from=home-sky&entryPortal=home-sky&cameraCheckpoint=home-sky-ascent/)
          assert.match(lifeMap, /explicitDemoRequested \? `demo:\$\{selected\.id\}` : selected\.id/)
          assert.match(lifeMap, /\[explicitDemoRequested, selected, withIdentity\]/)
          console.log('FOCUS_URL_IDENTITY_REPAIR_CONTRACT_PASSED')
          """)

      - name: Verify and publish repair
        shell: bash
        run: |
          set -euo pipefail
          node urai-tier1/tests/focus-url-identity-repair-contract.test.mjs
          git add urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/tests/focus-url-identity-repair-contract.test.mjs
          git config user.name 'LifeLoggerAI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(focus): preserve canonical travel and demo identity'
          git fetch origin feat/focus-current-main-20260723
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git push origin HEAD:feat/focus-current-main-20260723
