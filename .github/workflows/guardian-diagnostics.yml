name: Guardian Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove exact candidate checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Guardian and preserve receipt
        id: guardian
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/urai-guardian.mjs 2>&1 | tee guardian-diagnostics.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Guardian diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            guardian-diagnostics.log
            artifacts/guardian/failure.txt

      - name: Fail when Guardian failed
        if: steps.guardian.outputs.exit_code != '0'
        run: exit 1
