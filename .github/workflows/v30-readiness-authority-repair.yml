name: V30 Readiness Authority Repair

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/v30-readiness-authority-repair.yml'
      - 'scripts/apply-v30-readiness-authority.py'

permissions:
  contents: write

concurrency:
  group: v30-readiness-authority-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Replace retired readiness objects with V30 structural authority
        run: python3 scripts/apply-v30-readiness-authority.py
      - name: Verify readiness authority and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          grep -F "'home-v30-rear-apse'" "$source"
          grep -F "'home-v30-side-enclosure'" "$source"
          grep -F "'home-v30-load-bearing-vault'" "$source"
          grep -F "'home-v30-orb-apse-architecture'" "$source"
          grep -F "'home-orb-engineered-cradle'" "$source"
          cd urai-tier1
          node --test --test-concurrency=1 tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs tests/continuous-spatial-restoration-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs
      - name: Commit clean successor if branch is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$current" = "${GITHUB_SHA}"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git rm .github/workflows/v30-readiness-authority-repair.yml scripts/apply-v30-readiness-authority.py
          git commit -m 'Align V30 runtime readiness with final structural shell'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826
