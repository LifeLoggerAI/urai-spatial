name: Home Artifact Inspection Packet

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/home-artifact-inspection.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect-home-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download exact retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/LifeLoggerAI/urai-spatial/actions/artifacts/8717996891/zip > home-proof.zip
          test "$(stat -c%s home-proof.zip)" -eq 573255456
          echo "ae4acc458786c68a4e2e10a0d14c920dd0433caaf68ac8deefdc747b1bf2e817  home-proof.zip" | sha256sum -c -
          mkdir proof
          unzip -q home-proof.zip -d proof

      - name: Inventory packet
        run: |
          set -euo pipefail
          find proof -type f -printf '%P\t%s\n' | sort > artifact-inventory.tsv
          find proof -type f | grep -Ei '\.(png|jpg|jpeg|webp|gif)$' | sort > image-files.txt || true
          find proof -type f | grep -Ei '\.(webm|mp4|mov)$' | sort > video-files.txt || true
          find proof -type f | grep -Ei '\.(json|txt|md|log|html)$' | sort > evidence-files.txt || true
          printf 'artifact_id=8717996891\nartifact_sha=51db7b3ba77a657659da34ca5e146e049dd03d31\nartifact_zip_sha256=ae4acc458786c68a4e2e10a0d14c920dd0433caaf68ac8deefdc747b1bf2e817\n' > authority.txt

      - name: Build visual contact sheets and video frames
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg
          mkdir -p packet/thumbs packet/video-frames packet/text
          while IFS= read -r f; do
            rel="${f#proof/}"
            key="$(printf '%s' "$rel" | sha256sum | cut -c1-16)"
            convert "$f" -auto-orient -thumbnail '480x480>' -background black -gravity south -splice 0x42 -fill white -pointsize 16 -annotate +0+10 "$rel" "packet/thumbs/${key}.jpg" || true
          done < image-files.txt
          while IFS= read -r f; do
            rel="${f#proof/}"
            key="$(printf '%s' "$rel" | sha256sum | cut -c1-16)"
            ffmpeg -hide_banner -loglevel error -i "$f" -vf "fps=1/5,scale=480:-2" -frames:v 12 "packet/video-frames/${key}-%02d.jpg" || true
          done < video-files.txt
          find packet/thumbs packet/video-frames -type f -name '*.jpg' | sort > montage-input.txt
          if test -s montage-input.txt; then
            split -l 80 montage-input.txt packet/chunk-
            for chunk in packet/chunk-*; do
              montage @"$chunk" -tile 5x -geometry 480x480+8+8 "${chunk}.jpg"
              rm "$chunk"
            done
          fi
          while IFS= read -r f; do
            rel="${f#proof/}"
            key="$(printf '%s' "$rel" | sha256sum | cut -c1-16)"
            head -c 200000 "$f" > "packet/text/${key}.txt" || true
          done < evidence-files.txt
          cp authority.txt artifact-inventory.tsv image-files.txt video-files.txt evidence-files.txt packet/
          du -ah packet | sort -h > packet/packet-sizes.txt

      - name: Upload bounded inspection packet
        uses: actions/upload-artifact@v4
        with:
          name: home-artifact-inspection-51db7b3b
          path: packet
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
