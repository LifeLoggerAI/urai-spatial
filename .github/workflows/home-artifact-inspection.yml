name: Home Artifact Inspection Packet

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/home-artifact-inspection.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect-home-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download exact retained artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/LifeLoggerAI/urai-spatial/actions/artifacts/8717996891/zip > home-proof.zip
          test "$(stat -c%s home-proof.zip)" -eq 573255456
          echo "ae4acc458786c68a4e2e10a0d14c920dd0433caaf68ac8deefdc747b1bf2e817  home-proof.zip" | sha256sum -c -
          mkdir proof
          unzip -q home-proof.zip -d proof

      - name: Build bounded inspection packet
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick ffmpeg
          mkdir -p packet/thumbs packet/video-frames packet/text
          find proof -type f -printf '%P\t%s\n' | sort > packet/artifact-inventory.tsv
          printf 'artifact_id=8717996891\nartifact_sha=51db7b3ba77a657659da34ca5e146e049dd03d31\nartifact_zip_sha256=ae4acc458786c68a4e2e10a0d14c920dd0433caaf68ac8deefdc747b1bf2e817\n' > packet/authority.txt
          while IFS= read -r -d '' f; do
            rel="${f#proof/}"
            key="$(printf '%s' "$rel" | sha256sum | cut -c1-16)"
            convert "$f" -auto-orient -thumbnail '720x720>' -quality 82 "packet/thumbs/${key}.jpg" || true
            printf '%s\t%s\n' "$key" "$rel" >> packet/image-map.tsv
          done < <(find proof -type f -iregex '.*\.\(png\|jpg\|jpeg\|webp\|gif\)' -print0)
          while IFS= read -r -d '' f; do
            rel="${f#proof/}"
            key="$(printf '%s' "$rel" | sha256sum | cut -c1-16)"
            ffmpeg -hide_banner -loglevel error -i "$f" -vf "fps=1/4,scale=720:-2" -frames:v 15 "packet/video-frames/${key}-%02d.jpg" || true
            printf '%s\t%s\n' "$key" "$rel" >> packet/video-map.tsv
          done < <(find proof -type f -iregex '.*\.\(webm\|mp4\|mov\)' -print0)
          while IFS= read -r -d '' f; do
            rel="${f#proof/}"
            key="$(printf '%s' "$rel" | sha256sum | cut -c1-16)"
            head -c 300000 "$f" > "packet/text/${key}.txt" || true
            printf '%s\t%s\n' "$key" "$rel" >> packet/text-map.tsv
          done < <(find proof -type f -iregex '.*\.\(json\|txt\|md\|log\|html\)' -print0)
          find packet -type f -printf '%P\t%s\n' | sort > packet/packet-inventory.tsv
          du -sb packet > packet/packet-size.txt

      - name: Upload bounded inspection packet
        uses: actions/upload-artifact@v4
        with:
          name: home-artifact-inspection-51db7b3b
          path: packet
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
