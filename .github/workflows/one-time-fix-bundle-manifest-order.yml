name: One-time fix bundle manifest global order

on:
  push:
    branches:
      - release/fix-bundle-manifest-global-order-20260714
    paths:
      - '.github/workflows/one-time-fix-bundle-manifest-order.yml'

permissions:
  contents: write

concurrency:
  group: one-time-fix-bundle-manifest-global-order-20260714
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact isolated branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/fix-bundle-manifest-global-order-20260714
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
      - name: Prove isolated base and one helper file
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/fix-bundle-manifest-global-order-20260714'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = '4b37a5ed41a059e56b9705661db6c8074d06c247'
          changed="$(git diff --name-only 4b37a5ed41a059e56b9705661db6c8074d06c247 HEAD)"
          test "$changed" = '.github/workflows/one-time-fix-bundle-manifest-order.yml'
      - name: Align producer and verifier global path ordering
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('scripts/create-static-release-bundle.mjs'),
              Path('scripts/live-release.mjs'),
          ]
          old = '  return files\n'
          new = '  return files.sort((left, right) => left.relative.localeCompare(right.relative))\n'
          for file in files:
              source = file.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f'{file}: expected exactly one unsorted file-walk return')
              file.write_text(source.replace(old, new))

          test_path = Path('urai-tier1/tests/exact-static-release-contract.test.mjs')
          source = test_path.read_text()
          marker = "test('build, authority attestation, and protected deploy are separate jobs', () => {"
          if source.count(marker) != 1:
              raise SystemExit('test insertion marker drifted')
          regression = r'''test('bundle producer and verifier use one global manifest path order', () => {
            const marker = 'return files.sort((left, right) => left.relative.localeCompare(right.relative))'
            assert.ok(bundleBuilder.includes(marker), 'bundle attester must globally sort paths')
            assert.ok(operator.includes(marker), 'bundle verifier must globally sort paths')
          })

          '''
          if 'bundle producer and verifier use one global manifest path order' in source:
              raise SystemExit('global-order regression already exists')
          test_path.write_text(source.replace(marker, regression + marker))
          PY
          git diff --check
      - name: Run focused release and security contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/exact-static-release-contract.test.mjs
          node scripts/audit-production-workflow-authority.mjs
          node scripts/verify-production-action-pins.mjs
          node scripts/verify-release-security-path-guard.mjs
          git diff --check
      - name: Commit exact permanent repair files
        shell: bash
        run: |
          set -euo pipefail
          git add scripts/create-static-release-bundle.mjs scripts/live-release.mjs urai-tier1/tests/exact-static-release-contract.test.mjs
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' 'scripts/create-static-release-bundle.mjs' 'scripts/live-release.mjs' 'urai-tier1/tests/exact-static-release-contract.test.mjs' | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git config user.name 'LifeLoggerAI'
          git config user.email '215797546+LifeLoggerAI@users.noreply.github.com'
          git commit -m 'Align bundle manifest global path ordering'
          git push origin HEAD:release/fix-bundle-manifest-global-order-20260714
