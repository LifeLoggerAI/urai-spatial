name: AAA Asset Governance

on:
  pull_request:
    paths:
      - 'operations/assets/**'
      - 'urai-tier1/public/assets/urai/generated/fallbacks/**'
      - 'urai-tier1/public/assets/urai/generated/haptics/**'
      - 'scripts/verify-aaa-asset-governance.mjs'
      - '.github/workflows/aaa-asset-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact clean candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-aaa-asset-governance.mjs
