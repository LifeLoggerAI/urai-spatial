name: AAA Asset Governance

on:
  pull_request:
    paths:
      - 'operations/assets/**'
      - 'urai-tier1/public/assets/urai/generated/fallbacks/**'
      - 'urai-tier1/public/assets/urai/generated/haptics/**'
      - 'scripts/verify-aaa-asset-governance.mjs'
      - 'scripts/verify-asset-authority-consistency.mjs'
      - 'tests/asset-authority-consistency.test.mjs'
      - 'urai-tier1/src/spatial/assets/assetManifest.ts'
      - 'urai-tier1/src/spatial/assets/assetPromotionState.ts'
      - 'urai-tier1/src/spatial/**'
      - 'urai-tier1/src/app/**'
      - 'urai-tier1/tests/sensory-asset-resolution-contract.test.mjs'
      - 'docs/release-evidence/SPATIAL_ASSET_COMPLETION_LEDGER_2026-08-01.json'
      - 'operations/assets/production-sensory-asset-receipt.json'
      - '.github/workflows/aaa-asset-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact clean candidate identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test asset authority consistency
        run: node --test tests/asset-authority-consistency.test.mjs
      - name: Verify asset authority consistency
        run: node scripts/verify-asset-authority-consistency.mjs
      - name: Verify AAA asset governance
        run: node scripts/verify-aaa-asset-governance.mjs
