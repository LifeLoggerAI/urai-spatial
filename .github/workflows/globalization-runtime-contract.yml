name: URAI Globalization Runtime Contract

on:
  pull_request:
    paths:
      - 'urai-tier1/src/i18n/**'
      - 'urai-tier1/src/app/layout.tsx'
      - 'urai-tier1/tests/i18n-runtime-contract.test.mjs'
      - '.github/workflows/globalization-runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  globalization-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Verify 20-locale runtime contract
        run: node --import tsx --test urai-tier1/tests/i18n-runtime-contract.test.mjs

      - name: Typecheck exact candidate
        run: pnpm typecheck

      - name: Build exact candidate
        run: pnpm build

      - name: Prove final exact clean source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
