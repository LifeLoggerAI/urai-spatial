name: Beta Execution Control

on:
  pull_request:
    paths:
      - '.github/workflows/beta-execution-control.yml'
      - 'docs/founder-readiness/BETA_EXECUTION_CONTROL.md'
      - 'docs/founder-readiness/BETA_TESTER_PACKET.md'
      - 'release/beta-execution-state.json'
      - 'scripts/verify-beta-execution-control.mjs'
      - '.github/ISSUE_TEMPLATE/beta-feedback.yml'
      - '.github/ISSUE_TEMPLATE/beta-bug.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/beta-execution-control.yml'
      - 'docs/founder-readiness/BETA_EXECUTION_CONTROL.md'
      - 'docs/founder-readiness/BETA_TESTER_PACKET.md'
      - 'release/beta-execution-state.json'
      - 'scripts/verify-beta-execution-control.mjs'
      - '.github/ISSUE_TEMPLATE/beta-feedback.yml'
      - '.github/ISSUE_TEMPLATE/beta-bug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-execution-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prove exact clean head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify beta execution control
        run: |
          node --check scripts/verify-beta-execution-control.mjs
          node scripts/verify-beta-execution-control.mjs
