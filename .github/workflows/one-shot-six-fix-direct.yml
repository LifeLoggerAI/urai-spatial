name: One-shot bounded six-fix direct repair

on:
  pull_request:
    types: [synchronize]
    branches:
      - feat/home-ground-lifemap-art-bible-convergence-20260718
    paths:
      - .github/workflows/one-shot-six-fix-direct.yml
      - docs/verification/TRIGGER_CANONICAL_SIX_FIX_DIRECT.md

permissions:
  contents: write

concurrency:
  group: one-shot-six-fix-direct-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 788 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/canonical-six-fix-direct-1d172afd-20260718'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      TARGET_BRANCH: fix/canonical-six-fix-direct-1d172afd-20260718
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Guard exact base and apply repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 1d172afdce8ce1e0b70152b62892dace4cf06fab HEAD
          test "$(git diff --name-only 1d172afdce8ce1e0b70152b62892dace4cf06fab...HEAD | sort)" = "$(printf '%s\n' .github/workflows/one-shot-six-fix-direct-push.yml .github/workflows/one-shot-six-fix-direct.yml docs/verification/TRIGGER_CANONICAL_SIX_FIX_DIRECT.md scripts/one-shot-six-fix-direct.mjs | sort)"
          node scripts/one-shot-six-fix-direct.mjs
          git diff --check
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Unit contracts
        run: pnpm --dir urai-tier1 test
      - name: Typecheck
        run: pnpm --dir urai-tier1 typecheck
      - name: Build exact candidate
        run: pnpm --dir urai-tier1 build
      - name: Install Chromium
        run: pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Focused browser evidence
        run: |
          pnpm --dir urai-tier1 exec playwright test tests/accessibility-performance-evidence.spec.ts tests/accessibility-performance-lifemap-independent.spec.ts --project=chromium --grep "mobile visible controls stay inside the visual viewport and safe area|reduced motion keeps selection and unwind behavior equivalent"
      - name: Prove bounded final tree and rewrite branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/urai-six-fix/urai-tier1/src/app /tmp/urai-six-fix/urai-tier1/src/components/lifemap /tmp/urai-six-fix/urai-tier1/src/spatial/navigation
          cp urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx /tmp/urai-six-fix/urai-tier1/src/app/
          cp urai-tier1/src/app/GroundSpatialWorldClean.tsx /tmp/urai-six-fix/urai-tier1/src/app/
          cp urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx /tmp/urai-six-fix/urai-tier1/src/components/lifemap/
          cp urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx /tmp/urai-six-fix/urai-tier1/src/spatial/navigation/
          git checkout --detach 1d172afdce8ce1e0b70152b62892dace4cf06fab
          cp /tmp/urai-six-fix/urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/
          cp /tmp/urai-six-fix/urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/app/
          cp /tmp/urai-six-fix/urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/components/lifemap/
          cp /tmp/urai-six-fix/urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx urai-tier1/src/spatial/navigation/
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(spatial): close bounded accessibility and runtime defects"
          git push --force-with-lease=refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD origin HEAD:refs/heads/$TARGET_BRANCH
