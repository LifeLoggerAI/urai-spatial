name: Apply post-613 review fixes

on:
  push:
    branches:
      - fix/post613-premium-world-review-20260715
    paths:
      - .github/workflows/apply-post613-review-fixes.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-post613-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-post613-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/post613-premium-world-review-20260715
          fetch-depth: 0
      - name: Apply exact reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one target, found {count}')
              return text.replace(old, new, 1)

          home_path = Path('urai-tier1/src/app/HomeSpatialCanvas.tsx')
          home = home_path.read_text()
          home = replace_once(
              home,
              "      camera.fov = mobile ? 58 : 50\n    }\n    camera.lookAt(0, 1.35, -2.25)\n    camera.updateProjectionMatrix()",
              "      camera.fov = mobile ? 58 : 50\n      camera.updateProjectionMatrix()\n    }\n    camera.lookAt(0, 1.35, -2.25)",
              'camera projection safety',
          )
          home = replace_once(
              home,
              "          <group key={`path-${portal.id}`}>",
              "          <group key={`path-${portal.id}`} position={[x, 0, z]} rotation={[0, angle, 0]}>",
              'Home path parent transform',
          )
          home = replace_once(
              home,
              "            <mesh position={[x, 0.012, z]} rotation={[0, angle, 0]} receiveShadow>",
              "            <mesh position={[0, 0.012, 0]} receiveShadow>",
              'Home path surface transform',
          )
          home = replace_once(
              home,
              "            <mesh position={[x, 0.05, z]} rotation={[0, angle, 0]}>",
              "            <mesh position={[0, 0.05, 0]}>",
              'Home path light transform',
          )
          home_path.write_text(home)

          ground_path = Path('urai-tier1/src/app/GroundSpatialWorldClean.tsx')
          ground = ground_path.read_text()
          ground = replace_once(
              ground,
              '    const x = district.position[0] * 0.48',
              '    const x = district.position[0] * 0.5',
              'Ground path midpoint',
          )
          ground = replace_once(
              ground,
              '      <OrbitControls enablePan={false} enableZoom enableDamping dampingFactor={0.06}',
              '      <OrbitControls makeDefault enablePan={false} enableZoom enableDamping dampingFactor={0.06}',
              'Ground default controls',
          )
          ground_path.write_text(ground)

          Path('.github/workflows/apply-post613-review-fixes.yml').unlink()
          PY
      - name: Verify exact repair surface
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' '.github/workflows/apply-post613-review-fixes.yml' 'urai-tier1/src/app/GroundSpatialWorldClean.tsx' 'urai-tier1/src/app/HomeSpatialCanvas.tsx' | sort)"
          test "$changed" = "$expected"
          grep -Fq 'camera.updateProjectionMatrix()' urai-tier1/src/app/HomeSpatialCanvas.tsx
          grep -Fq 'position={[x, 0, z]} rotation={[0, angle, 0]}' urai-tier1/src/app/HomeSpatialCanvas.tsx
          grep -Fq 'const x = district.position[0] * 0.5' urai-tier1/src/app/GroundSpatialWorldClean.tsx
          grep -Fq '<OrbitControls makeDefault enablePan={false}' urai-tier1/src/app/GroundSpatialWorldClean.tsx
          ! grep -Fq 'const x = district.position[0] * 0.48' urai-tier1/src/app/GroundSpatialWorldClean.tsx
      - name: Commit exact corrections and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix premium Home and Ground review findings'
          git push origin HEAD:fix/post613-premium-world-review-20260715
