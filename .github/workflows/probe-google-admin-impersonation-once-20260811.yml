name: Probe Google Admin Impersonation Once 2026-08-11

on:
  push:
    branches:
      - ops/urai-spatial-wif-var-audit-20260811
    paths:
      - '.github/workflows/probe-google-admin-impersonation-once-20260811.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: probe-google-admin-impersonation-once-20260811
  cancel-in-progress: false

env:
  TARGET_PROJECT: urai-4dc1d

jobs:
  probe:
    name: Probe existing short-lived admin impersonation path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate legacy credential metadata privately
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" | jq -e '.project_id == "urai-4dc1d" and (.client_email | type == "string" and length > 0)' >/dev/null

      - name: Authenticate legacy identity for read-only IAM discovery
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ env.TARGET_PROJECT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.TARGET_PROJECT }}
          version: '>= 500.0.0'

      - name: Identify project-local admin candidates and probe impersonation
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/urai-admin-probe"
          mkdir -p "$d"

          gcloud projects get-iam-policy "$TARGET_PROJECT" --format=json > "$d/project-iam.json"
          gcloud iam service-accounts list --project "$TARGET_PROJECT" --format=json > "$d/service-accounts.json"

          jq -n \
            --slurpfile iam "$d/project-iam.json" \
            --slurpfile sas "$d/service-accounts.json" '
              ($sas[0] | map(.email) | map(select(. != null))) as $local |
              [
                $iam[0].bindings[]? as $b |
                select($b.role == "roles/owner" or $b.role == "roles/iam.serviceAccountAdmin" or $b.role == "roles/iam.serviceAccountKeyAdmin") |
                $b.members[]? |
                select(startswith("serviceAccount:")) |
                sub("^serviceAccount:"; "") as $email |
                select($local | index($email)) |
                {email:$email, role:$b.role}
              ] |
              group_by(.email) |
              map({email:.[0].email, projectRoles:(map(.role) | unique | sort)})
            ' > "$d/candidates.json"

          : > "$d/results.ndjson"
          idx=0
          while IFS= read -r email; do
            [ -n "$email" ] || continue
            idx=$((idx + 1))
            ok=false
            if gcloud auth print-access-token \
                --impersonate-service-account="$email" \
                --project "$TARGET_PROJECT" \
                >/dev/null 2>"$d/impersonate-$idx.err"; then
              ok=true
            fi
            roles="$(jq -c --arg email "$email" '.[] | select(.email == $email) | .projectRoles' "$d/candidates.json")"
            jq -nc \
              --arg email "$email" \
              --argjson roles "$roles" \
              --argjson ok "$ok" \
              '{email:$email, projectRoles:$roles, impersonationSucceeded:$ok}' \
              >> "$d/results.ndjson"
          done < <(jq -r '.[].email' "$d/candidates.json")

          if [ -s "$d/results.ndjson" ]; then
            jq -s '.' "$d/results.ndjson" > "$d/results.json"
          else
            printf '[]\n' > "$d/results.json"
          fi

          jq -n \
            --arg recordedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg projectId "$TARGET_PROJECT" \
            --slurpfile results "$d/results.json" '
              {
                schemaVersion:"urai-google-admin-impersonation-probe-2",
                recordedAt:$recordedAt,
                projectId:$projectId,
                mutationPerformed:false,
                longLivedCredentialCreated:false,
                accessTokenRecorded:false,
                candidateCount:($results[0] | length),
                successfulImpersonationCount:([$results[0][] | select(.impersonationSucceeded == true)] | length),
                candidates:$results[0]
              }
            ' > "$d/receipt.json"

          echo "receipt=$d/receipt.json" >> "$GITHUB_OUTPUT"

      - name: Report sanitized probe result
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          RECEIPT_PATH: ${{ steps.probe.outputs.receipt }}
        with:
          script: |
            const fs = require('fs')
            let body
            if (!process.env.RECEIPT_PATH || !fs.existsSync(process.env.RECEIPT_PATH)) {
              body = [
                '## URAI existing admin impersonation probe retry',
                '',
                '- Result: **NO RECEIPT**',
                '- Mutation performed: **false**',
                '- Token values recorded: **false**',
                `- Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n')
            } else {
              const r = JSON.parse(fs.readFileSync(process.env.RECEIPT_PATH, 'utf8'))
              const candidates = (r.candidates || []).map(x => `- \`${x.email}\` — impersonation: **${x.impersonationSucceeded}** — project roles: ${x.projectRoles.join(', ') || 'none'}`).join('\n') || '- none'
              body = [
                '## URAI existing admin impersonation probe retry',
                '',
                `- Project-local key-admin/owner candidates: **${r.candidateCount}**`,
                `- Existing short-lived impersonation paths that succeeded: **${r.successfulImpersonationCount}**`,
                '',
                candidates,
                '',
                '- Mutation performed: **false**',
                '- No IAM changes, key deletion, long-lived key creation, or deployment occurred.',
                '- No access token, private key, key ID, or provider secret was recorded.',
                `- Workflow run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n')
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'URAI existing Google admin impersonation probe retry',
              body,
            })

      - name: Remove temporary discovery material
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/urai-admin-probe"
