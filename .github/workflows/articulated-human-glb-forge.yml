name: URAI Articulated Human GLB Forge

on:
  pull_request:
    branches: [main, agent/real-world-human-pass]
    paths:
      - scripts/generate-urai-articulated-humans-v1.py
      - .github/workflows/articulated-human-glb-forge.yml
      - urai-tier1/src/spatial/council/CouncilRealm.tsx
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: articulated-human-glb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  URAI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PR_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

jobs:
  forge:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'

      - name: Install deterministic GLB dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 trimesh==4.11.1

      - name: Generate articulated human GLBs
        run: python scripts/generate-urai-articulated-humans-v1.py

      - name: Validate animation and receipt contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, struct

          root = pathlib.Path('urai-tier1/public/assets/urai/generated/articulated-humans-v1')
          receipt_path = pathlib.Path('operations/assets/generated-receipts/urai-articulated-humans-v1.json')
          receipt = json.loads(receipt_path.read_text())
          assert receipt['packId'] == 'urai-articulated-humans-v1'
          assert receipt['cameraAspect'] == '5:4'
          assert receipt['units'] == 'meters'
          assert receipt['authority']['selectedProduction'] is False
          assert receipt['authority']['smoothSkinningGate'] == 'pending'
          assert len(receipt['models']) == 6
          expected = ['Idle', 'Listen', 'Speak', 'GuideGesture']

          for model in receipt['models']:
              path = root / model['file']
              data = path.read_bytes()
              magic, version, total = struct.unpack_from('<III', data, 0)
              assert magic == 0x46546C67 and version == 2 and total == len(data), model
              assert hashlib.sha256(data).hexdigest() == model['sha256'], model
              assert model['bytes'] == len(data) and model['bytes'] >= 250000, model
              assert model['nodes'] >= 40 and model['meshes'] >= 25, model
              assert model['animations'] == expected, model

              json_len, json_type = struct.unpack_from('<II', data, 12)
              assert json_type == 0x4E4F534A
              doc = json.loads(data[20:20+json_len].decode('utf-8').rstrip(' \x00'))
              assert [clip['name'] for clip in doc.get('animations', [])] == expected
              for clip in doc['animations']:
                  for channel in clip['channels']:
                      target = channel['target']
                      assert target['path'] in {'rotation', 'scale', 'translation'}
                      node = doc['nodes'][target['node']]
                      assert 'matrix' not in node, (model['file'], clip['name'], node.get('name'))
                      assert 'translation' in node or target['path'] != 'rotation' or node.get('name')

          print(json.dumps({'ok': True, 'models': 6, 'animationsPerModel': expected, 'smoothSkinningGate': 'pending'}, indent=2))
          PY

      - name: Commit exact generated binaries
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain --untracked-files=all -- urai-tier1/public/assets/urai/generated/articulated-humans-v1 operations/assets/generated-receipts/urai-articulated-humans-v1.json)" ]; then
            echo 'Articulated human binaries already match the deterministic forge.'
            exit 0
          fi
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [ "$current_head" != "$URAI_SOURCE_SHA" ]; then
            echo "Stale articulated forge input: current PR head is $current_head; refusing to push from $URAI_SOURCE_SHA"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/public/assets/urai/generated/articulated-humans-v1 operations/assets/generated-receipts/urai-articulated-humans-v1.json
          git commit -m 'Forge articulated Council human GLBs'
          gh auth setup-git
          git push origin "HEAD:${PR_BRANCH}"
