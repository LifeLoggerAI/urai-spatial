name: Inspect production bootstrap status

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-production-bootstrap-status.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MERGE_SHA: 4b37a5ed41a059e56b9705661db6c8074d06c247
    steps:
      - name: Checkout exact inspector candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          show-progress: false
      - name: Query dispatcher and protected production runs
        id: query
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/production-bootstrap-status"
          mkdir -p "$out"
          headers=(
            --header 'Accept: application/vnd.github+json'
            --header "Authorization: Bearer $GH_TOKEN"
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/one-time-production-bootstrap-dispatch.yml/runs?branch=main&event=push&per_page=20" \
            > "$out/dispatcher-runs.json"
          curl --fail --silent --show-error "${headers[@]}" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/spatial-live-deploy.yml/runs?branch=main&event=workflow_dispatch&per_page=20" \
            > "$out/production-runs.json"
          OUT_DIR="$out" node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const out = process.env.OUT_DIR
          const mergeSha = process.env.MERGE_SHA
          const read = name => JSON.parse(fs.readFileSync(path.join(out, name), 'utf8'))
          const select = payload => (payload.workflow_runs || []).find(run => run.head_sha === mergeSha) || null
          const compact = run => run && ({
            id: run.id,
            name: run.name,
            event: run.event,
            status: run.status,
            conclusion: run.conclusion,
            runNumber: run.run_number,
            runAttempt: run.run_attempt,
            headSha: run.head_sha,
            createdAt: run.created_at,
            updatedAt: run.updated_at,
            htmlUrl: run.html_url,
            jobsUrl: run.jobs_url,
            artifactsUrl: run.artifacts_url,
          })
          const dispatcher = select(read('dispatcher-runs.json'))
          const production = select(read('production-runs.json'))
          const report = {
            schemaVersion: 'urai-production-bootstrap-status-1',
            inspectedAt: new Date().toISOString(),
            repository: process.env.GITHUB_REPOSITORY,
            mergeSha,
            dispatcher: compact(dispatcher),
            production: compact(production),
          }
          fs.writeFileSync(path.join(out, 'report.partial.json'), JSON.stringify(report, null, 2) + '\n')
          fs.writeFileSync(path.join(out, 'production-run-id.txt'), production ? String(production.id) : '')
          if (!dispatcher) process.exitCode = 11
          NODE
          production_id="$(cat "$out/production-run-id.txt")"
          if test -n "$production_id"; then
            curl --fail --silent --show-error "${headers[@]}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$production_id/jobs?per_page=100" \
              > "$out/production-jobs.json"
            curl --fail --silent --show-error "${headers[@]}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$production_id/pending_deployments" \
              > "$out/pending-deployments.json"
            curl --fail --silent --show-error "${headers[@]}" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$production_id/artifacts?per_page=100" \
              > "$out/production-artifacts.json"
          else
            printf '{"total_count":0,"jobs":[]}\n' > "$out/production-jobs.json"
            printf '[]\n' > "$out/pending-deployments.json"
            printf '{"total_count":0,"artifacts":[]}\n' > "$out/production-artifacts.json"
          fi
          OUT_DIR="$out" node - <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const out = process.env.OUT_DIR
          const report = JSON.parse(fs.readFileSync(path.join(out, 'report.partial.json'), 'utf8'))
          const jobs = JSON.parse(fs.readFileSync(path.join(out, 'production-jobs.json'), 'utf8'))
          const pending = JSON.parse(fs.readFileSync(path.join(out, 'pending-deployments.json'), 'utf8'))
          const artifacts = JSON.parse(fs.readFileSync(path.join(out, 'production-artifacts.json'), 'utf8'))
          report.productionJobs = (jobs.jobs || []).map(job => ({
            id: job.id,
            name: job.name,
            status: job.status,
            conclusion: job.conclusion,
            startedAt: job.started_at,
            completedAt: job.completed_at,
            htmlUrl: job.html_url,
            steps: (job.steps || []).map(step => ({ name: step.name, status: step.status, conclusion: step.conclusion, number: step.number })),
          }))
          report.pendingDeployments = (pending || []).map(item => ({
            environment: item.environment && item.environment.name,
            environmentUrl: item.environment && item.environment.html_url,
            waitTimer: item.wait_timer,
            waitTimerStartedAt: item.wait_timer_started_at,
            reviewers: item.reviewers,
          }))
          report.productionArtifacts = (artifacts.artifacts || []).map(item => ({
            id: item.id,
            name: item.name,
            expired: item.expired,
            createdAt: item.created_at,
            updatedAt: item.updated_at,
            expiresAt: item.expires_at,
            digest: item.digest,
          }))
          fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2) + '\n')
          console.log(JSON.stringify(report, null, 2))
          NODE
          echo "report_dir=$out" >> "$GITHUB_OUTPUT"
      - name: Upload read-only status receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-bootstrap-status-${{ env.MERGE_SHA }}
          path: ${{ steps.query.outputs.report_dir }}
          if-no-files-found: error
          retention-days: 30
