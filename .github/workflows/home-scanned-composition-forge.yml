# Owner-authored exact-head verifier for the current production sanctuary and integrated reliquary candidate.
name: Home Scanned Composition Verification

on:
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - "urai-tier1/src/spatial/world/persistentRealmAtmosphere.css"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - ".github/workflows/home-scanned-composition-forge.yml"
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - "urai-tier1/src/spatial/world/persistentRealmAtmosphere.css"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-scanned-composition-verification-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify materialized production Home composition and governed inputs
        shell: bash
        run: |
          set -euo pipefail
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          atmosphere='urai-tier1/src/spatial/world/persistentRealmAtmosphere.css'
          test -f urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb
          test -f urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb
          test -f operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F 'home-entry-chamber-v1.glb' "$source"
          grep -F 'polyhaven-fern-02-geometry-v1.glb' "$source"
          ! grep -F 'CINEMATIC_HOME_ART_MOBILE' "$source"
          grep -F 'monolithic-photographic-stone-court-v30-no-visible-tiling-grid' "$source"
          grep -F 'v41-integrated-authored-orb-sanctuary-production-candidate' "$source"
          grep -F 'v41-foundation-rooted-heavy-lateral-pier' "$source"
          grep -F 'v41-split-vault-shoulders-no-center-bridge' "$source"
          grep -F 'v41-recessed-foundation-sockets-no-platform' "$source"
          grep -F 'v41-open-center-no-spine-no-ring-no-pedestal' "$source"
          grep -F 'v41-governed-authored-orb-primary-architectural-hero' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v41-integrated-authored-orb-sanctuary"' "$source"
          grep -F 'data-home-final-art-revision="v41-integrated-authored-orb-sanctuary-production-candidate"' "$source"
          grep -F 'data-home-art-certification="v41-retained-pixel-candidate"' "$source"
          grep -F 'volumetric-fog-only-v24-no-transparent-depth-card' "$source"
          grep -F ".urai-world-atmosphere[data-realm='home'] .urai-world-atmosphere__horizon" "$atmosphere"
          ! grep -F '<SanctuaryShellMass' "$source"
          ! grep -F '<ReliquarySpine/>' "$source"
          ! grep -F '<torusGeometry' "$source"
          ! grep -F 'v40-open-apse-authored-orb-production-candidate' "$source"
          ! grep -F 'v40-open-apse-bearing-arch-no-solid-backplate' "$source"
          ! grep -F 'v40-floor-rooted-tapered-pier-no-bar-cage' "$source"
          ! grep -F 'v40-continuous-crown-seated-on-tapered-piers' "$source"
          ! grep -F 'v40-floor-piers-crown-without-cage-or-pedestal' "$source"
          ! grep -F 'v40-governed-authored-orb-primary-hero-inside-open-architectural-apse' "$source"
          ! grep -F '<SanctuaryCeiling />' "$source"
          ! grep -F '<FloorPanelJoints />' "$source"
          ! grep -F 'v39-recessed-bearing-machine-spine' "$source"
          ! grep -F 'v39-floor-to-vault-bearing-pier-no-floating-jaw' "$source"
          ! grep -F 'v39-structural-vault-crown-direct-pier-bearing' "$source"
          ! grep -F 'v39-recessed-floor-service-trench-no-plinth' "$source"
          ! grep -F 'v39-architectural-reliquary-machine' "$source"
          ! grep -F 'v39-direct-floor-pier-crown-bearing-frame' "$source"
          ! grep -F 'v39-governed-authored-core-inside-load-bearing-reliquary' "$source"
          ! grep -F 'v35-sanctuary-integrated-reliquary-service-frame' "$source"
          ! grep -F 'v35-segmented-reactor-column-inside-mechanical-reliquary' "$source"
          ! grep -F 'v34-sanctuary-scale-mechanical-reliquary-assembly' "$source"
          ! grep -F 'v34-segmented-spindle-reactor-integrated-with-cradle' "$source"
          ! grep -F 'v33-sanctuary-scale-angular-reliquary-machine' "$source"
          ! grep -F 'v32-sanctuary-scale-three-point-reliquary-machine' "$source"
          ! grep -F 'v31-sanctuary-scale-three-point-armored-reliquary-dock' "$source"
          ! grep -F 'v29-three-point-articulated-relic-dock' "$source"
          ! grep -F 'circleGeometry args={[0.92,128]}' "$source"
          ! grep -F 'compact-relic-bay-v23' "$source"
          ! grep -F 'home-orb-stabilizer-ring-1' "$source"

      - name: Verify scanned fern receipt identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = json.loads(Path('operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json').read_text())
          asset = Path(receipt['output'])
          assert asset.is_file(), asset
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          assert digest == receipt['outputSha256']
          assert digest == '9e3d29b1f917ec9f6e72f713fc7131f1d413ffecfbd3c96e7d72f92529f31a87'
          assert receipt['runtimeExternalRequests'] is False
          PY