# Owner-authored exact-head verifier for V44 monolithic reliquary production candidate.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-v44-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact V44 composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F 'v44-monolithic-reliquary-apse-production-candidate' "$source"
          grep -F 'v44-single-monolithic-asymmetric-reliquary-apse-no-detached-ceiling-slabs' "$source"
          grep -F 'v44-layered-recessed-machine-cavity-no-empty-black-void' "$source"
          grep -F 'v44-broad-floor-rooted-armor-yoke-no-spikes-no-feet' "$source"
          grep -F 'v44-no-black-platform-floor-remains-continuous' "$source"
          grep -F 'v44-authored-heart-filament-core-no-glass-petals-no-rings' "$source"
          grep -F 'scale={1.58}' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v44-monolithic-reliquary-apse"' "$source"
          grep -F 'data-home-final-art-revision="v44-monolithic-reliquary-apse-production-candidate"' "$source"
          grep -F 'data-home-art-certification="v44-retained-pixel-candidate"' "$source"
          ! grep -F '<coneGeometry' "$source"
          ! grep -F 'v43-relic-machine-open-vault-production-candidate' "$source"
