name: Home Scanned Composition Verification

on:
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - "urai-tier1/src/spatial/layout/HomeSanctuaryMaterials.tsx"
      - "urai-tier1/src/spatial/layout/HomeSanctuaryPerimeterGrove.tsx"
      - "urai-tier1/src/spatial/layout/homePerimeterGrovePlacement.ts"
      - "urai-tier1/tests/home-active-art-ci-contract.test.mjs"
      - ".github/workflows/home-scanned-composition-forge.yml"
  pull_request:
    branches: [main, 'repair/release-closure-integration-20261007']
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - "urai-tier1/src/spatial/layout/HomeSanctuaryMaterials.tsx"
      - "urai-tier1/src/spatial/layout/HomeSanctuaryPerimeterGrove.tsx"
      - "urai-tier1/src/spatial/layout/homePerimeterGrovePlacement.ts"
      - "urai-tier1/tests/home-active-art-ci-contract.test.mjs"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  URAI_EXACT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: home-scanned-composition-verification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"

      # SOURCE PROOF ONLY. A green job does not certify final Home pixels or asset promotion.
      - name: Verify materialized Home composition and governed inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb
          test -f urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb
          test -f operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json
          grep -F 'HomeWorldProductionPolished as HomeWorldProduction' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          grep -F 'HOME_SCANNED_COMPOSITION_V1' urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx
          grep -F 'home-entry-chamber-v1.glb' urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx
          grep -F 'polyhaven-fern-02-geometry-v1.glb' urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx
          ! grep -F 'CINEMATIC_HOME_ART_MOBILE' urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx
          grep -F 'HomeSanctuaryPerimeterGrove' urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx
          grep -F 'HOME_INTERPRETIVE_SPLAT_ASSET' urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx
          ! grep -F 'CinematicBackdrop' urai-tier1/src/spatial/layout/HomeWorldProductionPolished.tsx

      - name: Enforce active Home visual source identity (source-only)
        shell: bash
        run: node --test urai-tier1/tests/home-active-art-ci-contract.test.mjs

      - name: Verify scanned fern receipt identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = json.loads(Path('operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json').read_text())
          asset = Path(receipt['output'])
          assert asset.is_file(), asset
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          assert digest == receipt['outputSha256']
          assert digest == '9e3d29b1f917ec9f6e72f713fc7131f1d413ffecfbd3c96e7d72f92529f31a87'
          assert receipt['runtimeExternalRequests'] is False
          PY
