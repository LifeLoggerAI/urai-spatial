# Owner-authored exact-head verifier for the current asset-backed Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current production-asset composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"

          # V55 is the current owner-authored candidate; pixel certification remains separate.
          grep -F 'function ProductionSanctuary()' "$source"
          grep -F 'home-v49-scanned-detail-layer' "$source"
          grep -F "visualOwner:'cinematic-integrated-industrial-reliquary-v55'" "$source"
          grep -F "visualTreatment:'v55-integrated-industrial-orb-retained-pixel-rebuild'" "$source"
          grep -F "root.userData.uraiTreatment = 'v55-governed-orb-glb-retained-for-identity-and-animation-not-visible-glass-starburst'" "$source"
          grep -F 'v55-single-rear-sanctuary-shell-with-scanned-rock-returns-no-side-arch-corridor-no-torus-tunnel' "$source"
          grep -F 'v55-authored-industrial-pipe-bay-recessed-into-rear-shell-no-floating-load-bars' "$source"
          grep -F 'v55-scanned-asymmetric-rock-returns-and-practicals-no-repeated-side-arches-no-bollards' "$source"
          grep -F 'v55-recessed-wall-machine-seat-no-pedestal-no-floor-legs-no-disconnected-bars' "$source"
          grep -F 'v55-real-cc0-industrial-machine-core-integrated-in-rear-bay-no-starburst-no-floating-struts' "$source"
          grep -F 'home-v55-orb-machine-core-network' "$source"
          grep -F 'home-v55-visible-orb-aperture' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v55-integrated-industrial-reliquary"' "$source"
          grep -F 'data-home-final-art-revision="v55-integrated-industrial-reliquary-candidate"' "$source"
          grep -F 'data-home-art-certification="v55-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="integrated-industrial-v55-plus-governed-orb-identity"' "$source"

          # Retired literal-pixel failures must not own the current visible composition.
          ! grep -F "visualOwner:'cinematic-authored-relic-sanctuary-v54'" "$source"
          ! grep -F "visualTreatment:'v54-authored-relic-sanctuary-retained-pixel-rebuild'" "$source"
          ! grep -F 'v54-governed-authored-orb-is-primary-visible-relic-machine-no-polyhedron-shell-no-starburst-no-glass-sphere' "$source"
          ! grep -F 'v54-wall-integrated-rear-shoulder-cradle-no-pedestal-no-four-floor-legs' "$source"
          ! grep -F "visualOwner:'cinematic-integrated-arch-reliquary-v53'" "$source"
          ! grep -F 'v53-faceted-relic-shell-and-four-compact-machine-clamps' "$source"
          ! grep -F 'v50-six-plate-opaque-reliquary-armor-no-glass-ball-no-orbit-rings' "$source"
          ! grep -F 'v51-open-four-point-floor-rooted-load-paths-no-display-stand-no-panel-wings' "$source"
          ! grep -F 'v52-four-point-wide-floor-rooted-load-paths-integrated-with-large-orb-no-display-stand' "$source"

          ! grep -F '<ProductionOrbMachine />' "$source"
          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
