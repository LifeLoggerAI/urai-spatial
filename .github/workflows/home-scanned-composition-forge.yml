# Owner-authored exact-head trigger for the stabilized V31 integrated reliquary candidate.
name: Home Scanned Composition Verification

on:
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - ".github/workflows/home-scanned-composition-forge.yml"
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-scanned-composition-verification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify materialized Home composition and governed inputs
        shell: bash
        run: |
          set -euo pipefail
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          test -f urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb
          test -f urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb
          test -f operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F 'home-entry-chamber-v1.glb' "$source"
          grep -F 'polyhaven-fern-02-geometry-v1.glb' "$source"
          ! grep -F 'CINEMATIC_HOME_ART_MOBILE' "$source"
          grep -F 'monolithic-photographic-stone-court-v30-no-visible-tiling-grid' "$source"
          grep -F 'v31-finished-authored-sanctuary-no-pavilion-grid' "$source"
          grep -F 'v31-deep-rear-sanctuary-wall-with-asymmetric-threshold-chambers' "$source"
          grep -F 'v31-heavy-asymmetric-side-walls-buttresses-and-recesses' "$source"
          grep -F 'v31-structural-vault-ribs-terminate-in-wall-masses' "$source"
          grep -F 'v31-monumental-machine-apse-sanctuary-built-around-orb' "$source"
          grep -F 'foreground-midground-background-depth-and-material-separation' "$source"
          grep -F 'v30-roof-mass-rests-on-load-bearing-vault' "$source"
          grep -F 'v30-three-authored-expansion-seams-no-grid-read' "$source"
          grep -F 'v31-buried-rectilinear-machine-base-no-display-pedestal' "$source"
          grep -F 'v31-sanctuary-scale-three-point-armored-reliquary-dock' "$source"
          grep -F 'v31-heavy-housings-load-arms-contact-jaws-drive-collars-conduits-no-stem' "$source"
          grep -F 'v31-segmented-load-bearing-yoke-not-display-halo' "$source"
          grep -F 'v31-integrated-reliquary-sanctuary-final' "$source"
          grep -F 'volumetric-fog-only-v24-no-transparent-depth-card' "$source"
          ! grep -F 'v30-enclosed-authored-sanctuary-no-test-pavilion' "$source"
          ! grep -F 'v30-armored-socket-clamps-collars-conduits-no-center-stem' "$source"
          ! grep -F 'v30-segmented-reliquary-collar-not-display-halo' "$source"
          ! grep -F 'v29-curved-load-arms-contact-orb-no-pedestal-stem' "$source"
          ! grep -F 'v29-three-point-articulated-relic-dock' "$source"
          ! grep -F 'v29-canopy-is-vault-not-floating-bars' "$source"
          ! grep -F 'v28-authored-threshold-court-no-box-walls' "$source"
          ! grep -F 'v28-curved-machined-load-paths-attached-to-piers' "$source"
          ! grep -F 'v28-continuous-curved-rib-skylight-no-floating-bars' "$source"
          ! grep -F 'v27-authored-pier-and-recess-court' "$source"
          ! grep -F 'circleGeometry args={[0.92,128]}' "$source"
          ! grep -F 'compact-relic-bay-v23' "$source"
          ! grep -F 'home-orb-stabilizer-ring-1' "$source"
          grep -F 'home-orb-stabilizer-arc-a' "$source"
          grep -F 'home-orb-stabilizer-arc-b' "$source"
          grep -F 'home-orb-stabilizer-arc-c' "$source"

      - name: Verify scanned fern receipt identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = json.loads(Path('operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json').read_text())
          asset = Path(receipt['output'])
          assert asset.is_file(), asset
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          assert digest == receipt['outputSha256']
          assert digest == '9e3d29b1f917ec9f6e72f713fc7131f1d413ffecfbd3c96e7d72f92529f31a87'
          assert receipt['runtimeExternalRequests'] is False
          PY