# Owner-authored exact-head verifier for the current asset-backed Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current production-asset composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"

          # V57 requires committed photogrammetry and real industrial assets to own the visible composition.
          grep -F "visualOwner:'cinematic-photogrammetry-service-vault-v57'" "$source"
          grep -F "visualTreatment:'v57-photogrammetry-service-vault-retained-pixel-rebuild'" "$source"
          grep -F 'v57-overlapped-photogrammetry-rear-vault-no-rectangular-backboard-no-primitive-apse' "$source"
          grep -F 'home-v57-rear-rock-left' "$source"
          grep -F 'home-v57-rear-rock-right' "$source"
          grep -F 'home-v57-upper-rock-crown' "$source"
          grep -F 'home-v57-left-near-enclosure' "$source"
          grep -F 'home-v57-right-near-enclosure' "$source"
          grep -F 'v57-deep-real-industrial-service-network-without-flat-backboard-or-polygon-ring' "$source"
          grep -F 'home-v57-rear-service-network' "$source"
          grep -F 'home-v57-left-service-riser' "$source"
          grep -F 'home-v57-right-service-riser' "$source"
          grep -F 'v57-real-industrial-service-machine-depth-with-embedded-state-emitter-no-backboard-no-polygon-ring' "$source"
          grep -F 'home-v57-orb-machine-depth-frame' "$source"
          grep -F 'home-v57-orb-machine-emitter-housing' "$source"
          grep -F 'home-v57-orb-state-emitter' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v57-photogrammetry-service-vault"' "$source"
          grep -F 'data-home-final-art-revision="v57-photogrammetry-service-vault-candidate"' "$source"
          grep -F 'data-home-art-certification="v57-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="photogrammetry-service-v57-plus-governed-orb-identity"' "$source"

          # Rejected V56 visible owners/shapes must not survive.
          ! grep -F "visualOwner:'cinematic-wall-integrated-reliquary-v56'" "$source"
          ! grep -F "visualTreatment:'v56-wall-integrated-reliquary-retained-pixel-rebuild'" "$source"
          ! grep -F 'v56-left-tapered-load-bearing-sanctuary-return' "$source"
          ! grep -F 'v56-right-tapered-load-bearing-sanctuary-return' "$source"
          ! grep -F 'home-v56-recessed-service-network' "$source"
          ! grep -F 'home-v56-visible-orb-machine-core' "$source"
          ! grep -F "visualOwner:'cinematic-integrated-industrial-reliquary-v55'" "$source"
          ! grep -F 'home-v55-orb-machine-core-network' "$source"
          ! grep -F 'home-v55-visible-orb-aperture' "$source"

          ! grep -F '<ProductionOrbMachine />' "$source"
          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
