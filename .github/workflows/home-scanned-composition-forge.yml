# Owner-authored exact-head verifier for the current asset-backed Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current production-asset composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          # Preserve governed composition and hidden V48 compatibility provenance.
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"

          # Verify the current V51 open-reliquary composition.
          grep -F 'function ProductionSanctuary()' "$source"
          grep -F 'function ProductionOrbMachine()' "$source"
          grep -F 'home-v49-scanned-detail-layer' "$source"
          grep -F 'home-v49-authored-practicals' "$source"
          grep -F "visualOwner:'cinematic-open-reliquary-sanctuary-v51'" "$source"
          grep -F "visualTreatment:'v51-open-reliquary-retained-pixel-rebuild'" "$source"
          grep -F "root.userData.uraiTreatment = 'v51-authored-faceted-heart-with-small-opaque-machine-clamps'" "$source"
          grep -F 'v51-open-asymmetric-buttress-galleries-no-solid-house-blocks-no-repeated-bays' "$source"
          grep -F 'v51-open-layered-rear-shell-no-house-slabs-no-front-facade' "$source"
          grep -F 'v51-open-machine-bay-rear-ribs-and-depth-no-box-housing' "$source"
          grep -F 'v51-open-four-point-floor-rooted-load-paths-no-display-stand-no-panel-wings' "$source"
          grep -F 'v51-open-rear-yoke-and-service-crosshead-no-polygon-display-plate' "$source"
          grep -F 'v51-four-small-opaque-machine-clamps-authored-faceted-heart-remains-primary' "$source"
          grep -F 'home-v51-central-finished-stone-lane' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v51-open-reliquary"' "$source"
          grep -F 'data-home-final-art-revision="v51-open-reliquary-candidate"' "$source"
          grep -F 'data-home-art-certification="v51-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="open-reliquary-v51-plus-governed-living-orb"' "$source"

          # Explicitly reject the V50 forms that failed literal retained-pixel review.
          ! grep -F 'home-v47-left-apse-mass' "$source"
          ! grep -F 'home-v47-right-apse-mass' "$source"
          ! grep -F 'v50-six-plate-opaque-reliquary-armor-no-glass-ball-no-orbit-rings' "$source"

          # The old V48 pipe-machine helper may remain as provenance, but it must not own the visible scene.
          ! grep -F '<ProductionOrbMachine />' "$source"

          # Retained-pixel certification is a separate human visual gate and must not be asserted here.
          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
