# Owner-authored exact-head verifier for the current V112 Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx"
      - "urai-tier1/src/app/AssetDrivenHomeWorld.tsx"
      - "urai-tier1/src/app/FinalHomeWorld.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProduction.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProduction.module.css"
      - "urai-tier1/src/spatial/world/GroundGateway.tsx"
      - "urai-tier1/src/app/GroundSpatialWorldClean.tsx"
      - "urai-tier1/src/app/ground/GroundWorldModel.ts"
      - "urai-tier1/src/spatial/world/persistentRealmAtmosphere.css"
      - "urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx"
      - "urai-tier1/src/components/lifemap/LifeMapProductionWorld.tsx"
      - "operations/assets/home-v48-production-asset-provenance.json"
      - "operations/assets/third-party/home-photographic-pbr-v1.json"
      - "operations/assets/third-party/home-photographic-material-promotion-v16.json"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - "urai-tier1/public/assets/urai/home-production/cc0/**"
      - "scripts/capture-continuous-spatial-proof-v18.mjs"
      - "scripts/run-continuous-spatial-proof-v22-natural.mjs"
      - "urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs"
      - "urai-tier1/tests/home-relic-machine-realism-contract.test.mjs"
      - "urai-tier1/tests/home-v88-retained-pixel-repair-contract.test.mjs"
      - ".github/workflows/home-finalization-candidate-commit.yml"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx"
      - "urai-tier1/src/app/AssetDrivenHomeWorld.tsx"
      - "urai-tier1/src/app/FinalHomeWorld.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProduction.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProduction.module.css"
      - "urai-tier1/src/spatial/world/GroundGateway.tsx"
      - "urai-tier1/src/app/GroundSpatialWorldClean.tsx"
      - "urai-tier1/src/app/ground/GroundWorldModel.ts"
      - "urai-tier1/src/spatial/world/persistentRealmAtmosphere.css"
      - "urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx"
      - "urai-tier1/src/components/lifemap/LifeMapProductionWorld.tsx"
      - "operations/assets/home-v48-production-asset-provenance.json"
      - "operations/assets/third-party/home-photographic-pbr-v1.json"
      - "operations/assets/third-party/home-photographic-material-promotion-v16.json"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - "urai-tier1/public/assets/urai/home-production/cc0/**"
      - "scripts/capture-continuous-spatial-proof-v18.mjs"
      - "scripts/run-continuous-spatial-proof-v22-natural.mjs"
      - "urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs"
      - "urai-tier1/tests/home-relic-machine-realism-contract.test.mjs"
      - "urai-tier1/tests/home-v88-retained-pixel-repair-contract.test.mjs"
      - ".github/workflows/home-finalization-candidate-commit.yml"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current V112 visible governed relief composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          entry='urai-tier1/src/spatial/layout/HomeWorldProduction.tsx'
          runtime='urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx'
          art='urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx'

          grep -Fq 'HomeWorldProductionV70 as HomeWorldProduction' "$entry"
          grep -Fq "const GOVERNED_HOME = '/assets/urai/generated/models/home-entry-chamber-v1.glb'" "$art"
          grep -Fq 'home-v83-governed-open-sanctuary-environment' "$art"
          grep -Fq 'home-v83-authored-open-sanctuary' "$art"
          grep -Fq 'committed-governed-home-distant-architectural-relief' "$art"
          grep -Fq 'governed-home-source-visible-distant-relief-outside-approach-cameras' "$art"
          grep -Fq "successorVisualRepair: 'v112-reposition-and-rescale-governed-relief'" "$art"
          grep -Fq "approachVisibilityRepair: 'v112-visible-governed-relief-outside-approach-cameras'" "$art"
          grep -Fq 'root.position.set(0, -0.12, -20.8)' "$art"
          grep -Fq 'root.scale.setScalar(0.18)' "$art"
          grep -Fq 'for (const object of rejectedNodes) object.parent?.remove(object)' "$art"
          grep -Fq '<PortalStoneFrame destination={destination} textures={textures.shell} />' "$art"
          grep -Fq 'swarm.current.scale.setScalar(1.90 * breath)' "$art"
          grep -Fq 'const ORB = new THREE.Vector3(-0.28, 2.48, -6.18)' "$runtime"
          grep -Fq "const inspectionClearance = nearby === 'orb' ? (portrait ? 2.80 : 2.40) : nearby ? (portrait ? 2.10 : 1.65) : 0.10" "$runtime"

          ! grep -Eq '(root|object)\\.visible[[:space:]]*=[[:space:]]*false' "$art"
          ! grep -Fq 'PRODUCTION CERTIFIED' "$runtime"
          ! grep -Fq 'retained-pixel-pass' "$runtime"
          ! grep -Fq 'pixel-certified' "$runtime"

          node --input-type=commonjs <<'NODE'
          const { createHash } = require('node:crypto')
          const { existsSync, readFileSync, readdirSync } = require('node:fs')
          const path = require('node:path')

          const readJson = (file) => JSON.parse(readFileSync(file, 'utf8'))
          const v48ReceiptPath = 'operations/assets/home-v48-production-asset-provenance.json'
          const pbrReceiptPath = 'operations/assets/third-party/home-photographic-pbr-v1.json'
          const promotionPath = 'operations/assets/third-party/home-photographic-material-promotion-v16.json'
          const fernReceiptPath = 'operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json'
          const v48 = readJson(v48ReceiptPath)
          const pbr = readJson(pbrReceiptPath)
          const promotion = readJson(promotionPath)
          const fern = readJson(fernReceiptPath)
          if (v48.runtimeFetchesPolyHavenApi !== false || pbr.runtimeExternalRequests !== false || promotion.runtimeExternalRequests !== false || fern.runtimeExternalRequests !== false) {
            throw new Error('Home runtime asset receipts must remain locally vendored and network-independent')
          }
          if (promotion.sourceReceipt !== pbrReceiptPath) throw new Error('Home PBR promotion receipt is not bound to its source receipt')

          const recorded = new Map()
          const verifyRecord = (record) => {
            const repoPath = path.posix.normalize(record.path)
            if (recorded.has(repoPath)) throw new Error(`Duplicate runtime asset receipt entry: ${repoPath}`)
            if (!existsSync(repoPath)) throw new Error(`Missing runtime asset: ${repoPath}`)
            const bytes = readFileSync(repoPath)
            if (bytes.length !== record.bytes) throw new Error(`Runtime asset byte mismatch: ${repoPath}`)
            const digest = createHash('sha256').update(bytes).digest('hex')
            if (digest !== record.sha256) throw new Error(`Runtime asset SHA-256 mismatch: ${repoPath}`)
            recorded.set(repoPath, record)
          }

          for (const source of v48.sourceAssets) {
            for (const record of source.files) verifyRecord(record)
            const total = source.files.reduce((sum, record) => sum + record.bytes, 0)
            if (total !== source.totalBytes) throw new Error(`Receipt total mismatch: ${source.id}`)
            const entry = source.files.find((record) => record.path.endsWith('/asset.gltf'))
            if (!entry) throw new Error(`Missing GLTF entrypoint receipt: ${source.id}`)
            const gltf = readJson(entry.path)
            for (const uri of [
              ...(gltf.buffers || []).map((item) => item.uri),
              ...(gltf.images || []).map((item) => item.uri),
            ].filter(Boolean)) {
              if (/^(?:data:|https?:|\/\/)/i.test(uri)) throw new Error(`External or embedded GLTF dependency is not allowed: ${entry.path}`)
              const dependency = path.posix.normalize(path.posix.join(path.posix.dirname(entry.path), decodeURIComponent(uri)))
              if (!recorded.has(dependency)) throw new Error(`Unreceipted GLTF dependency: ${dependency}`)
            }
          }

          for (const record of Object.values(pbr.runtimeOptimization.runtimeFiles)) verifyRecord(record)
          for (const record of Object.values(pbr.files)) {
            if (existsSync(record.path)) verifyRecord(record)
          }
          verifyRecord(pbr.hdri)
          verifyRecord({ path: fern.output, bytes: fern.outputBytes, sha256: fern.outputSha256 })

          const cc0Root = 'urai-tier1/public/assets/urai/home-production/cc0'
          const walkFiles = (dir) => readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
            const target = path.posix.join(dir, entry.name)
            return entry.isDirectory() ? walkFiles(target) : [target]
          })
          const committedCc0Files = new Set(walkFiles(cc0Root))
          for (const file of committedCc0Files) {
            if (!recorded.has(file)) throw new Error(`Committed CC0 runtime asset lacks a receipt: ${file}`)
          }
          for (const file of recorded.keys()) {
            if (file.startsWith(`${cc0Root}/`) && !committedCc0Files.has(file)) {
              throw new Error(`Receipt points to a missing CC0 runtime asset: ${file}`)
            }
          }

          const runtimeSources = [
            'urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx',
            'urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx',
          ].map((sourcePath) => readFileSync(sourcePath, 'utf8')).join('\n')
          const runtimeUrls = new Set(
            [...runtimeSources.matchAll(/['"`](\/assets\/urai\/home-production\/cc0\/[^'"`]+)['"`]/g)]
              .map((match) => match[1]),
          )
          if (runtimeUrls.size === 0) throw new Error('No committed Home runtime assets were discovered')
          for (const runtimeUrl of runtimeUrls) {
            const repoPath = path.posix.join('urai-tier1/public', runtimeUrl.slice(1))
            if (!recorded.has(repoPath)) throw new Error(`Runtime asset lacks an exact receipt: ${runtimeUrl}`)
          }
          NODE

          (
            cd urai-tier1
            node --test \
              tests/home-ground-lifemap-art-bible-contract.test.mjs \
              tests/home-relic-machine-realism-contract.test.mjs \
              tests/home-v88-retained-pixel-repair-contract.test.mjs
          )
