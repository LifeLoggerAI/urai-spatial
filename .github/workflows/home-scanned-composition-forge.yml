name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - 'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx'
      - 'urai-tier1/src/app/AssetDrivenHomeWorld.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProduction.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV223.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV223Geometry.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV2.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx'
      - 'urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs'
      - 'urai-tier1/tests/home-relic-machine-realism-contract.test.mjs'
      - 'urai-tier1/tests/home-v88-retained-pixel-repair-contract.test.mjs'
      - 'urai-tier1/tests/embodied-exploration-contract.test.mjs'
      - 'operations/assets/home-v48-production-asset-provenance.json'
      - 'operations/assets/third-party/**'
      - 'urai-tier1/public/assets/urai/home-production/cc0/**'
      - '.github/workflows/home-scanned-composition-forge.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact V226 source and fail-closed candidate state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          grep -Fq 'HomeWorldProductionV223 as HomeWorldProduction' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          grep -Fq 'export function HomeWorldProductionV223' urai-tier1/src/spatial/layout/HomeWorldProductionV223.tsx
          grep -Fq "import {HomeV225PolishV3} from './HomeWorldProductionV225PolishV3'" urai-tier1/src/spatial/layout/HomeWorldProductionV223.tsx
          grep -Fq '<HomeV225PolishV3 orbState={p.orbState} reducedMotion={p.reducedMotion} onOrb={p.onOrb} onGround={p.onGround} onLifeMap={p.onLifeMap} onWalk={walk}/>' urai-tier1/src/spatial/layout/HomeWorldProductionV223.tsx
          grep -Fq 'home-v225-v2-continuous-sculpted-memory-valley' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV2.tsx
          grep -Fq 'home-v225-v2-authored-valley-floor' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV2.tsx
          grep -Fq 'home-v225-v2-grown-memory-walk' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV2.tsx
          grep -Fq 'home-v226-production-rooted-memory-sanctuary' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx
          grep -Fq 'home-v226-weathered-memory-banks' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx
          grep -Fq 'home-v226-rooted-inhabited-canopy' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx
          grep -Fq 'home-v226-ground-inhabited-hearth' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx
          grep -Fq 'home-v226-life-map-lineage-observatory' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx
          grep -Fq 'home-v226-root-cradle' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx
          grep -Fq 'home-v226-rooted-single-living-memory-presence' urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx
          grep -Fq "for (const version of ['76','125','126','176','219','220','221','222','223','224','225'])" urai-tier1/src/app/AssetDrivenHomeWorld.tsx
          grep -Fq "world.setAttribute('data-home-v226-certification', 'fresh-exact-head-pixels-required')" urai-tier1/src/app/AssetDrivenHomeWorld.tsx
          grep -Fq "world.setAttribute('data-home-v225-art-layer', 'superseded-v3-visual-owner')" urai-tier1/src/app/AssetDrivenHomeWorld.tsx
          grep -Fq "world.setAttribute('data-home-art-certification', 'fresh-exact-head-pixels-required')" urai-tier1/src/app/AssetDrivenHomeWorld.tsx
          grep -Fq 'HomeWorldProductionV225PolishV3.tsx' urai-tier1/src/app/AssetDrivenHomeWorld.tsx
          grep -Fq 'data-home-v226-retained-pixel-rebuild="active"' urai-tier1/src/app/AssetDrivenHomeWorld.tsx
          grep -Fq 'data-home-v225-retained-pixel-rebuild="superseded"' urai-tier1/src/app/AssetDrivenHomeWorld.tsx
          ! grep -Eq 'PRODUCTION CERTIFIED|retained-pixel-pass|pixel-certified' urai-tier1/src/app/AssetDrivenHomeWorld.tsx urai-tier1/src/spatial/layout/HomeWorldProductionV223.tsx urai-tier1/src/spatial/layout/HomeWorldProductionV223Geometry.tsx urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV2.tsx urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: { version: 10.0.0, run_install: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify current Home/Ground/Life Map contracts
        working-directory: urai-tier1
        run: |
          node --test --test-concurrency=1 tests/home-ground-lifemap-art-bible-contract.test.mjs
          node --test --test-concurrency=1 tests/home-relic-machine-realism-contract.test.mjs
          node --test --test-concurrency=1 tests/home-v88-retained-pixel-repair-contract.test.mjs
          node --test --test-concurrency=1 tests/embodied-exploration-contract.test.mjs
      - name: Verify committed asset provenance remains local and receipted
        shell: bash
        run: |
          set -euo pipefail
          test -f operations/assets/home-v48-production-asset-provenance.json
          test -f operations/assets/third-party/home-photographic-pbr-v1.json
          test -f operations/assets/third-party/home-photographic-material-promotion-v16.json
          node - <<'NODE'
          const fs=require('node:fs');
          for (const file of ['operations/assets/home-v48-production-asset-provenance.json','operations/assets/third-party/home-photographic-pbr-v1.json','operations/assets/third-party/home-photographic-material-promotion-v16.json']) {
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            if (data.runtimeExternalRequests === true || data.runtimeFetchesPolyHavenApi === true) throw new Error(`${file} permits runtime external fetches`);
          }
          NODE
      - name: Prove clean exact head
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
