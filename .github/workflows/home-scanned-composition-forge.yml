# Owner-authored exact-head verifier for the current asset-backed Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current production-asset composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          # Governed compatibility assets remain retained but never own visible pixels.
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"

          # V61 visible composition: deep continuous sanctuary vault and meter-deep integrated relic machine.
          grep -F "visualOwner:'deep-reliquary-vault-v61'" "$source"
          grep -F "visualTreatment:'v61-deep-reliquary-vault-retained-pixel-rebuild'" "$source"
          grep -F 'v61-deep-continuous-stone-vault-with-recessed-relic-bay' "$source"
          grep -F 'home-v61-left-integrated-geology' "$source"
          grep -F 'home-v61-right-integrated-geology' "$source"
          grep -F 'v61-meter-deep-stone-and-metal-reliquary-bay-no-flat-backboard' "$source"
          grep -F 'v61-deep-overlapping-relic-masses-with-real-parallax-no-plaques-no-rods' "$source"
          grep -F 'v61-recessed-state-core-inside-deep-load-bearing-relic-vault' "$source"
          grep -F 'home-v61-orb-state-slit' "$source"
          grep -F 'v61-governed-glb-animation-identity-retained-invisibly-for-state-contract' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v61-deep-reliquary-vault"' "$source"
          grep -F 'data-home-final-art-revision="v61-deep-reliquary-vault-candidate"' "$source"
          grep -F 'data-home-art-certification="v61-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="deep-reliquary-v61-plus-governed-orb-identity"' "$source"
          grep -F 'const SPAWN = new THREE.Vector3(4.45, 0.04, 3.15)' "$source"
          grep -F 'const DEFAULT_YAW = 0.435' "$source"
          grep -F 'const desiredFov=portrait?52:40' "$source"

          # Rejected visible grammars and primitive Orb shapes must not survive in the V61 visible blocks.
          orb_block="$(sed -n '/function SacredOrb/,/function HumanPresence/p' "$source")"
          machine_block="$(sed -n '/function RelicMass/,/function HumanPresence/p' "$source")"
          ! grep -F 'sphereGeometry' <<<"$orb_block"
          ! grep -F 'icosahedronGeometry' <<<"$orb_block"
          ! grep -F 'dodecahedronGeometry' <<<"$orb_block"
          ! grep -F 'torusGeometry' <<<"$orb_block"
          ! grep -F 'RoundedBox' <<<"$machine_block"
          ! grep -F 'TaperedLoadBeam' <<<"$machine_block"
          ! grep -F 'OrbArmorPlate' <<<"$machine_block"
          ! grep -F 'FacetedMachinePanel' <<<"$machine_block"
          ! grep -F '<ProductionOrbMachine />' "$source"

          # V61 remains fail-closed until literal retained pixels and governed locks qualify.
          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
