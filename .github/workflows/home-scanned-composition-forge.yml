# Owner-authored exact-head verifier for the V33 buttressed sanctuary and integrated angular reliquary candidate.
name: Home Scanned Composition Verification

on:
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - "urai-tier1/src/spatial/world/persistentRealmAtmosphere.css"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - ".github/workflows/home-scanned-composition-forge.yml"
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - "urai-tier1/src/spatial/world/persistentRealmAtmosphere.css"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-scanned-composition-verification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify materialized V33 Home composition and governed inputs
        shell: bash
        run: |
          set -euo pipefail
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          atmosphere='urai-tier1/src/spatial/world/persistentRealmAtmosphere.css'
          test -f urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb
          test -f urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb
          test -f operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F 'home-entry-chamber-v1.glb' "$source"
          grep -F 'polyhaven-fern-02-geometry-v1.glb' "$source"
          ! grep -F 'CINEMATIC_HOME_ART_MOBILE' "$source"
          grep -F 'monolithic-photographic-stone-court-v30-no-visible-tiling-grid' "$source"
          grep -F 'cinematic-enclosed-sacred-tech-sanctuary-v33' "$source"
          grep -F 'v33-monolithic-buttressed-sanctuary-final' "$source"
          grep -F 'v33-deep-buttressed-apse-final' "$source"
          grep -F 'v33-asymmetric-grounded-buttresses' "$source"
          grep -F 'v33-grounded-vault-shell-final' "$source"
          grep -F 'v33-reliquary-apse-integrated-final' "$source"
          grep -F 'v33-authored-depth-and-material-separation' "$source"
          grep -F 'v33-three-embedded-reliquary-feet' "$source"
          grep -F 'v33-no-plinth-no-ring-only-machine-load-feet' "$source"
          grep -F 'v33-sanctuary-scale-angular-reliquary-machine' "$source"
          grep -F 'v33-housings-beams-jaws-and-rear-load-frame-dominate-reactor' "$source"
          grep -F 'v33-rear-structural-load-frame-not-halo' "$source"
          grep -F 'v33-angular-relic-reactor-integrated-with-load-frame' "$source"
          grep -F 'data-home-final-art-revision="v33-angular-reliquary-sanctuary-final"' "$source"
          grep -F 'data-home-art-certification="v33-pending-retained-pixel-certification"' "$source"
          grep -F 'volumetric-fog-only-v24-no-transparent-depth-card' "$source"
          grep -F "V33 Home owns its physical sky/fog; suppress shared screen-space horizon bars." "$atmosphere"
          grep -F ".urai-world-atmosphere[data-realm='home'] .urai-world-atmosphere__horizon" "$atmosphere"
          ! grep -F 'home-orb-foundation' "$source"
          ! grep -F '<SanctuaryCeiling />' "$source"
          ! grep -F 'v32-sanctuary-scale-three-point-reliquary-machine' "$source"
          ! grep -F 'v32-faceted-heavy-relic-reactor-integrated-with-sanctuary' "$source"
          ! grep -F 'v31-sanctuary-scale-three-point-armored-reliquary-dock' "$source"
          ! grep -F 'v29-curved-load-arms-contact-orb-no-pedestal-stem' "$source"
          ! grep -F 'v29-three-point-articulated-relic-dock' "$source"
          ! grep -F 'circleGeometry args={[0.92,128]}' "$source"
          ! grep -F 'compact-relic-bay-v23' "$source"
          ! grep -F 'home-orb-stabilizer-ring-1' "$source"

      - name: Verify scanned fern receipt identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = json.loads(Path('operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json').read_text())
          asset = Path(receipt['output'])
          assert asset.is_file(), asset
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          assert digest == receipt['outputSha256']
          assert digest == '9e3d29b1f917ec9f6e72f713fc7131f1d413ffecfbd3c96e7d72f92529f31a87'
          assert receipt['runtimeExternalRequests'] is False
          PY
