# Owner-authored exact-head verifier for the current asset-backed Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current production-asset composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          # Preserve the governed composition contract and hidden V48 compatibility provenance.
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"

          # Verify the current V50 visible-world composition while preserving the V49 candidate telemetry identity.
          grep -F 'function ProductionSanctuary()' "$source"
          grep -F 'function ProductionOrbMachine()' "$source"
          grep -F 'home-v49-scanned-detail-layer' "$source"
          grep -F 'home-v49-authored-practicals' "$source"
          grep -F "visualOwner:'cinematic-integrated-reliquary-sanctuary-v49'" "$source"
          grep -F "visualTreatment:'v49-authored-reliquary-production-candidate v50-retained-pixel-rebuild'" "$source"
          grep -F "root.userData.uraiTreatment = 'v50-retained-pixel-rebuild-opaque-governed-heart'" "$source"
          grep -F 'v50-six-plate-opaque-reliquary-armor-no-glass-ball-no-orbit-rings' "$source"
          grep -F 'v50-machine-bay-three-layer-depth' "$source"
          grep -F 'v50-long-perspective-side-returns' "$source"
          grep -F 'v50-retained-pixel-depth-shell' "$source"
          grep -F 'v50-four-point-structural-capture' "$source"
          grep -F 'v50-grounded-orb-load-path' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v49-authored-reliquary"' "$source"
          grep -F 'data-home-final-art-revision="v49-authored-reliquary-candidate"' "$source"
          grep -F 'data-home-art-certification="v49-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="authored-reliquary-v49-plus-governed-living-orb"' "$source"

          # The old V48 pipe-machine helper may remain as provenance, but it must not own the visible scene.
          ! grep -F '<ProductionOrbMachine />' "$source"

          # Retained-pixel certification is a separate human visual gate and must not be asserted here.
          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
