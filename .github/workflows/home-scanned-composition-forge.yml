# Owner-authored exact-head trigger for the stabilized V29 certification candidate.
name: Home Scanned Composition Verification

on:
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - ".github/workflows/home-scanned-composition-forge.yml"
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - "urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb"
      - "urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb"
      - "operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-scanned-composition-verification-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify materialized Home composition and governed inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb
          test -f urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb
          test -f operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json
          grep -F 'HOME_SCANNED_COMPOSITION_V1' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'home-entry-chamber-v1.glb' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'polyhaven-fern-02-geometry-v1.glb' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'CINEMATIC_HOME_ART_MOBILE' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'home-built-sanctuary-envelope-v29' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v29-compatibility-glb-provenance-only-no-visible-fantasy-shell' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'large-format-photographic-stone-court-v29-grounded-low-frequency' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'grounded-cinematic-sacred-tech-sanctuary-v29' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v29-grounded-vaulted-machine-hall-no-fantasy-shell' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v29-continuous-structural-vault-load-paths' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v29-canopy-is-vault-not-floating-bars' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v29-three-point-articulated-relic-dock' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v29-curved-load-arms-contact-orb-no-pedestal-stem' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v29-integrated-vault-threshold' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'recessed-machine-foundation-v25-flush-inlay' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'v27-faceted-crystalline-relic-machine' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'volumetric-fog-only-v24-no-transparent-depth-card' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'v28-authored-threshold-court-no-box-walls' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'v28-curved-machined-load-paths-attached-to-piers' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'v28-continuous-curved-rib-skylight-no-floating-bars' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'v27-authored-pier-and-recess-court' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'circleGeometry args={[0.92,128]}' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'compact-relic-bay-v23' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'boxGeometry args={[0.07,3.18,16.3]}' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'size={[0.66,4.1,7.0]}' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'home-orb-stabilizer-ring-1' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'home-orb-stabilizer-arc-a' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'home-orb-stabilizer-arc-b' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'home-orb-stabilizer-arc-c' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx

      - name: Verify scanned fern receipt identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          receipt = json.loads(Path('operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json').read_text())
          asset = Path(receipt['output'])
          assert asset.is_file(), asset
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          assert digest == receipt['outputSha256']
          assert digest == '9e3d29b1f917ec9f6e72f713fc7131f1d413ffecfbd3c96e7d72f92529f31a87'
          assert receipt['runtimeExternalRequests'] is False
          PY
