# Owner-authored exact-head verifier for the current asset-backed Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current production-asset composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F 'v48-production-asset-sanctuary-candidate' "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"
          grep -F 'function ProductionSanctuary()' "$source"
          grep -F 'function ProductionOrbMachine()' "$source"
          grep -F 'home-v48-rear-scanned-apse' "$source"
          grep -F 'home-v48-machine-services' "$source"
          grep -F 'home-v48-orb-machine-frame' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v48-committed-production-assets"' "$source"
          grep -F 'data-home-final-art-revision="v48-production-asset-sanctuary-candidate"' "$source"
          grep -F 'data-home-art-certification="v48-production-assets-retained-pixel-candidate"' "$source"
          ! grep -F 'PRODUCTION CERTIFIED' "$source"
