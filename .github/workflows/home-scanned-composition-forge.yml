# Owner-authored exact-head verifier for the current asset-backed Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current production-asset composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"

          # V56 is the current owner-authored candidate; literal pixel certification remains separate.
          grep -F 'function ProductionSanctuary()' "$source"
          grep -F 'home-v49-scanned-detail-layer' "$source"
          grep -F "visualOwner:'cinematic-wall-integrated-reliquary-v56'" "$source"
          grep -F "visualTreatment:'v56-wall-integrated-reliquary-retained-pixel-rebuild'" "$source"
          grep -F "root.userData.uraiTreatment = 'v56-governed-orb-glb-retained-for-identity-and-animation-behind-engineered-aperture'" "$source"
          grep -F 'v56-deep-continuous-sanctuary-shell-no-detached-rock-slabs-no-facade-stage' "$source"
          grep -F 'v56-continuous-tapered-side-returns-rooted-floor-to-vault-no-detached-scanned-slabs' "$source"
          grep -F 'v56-recessed-service-cavity-behind-machine-face-no-exposed-pipe-rack-focal' "$source"
          grep -F 'v56-wall-integrated-two-jaw-load-path-no-pedestal-no-crossbars-no-floor-legs' "$source"
          grep -F 'v56-faceted-wall-integrated-machine-aperture-with-recessed-service-network-no-pipe-rack-no-display-stand' "$source"
          grep -F 'home-v56-recessed-service-network' "$source"
          grep -F 'home-v56-visible-orb-machine-core' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v56-wall-integrated-reliquary"' "$source"
          grep -F 'data-home-final-art-revision="v56-wall-integrated-reliquary-candidate"' "$source"
          grep -F 'data-home-art-certification="v56-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="wall-integrated-v56-plus-governed-orb-identity"' "$source"

          # Literal-pixel failures must not own the current visible composition.
          ! grep -F "visualOwner:'cinematic-integrated-industrial-reliquary-v55'" "$source"
          ! grep -F "visualTreatment:'v55-integrated-industrial-orb-retained-pixel-rebuild'" "$source"
          ! grep -F 'home-v55-left-near-rock-return' "$source"
          ! grep -F 'home-v55-right-near-rock-return' "$source"
          ! grep -F 'home-v55-left-scanned-reliquary-return' "$source"
          ! grep -F 'home-v55-right-scanned-reliquary-return' "$source"
          ! grep -F 'home-v55-orb-machine-core-network' "$source"
          ! grep -F 'home-v55-visible-orb-aperture' "$source"
          ! grep -F "visualOwner:'cinematic-authored-relic-sanctuary-v54'" "$source"
          ! grep -F "visualTreatment:'v54-authored-relic-sanctuary-retained-pixel-rebuild'" "$source"
          ! grep -F 'v54-governed-authored-orb-is-primary-visible-relic-machine-no-polyhedron-shell-no-starburst-no-glass-sphere' "$source"
          ! grep -F "visualOwner:'cinematic-integrated-arch-reliquary-v53'" "$source"
          ! grep -F 'v53-faceted-relic-shell-and-four-compact-machine-clamps' "$source"
          ! grep -F 'v50-six-plate-opaque-reliquary-armor-no-glass-ball-no-orbit-rings' "$source"
          ! grep -F 'v51-open-four-point-floor-rooted-load-paths-no-display-stand-no-panel-wings' "$source"
          ! grep -F 'v52-four-point-wide-floor-rooted-load-paths-integrated-with-large-orb-no-display-stand' "$source"

          ! grep -F '<ProductionOrbMachine />' "$source"
          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
