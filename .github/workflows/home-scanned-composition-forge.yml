# Owner-authored exact-head verifier for the current V112 Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProduction.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx"
      - "urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs"
      - "urai-tier1/tests/home-relic-machine-realism-contract.test.mjs"
      - "urai-tier1/tests/home-v88-retained-pixel-repair-contract.test.mjs"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProduction.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx"
      - "urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx"
      - "urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs"
      - "urai-tier1/tests/home-relic-machine-realism-contract.test.mjs"
      - "urai-tier1/tests/home-v88-retained-pixel-repair-contract.test.mjs"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current V112 visible governed relief composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          entry='urai-tier1/src/spatial/layout/HomeWorldProduction.tsx'
          runtime='urai-tier1/src/spatial/layout/HomeWorldProductionV70.tsx'
          art='urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx'

          grep -Fq 'HomeWorldProductionV70 as HomeWorldProduction' "$entry"
          grep -Fq "const GOVERNED_HOME = '/assets/urai/generated/models/home-entry-chamber-v1.glb'" "$art"
          grep -Fq 'home-v83-governed-open-sanctuary-environment' "$art"
          grep -Fq 'home-v83-authored-open-sanctuary' "$art"
          grep -Fq 'committed-governed-home-distant-architectural-relief' "$art"
          grep -Fq 'governed-home-source-visible-distant-relief-outside-approach-cameras' "$art"
          grep -Fq "successorVisualRepair: 'v112-reposition-and-rescale-governed-relief'" "$art"
          grep -Fq "approachVisibilityRepair: 'v112-visible-governed-relief-outside-approach-cameras'" "$art"
          grep -Fq 'root.position.set(0, -0.12, -20.8)' "$art"
          grep -Fq 'root.scale.setScalar(0.18)' "$art"
          grep -Fq 'for (const object of rejectedNodes) object.parent?.remove(object)' "$art"
          grep -Fq '<PortalStoneFrame destination={destination} textures={textures.shell} />' "$art"
          grep -Fq 'swarm.current.scale.setScalar(1.90 * breath)' "$art"
          grep -Fq 'const ORB = new THREE.Vector3(-0.28, 2.48, -6.18)' "$runtime"
          grep -Fq "const inspectionClearance = nearby === 'orb' ? (portrait ? 2.80 : 2.40) : nearby ? (portrait ? 2.10 : 1.65) : 0.10" "$runtime"

          ! grep -Eq '(root|object)\.visible[[:space:]]*=[[:space:]]*false' "$art"
          ! grep -Fq 'PRODUCTION CERTIFIED' "$runtime"
          ! grep -Fq 'retained-pixel-pass' "$runtime"
          ! grep -Fq 'pixel-certified' "$runtime"

          node --test \
            urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs \
            urai-tier1/tests/home-relic-machine-realism-contract.test.mjs \
            urai-tier1/tests/home-v88-retained-pixel-repair-contract.test.mjs
