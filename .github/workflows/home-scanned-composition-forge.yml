# Owner-authored exact-head verifier for the current V66 Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current V66 enclosed reliquary Orb composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F "visibleWorldOwner = 'home-v66-enclosed-reliquary'" "$source"
          grep -F 'v66-authored-chamber-retained-provenance-never-visible' "$source"

          grep -F "visualOwner:'enclosed-reliquary-v66'" "$source"
          grep -F "construction:'contiguous-pbr-stone-enclosure-with-recessed-reliquary-focus'" "$source"
          grep -F "visualTreatment:'v66-enclosed-reliquary-retained-pixel-rebuild'" "$source"
          grep -F 'v66-contiguous-enclosed-stone-reliquary-no-open-sky-no-floating-geology' "$source"
          grep -F 'v66-recessed-practicals-integrated-into-enclosure' "$source"
          grep -F 'v66-six-fragment-engineered-orb-no-glass-sphere-no-pedestal' "$source"
          grep -F 'v66-interaction-anchor-for-six-fragment-engineered-orb' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v66-enclosed-reliquary"' "$source"
          grep -F 'data-home-final-art-revision="v66-enclosed-reliquary-candidate"' "$source"
          grep -F 'data-home-art-certification="v66-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="enclosed-reliquary-v66-six-fragment-orb"' "$source"
          grep -F 'const ORB = new THREE.Vector3(0, 2.35, -7.25)' "$source"
          grep -F 'const SPAWN = new THREE.Vector3(4.45, 0.04, 3.15)' "$source"
          grep -F 'const DEFAULT_YAW = 0.435' "$source"
          grep -F 'const desiredFov=portrait?52:40' "$source"

          architecture_block="$(sed -n '/function ContinuousVaultSkin/,/function SanctuaryGlazing/p' "$source")"
          machine_block="$(sed -n '/function MachineCoreAssembly/,/function HumanPresence/p' "$source")"
          ! grep -F 'home-v64-left-deep-wall' <<<"$architecture_block"
          ! grep -F 'home-v64-right-deep-wall' <<<"$architecture_block"
          ! grep -F 'home-v64-upper-left-vault' <<<"$architecture_block"
          ! grep -F 'home-v64-upper-right-vault' <<<"$architecture_block"
          ! grep -F 'ProductionAsset url={V48_ROCK_FACE' <<<"$architecture_block"
          ! grep -F 'sphereGeometry' <<<"$machine_block"
          ! grep -F 'torusGeometry' <<<"$machine_block"
          ! grep -F 'ProductionAsset url={V48_PIPE_SYSTEM}' <<<"$machine_block"
          ! grep -F 'cylinderGeometry' <<<"$machine_block"
          ! grep -F '<ProductionOrbMachine />' "$source"
          ! grep -F "visualOwner:'photogrammetry-orb-sanctuary-v64'" "$source"
          ! grep -F "visualOwner:'authored-orb-sanctuary-v63'" "$source"
          ! grep -F 'data-home-art-certification="v65-retained-pixel-candidate-not-certified"' "$source"

          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
