# Owner-authored exact-head verifier for the current V63 Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current V63 authored Orb sanctuary composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"

          grep -F "visualOwner:'authored-orb-sanctuary-v63'" "$source"
          grep -F "visualTreatment:'v63-authored-orb-sanctuary-retained-pixel-rebuild'" "$source"
          grep -F 'v63-deep-stone-sanctuary-with-integrated-geology-no-display-frame' "$source"
          grep -F 'home-v63-left-geology-foundation' "$source"
          grep -F 'home-v63-right-geology-foundation' "$source"
          grep -F 'v63-restrained-service-infrastructure-recessed-at-sanctuary-edges' "$source"
          grep -F 'home-v63-left-recessed-service' "$source"
          grep -F 'home-v63-right-recessed-service' "$source"
          grep -F 'home-v63-left-orb-service' "$source"
          grep -F 'home-v63-right-orb-service' "$source"
          grep -F 'home-v63-visible-authored-orb' "$source"
          grep -F 'v63-authored-glb-core-visible-governed-animation-identity' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v63-authored-orb-sanctuary"' "$source"
          grep -F 'data-home-final-art-revision="v63-authored-orb-sanctuary-candidate"' "$source"
          grep -F 'data-home-art-certification="v63-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="authored-orb-sanctuary-v63-plus-governed-orb-identity"' "$source"
          grep -F 'const SPAWN = new THREE.Vector3(4.45, 0.04, 3.15)' "$source"
          grep -F 'const DEFAULT_YAW = 0.435' "$source"
          grep -F 'const desiredFov=portrait?52:40' "$source"

          machine_block="$(sed -n '/function MachineCoreAssembly/,/function HumanPresence/p' "$source")"
          ! grep -F 'home-v62-orb-core-housing' <<<"$machine_block"
          ! grep -F 'home-v62-orb-state-window' <<<"$machine_block"
          ! grep -F 'home-v62-machine-main-manifold' <<<"$machine_block"
          ! grep -F 'home-v62-machine-overhead-return' <<<"$machine_block"
          ! grep -F 'cylinderGeometry' <<<"$machine_block"
          ! grep -F '<ProductionOrbMachine />' "$source"
          ! grep -F 'home-v61-orb-state-slit' "$source"
          ! grep -F "visualOwner:'deep-reliquary-vault-v61'" "$source"
          ! grep -F "visualOwner:'asset-backed-service-vault-v62'" "$source"

          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
