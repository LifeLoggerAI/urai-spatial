name: Home Scanned Composition Forge

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-scanned-composition-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

env:
  URAI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PR_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

jobs:
  compose-home:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Prove exact clean candidate and asset inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f urai-tier1/public/assets/urai/generated/models/home-entry-chamber-v1.glb
          test -f urai-tier1/public/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb
          python3 - <<'PY'
          import hashlib, json, pathlib
          receipt = json.loads(pathlib.Path('operations/assets/third-party/home-polyhaven-fern-02-geometry-v1.json').read_text())
          asset = pathlib.Path(receipt['output'])
          assert hashlib.sha256(asset.read_bytes()).hexdigest() == receipt['outputSha256'] == '9e3d29b1f917ec9f6e72f713fc7131f1d413ffecfbd3c96e7d72f92529f31a87'
          assert receipt['runtimeExternalRequests'] is False
          PY

      - name: Compose owned sanctuary with scanned local nature
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx')
          source = path.read_text()
          if 'HOME_SCANNED_COMPOSITION_V1' in source:
              print('Scanned Home composition already materialized.')
              raise SystemExit(0)

          def replace_once(old, new):
              global source
              count = source.count(old)
              assert count == 1, f'expected one replacement, found {count}: {old[:90]!r}'
              source = source.replace(old, new, 1)

          replace_once(
              'import { ContactShadows, Stars } from "@react-three/drei";',
              'import { ContactShadows, Stars, useGLTF } from "@react-three/drei";'
          )
          replace_once(
              'const CINEMATIC_HOME_ART = "/assets/urai/v5/launch-key-art.webp";\nconst CINEMATIC_HOME_ART_MOBILE = "/assets/urai/v5/life-layer-mobile.webp";',
              'const HOME_SANCTUARY_MODEL = "/assets/urai/generated/models/home-entry-chamber-v1.glb";\nconst HOME_FERN_MODEL = "/assets/urai/home-production/cc0/polyhaven-fern-02-geometry-v1.glb";\nconst HOME_SCANNED_COMPOSITION_V1 = "owned-sanctuary-plus-cc0-fern";'
          )
          replace_once(
              '  const rejected = /portal|ring|threshold|village|mannequin|avatar|debug|marker|label|embodied|presence|memory-place-anchor|living-growth/i;\n',
              '  const rejected = /portal|ring|threshold|village|mannequin|avatar|debug|marker|label|embodied|presence|memory-place-anchor|living-growth/i;\n  const rejectedForgeForms = /vault|monolith|bridge|grove|firefly|alcove|veil|waterfall|mountain|vegetation|tree|sculpture/i;\n'
          )
          replace_once(
              '    object.visible = !rejected.test(object.name);\n    object.castShadow = false;\n    object.receiveShadow = true;\n    if (object.visible) visibleMeshCount += 1;',
              '    object.visible = !rejected.test(object.name) && !rejectedForgeForms.test(object.name);\n    if (!object.visible) return;\n    const name = object.name.toLowerCase();\n    const stone = /basin|pedestal|path|ground|terrain|stone/.test(name);\n    object.material = new THREE.MeshStandardMaterial({ color: stone ? "#526158" : "#3f5148", roughness: stone ? 0.92 : 0.98, metalness: 0.01 });\n    object.castShadow = true;\n    object.receiveShadow = true;\n    visibleMeshCount += 1;'
          )

          backdrop_start = source.index('function CinematicBackdrop()')
          terrain_start = source.index('function Terrain(', backdrop_start)
          source = source[:backdrop_start] + '''function CinematicBackdrop() {
  return <div aria-hidden="true" style={{ position: "absolute", inset: 0, zIndex: 0, overflow: "hidden", background: "radial-gradient(circle at 50% 42%, #244a4a 0%, #123239 28%, #0b2029 58%, #061015 100%)" }} />;
}

''' + source[terrain_start:]

          replace_once(
              '  const authored = useMemo(() => prepareAuthoredSanctuary(new THREE.Group()), []);',
              '  const sanctuary = useGLTF(HOME_SANCTUARY_MODEL);\n  const authored = useMemo(() => prepareAuthoredSanctuary(sanctuary.scene), [sanctuary.scene]);'
          )
          replace_once(
              '        <meshStandardMaterial color="#17372d" roughness={0.96} metalness={0} transparent opacity={0.58} />',
              '        <meshStandardMaterial color="#29483a" roughness={0.98} metalness={0} />'
          )

          ridge_start = source.index('function Ridge(')
          vegetation_start = source.index('function NaturalVegetation', ridge_start)
          source = source[:ridge_start] + '''function NaturalHorizon() {
  return <group name="home-mountain-horizon" userData={{ role: "terrain-fog-continuity-without-procedural-ridge" }} />;
}

const FERN_PLACEMENTS = [
  [-7.4, -4.9, 0.82, -0.3], [-6.3, -7.4, 1.08, 0.7], [-5.1, -10.2, 0.9, 1.8],
  [-3.8, -3.7, 0.72, -1.4], [-3.1, -8.8, 1.16, 2.3], [-2.2, -11.6, 0.86, 0.2],
  [2.3, -4.1, 0.8, 0.9], [3.2, -9.4, 1.12, -0.6], [4.1, -11.1, 0.88, 1.4],
  [5.6, -4.8, 0.76, 2.6], [6.5, -8.2, 1.04, -1.8], [7.2, -10.7, 0.9, 0.4],
  [-8.0, 0.8, 0.8, 1.1], [-5.8, 2.6, 0.72, -2.2], [5.9, 2.1, 0.78, 2.0], [7.8, 0.2, 0.86, -0.8],
] as const;

''' + source[vegetation_start:]

          vegetation_start = source.index('function NaturalVegetation')
          path_start = source.index('function SanctuaryPath', vegetation_start)
          source = source[:vegetation_start] + '''function NaturalVegetation({ reducedMotion }: { reducedMotion: boolean }) {
  const fern = useGLTF(HOME_FERN_MODEL);
  const material = useMemo(() => new THREE.MeshStandardMaterial({ color: "#6f9a70", roughness: 0.92, metalness: 0, side: THREE.DoubleSide }), []);
  useEffect(() => () => material.dispose(), [material]);
  const instances = useMemo(() => FERN_PLACEMENTS.map(([x, z, scale, rotation], index) => {
    const object = fern.scene.clone(true);
    object.name = `home-scanned-fern-${index + 1}`;
    object.position.set(x, terrainHeight(x, z) + 0.02, z);
    object.rotation.y = rotation;
    object.scale.setScalar(scale);
    object.traverse((child) => {
      if (!(child instanceof THREE.Mesh)) return;
      child.material = material;
      child.castShadow = true;
      child.receiveShadow = true;
    });
    return object;
  }), [fern.scene, material]);
  return <group name="home-living-vegetation" userData={{ role: "scanned-cc0-natural-ground", reducedMotion }}>
    {instances.map((object) => <primitive key={object.name} object={object} />)}
  </group>;
}

''' + source[path_start:]

          path_start = source.index('function SanctuaryPath')
          pavilion_start = source.index('function SanctuaryPavilion', path_start)
          source = source[:path_start] + '''function SanctuaryPath() {
  return <group name="home-sanctuary-path" userData={{ geometryOwner: "retained-owned-sanctuary-model", primitiveScenery: false }} />;
}

''' + source[pavilion_start:]

          pavilion_start = source.index('function SanctuaryPavilion')
          water_start = source.index('function ReflectingWater', pavilion_start)
          source = source[:pavilion_start] + '''function SanctuaryPavilion() {
  return <group name="home-sanctuary-pavilion" userData={{ geometryOwner: "retained-owned-sanctuary-model", primitiveScenery: false }} />;
}

''' + source[water_start:]

          water_start = source.index('function ReflectingWater')
          orbit_start = source.index('function orbitGeometry', water_start)
          source = source[:water_start] + '''function ReflectingWater() {
  return <group name="home-reflecting-water" position={[4.9, terrainHeight(4.9, -7.2) + 0.015, -7.2]}>
    <mesh rotation={[-Math.PI / 2, 0, 0]}>
      <planeGeometry args={[5.6, 4.2, 1, 1]} />
      <meshPhysicalMaterial color="#123f48" roughness={0.08} clearcoat={1} clearcoatRoughness={0.1} transparent opacity={0.62} />
    </mesh>
  </group>;
}

''' + source[orbit_start:]

          orb_start = source.index('function OrbSanctuary(')
          ground_start = source.index('function GroundThresholdLandmark', orb_start)
          source = source[:orb_start] + '''function OrbSanctuary({ onOpen }: { onOpen: () => void }) {
  const reducedMotion = useContext(ReducedMotionContext);
  const core = useRef<THREE.Mesh>(null);
  const light = useRef<THREE.PointLight>(null);
  useFrame(({ clock }) => {
    if (reducedMotion) return;
    const breathe = 1 + Math.sin(clock.elapsedTime * 0.9) * 0.018;
    core.current?.scale.setScalar(0.48 * breathe);
    if (light.current) light.current.intensity = 1.35 + Math.sin(clock.elapsedTime * 0.9) * 0.12;
  });
  return (
    <group name="home-orb-sanctuary" position={ORB} onClick={(event) => { event.stopPropagation(); onOpen(); }}>
      <mesh ref={core} scale={0.48}>
        <sphereGeometry args={[1, 64, 64]} />
        <meshPhysicalMaterial color="#b9dfe2" emissive="#4d8f9d" emissiveIntensity={0.72} roughness={0.18} metalness={0.08} clearcoat={0.9} clearcoatRoughness={0.16} />
      </mesh>
      <OrbDust reducedMotion={reducedMotion} />
      <pointLight ref={light} color="#8bc9cf" intensity={1.35} distance={7} decay={2} />
    </group>
  );
}

''' + source[ground_start:]

          replace_once(
              '<ambientLight intensity={cosmic ? 0.12 : 0.3} color="#b7d4cd" />\n      <hemisphereLight args={["#9ec5c8", "#06110d", cosmic ? 0.2 : 0.54]} />\n      <directionalLight position={[11, 18, -14]} intensity={cosmic ? 0.32 : 1.25} color="#d5e8e4" castShadow />',
              '<ambientLight intensity={cosmic ? 0.12 : 0.42} color="#c6dbd4" />\n      <hemisphereLight args={["#a7cdd0", "#101b13", cosmic ? 0.2 : 0.72]} />\n      <directionalLight position={[9, 17, 4]} intensity={cosmic ? 0.32 : 1.7} color="#e8eee5" castShadow />'
          )
          replace_once(
              'data-home-runtime-assets="launch-key-art.webp local-three-dimensional-terrain living-orb reflecting-water"',
              'data-home-runtime-assets="home-entry-chamber-v1.glb polyhaven-fern-02-geometry-v1.glb local-three-dimensional-terrain living-orb reflecting-water"'
          )
          replace_once(
              'data-home-animation-owner="provider-natural-world-plus-authored-physical-interactions"',
              'data-home-animation-owner={HOME_SCANNED_COMPOSITION_V1}'
          )
          replace_once('gl.toneMappingExposure = 0.92;', 'gl.toneMappingExposure = 1.06;')

          assert 'CINEMATIC_HOME_ART_MOBILE' not in source
          assert 'prepareAuthoredSanctuary(new THREE.Group())' not in source
          assert 'function Ridge(' not in source
          assert '<cylinderGeometry' not in source
          assert 'pointsMaterial color="#d3f4c7"' not in source
          assert 'useGLTF(HOME_SANCTUARY_MODEL)' in source
          assert 'useGLTF(HOME_FERN_MODEL)' in source
          assert 'data-home-runtime-assets="home-entry-chamber-v1.glb polyhaven-fern-02-geometry-v1.glb local-three-dimensional-terrain living-orb reflecting-water"' in source
          path.write_text(source)
          PY

      - name: Verify scoped source contract before push
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain -- urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx)"
          grep -F 'HOME_SCANNED_COMPOSITION_V1' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'polyhaven-fern-02-geometry-v1.glb' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          grep -F 'home-entry-chamber-v1.glb' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F 'CINEMATIC_HOME_ART_MOBILE' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          ! grep -F '<cylinderGeometry' urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx

      - name: Commit only if source head is still current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
            if [ "$current_head" != "$URAI_SOURCE_SHA" ]; then
              echo "Stale composition input: current PR head is $current_head; refusing to push from $URAI_SOURCE_SHA"
              exit 0
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git commit -m 'Compose Home from owned sanctuary and scanned nature'
          gh auth setup-git
          git push origin "HEAD:${PR_BRANCH}"
