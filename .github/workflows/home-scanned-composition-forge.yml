# Owner-authored exact-head verifier for the current asset-backed Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current production-asset composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          # Preserve governed composition and hidden V48 compatibility provenance.
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"

          # Verify the current V53 integrated-arch composition without asserting pixel certification.
          grep -F 'function ProductionSanctuary()' "$source"
          grep -F 'function ProductionOrbMachine()' "$source"
          grep -F 'home-v49-scanned-detail-layer' "$source"
          grep -F 'home-v49-authored-practicals' "$source"
          grep -F "visualOwner:'cinematic-integrated-arch-reliquary-v53'" "$source"
          grep -F "visualTreatment:'v53-integrated-arch-reliquary-retained-pixel-rebuild'" "$source"
          grep -F "root.userData.uraiTreatment = 'v53-contained-governed-heart-inside-faceted-relic-core-no-starburst'" "$source"
          grep -F 'v53-low-faceted-buttresses-and-recessed-practicals-no-rectangular-bay-blocks-no-scaffold' "$source"
          grep -F 'v53-nested-stone-metal-arches-create-coherent-sanctuary-depth-no-loose-scaffold' "$source"
          grep -F 'v53-recessed-concentric-machine-bay-integrated-with-architecture-no-box-no-beam-tangle' "$source"
          grep -F 'v53-compact-four-point-floor-load-path-integrated-into-recessed-machine-bay-no-display-stand' "$source"
          grep -F 'v53-contained-rear-yoke-and-arch-collar-no-cross-scaffold-no-display-plate' "$source"
          grep -F 'v53-faceted-relic-shell-and-four-compact-machine-clamps' "$source"
          grep -F 'home-v53-central-finished-stone-lane' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v53-integrated-arch-reliquary"' "$source"
          grep -F 'data-home-final-art-revision="v53-integrated-arch-reliquary-candidate"' "$source"
          grep -F 'data-home-art-certification="v53-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="integrated-arch-v53-plus-governed-living-orb"' "$source"

          # Explicitly reject forms already failed by literal retained-pixel review.
          ! grep -F 'home-v47-left-apse-mass' "$source"
          ! grep -F 'home-v47-right-apse-mass' "$source"
          ! grep -F 'v50-six-plate-opaque-reliquary-armor-no-glass-ball-no-orbit-rings' "$source"
          ! grep -F 'v51-open-four-point-floor-rooted-load-paths-no-display-stand-no-panel-wings' "$source"
          ! grep -F 'v52-four-point-wide-floor-rooted-load-paths-integrated-with-large-orb-no-display-stand' "$source"
          ! grep -F 'v52-deep-layered-sanctuary-open-vault-no-slab-wall-no-front-facade' "$source"

          # The old V48 pipe-machine helper may remain as provenance, but it must not own the visible scene.
          ! grep -F '<ProductionOrbMachine />' "$source"

          # Retained-pixel certification is a separate literal visual gate and must not be asserted here.
          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
