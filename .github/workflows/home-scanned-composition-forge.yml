# Owner-authored exact-head verifier for the current asset-backed Home composition.
name: Home Scanned Composition Verification
on:
  pull_request:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  push:
    branches: [main]
    paths:
      - "urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx"
      - ".github/workflows/home-scanned-composition-forge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home-scanned-current-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  verify-home:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Verify exact current production-asset composition
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'

          # Governed compatibility assets remain retained but never own visible pixels.
          grep -F 'HOME_SCANNED_COMPOSITION_V1' "$source"
          grep -F "root.visible = false" "$source"
          grep -F "retainedForGovernedCompatibilityOnly = true" "$source"
          grep -F 'v48-deterministic-intake-glb-provenance-only-never-visible' "$source"

          # V59 visible composition: enclosed asymmetric chamber and wall-integrated relic machine.
          grep -F "visualOwner:'integrated-chamber-machine-v59'" "$source"
          grep -F "visualTreatment:'v59-integrated-chamber-machine-retained-pixel-rebuild'" "$source"
          grep -F 'v59-continuous-asymmetric-enclosed-chamber-no-arch-facade' "$source"
          grep -F 'home-v59-left-embedded-geology' "$source"
          grep -F 'home-v59-right-embedded-geology' "$source"
          grep -F 'v59-deep-machined-wall-recess-no-circle-no-backboard-no-pipe-rack' "$source"
          grep -F 'v59-floor-rooted-wall-machine-with-overlapping-armor-and-central-state-slit' "$source"
          grep -F 'v59-recessed-machined-state-slit-inside-load-bearing-relic-machine' "$source"
          grep -F 'home-v59-orb-state-slit' "$source"
          grep -F 'v59-governed-glb-animation-identity-retained-invisibly-for-state-contract' "$source"
          grep -F 'data-home-visual-grade="cinematic-pbr-v59-integrated-chamber-machine"' "$source"
          grep -F 'data-home-final-art-revision="v59-integrated-chamber-machine-candidate"' "$source"
          grep -F 'data-home-art-certification="v59-retained-pixel-candidate-not-certified"' "$source"
          grep -F 'data-home-animation-owner="integrated-chamber-v59-plus-governed-orb-identity"' "$source"

          # Rejected visible grammars and primitive Orb shapes must not survive in the V59 visible Orb block.
          orb_block="$(sed -n '/function SacredOrb/,/function HumanPresence/p' "$source")"
          architecture_block="$(sed -n '/function ContinuousVaultSkin/,/function SanctuaryGlazing/p' "$source")"
          machine_block="$(sed -n '/function MachineCoreAssembly/,/function OrbArmorPlate/p' "$source")"
          ! grep -F 'sphereGeometry' <<<"$orb_block"
          ! grep -F 'icosahedronGeometry' <<<"$orb_block"
          ! grep -F 'dodecahedronGeometry' <<<"$orb_block"
          ! grep -F 'torusGeometry' <<<"$orb_block"
          ! grep -F 'circleGeometry' <<<"$architecture_block"
          ! grep -F 'home-v57-rear-service-network' <<<"$architecture_block"
          ! grep -F 'home-v57-left-service-riser' <<<"$architecture_block"
          ! grep -F 'home-v57-right-service-riser' <<<"$architecture_block"
          ! grep -F 'v57-real-industrial-service-machine-depth' <<<"$machine_block"
          ! grep -F "visualOwner:'cinematic-wall-integrated-reliquary-v56'" "$source"
          ! grep -F "visualOwner:'cinematic-integrated-industrial-reliquary-v55'" "$source"

          ! grep -F '<ProductionOrbMachine />' "$source"
          ! grep -F 'PRODUCTION CERTIFIED' "$source"
          ! grep -F 'retained-pixel-pass' "$source"
          ! grep -F 'pixel-certified' "$source"
