name: Resolve Home Onto Core

on:
  pull_request:
    branches:
      - release/core-convergence-20260729

permissions:
  contents: write

jobs:
  resolve:
    if: github.head_ref == 'agent/home-onto-core-resolve-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/home-onto-core-resolve-20260729
      - name: Merge accepted Home and resolve exact conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "urai-release-bot"
          git config user.email "actions@users.noreply.github.com"
          merge_status=0
          git merge --no-ff --no-commit 51db7b3ba77a657659da34ca5e146e049dd03d31 || merge_status=$?
          test "$merge_status" -ne 0
          python3 - <<'PY'
          from pathlib import Path

          policies = {
            '.github/workflows/continuous-spatial-visual-proof.yml': ['core'],
            '.github/workflows/lifemap-founder-visual-proof.yml': ['core'],
            'scripts/capture-lifemap-founder-proof.mjs': ['core', 'core'],
            'tests/native-doorway-proof.mjs': ['home', 'home', 'home'],
            'urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx': ['both', 'home'],
            'urai-tier1/src/spatial/memory/useSelectedMemory.ts': ['home'],
            'urai-tier1/src/spatial/world/interactionCollisionRepair.css': ['home'],
            'urai-tier1/tests/accessibility-performance-embodied-exploration.spec.ts': ['home', 'core', 'core', 'core', 'core', 'core', 'core'],
            'urai-tier1/tests/accessibility-performance-lifemap-independent.spec.ts': ['core', 'core', 'core', 'core', 'core', 'home'],
            'urai-tier1/tests/accessibility-performance-source-contract.test.mjs': ['home'],
            'urai-tier1/tests/accessibility-performance-spatial-visual.spec.ts': ['home', 'core', 'core'],
            'urai-tier1/tests/selected-memory-production-contract.test.mjs': ['home'],
          }

          def resolve(text, choices):
            out=[]; lines=text.splitlines(keepends=True); i=0; c=0
            while i < len(lines):
              if not lines[i].startswith('<<<<<<< '):
                out.append(lines[i]); i += 1; continue
              i += 1; core=[]
              while i < len(lines) and not lines[i].startswith('======='):
                core.append(lines[i]); i += 1
              if i >= len(lines): raise RuntimeError('missing separator')
              i += 1; home=[]
              while i < len(lines) and not lines[i].startswith('>>>>>>> '):
                home.append(lines[i]); i += 1
              if i >= len(lines): raise RuntimeError('missing end marker')
              i += 1
              if c >= len(choices): raise RuntimeError(f'missing policy for conflict {c + 1}')
              choice=choices[c]; c += 1
              if choice == 'core': out.extend(core)
              elif choice == 'home': out.extend(home)
              elif choice == 'both': out.extend(core + home)
              else: raise RuntimeError(choice)
            if c != len(choices): raise RuntimeError(f'choice count mismatch {c} != {len(choices)}')
            return ''.join(out)

          for name, choices in policies.items():
            path=Path(name)
            path.write_text(resolve(path.read_text(), choices))
          PY
          git add .github/workflows/continuous-spatial-visual-proof.yml .github/workflows/lifemap-founder-visual-proof.yml scripts/capture-lifemap-founder-proof.mjs tests/native-doorway-proof.mjs urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx urai-tier1/src/spatial/memory/useSelectedMemory.ts urai-tier1/src/spatial/world/interactionCollisionRepair.css urai-tier1/tests/accessibility-performance-embodied-exploration.spec.ts urai-tier1/tests/accessibility-performance-lifemap-independent.spec.ts urai-tier1/tests/accessibility-performance-source-contract.test.mjs urai-tier1/tests/accessibility-performance-spatial-visual.spec.ts urai-tier1/tests/selected-memory-production-contract.test.mjs
          test -z "$(git diff --name-only --diff-filter=U)"
          grep -RIl '^<<<<<<<\|^=======\|^>>>>>>>' .github/workflows/continuous-spatial-visual-proof.yml .github/workflows/lifemap-founder-visual-proof.yml scripts/capture-lifemap-founder-proof.mjs tests/native-doorway-proof.mjs urai-tier1/src/app/HomeSpatialRuntimeLayer.tsx urai-tier1/src/spatial/memory/useSelectedMemory.ts urai-tier1/src/spatial/world/interactionCollisionRepair.css urai-tier1/tests/accessibility-performance-embodied-exploration.spec.ts urai-tier1/tests/accessibility-performance-lifemap-independent.spec.ts urai-tier1/tests/accessibility-performance-source-contract.test.mjs urai-tier1/tests/accessibility-performance-spatial-visual.spec.ts urai-tier1/tests/selected-memory-production-contract.test.mjs && exit 1 || true
          rm -f .github/workflows/home-core-conflict-pack.yml .github/workflows/home-core-resolve.yml
          git add -A
          git commit -m "merge: converge accepted Home onto core"
          git push origin HEAD:agent/home-onto-core-resolve-20260729
