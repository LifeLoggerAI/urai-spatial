name: Home V159 Hairline Approach Repair

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/home-v159-hairline-repair.yml'

permissions:
  contents: write

concurrency:
  group: home-v159-hairline-approach-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Apply exact narrow visual repair
        shell: bash
        run: |
          set -euo pipefail
          source='urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx'
          old='      const half = 0.13 - t * 0.035'
          new='      const half = 0.032 - t * 0.010'
          test "$(grep -Fxc "$old" "$source")" -eq 1
          python3 - <<'PY'
          from pathlib import Path
          path = Path('urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx')
          text = path.read_text()
          old = '      const half = 0.13 - t * 0.035'
          new = '      const half = 0.032 - t * 0.010'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one V158 approach-width owner')
          path.write_text(text.replace(old, new))
          PY
          grep -Fq '      const half = 0.032 - t * 0.010' "$source"
          test "$(grep -Fxc "$old" "$source")" -eq 0

      - name: Remove one-shot workflow from successor
        shell: bash
        run: rm -f .github/workflows/home-v159-hairline-repair.yml

      - name: Commit only on unchanged branch head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$remote" = "$GITHUB_SHA"
          git diff --check
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionV76.tsx .github/workflows/home-v159-hairline-repair.yml
          git commit -m 'Home: narrow V159 approach to hairline trace'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826
