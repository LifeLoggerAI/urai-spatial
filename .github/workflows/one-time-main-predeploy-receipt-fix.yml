name: One-time explicit untracked predeploy fix

on:
  push:
    branches:
      - fix/predeploy-receipt-outside-checkout-20260714
    paths:
      - '.github/workflows/one-time-main-predeploy-receipt-fix.yml'

permissions:
  contents: write

concurrency:
  group: one-time-explicit-untracked-predeploy-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/predeploy-receipt-outside-checkout-20260714
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply exact review fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          operator_path = Path('scripts/live-release.mjs')
          test_path = Path('urai-tier1/tests/final-protected-deploy-regressions.test.mjs')

          operator = operator_path.read_text()
          old = """if (output('git', ['status', '--porcelain'])) {
            throw new Error('Current authority checkout must remain clean immediately before deployment')
          }"""
          new = """if (output('git', ['status', '--porcelain', '--untracked-files=all'])) {
            throw new Error('Current authority checkout must remain clean immediately before deployment')
          }"""
          if operator.count(old) != 1:
              raise SystemExit(f'expected exactly one final predeploy clean check, found {operator.count(old)}')
          operator_path.write_text(operator.replace(old, new, 1))

          test_source = test_path.read_text()
          assertion = "  assert.ok(releaseOperator.includes(\"output('git', ['status', '--porcelain', '--untracked-files=all'])\"))\n"
          anchor = "  assert.ok(releaseOperator.includes('Current authority checkout must remain clean immediately before deployment'))\n"
          if assertion not in test_source:
              if test_source.count(anchor) != 1:
                  raise SystemExit('expected exactly one predeploy clean assertion anchor')
              test_source = test_source.replace(anchor, anchor + assertion, 1)
              test_path.write_text(test_source)
          PY

      - name: Verify focused correction
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/live-release.mjs
          node --check urai-tier1/tests/final-protected-deploy-regressions.test.mjs
          node --test urai-tier1/tests/final-protected-deploy-regressions.test.mjs
          node urai-tier1/tests/exact-static-release-contract.test.mjs
          node scripts/verify-release-credential-boundary.mjs
          git diff --check

      - name: Commit permanent files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/live-release.mjs urai-tier1/tests/final-protected-deploy-regressions.test.mjs
          git diff --cached --check
          git commit -m 'Force untracked files into predeploy clean check'
          git push origin HEAD:fix/predeploy-receipt-outside-checkout-20260714
