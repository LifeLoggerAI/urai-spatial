name: One-time main predeploy receipt fix

on:
  push:
    branches:
      - fix/predeploy-receipt-outside-checkout-20260714
    paths:
      - '.github/workflows/one-time-main-predeploy-receipt-fix.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/one-time-main-predeploy-receipt-fix.yml'

permissions:
  contents: write

concurrency:
  group: one-time-main-predeploy-receipt-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/predeploy-receipt-outside-checkout-20260714
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Keep predeploy receipt outside source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          operator_path = Path('scripts/live-release.mjs')
          test_path = Path('urai-tier1/tests/final-protected-deploy-regressions.test.mjs')
          operator = operator_path.read_text()

          old_signature = "function writeReceipt(targetSha, status, details = {}) {\n  const directory = path.join('deployment-receipt', targetSha)\n"
          new_signature = dedent("""\
          function resolvePreDeployReceiptRoot() {
            if (!runnerTemp) throw new Error('RUNNER_TEMP is required for pre-deploy receipt evidence')
            const receiptRoot = path.resolve(runnerTemp, 'deployment-receipt')
            const resolvedAuthorityRoot = realpathSync(authorityRoot)
            if (receiptRoot === resolvedAuthorityRoot || receiptRoot.startsWith(`${resolvedAuthorityRoot}${path.sep}`)) {
              throw new Error('Pre-deploy receipt evidence must remain outside the authority checkout')
            }
            return receiptRoot
          }

          function writeReceipt(
            targetSha,
            status,
            details = {},
            { rootDirectory = 'deployment-receipt', includeLiveRollbackProvenance = true } = {},
          ) {
            const directory = path.join(rootDirectory, targetSha)
          """)
          if operator.count(old_signature) != 1:
              raise SystemExit('expected exactly one writeReceipt signature')
          operator = operator.replace(old_signature, new_signature, 1)

          old_copy = "  if (status === 'deployed' && liveRollbackProvenancePath && existsSync(liveRollbackProvenancePath)) {"
          new_copy = "  if (includeLiveRollbackProvenance && liveRollbackProvenancePath && existsSync(liveRollbackProvenancePath)) {"
          if operator.count(old_copy) != 1:
              raise SystemExit('expected exactly one deployed-only provenance condition')
          operator = operator.replace(old_copy, new_copy, 1)

          old_predeploy = dedent("""\
          const htmlFiles = releaseFiles.filter((entry) => entry.path.endsWith('.html'))
          const receiptPath = writeReceipt(targetSha, 'built-awaiting-deploy', {
            authorizedMainSha,
            authoritySha,
            outputFileCount: releaseFiles.length,
            htmlFileCount: htmlFiles.length,
            indexSha256: sha256('urai-tier1/out/index.html'),
            fingerprintSha256: sha256('urai-tier1/out/release-fingerprint.json'),
            ...outputDetails,
          })

          const preDeployMainSha = assertRemoteMainUnchanged(targetSha)
          """)
          new_predeploy = dedent("""\
          const htmlFiles = releaseFiles.filter((entry) => entry.path.endsWith('.html'))
          const preDeployReceiptRoot = resolvePreDeployReceiptRoot()
          const receiptPath = writeReceipt(targetSha, 'built-awaiting-deploy', {
            authorizedMainSha,
            authoritySha,
            outputFileCount: releaseFiles.length,
            htmlFileCount: htmlFiles.length,
            indexSha256: sha256('urai-tier1/out/index.html'),
            fingerprintSha256: sha256('urai-tier1/out/release-fingerprint.json'),
            ...outputDetails,
          }, {
            rootDirectory: preDeployReceiptRoot,
            includeLiveRollbackProvenance: false,
          })
          if (output('git', ['status', '--porcelain'])) {
            throw new Error('Current authority checkout must remain clean immediately before deployment')
          }

          const preDeployMainSha = assertRemoteMainUnchanged(targetSha)
          """)
          if operator.count(old_predeploy) != 1:
              raise SystemExit('expected exactly one predeploy receipt block')
          operator = operator.replace(old_predeploy, new_predeploy, 1)

          old_final = dedent("""\
          writeReceipt(targetSha, 'deployed', {
            authorizedMainSha,
            preDeployMainSha,
            authoritySha,
            outputFileCount: releaseFiles.length,
            htmlFileCount: htmlFiles.length,
            indexSha256: sha256('urai-tier1/out/index.html'),
            fingerprintSha256: sha256('urai-tier1/out/release-fingerprint.json'),
            previousReceipt: receiptPath,
            ...outputDetails,
          })
          """)
          new_final = dedent("""\
          const finalReceiptPath = writeReceipt(targetSha, 'deployed', {
            authorizedMainSha,
            preDeployMainSha,
            authoritySha,
            outputFileCount: releaseFiles.length,
            htmlFileCount: htmlFiles.length,
            indexSha256: sha256('urai-tier1/out/index.html'),
            fingerprintSha256: sha256('urai-tier1/out/release-fingerprint.json'),
            previousReceipt: receiptPath,
            ...outputDetails,
          })
          copyFileSync(receiptPath, path.join(path.dirname(finalReceiptPath), 'predeploy-receipt.json'))
          """)
          if operator.count(old_final) != 1:
              raise SystemExit('expected exactly one final receipt block')
          operator_path.write_text(operator.replace(old_final, new_final, 1))

          test_source = test_path.read_text()
          marker = "test('predeploy receipt stays outside the checkout until deploy succeeds'"
          if marker not in test_source:
              test_source += dedent("""\

              test('predeploy receipt stays outside the checkout until deploy succeeds', () => {
                assert.ok(releaseOperator.includes('function resolvePreDeployReceiptRoot()'))
                assert.ok(releaseOperator.includes('rootDirectory: preDeployReceiptRoot'))
                assert.ok(releaseOperator.includes('includeLiveRollbackProvenance: false'))
                assert.ok(releaseOperator.includes('Current authority checkout must remain clean immediately before deployment'))
                assert.ok(releaseOperator.includes("copyFileSync(receiptPath, path.join(path.dirname(finalReceiptPath), 'predeploy-receipt.json'))"))

                const predeployReceipt = releaseOperator.indexOf("writeReceipt(targetSha, 'built-awaiting-deploy'")
                const deploy = releaseOperator.indexOf('deployHostingWithTemporaryCredentials()')
                const finalReceipt = releaseOperator.indexOf("writeReceipt(targetSha, 'deployed'")
                const retainedPredeploy = releaseOperator.indexOf("'predeploy-receipt.json'")
                assert.ok(predeployReceipt >= 0 && deploy > predeployReceipt && finalReceipt > deploy && retainedPredeploy > finalReceipt)
              })
              """)
              test_path.write_text(test_source)
          PY

      - name: Verify corrective source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/live-release.mjs
          node --check urai-tier1/tests/final-protected-deploy-regressions.test.mjs
          node --test urai-tier1/tests/final-protected-deploy-regressions.test.mjs
          node urai-tier1/tests/exact-static-release-contract.test.mjs
          node scripts/verify-release-credential-boundary.mjs
          git diff --check

      - name: Commit normal corrective files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/live-release.mjs urai-tier1/tests/final-protected-deploy-regressions.test.mjs
          git diff --cached --check
          git commit -m 'Keep predeploy receipts outside authority checkout'
          git push origin HEAD:fix/predeploy-receipt-outside-checkout-20260714
