name: PR1068 Cinematic World Repair Observable

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/pr1068-cinematic-world-repair-pr.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1068-cinematic-world-repair-observable
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/replace-failed-home-lifemap-visuals
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Execute checked-in bounded correction
        shell: bash
        run: |
          set -euo pipefail
          source=.github/workflows/pr1068-cinematic-world-repair.yml
          test -f "$source"
          awk '/^          python3 - <<'\''PY'\''$/ {capture=1; next} capture && /^          PY$/ {exit} capture {sub(/^          /, ""); print}' "$source" > "$RUNNER_TEMP/pr1068-repair.py"
          test -s "$RUNNER_TEMP/pr1068-repair.py"
          python3 "$RUNNER_TEMP/pr1068-repair.py"
          grep -q 'HOME_BACKDROP' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          grep -q 'data-home-portal-lifecycle="opening-traversal-closing"' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          grep -q 'result.assetMode === null' scripts/run-continuous-spatial-proof-v21-grouped.mjs
          grep -q 'home-sky-ascent-complete' scripts/run-continuous-spatial-proof-v18-portal-stable.mjs
          ! grep -q 'data-home-asset-mode=' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          ! grep -q 'data-home-personalization-mode=' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx

      - name: Verify correction
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          node --check scripts/run-continuous-spatial-proof-v21-grouped.mjs
          node --check scripts/run-continuous-spatial-proof-v18-portal-stable.mjs
          node --check scripts/capture-lifemap-founder-proof-fixed.mjs
          node --test \
            urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs \
            urai-tier1/tests/home-ground-lifemap-art-bible-contract.test.mjs \
            urai-tier1/tests/lifemap-aaa-composition-contract.test.mjs \
            urai-tier1/tests/lifemap-scene-behavior.test.mjs \
            urai-tier1/tests/lifemap-semantic-owner-contract.test.mjs \
            urai-tier1/tests/lifemap-founder-harness-contract.test.mjs
          pnpm --dir urai-tier1 typecheck
          pnpm build:static

      - name: Commit production correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            urai-tier1/src/spatial/layout/HomeWorldProduction.tsx \
            urai-tier1/src/spatial/layout/HomeWorldProduction.module.css \
            urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx \
            scripts/run-continuous-spatial-proof-v21-grouped.mjs \
            scripts/run-continuous-spatial-proof-v18-portal-stable.mjs
          git diff --cached --check
          git commit -m 'Restore cinematic Home and portal lifecycle'
          git push origin HEAD:agent/replace-failed-home-lifemap-visuals
