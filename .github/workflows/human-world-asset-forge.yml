name: URAI Human World Asset Forge

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/author-urai-human-world-pack.mjs'
      - 'scripts/verify-urai-human-world-pack.mjs'
      - '.github/workflows/human-world-asset-forge.yml'
      - 'urai-tier1/src/spatial/council/**'
      - 'src/spatial/scene/HomeAvatar.tsx'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: human-world-asset-forge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  URAI_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PR_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}

jobs:
  forge-human-world:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Prove exact clean candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$URAI_SOURCE_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Author real Human World GLBs
        run: node scripts/author-urai-human-world-pack.mjs

      - name: Verify binary receipt contract
        run: node scripts/verify-urai-human-world-pack.mjs

      - name: Commit generated binaries to PR branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            urai-tier1/public/assets/urai/human-world/urai-human-real-v1.glb \
            urai-tier1/public/assets/urai/human-world/urai-council-human-world-v1.glb \
            urai-tier1/public/assets/urai/human-world/urai-shadow-human-world-v1.glb \
            operations/assets/generated-receipts/urai-human-world-pack-v1.json
          if git diff --cached --quiet; then
            echo 'Human World binaries already match the deterministic forge.'
            exit 0
          fi
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$current_head" = "$URAI_SOURCE_SHA"
          git config user.name 'urai-human-world-forge[bot]'
          git config user.email 'urai-human-world-forge[bot]@users.noreply.github.com'
          git commit -m 'forge real human world GLB assets'
          git push origin "HEAD:${PR_BRANCH}"

      - name: Verify committed form
        if: github.event_name != 'pull_request'
        run: node scripts/verify-urai-human-world-pack.mjs
