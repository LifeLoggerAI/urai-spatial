name: Repair geographic account scope

on:
  pull_request:
    types: [synchronize]
    branches:
      - feat/mirror-embodied-spatial-realm-v2-20260801

permissions:
  contents: write

concurrency:
  group: repair-geographic-account-scope
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/geographic-location-launch-minimum-v5-20260801
  REVIEWED_HEAD: 574ea40bc3d6cd476b909d5ed9b31ff074d1b432
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  repair:
    if: github.repository == 'LifeLoggerAI/urai-spatial' && github.event.pull_request.head.ref == 'feat/geographic-location-launch-minimum-v5-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact staged branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify exact staging authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git rev-parse HEAD^)" = "$REVIEWED_HEAD"
          test -f scripts/repair-geographic-account-scope.py
          mapfile -t changed < <(git diff --name-only "$REVIEWED_HEAD"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = '.github/workflows/repair-geographic-account-scope.yml'

      - name: Apply account-isolation corrections
        run: python scripts/repair-geographic-account-scope.py

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify full Tier-1 boundary
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter urai-tier1 test
          pnpm --filter urai-tier1 typecheck
          pnpm --filter urai-tier1 build

      - name: Commit clean account-isolation repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-geographic-account-scope.yml
          git rm scripts/repair-geographic-account-scope.py
          git add urai-tier1/src/app/location-map/geographic/GeographicLocationClient.tsx \
            urai-tier1/tests/geographic-location-client-contract.test.mjs
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Isolate geographic vaults by account"
          git push origin "HEAD:$TARGET_BRANCH"
