name: URAI Spatial Post Deploy Verify

on:
  workflow_dispatch:
    inputs:
      live_url:
        description: Live URL to verify
        required: true
        default: https://urai-4dc1d.web.app
        type: string
      expected_deployed_sha:
        description: Exact deployed Git SHA to verify against canonical main authority
        required: true
        type: string

concurrency:
  group: spatial-post-deploy-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-live:
    name: Verify live Spatial deployment
    runs-on: ubuntu-latest
    env:
      URAI_DEPLOY_URL: ${{ inputs.live_url }}
      URAI_EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha }}
      REQUIRE_LIVE_COMMIT_SHA: "true"
    steps:
      - name: Checkout expected deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_deployed_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify expected deployed SHA is canonical main authority
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          node scripts/verify-custom-domain-deployed-sha-authority.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static proof checks
        run: |
          pnpm verify:routes
          pnpm verify:assets
          pnpm check:production-claims
          pnpm check:firebase
          pnpm check:system-registry
          node scripts/check-home-xr-lock.mjs
          node scripts/check-home-xr-proof-manifest.mjs

      - name: XR runtime verification
        run: pnpm xr:verify

      - name: Live smoke checks
        run: |
          echo "Smoking target"
          pnpm smoke:home-xr:live
          pnpm smoke:live
          node scripts/check-home-xr-live-deploy-proof.mjs
