name: Life Map Bounded Review Repair PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lifemap-bounded-review-repair-pr.yml'

permissions:
  contents: write

concurrency:
  group: lifemap-bounded-review-repair-pr
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Execute reviewed bounded repair payload
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/lifemap-bounded-review-repair.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          payload = source[start:end]
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in payload.splitlines())
          helper_start = normalized.index('def replace_once(')
          helper_end = normalized.index('\n\nscene =', helper_start)
          helper = '''def replace_once(path: Path, old: str, new: str) -> None:
              import re
              text = path.read_text()
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new, 1))
                  return
              lines = [line.strip() for line in old.splitlines() if line.strip()]
              pattern = re.compile(r'[ \\t]*\\n[ \\t]*'.join(re.escape(line) for line in lines))
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one whitespace-safe match, found {len(matches)}")
              match = matches[0]
              replacement = new.strip('\\n')
              path.write_text(text[:match.start()] + replacement + text[match.end():])'''
          normalized = normalized[:helper_start] + helper + normalized[helper_end:]
          Path('/tmp/lifemap-bounded-review-repair.py').write_text(normalized + '\n')
          PY
          set +e
          python3 /tmp/lifemap-bounded-review-repair.py > /tmp/lifemap-bounded-review-repair.log 2>&1
          status=$?
          set -e
          cat /tmp/lifemap-bounded-review-repair.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ]; then
            rm -f .github/workflows/lifemap-bounded-review-repair-pr.yml
          fi

      - name: Retain bounded repair diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifemap-bounded-review-repair-${{ github.event.pull_request.head.sha }}
          path: /tmp/lifemap-bounded-review-repair.log
          if-no-files-found: error
          retention-days: 30

      - name: Fail on bounded repair assertion
        if: steps.execute.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Verify and publish real repair
        if: steps.execute.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/verify-lifemap-canvas-proof.mjs
          git diff --check
          test ! -e .github/workflows/lifemap-bounded-review-repair.yml
          test ! -e .github/workflows/lifemap-bounded-review-repair-pr.yml
          git config user.name 'urai-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix(life-map): close visual proof and journey review defects'
          git push origin HEAD:feat/life-map-aaa-final-production-20260723
