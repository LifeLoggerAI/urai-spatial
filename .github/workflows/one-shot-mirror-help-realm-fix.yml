name: One-shot Mirror movement-help realm repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-shot-mirror-help-realm-fix
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/mirror-embodied-spatial-realm-v2-20260801
  REVIEWED_HEAD: 804e2477719bc008cb59449e931a4fbd592a8a9f
  EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  repair:
    if: github.repository == 'LifeLoggerAI/urai-spatial' && github.event.pull_request.head.ref == 'feat/mirror-embodied-spatial-realm-v2-20260801'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact staged branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Verify bounded staging authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git merge-base --is-ancestor "$REVIEWED_HEAD" HEAD
          mapfile -t changed < <(git diff --name-only "$REVIEWED_HEAD"...HEAD)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/one-shot-mirror-help-realm-fix.yml"

      - name: Apply permanent accessibility correction
        shell: python
        run: |
          from pathlib import Path

          navigation = Path('urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx')
          nav_text = navigation.read_text()
          old_union = "realm: 'Home' | 'Ground' | 'Life Map'"
          new_union = "realm: 'Home' | 'Ground' | 'Life Map' | 'Mirror'"
          assert nav_text.count(old_union) == 1
          navigation.write_text(nav_text.replace(old_union, new_union, 1))

          client = Path('urai-tier1/src/app/mirror/MirrorSpatialClient.tsx')
          client_text = client.read_text()
          old_help = '<MovementHelp realm="Life Map" summary="Mirror is a calm evidence-aware reflection chamber."'
          new_help = '<MovementHelp realm="Mirror" summary="Mirror is a calm evidence-aware reflection chamber."'
          assert client_text.count(old_help) == 1
          client.write_text(client_text.replace(old_help, new_help, 1))

          contract = Path('urai-tier1/tests/mirror-spatial-realm-contract.test.mjs')
          contract_text = contract.read_text()
          marker = "const modelSource = fs.readFileSync(new URL('../src/spatial/mirror/mirrorPatternModel.ts', import.meta.url), 'utf8')\n"
          addition = "const navigationSource = fs.readFileSync(new URL('../src/spatial/navigation/EmbodiedNavigation.tsx', import.meta.url), 'utf8')\n"
          assert contract_text.count(marker) == 1
          assert 'Mirror movement help identifies the active realm' not in contract_text
          contract_text = contract_text.replace(marker, marker + addition, 1)
          contract_text += "\n\ntest('Mirror movement help identifies the active realm', () => {\n  assert.match(clientSource, /<MovementHelp realm=\"Mirror\"/)\n  assert.doesNotMatch(clientSource, /<MovementHelp realm=\"Life Map\"/)\n  assert.match(navigationSource, /realm: 'Home' \\| 'Ground' \\| 'Life Map' \\| 'Mirror'/)\n})\n"
          contract.write_text(contract_text)

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen graph
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify correction and full Tier-1 boundary
        run: |
          pnpm --filter urai-tier1 test
          pnpm --filter urai-tier1 typecheck
          pnpm --filter urai-tier1 build

      - name: Commit clean product correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/one-shot-mirror-help-realm-fix.yml
          git add urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx \
            urai-tier1/src/app/mirror/MirrorSpatialClient.tsx \
            urai-tier1/tests/mirror-spatial-realm-contract.test.mjs
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Mirror movement help realm"
          git push origin "HEAD:$TARGET_BRANCH"
