name: Digital Human Original Council Chromium Proof (Non-release)
on:
  pull_request:
    paths:
      - '.github/workflows/digital-human-original-council-browser.yml'
      - 'urai-tier1/tests/digital-human-council-browser.spec.ts'
      - 'urai-tier1/tests/digital-human-anonymous-browser.spec.ts'
      - 'urai-tier1/scripts/digital-human/**'
      - 'urai-tier1/src/spatial/council/**'
      - 'urai-tier1/src/spatial/digital-human/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-council-chromium:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      URAI_PROOF_BASE_URL: http://127.0.0.1:4290
      NEXT_PUBLIC_URAI_PREVIEW_MODE: 'true'
      NEXT_PUBLIC_URAI_PREVIEW_CHANNEL: digital-human-non-release
      NEXT_PUBLIC_URAI_ANONYMOUS_FACE_CALIBRATION: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          persist-credentials: false
      - name: Verify original exact source
        run: test "$(git rev-parse HEAD)" = "$URAI_EXACT_HEAD"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact workspace and real Chromium
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --dir urai-tier1 exec playwright install chromium
      - name: Generate deterministic anonymous face exclusively for development browser job
        run: |
          node urai-tier1/scripts/digital-human/generate-anonymous-face-glb.mjs urai-tier1/public/__digital-human-dev/anonymous-face-morph-v1.glb > /tmp/urai-anonymous-fixture-receipt.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/urai-anonymous-fixture-receipt.json'));if(r.sha256!=='3a6a44f9a2d7a666c15cb345852977c663d17f688eec8816def2237a53fd16bc'||r.morphableMeshes!==6)process.exit(1)"
      - name: Read original Council v4 binary and write measured head, skin and animation receipt
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/urai-v4-binary"
          node urai-tier1/scripts/digital-human/inspect-council-v4-glb.mjs \
            urai-tier1/public/assets/urai/generated/human-makehuman-v4/council-guide-human-makehuman-v4.glb \
            operations/assets/generated-receipts/council-guide-human-makehuman-v4.json \
            "$RUNNER_TEMP/urai-v4-binary/council-v4-original-geometry.json"
      - name: Start actual UrAi app and execute browser proof
        run: |
          set -eu
          (cd urai-tier1 && pnpm exec next dev --hostname 127.0.0.1 --port 4290) > /tmp/urai-council-next.log 2>&1 &
          child=$!
          trap 'kill "$child" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 75); do
            if curl -fsS "http://127.0.0.1:4290/council" -o /dev/null; then ready=true; break; fi
            if ! kill -0 "$child" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/urai-council-next.log
            exit 1
          fi
          cd urai-tier1
          pnpm exec playwright test tests/digital-human-council-browser.spec.ts tests/digital-human-anonymous-browser.spec.ts --reporter=line
      - name: Upload non-release browser receipts and startup logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digital-human-original-council-${{ env.URAI_EXACT_HEAD }}
          path: |
            urai-tier1/test-results/
            urai-tier1/playwright-report/
            /tmp/urai-council-next.log
            /tmp/urai-anonymous-fixture-receipt.json
            ${{ runner.temp }}/urai-v4-binary/
          if-no-files-found: warn
          retention-days: 30
