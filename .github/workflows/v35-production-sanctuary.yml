name: V35 Production Sanctuary Rebuild

on:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/v35-production-sanctuary.yml'
      - 'scripts/v35-production-sanctuary-transform.py'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact owner candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Materialize V35 transform against live V34 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/v35-production-sanctuary-transform.py')
          source = path.read_text()
          redundant = [
            '  "cinematic-enclosed-sacred-tech-sanctuary-v34": "cinematic-inhabited-sacred-tech-sanctuary-v35",\n',
            '  "v34-authored-stone-sanctuary-final": "v35-production-stone-sanctuary-rebuild",\n',
            '  "v34-sanctuary-scale-mechanical-reliquary-assembly": "v35-sanctuary-integrated-reliquary-service-frame",\n',
            '  "v34-segmented-spindle-reactor-integrated-with-cradle": "v35-segmented-reactor-column-inside-mechanical-reliquary",\n',
          ]
          for line in redundant:
            assert line in source, line
            source = source.replace(line, '', 1)
          path.write_text(source)
          PY
          python3 scripts/v35-production-sanctuary-transform.py
          source='urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx'
          grep -F 'v35-production-stone-sanctuary-rebuild' "$source"
          grep -F 'v35-sanctuary-integrated-reliquary-service-frame' "$source"
          grep -F 'v35-segmented-reactor-column-inside-mechanical-reliquary' "$source"
          grep -F 'data-home-art-certification="v35-retained-pixel-candidate"' "$source"
          ! grep -F 'v34-sanctuary-scale-mechanical-reliquary-assembly' "$source"
          ! grep -F 'v34-segmented-spindle-reactor-integrated-with-cradle' "$source"

      - name: Verify focused V35 contracts and production build
        shell: bash
        run: |
          set -euo pipefail
          cd urai-tier1
          node --test --test-concurrency=1 tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs tests/continuous-spatial-restoration-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs
          cd ..
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build:static

      - name: Commit V35 runtime source only if branch is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git diff --cached --quiet && { echo 'No V35 runtime changes to commit'; exit 1; }
          git commit -m 'Rebuild Home as V35 production sanctuary reliquary'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826
