name: Home Ground Canon Proof

on:
  pull_request:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - 'scripts/capture-home-ground-canon-proof.mjs'
      - 'urai-tier1/src/app/GroundSpatialWorldCanon.tsx'
      - 'urai-tier1/src/app/ground/**'
      - 'urai-tier1/src/spatial/layout/HomeWorldProduction.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionGroundCanon.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV223Geometry.tsx'
      - 'urai-tier1/src/spatial/layout/HomeWorldProductionV225PolishV3.tsx'
      - 'urai-tier1/src/spatial/world/GroundGateway.tsx'
      - 'urai-tier1/src/spatial/world/homeGroundContract.ts'
      - 'urai-tier1/src/spatial/world/worldEvents.ts'
      - 'urai-tier1/src/spatial/world/worldNavigation.css'
      - 'urai-tier1/src/app/currentHomeVisualAuthority.json'
      - 'urai-tier1/tests/embodied-exploration-contract.test.mjs'
      - 'urai-tier1/tests/accessibility-performance-embodied-exploration.spec.ts'
      - 'playwright.accessibility.config.ts'
      - '.github/workflows/home-ground-canon-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-ground-canon-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      URAI_EXACT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: '0'
      NEXT_PUBLIC_URAI_EXPLICIT_DEMO: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.URAI_EXACT_HEAD }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify Home Ground source contracts
        run: |
          node --check scripts/capture-home-ground-canon-proof.mjs
          cd urai-tier1
          node --import tsx --test tests/embodied-exploration-contract.test.mjs
          corepack pnpm run typecheck
      - name: Build exact static runtime
        run: pnpm build:static
      - name: Install Chromium
        run: pnpm --dir urai-tier1 exec playwright install --with-deps chromium
      - name: Capture exact-head Home Ground journey
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/home-ground-canon-proof
          python3 -m http.server 4173 --bind 127.0.0.1 --directory urai-tier1/out > /tmp/urai-home-ground-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/home/ >/dev/null; then break; fi
            sleep 1
          done
          URAI_PROOF_BASE=http://127.0.0.1:4173 URAI_PROOF_DIR=artifacts/home-ground-canon-proof node scripts/capture-home-ground-canon-proof.mjs
      - name: Run focused accessibility browser contract
        run: |
          pnpm --dir urai-tier1 exec playwright test \
            --config=../playwright.accessibility.config.ts \
            accessibility-performance-embodied-exploration.spec.ts \
            --project=chromium
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-ground-canon-proof-${{ env.URAI_EXACT_HEAD }}
          path: |
            artifacts/home-ground-canon-proof
            artifacts/accessibility-performance
          if-no-files-found: error
          retention-days: 90
