name: Home Proof Capture Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-proof-capture-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-proof-capture-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event.pull_request.head.ref == 'feat/home-final-personalized-sanctuary-20260723'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply bounded visual authority repair
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('urai-tier1/src/app/AssetDrivenHomeWorld.tsx')
          proof = Path('scripts/capture-continuous-spatial-proof-v18.mjs')
          test = Path('urai-tier1/tests/home-visual-authority-repair-contract.test.mjs')

          source = runtime.read_text()
          source = source.replace(
              "import FinalHomeWorld from './FinalHomeWorld'\n",
              "import FinalHomeWorld from './FinalHomeWorld'\nimport HomeSanctuaryWorld from './HomeSanctuaryWorld'\n",
              1,
          )

          old_asset = """function AuthoredHomeAsset({ path, mode, reducedMotion }: { path: string; mode: ReturnType<typeof useHomePersonalizedScene>['scene']['mode']; reducedMotion: boolean }) {
            const presenceClip = mode === 'permission-limited' || mode === 'unavailable' || mode === 'offline'
              ? 'Presence_Privacy'
              : mode === 'world-forming'
                ? 'Presence_Forming'
                : 'Presence_Idle'
            return <AnimatedAsset path={path} name=\"home-authored-entry-chamber\" clips={['Home_Breathing', presenceClip]} reducedMotion={reducedMotion} position={[0, -0.12, -1.2]} scale={[1.08, 1.08, 1.08]} />
          }
          """
          new_asset = """function AuthoredHomeSanctuary({ sourcePath, reducedMotion, walkTarget, playerPosition }: { sourcePath: string; reducedMotion: boolean; walkTarget: MutableRefObject<THREE.Vector3 | null>; playerPosition: MutableRefObject<THREE.Vector3> }) {
            const openMemory = useCallback((memoryId: string) => {
              window.dispatchEvent(new CustomEvent('urai:home-memory-open', { detail: { memoryId, source: 'home-sanctuary-walk' } }))
            }, [])
            return <group name=\"home-authored-entry-chamber\" userData={{ rejectedCandidatePath: sourcePath, visualOwner: 'home-sanctuary-world' }}>
              <HomeSanctuaryWorld reducedMotion={reducedMotion} walkTarget={walkTarget} playerPosition={playerPosition} onMemoryOpen={openMemory} />
            </group>
          }
          """
          if old_asset not in source:
              raise SystemExit('expected authored chamber block is absent; fail closed')
          source = source.replace(old_asset, new_asset, 1)

          old_call = "    <AuthoredHomeAsset path={chamberPath} mode={scene.mode} reducedMotion={reducedMotion} />"
          new_call = "    <AuthoredHomeSanctuary sourcePath={chamberPath} reducedMotion={reducedMotion} walkTarget={target} playerPosition={position} />"
          if old_call not in source:
              raise SystemExit('expected authored chamber call is absent; fail closed')
          source = source.replace(old_call, new_call, 1)

          state_anchor = "  const [assetsReady, setAssetsReady] = useState(false)\n"
          if state_anchor not in source:
              raise SystemExit('expected assets-ready state is absent; fail closed')
          source = source.replace(state_anchor, state_anchor + "  const [reviewLoadingHeld, setReviewLoadingHeld] = useState(false)\n", 1)

          effect_anchor = "  const markAssetsReady = useCallback(() => setAssetsReady(true), [])\n"
          effect_insert = """  useEffect(() => {
            const shouldHold = reviewMode && new URLSearchParams(window.location.search).get('homeLoadingHold') === '1'
            if (!shouldHold) {
              setReviewLoadingHeld(false)
              return
            }
            setReviewLoadingHeld(true)
            const timer = window.setTimeout(() => setReviewLoadingHeld(false), 1800)
            return () => window.clearTimeout(timer)
          }, [reviewMode])

          const markAssetsReady = useCallback(() => setAssetsReady(true), [])
          """
          if effect_anchor not in source:
              raise SystemExit('expected ready callback is absent; fail closed')
          source = source.replace(effect_anchor, effect_insert, 1)

          source = source.replace('data-home-animation-owner="gltf-authored-clips"', 'data-home-animation-owner="authored-sanctuary-plus-gltf-interactions"', 1)
          source = source.replace('{!assetsReady ? <div className="home-world-loading"', '{!assetsReady || reviewLoadingHeld ? <div className="home-world-loading"', 1)

          nav_start = source.find('      <nav className="home-semantic-navigation sr-only" aria-label="Accessible Home destinations">')
          nav_end = source.find('      </nav>', nav_start)
          if nav_start < 0 or nav_end < 0:
              raise SystemExit('expected duplicate semantic navigation is absent; fail closed')
          source = source[:nav_start] + source[nav_end + len('      </nav>\n'):]
          runtime.write_text(source)

          proof_source = proof.read_text()
          visible_anchor = """  return locator.evaluateAll((nodes) => nodes.filter((node) => {
              const style = getComputedStyle(node)
          """
          visible_replacement = """  return locator.evaluateAll((nodes) => nodes.filter((node) => {
              if (node.closest('.sr-only')) return false
              const style = getComputedStyle(node)
          """
          if visible_anchor not in proof_source:
              raise SystemExit('expected visible-count implementation is absent; fail closed')
          proof_source = proof_source.replace(visible_anchor, visible_replacement, 1)
          if "result.animationOwner === 'gltf-authored-clips'" not in proof_source:
              raise SystemExit('expected animation-owner proof is absent; fail closed')
          proof_source = proof_source.replace("result.animationOwner === 'gltf-authored-clips'", "result.animationOwner === 'authored-sanctuary-plus-gltf-interactions'", 1)
          loading_query = "candidateQuery('homePrivateFixture=1')\n  const navigation"
          if loading_query not in proof_source:
              raise SystemExit('expected loading query is absent; fail closed')
          proof_source = proof_source.replace(loading_query, "candidateQuery('homePrivateFixture=1&homeLoadingHold=1')\n  const navigation", 1)
          proof.write_text(proof_source)

          test.write_text("""import assert from 'node:assert/strict'
          import fs from 'node:fs'

          const runtime = fs.readFileSync(new URL('../src/app/AssetDrivenHomeWorld.tsx', import.meta.url), 'utf8')
          const proof = fs.readFileSync(new URL('../../scripts/capture-continuous-spatial-proof-v18.mjs', import.meta.url), 'utf8')

          assert.match(runtime, /HomeSanctuaryWorld/)
          assert.match(runtime, /authored-sanctuary-plus-gltf-interactions/)
          assert.match(runtime, /homeLoadingHold/)
          assert.equal((runtime.match(/aria-label=\"Accessible Home destinations\"/g) || []).length, 0)
          assert.match(proof, /node\.closest\('\.sr-only'\)/)
          assert.match(proof, /homeLoadingHold=1/)
          assert.match(proof, /authored-sanctuary-plus-gltf-interactions/)
          console.log('HOME_VISUAL_AUTHORITY_REPAIR_CONTRACT_PASSED')
          """)

      - name: Verify and publish repair
        shell: bash
        run: |
          set -euo pipefail
          node urai-tier1/tests/home-visual-authority-repair-contract.test.mjs
          git add urai-tier1/src/app/AssetDrivenHomeWorld.tsx scripts/capture-continuous-spatial-proof-v18.mjs urai-tier1/tests/home-visual-authority-repair-contract.test.mjs
          git config user.name 'LifeLoggerAI'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(home): restore coherent sanctuary visual authority'
          git fetch origin feat/home-final-personalized-sanctuary-20260723
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git push origin HEAD:feat/home-final-personalized-sanctuary-20260723
