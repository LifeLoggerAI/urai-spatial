name: Home Proof Capture Repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-proof-capture-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'LifeLoggerAI/urai-spatial' &&
      github.event.pull_request.head.ref == 'feat/home-final-personalized-sanctuary-20260723'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Materialize truthful pre-promotion capture
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const file = 'scripts/capture-continuous-spatial-proof-v18.mjs'
          let source = fs.readFileSync(file, 'utf8')
          const oldLine = "    await page.goto(urlFor(route), { waitUntil: 'domcontentloaded', timeout: 45_000 })"
          const newLine = "    await page.goto(urlFor(route, expectReady ? '' : candidateQuery()), { waitUntil: 'domcontentloaded', timeout: 45_000 })"
          if (source.includes(oldLine)) source = source.replace(oldLine, newLine)
          if (!source.includes(newLine)) throw new Error('Pre-promotion review-candidate capture contract was not materialized')
          fs.writeFileSync(file, source)
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/capture-continuous-spatial-proof-v18.mjs
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin feat/home-final-personalized-sanctuary-20260723
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git commit -m 'test(home): use disclosed candidate for pre-promotion normal capture'
          git push origin HEAD:feat/home-final-personalized-sanctuary-20260723
