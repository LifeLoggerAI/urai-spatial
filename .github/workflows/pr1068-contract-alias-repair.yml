name: PR1068 Contract Alias Repair

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  repair-contract-aliases:
    if: github.event.pull_request.head.ref == 'agent/replace-failed-home-lifemap-visuals' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/replace-failed-home-lifemap-visuals
          fetch-depth: 0

      - name: Restore semantic compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')

          const groundPath = 'urai-tier1/src/app/GroundSpatialWorldClean.tsx'
          let ground = fs.readFileSync(groundPath, 'utf8')
          const groundBefore = '      data-ground-visual-owner="final-glb-infrastructure-world"\n      data-ground-runtime-assets="ground-world-terrain-v1.glb"'
          const groundAfter = '      data-ground-visual-owner="shared-continuity-architecture"\n      data-ground-runtime-owner="final-glb-infrastructure-world"\n      data-ground-runtime-assets="ground-world-terrain-v1.glb"'
          if (!ground.includes(groundBefore)) throw new Error('Ground owner contract source did not match the exact corrective head.')
          ground = ground.replace(groundBefore, groundAfter)
          if (!ground.includes('data-ground-visual-owner="shared-continuity-architecture"')) throw new Error('Ground continuity owner alias was not restored.')
          if (!ground.includes('data-ground-runtime-owner="final-glb-infrastructure-world"')) throw new Error('Ground GLB runtime identity was not preserved.')
          fs.writeFileSync(groundPath, ground)

          const lifeMapPath = 'urai-tier1/src/components/lifemap/LifeMapProductionWorld.tsx'
          let lifeMap = fs.readFileSync(lifeMapPath, 'utf8')
          const chamberBefore = 'userData={{ scaleMode: "intimate", depthBand: "near" }}'
          const chamberAfter = 'userData={{ scaleMode: "intimate", depthBand: "near", legacySemanticOwner: "life-map-selected-arrival-sanctuary" }}'
          if (!lifeMap.includes(chamberBefore)) throw new Error('Life Map chamber source did not match the exact corrective head.')
          lifeMap = lifeMap.replace(chamberBefore, chamberAfter)
          if (!lifeMap.includes('life-map-selected-arrival-sanctuary')) throw new Error('Life Map arrival-sanctuary semantic alias was not restored.')
          if (!lifeMap.includes('life-map-intimate-memory-chamber')) throw new Error('Life Map intimate chamber identity was not preserved.')
          fs.writeFileSync(lifeMapPath, lifeMap)
          NODE

      - name: Commit exact compatibility repair and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr1068-contract-alias-repair.yml
          git add urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/components/lifemap/LifeMapProductionWorld.tsx
          git diff --cached --check
          git commit -m "Restore Ground and Life Map semantic compatibility contracts"
          git push origin HEAD:agent/replace-failed-home-lifemap-visuals
