name: Prune stale release runs

on:
  push:
    branches:
      - main
      - release/final-public-beta-stable-20260710
      - converge/final-canon-spatial-20260922
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: urai-spatial-release-queue-pruner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prune:
    name: Cancel superseded runs for this branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel stale runs from the same branch
        uses: actions/github-script@v7
        with:
          script: |
            const statuses = ['queued', 'in_progress', 'waiting', 'pending', 'requested'];
            const keepRun = context.runId;
            const keepBranch = context.ref.replace('refs/heads/', '');
            if (!context.ref.startsWith('refs/heads/')) return;
            const repository = { owner: context.repo.owner, repo: context.repo.repo };
            const currentHead = async () => (await github.rest.git.getRef({ ...repository, ref: `heads/${keepBranch}` })).data.object.sha;
            const keepSha = await currentHead();
            if (context.sha !== keepSha) {
              core.notice('Stale pruner invocation: current branch authority has moved; no runs cancelled.');
              return;
            }
            let inspected = 0;
            let cancelled = 0;
            const failures = [];

            for (const status of statuses) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...repository, branch: keepBranch, status, per_page: 100,
              });
              for (const run of runs) {
                if (run.id === keepRun || run.head_branch !== keepBranch || run.head_sha === keepSha) continue;
                inspected += 1;
                if (await currentHead() !== keepSha) {
                  core.notice('Branch moved during pruning; preserving remaining runs.');
                  return;
                }
                try {
                  const comparison = await github.rest.repos.compareCommits({ ...repository, base: run.head_sha, head: keepSha });
                  // Only a strict ancestor is superseded. Preserve unrelated or diverged work.
                  if (comparison.data.status !== 'ahead') continue;
                  // Recheck immediately before the mutation, including time spent comparing ancestry.
                  if (await currentHead() !== keepSha) {
                    core.notice('Branch moved before cancellation; preserving remaining runs.');
                    return;
                  }
                  await github.rest.actions.cancelWorkflowRun({ ...repository, run_id: run.id });
                  cancelled += 1;
                } catch (error) {
                  if (error?.status !== 409) failures.push(`${run.id}:${error?.status || 'unknown'}`);
                }
              }
            }
            await core.summary.addHeading('URAI Spatial branch queue pruning')
              .addRaw(`Branch preserved: ${keepBranch}\n`)
              .addRaw(`Exact SHA preserved: ${keepSha}\n`)
              .addRaw(`Superseded runs inspected: ${inspected}\n`)
              .addRaw(`Superseded runs cancelled: ${cancelled}\n`)
              .addRaw(`Unexpected failures: ${failures.length}\n`).write();
            if (failures.length) core.setFailed(`Unexpected cancellation failures: ${failures.join(', ')}`);
