name: Prune stale release runs

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
      - release/final-public-beta-stable-20260710
    paths:
      - .github/workflows/prune-stale-release-runs.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: urai-spatial-release-queue-pruner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prune:
    name: Cancel superseded runs for this branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pruning source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test cancellation authority
        run: node --test scripts/ci/prune-stale-release-runs.test.cjs
      - name: Cancel stale runs from the same branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const prune = require('./scripts/ci/prune-stale-release-runs.cjs');
            const result = await prune({ github, context, core });
            await core.summary
              .addHeading('URAI Spatial branch queue pruning')
              .addRaw('Live branch: ' + result.branch + '\n')
              .addRaw('Invocation SHA: ' + result.sha + '\n')
              .addRaw('Superseded invocation: ' + result.superseded + '\n')
              .addRaw('Cancellation requests: ' + result.cancelRequested + '\n')
              .addRaw('Terminal readbacks: ' + result.alreadyTerminal + '\n')
              .addRaw('Preserved runs: ' + result.preserved + '\n')
              .addRaw('Unexpected failures: ' + result.failures.length + '\n')
              .write();
            if (result.failures.length) core.setFailed('Unexpected cancellation failures: ' + result.failures.join(', '));
