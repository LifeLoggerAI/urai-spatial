name: Prune stale release runs

on:
  push:
    branches:
      - main
      - release/final-public-beta-stable-20260710
    paths:
      - .github/workflows/prune-stale-release-runs.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: urai-spatial-release-queue-pruner-${{ github.ref }}
  cancel-in-progress: true