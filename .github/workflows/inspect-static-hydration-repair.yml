name: Inspect static hydration repair v7

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-static-hydration-repair.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: d41c5275a359e028ff2b4b3ca37e585bcdfa8515
      NEXT_PUBLIC_URAI_BUILD_SHA: d41c5275a359e028ff2b4b3ca37e585bcdfa8515
    steps:
      - name: Checkout exact repaired main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Enable exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          test "$(pnpm --version)" = '10.0.0'
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build exact static output
        run: pnpm build:static
      - name: Probe local hydrated query identity
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/static-hydration-v7"
          mkdir -p "$out"
          cat > "$RUNNER_TEMP/static-server.mjs" <<'NODE'
          import http from 'node:http'
          import { createReadStream, existsSync, statSync } from 'node:fs'
          import path from 'node:path'
          const root = path.resolve('urai-tier1/out')
          const types = new Map([
            ['.html', 'text/html; charset=utf-8'], ['.js', 'text/javascript; charset=utf-8'],
            ['.css', 'text/css; charset=utf-8'], ['.json', 'application/json; charset=utf-8'],
            ['.svg', 'image/svg+xml'], ['.png', 'image/png'], ['.webp', 'image/webp'],
            ['.woff2', 'font/woff2'], ['.txt', 'text/plain; charset=utf-8'],
          ])
          function resolveFile(urlValue) {
            const pathname = decodeURIComponent(new URL(urlValue, 'http://127.0.0.1').pathname)
            const clean = pathname.replace(/^\/+/, '')
            const candidates = pathname === '/'
              ? ['index.html']
              : [clean, `${clean}.html`, path.join(clean, 'index.html')]
            for (const candidate of candidates) {
              const file = path.resolve(root, candidate)
              if (!file.startsWith(`${root}${path.sep}`) && file !== path.join(root, 'index.html')) continue
              if (existsSync(file) && statSync(file).isFile()) return file
            }
            return null
          }
          const server = http.createServer((req, res) => {
            const file = resolveFile(req.url || '/')
            if (!file) { res.writeHead(404); res.end('not found'); return }
            res.writeHead(200, { 'content-type': types.get(path.extname(file)) || 'application/octet-stream', 'cache-control': 'no-store' })
            createReadStream(file).pipe(res)
          })
          server.listen(4177, '127.0.0.1', () => console.log('ready'))
          NODE
          node "$RUNNER_TEMP/static-server.mjs" > "$out/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:4177/ >/dev/null && break
            sleep .2
          done
          OUT_DIR="$out" node - <<'NODE'
          const { chromium } = require('playwright')
          const fs = require('node:fs')
          const path = require('node:path')
          const out = process.env.OUT_DIR
          const identity = { memoryId: 'release-control-memory', manifestId: 'release-control-manifest', node: 'release-control-node' }
          const query = new URLSearchParams(identity).toString()
          const routes = [
            { name: 'focus', url: `http://127.0.0.1:4177/focus/?${query}`, selector: '[data-testid="urai-final-focus-chamber"]' },
            { name: 'replay', url: `http://127.0.0.1:4177/replay/?${query}`, selector: '[data-testid="cinematic-replay-client"]' },
          ]
          ;(async () => {
            const browser = await chromium.launch({ headless: true })
            const results = []
            try {
              for (const route of routes) {
                const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, serviceWorkers: 'block' })
                const page = await context.newPage()
                const pageErrors = []
                const consoleErrors = []
                const requestFailures = []
                page.on('pageerror', error => pageErrors.push(String(error?.stack || error)))
                page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()) })
                page.on('requestfailed', request => requestFailures.push({ url: request.url(), failure: request.failure() }))
                const response = await page.goto(route.url, { waitUntil: 'domcontentloaded', timeout: 60000 })
                await page.waitForTimeout(25000)
                const state = await page.evaluate(({ selector, expected }) => {
                  const elements = [...document.querySelectorAll(selector)]
                  return {
                    readyState: document.readyState,
                    href: location.href,
                    elements: elements.map(element => {
                      const bounds = element.getBoundingClientRect()
                      const style = getComputedStyle(element)
                      return {
                        memoryId: element.getAttribute('data-memory-id'),
                        manifestId: element.getAttribute('data-manifest-id'),
                        node: element.getAttribute('data-node'),
                        width: bounds.width,
                        height: bounds.height,
                        display: style.display,
                        visibility: style.visibility,
                        matches: element.getAttribute('data-memory-id') === expected.memoryId
                          && element.getAttribute('data-manifest-id') === expected.manifestId
                          && element.getAttribute('data-node') === expected.node,
                      }
                    }),
                    nextDataScripts: [...document.scripts].map(script => script.src || 'inline').filter(value => value.includes('_next') || value === 'inline'),
                  }
                }, { selector: route.selector, expected: identity })
                const screenshot = path.join(out, `${route.name}.png`)
                await page.screenshot({ path: screenshot, fullPage: true, animations: 'disabled' })
                results.push({
                  route: route.name,
                  responseStatus: response?.status() || null,
                  state,
                  pageErrors,
                  consoleErrors,
                  requestFailures,
                  passed: state.elements.some(element => element.matches && element.width > 0 && element.height > 0),
                })
                await context.close()
              }
            } finally {
              await browser.close()
            }
            const report = { schemaVersion: 1, targetSha: process.env.TARGET_SHA, generatedAt: new Date().toISOString(), results }
            fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2) + '\n')
            console.log(JSON.stringify(report, null, 2))
          })().catch(error => {
            fs.writeFileSync(path.join(out, 'probe-error.txt'), String(error?.stack || error) + '\n')
            console.error(error)
            process.exitCode = 1
          })
          NODE
          echo "out=$out" >> "$GITHUB_OUTPUT"
      - name: Upload static hydration probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-hydration-v7-${{ env.TARGET_SHA }}
          path: ${{ steps.probe.outputs.out }}
          if-no-files-found: error
          retention-days: 30
