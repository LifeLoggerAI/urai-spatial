name: Inspect static hydration repair v10

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/inspect-static-hydration-repair.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_SHA: 8d2406e1db52e3dd2e9a8a5f05e3972edc72907d
      NEXT_PUBLIC_URAI_BUILD_SHA: 8d2406e1db52e3dd2e9a8a5f05e3972edc72907d
    steps:
      - name: Checkout exact PR 605 head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Prove exact clean source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Enable exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.0.0 --activate
          test "$(pnpm --version)" = '10.0.0'
      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile
      - name: Resolve runner Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          test -x "$chrome"
          "$chrome" --version
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
      - name: Build exact static output
        run: pnpm build:static
      - name: Probe visible query identity on desktop and mobile
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/static-hydration-v10"
          mkdir -p "$out"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/static-server.mjs" <<'NODE'
          import http from 'node:http'
          import { createReadStream, existsSync, statSync } from 'node:fs'
          import path from 'node:path'
          const root = path.resolve('urai-tier1/out')
          const types = new Map([
            ['.html', 'text/html; charset=utf-8'], ['.js', 'text/javascript; charset=utf-8'],
            ['.css', 'text/css; charset=utf-8'], ['.json', 'application/json; charset=utf-8'],
            ['.svg', 'image/svg+xml'], ['.png', 'image/png'], ['.webp', 'image/webp'],
            ['.woff2', 'font/woff2'], ['.txt', 'text/plain; charset=utf-8'],
          ])
          function resolveFile(urlValue) {
            const pathname = decodeURIComponent(new URL(urlValue, 'http://127.0.0.1').pathname)
            const clean = pathname.replace(/^\/+/, '')
            const candidates = pathname === '/' ? ['index.html'] : [clean, `${clean}.html`, path.join(clean, 'index.html')]
            for (const candidate of candidates) {
              const file = path.resolve(root, candidate)
              if (!file.startsWith(`${root}${path.sep}`) && file !== path.join(root, 'index.html')) continue
              if (existsSync(file) && statSync(file).isFile()) return file
            }
            return null
          }
          const server = http.createServer((req, res) => {
            const file = resolveFile(req.url || '/')
            if (!file) { res.writeHead(404); res.end('not found'); return }
            res.writeHead(200, { 'content-type': types.get(path.extname(file)) || 'application/octet-stream', 'cache-control': 'no-store' })
            createReadStream(file).pipe(res)
          })
          server.listen(4177, '127.0.0.1', () => console.log('ready'))
          NODE
          node "$RUNNER_TEMP/static-server.mjs" > "$out/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            curl --fail --silent http://127.0.0.1:4177/ >/dev/null && break
            sleep .2
          done
          OUT_DIR="$out" node - <<'NODE'
          const { chromium } = require('playwright')
          const fs = require('node:fs')
          const path = require('node:path')
          const out = process.env.OUT_DIR
          const identity = { memoryId: 'release-control-memory', manifestId: 'release-control-manifest', node: 'release-control-node' }
          const query = new URLSearchParams(identity).toString()
          const routes = [
            { name: 'focus', url: `http://127.0.0.1:4177/focus/?${query}`, selector: '[data-testid="urai-final-focus-chamber"]' },
            { name: 'replay', url: `http://127.0.0.1:4177/replay/?${query}`, selector: '[data-testid="cinematic-replay-client"]' },
          ]
          const profiles = [
            { name: 'desktop', viewport: { width: 1440, height: 1000 } },
            { name: 'mobile', viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true },
          ]
          ;(async () => {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_BIN, args: ['--no-sandbox', '--disable-dev-shm-usage'] })
            const results = []
            try {
              for (const profile of profiles) {
                for (const route of routes) {
                  const { name: profileName, ...options } = profile
                  const context = await browser.newContext({ ...options, serviceWorkers: 'block' })
                  const page = await context.newPage()
                  const pageErrors = []
                  const consoleErrors = []
                  const requestFailures = []
                  page.on('pageerror', error => pageErrors.push(String(error?.stack || error)))
                  page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()) })
                  page.on('requestfailed', request => requestFailures.push({ url: request.url(), failure: request.failure() }))
                  const response = await page.goto(route.url, { waitUntil: 'domcontentloaded', timeout: 60000 })
                  await page.waitForFunction(
                    ({ selector, expected }) => [...document.querySelectorAll(selector)].some(element => {
                      const bounds = element.getBoundingClientRect()
                      const style = getComputedStyle(element)
                      return style.display !== 'none' && style.visibility !== 'hidden' && bounds.width > 0 && bounds.height > 0
                        && element.getAttribute('data-memory-id') === expected.memoryId
                        && element.getAttribute('data-manifest-id') === expected.manifestId
                        && element.getAttribute('data-node') === expected.node
                    }),
                    { selector: route.selector, expected: identity },
                    { timeout: 20000 },
                  )
                  const state = await page.evaluate(({ selector, expected }) => ({
                    readyState: document.readyState,
                    href: location.href,
                    elements: [...document.querySelectorAll(selector)].map(element => {
                      const bounds = element.getBoundingClientRect()
                      const style = getComputedStyle(element)
                      return {
                        memoryId: element.getAttribute('data-memory-id'),
                        manifestId: element.getAttribute('data-manifest-id'),
                        node: element.getAttribute('data-node'),
                        owner: element.getAttribute('data-visible-route-owner'),
                        width: bounds.width,
                        height: bounds.height,
                        display: style.display,
                        visibility: style.visibility,
                        matches: element.getAttribute('data-memory-id') === expected.memoryId
                          && element.getAttribute('data-manifest-id') === expected.manifestId
                          && element.getAttribute('data-node') === expected.node,
                      }
                    }),
                  }), { selector: route.selector, expected: identity })
                  const filename = `${profileName}-${route.name}.png`
                  await page.screenshot({ path: path.join(out, filename), fullPage: true, animations: 'disabled' })
                  const passed = response?.status() === 200
                    && state.elements.some(element => element.matches && element.width > 0 && element.height > 0 && element.display !== 'none' && element.visibility !== 'hidden')
                    && pageErrors.length === 0
                    && consoleErrors.length === 0
                    && requestFailures.length === 0
                  results.push({ profile: profileName, route: route.name, responseStatus: response?.status() || null, state, pageErrors, consoleErrors, requestFailures, screenshot: filename, passed })
                  await context.close()
                }
              }
            } finally {
              await browser.close()
            }
            const report = { schemaVersion: 3, targetSha: process.env.TARGET_SHA, chromeBin: process.env.CHROME_BIN, generatedAt: new Date().toISOString(), passed: results.every(item => item.passed), results }
            fs.writeFileSync(path.join(out, 'report.json'), JSON.stringify(report, null, 2) + '\n')
            console.log(JSON.stringify(report, null, 2))
            if (!report.passed) process.exitCode = 1
          })().catch(error => {
            fs.writeFileSync(path.join(out, 'probe-error.txt'), String(error?.stack || error) + '\n')
            console.error(error)
            process.exitCode = 1
          })
          NODE
      - name: Upload static hydration probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: static-hydration-v10-${{ env.TARGET_SHA }}
          path: ${{ steps.probe.outputs.out }}
          if-no-files-found: error
          retention-days: 30
