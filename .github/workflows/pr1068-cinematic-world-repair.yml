name: PR1068 Cinematic World Repair

on:
  push:
    branches:
      - agent/replace-failed-home-lifemap-visuals
    paths:
      - .github/workflows/pr1068-cinematic-world-repair.yml

permissions:
  contents: write

concurrency:
  group: pr1068-cinematic-world-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: agent/replace-failed-home-lifemap-visuals
          fetch-depth: 1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply bounded production corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {count}')
              return text.replace(old, new, 1)

          home_path = Path('urai-tier1/src/spatial/layout/HomeWorldProduction.tsx')
          home = home_path.read_text()
          home = replace_once(
              home,
              'import { Float, Sky, Sparkles, Stars, useAnimations, useGLTF } from "@react-three/drei";',
              'import { Float, Sky, Sparkles, Stars, useAnimations, useGLTF, useTexture } from "@react-three/drei";',
              'Home drei import',
          )
          home = replace_once(
              home,
              'const ORB_MODEL = "/assets/urai/generated/models/urai-orb-avatar-v1.glb";\n',
              'const ORB_MODEL = "/assets/urai/generated/models/urai-orb-avatar-v1.glb";\nconst HOME_BACKDROP = "/assets/urai/home/home-threshold-main.webp";\n',
              'Home backdrop constant',
          )
          home = replace_once(
              home,
              'type PortalSequence = "idle" | "traversal";',
              'type PortalDestination = "ground" | "life-map";\ntype PortalSequence = "idle" | `${PortalDestination}:opening` | `${PortalDestination}:traversal` | `${PortalDestination}:closing`;',
              'portal sequence type',
          )
          old_material = '''  if (objectName.includes("sanctuary-terrain") || objectName.startsWith("mountain-ridge") || objectName.startsWith("horizon-mountain")) {
    material.color.set("#5f765d");
    material.emissive.set("#18251a");
    material.emissiveIntensity = 0.12;
    material.map = null;
    material.normalMap = null;
    material.roughness = 0.98;
    material.metalness = 0;
  } else if (objectName.startsWith("village-tower")) {
    material.color.set("#624d38");
    material.emissive.set("#3a2515");
    material.emissiveIntensity = 0.09;
    material.roughness = 0.9;
    material.metalness = 0;
  } else if (objectName.startsWith("village-roof")) {
    material.color.set("#9d6d3e");
    material.emissive.set("#4a2a12");
    material.emissiveIntensity = 0.14;
    material.roughness = 0.76;
    material.metalness = 0.05;
  } else if (objectName.startsWith("living-growth") || objectName.includes("vegetation")) {
    material.color.set("#47754c");
    material.emissive.set("#102a15");
    material.emissiveIntensity = 0.13;
    material.map = null;
    material.normalMap = null;
    material.roughness = 0.96;
    material.metalness = 0;
  } else if (objectName.startsWith("sanctuary-waterfall")) {
    material.color.set("#87c7d0");
    material.emissive.set("#174758");
    material.emissiveIntensity = 0.28;
    material.opacity = 0.48;
    material.transparent = true;
    material.depthWrite = false;
    material.roughness = 0.16;
    material.metalness = 0;
  }
'''
          new_material = '''  if (objectName.includes("sanctuary-terrain") || objectName.startsWith("mountain-ridge") || objectName.startsWith("horizon-mountain")) {
    material.color.set("#365e46");
    material.emissive.set("#07150d");
    material.emissiveIntensity = 0.07;
    if (material.normalMap) material.normalScale.setScalar(0.5);
    material.roughness = 0.94;
    material.metalness = 0;
  } else if (objectName.startsWith("village-tower")) {
    material.color.set("#5f4834");
    material.emissive.set("#26170d");
    material.emissiveIntensity = 0.07;
    material.roughness = 0.92;
    material.metalness = 0;
  } else if (objectName.startsWith("village-roof")) {
    material.color.set("#8f5632");
    material.emissive.set("#34190d");
    material.emissiveIntensity = 0.1;
    material.roughness = 0.82;
    material.metalness = 0.02;
  } else if (objectName.startsWith("living-growth") || objectName.includes("vegetation")) {
    material.color.set("#2f6a43");
    material.emissive.set("#071b0f");
    material.emissiveIntensity = 0.08;
    if (material.normalMap) material.normalScale.setScalar(0.46);
    material.roughness = 0.92;
    material.metalness = 0;
  } else if (objectName.startsWith("sanctuary-waterfall")) {
    material.color.set("#77c6cf");
    material.emissive.set("#0b3f4d");
    material.emissiveIntensity = 0.24;
    material.opacity = 0.42;
    material.transparent = true;
    material.depthWrite = false;
    material.roughness = 0.18;
    material.metalness = 0;
  }
'''
          home = replace_once(home, old_material, new_material, 'Home authored material character')

          old_village = '''    const villageIndex = indexedName(object.name, "inhabited-village-");
    if (villageIndex !== null) {
      if (villageIndex % 3 === 0) object.visible = false;
      else {
        const variation = nameVariation(object.name);
        const scale = 0.68 + variation * 0.2;
        object.scale.multiplyScalar(scale);
        object.rotation.y += (variation - 0.5) * 0.84;
      }
      return;
    }
'''
          new_village = '''    const villageIndex = indexedName(object.name, "inhabited-village-");
    if (villageIndex !== null) {
      if (villageIndex % 4 !== 1) object.visible = false;
      else {
        const variation = nameVariation(object.name);
        const scale = 0.72 + variation * 0.18;
        object.scale.multiplyScalar(scale);
        object.rotation.y += (variation - 0.5) * 0.84;
      }
      return;
    }
    const towerIndex = indexedName(object.name, "village-tower-");
    if (towerIndex !== null) {
      if (towerIndex % 4 !== 1) object.visible = false;
      else object.scale.multiplyScalar(0.78 + nameVariation(object.name) * 0.16);
      return;
    }
    const roofIndex = indexedName(object.name, "village-roof-");
    if (roofIndex !== null) {
      if (roofIndex % 4 !== 1) object.visible = false;
      else object.scale.multiplyScalar(0.8 + nameVariation(object.name) * 0.14);
      return;
    }
'''
          home = replace_once(home, old_village, new_village, 'Home repeated village suppression')
          home = replace_once(home, 'if (growthIndex % 2 === 0) object.visible = false;', 'if (growthIndex % 3 !== 1) object.visible = false;', 'Home repeated growth suppression')

          readiness_anchor = '''function SanctuaryPathAndLanterns() {
'''
          backdrop = '''function CinematicHomeBackdrop() {
  const texture = useTexture(HOME_BACKDROP);
  useEffect(() => {
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = Math.max(texture.anisotropy, 4);
    texture.needsUpdate = true;
  }, [texture]);
  return (
    <group name="home-authored-cinematic-horizon" raycast={DISABLED_RAYCAST}>
      <mesh position={[0, 7.4, -34]} scale={[44, 24, 1]} renderOrder={-4}>
        <planeGeometry args={[1, 1]} />
        <meshBasicMaterial map={texture} transparent opacity={0.72} depthWrite={false} toneMapped={false} fog={false} />
      </mesh>
      <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, -0.22, -8]} scale={[1.25, 1, 1]}>
        <circleGeometry args={[22, 64]} />
        <meshStandardMaterial color="#234735" roughness={1} metalness={0} />
      </mesh>
    </group>
  );
}

function SanctuaryPathAndLanterns() {
'''
          home = replace_once(home, readiness_anchor, backdrop, 'Home cinematic authored backdrop')

          old_path = '''function SanctuaryPathAndLanterns() {
  const lanterns: [number, number, number][] = [[-3.5, 0.52, 5.0], [3.5, 0.52, 3.4], [-3.2, 0.52, 0.7], [3.1, 0.52, -2.1], [-2.7, 0.52, -4.7], [2.5, 0.52, -6.2]];
  return (
    <group name="home-authored-sanctuary-path-and-lanterns" raycast={DISABLED_RAYCAST}>
      <mesh rotation={[-Math.PI / 2, 0, 0]} position={[0, 0.105, -1.7]} scale={[1.05, 8.9, 1]}>
        <planeGeometry args={[1.4, 1.4, 1, 1]} />
        <meshStandardMaterial color="#8b7960" roughness={0.98} metalness={0} />
      </mesh>
      <mesh rotation={[-Math.PI / 2, 0, -0.08]} position={[-1.5, 0.09, -6.7]} scale={[2.4, 5.2, 1]}>
        <planeGeometry args={[1.2, 1.2, 1, 1]} />
        <meshStandardMaterial color="#4f7f75" emissive="#143c3a" emissiveIntensity={0.2} roughness={0.18} metalness={0} transparent opacity={0.72} />
      </mesh>
      {lanterns.map((position, index) => (
        <group key={index} position={position}>
          <mesh position={[0, -0.28, 0]}><cylinderGeometry args={[0.035, 0.055, 0.55, 8]} /><meshStandardMaterial color="#514536" roughness={0.92} /></mesh>
          <mesh><sphereGeometry args={[0.09, 12, 8]} /><meshStandardMaterial color="#ffe1a1" emissive="#ffad55" emissiveIntensity={3.1} roughness={0.36} /></mesh>
          <pointLight color="#ffbd72" intensity={2.1} distance={5.8} decay={2} />
        </group>
      ))}
    </group>
  );
}
'''
          new_path = '''function SanctuaryPathAndLanterns() {
  const lanterns: [number, number, number][] = [[-3.5, 0.52, 5.0], [3.5, 0.52, 3.4], [-3.2, 0.52, 0.7], [3.1, 0.52, -2.1], [-2.7, 0.52, -4.7], [2.5, 0.52, -6.2]];
  const stones = useMemo(() => Array.from({ length: 15 }, (_, index) => {
    const z = 6.2 - index * 0.92;
    const x = Math.sin(index * 0.78) * 0.56 + Math.sin(index * 0.21) * 0.2;
    return { position: [x, 0.115, z] as [number, number, number], rotation: (index % 5 - 2) * 0.08, scale: 0.82 + (index % 4) * 0.06 };
  }), []);
  const river = useMemo(() => new THREE.CatmullRomCurve3([
    new THREE.Vector3(-4.8, 0.13, 7.5), new THREE.Vector3(-3.2, 0.13, 3.8), new THREE.Vector3(-4.0, 0.13, 0.2),
    new THREE.Vector3(-2.8, 0.13, -3.3), new THREE.Vector3(-3.7, 0.13, -7.5), new THREE.Vector3(-2.4, 0.13, -10.8),
  ], false, "catmullrom", 0.34), []);
  return (
    <group name="home-authored-sanctuary-path-and-lanterns" raycast={DISABLED_RAYCAST}>
      {stones.map((stone, index) => (
        <mesh key={`stone-${index}`} position={stone.position} rotation={[0, stone.rotation, 0]} scale={[stone.scale, 1, 0.72 + (index % 3) * 0.08]}>
          <cylinderGeometry args={[0.5, 0.56, 0.08, 18]} />
          <meshStandardMaterial color={index % 3 === 0 ? "#8d7a61" : "#756b58"} roughness={0.98} metalness={0} />
        </mesh>
      ))}
      <mesh geometry={new THREE.TubeGeometry(river, 72, 0.42, 14, false)} scale={[1, 0.22, 1]}>
        <meshStandardMaterial color="#4f918b" emissive="#0c3537" emissiveIntensity={0.17} roughness={0.22} metalness={0} transparent opacity={0.58} depthWrite={false} />
      </mesh>
      {lanterns.map((position, index) => (
        <group key={index} position={position}>
          <mesh position={[0, -0.28, 0]}><cylinderGeometry args={[0.035, 0.055, 0.55, 10]} /><meshStandardMaterial color="#3e372f" roughness={0.94} /></mesh>
          <mesh><sphereGeometry args={[0.09, 16, 10]} /><meshStandardMaterial color="#ffe5ad" emissive="#ff9b46" emissiveIntensity={2.5} roughness={0.38} /></mesh>
          <pointLight color="#ffb866" intensity={1.7} distance={5.6} decay={2} />
        </group>
      ))}
    </group>
  );
}
'''
          home = replace_once(home, old_path, new_path, 'Home path and river composition')

          old_camera = '''    const portrait = size.height > size.width;
    camera.position.set(position.current.x, portrait ? 4.15 : 4.7, position.current.z + (portrait ? 14.9 : 15.8));
    camera.lookAt(position.current.x, 1.15 + pitch.current, position.current.z - (portrait ? 8.2 : 9.6));
'''
          new_camera = '''    const portrait = size.height > size.width;
    camera.position.set(position.current.x, portrait ? 3.55 : 3.72, position.current.z + (portrait ? 13.7 : 13.05));
    camera.lookAt(position.current.x, 1.12 + pitch.current, position.current.z - (portrait ? 7.2 : 7.8));
'''
          home = replace_once(home, old_camera, new_camera, 'Home initial camera')
          home = replace_once(
              home,
              'cameraOffset.current.set(0, (portrait ? 4.15 : 4.7) + pitch.current * 0.9, portrait ? 14.9 : 15.8).applyAxisAngle(upAxis.current, yaw.current);',
              'cameraOffset.current.set(0, (portrait ? 3.55 : 3.72) + pitch.current * 0.82, portrait ? 13.7 : 13.05).applyAxisAngle(upAxis.current, yaw.current);',
              'Home follow camera offset',
          )
          home = replace_once(
              home,
              'camera.lookAt(position.current.x, 1.15 + pitch.current, position.current.z - (portrait ? 8.2 : 9.6));',
              'camera.lookAt(position.current.x, 1.12 + pitch.current, position.current.z - (portrait ? 7.2 : 7.8));',
              'Home follow camera look',
          )

          old_scene = '''      <color attach="background" args={["#315d69"]} />
      <Sky distance={450000} sunPosition={[9, 6.5, -15]} inclination={0.43} azimuth={0.24} turbidity={2.6} rayleigh={3.2} mieCoefficient={0.0035} mieDirectionalG={0.78} />
      <fogExp2 attach="fog" args={["#688078", 0.0062]} />
      <ambientLight intensity={1.34} color="#ffe6c8" />
      <hemisphereLight args={["#ffe0b0", "#365844", 2.05]} />
      <directionalLight position={[9, 13, 12]} intensity={6.4} color="#ffc982" />
      <directionalLight position={[-10, 9, -8]} intensity={1.25} color="#b8e0e3" />
      <pointLight position={[0, 7, -9]} color="#ffbd72" intensity={6.2} distance={42} decay={2} />
      <pointLight position={[6, 4, 3]} color="#d8f0d4" intensity={2.2} distance={26} decay={2} />
      <Stars radius={115} depth={76} count={180} factor={0.75} saturation={0.04} fade speed={0.01} />
      <Sparkles count={44} scale={[24, 8, 28]} position={[0, 3.0, -5]} size={0.64} speed={0.028} opacity={0.075} color="#f9ddb0" />
'''
          new_scene = '''      <color attach="background" args={["#17333a"]} />
      <Sky distance={450000} sunPosition={[-14, 2.2, -34]} inclination={0.36} azimuth={0.18} turbidity={5.4} rayleigh={1.25} mieCoefficient={0.009} mieDirectionalG={0.84} />
      <fogExp2 attach="fog" args={["#38564e", 0.0082]} />
      <ambientLight intensity={0.62} color="#ffe2bd" />
      <hemisphereLight args={["#ffd7a4", "#183b2a", 1.22]} />
      <directionalLight position={[-10, 8, 10]} intensity={3.45} color="#ffb868" />
      <directionalLight position={[10, 7, -9]} intensity={0.72} color="#addfe2" />
      <pointLight position={[0, 5.5, -7]} color="#ffad5b" intensity={3.25} distance={34} decay={2} />
      <pointLight position={[5, 3.5, 2]} color="#cce8cf" intensity={1.2} distance={22} decay={2} />
      <Stars radius={115} depth={76} count={90} factor={0.5} saturation={0.03} fade speed={0.008} />
      <Sparkles count={30} scale={[24, 7, 28]} position={[0, 2.6, -5]} size={0.52} speed={0.022} opacity={0.055} color="#f5d7a7" />
'''
          home = replace_once(home, old_scene, new_scene, 'Home atmosphere and lighting')
          home = replace_once(home, '      <HomeEnvironment walkTarget={target} />\n', '      <CinematicHomeBackdrop />\n      <HomeEnvironment walkTarget={target} />\n', 'Home backdrop mount')
          home = replace_once(home, '<EffectComposer multisampling={0}><Bloom intensity={0.24} luminanceThreshold={0.82} luminanceSmoothing={0.18} mipmapBlur /><Vignette eskil={false} offset={0.12} darkness={0.018} /></EffectComposer>', '<EffectComposer multisampling={0}><Bloom intensity={0.16} luminanceThreshold={0.9} luminanceSmoothing={0.16} mipmapBlur /><Vignette eskil={false} offset={0.14} darkness={0.08} /></EffectComposer>', 'Home post-processing')

          home = replace_once(home, '  const [assetMode, setAssetMode] = useState("ready");\n', '', 'remove retired assetMode state')
          home = replace_once(home, '  const avatar = useRef<THREE.Group | null>(null);\n', '  const avatar = useRef<THREE.Group | null>(null);\n  const portalTimers = useRef<number[]>([]);\n', 'Home portal timer ref')
          old_begin = '  const beginPortalTravel = useCallback((travel: () => void) => { if (useSceneStore.getState().inputLocked) return; setPortalSequence("traversal"); travel(); }, []);\n  const onGround = useCallback(() => beginPortalTravel(() => requestUraiWorldTravel({ destination: "infrastructure-hub", href: "/ground/", entryPortal: "home-ground", cameraCheckpoint: "home-ground-descent" })), [beginPortalTravel]);\n  const onLifeMap = useCallback(() => beginPortalTravel(() => requestUraiWorldTravel({ destination: "life-map", href: "/life-map/?from=home-sky", entryPortal: "home-sky", cameraCheckpoint: "home-sky-ascent" })), [beginPortalTravel]);\n'
          new_begin = '''  const clearPortalTimers = useCallback(() => {
    portalTimers.current.forEach((timer) => window.clearTimeout(timer));
    portalTimers.current = [];
  }, []);
  const beginPortalTravel = useCallback((destination: PortalDestination, travel: () => void) => {
    const scene = useSceneStore.getState();
    if (scene.inputLocked) return;
    clearPortalTimers();
    scene.lock();
    setOrbState("transition");
    setPortalSequence(`${destination}:opening`);
    portalTimers.current = [
      window.setTimeout(() => setPortalSequence(`${destination}:traversal`), 180),
      window.setTimeout(() => setPortalSequence(`${destination}:closing`), 560),
      window.setTimeout(() => { setOrbState("idle"); travel(); }, 820),
    ];
  }, [clearPortalTimers]);
  const onGround = useCallback(() => beginPortalTravel("ground", () => requestUraiWorldTravel({ destination: "infrastructure-hub", href: "/ground/", entryPortal: "home-ground", cameraCheckpoint: "home-ground-descent" })), [beginPortalTravel]);
  const onLifeMap = useCallback(() => beginPortalTravel("life-map", () => {
    const scene = useSceneStore.getState();
    scene.setPhase("ASCENT");
  }), [beginPortalTravel]);
'''
          home = replace_once(home, old_begin, new_begin, 'Home portal lifecycle')
          home = replace_once(home, '    setAssetMode(query.get("homeAssetReview") === "1" ? "disclosed-review-candidate" : "ready");\n', '', 'remove retired assetMode effect')
          home = replace_once(home, '  }, []);\n\n  useEffect(() => {\n    const cancelAscent', '  }, []);\n\n  useEffect(() => () => clearPortalTimers(), [clearPortalTimers]);\n\n  useEffect(() => {\n    const cancelAscent', 'Home portal timer cleanup')
          home = replace_once(home, '      data-home-portal-sequence={portalSequence}\n', '      data-home-portal-sequence={portalSequence}\n      data-home-portal-lifecycle="opening-traversal-closing"\n', 'Home portal lifecycle marker')
          home = replace_once(home, '        camera={{ position: [0, 4.7, 23], fov: 48, near: 0.08, far: 180 }}', '        camera={{ position: [0, 3.72, 20.25], fov: 46, near: 0.08, far: 180 }}', 'Home Canvas camera')
          home = replace_once(home, '          gl.toneMappingExposure = 1.42;', '          gl.toneMappingExposure = 0.94;', 'Home tone mapping exposure')
          home = replace_once(home, 'useGLTF.preload(ORB_MODEL);', 'useGLTF.preload(ORB_MODEL);\nuseTexture.preload(HOME_BACKDROP);', 'Home backdrop preload')
          home_path.write_text(home)

          css_path = Path('urai-tier1/src/spatial/layout/HomeWorldProduction.module.css')
          css = css_path.read_text()
          css = replace_once(css, '  filter: brightness(1.24) saturate(1.12) contrast(1.02);', '  filter: brightness(1.01) saturate(1.08) contrast(1.08);', 'Home canvas filter')
          css_path.write_text(css)

          scene_path = Path('urai-tier1/src/components/lifemap/ComposedLifeMapScene.tsx')
          scene = scene_path.read_text()
          scene = replace_once(
              scene,
              '    className="life-map-root"\n    data-testid="urai-true-3d-life-map"',
              '    className="life-map-root"\n    style={{ position: "absolute", inset: 0, width: "100%", height: "100%", minWidth: "100%", minHeight: "100%", overflow: "hidden", opacity: 1, visibility: "visible", background: "#02050b" }}\n    data-testid="urai-true-3d-life-map"',
              'Life Map exact viewport geometry',
          )
          scene_path.write_text(scene)

          grouped_path = Path('scripts/run-continuous-spatial-proof-v21-grouped.mjs')
          grouped = grouped_path.read_text()
          anchor = '''const discreetPassTarget = `    && result.semanticButtons === 3 && result.semanticVisible === 0 && result.discreetControls === 2`
const semanticPassReplacement = `    && result.semanticButtons === 3 && result.semanticVisible === 3\\n    && result.semanticNavigationOwner === 'runtime-boundary' && result.semanticNavigationNonDominant === 'true'\\n    && Number.isFinite(result.semanticNavigationOpacity) && result.semanticNavigationOpacity <= 0.02`
if (original.split(discreetPassTarget).length - 1 !== 1) throw new Error('Home semantic navigation pass contract changed')
'''
          replacement = anchor + '''
const retiredModePassTarget = `    && result.assetMode === requiredMode && result.personalizationMode === expected.mode`
const retiredModePassReplacement = `    && result.assetMode === null && result.personalizationMode === null`
if (original.split(retiredModePassTarget).length - 1 !== 1) throw new Error('Home retired ownership marker pass contract changed')
'''
          grouped = replace_once(grouped, anchor, replacement, 'continuous proof retired marker assertion')
          grouped = replace_once(grouped, '  .replace(discreetPassTarget, semanticPassReplacement)\n  .replace(editableFocusTarget, editableFocusReplacement)', '  .replace(discreetPassTarget, semanticPassReplacement)\n  .replace(retiredModePassTarget, retiredModePassReplacement)\n  .replace(editableFocusTarget, editableFocusReplacement)', 'continuous proof retired marker replacement')
          grouped = replace_once(grouped, "  ['semantic navigation opacity', 'semanticNavigationOpacity <= 0.02'],\n", "  ['semantic navigation opacity', 'semanticNavigationOpacity <= 0.02'],\n  ['retired asset mode absent', 'result.assetMode === null'],\n  ['retired personalization mode absent', 'result.personalizationMode === null'],\n", 'continuous proof retired marker guards')
          grouped_path.write_text(grouped)

          portal_path = Path('scripts/run-continuous-spatial-proof-v18-portal-stable.mjs')
          portal = portal_path.read_text()
          portal = replace_once(portal, "cameraCheckpoint: 'home-sky-ascent'", "cameraCheckpoint: 'home-sky-ascent-complete'", 'portal proof ascent completion checkpoint')
          portal_path.write_text(portal)
          PY

          grep -q 'HOME_BACKDROP' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          grep -q 'ground:opening' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
          grep -q 'data-home-portal-lifecycle="opening-traversal-closing"' urai-tier1/src/spatial/layout/HomeWorldProduction.tsx
