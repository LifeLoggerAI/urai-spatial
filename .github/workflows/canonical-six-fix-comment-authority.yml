name: Canonical corrective Life Map authority

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-six-fix-comment-authority.yml'

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: canonical-life-map-corrective-861
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name == 'push' || (github.event.issue.number == 861 && github.event.issue.pull_request && github.event.comment.body == '/run-life-map-repair-3c6143c5a90d08464ce9cce37a9e1c82a4bdcbe2')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_PR: '861'
      EXPECTED_HEAD: 3c6143c5a90d08464ce9cce37a9e1c82a4bdcbe2
      TARGET_BRANCH: corrective/life-map-materialized-repair-20260720
    steps:
      - name: Resolve exact draft authority
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(curl --fail-with-body -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${EXPECTED_PR}")"
          test "$(jq -r '.head.sha' <<<"$pr")" = "$EXPECTED_HEAD"
          test "$(jq -r '.head.ref' <<<"$pr")" = "$TARGET_BRANCH"
          test "$(jq -r '.head.repo.full_name' <<<"$pr")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.draft' <<<"$pr")" = "true"
          test "$(jq -r '.merged' <<<"$pr")" = "false"
          test "$(jq -r '.state' <<<"$pr")" = "open"

      - name: Post start receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="Canonical corrective Life Map authority started for ${EXPECTED_HEAD}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. PR #861 remains draft; no merge or deployment is authorized."
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${EXPECTED_PR}/comments" -d "$payload"

      - name: Checkout exact corrective authority head
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Rebuild from current main and apply retained repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -f .github/repair-requests/life-map-corrective-20260720.txt
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin main
          git checkout --detach origin/main
          test -s .github/patches/life-map-visual-privacy.patch.gz.b64
          base64 -d .github/patches/life-map-visual-privacy.patch.gz.b64 | gzip -dc > /tmp/life-map-visual-privacy.patch
          git apply --check /tmp/life-map-visual-privacy.patch
          git apply /tmp/life-map-visual-privacy.patch
          git rm -f --ignore-unmatch \
            .github/workflows/apply-life-map-proof-route-repair.yml \
            .github/workflows/apply-life-map-soft-weather-repair.yml \
            .github/scripts/apply_life_map_visual_privacy_repair.py \
            .github/patches/life-map-visual-privacy.patch.gz.b64
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main | sort)
          expected=(
            .github/patches/life-map-visual-privacy.patch.gz.b64
            .github/scripts/apply_life_map_visual_privacy_repair.py
            .github/workflows/apply-life-map-proof-route-repair.yml
            .github/workflows/apply-life-map-soft-weather-repair.yml
            scripts/capture-continuous-spatial-proof.mjs
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx
            urai-tier1/src/components/lifemap/useLifeMapEvents.ts
            urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx
            urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
            urai-tier1/tests/lifemap-data-boundary.test.mjs
            urai-tier1/tests/lifemap-scene-behavior.test.mjs
            urai-tier1/tests/lifemap-trust-loop.test.mjs
          )
          test "${changed[*]}" = "${expected[*]}"
          grep -q 'life-map-soft-weather-veil' urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx
          ! sed -n '/function EmotionalWeather/,/function MemoryPath/p' urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx | grep -q 'planeGeometry'
          grep -q 'explicitUserId === "demo-user"' urai-tier1/src/components/lifemap/useLifeMapEvents.ts
          grep -q "path: '/life-map/?demo=1" scripts/capture-continuous-spatial-proof.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify focused contracts types and build
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          node --test urai-tier1/tests/lifemap-scene-behavior.test.mjs
          node --test urai-tier1/tests/lifemap-data-boundary.test.mjs
          node --test urai-tier1/tests/lifemap-trust-loop.test.mjs
          node --test urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
          pnpm --dir urai-tier1 test:lifemap
          pnpm --dir urai-tier1 typecheck
          pnpm --dir urai-tier1 build

      - name: Publish one bounded corrective commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(life-map): materialize repair and remove contaminated executors"
          git push --force-with-lease=refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD origin HEAD:refs/heads/$TARGET_BRANCH

      - name: Post exact authority receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY: ${{ steps.authority.outcome }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          body="Canonical corrective Life Map receipt for ${EXPECTED_HEAD}: authority=${AUTHORITY}; checkout=${CHECKOUT}; repair=${REPAIR}; verify=${VERIFY}; publish=${PUBLISH}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. PR #861 remains draft. No merge or deployment was performed."
          payload="$(jq -n --arg body "$body" '{body:$body}')"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${EXPECTED_PR}/comments" -d "$payload"
