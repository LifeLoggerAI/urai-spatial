name: Canonical six-fix comment authority

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: canonical-six-fix-comment-authority
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.issue.number == 788 && github.event.issue.pull_request && github.event.comment.body == '/run-canonical-six-fix-99117734'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLEAN_BASE: 1d172afdce8ce1e0b70152b62892dace4cf06fab
      EXPECTED_HEAD: 99117734727d8cb1156662233042cc11bd72fb7a
      TARGET_BRANCH: exec/canonical-six-fix-product-r2-20260718
    steps:
      - name: Checkout exact isolated repair head
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Prove exact authority and apply bounded repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base "$CLEAN_BASE" HEAD)" = "$CLEAN_BASE"
          test -z "$(git status --porcelain --untracked-files=all)"
          test "$(git diff --name-only "$CLEAN_BASE...HEAD" | sort)" = "$(printf '%s\n' scripts/one-shot-six-fix-direct.mjs | sort)"
          node scripts/one-shot-six-fix-direct.mjs
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx | sort)"

      - name: Install exact dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify contracts, types and build
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm --dir urai-tier1 test
          corepack pnpm --dir urai-tier1 typecheck
          corepack pnpm --dir urai-tier1 build

      - name: Install Chromium
        id: chromium
        run: corepack pnpm --dir urai-tier1 exec playwright install --with-deps chromium

      - name: Verify exact prior accessibility failures
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm --dir urai-tier1 exec playwright test tests/accessibility-performance-evidence.spec.ts tests/accessibility-performance-lifemap-independent.spec.ts --project=chromium --grep "mobile visible controls stay inside the visual viewport and safe area|reduced motion keeps selection and unwind behavior equivalent"

      - name: Rewrite branch to one clean four-file product commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/urai-six-fix/urai-tier1/src/app /tmp/urai-six-fix/urai-tier1/src/components/lifemap /tmp/urai-six-fix/urai-tier1/src/spatial/navigation
          cp urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx /tmp/urai-six-fix/urai-tier1/src/app/
          cp urai-tier1/src/app/GroundSpatialWorldClean.tsx /tmp/urai-six-fix/urai-tier1/src/app/
          cp urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx /tmp/urai-six-fix/urai-tier1/src/components/lifemap/
          cp urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx /tmp/urai-six-fix/urai-tier1/src/spatial/navigation/
          git checkout --detach "$CLEAN_BASE"
          cp /tmp/urai-six-fix/urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/
          cp /tmp/urai-six-fix/urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/app/
          cp /tmp/urai-six-fix/urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/components/lifemap/
          cp /tmp/urai-six-fix/urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx urai-tier1/src/spatial/navigation/
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' urai-tier1/src/app/EmbodiedHomeSpatialCanvas.tsx urai-tier1/src/app/GroundSpatialWorldClean.tsx urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx urai-tier1/src/spatial/navigation/EmbodiedNavigation.tsx | sort)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(spatial): close bounded accessibility and runtime defects"
          git push --force-with-lease=refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD origin HEAD:refs/heads/$TARGET_BRANCH

      - name: Post exact authority receipt
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const rows = [
              ['checkout', '${{ steps.checkout.outcome }}'],
              ['repair', '${{ steps.repair.outcome }}'],
              ['install', '${{ steps.install.outcome }}'],
              ['verify', '${{ steps.verify.outcome }}'],
              ['chromium', '${{ steps.chromium.outcome }}'],
              ['browser', '${{ steps.browser.outcome }}'],
              ['publish', '${{ steps.publish.outcome }}']
            ];
            const body = ['Canonical six-fix authority receipt for `99117734727d8cb1156662233042cc11bd72fb7a`.', '', ...rows.map(([name, outcome]) => `- ${name}: ${outcome}`), '', `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 788, body });

  life-map-repair:
    if: github.event.issue.number == 842 && github.event.issue.pull_request && github.event.comment.body == '/run-canonical-life-map-repair-b683da73'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: b683da7354dc6ca4a1c404a8641db50d4e450795
      TARGET_BRANCH: repair/life-map-soft-weather-demo-continuity-20260719
    steps:
      - name: Checkout exact Life Map repair head
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Apply retained visual and privacy patch
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          git fetch --no-tags origin main
          test -s .github/patches/life-map-visual-privacy.patch.gz.b64
          base64 -d .github/patches/life-map-visual-privacy.patch.gz.b64 | gzip -dc > /tmp/life-map-visual-privacy.patch
          git apply --check /tmp/life-map-visual-privacy.patch
          git apply /tmp/life-map-visual-privacy.patch
          git checkout origin/main -- \
            scripts/check-workflow-phase-boundaries.mjs \
            .github/workflows/canonical-six-fix-comment-authority.yml \
            .github/workflows/life-map-repair-842-authority.yml
          git rm -f --ignore-unmatch \
            .github/workflows/apply-life-map-soft-weather-repair.yml \
            .github/scripts/apply_life_map_visual_privacy_repair.py \
            .github/patches/life-map-visual-privacy.patch.gz.b64
          git diff --check
          mapfile -t changed < <(git diff --name-only origin/main | sort)
          expected=(
            scripts/capture-continuous-spatial-proof.mjs
            urai-tier1/src/components/lifemap/AdaptiveLifeMapScene.tsx
            urai-tier1/src/components/lifemap/useLifeMapEvents.ts
            urai-tier1/src/spatial/lifemap/SpatialLifeMapCanonical.tsx
            urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
            urai-tier1/tests/lifemap-data-boundary.test.mjs
            urai-tier1/tests/lifemap-scene-behavior.test.mjs
            urai-tier1/tests/lifemap-trust-loop.test.mjs
          )
          test "${changed[*]}" = "${expected[*]}"

      - name: Install exact dependencies
        id: install
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify Life Map contracts, types and static build
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          node --test urai-tier1/tests/lifemap-scene-behavior.test.mjs
          node --test urai-tier1/tests/lifemap-data-boundary.test.mjs
          node --test urai-tier1/tests/lifemap-trust-loop.test.mjs
          node --test urai-tier1/tests/continuous-spatial-restoration-contract.test.mjs
          corepack pnpm --dir urai-tier1 test:lifemap
          corepack pnpm --dir urai-tier1 typecheck
          corepack pnpm --dir urai-tier1 build

      - name: Publish one exact bounded Life Map repair commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(life-map): remove slab weather and enforce explicit demo privacy"
          git push --force-with-lease=refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD origin HEAD:refs/heads/$TARGET_BRANCH

      - name: Post Life Map authority receipt
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const rows = [
              ['checkout', '${{ steps.checkout.outcome }}'],
              ['repair', '${{ steps.repair.outcome }}'],
              ['install', '${{ steps.install.outcome }}'],
              ['verify', '${{ steps.verify.outcome }}'],
              ['publish', '${{ steps.publish.outcome }}']
            ];
            const body = ['Canonical Life Map repair authority receipt for `b683da7354dc6ca4a1c404a8641db50d4e450795`.', '', ...rows.map(([name, outcome]) => `- ${name}: ${outcome}`), '', `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`, '', 'No merge or production deployment was performed.'].join('\n');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 842, body });
