name: Home V41 Production Rebuild

on:
  workflow_dispatch:
  push:
    branches:
      - home-final-v24-certify-20260826
    paths:
      - '.github/workflows/home-v39-production-finish-retry.yml'

permissions:
  contents: write

concurrency:
  group: home-v41-production-rebuild
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact owner-authored head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.0.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply V41 production rebuild
        run: python3 scripts/apply-home-v41-production-rebuild.py

      - name: Verify V41 realism, Ground continuity, navigation, and TypeScript
        working-directory: urai-tier1
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 tests/home-relic-machine-realism-contract.test.mjs tests/home-cohesion-contract.test.mjs tests/embodied-exploration-contract.test.mjs tests/post-deploy-ground-smoke-contract.test.mjs tests/home-ground-lifemap-art-bible-contract.test.mjs
          pnpm exec tsc --noEmit

      - name: Commit materialized V41 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/home-final-v24-certify-20260826" --jq .object.sha)"
          test "$current" = "${GITHUB_SHA}"
          git config user.name 'urai-release-bot'
          git config user.email 'urai-release-bot@users.noreply.github.com'
          git add urai-tier1/src/spatial/layout/HomeWorldProductionFinal.tsx
          git diff --cached --quiet && { echo 'No V41 materialization required.'; exit 0; }
          git commit -m 'Home: materialize V41 integrated Orb sanctuary rebuild'
          gh auth setup-git
          git push origin HEAD:home-final-v24-certify-20260826
