name: One-Time Integrate Exact V2-V5 Assets

on:
  push:
    branches: [main]
    paths:
      - authorizations/integrate-v2-v5-exact-paid-20260730.json

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: one-time-integrate-exact-v2-v5-assets-20260730
  cancel-in-progress: false

env:
  PAID_REPO: LifeLoggerAI/asset-factory
  PAID_HEAD_SHA: c388b1ce3d6fc27ef30599eb6535605bff202fb7
  PAID_WORKFLOW_NAME: One-Time V2-V5 Exact Paid Asset Generation
  TARGET_BRANCH: certify/v2-runtime-estate-20260729
  TARGET_PR: '978'
  AUTHORIZATION_MARKER: authorizations/integrate-v2-v5-exact-paid-20260730.json

jobs:
  integrate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Prove bounded integration authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -f "$AUTHORIZATION_MARKER"
          python - "$AUTHORIZATION_MARKER" <<'PY'
          import json, pathlib, sys
          marker = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert marker['schemaVersion'] == '1.0.0', marker
          assert marker['paidRepository'] == 'LifeLoggerAI/asset-factory', marker
          assert marker['paidHeadSha'] == 'c388b1ce3d6fc27ef30599eb6535605bff202fb7', marker
          assert marker['targetBranch'] == 'certify/v2-runtime-estate-20260729', marker
          assert marker['targetPullRequest'] == 978, marker
          assert marker['expectedArtifacts'] == 4, marker
          assert marker['expectedTargets'] == 151, marker
          assert marker['promotionAuthorized'] is False, marker
          assert marker['deploymentAuthorized'] is False, marker
          PY
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish integration start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$TARGET_PR" --body "Exact V2-V5 integration lane started. Paid authority head: \`$PAID_HEAD_SHA\`. Expected scope: 151 assets across four retained artifacts. No promotion or deployment is authorized by this lane."

      - name: Discover exact paid workflow run
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 90); do
            payload="$(gh api "repos/${PAID_REPO}/actions/runs?head_sha=${PAID_HEAD_SHA}&event=push&per_page=100")"
            run_id="$(python -c 'import json,sys; p=json.load(sys.stdin); xs=[r for r in p.get("workflow_runs",[]) if r.get("name")=="One-Time V2-V5 Exact Paid Asset Generation"]; print(xs[0]["id"] if xs else "")' <<<"$payload")"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 10
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh pr comment "$TARGET_PR" --body "Paid generation run discovered: \`$run_id\`, exact head \`$PAID_HEAD_SHA\`. Waiting for all four bounded jobs to reach a terminal state."

      - name: Wait for terminal paid result
        id: terminal
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.discover.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          status=''
          conclusion=''
          for attempt in $(seq 1 330); do
            payload="$(gh api "repos/${PAID_REPO}/actions/runs/${RUN_ID}")"
            status="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")' <<<"$payload")"
            conclusion="$(python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion") or "")' <<<"$payload")"
            if [ "$status" = completed ]; then
              break
            fi
            sleep 60
          done
          test "$status" = completed
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          if [ "$conclusion" != success ]; then
            gh pr comment "$TARGET_PR" --body "Paid generation run \`$RUN_ID\` completed with conclusion **$conclusion**. Integration stopped before any runtime write."
            exit 1
          fi
          gh pr comment "$TARGET_PR" --body "Paid generation run \`$RUN_ID\` completed successfully. Downloading and verifying the four retained artifacts now."

      - name: Download all four exact paid artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.discover.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paid-artifacts"
          gh api "repos/${PAID_REPO}/actions/runs/${RUN_ID}/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
          python - "$RUNNER_TEMP/artifacts.json" "$RUNNER_TEMP/paid-artifacts" <<'PY'
          import json, pathlib, subprocess, sys
          payload=json.loads(pathlib.Path(sys.argv[1]).read_text())
          target=pathlib.Path(sys.argv[2])
          artifacts=[item for item in payload.get('artifacts', []) if item.get('name','').startswith('urai-v') and '-exact-paid-' in item.get('name','')]
          versions={item['name'].split('-')[1] for item in artifacts}
          if versions != {'v2','v3','v4','v5'} or len(artifacts) != 4:
              raise SystemExit(f'expected four exact paid artifacts, found {[item.get("name") for item in artifacts]}')
          receipt=[]
          for item in sorted(artifacts, key=lambda value: value['name']):
              zip_path=target / f"{item['id']}.zip"
              with zip_path.open('wb') as handle:
                  subprocess.run(['gh','api',f"repos/LifeLoggerAI/asset-factory/actions/artifacts/{item['id']}/zip"], stdout=handle, check=True)
              receipt.append({key:item.get(key) for key in ('id','name','size_in_bytes','digest','expired','created_at','expires_at')})
          (target/'artifact-index.json').write_text(json.dumps(receipt, indent=2, sort_keys=True)+'\n')
          PY
          for zip in "$RUNNER_TEMP"/paid-artifacts/*.zip; do
            dir="${zip%.zip}"
            mkdir -p "$dir"
            unzip -q "$zip" -d "$dir"
          done

      - name: Verify receipts and stage canonical runtime assets
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/paid-artifacts" "$GITHUB_WORKSPACE/urai-tier1/public" <<'PY'
          import json, pathlib, shutil, sys
          root=pathlib.Path(sys.argv[1])
          public=pathlib.Path(sys.argv[2])
          expected={'v2':71,'v3':14,'v4':39,'v5':27}
          total_calls=0
          total_reserved=0.0
          copied=0
          consolidated=[]
          for version,count in expected.items():
              matches=list(root.glob(f'*/artifacts/exact-paid/{version}/{version}-generation-receipt.json'))
              if len(matches) != 1:
                  matches=list(root.glob(f'*/exact-paid/{version}/{version}-generation-receipt.json'))
              if len(matches) != 1:
                  raise SystemExit(f'{version}: expected one receipt, found {matches}')
              receipt=json.loads(matches[0].read_text())
              assert receipt['status']=='passed', receipt
              assert receipt['generated']==count and receipt['failed']==0, receipt
              assert receipt['promotionAuthorized'] is False, receipt
              assert receipt['deploymentAuthorized'] is False, receipt
              total_calls += int(receipt['providerCallsExecuted'])
              total_reserved += float(receipt['reservedEstimatedCostUsd'])
              runtime=matches[0].parent/'runtime'/'assets'/'urai'
              if not runtime.is_dir():
                  raise SystemExit(f'{version}: runtime tree missing at {runtime}')
              for source in runtime.rglob('*.webp'):
                  relative=source.relative_to(matches[0].parent/'runtime')
                  destination=public/relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source,destination)
                  copied += 1
              consolidated.append({key:receipt.get(key) for key in ('version','generated','passed','failed','providerCallsExecuted','reservedEstimatedCostUsd','receiptSha256')})
          assert copied == 151, copied
          assert total_calls <= 300, total_calls
          assert total_reserved <= 300.0, total_reserved
          out=pathlib.Path('docs/receipts/URAI-V2-V5-EXACT-ASSET-INTEGRATION-20260730.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({'schemaVersion':'1.0.0','paidHeadSha':'c388b1ce3d6fc27ef30599eb6535605bff202fb7','copiedAssets':copied,'providerCallsExecuted':total_calls,'reservedEstimatedCostUsd':f'{total_reserved:.2f}','promotionAuthorized':False,'deploymentAuthorized':False,'versions':consolidated}, indent=2, sort_keys=True)+'\n')
          print(json.dumps({'copiedAssets':copied,'providerCallsExecuted':total_calls,'reservedEstimatedCostUsd':f'{total_reserved:.2f}'}, sort_keys=True))
          PY

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Certify complete V2 runtime estate
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/test-certify-v2-runtime-assets.py
          python scripts/certify-v2-runtime-assets.py

      - name: Verify all V3-V5 canonical files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          from PIL import Image
          roots={'v3':'assets/urai/v3','v4':'assets/urai/xr','v5':'assets/urai/v5'}
          expected={'v3':14,'v4':39,'v5':27}
          base=pathlib.Path('urai-tier1/public')
          for version,prefix in roots.items():
              files=sorted((base/prefix).rglob('*.webp'))
              if len(files) < expected[version]:
                  raise SystemExit(f'{version}: expected at least {expected[version]} WebPs under {prefix}, found {len(files)}')
              checked=0
              for path in files:
                  with Image.open(path) as image:
                      image.load()
                      if image.format != 'WEBP' or image.width < 1 or image.height < 1:
                          raise SystemExit(f'invalid canonical file: {path}')
                  checked += 1
              print(json.dumps({'version':version,'checked':checked,'prefix':prefix}, sort_keys=True))
          PY

      - name: Commit exact certified assets to PR branch
        id: push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add urai-tier1/public/assets/urai/v2 urai-tier1/public/assets/urai/v3 urai-tier1/public/assets/urai/xr urai-tier1/public/assets/urai/v5 docs/receipts/URAI-V2-V5-EXACT-ASSET-INTEGRATION-20260730.json
          test -n "$(git status --porcelain)"
          git commit -m 'assets: integrate exact certified V2-V5 provider outputs'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish integration receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.discover.outputs.run_id }}
          PUSH_SHA: ${{ steps.push.outputs.commit_sha }}
        shell: bash
        run: |
          if [ -n "${PUSH_SHA:-}" ]; then
            gh pr comment "$TARGET_PR" --body "Exact paid assets were certified and pushed to PR #$TARGET_PR at \`$PUSH_SHA\`. Paid run: \`$RUN_ID\`. The PR must now reach exact-head green before merge or deployment."
          else
            gh pr comment "$TARGET_PR" --body "Exact asset integration did not produce a branch commit. Paid run: \`${RUN_ID:-not-discovered}\`. No deployment occurred."
          fi
