name: V1 Certified Runtime Integration

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/v1-certified-runtime-integration.yml
  push:
    branches:
      - integrate/v1-certified-runtime-20260730-r2
    paths:
      - .github/workflows/v1-certified-runtime-integration.yml

permissions:
  actions: read
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: integrate/v1-certified-runtime-20260730-r2
          fetch-depth: 1
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install verifier dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Download immutable V1 authorities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/source/v1-original artifacts/source/v1-recovery artifacts/assets
          gh api /repos/LifeLoggerAI/asset-factory/actions/artifacts/8741010314/zip > /tmp/v1-original.zip
          gh api /repos/LifeLoggerAI/asset-factory/actions/artifacts/8742902079/zip > /tmp/v1-recovery.zip
          unzip -q /tmp/v1-original.zip -d artifacts/source/v1-original
          unzip -q /tmp/v1-recovery.zip -d artifacts/source/v1-recovery
      - name: Rebuild immutable ledger
        run: |
          python scripts/assets/build-v1-certified-runtime-ledger.py \
            --original-root artifacts/source/v1-original \
            --recovery-root artifacts/source/v1-recovery \
            --output artifacts/assets/v1-certified-runtime-ledger.json
      - name: Integrate exact certified WebP files
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          from PIL import Image

          ledger = json.loads(pathlib.Path('artifacts/assets/v1-certified-runtime-ledger.json').read_text())
          source_root = pathlib.Path('artifacts/source/v1-recovery/image_asset_generator')
          integrated = []

          for asset in ledger['assets']:
              source = source_root / asset['src']
              if not source.is_file():
                  raise SystemExit(f'missing certified PNG source: {source}')

              source_digest = hashlib.sha256(source.read_bytes()).hexdigest()
              if source_digest != asset['srcSha256']:
                  raise SystemExit(
                      f'certified PNG source hash mismatch: {asset["n"]}: '
                      f'{source_digest} != {asset["srcSha256"]}'
                  )

              destination = pathlib.Path('urai-tier1/public') / asset['p']
              destination.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(source) as image:
                  image.load()
                  image.save(destination, 'WEBP', method=6, lossless=True, exact=True)

              final_digest = hashlib.sha256(destination.read_bytes()).hexdigest()
              if final_digest != asset['s']:
                  raise SystemExit(
                      f'exact WebP export hash mismatch: {asset["n"]}: '
                      f'{final_digest} != {asset["s"]}'
                  )
              integrated.append(str(destination))

          if len(integrated) != 53:
              raise SystemExit(f'expected 53 integrated assets, got {len(integrated)}')
          pathlib.Path('artifacts/assets/v1-integrated-paths.txt').write_text(
              '\n'.join(integrated) + '\n', encoding='utf-8'
          )
          print(f'integrated {len(integrated)} exact certified assets')
          PY
      - name: Verify exact runtime acceptance
        run: python scripts/assets/run-v1-certified-runtime.py
      - name: Commit exact certified runtime binaries
        run: |
          set -euo pipefail
          git config user.name 'LifeLoggerAI Asset Factory'
          git config user.email 'actions@users.noreply.github.com'
          git add urai-tier1/public/assets/urai
          if git diff --cached --quiet; then
            echo 'No runtime binary changes required.'
            exit 0
          fi
          git commit -m 'Integrate exact certified V1 runtime assets'
          git push origin HEAD:integrate/v1-certified-runtime-20260730-r2
      - name: Upload integration receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-certified-runtime-integration-${{ github.run_id }}
          path: |
            artifacts/assets/v1-certified-runtime-ledger.json
            artifacts/assets/v1-runtime-certification.json
            artifacts/assets/v1-integrated-paths.txt
          if-no-files-found: warn
          retention-days: 90
