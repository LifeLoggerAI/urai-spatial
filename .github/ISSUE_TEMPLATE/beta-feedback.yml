name: URAI beta feedback
description: Share structured feedback about the URAI spatial beta experience.
title: "[Beta feedback]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing URAI. Do not include private medical, legal, financial, biometric, credential, or third-party information in this public form.
  - type: input
    id: build
    attributes:
      label: Build or deployment identifier
      description: Add the exact SHA, receipt ID, or test link when known.
      placeholder: commit SHA, receipt ID, or URL
    validations:
      required: false
  - type: dropdown
    id: tester_type
    attributes:
      label: Tester perspective
      options:
        - First-time user
        - Defined use-case tester
        - Privacy or trust reviewer
        - Accessibility reviewer
        - Security reviewer
        - Product or design reviewer
        - Other
    validations:
      required: true
  - type: textarea
    id: understanding
    attributes:
      label: In one sentence, what do you think URAI is?
    validations:
      required: true
  - type: textarea
    id: clear_moment
    attributes:
      label: What moment made the concept clear?
    validations:
      required: false
  - type: textarea
    id: confusion
    attributes:
      label: What felt confusing or overpromised?
    validations:
      required: false
  - type: textarea
    id: value
    attributes:
      label: What problem could URAI solve for you?
    validations:
      required: false
  - type: textarea
    id: return
    attributes:
      label: What would make you return and use it again?
    validations:
      required: false
  - type: checkboxes
    id: journey
    attributes:
      label: Journey completed
      options:
        - label: Entered Home
        - label: Found Life Map
        - label: Selected a memory or chapter
        - label: Entered Focus
        - label: Entered Replay
        - label: Returned without losing selection
        - label: Found Passport or Privacy Controls
  - type: textarea
    id: trust
    attributes:
      label: Trust and control feedback
      description: Did you understand sample data, permissions, and what was real versus simulated or pending?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: Example: iPhone 15 / Safari or Windows 11 / Chrome
    validations:
      required: true
  - type: textarea
    id: technical
    attributes:
      label: Technical or accessibility issues
    validations:
      required: false
  - type: dropdown
    id: retest
    attributes:
      label: Would you test URAI again?
      options:
        - Yes
        - Maybe
        - No
    validations:
      required: true
  - type: textarea
    id: final
    attributes:
      label: Anything else?
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data acknowledgment
      options:
        - label: I did not include highly sensitive or private information in this public issue.
          required: true