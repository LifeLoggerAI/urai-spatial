    role: authentication
    status: active
    reviewStatus: privacy_review_required
  - name: Firestore
    role: primary_database
    status: active_mixed_feature_state
    reviewStatus: exact_head_rules_review_required
  - name: Firebase Storage
    role: media_storage
    status: active
    reviewStatus: source_scope_review_required
  - name: Firebase Hosting
    role: frontend_hosting
    status: active
    reviewStatus: deployment_receipt_required
  - name: Scenario Provider
    role: possible_futures_generation
    status: not_activated
    reviewStatus: exact_model_version_and_release_eval_required
  - name: Global Emotional Field Aggregate Provider
    role: sensitive_cohort_aggregation
    status: not_activated
    reviewStatus: privacy_foundation_governance_and_higher_threshold_required

review:
  status: blocked_until_exact_head_independent_review
  reviewer: pending
  notes: Current-source reconciliation corrects the stale May consent vocabulary. Personal memory storage is C1, passive behavioral context is C2, location is C3, sensitive inference is C4, biometrics is C5, personalization learning is C6, and separately authorized anonymized cohort participation is C8. No listed personal field is authorized for AI training at launch.
