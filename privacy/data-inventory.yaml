    consentTier: C0
    retentionClass: R2
    exportable: true
    deletable: true
    monetizable: false
    aiTrainingAllowed: false
    adminAccessible: false
    auditRequired: true
    implementationStatus: implemented

  - name: memory_text
    collectionOrTable: memories
    source: user_provided
    dataClass: L3
    purpose: personal memory storage
    consentTier: C1
    retentionClass: R2
    exportable: true
    deletable: true
    monetizable: false
    aiTrainingAllowed: false
    adminAccessible: false
    auditRequired: true
    implementationStatus: implemented_requires_exact_runtime_review

  - name: memory_media
    collectionOrTable: memories/storage
