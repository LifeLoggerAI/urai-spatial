feature: notifications
repo: LifeLoggerAI/urai-spatial
owner: TBD
privacyGovernanceVersion: 0.1.0-draft
status: blocked_stubbed_from_repo_audit
lastReviewed: 2026-05-09
sourceEvidence:
  - URAI_ECOSYSTEM_AUDIT.md

summary:
  purpose: Store and deliver user notifications.
  userBenefit: Notifies users about relevant memory, insight, ritual, system, or account events.
  implementationStatus: stubbed_per_repo_audit

dataProcessing:
  collectedFields:
    - name: notification_record
      collectionOrTable: notifications
      dataClass: L2
      source: system_generated
      purpose: store user notification content, delivery state, and notification preferences
      consentTier: C2
      retentionClass: R1
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: notification_delivery_state
      collectionOrTable: notifications
      dataClass: L2
      sourceFields:
        - notification_record
      purpose: track user-facing delivery/read state
      consentTier: C2
      retentionClass: R1
      exportable: true
      deletable: true
      explainabilityRequired: false

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: false

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - notification.created
    - notification.sent
    - notification.read
    - notification.deleted

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: TBD
  decision: blocked_until_implemented_and_reviewed
  notes: Repo audit marks notifications as stubbed. Notifications must not launch until preferences, consent/revocation where applicable, export, deletion, and audit behavior are implemented and tested.
