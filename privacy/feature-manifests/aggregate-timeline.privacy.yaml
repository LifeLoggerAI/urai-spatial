feature: aggregate-timeline
repo: LifeLoggerAI/urai-spatial
owner: TBD
privacyGovernanceVersion: 0.1.0-draft
status: blocked_stubbed_from_repo_audit
lastReviewed: 2026-05-09
sourceEvidence:
  - URAI_ECOSYSTEM_AUDIT.md

summary:
  purpose: Aggregate memories into a user-facing timeline.
  userBenefit: Lets users review memories chronologically and understand personal history over time.
  implementationStatus: stubbed_per_repo_audit

dataProcessing:
  collectedFields:
    - name: memory_text
      collectionOrTable: memories
      dataClass: L3
      source: user_provided
      purpose: source material for timeline aggregation
      consentTier: C2
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
    - name: memory_media
      collectionOrTable: memories/storage
      dataClass: L4
      source: user_upload
      purpose: optional media context for timeline entries
      consentTier: C4
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: timeline_entry
      collectionOrTable: replays_or_timeline
      dataClass: L3
      sourceFields:
        - memory_text
        - memory_media
      purpose: chronological representation of user memories
      consentTier: C2
      retentionClass: R3
      exportable: true
      deletable: true
      explainabilityRequired: false

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: false

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - timeline.generated
    - timeline.viewed
    - timeline.deleted

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: TBD
  decision: blocked_until_implemented_and_reviewed
  notes: Repo audit marks aggregateTimeline as stubbed. This must not launch until timeline storage, consent checks, export, deletion, and audit behavior are implemented and tested.
