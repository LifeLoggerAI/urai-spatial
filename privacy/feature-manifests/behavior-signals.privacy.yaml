feature: behavior-signals
repo: LifeLoggerAI/urai-spatial
owner: TBD
privacyGovernanceVersion: 0.1.0-draft
status: implemented_pending_privacy_review
lastReviewed: 2026-09-29
sourceEvidence:
  - URAI_ECOSYSTEM_AUDIT.md

summary:
  purpose: Capture user behavior signals for user-facing AI analysis and personalization.
  userBenefit: Supports more relevant insight, memory organization, and adaptive product experiences.
  implementationStatus: implemented_consent_bound_server_owned_runtime

dataProcessing:
  collectedFields:
    - name: behavior_signal
      collectionOrTable: behaviorSignals
      dataClass: L4
      source: system_collected
      purpose: capture behavior context for AI analysis
      consentTier: C4
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: behavior_pattern
      collectionOrTable: behaviorSignals
      dataClass: L4
      sourceFields:
        - behavior_signal
      purpose: user-facing behavior pattern summary or feature personalization
      consentTier: C4
      retentionClass: R3
      exportable: true
      deletable: true
      explainabilityRequired: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - behavior_signal.created
    - behavior_signal.processed
    - behavior_pattern.generated
    - behavior_signal.deleted

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: TBD
  decision: blocked_until_implemented_and_reviewed
  notes: Consent-bound browser activity/stillness/quick-cancel/device-motion metadata now ingests through a server-owned callable only when workforce automation consent is active. Location is separately consent-bound and only sampled when browser permission is already granted. Client writes are denied; owner reads, export, and deletion are wired. Raw camera/audio are never captured by this runtime. Privacy review and deployed runtime proof remain required.
