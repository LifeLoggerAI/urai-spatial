feature: replays
repo: LifeLoggerAI/urai-spatial
owner: URAI Privacy + Spatial
privacyGovernanceVersion: 0.2.0-draft
status: current_runtime_implemented_exact_head_privacy_review_required
lastReviewed: 2026-09-16
sourceEvidence:
  - urai-tier1/src/app/replay/page.tsx
  - urai-tier1/tests/replay-memory-theater-contract.test.mjs
  - urai-tier1/tests/replay-operations-contract.test.mjs
  - urai-tier1/tests/replay-product-controls-contract.test.mjs
  - urai-tier1/tests/replay-mobile-control-clearance-contract.test.mjs
  - urai-tier1/tests/replay-final-rail-authority-contract.test.mjs
  - firebase/firestore.rules

summary:
  purpose: Reconstruct and revisit authorized memory sequences while preserving memory provenance and the distinction between factual Replay and hypothetical Possible Futures.
  userBenefit: Lets users revisit source-backed memory experiences without silently promoting generated context or Scenario output into autobiographical truth.
  implementationStatus: active_canonical_replay_runtime_with_contract_and_operational_tests_exact_head_privacy_export_delete_explanation_review_still_required

dataProcessing:
  collectedFields:
    - name: memory_text
      collectionOrTable: memories
      dataClass: L3
      source: user_provided
      purpose: source material for memory replay generation
      consentTier: C1
      retentionClass: R2
      exportable: true
      deletable: true
      monetizable: false
      aiTrainingAllowed: false
      adminAccessible: false
      auditRequired: true
    - name: memory_media
      collectionOrTable: memories/storage
      dataClass: L3
      source: user_upload
      purpose: optional personal media source material for memory replay generation
      consentTier: C1
      retentionClass: R2
      exportable: true
      deletable: true
      monetizable: false
      aiTrainingAllowed: false
      adminAccessible: false
      auditRequired: true
  derivedFields:
    - name: replay_record
      collectionOrTable: replayEvents_and_replay_runtime
      dataClass: L3_or_L4_when_sensitive_interpretation_is_included
      sourceFields:
        - memory_text
        - memory_media
        - memory_star_visualization
      purpose: user-facing memory replay
      consentTier: C1_plus_C4_if_sensitive_inference_is_included
      retentionClass: R3
      exportable: true
      deletable: true
      monetizable: false
      aiTrainingAllowed: false
      explainabilityRequired: true

truthBoundary:
  scenarioContentMayBecomeReplayFact: false
  generatedContextMayBecomeConfirmedMemory: false
  unknownMustRemainUnknown: true
  conflictingEvidenceMustRemainVisible: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - replay.created
    - replay.generated
    - replay.viewed
    - replay.deleted
    - replay.explanation_requested

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false

review:
  reviewer: pending_independent_privacy_review
  decision: blocked_from_gold_master_until_current_exact_head_privacy_export_delete_explanation_and_visual_runtime_evidence_pass
  notes: The May 2026 stub designation is stale and has been replaced with current-runtime truth. This update does not certify Replay for launch; it corrects implementation status while retaining fail-closed exact-head review requirements.
