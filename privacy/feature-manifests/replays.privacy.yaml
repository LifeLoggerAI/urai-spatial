feature: replays
repo: LifeLoggerAI/urai-spatial
owner: TBD
privacyGovernanceVersion: 0.1.0-draft
status: blocked_stubbed_from_repo_audit
lastReviewed: 2026-05-09
sourceEvidence:
  - URAI_ECOSYSTEM_AUDIT.md

summary:
  purpose: Store user-generated replays of their memories.
  userBenefit: Lets users revisit curated or generated memory sequences.
  implementationStatus: stubbed_per_repo_audit

dataProcessing:
  collectedFields:
    - name: memory_text
      collectionOrTable: memories
      dataClass: L3
      source: user_provided
      purpose: source material for memory replay generation
      consentTier: C2
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
    - name: memory_media
      collectionOrTable: memories/storage
      dataClass: L4
      source: user_upload
      purpose: optional media source material for memory replay generation
      consentTier: C4
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: replay_record
      collectionOrTable: replays
      dataClass: L3
      sourceFields:
        - memory_text
        - memory_media
        - memory_star_visualization
      purpose: user-facing generated or curated memory replay
      consentTier: C2
      retentionClass: R3
      exportable: true
      deletable: true
      explainabilityRequired: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - replay.created
    - replay.generated
    - replay.viewed
    - replay.deleted
    - replay.explanation_requested

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: TBD
  decision: blocked_until_implemented_and_reviewed
  notes: Repo audit marks replays as stubbed. Replays must not launch until consent, export, deletion, explanation, and audit behavior are implemented and tested.
