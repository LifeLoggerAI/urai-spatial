feature: dream-logs
repo: LifeLoggerAI/urai-spatial
owner: TBD
privacyGovernanceVersion: 0.1.0-draft
status: blocked_stubbed_from_repo_audit
lastReviewed: 2026-05-09
sourceEvidence:
  - URAI_ECOSYSTEM_AUDIT.md

summary:
  purpose: Store user-recorded dreams and reflective personal content.
  userBenefit: Helps users remember, revisit, and reflect on dream content over time.
  implementationStatus: stubbed_per_repo_audit

dataProcessing:
  collectedFields:
    - name: dream_log
      collectionOrTable: dreamLogs
      dataClass: L4
      source: user_provided
      purpose: store user-recorded dreams and private reflective content
      consentTier: C4
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: dream_reflection_summary
      collectionOrTable: dreamLogs
      dataClass: L4
      sourceFields:
        - dream_log
      purpose: optional user-facing dream reflection summary
      consentTier: C4
      retentionClass: R3
      exportable: true
      deletable: true
      explainabilityRequired: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - dream_log.created
    - dream_log.updated
    - dream_reflection.generated
    - dream_log.deleted
    - dream_reflection.explanation_requested

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: TBD
  decision: blocked_until_implemented_and_reviewed
  notes: Repo audit marks dreamLogs as stubbed. Dream logs are sensitive journal-like content and must not launch until explicit consent, export, deletion, explanation, and audit behavior are implemented and tested.
