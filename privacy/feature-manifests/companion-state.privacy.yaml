feature: companion-state
repo: LifeLoggerAI/urai-spatial
owner: TBD
privacyGovernanceVersion: 0.1.0-draft
status: blocked_stubbed_from_repo_audit
lastReviewed: 2026-05-09
sourceEvidence:
  - URAI_ECOSYSTEM_AUDIT.md

summary:
  purpose: Store the state of the user's AI companion and personalization context.
  userBenefit: Enables continuity, personalization, and context-aware companion behavior.
  implementationStatus: stubbed_per_repo_audit

dataProcessing:
  collectedFields:
    - name: companion_state_input
      collectionOrTable: companionState
      dataClass: L4
      source: user_provided_or_system_derived
      purpose: maintain AI companion continuity and personalization state
      consentTier: C4
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: companion_personalization_state
      collectionOrTable: companionState
      dataClass: L4
      sourceFields:
        - companion_state_input
      purpose: user-facing companion personalization and state continuity
      consentTier: C4
      retentionClass: R3
      exportable: true
      deletable: true
      explainabilityRequired: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - companion_state.created
    - companion_state.updated
    - companion_state.deleted
    - companion_state.explanation_requested

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: TBD
  decision: blocked_until_implemented_and_reviewed
  notes: Repo audit marks companionState as stubbed. Companion state may encode sensitive personalization and must not launch until consent, explanation, export, deletion, revocation, and audit behavior are implemented and tested.
