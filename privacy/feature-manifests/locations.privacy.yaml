summary:
  purpose: Store location context associated with memories.
  userBenefit: Helps users organize and revisit memories by place.
  implementationStatus: partial_browser_and_transactional_server_source_present_acceptance_unverified

dataProcessing:
  collectedFields:
    - name: location_record
      collectionOrTable: locations
      dataClass: L3
      source: device_or_user_provided
      purpose: associate memories with places or location context
      consentTier: C1
      requiredConsentPurposes:
        - location.context
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: location_memory_context
      collectionOrTable: locations
      dataClass: L3
      sourceFields:
        - location_record
      purpose: user-facing place-based memory organization
      consentTier: C1
      requiredConsentPurposes:
        - location.context
      retentionClass: R3
      exportable: true
      deletable: true
      explainabilityRequired: false

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: false

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - location.created
    - location.linked_to_memory
    - location.deleted

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: TBD
  decision: blocked_until_privacy_runtime_and_consumer_acceptance_verified
  notes: Current source includes authenticated consent-controlled transactional location ingestion and browser/location-vault callsites; the historical audit stub label does not describe these implementations. Source presence and scoped handler/contract tests do not establish end-to-end GPS acquisition, geographic/server integration, export/deletion/revocation consumer acceptance, physical-device behavior or production deployment. Existing draft collection, consent-tier, retention, rights, admin and sharing fields are preserved; their alignment with canonical C3 location.context authority remains unresolved and does not authorize collection or provider activation.
