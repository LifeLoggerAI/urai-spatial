feature: locations
repo: LifeLoggerAI/urai-spatial
owner: URAI Privacy + Spatial
privacyGovernanceVersion: 0.1.0-draft
status: source_implemented_provider_and_release_policy_gated
lastReviewed: 2026-09-16
sourceEvidence:
  - urai-tier1/src/spatial/places/geographicLocationVault.ts
  - urai-tier1/tests/geographic-location-vault.test.mjs
  - urai-tier1/tests/geographic-location-client-contract.test.mjs
  - urai-tier1/tests/geographic-maps-launch-policy.test.mjs
  - LifeLoggerAI/urai-privacy/docs/CONSENT_TIERS.md
  - LifeLoggerAI/urai-privacy/functions/src/consent-decision.ts

summary:
  purpose: Store authorized location context associated with memories and user-controlled geographic place records.
  userBenefit: Helps users organize and revisit memories by place while keeping exact-private precision owner-controlled.
  implementationStatus: client_vault_and_source_contracts_present_external_provider_launch_remains_policy_gated

dataProcessing:
  collectedFields:
    - name: location_record
      collectionOrTable: geographic_memory_pins_or_governed_location_store
      dataClass: L4
      source: device_or_user_provided
      purpose: location.context
      consentTier: C3
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: location_memory_context
      collectionOrTable: governed_location_context
      dataClass: L4
      sourceFields:
        - location_record
      purpose: location.context
      consentTier: C3
      retentionClass: R3
      exportable: true
      deletable: true
      explainabilityRequired: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - location.created
    - location.linked_to_memory
    - location.corrected
    - location.precision_changed
    - location.deleted
    - location.consent_revoked

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: pending_independent_privacy_review
  decision: blocked_from_unreviewed_provider_or_public_activation
  notes: Current authoritative privacy policy assigns location.context to C3, not C4. Sensitive emotional/mental/relationship inference derived from location remains a separate C4 purpose and must not be bundled into location consent. Exact routes and exact-private coordinates remain private and revocable.
