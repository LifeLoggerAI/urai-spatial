sourceEvidence:
  - URAI_ECOSYSTEM_AUDIT.md
  - privacy/data-inventory.yaml
  - apps/functions/src/passiveSignals.ts
  - apps/functions/src/index.ts
  - urai-tier1/src/spatial/signals/PassiveSignalRuntime.tsx
  - urai-tier1/src/spatial/places/geographicLocationVault.ts
