feature: voice-events
repo: LifeLoggerAI/urai-spatial
owner: TBD
privacyGovernanceVersion: 0.1.0-draft
status: partial_runtime_pending_capture_integration_and_review
lastReviewed: 2026-09-29
sourceEvidence:
  - URAI_ECOSYSTEM_AUDIT.md

summary:
  purpose: Store and process voice interactions with the system.
  userBenefit: Enables voice-based memory capture and interaction flows.
  implementationStatus: partial_consent_bound_server_ingestion_no_implicit_microphone

dataProcessing:
  collectedFields:
    - name: voice_event
      collectionOrTable: voiceEvents
      dataClass: L5
      source: user_voice_interaction
      purpose: store voice interactions with the system
      consentTier: C5
      retentionClass: R6
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: voice_interaction_metadata
      collectionOrTable: voiceEvents
      dataClass: L4
      sourceFields:
        - voice_event
      purpose: support user-facing voice interaction history and processing state
      consentTier: C5
      retentionClass: R6
      exportable: true
      deletable: true
      explainabilityRequired: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true
  biometricDeletionSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - voice_event.created
    - voice_event.processed
    - voice_event.deleted
    - voice_event.biometric_deleted

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: TBD
  decision: blocked_until_implemented_and_reviewed
  notes: Server ingestion now accepts bounded transcript/tone metadata only when workforce automation and model-context consent are active; raw audio is explicitly not stored. No global runtime silently activates microphone capture. Export/deletion are wired, but an explicit voice-capture/transcription surface and privacy review remain required before this lane can be called complete.
