feature: clusters
repo: LifeLoggerAI/urai-spatial
owner: TBD
privacyGovernanceVersion: 0.1.0-draft
status: blocked_stubbed_from_repo_audit
lastReviewed: 2026-05-09
sourceEvidence:
  - URAI_ECOSYSTEM_AUDIT.md

summary:
  purpose: Group related memories together.
  userBenefit: Helps users explore memory themes, patterns, and related moments in the spatial galaxy.
  implementationStatus: stubbed_per_repo_audit

dataProcessing:
  collectedFields:
    - name: memory_text
      collectionOrTable: memories
      dataClass: L3
      source: user_provided
      purpose: source material for grouping related memories
      consentTier: C2
      retentionClass: R3
      exportable: true
      deletable: true
      auditRequired: true
  derivedFields:
    - name: memory_cluster
      collectionOrTable: clusters
      dataClass: L3
      sourceFields:
        - memory_text
        - memory_star_visualization
      purpose: user-facing memory grouping and thematic organization
      consentTier: C2
      retentionClass: R3
      exportable: true
      deletable: true
      explainabilityRequired: true

userRights:
  exportSupported: true
  deletionSupported: true
  consentRevocationSupported: true
  explanationSupported: true

adminAccess:
  allowed: false
  roles: []
  auditEventTypes:
    - cluster.generated
    - cluster.viewed
    - cluster.deleted
    - cluster.explanation_requested

monetization:
  participatesInDataSharing: false
  requiresC8Consent: false
  anonymizationBatchRequired: false
  minimumCohortSize: 100

review:
  reviewer: TBD
  decision: blocked_until_implemented_and_reviewed
  notes: Repo audit marks clusters as stubbed. Cluster generation must not launch until consent, export, deletion, explanation, and audit behavior are implemented and tested.
